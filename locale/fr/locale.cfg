quality-level-cap-combinators-and-speakers=La qualité la plus élevée jusqu'à laquelle Contrôle de Qualité améliorera cette entité. Les valeurs personnalisées utilisent les paramètres Niveau Max Personnalisé A/B/C.\n\nInclut : combinateurs arithmétiques, combinateurs de décision, combinateurs constants, haut-parleurs programmables.
quality-level-cap-defense-walls-and-gates=La qualité la plus élevée jusqu'à laquelle Contrôle de Qualité améliorera cette entité. Les valeurs personnalisées utilisent les paramètres Niveau Max Personnalisé A/B/C.\n\nInclut : murs, portes.
