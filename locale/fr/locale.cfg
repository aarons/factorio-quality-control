upgrade-limit-turrets=Contrôle de Qualité mettra ces entités à niveau jusqu'à cette qualité, puis arrêtera de tenter d'autres mises à niveau. Définissez ceci sur Commun pour empêcher toute tentative de mise à niveau. Les valeurs personnalisées utilisent les paramètres Limite de mise à niveau personnalisée A/B/C.\n\nInclut : tourelles à munitions, tourelles laser, lance-flammes, tourelles d'artillerie.
upgrade-limit-asteroid-collectors=Limite la croissance de qualité des collecteurs d'astéroïdes aux valeurs vanilla pour éviter des problèmes graves.\n\nLes collecteurs d'astéroïdes avec des niveaux de qualité moddés peuvent avoir trop de bras qui se déplacent trop rapidement, devenant incapables de saisir des fragments d'astéroïdes et créant une grande perte de UPS.\n\n[color=green]Par défaut : légendaire[/color]
upgrade-limit-radar=Limite la croissance de qualité des radars afin d'éviter l'exploration excessive de la carte et la surcharge des fichiers de sauvegarde.\n\nLes radars avec des niveaux de qualité très élevés peuvent causer de gros fichiers de sauvegarde (1 200 Mo+) en raison de l'exploration excessive de la carte.\n\n[color=green]Par défaut : légendaire[/color]
upgrade-limit-lightning-rods=Limite la croissance de qualité des attracteurs de foudre pour éviter les problèmes de performance.\n\nLes attracteurs de foudre avec des niveaux de qualité très élevés ont des zones de couverture significativement augmentées, ce qui peut causer des pics de lag la nuit sur Fulgora.\n\n[color=green]Par défaut : légendaire[/color]
upgrade-limit-thrusters=Limite la croissance de qualité des propulseurs spatiaux aux niveaux vanilla pour éviter les problèmes de défense.\n\nLes niveaux de qualité moddés peuvent déplacer les vaisseaux spatiaux significativement plus rapidement, ce qui peut submerger leurs défenses.\n\n[color=green]Par défaut : légendaire[/color]

