[mod-setting-description]
manufacturing-hours-for-change=Le nombre d'heures de fabrication nécessaires pour qu'une tentative de changement de qualité soit effectuée.\nLes heures de fabrication ne s'accumulent que lorsque la machine travaille activement. Si elle est inactive, elle ne progressera pas.\nValeur min 0,001 heure (3,6 secondes), Valeur max 1000 heures.
crafting-speed-affects-progression=Contrôle si la vitesse de fabrication d'une machine influence la vitesse à laquelle elle accumule des heures de fabrication.\n\n[color=green]Activé (par défaut) :[/color] Les machines avec une vitesse de fabrication plus élevée progresseront plus vite. Les heures de fabrication sont acquises en fonction de la vitesse de fabrication et de la productivité de la machine. Une fonderie avec une vitesse de 4 et 50% de productivité progressera six fois plus vite qu'un assembleur-2 avec une vitesse de fabrication de 1.\n\n[color=red]Désactivé :[/color] La vitesse de fabrication n'a aucun impact sur la progression. Une heure passée à fabriquer activement compte comme une heure de fabrication, quelle que soit la vitesse de fabrication. Cela supprime l'effet cumulatif où chaque amélioration de qualité accélère la suivante.
percentage-chance-of-change=Le pourcentage de chance qu'un changement de qualité soit réussi.\nValeur min 0,0001%, Valeur max 100% (toujours changer après le temps écoulé)
quality-increase-cost=Ceci augmente le temps entre les tentatives de changement par niveau de qualité. Il s'agit d'une formule composée. Régler à 0% gardera le temps entre les tentatives identique quel que soit le niveau de qualité\n\n[color=green]Exemple avec 3 heures de fabrication nécessaires à 50% de coût par niveau[/color]\n\nNormal : 3 heures\nPeu commun : 4,5 heures\nRare : 6,8 heures\nÉpique : 10,1 heures\nLégendaire : 15,2 heures\nNiveau de qualité moddé 10 : 173 heures
quality-chance-accumulation-rate=Contrôle combien la chance augmente après chaque tentative échouée.\n\n[color=white]Aucune (Par défaut) :[/color] Pas d'accumulation - la chance reste constante.\n\n[color=white]Faible (20%) :[/color] La chance augmente de 20% du taux de base à chaque échec.\n\n[color=white]Moyenne (50%) :[/color] La chance augmente de 50% du taux de base à chaque échec.\n\n[color=white]Élevée (100%) :[/color] La chance augmente de 100% du taux de base à chaque échec.\n\n[color=yellow]Exemple avec 1% de chance de base :[/color]\n\n[color=white]Faible :[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Élevée :[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nTous les paramètres d'accumulation garantissent finalement des changements de qualité - les paramètres plus élevés atteignent simplement 100% de chance plus rapidement
secondary-progression-rate=La vitesse à laquelle les entités secondaires (inséreurs, poteaux, balises - tout ce qui ne peut pas mesurer son propre travail) progressent, en pourcentage de ce que gagne l'entité primaire moyenne sur la même surface.\n\n[color=green]100% (par défaut) :[/color] Les entités secondaires avancent au même rythme que l'assembleuse, le four, le silo ou la tourelle moyenne autour d'elles.\n\nRéglez à 0% pour arrêter complètement la progression secondaire ; des valeurs supérieures à 100% accélèrent les mises à niveau de l'infrastructure au-delà du rythme des machines de production.\n\nPeut être modifié en cours de partie sans redémarrage.
change-modules-with-entity=Ceci contrôle si les modules dans les machines sont affectés par les changements de qualité.\n\n[color=white]Désactivé (Par défaut) :[/color] Les modules ne sont pas affectés quand la qualité de la machine hôte change.\n\n[color=white]Activé :[/color] Les modules changent de qualité d'un niveau quand leur hôte change. Ils ne dépasseront pas le niveau de qualité de l'hôte.\n\n[color=white]Extra Activé :[/color] Comme Activé, mais les modules seront mis à jour pour correspondre à la qualité de leur machine hôte chaque fois qu'un changement de qualité se produit.
batch-entities-per-tick=Nombre d'entités à traiter chaque tick pour éviter les pics de performance.\nValeur min 1, Valeur max 1000.\nDes valeurs plus élevées peuvent causer des pics de lag mais traitent les entités plus rapidement.
batch-ticks-between-processing=Nombre de ticks à attendre entre les cycles de traitement par lot.\nValeur min 1 tick, Valeur max 6000 ticks (~2,5 minutes).\nDes valeurs plus faibles traitent plus fréquemment mais peuvent impacter les performances.
quality-change-aggregate-alerts-enabled=Afficher les messages de console résumant tous les changements de qualité (affichés une fois toutes les 5 minutes). Exemple : "3 machines d'assemblage améliorées, 2 inséreurs améliorés"
quality-change-entity-alerts-enabled=Afficher les alertes de ping sur carte sur les entités individuelles quand leur qualité change. Cliquez sur l'alerte pour voir l'entité améliorée.
quality_control_skip_hidden_qualities=Contrôle de Qualité ignorera les qualités cachées (par exemple, les variantes brillantes) lors de l'amélioration. Les entités ne deviendront jamais brillantes par Contrôle de Qualité - les joueurs doivent les obtenir de manière normale. Ce paramètre ne s'applique que lorsque vous avez le mod de qualité Shiny Mechanics installé.
quality_control_hidden_qualities_sticky=Les entités avec des qualités cachées (par exemple, brillantes) ne s'amélioreront plus, préservant leurs avantages uniques. Ce paramètre ne s'applique que lorsque vous avez le mod de qualité Shiny Mechanics installé.
enable-accumulators=Activer les changements de qualité pour les accumulateurs.
enable-agricultural-towers=Activer les changements de qualité pour les tours agricoles.
enable-assembly-machines=Activer les changements de qualité pour les machines d'assemblage.
enable-asteroid-collectors=Activer les changements de qualité pour les collecteurs d'astéroïdes.
asteroid-collector-growth-level-limit=Limite la croissance de qualité des collecteurs d'astéroïdes aux valeurs vanilla pour éviter des problèmes graves.\n\nLes collecteurs d'astéroïdes avec des niveaux de qualité moddés peuvent avoir trop de bras qui se déplacent trop rapidement, devenant incapables de saisir des fragments d'astéroïdes et créant une grande perte de UPS.\n\n[color=green]Par défaut : légendaire[/color]
enable-beacons=Activer les changements de qualité pour les balises.
enable-boilers=Activer les changements de qualité pour les chaudières.
enable-combinators-and-speakers=Activer les changements de qualité pour les combinateurs et haut-parleurs.\n\nInclut : combinateurs arithmétiques, combinateurs de décision, combinateurs constants, haut-parleurs programmables.
enable-pumps=Activer les changements de qualité pour les pompes (inclut les pompes offshore et les pompes à fluides).
enable-furnaces=Activer les changements de qualité pour les fourneaux.
enable-generators=Activer les changements de qualité pour les générateurs (machines à vapeur, turbines à vapeur, générateurs à fusion).
enable-heat-pipes=Activer les changements de qualité pour les tuyaux de chaleur.
enable-inserters=Activer les changements de qualité pour les inséreurs.
enable-labs=Activer les changements de qualité pour les laboratoires de recherche.
enable-lamps=Activer les changements de qualité pour les lampes.
enable-lightning-rods=Activer les changements de qualité pour les paratonnerres.
enable-mining-drills=Activer les changements de qualité pour toutes les foreuses.
enable-poles=Activer les changements de qualité pour tous les poteaux électriques (incluant les gros poteaux et les sous-stations).
enable-power-switches=Activer les changements de qualité pour les interrupteurs électriques.
enable-radar=Activer les changements de qualité pour les stations radar.
radar-growth-level-limit=Limite la croissance de qualité des radars afin d'éviter l'exploration excessive de la carte et la surcharge des fichiers de sauvegarde.\n\nLes radars avec des niveaux de qualité très élevés peuvent causer de gros fichiers de sauvegarde (1 200 Mo+) en raison de l'exploration excessive de la carte.\n\n[color=green]Par défaut : légendaire[/color]
lightning-attractor-growth-level-limit=Limite la croissance de qualité des attracteurs de foudre pour éviter les problèmes de performance.\n\nLes attracteurs de foudre avec des niveaux de qualité très élevés ont des zones de couverture significativement augmentées, ce qui peut causer des pics de lag la nuit sur Fulgora.\n\n[color=green]Par défaut : légendaire[/color]
enable-reactors=Activer les changements de qualité pour les réacteurs (réacteurs nucléaires, réacteurs à fusion).
enable-rocket-silos=Activer les changements de qualité pour les silos à fusées.
enable-roboports=Activer les changements de qualité pour les roboports.
enable-solar-panels=Activer les changements de qualité pour les panneaux solaires.
enable-thrusters=Activer les changements de qualité pour les propulseurs spatiaux. Désactivé par défaut car modifier la vitesse d'un vaisseau spatial de manière inattendue peut submerger ses défenses.
thruster-growth-level-limit=Limite la croissance de qualité des propulseurs spatiaux aux niveaux vanilla pour éviter les problèmes de défense.\n\nLes niveaux de qualité moddés peuvent déplacer les vaisseaux spatiaux significativement plus rapidement, ce qui peut submerger leurs défenses.\n\n[color=green]Par défaut : légendaire[/color]
enable-turrets=Activer les changements de qualité pour les tourelles.\n\nLes tourelles sont des entités primaires qui génèrent des crédits d'amélioration basés sur les dégâts cumulés infligés.\n\nInclut : tourelles à munitions, tourelles laser, lance-flammes, tourelles d'artillerie.
turret-damage-per-manufacturing-hour=La quantité de dégâts qu'une tourelle doit infliger pour équivaloir à une heure de fabrication.\n\nPar défaut : 36 000 dégâts (dérivé des munitions perforantes : 450 chargeurs/heure × 80 dégâts/chargeur).\n\nDes valeurs plus faibles font générer des crédits aux tourelles plus rapidement.
turrets-contribute-credits=Contrôle si les crédits d'amélioration gagnés par les tourelles alimentent également la réserve partagée qui améliore les entités secondaires (inserteurs, poteaux électriques, etc.).\n\n[color=red]Désactivé (par défaut) :[/color] Les crédits des tourelles restent avec la tourelle. Les dégâts de combat n'aident les tourelles qu'à s'améliorer elles-mêmes.\n\n[color=green]Activé :[/color] Les crédits des tourelles s'écoulent également vers la réserve partagée, de sorte que les dégâts de combat font progresser les entités secondaires de la même manière que la fabrication.
enable-defense-walls-and-gates=Activer les changements de qualité pour les murs et portes.\n\nInclut : murs, portes.
custom-upgrade-limit-a=Utilisez ceci pour définir des limites personnalisées sur les qualités moddées pour les entités. Nécessaire uniquement si vous avez un mod qui ajoute des niveaux de qualité au-delà de légendaire et que vous voulez limiter la mise à niveau d'une entité. Pour utiliser cette fonctionnalité, définissez le niveau maximum ici, puis allez à l'entité que vous voulez limiter et sélectionnez 'Personnalisé A' dans le menu déroulant. Pour référence, légendaire est le niveau 5 (normal = 1, peu commun = 2, rare = 3, épique = 4, légendaire = 5...).
custom-upgrade-limit-b=Utilisez ceci pour définir des limites personnalisées sur les qualités moddées pour les entités. Nécessaire uniquement si vous avez un mod qui ajoute des niveaux de qualité au-delà de légendaire et que vous voulez limiter la mise à niveau d'une entité. Pour utiliser cette fonctionnalité, définissez le niveau maximum ici, puis allez à l'entité que vous voulez limiter et sélectionnez 'Personnalisé B' dans le menu déroulant. Pour référence, légendaire est le niveau 5 (normal = 1, peu commun = 2, rare = 3, épique = 4, légendaire = 5...).
custom-upgrade-limit-c=Utilisez ceci pour définir des limites personnalisées sur les qualités moddées pour les entités. Nécessaire uniquement si vous avez un mod qui ajoute des niveaux de qualité au-delà de légendaire et que vous voulez limiter la mise à niveau d'une entité. Pour utiliser cette fonctionnalité, définissez le niveau maximum ici, puis allez à l'entité que vous voulez limiter et sélectionnez 'Personnalisé C' dans le menu déroulant. Pour référence, légendaire est le niveau 5 (normal = 1, peu commun = 2, rare = 3, épique = 4, légendaire = 5...).
upgrade-limit-accumulators=Contrôle de Qualité mettra ces entités à niveau jusqu'à cette qualité, puis arrêtera de tenter d'autres mises à niveau. Définissez ceci sur Commun pour empêcher toute tentative de mise à niveau. Les valeurs personnalisées utilisent les paramètres Limite de mise à niveau personnalisée A/B/C.
upgrade-limit-agricultural-towers=Contrôle de Qualité mettra ces entités à niveau jusqu'à cette qualité, puis arrêtera de tenter d'autres mises à niveau. Définissez ceci sur Commun pour empêcher toute tentative de mise à niveau. Les valeurs personnalisées utilisent les paramètres Limite de mise à niveau personnalisée A/B/C.
