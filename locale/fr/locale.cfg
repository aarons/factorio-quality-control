[mod-setting-description]
manufacturing-hours-for-change=Le nombre d'heures de fabrication nécessaires pour qu'une tentative de changement de qualité soit effectuée.\nLes heures de fabrication ne s'accumulent que lorsque la machine travaille activement. Si elle est inactive, elle ne progressera pas.\nValeur min 0,001 heure (3,6 secondes), Valeur max 1000 heures.
crafting-speed-affects-progression=[color=red]Désactivé (par défaut) :[/color] La vitesse de fabrication n'affecte pas la progression, ce qui permet de mieux répartir les améliorations sur une longue partie.\n\n[color=green]Activé :[/color] La vitesse de fabrication et la productivité augmentent les heures de fabrication acquises. Une vitesse de 4 avec 50% de productivité rapporte six fois plus qu'une vitesse de 1 sans bonus de productivité. Les gains de vitesse liés aux améliorations de qualité peuvent se cumuler, entraînant des améliorations très rapides en fin de partie.
percentage-chance-of-change=Chance de réussite d'une tentative d'amélioration.
quality-increase-cost=Augmentation des heures de fabrication nécessaires par niveau de qualité. L'augmentation est composée ; à 0%, le nombre d'heures requis reste identique à tous les niveaux.\n\nÀ 50%, une exigence de 3 heures passe à 4,5 heures pour peu commun et à 6,75 heures pour rare.
quality-chance-accumulation-rate=Augmente la chance d'amélioration après une tentative échouée d'un pourcentage de la chance de base.\n\n[color=white]Aucune :[/color] La chance reste constante.\n[color=white]Faible :[/color] Ajoute 20% de la chance de base.\n[color=white]Moyenne :[/color] Ajoute 50% de la chance de base.\n[color=white]Élevée :[/color] Ajoute 100% de la chance de base.\n\nAvec 1% de chance de base, Faible donne 1% → 1,2% → 1,4%... et Élevée donne 1% → 2% → 3%...
secondary-progression-rate=Vitesse de progression des entités qui ne peuvent pas mesurer leur propre travail, comme les inséreurs, les poteaux et les balises.\n\nÀ 100%, elle correspond aux heures de fabrication moyennes acquises par les entités primaires sur la même surface. Des valeurs plus élevées accélèrent la progression ; 0% la met en pause.
change-modules-with-entity=[color=white]Désactivé :[/color] Les modules ne s'améliorent pas.\n\n[color=white]Activé :[/color] Les modules gagnent un niveau de qualité lorsque leur machine s'améliore, jusqu'à atteindre la qualité de la machine.\n\n[color=white]Extra Activé :[/color] Les modules sont améliorés pour correspondre à la nouvelle qualité de leur machine.\n\n[color=white]Indépendant :[/color] Les modules gagnent leurs propres tentatives d'amélioration grâce à la progression secondaire et peuvent dépasser la limite de qualité de leur machine. Définir la limite de la machine sur Commun désactive aussi l'amélioration des modules.
batch-entities-per-tick=Entités traitées par lot. Des lots plus grands traitent les améliorations plus vite, mais peuvent causer du lag. Les emplacements de modules comptent aussi en mode Indépendant.
batch-ticks-between-processing=Ticks entre les traitements par lot. Des intervalles plus courts traitent les améliorations plus fréquemment, mais peuvent réduire les performances.
quality-change-aggregate-alerts-enabled=Afficher un résumé des améliorations toutes les cinq minutes.
quality-change-entity-alerts-enabled=Afficher des icônes d'alerte sur la carte aux emplacements des améliorations.
quality-change-chat-enabled=Afficher les messages d'amélioration avec les icônes d'entité ou de module, les icônes de qualité et des lettres aux couleurs de l'arc-en-ciel aléatoires.
quality-change-gps-enabled=Afficher un lien de position cliquable et déclencher le ping GPS de Factorio sur la carte pour chaque amélioration. Cliquez sur le lien pour revoir l'emplacement. Ajoute le lien aux messages colorés d'amélioration lorsqu'ils sont activés ; sinon, affiche uniquement le lien. Le ping GPS natif nécessite un lien dans le chat.
quality-change-floating-text-enabled=Afficher un texte d'amélioration montant, de la couleur de la nouvelle qualité.
quality-change-halo-enabled=Afficher un halo grandissant de la couleur de la nouvelle qualité aux emplacements des améliorations.
quality-change-rainbow-enabled=Afficher des anneaux arc-en-ciel grandissants aux emplacements des améliorations.
quality-change-badge-enabled=Afficher l'icône de la nouvelle qualité pendant 4,5 secondes : elle grandit, monte et tourne jusqu'à disparaître.
quality-change-bubbles-enabled=Émettre un flux de petites icônes de la nouvelle qualité qui montent comme des bulles aux emplacements des améliorations.
quality-change-sound-enabled=Jouer le son choisi pour les améliorations sur la surface que vous regardez, y compris en vue à distance.
quality-change-sound=Choisissez un effet de notification, une alarme de haut-parleur, un son de batterie ou un instrument de musique. Les instruments utilisent Note d'instrument / tonique et Comportement des notes. Le son n'est joué que si l'option correspondante est activée, pour les améliorations sur la surface que vous regardez.
quality-change-sound-note=Note fixe ou tonique (tonalité et registre de départ) des motifs musicaux. Ignorée pour les alarmes, batteries, effets et le mode Totalement aléatoire.\nLes notes montent par demi-tons à partir de fa : 1=fa, 3=sol, 5=la, 7=si, 8=do, 10=ré, 12=mi ; ajoutez 12 pour l'octave suivante. Par défaut : 20 (do).\nLe piano possède 48 notes ; les autres instruments en ont 36. Le mode Note fixe se limite à la note disponible la plus haute. Les motifs musicaux sont abaissés par octaves entières si nécessaire, en conservant la tonalité. Les mêmes réglages produisent des motifs équivalents dans le registre propre à chaque instrument.
quality-change-sound-mode=Une note par amélioration audible, avec un motif distinct pour chaque joueur. Note fixe conserve la note choisie ; Promenade musicale avance ou recule d'un ou deux degrés de la gamme ; Carillon choisit des notes aléatoires de la gamme pentatonique majeure ; Escalier monte puis redescend en boucle ; Aléatoire dans la gamme choisit une note dans la gamme et l'étendue choisies ; Totalement aléatoire utilise toute l'étendue de l'instrument.\nPromenade musicale et Escalier commencent à la tonique et reprennent après les périodes de silence et les sauvegardes ou chargements. Aucune note différée n'est mise en attente. Ne concerne que les instruments de musique.
quality-change-sound-scale=Gamme relative à la note d'instrument / tonique, utilisée par Promenade musicale, Escalier et Aléatoire dans la gamme. Chromatique autorise tous les demi-tons. Carillon utilise toujours la gamme pentatonique majeure ; Note fixe et Totalement aléatoire ignorent ce réglage.
quality-change-sound-range=Une ou deux octaves à partir de la tonique, abaissées par octaves entières si nécessaire pour convenir à l'instrument ; ou toute l'étendue de l'instrument. S'applique à Promenade musicale, Carillon, Escalier et Aléatoire dans la gamme. Note fixe et Totalement aléatoire ignorent ce réglage.
quality_control_skip_hidden_qualities=Ignorer les qualités cachées (par exemple, les variantes brillantes) lors de l'amélioration. Ce paramètre ne s'applique que si vous avez installé un mod comme Shiny Mechanics.
quality_control_hidden_qualities_sticky==Les entités avec des qualités cachées (par exemple, brillantes) ne s'amélioreront plus, préservant leurs avantages uniques. Ce paramètre ne s'applique que si vous avez installé un mod comme Shiny Mechanics.
enable-accumulators=Activer les améliorations pour les accumulateurs.
enable-agricultural-towers=Activer les améliorations pour les tours agricoles.
enable-assembly-machines=Activer les améliorations pour les machines d'assemblage.
enable-asteroid-collectors=Activer les améliorations pour les collecteurs d'astéroïdes.
asteroid-collector-growth-level-limit=Limite la croissance de qualité des collecteurs d'astéroïdes aux valeurs vanilla pour éviter des problèmes graves.\n\nLes collecteurs d'astéroïdes avec des niveaux de qualité moddés peuvent avoir trop de bras qui se déplacent trop rapidement, devenant incapables de saisir des fragments d'astéroïdes et créant une grande perte de UPS.\n\n[color=green]Par défaut : légendaire[/color]
enable-beacons=Activer les améliorations pour les balises.
enable-boilers=Activer les améliorations pour les chaudières.
enable-combinators-and-speakers=Activer les améliorations pour les combinateurs et les haut-parleurs programmables.
enable-pumps=Activer les améliorations pour les pompes offshore et les pompes à fluide.
enable-furnaces=Activer les améliorations pour les fourneaux.
enable-generators=Activer les améliorations pour les machines à vapeur, les turbines à vapeur et les générateurs à fusion.
enable-heat-pipes=Activer les améliorations pour les tuyaux de chaleur.
enable-inserters=Activer les améliorations pour les inséreurs.
enable-labs=Activer les améliorations pour les laboratoires de recherche.
enable-lamps=Activer les améliorations pour les lampes.
enable-lightning-rods=Activer les améliorations pour les paratonnerres.
enable-mining-drills=Activer les améliorations pour les foreuses.
enable-poles=Activer les améliorations pour les poteaux électriques et les sous-stations.
enable-power-switches=Activer les améliorations pour les interrupteurs électriques.
enable-radar=Activer les améliorations pour les stations radar.
radar-growth-level-limit=Limite la croissance de qualité des radars afin d'éviter l'exploration excessive de la carte et la surcharge des fichiers de sauvegarde.\n\nLes radars avec des niveaux de qualité très élevés peuvent causer de gros fichiers de sauvegarde (1 200 Mo+) en raison de l'exploration excessive de la carte.\n\n[color=green]Par défaut : légendaire[/color]
lightning-attractor-growth-level-limit=Limite la croissance de qualité des attracteurs de foudre pour éviter les problèmes de performance.\n\nLes attracteurs de foudre avec des niveaux de qualité très élevés ont des zones de couverture significativement augmentées, ce qui peut causer des pics de lag la nuit sur Fulgora.\n\n[color=green]Par défaut : légendaire[/color]
enable-reactors=Activer les améliorations pour les réacteurs nucléaires et à fusion.
enable-rocket-silos=Activer les améliorations pour les silos à fusées.
enable-roboports=Activer les améliorations pour les roboports.
enable-solar-panels=Activer les améliorations pour les panneaux solaires.
enable-thrusters=Activer les améliorations pour les propulseurs spatiaux. Des vaisseaux plus rapides peuvent submerger leurs défenses.
thruster-growth-level-limit=Permet de limiter les propulseurs spatiaux aux niveaux vanilla. Les niveaux de qualité moddés peuvent accélérer considérablement les vaisseaux spatiaux, ce qui peut submerger leurs défenses.
enable-turrets=Activer les améliorations pour les tourelles à munitions, laser, lance-flammes et d'artillerie. Les tourelles gagnent des « heures de fabrication » en infligeant des dégâts.
turret-damage-per-manufacturing-hour=Quantité de dégâts qu'une tourelle doit infliger pour gagner une heure de fabrication.\n\nPar défaut : 36 000 dégâts (calculé à partir de la quantité de munitions perforantes qu'une machine d'assemblage de base peut produire en une heure).
turrets-contribute-credits=Permettre aux tourelles de contribuer aux améliorations des entités secondaires, comme les inséreurs et les poteaux électriques, sur la même surface. Cela peut fortement accélérer les améliorations en fin de partie avec les canons électromagnétiques et les tourelles électriques.
enable-defense-walls-and-gates=Activer les améliorations pour les murs et les portes.
custom-upgrade-limit-a=Niveau de qualité maximum utilisé par le réglage « Personnalisé A » dans les limites ci-dessous. Nécessaire uniquement si un mod ajoute des niveaux de qualité au-delà de légendaire et que vous voulez limiter l'amélioration d'une entité, par exemple pour permettre aux collecteurs d'astéroïdes d'atteindre le niveau 10. Définissez le niveau maximum ici, puis sélectionnez « Personnalisé A » dans le menu déroulant de l'entité à limiter. Pour référence, légendaire est le niveau 5.
custom-upgrade-limit-b=Niveau de qualité maximum utilisé par Personnalisé B dans les paramètres de limite d'amélioration.
custom-upgrade-limit-c=Niveau de qualité maximum utilisé par Personnalisé C dans les paramètres de limite d'amélioration.
upgrade-limit-accumulators=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-agricultural-towers=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-assembly-machines=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-beacons=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-boilers=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-combinators-and-speakers=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.\n\nInclut : combinateurs arithmétiques, combinateurs de décision, combinateurs constants, haut-parleurs programmables.
upgrade-limit-defense-walls-and-gates=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-furnaces=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-generators=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.\n\nInclut : machines à vapeur, turbines à vapeur, générateurs à fusion.
upgrade-limit-heat-pipes=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-inserters=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-labs=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-lamps=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-mining-drills=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-poles=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.\n\nInclut les poteaux électriques et les sous-stations.
upgrade-limit-power-switches=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-pumps=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.\n\nInclut : pompes offshore et pompes à fluide.
upgrade-limit-reactors=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.\n\nInclut : réacteurs nucléaires, réacteurs à fusion.
upgrade-limit-rocket-silos=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-roboports=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-solar-panels=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.
upgrade-limit-turrets=Qualité maximale d'amélioration de ces entités. Commun désactive les améliorations ; Personnalisé A/B/C utilise le niveau personnalisé indiqué ci-dessus.\n\nInclut : tourelles à munitions, tourelles laser, lance-flammes, tourelles d'artillerie.
upgrade-limit-asteroid-collectors=Limiter les collecteurs d'astéroïdes à légendaire pour éviter des problèmes graves. Les niveaux moddés peuvent créer trop de bras qui se déplacent trop vite, deviennent incapables de saisir des fragments d'astéroïdes et entraînent une forte perte d'UPS.
upgrade-limit-radar=Limiter les radars à légendaire pour éviter de trop augmenter la taille des sauvegardes. Les qualités moddées peuvent entraîner une exploration excessive de la carte et produire des fichiers très volumineux (plus d'un gigaoctet).
upgrade-limit-lightning-rods=Limiter les attracteurs de foudre à légendaire pour éviter les pics d'UPS. Les niveaux de qualité moddés augmentent considérablement leur zone de couverture, ce qui peut causer des pics de lag la nuit sur Fulgora.
upgrade-limit-thrusters=Limiter les propulseurs spatiaux à légendaire pour éviter des dégâts inattendus aux plateformes spatiales. Les niveaux de qualité moddés peuvent accélérer considérablement les vaisseaux spatiaux, ce qui peut submerger leurs défenses.

