upgrade-limit-power-switches=Kiểm Soát Chất Lượng sẽ nâng cấp các thực thể này đến mức chất lượng này, sau đó ngừng thử nâng cấp thêm. Đặt thành Thường để ngăn chặn mọi nỗ lực nâng cấp. Các giá trị tùy chỉnh sử dụng cài đặt Giới hạn nâng cấp tùy chỉnh A/B/C.
