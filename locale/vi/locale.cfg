[mod-setting-description]
manufacturing-hours-for-change=Số giờ sản xuất cần thiết để thử thực hiện thay đổi chất lượng.\nGiờ sản xuất chỉ được tích lũy khi máy đang hoạt động. Nếu máy ở trạng thái nhàn rỗi, nó sẽ không tiến triển.\nGiá trị tối thiểu 0.001 giờ (3.6 giây), Giá trị tối đa 1000 giờ.
crafting-speed-affects-progression=Điều khiển việc tốc độ chế tạo của máy có ảnh hưởng đến tốc độ tích lũy giờ sản xuất hay không.\n\n[color=green]Bật (mặc định):[/color] Máy có tốc độ chế tạo cao hơn sẽ tiến triển nhanh hơn. Giờ sản xuất được tích lũy dựa trên tốc độ chế tạo và năng suất của máy. Một lò đúc (foundry) với tốc độ 4 và năng suất 50% sẽ tiến triển nhanh gấp sáu lần so với máy lắp ráp cấp 2 (assembler-2) với tốc độ chế tạo 1.\n\n[color=red]Tắt:[/color] Tốc độ chế tạo không ảnh hưởng đến tiến trình. Một giờ chế tạo tích cực được tính là một giờ sản xuất, bất kể tốc độ chế tạo. Điều này loại bỏ hiệu ứng cộng dồn khi mỗi lần nâng cấp chất lượng làm tăng tốc lần nâng cấp tiếp theo.
percentage-chance-of-change=Tỷ lệ phần trăm thay đổi chất lượng thành công.\nGiá trị tối thiểu 0.0001%, Giá trị tối đa 100% (luôn thay đổi sau khi thời gian trôi qua)
quality-increase-cost=Điều này tăng thời gian giữa các lần thử thay đổi theo mức chất lượng. Đây là công thức tích lũy. Đặt thành 0% sẽ giữ thời gian giữa các lần thử không đổi bất kể mức chất lượng\n\n[color=green]Ví dụ với 3 giờ sản xuất cần thiết với chi phí 50% mỗi cấp[/color]\n\nThường: 3 giờ\nKhông phổ biến: 4.5 giờ\nHiếm: 6.8 giờ\nSử thi: 10.1 giờ\nHuyền thoại: 15.2 giờ\nChất lượng mod cấp 10: 173 giờ
quality-chance-accumulation-rate=Kiểm soát mức tăng cơ hội sau mỗi lần thử thất bại.\n\n[color=white]Không (Mặc định):[/color] Không tích lũy - cơ hội giữ nguyên.\n\n[color=white]Thấp (20%):[/color] Cơ hội tăng 20% tỷ lệ cơ bản mỗi lần thất bại.\n\n[color=white]Trung bình (50%):[/color] Cơ hội tăng 50% tỷ lệ cơ bản mỗi lần thất bại.\n\n[color=white]Cao (100%):[/color] Cơ hội tăng 100% tỷ lệ cơ bản mỗi lần thất bại.\n\n[color=yellow]Ví dụ với cơ hội cơ bản 1%:[/color]\n\n[color=white]Thấp:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]Cao:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nTất cả cài đặt tích lũy cuối cùng đều đảm bảo thay đổi chất lượng - cài đặt cao hơn chỉ đạt 100% cơ hội nhanh hơn
secondary-progression-rate=Tốc độ tiến triển của các thực thể phụ (tay máy, cột điện, beacon - bất cứ thứ gì không thể tự đo lường công việc của mình), tính theo phần trăm so với mức trung bình mà thực thể chính trên cùng bề mặt đạt được.\n\n[color=green]100% (mặc định):[/color] Các thực thể phụ tiến triển với tốc độ ngang bằng với máy lắp ráp, lò nung, silo, hoặc tháp pháo trung bình xung quanh chúng.\n\nĐặt thành 0% để dừng hoàn toàn tiến trình phụ; giá trị trên 100% sẽ tăng tốc nâng cấp cơ sở hạ tầng vượt quá tốc độ của các máy sản xuất.\n\nCó thể thay đổi giữa ván chơi mà không cần khởi động lại.
change-modules-with-entity=Điều này kiểm soát việc module trong máy có bị ảnh hưởng bởi thay đổi chất lượng hay không.\n\n[color=white]Bị tắt (Mặc định):[/color] Module không bị ảnh hưởng khi chất lượng của máy chủ thay đổi.\n\n[color=white]Được bật:[/color] Module thay đổi chất lượng lên một bậc khi chủ của chúng thay đổi. Chúng sẽ không vượt quá mức chất lượng của máy chủ.\n\n[color=white]Bật thêm:[/color] Giống như Được bật, nhưng module sẽ được cập nhật khớp với chất lượng máy chủ bất cứ khi nào có thay đổi chất lượng.
batch-entities-per-tick=Số thực thể xử lý mỗi tick để tránh lag đột biến.\nGiá trị tối thiểu 1, Giá trị tối đa 1000.\nGiá trị cao hơn có thể gây lag đột biến nhưng xử lý thực thể nhanh hơn.
batch-ticks-between-processing=Số tick chờ giữa các chu kỳ xử lý theo lô.\nGiá trị tối thiểu 1 tick, Giá trị tối đa 6000 tick (~2.5 phút).\nGiá trị thấp hơn xử lý thường xuyên hơn nhưng có thể ảnh hưởng hiệu suất.
quality-change-aggregate-alerts-enabled=Hiển thị thông báo console tóm tắt tất cả thay đổi chất lượng (hiển thị mỗi 5 phút một lần). Ví dụ: "3 máy lắp ráp được nâng cấp, 2 cần gắp được nâng cấp"
quality-change-entity-alerts-enabled=Hiển thị cảnh báo ping bản đồ trên từng thực thể khi chất lượng của chúng thay đổi. Nhấp vào cảnh báo để xem thực thể được nâng cấp.
quality_control_skip_hidden_qualities=Kiểm Soát Chất Lượng sẽ bỏ qua các chất lượng ẩn (ví dụ: biến thể shiny) khi nâng cấp. Các thực thể sẽ không bao giờ trở thành shiny thông qua Kiểm Soát Chất Lượng - người chơi phải có được chúng theo cách thông thường. Cài đặt này chỉ áp dụng khi bạn đã cài đặt mod chất lượng Shiny Mechanics.
quality_control_hidden_qualities_sticky=Các thực thể có chất lượng ẩn (ví dụ: shiny) sẽ không nâng cấp thêm nữa, bảo tồn lợi ích độc đáo của chúng. Cài đặt này chỉ áp dụng khi bạn đã cài đặt mod chất lượng Shiny Mechanics.
enable-accumulators=Bật thay đổi chất lượng cho bộ tích điện.
enable-agricultural-towers=Bật thay đổi chất lượng cho tháp nông nghiệp.
enable-assembly-machines=Bật thay đổi chất lượng cho máy lắp ráp.
enable-asteroid-collectors=Bật thay đổi chất lượng cho bộ thu thập tiểu hành tinh.
asteroid-collector-growth-level-limit=Giới hạn tăng trưởng chất lượng bộ thu thập tiểu hành tinh theo giá trị vanilla để ngăn chặn các vấn đề phá game.\n\nBộ thu thập tiểu hành tinh với các cấp chất lượng được mod có thể có quá nhiều cánh tay di chuyển quá nhanh, không thể lấy được các mảnh tiểu hành tinh và tạo ra lượng UPS tiêu tốn lớn.\n\n[color=green]Mặc định: huyền thoại[/color]
enable-beacons=Bật thay đổi chất lượng cho đèn hiệu.
enable-boilers=Bật thay đổi chất lượng cho nồi hơi.
enable-combinators-and-speakers=Bật thay đổi chất lượng cho bộ kết hợp và loa.\n\nBao gồm: bộ kết hợp số học, bộ kết hợp quyết định, bộ kết hợp hằng số, loa có thể lập trình.
enable-pumps=Bật thay đổi chất lượng cho máy bơm (bao gồm máy bơm ngoài khơi và máy bơm chất lỏng).
enable-furnaces=Bật thay đổi chất lượng cho lò nung.
enable-generators=Bật thay đổi chất lượng cho máy phát điện (động cơ hơi nước, tua bin hơi nước, máy phát điện nhiệt hạch).
enable-heat-pipes=Bật thay đổi chất lượng cho ống dẫn nhiệt.
enable-inserters=Bật thay đổi chất lượng cho cần gắp.
enable-labs=Bật thay đổi chất lượng cho phòng thí nghiệm.
enable-lamps=Bật thay đổi chất lượng cho đèn chiếu sáng.
enable-lightning-rods=Bật thay đổi chất lượng cho cột thu sét.
enable-mining-drills=Bật thay đổi chất lượng cho tất cả máy khoan khai thác.
enable-poles=Bật thay đổi chất lượng cho tất cả cột điện (bao gồm cột điện lớn và trạm biến áp).
enable-power-switches=Bật thay đổi chất lượng cho công tắc điện.
enable-radar=Bật thay đổi chất lượng cho trạm radar.
radar-growth-level-limit=Giới hạn tăng trưởng chất lượng radar để ngăn chặn khám phá bản đồ quá mức và làm tăng kích thước file lưu.\n\nRadar có mức chất lượng rất cao có thể gây ra file lưu lớn (1.200mb+) do khám phá bản đồ quá mức.\n\n[color=green]Mặc định: huyền thoại[/color]
lightning-attractor-growth-level-limit=Giới hạn tăng trưởng chất lượng cột thu sét để ngăn chặn các vấn đề hiệu suất.\n\nCột thu sét có mức chất lượng rất cao có vùng phủ sóng tăng lên đáng kể, điều này có thể gây lag đột biến vào ban đêm trên Fulgora.\n\n[color=green]Mặc định: huyền thoại[/color]
enable-reactors=Bật thay đổi chất lượng cho lò phản ứng (lò phản ứng hạt nhân, lò phản ứng nhiệt hạch).
enable-rocket-silos=Bật thay đổi chất lượng cho hầm phóng tên lửa.
enable-roboports=Bật thay đổi chất lượng cho cảng robot.
enable-solar-panels=Bật thay đổi chất lượng cho tấm pin mặt trời.
enable-thrusters=Bật thay đổi chất lượng cho động cơ đẩy không gian. Mặc định bị tắt vì việc thay đổi tốc độ tàu vũ trụ bất ngờ có thể khiến hệ thống phòng thủ bị áp đảo.
thruster-growth-level-limit=Giới hạn tăng trưởng chất lượng động cơ đẩy không gian theo cấp vanilla để ngăn chặn các vấn đề phòng thủ.\n\nCác cấp chất lượng được mod có thể làm tàu vũ trụ di chuyển nhanh hơn đáng kể, có thể áp đảo hệ thống phòng thủ của chúng.\n\n[color=green]Mặc định: huyền thoại[/color]
enable-turrets=Bật thay đổi chất lượng cho tháp pháo.\n\nTháp pháo là thực thể chính tạo tín dụng nâng cấp dựa trên tổng sát thương đã gây ra.\n\nBao gồm: tháp pháo đạn, tháp pháo laser, súng phun lửa, tháp pháo pháo binh.
turret-damage-per-manufacturing-hour=Lượng sát thương mà tháp pháo phải gây ra để tương đương một giờ sản xuất.\n\nMặc định: 36.000 sát thương (dựa trên đạn xuyên giáp: 450 hộp đạn/giờ × 80 sát thương/hộp đạn).\n\nGiá trị thấp hơn giúp tháp pháo tạo tín dụng nhanh hơn.
turrets-contribute-credits=Kiểm soát việc tín dụng nâng cấp mà súng máy kiếm được có đồng thời cấp cho đồng hồ tiến trình của bề mặt hay không, đồng hồ này giúp nâng cấp các thực thể phụ (tay cần, cột điện, v.v.).\n\n[color=red]Tắt (mặc định):[/color] Tín dụng của súng máy chỉ ở lại với súng máy đó. Sát thương chiến đấu chỉ giúp súng máy tự nâng cấp bản thân, và súng máy không được tính vào mức tiến trình trung bình của bề mặt.\n\n[color=green]Bật:[/color] Tín dụng của súng máy cũng cấp cho đồng hồ tiến trình của bề mặt, nhờ đó sát thương chiến đấu giúp các thực thể phụ tiến triển theo cách tương tự như sản xuất.
enable-defense-walls-and-gates=Bật thay đổi chất lượng cho tường và cổng.\n\nBao gồm: tường, cổng.
custom-upgrade-limit-a=Dùng để đặt giới hạn tùy chỉnh cho các chất lượng được mod thêm vào của thực thể. Chỉ cần thiết khi bạn có mod bổ sung các mức chất lượng vượt quá huyền thoại và bạn muốn giới hạn mức độ nâng cấp của thực thể. Để sử dụng tính năng này, hãy đặt mức tối đa tại đây, sau đó tìm đến thực thể bạn muốn giới hạn và chọn 'Custom A' trong danh sách thả xuống. Để tham khảo, huyền thoại là cấp 5 (thường = 1, không phổ biến = 2, hiếm = 3, sử thi = 4, huyền thoại = 5...).
custom-upgrade-limit-b=Dùng để đặt giới hạn tùy chỉnh cho các chất lượng được mod thêm vào của thực thể. Chỉ cần thiết khi bạn có mod bổ sung các mức chất lượng vượt quá huyền thoại và bạn muốn giới hạn mức độ nâng cấp của thực thể. Để sử dụng tính năng này, hãy đặt mức tối đa tại đây, sau đó tìm đến thực thể bạn muốn giới hạn và chọn 'Custom B' trong danh sách thả xuống. Để tham khảo, huyền thoại là cấp 5 (thường = 1, không phổ biến = 2, hiếm = 3, sử thi = 4, huyền thoại = 5...).
custom-upgrade-limit-c=Dùng để đặt giới hạn tùy chỉnh cho các chất lượng được mod thêm vào của thực thể. Chỉ cần thiết khi bạn có mod bổ sung các mức chất lượng vượt quá huyền thoại và bạn muốn giới hạn mức độ nâng cấp của thực thể. Để sử dụng tính năng này, hãy đặt mức tối đa tại đây, sau đó tìm đến thực thể bạn muốn giới hạn và chọn 'Custom C' trong danh sách thả xuống. Để tham khảo, huyền thoại là cấp 5 (thường = 1, không phổ biến = 2, hiếm = 3, sử thi = 4, huyền thoại = 5...).
upgrade-limit-accumulators=Kiểm Soát Chất Lượng sẽ nâng cấp các thực thể này đến mức chất lượng này, sau đó ngừng thử nâng cấp thêm. Đặt thành Thường để ngăn chặn mọi nỗ lực nâng cấp. Các giá trị tùy chỉnh sử dụng cài đặt Giới hạn nâng cấp tùy chỉnh A/B/C.
upgrade-limit-agricultural-towers=Kiểm Soát Chất Lượng sẽ nâng cấp các thực thể này đến mức chất lượng này, sau đó ngừng thử nâng cấp thêm. Đặt thành Thường để ngăn chặn mọi nỗ lực nâng cấp. Các giá trị tùy chỉnh sử dụng cài đặt Giới hạn nâng cấp tùy chỉnh A/B/C.
