[mod-setting-description]
manufacturing-hours-for-change=Số giờ sản xuất cần thiết để thử thực hiện thay đổi chất lượng.\nGiờ sản xuất chỉ được tích lũy khi máy đang hoạt động. Nếu máy ở trạng thái nhàn rỗi, nó sẽ không tiến triển.\nGiá trị tối thiểu 0.001 giờ (3.6 giây), Giá trị tối đa 1000 giờ.
crafting-speed-affects-progression=[color=green]Bật:[/color] Tốc độ chế tạo và năng suất làm tăng số giờ sản xuất tích lũy được. Tốc độ 4 với năng suất 50% tích lũy nhanh gấp sáu lần tốc độ 1 không có thưởng năng suất.\n\n[color=red]Tắt:[/color] Tốc độ chế tạo không ảnh hưởng đến tiến trình.
percentage-chance-of-change=Tỷ lệ thành công của một lần thử nâng cấp.
quality-increase-cost=Mức tăng số giờ sản xuất cần thiết theo mỗi mức chất lượng. Mức tăng được tính tích lũy; 0% giữ yêu cầu không đổi ở mọi mức.\n\nVới 50%, yêu cầu 3 giờ sẽ thành 4.5 giờ ở mức không phổ biến và 6.75 giờ ở mức hiếm.
quality-chance-accumulation-rate=Tăng cơ hội nâng cấp sau mỗi lần thử thất bại theo tỷ lệ phần trăm của cơ hội cơ bản.\n\n[color=white]Không:[/color] Cơ hội giữ nguyên.\n[color=white]Thấp:[/color] Thêm 20% cơ hội cơ bản.\n[color=white]Trung bình:[/color] Thêm 50% cơ hội cơ bản.\n[color=white]Cao:[/color] Thêm 100% cơ hội cơ bản.\n\nVới cơ hội cơ bản 1%, mức Thấp cho 1% → 1.2% → 1.4%... và mức Cao cho 1% → 2% → 3%...
secondary-progression-rate=Tốc độ tiến triển của các thực thể không thể tự đo lường công việc, như cần gắp, cột điện và đèn hiệu.\n\n100% tương ứng với số giờ sản xuất trung bình mà các thực thể chính trên cùng bề mặt tích lũy được. Giá trị cao hơn tăng tốc tiến trình; 0% tạm dừng tiến trình.
change-modules-with-entity=[color=white]Bị tắt:[/color] Module không được nâng cấp.\n\n[color=white]Được bật:[/color] Module nâng một bậc khi máy được nâng cấp, tối đa đến chất lượng của máy.\n\n[color=white]Bật thêm:[/color] Module được nâng cấp để khớp với chất lượng mới của máy.\n\n[color=white]Độc lập:[/color] Module nhận các lần thử nâng cấp riêng từ tiến trình phụ và có thể vượt giới hạn chất lượng của máy. Đặt giới hạn của máy thành Thường cũng tắt nâng cấp module.
batch-entities-per-tick=Số thực thể được xử lý mỗi lô. Lô lớn hơn xử lý nâng cấp nhanh hơn nhưng có thể gây lag. Các ô module cũng được tính trong chế độ Độc lập.
batch-ticks-between-processing=Số tick giữa các lần xử lý theo lô. Khoảng chờ ngắn hơn xử lý nâng cấp thường xuyên hơn nhưng có thể giảm hiệu suất.
quality-change-aggregate-alerts-enabled=Hiển thị thông báo console tóm tắt các nâng cấp mỗi 5 phút.
quality-change-entity-alerts-enabled=Hiển thị biểu tượng cảnh báo trên bản đồ tại vị trí nâng cấp.
quality-change-chat-enabled=Hiển thị thông báo nâng cấp với biểu tượng thực thể hoặc module, biểu tượng chất lượng và chữ có màu cầu vồng ngẫu nhiên.
quality-change-gps-enabled=Hiển thị liên kết vị trí có thể nhấp và kích hoạt ping GPS trên bản đồ của Factorio cho mỗi lần nâng cấp. Nhấp vào liên kết để xem lại vị trí. Khi bật thông báo chat nhiều màu, liên kết được thêm vào thông báo; nếu không, chỉ liên kết được hiển thị. Ping GPS gốc yêu cầu liên kết trong chat.
quality-change-floating-text-enabled=Hiển thị chữ nâng cấp bay lên với màu của chất lượng mới.
quality-change-halo-enabled=Hiển thị quầng sáng mở rộng với màu của chất lượng mới tại vị trí nâng cấp.
quality-change-rainbow-enabled=Hiển thị các vòng cầu vồng mở rộng tại vị trí nâng cấp.
quality-change-badge-enabled=Hiển thị biểu tượng chất lượng mới lớn dần và bay lên trong 4.5 giây, xoay liên tục cho đến khi biến mất.
quality-change-bubbles-enabled=Phát ra một dòng biểu tượng nhỏ của chất lượng mới bay lên như bong bóng tại vị trí nâng cấp.
quality-change-sound-enabled=Phát âm thanh đã chọn khi nâng cấp trên bề mặt bạn đang xem, kể cả trong chế độ xem từ xa.
quality-change-sound=Chọn hiệu ứng thông báo, âm báo của loa, tiếng trống hoặc nhạc cụ. Nhạc cụ sử dụng cài đặt Nốt Nhạc Cụ / Nốt Gốc và Cách Phát Nốt. Chỉ phát khi bật âm thanh nâng cấp, cho các nâng cấp trên bề mặt bạn đang xem.
quality-change-sound-note=Nốt cố định hoặc nốt gốc (giọng và quãng bắt đầu) cho các mẫu nhạc. Không áp dụng cho âm báo, trống, hiệu ứng và chế độ Hoàn toàn ngẫu nhiên.\nCác nốt tăng theo nửa cung từ F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; cộng 12 để lên quãng tám tiếp theo. Mặc định: 20 (C).\nPiano có 48 nốt; các nhạc cụ khác có 36 nốt. Chế độ cố định giới hạn ở nốt cao nhất có thể phát. Các mẫu nhạc được hạ theo từng quãng tám khi cần để vừa âm vực mà vẫn giữ nguyên giọng. Cùng một cài đặt tạo ra các mẫu tương đương trong âm vực riêng của mỗi nhạc cụ.
quality-change-sound-mode=Phát một nốt cho mỗi lần nâng cấp nghe được, với mẫu riêng cho từng người chơi. Nốt cố định giữ nguyên nốt đã chọn; Dạo nhạc di chuyển một hoặc hai bậc âm giai; Chuông gió chọn ngẫu nhiên các nốt trong âm giai ngũ cung trưởng; Bậc thang liên tục đi lên rồi đi xuống; Ngẫu nhiên trong âm giai chọn bất kỳ nốt nào trong âm giai và âm vực đã chọn; Hoàn toàn ngẫu nhiên dùng toàn bộ âm vực của nhạc cụ.\nDạo nhạc và Bậc thang bắt đầu từ nốt gốc và tiếp tục sau thời gian im lặng hoặc lưu/tải trò chơi. Không có nốt phát trễ nào được xếp hàng. Chỉ ảnh hưởng đến nhạc cụ.
quality-change-sound-scale=Âm giai tính từ Nốt Nhạc Cụ / Nốt Gốc, được dùng bởi Dạo nhạc, Bậc thang và Ngẫu nhiên trong âm giai. Âm giai bán cung cho phép mọi nửa cung. Chuông gió luôn dùng ngũ cung trưởng; Nốt cố định và Hoàn toàn ngẫu nhiên bỏ qua cài đặt này.
quality-change-sound-range=Một hoặc hai quãng tám bắt đầu từ nốt gốc, được hạ theo từng quãng tám nếu cần để vừa âm vực nhạc cụ; hoặc toàn bộ âm vực nhạc cụ. Áp dụng cho Dạo nhạc, Chuông gió, Bậc thang và Ngẫu nhiên trong âm giai. Nốt cố định và Hoàn toàn ngẫu nhiên bỏ qua cài đặt này.
quality_control_skip_hidden_qualities=Bỏ qua các chất lượng ẩn (như biến thể shiny) khi nâng cấp. Cài đặt này chỉ áp dụng khi bạn đã cài đặt mod như Shiny Mechanics.
quality_control_hidden_qualities_sticky==Các thực thể có chất lượng ẩn (ví dụ: shiny) sẽ không nâng cấp thêm nữa, bảo tồn lợi ích độc đáo của chúng. Cài đặt này chỉ áp dụng khi bạn đã cài đặt mod như Shiny Mechanics.
enable-accumulators=Bật nâng cấp cho bộ tích điện.
enable-agricultural-towers=Bật nâng cấp cho tháp nông nghiệp.
enable-assembly-machines=Bật nâng cấp cho máy lắp ráp.
enable-asteroid-collectors=Bật nâng cấp cho bộ thu thập tiểu hành tinh.
asteroid-collector-growth-level-limit=Giới hạn tăng trưởng chất lượng bộ thu thập tiểu hành tinh theo giá trị vanilla để ngăn chặn các vấn đề phá game.\n\nBộ thu thập tiểu hành tinh với các cấp chất lượng được mod có thể có quá nhiều cánh tay di chuyển quá nhanh, không thể lấy được các mảnh tiểu hành tinh và tạo ra lượng UPS tiêu tốn lớn.\n\n[color=green]Mặc định: huyền thoại[/color]
enable-beacons=Bật nâng cấp cho đèn hiệu.
enable-boilers=Bật nâng cấp cho nồi hơi.
enable-combinators-and-speakers=Bật nâng cấp cho bộ kết hợp và loa có thể lập trình.
enable-pumps=Bật nâng cấp cho máy bơm ngoài khơi và máy bơm chất lỏng.
enable-furnaces=Bật nâng cấp cho lò nung.
enable-generators=Bật nâng cấp cho động cơ hơi nước, tua bin hơi nước và máy phát điện nhiệt hạch.
enable-heat-pipes=Bật nâng cấp cho ống dẫn nhiệt.
enable-inserters=Bật nâng cấp cho cần gắp.
enable-labs=Bật nâng cấp cho phòng thí nghiệm.
enable-lamps=Bật nâng cấp cho đèn chiếu sáng.
enable-lightning-rods=Bật nâng cấp cho cột thu sét.
enable-mining-drills=Bật nâng cấp cho máy khoan khai thác.
enable-poles=Bật nâng cấp cho cột điện và trạm biến áp.
enable-power-switches=Bật nâng cấp cho công tắc điện.
enable-radar=Bật nâng cấp cho trạm radar.
radar-growth-level-limit=Giới hạn tăng trưởng chất lượng radar để ngăn chặn khám phá bản đồ quá mức và làm tăng kích thước file lưu.\n\nRadar có mức chất lượng rất cao có thể gây ra file lưu lớn (1.200mb+) do khám phá bản đồ quá mức.\n\n[color=green]Mặc định: huyền thoại[/color]
lightning-attractor-growth-level-limit=Giới hạn tăng trưởng chất lượng cột thu sét để ngăn chặn các vấn đề hiệu suất.\n\nCột thu sét có mức chất lượng rất cao có vùng phủ sóng tăng lên đáng kể, điều này có thể gây lag đột biến vào ban đêm trên Fulgora.\n\n[color=green]Mặc định: huyền thoại[/color]
enable-reactors=Bật nâng cấp cho lò phản ứng hạt nhân và nhiệt hạch.
enable-rocket-silos=Bật nâng cấp cho hầm phóng tên lửa.
enable-roboports=Bật nâng cấp cho cảng robot.
enable-solar-panels=Bật nâng cấp cho tấm pin mặt trời.
enable-thrusters=Bật nâng cấp cho động cơ đẩy không gian. Tàu di chuyển nhanh hơn có thể khiến hệ thống phòng thủ bị áp đảo.
thruster-growth-level-limit=Tùy chọn giới hạn động cơ đẩy không gian ở các cấp vanilla. Các cấp chất lượng được mod có thể làm tàu vũ trụ di chuyển nhanh hơn đáng kể, khiến hệ thống phòng thủ bị áp đảo.
enable-turrets=Bật nâng cấp cho tháp pháo đạn, laser, phun lửa và pháo binh. Tháp pháo tích lũy 'giờ sản xuất' bằng cách gây sát thương.
turret-damage-per-manufacturing-hour=Lượng sát thương mà tháp pháo phải gây ra để tích lũy một giờ sản xuất.\n\nMặc định: 36.000 sát thương (dựa trên tháp pháo cấp cơ bản bắn đạn xuyên giáp liên tục trong một giờ).
turrets-contribute-credits=Cho phép tháp pháo đóng góp vào việc nâng cấp các thực thể phụ trên cùng bề mặt, như cần gắp và cột điện. Điều này có thể tăng tốc nâng cấp đáng kể vào cuối trò chơi với súng điện từ và tháp pháo sét.
enable-defense-walls-and-gates=Bật nâng cấp cho tường và cổng.
custom-upgrade-limit-a=Mức chất lượng tối đa được cài đặt 'Custom A' sử dụng trong các giới hạn bên dưới. Chỉ cần thiết khi có mod bổ sung các mức chất lượng vượt quá huyền thoại và bạn muốn giới hạn mức nâng cấp của thực thể, ví dụ cho phép bộ thu thập tiểu hành tinh đạt cấp 10. Để sử dụng, hãy đặt mức tối đa tại đây, sau đó tìm thực thể muốn giới hạn và chọn 'Custom A' trong danh sách thả xuống. Để tham khảo, huyền thoại là cấp 5.
custom-upgrade-limit-b=Mức chất lượng tối đa được Custom B sử dụng trong cài đặt giới hạn nâng cấp.
custom-upgrade-limit-c=Mức chất lượng tối đa được Custom C sử dụng trong cài đặt giới hạn nâng cấp.
upgrade-limit-accumulators=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-agricultural-towers=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-assembly-machines=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-beacons=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-boilers=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-combinators-and-speakers=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.\n\nBao gồm: bộ kết hợp số học, bộ kết hợp quyết định, bộ kết hợp hằng số, loa có thể lập trình.
upgrade-limit-defense-walls-and-gates=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-furnaces=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-generators=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.\n\nBao gồm: động cơ hơi nước, tua bin hơi nước, máy phát điện nhiệt hạch.
upgrade-limit-heat-pipes=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-inserters=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-labs=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-lamps=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-mining-drills=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-poles=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.\n\nBao gồm cột điện và trạm biến áp.
upgrade-limit-power-switches=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-pumps=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.\n\nBao gồm: máy bơm ngoài khơi và máy bơm chất lỏng.
upgrade-limit-reactors=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.\n\nBao gồm: lò phản ứng hạt nhân, lò phản ứng nhiệt hạch.
upgrade-limit-rocket-silos=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-roboports=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-solar-panels=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.
upgrade-limit-turrets=Chất lượng nâng cấp tối đa cho các thực thể này. Thường tắt nâng cấp; Custom A/B/C sử dụng mức tùy chỉnh được chỉ định ở trên.\n\nBao gồm: tháp pháo đạn, tháp pháo laser, súng phun lửa, tháp pháo binh.
upgrade-limit-asteroid-collectors=Giới hạn bộ thu thập tiểu hành tinh ở mức huyền thoại để ngăn các vấn đề phá game. Các cấp được mod có thể tạo ra quá nhiều cánh tay di chuyển quá nhanh, khiến chúng không thể lấy mảnh tiểu hành tinh và tiêu tốn nhiều UPS.
upgrade-limit-radar=Giới hạn radar ở mức huyền thoại để tránh làm tăng kích thước file lưu. Chất lượng được mod có thể khiến bản đồ được khám phá quá mức, làm file lưu rất lớn (trên một gigabyte).
upgrade-limit-lightning-rods=Giới hạn cột thu sét ở mức huyền thoại để tránh UPS giảm đột biến. Cột thu sét với các mức chất lượng được mod có vùng phủ tăng lên đáng kể, có thể gây lag đột biến vào ban đêm trên Fulgora.
upgrade-limit-thrusters=Giới hạn động cơ đẩy không gian ở mức huyền thoại để tránh sàn không gian bị hư hại bất ngờ. Các cấp chất lượng được mod có thể làm tàu vũ trụ di chuyển nhanh hơn đáng kể, khiến hệ thống phòng thủ bị áp đảo.

