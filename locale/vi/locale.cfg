upgrade-limit-reactors=Kiểm Soát Chất Lượng sẽ nâng cấp các thực thể này đến mức chất lượng này, sau đó ngừng thử nâng cấp thêm. Đặt thành Thường để ngăn chặn mọi nỗ lực nâng cấp. Các giá trị tùy chỉnh sử dụng cài đặt Giới hạn nâng cấp tùy chỉnh A/B/C.\n\nBao gồm: lò phản ứng hạt nhân, lò phản ứng hợp hạch.
upgrade-limit-rocket-silos=Kiểm Soát Chất Lượng sẽ nâng cấp các thực thể này đến mức chất lượng này, sau đó ngừng thử nâng cấp thêm. Đặt thành Thường để ngăn chặn mọi nỗ lực nâng cấp. Các giá trị tùy chỉnh sử dụng cài đặt Giới hạn nâng cấp tùy chỉnh A/B/C.
upgrade-limit-roboports=Kiểm Soát Chất Lượng sẽ nâng cấp các thực thể này đến mức chất lượng này, sau đó ngừng thử nâng cấp thêm. Đặt thành Thường để ngăn chặn mọi nỗ lực nâng cấp. Các giá trị tùy chỉnh sử dụng cài đặt Giới hạn nâng cấp tùy chỉnh A/B/C.
upgrade-limit-solar-panels=Kiểm Soát Chất Lượng sẽ nâng cấp các thực thể này đến mức chất lượng này, sau đó ngừng thử nâng cấp thêm. Đặt thành Thường để ngăn chặn mọi nỗ lực nâng cấp. Các giá trị tùy chỉnh sử dụng cài đặt Giới hạn nâng cấp tùy chỉnh A/B/C.
upgrade-limit-turrets=Kiểm Soát Chất Lượng sẽ nâng cấp các thực thể này đến mức chất lượng này, sau đó ngừng thử nâng cấp thêm. Đặt thành Thường để ngăn chặn mọi nỗ lực nâng cấp. Các giá trị tùy chỉnh sử dụng cài đặt Giới hạn nâng cấp tùy chỉnh A/B/C.\n\nBao gồm: tháp pháo đạn, tháp pháo laser, súng phun lửa, tháp pháo binh.
upgrade-limit-asteroid-collectors=Giới hạn tăng trưởng chất lượng bộ thu thập tiểu hành tinh theo giá trị vanilla để ngăn chặn các vấn đề phá game.\n\nBộ thu thập tiểu hành tinh với các cấp chất lượng được mod có thể có quá nhiều cánh tay di chuyển quá nhanh, không thể lấy được các mảnh tiểu hành tinh và tạo ra lượng UPS tiêu tốn lớn.\n\n[color=green]Mặc định: huyền thoại[/color]
upgrade-limit-radar=Giới hạn tăng trưởng chất lượng radar để ngăn chặn khám phá bản đồ quá mức và làm tăng kích thước file lưu.\n\nRadar có mức chất lượng rất cao có thể gây ra file lưu lớn (1.200mb+) do khám phá bản đồ quá mức.\n\n[color=green]Mặc định: huyền thoại[/color]
upgrade-limit-lightning-rods=Giới hạn tăng trưởng chất lượng cột thu sét để ngăn chặn các vấn đề hiệu suất.\n\nCột thu sét có mức chất lượng rất cao có vùng phủ sóng tăng lên đáng kể, điều này có thể gây lag đột biến vào ban đêm trên Fulgora.\n\n[color=green]Mặc định: huyền thoại[/color]
upgrade-limit-thrusters=Giới hạn tăng trưởng chất lượng động cơ đẩy không gian theo cấp vanilla để ngăn chặn các vấn đề phòng thủ.\n\nCác cấp chất lượng được mod có thể làm tàu vũ trụ di chuyển nhanh hơn đáng kể, có thể áp đảo hệ thống phòng thủ của chúng.\n\n[color=green]Mặc định: huyền thoại[/color]

