upgrade-limit-radar=Limita el creixement de qualitat del radar per prevenir l'exploració excessiva del mapa i la inflació dels fitxers de desament.\n\nEls radars amb nivells de qualitat molt alts poden causar fitxers de desament grans (1.200mb+) degut a l'exploració excessiva del mapa.\n\n[color=green]Per defecte: llegendari[/color]
upgrade-limit-lightning-rods=Limita el creixement de qualitat de l'atractor de llamps per prevenir problemes de rendiment.\n\nEls atractors de llamps amb nivells de qualitat molt alts tenen àrees de cobertura significativament augmentades, el que pot causar pics de retard durant la nit a Fulgora.\n\n[color=green]Per defecte: llegendari[/color]
upgrade-limit-thrusters=Limita el creixement de qualitat del propulsor espacial als nivells estàndard per prevenir problemes de defensa.\n\nEls nivells de qualitat modificats poden moure les naus espacials significativament més ràpid, el que pot aclaparar les seves defenses.\n\n[color=green]Per defecte: llegendari[/color]

