[mod-setting-description]
manufacturing-hours-for-change=El nombre d'hores de fabricació necessàries perquè s'intenti un canvi de qualitat.\nLes hores de fabricació només s'acumulen quan la màquina està treballant activament. Si està inactiva, no progressarà.\nValor mínim 0.001 hores (3.6 segons), Valor màxim 1000 hores.
crafting-speed-affects-progression=[color=green]Activat:[/color] La velocitat de fabricació i la productivitat augmenten les hores de fabricació guanyades. Una velocitat de 4 amb un 50% de productivitat guanya sis vegades més que una velocitat d'1 sense bonificació de productivitat.\n\n[color=red]Desactivat:[/color] La velocitat de fabricació no afecta la progressió.
percentage-chance-of-change=Probabilitat que un intent de millora tingui èxit.
quality-increase-cost=Augment de les hores de fabricació necessàries per nivell de qualitat. L'augment és acumulatiu; amb un 0%, el requisit es manté igual a tots els nivells.\n\nAmb un 50%, un requisit de 3 hores passa a ser de 4,5 hores a poc comú i de 6,75 hores a rar.
quality-chance-accumulation-rate=Augmenta la probabilitat de millora després d'un intent fallit en un percentatge de la probabilitat base.\n\n[color=white]Cap:[/color] La probabilitat es manté constant.\n[color=white]Baix:[/color] Afegeix un 20% de la probabilitat base.\n[color=white]Mitjà:[/color] Afegeix un 50% de la probabilitat base.\n[color=white]Alt:[/color] Afegeix un 100% de la probabilitat base.\n\nAmb una probabilitat base de l'1%, Baix dona 1% → 1,2% → 1,4%... i Alt dona 1% → 2% → 3%...
secondary-progression-rate=Velocitat de progressió de les entitats que no poden mesurar la seva pròpia feina, com ara inseridors, pals i balises.\n\nEl 100% correspon a la mitjana d'hores de fabricació guanyades per les entitats primàries de la mateixa superfície. Els valors més alts acceleren la progressió; el 0% la pausa.
change-modules-with-entity=[color=white]Deshabilitat:[/color] Els mòduls no milloren.\n\n[color=white]Habilitat:[/color] Els mòduls milloren un nivell quan millora la seva màquina, fins a la qualitat de la màquina.\n\n[color=white]Extra habilitat:[/color] Els mòduls milloren fins a igualar la nova qualitat de la seva màquina.\n\n[color=white]Independent:[/color] Els mòduls guanyen els seus propis intents de millora amb la progressió secundària i poden superar el límit de qualitat de la seva màquina. Si el límit de la màquina s'estableix a Comú, també es deshabiliten les millores dels mòduls.
batch-entities-per-tick=Entitats processades per lot. Els lots més grans processen les millores més ràpid, però poden causar retard. Les ranures de mòduls també compten en mode Independent.
batch-ticks-between-processing=Ticks entre el processament de lots. Els intervals més curts processen les millores més sovint, però poden reduir el rendiment.
quality-change-aggregate-alerts-enabled=Mostra un resum de les millores cada cinc minuts.
quality-change-entity-alerts-enabled=Mostra icones d'alerta al mapa als llocs on es produeixen millores.
quality-change-chat-enabled=Mostra missatges de millora amb icones d'entitat o mòdul, icones de qualitat i lletres aleatòries amb colors de l'arc de Sant Martí.
quality-change-gps-enabled=Mostra un enllaç de ubicació clicable i activa el ping de GPS de Factorio per a cada millora. Fes clic a l'enllaç per tornar a la ubicació. Afegeix l'enllaç al xat de millores acolorit si està habilitat; altrament, només mostra l'enllaç. El ping de GPS natiu requereix un enllaç al xat.
quality-change-floating-text-enabled=Mostra un text de millora ascendent amb el color de la nova qualitat.
quality-change-halo-enabled=Mostra un halo que s'expandeix amb el color de la nova qualitat als llocs on es produeixen millores.
quality-change-rainbow-enabled=Mostra anells de l'arc de Sant Martí que s'expandeixen als llocs on es produeixen millores.
quality-change-badge-enabled=Mostra la icona de la nova qualitat creixent i ascendint durant 4,5 segons, mentre gira contínuament fins a desaparèixer.
quality-change-bubbles-enabled=Allibera un flux de petites icones de la nova qualitat que suren cap amunt com bombolles als llocs on es produeixen millores.
quality-change-sound-enabled=Reprodueix el so seleccionat per a les millores a la superfície que estàs visualitzant, inclosa la vista remota.
quality-change-sound=Tria un efecte de notificació, una alarma d'altaveu, un so de bateria o un instrument musical. Els instruments utilitzen Nota de l'instrument / fonamental i Comportament de les notes. Només es reprodueix si el so de millora està habilitat, per a les millores a la superfície que estàs visualitzant.
quality-change-sound-note=Nota fixa o fonamental (tonalitat i registre inicial) dels patrons musicals. S'ignora per a alarmes, bateria, efectes i el mode Totalment aleatori.\nLes notes pugen per semitons des de Fa: 1=Fa, 3=Sol, 5=La, 7=Si, 8=Do, 10=Re, 12=Mi; afegeix 12 per a l'octava següent. Per defecte: 20 (Do).\nEl piano té 48 notes; els altres instruments en tenen 36. El mode fix es limita a la nota més alta disponible. Els patrons musicals baixen octaves completes quan cal perquè hi càpiguen, preservant la tonalitat. La mateixa configuració dona patrons equivalents en el registre propi de cada instrument.
quality-change-sound-mode=Una nota per cada millora audible, amb un patró independent per a cada jugador. Nota fixa manté la nota seleccionada; Passeig musical es mou un o dos graus de l'escala; Campanes de vent tria notes aleatòries de l'escala pentatònica major; Escala ascendeix i descendeix repetidament; Aleatori dins l'escala tria qualsevol nota de l'escala i el rang seleccionats; Totalment aleatori utilitza tot el rang de l'instrument.\nPasseig musical i Escala comencen a la fonamental i reprenen el patró després de períodes de silenci i en desar o carregar. No s'acumulen notes retardades. Només afecta els instruments musicals.
quality-change-sound-scale=Escala relativa a Nota de l'instrument / fonamental, utilitzada per Passeig musical, Escala i Aleatori dins l'escala. Cromàtica permet tots els semitons. Campanes de vent sempre utilitza la pentatònica major; Nota fixa i Totalment aleatori ignoren aquesta configuració.
quality-change-sound-range=Una o dues octaves a partir de la fonamental, desplaçades cap avall per octaves completes si cal perquè càpiguen en el rang de l'instrument; o tot el rang de l'instrument. S'aplica a Passeig musical, Campanes de vent, Escala i Aleatori dins l'escala. Nota fixa i Totalment aleatori ignoren aquesta configuració.
quality_control_skip_hidden_qualities=Omet les qualitats ocultes (com ara les variants brillants) durant la millora. Aquesta configuració només s'aplica quan tens instal·lat un mod com Shiny Mechanics.
quality_control_hidden_qualities_sticky==Les entitats amb qualitats ocultes (per exemple, brillants) no milloraran més, preservant els seus beneficis únics. Aquesta configuració només s'aplica quan tens instal·lat un mod com Shiny Mechanics.
enable-accumulators=Habilita millores per a acumuladors.
enable-agricultural-towers=Habilita millores per a torres agrícoles.
enable-assembly-machines=Habilita millores per a màquines d'assemblatge.
enable-asteroid-collectors=Habilita millores per a col·lectors d'asteroides.
asteroid-collector-growth-level-limit=Limita el creixement de qualitat del col·lector d'asteroides als valors estàndard per prevenir problemes que trenquen el joc.\n\nEls col·lectors d'asteroides amb nivells de qualitat modificats poden tenir massa braços que es mouen massa ràpid, sent incapaços d'agafar trossos d'asteroides i creant una gran sobrecàrrega d'UPS.\n\n[color=green]Per defecte: llegendari[/color]
enable-beacons=Habilita millores per a balises.
enable-boilers=Habilita millores per a calderes.
enable-combinators-and-speakers=Habilita millores per a combinadors i altaveus programables.
enable-pumps=Habilita millores per a bombes marines i bombes de fluid.
enable-furnaces=Habilita millores per a forns.
enable-generators=Habilita millores per a motors de vapor, turbines de vapor i generadors de fusió.
enable-heat-pipes=Habilita millores per a canonades de calor.
enable-inserters=Habilita millores per a inseridors.
enable-labs=Habilita millores per a laboratoris de recerca.
enable-lamps=Habilita millores per a llums.
enable-lightning-rods=Habilita millores per a parallamps.
enable-mining-drills=Habilita millores per a perforadores.
enable-poles=Habilita millores per a pals elèctrics i subestacions.
enable-power-switches=Habilita millores per a interruptors d'energia.
enable-radar=Habilita millores per a estacions de radar.
radar-growth-level-limit=Limita el creixement de qualitat del radar per prevenir l'exploració excessiva del mapa i la inflació dels fitxers de desament.\n\nEls radars amb nivells de qualitat molt alts poden causar fitxers de desament grans (1.200mb+) degut a l'exploració excessiva del mapa.\n\n[color=green]Per defecte: llegendari[/color]
lightning-attractor-growth-level-limit=Limita el creixement de qualitat de l'atractor de llamps per prevenir problemes de rendiment.\n\nEls atractors de llamps amb nivells de qualitat molt alts tenen àrees de cobertura significativament augmentades, el que pot causar pics de retard durant la nit a Fulgora.\n\n[color=green]Per defecte: llegendari[/color]
enable-reactors=Habilita millores per a reactors nuclears i de fusió.
enable-rocket-silos=Habilita millores per a sitges de coets.
enable-roboports=Habilita millores per a roboports.
enable-solar-panels=Habilita millores per a panells solars.
enable-thrusters=Habilita millores per a propulsors espacials. Les naus més ràpides poden veure les seves defenses aclaparades.
thruster-growth-level-limit=Permet limitar els propulsors espacials als nivells estàndard. Els nivells de qualitat modificats poden fer que les naus espacials es moguin molt més ràpid, cosa que pot aclaparar les seves defenses.
enable-turrets=Habilita millores per a torretes de munició, làser, llançaflames i d'artilleria. Les torretes guanyen 'hores de fabricació' en infligir dany.
turret-damage-per-manufacturing-hour=La quantitat de dany que ha d'infligir una torreta per guanyar una hora de fabricació.\n\nPer defecte: 36.000 de dany (calculat a partir d'una torreta de nivell base disparant cartutxos perforants contínuament durant una hora).
turrets-contribute-credits=Permet que les torretes contribueixin a les millores de les entitats secundàries de la mateixa superfície, com ara inseridors i pals elèctrics. Això pot accelerar molt les millores a les etapes avançades de la partida amb canons de rail i torretes de llamps.
enable-defense-walls-and-gates=Habilita millores per a murs i portes.
custom-upgrade-limit-a=Nivell màxim de qualitat que utilitza l'opció 'Personalitzat A' als límits següents. Només és necessari si tens un mod que afegeix nivells de qualitat més enllà de llegendari i vols limitar fins a quin nivell pot millorar una entitat. Per exemple, si vols permetre que els col·lectors d'asteroides arribin al nivell 10. Per utilitzar aquesta funció, estableix aquí el nivell màxim i després ves a l'entitat que vulguis limitar i selecciona 'Personalitzat A' al menú desplegable. Com a referència, llegendari és el nivell 5.
custom-upgrade-limit-b=Nivell màxim de qualitat que utilitza Personalitzat B a la configuració de límits de millora.
custom-upgrade-limit-c=Nivell màxim de qualitat que utilitza Personalitzat C a la configuració de límits de millora.
upgrade-limit-accumulators=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-agricultural-towers=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-assembly-machines=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-beacons=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-boilers=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-combinators-and-speakers=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.\n\nInclou: combinadors aritmètics, combinadors de decisió, combinadors constants, altaveus programables.
upgrade-limit-defense-walls-and-gates=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-furnaces=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-generators=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.\n\nInclou: motors de vapor, turbines de vapor, generadors de fusió.
upgrade-limit-heat-pipes=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-inserters=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-labs=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-lamps=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-mining-drills=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-poles=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.\n\nInclou pals elèctrics i subestacions.
upgrade-limit-power-switches=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-pumps=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.\n\nInclou: bombes marines i bombes de fluid.
upgrade-limit-reactors=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.\n\nInclou: reactors nuclears, reactors de fusió.
upgrade-limit-rocket-silos=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-roboports=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-solar-panels=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.
upgrade-limit-turrets=Qualitat màxima de millora d'aquestes entitats. Comú deshabilita les millores; Personalitzat A/B/C utilitza el nivell personalitzat indicat més amunt.\n\nInclou: torretes de munició, torretes làser, llançaflames, torretes d'artilleria.
upgrade-limit-asteroid-collectors=Limita els col·lectors d'asteroides a llegendari per prevenir problemes greus al joc. Els nivells modificats poden crear massa braços que es mouen massa ràpid, que no poden agafar trossos d'asteroides i que causen una gran sobrecàrrega d'UPS.
upgrade-limit-radar=Limita els radars a llegendari per evitar que els fitxers de desament creixin excessivament. Les qualitats modificades poden causar una exploració excessiva del mapa i generar fitxers molt grans (de més d'un gigabyte).
upgrade-limit-lightning-rods=Limita els atractors de llamps a llegendari per prevenir pics d'UPS. Els atractors de llamps amb nivells de qualitat modificats tenen àrees de cobertura molt més grans, cosa que pot causar pics de retard durant la nit a Fulgora.
upgrade-limit-thrusters=Limita el propulsor espacial a llegendari per prevenir danys inesperats a la plataforma espacial. Els nivells de qualitat modificats poden fer que les naus espacials es moguin molt més ràpid, cosa que pot aclaparar les seves defenses.

