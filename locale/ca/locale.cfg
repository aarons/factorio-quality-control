quality-level-cap-combinators-and-speakers=Nivell màxim al qual Control de Qualitat elevarà aquesta entitat. S'aturarà al nivell 5 (llegendari) si no hi ha nivells modificats.\n\nInclou: combinadors aritmètics, combinadors decisors, combinadors constants, altaveus programables.
