# Αυτή η μετάφραση δημιουργήθηκε από AI. Οι διορθώσεις είναι πολύ ευπρόσδεκτες! Παρακαλώ προσθέστε σχόλια στο φόρουμ συζήτησης του mod (https://mods.factorio.com/mod/quality-control/discussion) ή ως ζήτημα στο github repo (https://github.com/aarons/factorio-quality-control/issues). Ζητάμε συγγνώμη για τυχόν λάθη!

