upgrade-limit-rocket-silos=Ο Έλεγχος Ποιότητας θα αναβαθμίζει αυτές τις οντότητες μέχρι αυτή την ποιότητα, και μετά θα σταματά να επιχειρεί περαιτέρω αναβαθμίσεις. Ορίστε το σε Κανονικό για να αποτρέψετε οποιαδήποτε προσπάθεια αναβάθμισης. Οι προσαρμοσμένες τιμές χρησιμοποιούν τις ρυθμίσεις Προσαρμοσμένο Όριο Αναβάθμισης A/B/C.
upgrade-limit-roboports=Ο Έλεγχος Ποιότητας θα αναβαθμίζει αυτές τις οντότητες μέχρι αυτή την ποιότητα, και μετά θα σταματά να επιχειρεί περαιτέρω αναβαθμίσεις. Ορίστε το σε Κανονικό για να αποτρέψετε οποιαδήποτε προσπάθεια αναβάθμισης. Οι προσαρμοσμένες τιμές χρησιμοποιούν τις ρυθμίσεις Προσαρμοσμένο Όριο Αναβάθμισης A/B/C.
upgrade-limit-solar-panels=Ο Έλεγχος Ποιότητας θα αναβαθμίζει αυτές τις οντότητες μέχρι αυτή την ποιότητα, και μετά θα σταματά να επιχειρεί περαιτέρω αναβαθμίσεις. Ορίστε το σε Κανονικό για να αποτρέψετε οποιαδήποτε προσπάθεια αναβάθμισης. Οι προσαρμοσμένες τιμές χρησιμοποιούν τις ρυθμίσεις Προσαρμοσμένο Όριο Αναβάθμισης A/B/C.
upgrade-limit-turrets=Ο Έλεγχος Ποιότητας θα αναβαθμίζει αυτές τις οντότητες μέχρι αυτή την ποιότητα, και μετά θα σταματά να επιχειρεί περαιτέρω αναβαθμίσεις. Ορίστε το σε Κανονικό για να αποτρέψετε οποιαδήποτε προσπάθεια αναβάθμισης. Οι προσαρμοσμένες τιμές χρησιμοποιούν τις ρυθμίσεις Προσαρμοσμένο Όριο Αναβάθμισης A/B/C.\n\nΠεριλαμβάνει: πυργίσκους πυρομαχικών, πυργίσκους λέιζερ, φλογοβόλα, πυργίσκους πυροβολικού.
upgrade-limit-asteroid-collectors=Περιορίζει την ανάπτυξη ποιότητας συλλεκτών αστεροειδών στις βασικές τιμές για να αποφευχθούν προβλήματα που σπάνε το παιχνίδι.\n\nΟι συλλέκτες αστεροειδών με τροποποιημένες βαθμίδες ποιότητας μπορεί να έχουν πάρα πολλά χέρια που κινούνται πολύ γρήγορα, καθιστώντας αδύνατη την αρπαγή κομματιών αστεροειδών και δημιουργώντας μεγάλη κατανάλωση UPS.\n\n[color=green]Προεπιλογή: θρυλικό[/color]
upgrade-limit-radar=Περιορίζει την ανάπτυξη ποιότητας ραντάρ για να αποφευχθεί η υπερβολική εξερεύνηση χάρτη και το φούσκωμα του αρχείου αποθήκευσης.\n\nΤα ραντάρ με πολύ υψηλά επίπεδα ποιότητας μπορούν να προκαλέσουν μεγάλα αρχεία αποθήκευσης (1.200mb+) λόγω υπερβολικής εξερεύνησης χάρτη.\n\n[color=green]Προεπιλογή: θρυλικό[/color]
upgrade-limit-lightning-rods=Περιορίζει την ανάπτυξη ποιότητας ελκυστών κεραυνών για να αποφευχθούν προβλήματα απόδοσης.\n\nΟι ελκυστές κεραυνών με πολύ υψηλά επίπεδα ποιότητας έχουν σημαντικά αυξημένες περιοχές κάλυψης, που μπορούν να προκαλέσουν στιγμιαία lag τη νύχτα στον Fulgora.\n\n[color=green]Προεπιλογή: θρυλικό[/color]
upgrade-limit-thrusters=Περιορίζει την ανάπτυξη ποιότητας διαστημικών προωθητήρων στα βασικά επίπεδα για να αποφευχθούν αμυντικά προβλήματα.\n\nΟι τροποποιημένες βαθμίδες ποιότητας μπορούν να κάνουν τα διαστημόπλοια να κινούνται σημαντικά πιο γρήγορα, κάτι που μπορεί να κατακλύσει τις άμυνές τους.\n\n[color=green]Προεπιλογή: θρυλικό[/color]

