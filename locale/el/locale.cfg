[mod-setting-description]
manufacturing-hours-for-change=Ο αριθμός των ωρών κατασκευής που απαιτούνται για να επιχειρηθεί μια αλλαγή ποιότητας.\nΟι ώρες κατασκευής συσσωρεύονται μόνο όταν η μηχανή εργάζεται ενεργά. Αν παραμένει αδρανής, δεν θα σημειώσει πρόοδο.\nΕλάχιστη τιμή 0,001 ώρες (3,6 δευτερόλεπτα), Μέγιστη τιμή 1000 ώρες.
crafting-speed-affects-progression=[color=green]Ενεργοποιημένο:[/color] Η ταχύτητα κατασκευής και η παραγωγικότητα αυξάνουν τις ώρες κατασκευής που κερδίζονται. Ταχύτητα 4 με 50% παραγωγικότητα κερδίζει έξι φορές περισσότερες ώρες από ταχύτητα 1 χωρίς μπόνους παραγωγικότητας.\n\n[color=red]Απενεργοποιημένο:[/color] Η ταχύτητα κατασκευής δεν επηρεάζει την πρόοδο.
percentage-chance-of-change=Πιθανότητα επιτυχίας μιας προσπάθειας αναβάθμισης.
quality-increase-cost=Αύξηση των απαιτούμενων ωρών κατασκευής ανά επίπεδο ποιότητας. Η αύξηση είναι σωρευτική· στο 0% η απαίτηση παραμένει ίδια σε όλα τα επίπεδα.\n\nΣτο 50%, η απαίτηση των 3 ωρών γίνεται 4,5 ώρες στην ασυνήθη και 6,75 ώρες στη σπάνια ποιότητα.
quality-chance-accumulation-rate=Αυξάνει την πιθανότητα αναβάθμισης μετά από αποτυχημένη προσπάθεια κατά ένα ποσοστό της βασικής πιθανότητας.\n\n[color=white]Καμία:[/color] Η πιθανότητα παραμένει σταθερή.\n[color=white]Χαμηλή:[/color] Προστίθεται 20% της βασικής πιθανότητας.\n[color=white]Μέση:[/color] Προστίθεται 50% της βασικής πιθανότητας.\n[color=white]Υψηλή:[/color] Προστίθεται 100% της βασικής πιθανότητας.\n\nΜε βασική πιθανότητα 1%, η Χαμηλή δίνει 1% → 1,2% → 1,4%... και η Υψηλή δίνει 1% → 2% → 3%...
secondary-progression-rate=Ταχύτητα προόδου για οντότητες που δεν μπορούν να μετρήσουν τη δική τους εργασία, όπως εισαγωγείς, στύλοι και φάροι.\n\nΤο 100% αντιστοιχεί στις μέσες ώρες κατασκευής που κερδίζουν οι πρωτεύουσες οντότητες στην ίδια επιφάνεια. Υψηλότερες τιμές επιταχύνουν την πρόοδο· το 0% την παύει.
change-modules-with-entity=[color=white]Απενεργοποιημένο:[/color] Οι μονάδες δεν αναβαθμίζονται.\n\n[color=white]Ενεργοποιημένο:[/color] Οι μονάδες αναβαθμίζονται κατά μία βαθμίδα όταν αναβαθμίζεται η μηχανή τους, μέχρι την ποιότητα της μηχανής.\n\n[color=white]Επιπλέον Ενεργοποιημένο:[/color] Οι μονάδες αναβαθμίζονται ώστε να ταιριάζουν με τη νέα ποιότητα της μηχανής τους.\n\n[color=white]Ανεξάρτητο:[/color] Οι μονάδες κερδίζουν δικές τους προσπάθειες αναβάθμισης από τη δευτερεύουσα πρόοδο και μπορούν να ξεπεράσουν το όριο ποιότητας της μηχανής τους. Αν το όριο της μηχανής οριστεί σε Κανονικό, απενεργοποιούνται και οι αναβαθμίσεις μονάδων.
batch-entities-per-tick=Οντότητες που επεξεργάζονται ανά παρτίδα. Μεγαλύτερες παρτίδες επεξεργάζονται τις αναβαθμίσεις πιο γρήγορα, αλλά μπορεί να προκαλέσουν καθυστέρηση. Στην Ανεξάρτητη λειτουργία μετρούν και οι θέσεις μονάδων.
batch-ticks-between-processing=Ticks μεταξύ επεξεργασίας παρτίδων. Μικρότερα διαστήματα επεξεργάζονται τις αναβαθμίσεις συχνότερα, αλλά μπορεί να μειώσουν την απόδοση.
quality-change-aggregate-alerts-enabled=Εμφάνιση σύνοψης αναβαθμίσεων κάθε πέντε λεπτά.
quality-change-entity-alerts-enabled=Εμφάνιση εικονιδίων ειδοποίησης στον χάρτη στις θέσεις αναβάθμισης.
quality-change-chat-enabled=Εμφάνιση μηνυμάτων αναβάθμισης με εικονίδια οντοτήτων ή μονάδων, εικονίδια ποιότητας και γράμματα σε τυχαία χρώματα ουράνιου τόξου.
quality-change-gps-enabled=Εμφάνιση συνδέσμου τοποθεσίας με δυνατότητα κλικ και ενεργοποίηση σήματος GPS στον χάρτη του Factorio για κάθε αναβάθμιση. Κάντε κλικ στον σύνδεσμο για να επιστρέψετε στην τοποθεσία. Προσθέτει τον σύνδεσμο στην πολύχρωμη συνομιλία αναβαθμίσεων όταν είναι ενεργοποιημένη· διαφορετικά εμφανίζει μόνο τον σύνδεσμο. Το ενσωματωμένο σήμα GPS απαιτεί σύνδεσμο στη συνομιλία.
quality-change-floating-text-enabled=Εμφάνιση ανερχόμενου κειμένου αναβάθμισης στο χρώμα της νέας ποιότητας.
quality-change-halo-enabled=Εμφάνιση διευρυνόμενης άλω στο χρώμα της νέας ποιότητας στις θέσεις αναβάθμισης.
quality-change-rainbow-enabled=Εμφάνιση διευρυνόμενων δακτυλίων ουράνιου τόξου στις θέσεις αναβάθμισης.
quality-change-badge-enabled=Εμφάνιση του εικονιδίου της νέας ποιότητας να μεγαλώνει και να ανεβαίνει για 4,5 δευτερόλεπτα, περιστρεφόμενο συνεχώς μέχρι να σβήσει.
quality-change-bubbles-enabled=Απελευθέρωση μικρών εικονιδίων της νέας ποιότητας που ανεβαίνουν σαν φυσαλίδες στις θέσεις αναβάθμισης.
quality-change-sound-enabled=Αναπαραγωγή του επιλεγμένου ήχου για αναβαθμίσεις στην επιφάνεια που προβάλλετε, συμπεριλαμβανομένης της απομακρυσμένης προβολής.
quality-change-sound=Επιλέξτε εφέ ειδοποίησης, συναγερμό ηχείου, ήχο τυμπάνου ή μουσικό όργανο. Τα όργανα χρησιμοποιούν τις ρυθμίσεις Νότα οργάνου / Βασική νότα και Συμπεριφορά νότας. Ο ήχος παίζει μόνο όταν είναι ενεργοποιημένος ο ήχος αναβάθμισης, για αναβαθμίσεις στην επιφάνεια που προβάλλετε.
quality-change-sound-note=Σταθερή νότα ή βασική νότα (τονικότητα και αρχική οκτάβα) για μουσικά μοτίβα. Αγνοείται για συναγερμούς, τύμπανα, εφέ και την Εντελώς τυχαία λειτουργία.\nΟι νότες ανεβαίνουν ανά ημιτόνιο από το F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E· προσθέστε 12 για την επόμενη οκτάβα. Προεπιλογή: 20 (C).\nΤο πιάνο έχει 48 νότες· τα άλλα όργανα έχουν 36. Η Σταθερή νότα περιορίζεται στην υψηλότερη διαθέσιμη νότα. Τα μουσικά μοτίβα μετατοπίζονται προς τα κάτω κατά ολόκληρες οκτάβες όταν χρειάζεται, διατηρώντας την τονικότητα. Οι ίδιες ρυθμίσεις δίνουν ισοδύναμα μοτίβα στο εύρος κάθε οργάνου.
quality-change-sound-mode=Μία νότα ανά ακουστή αναβάθμιση, με ξεχωριστό μοτίβο για κάθε παίκτη. Η Σταθερή νότα διατηρεί την επιλεγμένη νότα· η Μουσική περιπλάνηση κινείται ένα ή δύο βήματα στην κλίμακα· τα Ανεμοκουδούνια επιλέγουν τυχαίες νότες της μείζονος πεντατονικής· η Σκάλα ανεβαίνει και κατεβαίνει επανειλημμένα· η Τυχαία στην κλίμακα επιλέγει οποιαδήποτε νότα στην επιλεγμένη κλίμακα και εύρος· η Εντελώς τυχαία χρησιμοποιεί όλο το εύρος του οργάνου.\nΗ Μουσική περιπλάνηση και η Σκάλα ξεκινούν από τη βασική νότα και συνεχίζουν μετά από περιόδους σιωπής και αποθήκευση/φόρτωση. Δεν προστίθενται καθυστερημένες νότες στην ουρά. Επηρεάζει μόνο μουσικά όργανα.
quality-change-sound-scale=Κλίμακα με βάση τη Νότα οργάνου / Βασική νότα, για τη Μουσική περιπλάνηση, τη Σκάλα και την Τυχαία στην κλίμακα. Η Χρωματική επιτρέπει κάθε ημιτόνιο. Τα Ανεμοκουδούνια χρησιμοποιούν πάντα τη μείζονα πεντατονική· η Σταθερή νότα και η Εντελώς τυχαία αγνοούν αυτή τη ρύθμιση.
quality-change-sound-range=Μία ή δύο οκτάβες από τη βασική νότα, με μετατόπιση προς τα κάτω κατά ολόκληρες οκτάβες αν χρειάζεται για να χωρέσουν στο εύρος του οργάνου· ή ολόκληρο το εύρος του οργάνου. Ισχύει για τη Μουσική περιπλάνηση, τα Ανεμοκουδούνια, τη Σκάλα και την Τυχαία στην κλίμακα. Η Σταθερή νότα και η Εντελώς τυχαία αγνοούν αυτή τη ρύθμιση.
quality_control_skip_hidden_qualities=Παράλειψη κρυφών ποιοτήτων (όπως shiny παραλλαγές) κατά την αναβάθμιση. Αυτή η ρύθμιση ισχύει μόνο όταν έχετε εγκατεστημένο ένα mod όπως το Shiny Mechanics.
quality_control_hidden_qualities_sticky==Οι οντότητες με κρυφές ποιότητες (π.χ., shiny) δεν θα αναβαθμιστούν περαιτέρω, διατηρώντας τα μοναδικά τους οφέλη. Αυτή η ρύθμιση ισχύει μόνο όταν έχετε εγκατεστημένο ένα mod όπως το Shiny Mechanics.
enable-accumulators=Ενεργοποίηση αναβαθμίσεων για συσσωρευτές.
enable-agricultural-towers=Ενεργοποίηση αναβαθμίσεων για γεωργικούς πύργους.
enable-assembly-machines=Ενεργοποίηση αναβαθμίσεων για μηχανές συναρμολόγησης.
enable-asteroid-collectors=Ενεργοποίηση αναβαθμίσεων για συλλέκτες αστεροειδών.
asteroid-collector-growth-level-limit=Περιορίζει την ανάπτυξη ποιότητας συλλεκτών αστεροειδών στις βασικές τιμές για να αποφευχθούν προβλήματα που σπάνε το παιχνίδι.\n\nΟι συλλέκτες αστεροειδών με τροποποιημένες βαθμίδες ποιότητας μπορεί να έχουν πάρα πολλά χέρια που κινούνται πολύ γρήγορα, καθιστώντας αδύνατη την αρπαγή κομματιών αστεροειδών και δημιουργώντας μεγάλη κατανάλωση UPS.\n\n[color=green]Προεπιλογή: θρυλικό[/color]
enable-beacons=Ενεργοποίηση αναβαθμίσεων για φάρους.
enable-boilers=Ενεργοποίηση αναβαθμίσεων για λέβητες.
enable-combinators-and-speakers=Ενεργοποίηση αναβαθμίσεων για συνδυαστές και προγραμματιζόμενα ηχεία.
enable-pumps=Ενεργοποίηση αναβαθμίσεων για παράκτιες αντλίες και αντλίες υγρών.
enable-furnaces=Ενεργοποίηση αναβαθμίσεων για κλιβάνους.
enable-generators=Ενεργοποίηση αναβαθμίσεων για ατμομηχανές, ατμοστρόβιλους και γεννήτριες σύντηξης.
enable-heat-pipes=Ενεργοποίηση αναβαθμίσεων για σωλήνες θερμότητας.
enable-inserters=Ενεργοποίηση αναβαθμίσεων για εισαγωγείς.
enable-labs=Ενεργοποίηση αναβαθμίσεων για ερευνητικά εργαστήρια.
enable-lamps=Ενεργοποίηση αναβαθμίσεων για λάμπες.
enable-lightning-rods=Ενεργοποίηση αναβαθμίσεων για αλεξικέραυνα.
enable-mining-drills=Ενεργοποίηση αναβαθμίσεων για τρυπάνια εξόρυξης.
enable-poles=Ενεργοποίηση αναβαθμίσεων για ηλεκτρικούς στύλους και υποσταθμούς.
enable-power-switches=Ενεργοποίηση αναβαθμίσεων για διακόπτες ρεύματος.
enable-radar=Ενεργοποίηση αναβαθμίσεων για σταθμούς ραντάρ.
radar-growth-level-limit=Περιορίζει την ανάπτυξη ποιότητας ραντάρ για να αποφευχθεί η υπερβολική εξερεύνηση χάρτη και το φούσκωμα του αρχείου αποθήκευσης.\n\nΤα ραντάρ με πολύ υψηλά επίπεδα ποιότητας μπορούν να προκαλέσουν μεγάλα αρχεία αποθήκευσης (1.200mb+) λόγω υπερβολικής εξερεύνησης χάρτη.\n\n[color=green]Προεπιλογή: θρυλικό[/color]
lightning-attractor-growth-level-limit=Περιορίζει την ανάπτυξη ποιότητας ελκυστών κεραυνών για να αποφευχθούν προβλήματα απόδοσης.\n\nΟι ελκυστές κεραυνών με πολύ υψηλά επίπεδα ποιότητας έχουν σημαντικά αυξημένες περιοχές κάλυψης, που μπορούν να προκαλέσουν στιγμιαία lag τη νύχτα στον Fulgora.\n\n[color=green]Προεπιλογή: θρυλικό[/color]
enable-reactors=Ενεργοποίηση αναβαθμίσεων για πυρηνικούς αντιδραστήρες και αντιδραστήρες σύντηξης.
enable-rocket-silos=Ενεργοποίηση αναβαθμίσεων για πυραυλικά σιλό.
enable-roboports=Ενεργοποίηση αναβαθμίσεων για λιμάνια ρομπότ.
enable-solar-panels=Ενεργοποίηση αναβαθμίσεων για ηλιακούς συλλέκτες.
enable-thrusters=Ενεργοποίηση αναβαθμίσεων για διαστημικούς προωθητήρες. Τα ταχύτερα διαστημόπλοια μπορεί να κατακλύσουν τις άμυνές τους.
thruster-growth-level-limit=Προαιρετικός περιορισμός των διαστημικών προωθητήρων στα βασικά επίπεδα. Οι τροποποιημένες βαθμίδες ποιότητας μπορούν να κάνουν τα διαστημόπλοια να κινούνται σημαντικά πιο γρήγορα, κάτι που μπορεί να κατακλύσει τις άμυνές τους.
enable-turrets=Ενεργοποίηση αναβαθμίσεων για πυργίσκους πυρομαχικών, λέιζερ, φλογοβόλων και πυροβολικού. Οι πυργίσκοι κερδίζουν «ώρες κατασκευής» προκαλώντας ζημιά.
turret-damage-per-manufacturing-hour=Η ποσότητα ζημιάς που πρέπει να προκαλέσει ένας πυργίσκος για να κερδίσει μία ώρα κατασκευής.\n\nΠροεπιλογή: 36.000 ζημιά (προκύπτει από πυργίσκο βασικού επιπέδου που βάλλει συνεχώς με βλήματα διάτρησης για μία ώρα).
turrets-contribute-credits=Επιτρέπει στους πυργίσκους να συμβάλλουν στις αναβαθμίσεις δευτερευουσών οντοτήτων, όπως εισαγωγείς και ηλεκτρικοί στύλοι, στην ίδια επιφάνεια. Αυτό μπορεί να επιταχύνει πολύ τις αναβαθμίσεις στα προχωρημένα στάδια του παιχνιδιού με πυροβόλα ράγας και πυργίσκους κεραυνών.
enable-defense-walls-and-gates=Ενεργοποίηση αναβαθμίσεων για τείχη και πύλες.
custom-upgrade-limit-a=Μέγιστο επίπεδο ποιότητας που χρησιμοποιεί η ρύθμιση «Προσαρμοσμένο A» στα παρακάτω όρια. Χρειάζεται μόνο όταν έχετε ένα mod που προσθέτει επίπεδα ποιότητας πέρα από το θρυλικό και θέλετε να περιορίσετε το επίπεδο αναβάθμισης μιας οντότητας. Για παράδειγμα, αν θέλετε οι συλλέκτες αστεροειδών να φτάνουν στο επίπεδο 10. Ορίστε εδώ το μέγιστο επίπεδο, μετά πηγαίνετε στην οντότητα που θέλετε να περιορίσετε και επιλέξτε «Προσαρμοσμένο A» στην αναπτυσσόμενη λίστα. Για αναφορά, το θρυλικό είναι επίπεδο 5.
custom-upgrade-limit-b=Μέγιστο επίπεδο ποιότητας που χρησιμοποιεί το Προσαρμοσμένο B στις ρυθμίσεις ορίου αναβάθμισης.
custom-upgrade-limit-c=Μέγιστο επίπεδο ποιότητας που χρησιμοποιεί το Προσαρμοσμένο C στις ρυθμίσεις ορίου αναβάθμισης.
upgrade-limit-accumulators=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-agricultural-towers=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-assembly-machines=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-beacons=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-boilers=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-combinators-and-speakers=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.\n\nΠεριλαμβάνει: αριθμητικούς συνδυαστές, συνδυαστές απόφασης, σταθερούς συνδυαστές, προγραμματιζόμενα ηχεία.
upgrade-limit-defense-walls-and-gates=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-furnaces=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-generators=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.\n\nΠεριλαμβάνει: ατμομηχανές, ατμοστρόβιλους, γεννήτριες σύντηξης.
upgrade-limit-heat-pipes=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-inserters=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-labs=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-lamps=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-mining-drills=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-poles=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.\n\nΠεριλαμβάνει ηλεκτρικούς στύλους και υποσταθμούς.
upgrade-limit-power-switches=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-pumps=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.\n\nΠεριλαμβάνει: παράκτιες αντλίες και αντλίες υγρών.
upgrade-limit-reactors=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.\n\nΠεριλαμβάνει: πυρηνικούς αντιδραστήρες, αντιδραστήρες σύντηξης.
upgrade-limit-rocket-silos=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-roboports=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-solar-panels=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.
upgrade-limit-turrets=Μέγιστη ποιότητα αναβάθμισης για αυτές τις οντότητες. Το Κανονικό απενεργοποιεί τις αναβαθμίσεις· το Προσαρμοσμένο A/B/C χρησιμοποιεί το προσαρμοσμένο επίπεδο που ορίστηκε παραπάνω.\n\nΠεριλαμβάνει: πυργίσκους πυρομαχικών, πυργίσκους λέιζερ, φλογοβόλα, πυργίσκους πυροβολικού.
upgrade-limit-asteroid-collectors=Περιορίζει τους συλλέκτες αστεροειδών στο θρυλικό επίπεδο για να αποφευχθούν σοβαρά προβλήματα στο παιχνίδι. Τα τροποποιημένα επίπεδα μπορεί να δημιουργήσουν πάρα πολλούς βραχίονες που κινούνται πολύ γρήγορα, αδυνατούν να πιάσουν κομμάτια αστεροειδών και προκαλούν μεγάλη πτώση των UPS.
upgrade-limit-radar=Περιορίζει τα ραντάρ στο θρυλικό επίπεδο για να αποφευχθεί το φούσκωμα του αρχείου αποθήκευσης. Οι τροποποιημένες ποιότητες μπορούν να προκαλέσουν υπερβολική εξερεύνηση χάρτη και πολύ μεγάλα αρχεία αποθήκευσης (πάνω από ένα gigabyte).
upgrade-limit-lightning-rods=Περιορίζει τους ελκυστές κεραυνών στο θρυλικό επίπεδο για να αποφευχθούν στιγμιαίες πτώσεις των UPS. Οι ελκυστές κεραυνών με τροποποιημένα επίπεδα ποιότητας έχουν σημαντικά αυξημένες περιοχές κάλυψης, που μπορούν να προκαλέσουν στιγμιαία καθυστέρηση τη νύχτα στον Fulgora.
upgrade-limit-thrusters=Περιορίζει τους διαστημικούς προωθητήρες στο θρυλικό επίπεδο για να αποφευχθούν απροσδόκητες ζημιές στη διαστημική πλατφόρμα. Οι τροποποιημένες βαθμίδες ποιότητας μπορούν να κάνουν τα διαστημόπλοια να κινούνται σημαντικά πιο γρήγορα, κάτι που μπορεί να κατακλύσει τις άμυνές τους.

