[mod-setting-description]
manufacturing-hours-for-change=Valmistustuntien määrä, joka vaaditaan laatumuutoksen yrittämiseen.\nValmistustunteja kertyy vain, kun kone on aktiivisesti käynnissä. Jos kone on joutilaana, eteneminen pysähtyy.\nVähimmäisarvo 0,001 tuntia (3,6 sekuntia), enimmäisarvo 1000 tuntia.
crafting-speed-affects-progression=Määrittää, vaikuttaako koneen valmistusnopeus siihen, kuinka nopeasti se kerryttää valmistustunteja.\n\n[color=green]Käytössä (oletus):[/color] Koneet, joilla on suurempi valmistusnopeus, etenevät nopeammin. Valmistustunteja kertyy koneen valmistusnopeuden ja tuottavuuden perusteella. Valimo, jonka nopeus on 4 ja tuottavuus 50 %, etenee kuusi kertaa nopeammin kuin kokoonpanokone 2, jonka valmistusnopeus on 1.\n\n[color=red]Pois käytöstä:[/color] Valmistusnopeudella ei ole vaikutusta etenemiseen. Yksi tunti aktiivista valmistusta lasketaan yhdeksi valmistustunniksi valmistusnopeudesta riippumatta. Tämä poistaa kertautuvan vaikutuksen, jossa jokainen laadun parannus nopeuttaa seuraavaa.
percentage-chance-of-change=Prosentuaalinen todennäköisyys, että laatumuutos onnistuu.\nVähimmäisarvo 0,0001%, enimmäisarvo 100% (aina muutos ajan kuluttua)
quality-increase-cost=Tämä lisää aikaa muutosyritysten välillä laatutasoa kohti. Tämä on kasvava kaava. Asettaminen 0%:iin pitää muutosyritysten välisen ajan samana laatutasosta riippumatta\n\n[color=green]Esimerkki 3 valmistustunnin tarpeella 50% kustannuksella per taso[/color]\n\nTavallinen: 3 tuntia\nEpätavallinen: 4,5 tuntia\nHarvinainen: 6,8 tuntia\nEeppinen: 10,1 tuntia\nLegendaarinen: 15,2 tuntia\nModattu laatutaso 10: 173 tuntia
quality-chance-accumulation-rate=Kontrolloi kuinka paljon todennäköisyys kasvaa jokaisen epäonnistuneen yrityksen jälkeen.\n\n[color=white]Ei mitään (oletus):[/color] Ei kertymää - todennäköisyys pysyy vakiona.\n\n[color=white]Matala (20%):[/color] Todennäköisyys kasvaa 20% perustasosta jokaisen epäonnistumisen jälkeen.\n\n[color=white]Keskitaso (50%):[/color] Todennäköisyys kasvaa 50% perustasosta jokaisen epäonnistumisen jälkeen.\n\n[color=white]Korkea (100%):[/color] Todennäköisyys kasvaa 100% perustasosta jokaisen epäonnistumisen jälkeen.\n\n[color=yellow]Esimerkki 1% perustodennäköisyydellä:[/color]\n\n[color=white]Matala:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Korkea:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nKaikki kertymäasetukset takaavat lopulta laatumuutokset - korkeammat asetukset vain saavuttavat 100% todennäköisyyden nopeammin
accumulate-at-max-quality=Maksimaatuisten kokoonpanokoneiden osallistuminen:\nKun käytössä, maksimaatuiset kokoonpanokoneet ja uunit jatkavat valmistustuntien seuraamista ja päivityskredittien tuottamista toissijaisille kohteille (kuten tarttureille, majakoille jne.), vaikka ne eivät voi itse enää päivittyä.\n\n[color=green]Käytössä (oletus):[/color] Maksimaatuiset kokoonpanokoneet jatkavat päivityskredittien tuottamista toissijaisille kohteille. Tämä voi tarjota tasaista edistymistä toissijaisille kohteille myöhäispelissä.\n\n[color=red]Pois käytöstä:[/color] Vain matalalaatuiset kokoonpanokoneet ja uunit, jotka voivat vielä päivittyä, tuottavat kredittejä, mutta ne tuotetaan suhteessa toissijaisiin kohteisiin, jotka tarvitsevat vielä päivityksiä. Äärimmäisessä tapauksessa tämä tarkoittaa, että yksi matalalaatuinen kokoonpanokone voisi edistää koko tehtaan toissijaisia kohteita.
change-modules-with-entity=Tämä kontrolloi vaikuttavatko laatumuutokset koneiden moduuleihin.\n\n[color=white]Pois käytöstä (oletus):[/color] Moduulit eivät muutu, kun isäntäkoneen laatu muuttuu.\n\n[color=white]Käytössä:[/color] Moduulit muuttuvat yhdellä tasolla, kun niiden isäntä muuttuu. Ne eivät ylitä isäntänsä laatutasoa.\n\n[color=white]Lisäkäytössä:[/color] Kuten Käytössä, mutta moduulit päivitetään vastaamaan isäntäkoneensa laatua aina kun laatumuutos tapahtuu.
batch-entities-per-tick=Kohteita käsiteltäväksi per tikki suorituskykypiikin välttämiseksi.\nVähimmäisarvo 1, enimmäisarvo 1000.\nKorkeammat arvot voivat aiheuttaa viivepiikkejä mutta käsittelevät kohteita nopeammin.
batch-ticks-between-processing=Tikkien määrä odotettavaksi eräkäsittelykierrosten välillä.\nVähimmäisarvo 1 tikki, enimmäisarvo 6000 tikkiä (~2,5 minuuttia).\nMatalammat arvot käsittelevät useammin mutta voivat vaikuttaa suorituskykyyn.
quality-change-aggregate-alerts-enabled=Näytä konsoli-ilmoitukset, jotka tiivistävät kaikki laatumuutokset (näytetään kerran 5 minuutissa). Esimerkki: "3 kokoonpanokonetta päivitetty, 2 tartturia päivitetty"
quality-change-entity-alerts-enabled=Näytä karttapingihälytykset yksittäisistä kohteista, kun niiden laatu muuttuu. Klikkaa hälytystä nähdäksesi päivitetyn kohteen.
quality_control_skip_hidden_qualities=Laadunvalvonta ohittaa piilotetut laadut (esim. kiiltävät variantit) päivitettäessä. Kohteet eivät koskaan muutu kiiltäviksi Laadunvalvonnan kautta - pelaajien on hankittava ne normaalisti. Tämä asetus koskee vain tilannetta, jossa sinulla on Shiny Mechanics -laatumodi asennettuna.
quality_control_hidden_qualities_sticky=Kohteet, joilla on piilotetut laadut (esim. kiiltävä), eivät päivity enää, säilyttäen niiden ainutlaatuiset edut. Tämä asetus koskee vain tilannetta, jossa sinulla on Shiny Mechanics -laatumodi asennettuna.
enable-accumulators=Ota käyttöön akkujen laatumuutokset.
enable-agricultural-towers=Ota käyttöön maatalouskylvötornien laatumuutokset.
enable-assembly-machines=Ota käyttöön kokoonpanokoneiden laatumuutokset.
enable-asteroid-collectors=Ota käyttöön asteroidinkeräilijöiden laatumuutokset.
asteroid-collector-growth-level-limit=Rajoittaa asteroidinkeräilijän laatukasvua oletusarvoihin pelin rikkoutumisen estämiseksi.\n\nModatuilla laatutasoilla asteroidinkeräilijöillä voi olla liian monta käsivartta, jotka liikkuvat liian nopeasti, eivätkä pysty tarttumaan asteroidinkappaleisiin ja aiheuttavat suuren UPS-rasituksen.\n\n[color=green]Oletus: legendaarinen[/color]
enable-beacons=Ota käyttöön majakoiden laatumuutokset.
enable-boilers=Ota käyttöön kattiloiden laatumuutokset.
enable-combinators-and-speakers=Ota käyttöön kombinaattorien ja kaiuttimien laatumuutokset.\n\nSisältää: aritmeettiset kombinaattorit, päätöskombinaiitorit, vakiokombinatorit, ohjelmoitavat kaiuttimet.
enable-pumps=Ota käyttöön pumppujen laatumuutokset (sisältää rannikko- ja nestepumput).
enable-furnaces=Ota käyttöön uunien laatumuutokset.
enable-generators=Ota käyttöön generaattorien laatumuutokset (höyrykoneet, höyryturbiinit, fuusiogeneraattorit).
enable-heat-pipes=Ota käyttöön lämpöputkien laatumuutokset.
enable-inserters=Ota käyttöön tartturejen laatumuutokset.
enable-labs=Ota käyttöön tutkimuslaboratorioiden laatumuutokset.
enable-lamps=Ota käyttöön lamppujen laatumuutokset.
enable-lightning-rods=Ota käyttöön salamansalpojen laatumuutokset.
enable-mining-drills=Ota käyttöön kaikkien porien laatumuutokset.
enable-poles=Ota käyttöön kaikkien sähköpylväiden laatumuutokset (sisältää isolet sähköpylväät ja muuntoasemat).
enable-power-switches=Ota käyttöön virtakytkimien laatumuutokset.
enable-radar=Ota käyttöön tutkien laatumuutokset.
radar-growth-level-limit=Rajoittaa tutkan laatukasvua liiallisen kartan tutkimisen estämiseksi ja tallennustiedostojen turvotuksen välttämiseksi.\n\nErittäin korkealla laatutasolla olevat tutkat voivat aiheuttaa suuria tallennustiedostoja (1,200mb+) liiallisen kartan tutkimisen takia.\n\n[color=green]Oletus: legendaarinen[/color]
lightning-attractor-growth-level-limit=Rajoittaa salamanvetoajan laatukasvua suorituskykyongelmien estämiseksi.\n\nErittäin korkealla laatutasolla olevilla salamanvetoajilla on merkittävästi suuremmat peittoalueet, mikä voi aiheuttaa viivepiikkejä yössä Fulgoralla.\n\n[color=green]Oletus: legendaarinen[/color]
enable-reactors=Ota käyttöön reaktorien laatumuutokset (ydinreaktorit, fuusioreaktorit).
enable-rocket-silos=Ota käyttöön rakettisiilojen laatumuutokset.
enable-roboports=Ota käyttöön robotporttien laatumuutokset.
enable-solar-panels=Ota käyttöön aurinkopaneelien laatumuutokset.
enable-thrusters=Ota käyttöön avaruustyöntimien laatumuutokset. Oletuksena pois käytöstä, koska avaruusaluksen nopeuden odottamaton muutos voi ylikuormittaa sen puolustuksen.
thruster-growth-level-limit=Rajoittaa avaruustyöntimen laatukasvua oletustasoihin puolustusongelmien estämiseksi.\n\nModatut laatutasot voivat liikuttaa avaruusaluksia merkittävästi nopeammin, mikä voi ylikuormittaa niiden puolustuksen.\n\n[color=green]Oletus: legendaarinen[/color]
enable-turrets=Ota käyttöön tykkien laatumuutokset.\n\nTykit ovat ensisijaisia kohteita, jotka tuottavat päivityskredittejä kertyneen aiheutetun vahingon perusteella.\n\nSisältää: ammustykit, lasertykit, liekinheittimet, tykistötykit.
turret-damage-per-manufacturing-hour=Vahingon määrä, jonka tykin täytyy aiheuttaa vastatakseen yhtä valmistustuntia.\n\nOletus: 36 000 vahinkoa (johdettu lävistävillä panoksilla: 450 lipasta/tunti × 80 vahinkoa/lipas).\n\nMatalammat arvot tekevät tykistä nopeammin kredittejä tuottavia. Korkeammat arvot hidastavat kredittien kertymistä.
turrets-contribute-credits=Määrittää, virtaavatko tornien ansaitsemat päivityshyvitykset myös jaettuun varantoon, joka päivittää toissijaisia kohteita (siirtimiä, sähköpylväitä jne.).\n\n[color=red]Pois käytöstä (oletus):[/color] Tornien hyvitykset pysyvät tornilla. Taisteluvahinko auttaa vain torneja päivittämään itseään.\n\n[color=green]Käytössä:[/color] Tornien hyvitykset virtaavat myös jaettuun varantoon, joten taisteluvahinko edistää toissijaisia kohteita samalla tavalla kuin valmistus.
enable-defense-walls-and-gates=Ota käyttöön seinien ja porttien laatumuutokset.\n\nSisältää: seinät, portit.
custom-upgrade-limit-a=Käytä tätä asettaaksesi mukautettuja rajoja kohteiden modattuihin laatuihin. Tarvitaan vain, jos käytössäsi on modi, joka lisää laatutasoja legendaarisen yläpuolelle ja haluat rajoittaa, kuinka paljon kohde päivittyy. Käytä tätä ominaisuutta asettamalla enimmäistaso tähän, siirry sitten kohteeseen, jota haluat rajoittaa, ja valitse pudotusvalikosta 'Mukautettu A'. Vertailun vuoksi legendaarinen on taso 5 (tavallinen = 1, epätavallinen = 2, harvinainen = 3, eeppinen = 4, legendaarinen = 5...).
custom-upgrade-limit-b=Käytä tätä asettaaksesi mukautettuja rajoja kohteiden modattuihin laatuihin. Tarvitaan vain, jos käytössäsi on modi, joka lisää laatutasoja legendaarisen yläpuolelle ja haluat rajoittaa, kuinka paljon kohde päivittyy. Käytä tätä ominaisuutta asettamalla enimmäistaso tähän, siirry sitten kohteeseen, jota haluat rajoittaa, ja valitse pudotusvalikosta 'Mukautettu B'. Vertailun vuoksi legendaarinen on taso 5 (tavallinen = 1, epätavallinen = 2, harvinainen = 3, eeppinen = 4, legendaarinen = 5...).
custom-upgrade-limit-c=Käytä tätä asettaaksesi mukautettuja rajoja kohteiden modattuihin laatuihin. Tarvitaan vain, jos käytössäsi on modi, joka lisää laatutasoja legendaarisen yläpuolelle ja haluat rajoittaa, kuinka paljon kohde päivittyy. Käytä tätä ominaisuutta asettamalla enimmäistaso tähän, siirry sitten kohteeseen, jota haluat rajoittaa, ja valitse pudotusvalikosta 'Mukautettu C'. Vertailun vuoksi legendaarinen on taso 5 (tavallinen = 1, epätavallinen = 2, harvinainen = 3, eeppinen = 4, legendaarinen = 5...).
upgrade-limit-accumulators=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-agricultural-towers=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-assembly-machines=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-beacons=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-boilers=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-combinators-and-speakers=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.\n\nSisältää: aritmeettiset yhdistimet, päättävät yhdistimet, vakioyhdistimet, ohjelmoitavat kaiuttimet.
upgrade-limit-defense-walls-and-gates=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.\n\nSisältää: muurit, portit.
upgrade-limit-furnaces=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-generators=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.\n\nSisältää: höyrykoneet, höyryturbiinit, fuusiogeneraattorit.
upgrade-limit-heat-pipes=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-inserters=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-labs=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-lamps=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-mining-drills=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-poles=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.\n\nSisältää: kaikki sähköpylväät, suuret sähköpylväät ja muuntoasemat.
upgrade-limit-power-switches=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-pumps=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.\n\nSisältää: rantapumput ja nestepumput.
upgrade-limit-reactors=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.\n\nSisältää: ydinreaktorit, fuusioreaktorit.
upgrade-limit-rocket-silos=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-roboports=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-solar-panels=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.
upgrade-limit-turrets=Laadunvalvonta päivittää nämä kohteet tähän laatuun asti ja lopettaa sitten päivitysyritykset. Aseta tämä arvoon Tavallinen estääksesi kaikki päivitysyritykset. Mukautetut arvot käyttävät Mukautettu päivitysraja A/B/C -asetuksia.\n\nSisältää: ammustornit, lasertornit, liekinheittimet, tykistötornit.
upgrade-limit-asteroid-collectors=Rajoittaa asteroidinkeräilijän laatukasvua oletusarvoihin pelin rikkoutumisen estämiseksi.\n\nModatuilla laatutasoilla asteroidinkeräilijöillä voi olla liian monta käsivartta, jotka liikkuvat liian nopeasti, eivätkä pysty tarttumaan asteroidinkappaleisiin ja aiheuttavat suuren UPS-rasituksen.\n\n[color=green]Oletus: legendaarinen[/color]
upgrade-limit-radar=Rajoittaa tutkan laatukasvua liiallisen kartan tutkimisen estämiseksi ja tallennustiedostojen turvotuksen välttämiseksi.\n\nErittäin korkealla laatutasolla olevat tutkat voivat aiheuttaa suuria tallennustiedostoja (1,200mb+) liiallisen kartan tutkimisen takia.\n\n[color=green]Oletus: legendaarinen[/color]
upgrade-limit-lightning-rods=Rajoittaa salamanvetoajan laatukasvua suorituskykyongelmien estämiseksi.\n\nErittäin korkealla laatutasolla olevilla salamanvetoajilla on merkittävästi suuremmat peittoalueet, mikä voi aiheuttaa viivepiikkejä yössä Fulgoralla.\n\n[color=green]Oletus: legendaarinen[/color]
upgrade-limit-thrusters=Rajoittaa avaruustyöntimen laatukasvua oletustasoihin puolustusongelmien estämiseksi.\n\nModatut laatutasot voivat liikuttaa avaruusaluksia merkittävästi nopeammin, mikä voi ylikuormittaa niiden puolustuksen.\n\n[color=green]Oletus: legendaarinen[/color]

