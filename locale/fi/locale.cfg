[mod-setting-description]
manufacturing-hours-for-change=Valmistustuntien määrä, joka vaaditaan laatumuutoksen yrittämiseen.\nValmistustunteja kertyy vain, kun kone on aktiivisesti käynnissä. Jos kone on joutilaana, eteneminen pysähtyy.\nVähimmäisarvo 0,001 tuntia (3,6 sekuntia), enimmäisarvo 1000 tuntia.
crafting-speed-affects-progression=[color=red]Pois käytöstä (oletus):[/color] Valmistusnopeus ei vaikuta etenemiseen, mikä auttaa jakamaan päivitykset tasaisemmin pitkän pelin ajalle.\n\n[color=green]Käytössä:[/color] Valmistusnopeus ja tuottavuus lisäävät kertyviä valmistustunteja. Nopeus 4 ja tuottavuus 50 % kerryttävät valmistustunteja kuusi kertaa niin paljon kuin nopeus 1 ilman tuottavuusbonusta. Laatupäivitysten tuomat nopeuden lisäykset voivat kertautua, mikä johtaa erittäin nopeisiin päivityksiin loppupelissä.
percentage-chance-of-change=Päivitysyrityksen onnistumisen todennäköisyys.
quality-increase-cost=Tarvittavien valmistustuntien kasvu laatutasoa kohti. Kasvu kertautuu; 0 % pitää vaatimuksen samana kaikilla tasoilla.\n\nArvolla 50 % kolmen tunnin vaatimus kasvaa 4,5 tuntiin epätavallisella ja 6,75 tuntiin harvinaisella tasolla.
quality-chance-accumulation-rate=Kasvattaa päivityksen todennäköisyyttä epäonnistuneen yrityksen jälkeen prosenttiosuudella perustodennäköisyydestä.\n\n[color=white]Ei mitään:[/color] Todennäköisyys pysyy vakiona.\n[color=white]Matala:[/color] Lisää 20 % perustodennäköisyydestä.\n[color=white]Keskitaso:[/color] Lisää 50 % perustodennäköisyydestä.\n[color=white]Korkea:[/color] Lisää 100 % perustodennäköisyydestä.\n\nKun perustodennäköisyys on 1 %, matala antaa 1 % → 1,2 % → 1,4 %... ja korkea 1 % → 2 % → 3 %...
secondary-progression-rate=Niiden kohteiden etenemisnopeus, jotka eivät voi mitata omaa työtään, kuten tartturit, pylväät ja majakat.\n\n100 % vastaa samalla pinnalla olevien ensisijaisten kohteiden keskimääräistä valmistustuntien kertymää. Suuremmat arvot nopeuttavat etenemistä; 0 % pysäyttää sen.
change-modules-with-entity=[color=white]Pois käytöstä:[/color] Moduulit eivät päivity.\n\n[color=white]Käytössä:[/color] Moduulit päivittyvät yhden tason, kun niiden kone päivittyy, enintään koneen laatutasolle.\n\n[color=white]Lisäkäytössä:[/color] Moduulit päivittyvät vastaamaan koneensa uutta laatua.\n\n[color=white]Itsenäinen:[/color] Moduulit saavat omia päivitysyrityksiä toissijaisesta etenemisestä ja voivat ylittää koneensa laaturajan. Koneen rajan asettaminen tavalliseksi poistaa myös moduulien päivitykset käytöstä.
batch-entities-per-tick=Kussakin erässä käsiteltävien kohteiden määrä. Suuremmat erät käsittelevät päivitykset nopeammin, mutta voivat aiheuttaa viivettä. Itsenäinen-tilassa myös moduulipaikat lasketaan mukaan.
batch-ticks-between-processing=Tikkien määrä käsittelyerien välillä. Lyhyemmät välit käsittelevät päivityksiä useammin, mutta voivat heikentää suorituskykyä.
quality-change-aggregate-alerts-enabled=Näytä yhteenveto päivityksistä viiden minuutin välein.
quality-change-entity-alerts-enabled=Näytä karttahälytyskuvakkeet päivitysten sijainneissa.
quality-change-chat-enabled=Näytä päivitysilmoitukset, joissa on kohteen tai moduulin kuvake, laatukuvakkeet ja satunnaisin sateenkaaren värein väritetyt kirjaimet.
quality-change-gps-enabled=Näytä napsautettava sijaintilinkki ja laukaise Factorion GPS-karttapingi jokaisesta päivityksestä. Palaa sijaintiin napsauttamalla linkkiä. Lisää linkin värikkääseen päivitysilmoitukseen, kun se on käytössä; muulloin näyttää vain linkin. Pelin oma GPS-pingi vaatii keskustelulinkin.
quality-change-floating-text-enabled=Näytä nouseva päivitysteksti uuden laadun värisenä.
quality-change-halo-enabled=Näytä laajeneva kehä uuden laadun värisenä päivitysten sijainneissa.
quality-change-rainbow-enabled=Näytä laajenevat sateenkaarirenkaat päivitysten sijainneissa.
quality-change-badge-enabled=Näytä uuden laadun kuvake, joka kasvaa ja nousee 4,5 sekunnin ajan ja pyörii jatkuvasti häipyessään.
quality-change-bubbles-enabled=Vapauta päivitysten sijainneissa uuden laadun pieniä kuvakkeita, jotka leijuvat ylöspäin kuin kuplat.
quality-change-sound-enabled=Toista valittu ääni päivityksistä sillä pinnalla, jota parhaillaan katselet, myös etänäkymässä.
quality-change-sound=Valitse ilmoitustehoste, kaiuttimen hälytys, rummun ääni tai soitin. Soittimet käyttävät asetuksia Soittimen sävel / perussävel ja Sävelten toiminta. Ääni kuuluu vain, kun päivitysääni on käytössä ja päivitys tapahtuu parhaillaan katselemallasi pinnalla.
quality-change-sound-note=Kiinteä sävel tai sävelkuvioiden perussävel (sävellaji ja aloitusrekisteri). Ei vaikuta hälytyksiin, rumpuihin, tehosteisiin eikä Täysin satunnainen -tilaan.\nSävelet nousevat puolisävelaskelittain F:stä: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; lisää 12 saadaksesi seuraavan oktaavin. Oletus: 20 (C).\nPianossa on 48 säveltä ja muissa soittimissa 36. Kiinteä-tila rajoittaa sävelen korkeimpaan käytettävissä olevaan säveleen. Sävelkuvioita siirretään tarvittaessa kokonaisia oktaaveja alaspäin sävellaji säilyttäen. Samat asetukset tuottavat vastaavat kuviot kunkin soittimen omassa rekisterissä.
quality-change-sound-mode=Yksi sävel jokaista kuuluvaa päivitystä kohti, erillinen kuvio kullekin pelaajalle. Kiinteä sävel säilyttää valitun sävelen; Musiikillinen vaeltelu liikkuu yhden tai kaksi asteikon askelta; Tuulikellot valitsee satunnaisia duuripentatonisia säveliä; Portaat nousee ja laskee toistuvasti; Satunnainen asteikossa valitsee sävelen valitusta asteikosta ja sävelalueesta; Täysin satunnainen käyttää soittimen koko sävelaluetta.\nVaeltelu ja Portaat alkavat perussävelestä ja jatkuvat hiljaisten jaksojen ja tallennuksen tai latauksen jälkeen. Viivästettyjä säveliä ei aseteta jonoon. Vaikuttaa vain soittimiin.
quality-change-sound-scale=Soittimen säveleen / perussäveleen perustuva asteikko, jota käyttävät Musiikillinen vaeltelu, Portaat ja Satunnainen asteikossa. Kromaattinen sallii kaikki puolisävelaskeleet. Tuulikellot käyttää aina duuripentatonista asteikkoa; Kiinteä sävel ja Täysin satunnainen ohittavat tämän asetuksen.
quality-change-sound-range=Yksi tai kaksi perussävelestä alkavaa oktaavia, joita siirretään tarvittaessa kokonaisia oktaaveja alaspäin soittimen alueelle sopiviksi, tai soittimen koko sävelalue. Vaikuttaa tiloihin Musiikillinen vaeltelu, Tuulikellot, Portaat ja Satunnainen asteikossa. Kiinteä sävel ja Täysin satunnainen ohittavat tämän asetuksen.
quality_control_skip_hidden_qualities=Ohita piilotetut laadut, kuten kiiltävät variantit, päivitettäessä. Tämä asetus koskee vain tilannetta, jossa sinulla on asennettuna Shiny Mechanicsin kaltainen modi.
quality_control_hidden_qualities_sticky==Kohteet, joilla on piilotettu laatu, kuten kiiltävä, eivät päivity enää, joten niiden ainutlaatuiset edut säilyvät. Tämä asetus koskee vain tilannetta, jossa sinulla on asennettuna Shiny Mechanicsin kaltainen modi.
enable-accumulators=Ota käyttöön akkujen päivitykset.
enable-agricultural-towers=Ota käyttöön maatalouskylvötornien päivitykset.
enable-assembly-machines=Ota käyttöön kokoonpanokoneiden päivitykset.
enable-asteroid-collectors=Ota käyttöön asteroidinkeräilijöiden päivitykset.
asteroid-collector-growth-level-limit=Rajoittaa asteroidinkeräilijän laatukasvua oletusarvoihin pelin rikkoutumisen estämiseksi.\n\nModatuilla laatutasoilla asteroidinkeräilijöillä voi olla liian monta käsivartta, jotka liikkuvat liian nopeasti, eivätkä pysty tarttumaan asteroidinkappaleisiin ja aiheuttavat suuren UPS-rasituksen.\n\n[color=green]Oletus: legendaarinen[/color]
enable-beacons=Ota käyttöön majakoiden päivitykset.
enable-boilers=Ota käyttöön kattiloiden päivitykset.
enable-combinators-and-speakers=Ota käyttöön kombinaattorien ja ohjelmoitavien kaiuttimien päivitykset.
enable-pumps=Ota käyttöön rantapumppujen ja nestepumppujen päivitykset.
enable-furnaces=Ota käyttöön uunien päivitykset.
enable-generators=Ota käyttöön höyrykoneiden, höyryturbiinien ja fuusiogeneraattorien päivitykset.
enable-heat-pipes=Ota käyttöön lämpöputkien päivitykset.
enable-inserters=Ota käyttöön tartturien päivitykset.
enable-labs=Ota käyttöön tutkimuslaboratorioiden päivitykset.
enable-lamps=Ota käyttöön lamppujen päivitykset.
enable-lightning-rods=Ota käyttöön salamansalpojen päivitykset.
enable-mining-drills=Ota käyttöön porien päivitykset.
enable-poles=Ota käyttöön sähköpylväiden ja muuntoasemien päivitykset.
enable-power-switches=Ota käyttöön virtakytkimien päivitykset.
enable-radar=Ota käyttöön tutkien päivitykset.
radar-growth-level-limit=Rajoittaa tutkan laatukasvua liiallisen kartan tutkimisen estämiseksi ja tallennustiedostojen turvotuksen välttämiseksi.\n\nErittäin korkealla laatutasolla olevat tutkat voivat aiheuttaa suuria tallennustiedostoja (1,200mb+) liiallisen kartan tutkimisen takia.\n\n[color=green]Oletus: legendaarinen[/color]
lightning-attractor-growth-level-limit=Rajoittaa salamanvetoajan laatukasvua suorituskykyongelmien estämiseksi.\n\nErittäin korkealla laatutasolla olevilla salamanvetoajilla on merkittävästi suuremmat peittoalueet, mikä voi aiheuttaa viivepiikkejä yössä Fulgoralla.\n\n[color=green]Oletus: legendaarinen[/color]
enable-reactors=Ota käyttöön ydinreaktorien ja fuusioreaktorien päivitykset.
enable-rocket-silos=Ota käyttöön rakettisiilojen päivitykset.
enable-roboports=Ota käyttöön robottiporttien päivitykset.
enable-solar-panels=Ota käyttöön aurinkopaneelien päivitykset.
enable-thrusters=Ota käyttöön avaruustyöntimien päivitykset. Nopeammat alukset voivat ylikuormittaa puolustuksensa.
thruster-growth-level-limit=Rajoita halutessasi avaruustyöntimet pelin oletuslaatutasolle. Modatut laatutasot voivat liikuttaa avaruusaluksia huomattavasti nopeammin, mikä voi ylikuormittaa niiden puolustuksen.
enable-turrets=Ota käyttöön ammustornien, lasertornien, liekinheittimien ja tykistötornien päivitykset. Tornit ansaitsevat 'valmistustunteja' aiheuttamalla vahinkoa.
turret-damage-per-manufacturing-hour=Vahingon määrä, joka tornin on aiheutettava ansaitakseen yhden valmistustunnin.\n\nOletus: 36 000 vahinkoa (perustuu siihen, kuinka paljon lävistäviä panoksia perustason kasauskone voi valmistaa tunnissa).
turrets-contribute-credits=Anna tornien edistää samalla pinnalla olevien toissijaisten kohteiden, kuten tartturien ja sähköpylväiden, päivityksiä. Tämä voi nopeuttaa päivityksiä huomattavasti pelin loppuvaiheessa kiskotykien ja salamatornien avulla.
enable-defense-walls-and-gates=Ota käyttöön muurien ja porttien päivitykset.
custom-upgrade-limit-a=Alla olevien rajoittimien 'Mukautettu A' -asetuksen käyttämä enimmäislaatutaso. Tarvitaan vain, jos käytössäsi on modi, joka lisää laatutasoja legendaarisen yläpuolelle, ja haluat rajoittaa kohteen päivitystasoa. Voit esimerkiksi sallia asteroidinkeräilijöiden päivittyä tasolle 10. Aseta enimmäistaso tähän, siirry sitten kohteeseen, jota haluat rajoittaa, ja valitse pudotusvalikosta 'Mukautettu A'. Vertailun vuoksi legendaarinen on taso 5.
custom-upgrade-limit-b=Päivitysrajojen Mukautettu B -asetuksen käyttämä enimmäislaatutaso.
custom-upgrade-limit-c=Päivitysrajojen Mukautettu C -asetuksen käyttämä enimmäislaatutaso.
upgrade-limit-accumulators=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-agricultural-towers=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-assembly-machines=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-beacons=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-boilers=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-combinators-and-speakers=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.\n\nSisältää: aritmeettiset yhdistimet, päättävät yhdistimet, vakioyhdistimet, ohjelmoitavat kaiuttimet.
upgrade-limit-defense-walls-and-gates=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-furnaces=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-generators=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.\n\nSisältää: höyrykoneet, höyryturbiinit, fuusiogeneraattorit.
upgrade-limit-heat-pipes=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-inserters=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-labs=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-lamps=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-mining-drills=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-poles=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.\n\nSisältää sähköpylväät ja muuntoasemat.
upgrade-limit-power-switches=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-pumps=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.\n\nSisältää: rantapumput ja nestepumput.
upgrade-limit-reactors=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.\n\nSisältää: ydinreaktorit, fuusioreaktorit.
upgrade-limit-rocket-silos=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-roboports=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-solar-panels=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.
upgrade-limit-turrets=Näiden kohteiden enimmäislaatutaso. Tavallinen poistaa päivitykset käytöstä; Mukautettu A/B/C käyttää yllä määritettyä tasoa.\n\nSisältää: ammustornit, lasertornit, liekinheittimet, tykistötornit.
upgrade-limit-asteroid-collectors=Rajoita asteroidinkeräilijät legendaariselle tasolle pelin rikkoutumisen estämiseksi. Modatut tasot voivat luoda liikaa liian nopeasti liikkuvia käsivarsia, jotka eivät pysty tarttumaan asteroidinkappaleisiin ja aiheuttavat suuren UPS-rasituksen.
upgrade-limit-radar=Rajoita tutkat legendaariselle tasolle tallennustiedoston paisumisen estämiseksi. Modatut laadut voivat aiheuttaa liiallista kartan tutkimista, mikä voi kasvattaa tiedoston hyvin suureksi (yli gigatavun).
upgrade-limit-lightning-rods=Rajoita salamanvetoajat legendaariselle tasolle UPS-piikkien estämiseksi. Modatuilla laatutasoilla salamanvetoajien peittoalueet ovat huomattavasti suurempia, mikä voi aiheuttaa viivepiikkejä öisin Fulgoralla.
upgrade-limit-thrusters=Rajoita avaruustyöntimet legendaariselle tasolle avaruusalustan odottamattomien vaurioiden estämiseksi. Modatut laatutasot voivat liikuttaa avaruusaluksia huomattavasti nopeammin, mikä voi ylikuormittaa niiden puolustuksen.

