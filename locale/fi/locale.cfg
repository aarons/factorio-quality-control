# Tämä käännös on luotu tekoälyn avulla. Korjaukset ovat erittäin tervetulleita! Ole hyvä ja anna palautetta modin keskustelufoorumilla (https://mods.factorio.com/mod/quality-control/discussion) tai ongelmana github-repositoryssa (https://github.com/aarons/factorio-quality-control/issues). Pahoittelen mahdolliset virheet!

