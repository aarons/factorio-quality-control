upgrade-limit-power-switches=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.
