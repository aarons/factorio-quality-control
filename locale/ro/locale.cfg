[mod-setting-description]
manufacturing-hours-for-change=Numărul de ore de fabricație necesare pentru ca o schimbare de calitate să fie încercată.\nOrele de fabricație se acumulează doar atunci când mașina lucrează activ. Dacă este inactivă, nu va progresa.\nValoarea minimă 0,001 ore (3,6 secunde), Valoarea maximă 1000 ore.
crafting-speed-affects-progression=[color=red]Dezactivat (implicit):[/color] Viteza de fabricație nu afectează progresia, ceea ce ajută la distribuirea mai uniformă a îmbunătățirilor pe parcursul unui joc mai lung.\n\n[color=green]Activat:[/color] Viteza de fabricație și productivitatea măresc numărul de ore de fabricație câștigate. Viteza 4 cu productivitate 50% câștigă de șase ori mai mult decât viteza 1 fără bonus de productivitate. Creșterile de viteză datorate îmbunătățirilor de calitate se pot cumula, ducând la îmbunătățiri foarte rapide în fazele târzii ale jocului.
percentage-chance-of-change=Șansa de reușită a unei încercări de îmbunătățire.
quality-increase-cost=Creșterea numărului de ore de fabricație necesare pentru fiecare nivel de calitate. Creșterea este cumulativă; la 0%, necesarul rămâne același la toate nivelurile.\n\nLa 50%, un necesar de 3 ore devine 4,5 ore la neobișnuită și 6,75 ore la rară.
quality-chance-accumulation-rate=Crește șansa de îmbunătățire după o încercare eșuată cu un procent din șansa de bază.\n\n[color=white]Niciunul:[/color] Șansa rămâne constantă.\n[color=white]Scăzut:[/color] Adaugă 20% din șansa de bază.\n[color=white]Mediu:[/color] Adaugă 50% din șansa de bază.\n[color=white]Înalt:[/color] Adaugă 100% din șansa de bază.\n\nCu o șansă de bază de 1%, Scăzut dă 1% → 1,2% → 1,4%... iar Înalt dă 1% → 2% → 3%...
secondary-progression-rate=Viteza de progresie pentru entitățile care nu își pot măsura propria muncă, precum inseratoarele, stâlpii și balizele.\n\nLa 100%, corespunde mediei orelor de fabricație câștigate de entitățile primare de pe aceeași suprafață. Valorile mai mari accelerează progresia; 0% o întrerupe.
change-modules-with-entity=[color=white]Dezactivat:[/color] Modulele nu se îmbunătățesc.\n\n[color=white]Activat:[/color] Modulele se îmbunătățesc cu un nivel când mașina lor se îmbunătățește, până la calitatea mașinii.\n\n[color=white]Extra Activat:[/color] Modulele se îmbunătățesc până la noua calitate a mașinii lor.\n\n[color=white]Independent:[/color] Modulele câștigă propriile încercări de îmbunătățire prin progresia secundară și pot depăși limita de calitate a mașinii. Setarea limitei mașinii la Obișnuită dezactivează și îmbunătățirea modulelor.
batch-entities-per-tick=Entități procesate pe lot. Loturile mai mari procesează îmbunătățirile mai repede, dar pot cauza lag. Sloturile de module sunt incluse și ele în modul Independent.
batch-ticks-between-processing=Tick-uri între procesările loturilor. Intervalele mai scurte procesează îmbunătățirile mai frecvent, dar pot reduce performanța.
quality-change-aggregate-alerts-enabled=Afișează un rezumat al îmbunătățirilor la fiecare cinci minute.
quality-change-entity-alerts-enabled=Arată pictograme de alertă pe hartă în locurile îmbunătățirilor.
quality-change-chat-enabled=Afișează mesaje de îmbunătățire cu pictograme de entități sau module, pictograme de calitate și litere colorate aleatoriu în culorile curcubeului.
quality-change-gps-enabled=Afișează un link accesibil prin clic către locație și declanșează un ping GPS pe harta Factorio pentru fiecare îmbunătățire. Apasă pe link pentru a reveni la locație. Adaugă linkul la mesajul colorat de îmbunătățire din chat când acesta este activat; altfel afișează doar linkul. Ping-ul GPS nativ necesită un link în chat.
quality-change-floating-text-enabled=Arată un text de îmbunătățire care se ridică, în culoarea noii calități.
quality-change-halo-enabled=Arată un halou care se extinde, în culoarea noii calități, la locurile îmbunătățirilor.
quality-change-rainbow-enabled=Arată inele curcubeu care se extind la locurile îmbunătățirilor.
quality-change-badge-enabled=Arată pictograma noii calități crescând și ridicându-se timp de 4,5 secunde, rotindu-se continuu în timp ce dispare.
quality-change-bubbles-enabled=Eliberează la locurile îmbunătățirilor un șir de pictograme mici ale noii calități, care se ridică precum bulele.
quality-change-sound-enabled=Redă sunetul selectat pentru îmbunătățirile de pe suprafața vizualizată în prezent, inclusiv în vizualizarea la distanță.
quality-change-sound=Alege un efect de notificare, o alarmă de difuzor, un sunet de tobă sau un instrument muzical. Instrumentele folosesc Nota instrumentului / Tonica și Comportamentul notelor. Sunetul este redat doar când este activat pentru îmbunătățirile de pe suprafața vizualizată în prezent.
quality-change-sound-note=Nota fixă sau tonica (tonalitatea și registrul de pornire) pentru tiparele muzicale. Ignorată pentru alarme, tobe, efecte și modul Complet aleatoriu.\nNotele urcă în semitonuri de la F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; adaugă 12 pentru octava următoare. Implicit: 20 (C).\nPianul are 48 de note; celelalte instrumente au 36. Modul Notă fixă limitează nota la cea mai înaltă disponibilă. Tiparele muzicale sunt coborâte cu octave întregi când este necesar, păstrând tonalitatea. Aceleași setări produc tipare echivalente în registrul propriu fiecărui instrument.
quality-change-sound-mode=O notă pentru fiecare îmbunătățire audibilă, cu un tipar separat pentru fiecare jucător. Notă fixă păstrează nota selectată; Plimbare muzicală se deplasează cu una sau două trepte ale gamei; Clopoței de vânt alege note aleatorii din gama pentatonică majoră; Scară urcă și coboară repetat; Aleatoriu în gamă alege orice notă din gama și ambitusul selectate; Complet aleatoriu folosește întregul ambitus al instrumentului.\nPlimbarea muzicală și Scara încep de la tonică și se reiau după perioadele de liniște și după salvare/încărcare. Nu sunt puse în așteptare note întârziate. Afectează doar instrumentele muzicale.
quality-change-sound-scale=Gama relativă la Nota instrumentului / Tonica, folosită de Plimbare muzicală, Scară și Aleatoriu în gamă. Cromatică permite toate semitonurile. Clopoței de vânt folosește întotdeauna gama pentatonică majoră; Notă fixă și Complet aleatoriu ignoră această setare.
quality-change-sound-range=Una sau două octave începând de la tonică, coborâte cu octave întregi dacă este necesar pentru a se încadra în ambitusul instrumentului; sau întregul ambitus al instrumentului. Se aplică pentru Plimbare muzicală, Clopoței de vânt, Scară și Aleatoriu în gamă. Notă fixă și Complet aleatoriu ignoră această setare.
quality_control_skip_hidden_qualities=Omite calitățile ascunse (de exemplu, variantele strălucitoare) la îmbunătățire. Această setare se aplică numai când aveți instalat un mod precum Shiny Mechanics.
quality_control_hidden_qualities_sticky==Entitățile cu calități ascunse (de exemplu, strălucitoare) nu se vor îmbunătăți mai departe, păstrându-și beneficiile unice. Această setare se aplică numai când aveți instalat un mod precum Shiny Mechanics.
enable-accumulators=Activează îmbunătățirile pentru acumulatori.
enable-agricultural-towers=Activează îmbunătățirile pentru turnurile agricole.
enable-assembly-machines=Activează îmbunătățirile pentru mașinile de asamblare.
enable-asteroid-collectors=Activează îmbunătățirile pentru colectoarele de asteroizi.
asteroid-collector-growth-level-limit=Limitează creșterea calității colectoarelor de asteroizi la valorile vanilla pentru a preveni probleme ce pot strica jocul.\n\nColectoarele de asteroizi cu niveluri de calitate modificate pot avea prea multe brațe care se mișcă prea repede, devenind incapabile să prindă fragmente de asteroizi și creând o scurgere mare de UPS.\n\n[color=green]Implicit: legendară[/color]
enable-beacons=Activează îmbunătățirile pentru balize.
enable-boilers=Activează îmbunătățirile pentru cazane.
enable-combinators-and-speakers=Activează îmbunătățirile pentru combinatoare și difuzoare programabile.
enable-pumps=Activează îmbunătățirile pentru pompele de țărm și pompele de fluid.
enable-furnaces=Activează îmbunătățirile pentru cuptoare.
enable-generators=Activează îmbunătățirile pentru motoare cu abur, turbine cu abur și generatoare cu fuziune.
enable-heat-pipes=Activează îmbunătățirile pentru țevile de căldură.
enable-inserters=Activează îmbunătățirile pentru inseratoare.
enable-labs=Activează îmbunătățirile pentru laboratoarele de cercetare.
enable-lamps=Activează îmbunătățirile pentru lămpi.
enable-lightning-rods=Activează îmbunătățirile pentru paratrăznete.
enable-mining-drills=Activează îmbunătățirile pentru burghiurile de minerit.
enable-poles=Activează îmbunătățirile pentru stâlpii electrici și substații.
enable-power-switches=Activează îmbunătățirile pentru întrerupătoarele de curent.
enable-radar=Activează îmbunătățirile pentru stațiile radar.
radar-growth-level-limit=Limitează creșterea calității radarului pentru a preveni explorarea excesivă a hărții și umflarea fișierelor de salvare.\n\nRadarurile cu nivele de calitate foarte înalte pot cauza fișiere de salvare mari (1.200mb+) din cauza explorării excesive a hărții.\n\n[color=green]Implicit: legendară[/color]
lightning-attractor-growth-level-limit=Limitează creșterea calității atrăgătoarelor de fulgere pentru a preveni problemele de performanță.\n\nAtrăgătoarele de fulgere cu nivele de calitate foarte înalte au zone de acoperire semnificativ mărită, ceea ce poate cauza lag-uri noaptea pe Fulgora.\n\n[color=green]Implicit: legendară[/color]
enable-reactors=Activează îmbunătățirile pentru reactoarele nucleare și cu fuziune.
enable-rocket-silos=Activează îmbunătățirile pentru silozurile de rachete.
enable-roboports=Activează îmbunătățirile pentru roboporturi.
enable-solar-panels=Activează îmbunătățirile pentru panourile solare.
enable-thrusters=Activează îmbunătățirile pentru propulsoarele spațiale. Navele mai rapide își pot copleși apărarea.
thruster-growth-level-limit=Limitează opțional propulsoarele spațiale la nivelurile vanilla. Nivelurile de calitate adăugate de moduri pot face navele spațiale mult mai rapide, ceea ce le poate copleși apărarea.
enable-turrets=Activează îmbunătățirile pentru turelele cu muniție, laser, cu aruncător de flăcări și de artilerie. Turelele câștigă 'ore de fabricație' provocând daune.
turret-damage-per-manufacturing-hour=Cantitatea de daune pe care o turelă trebuie să le provoace pentru a câștiga o oră de fabricație.\n\nImplicit: 36.000 de daune (calculat pe baza cantității de cartușe perforante pe care o mașină de asamblare de bază le poate produce într-o oră).
turrets-contribute-credits=Permite turelelor să contribuie la îmbunătățirile entităților secundare, precum inseratoarele și stâlpii electrici, de pe aceeași suprafață. Acest lucru poate accelera mult îmbunătățirile în faza târzie a jocului, cu tunuri electromagnetice și turele cu fulgere.
enable-defense-walls-and-gates=Activează îmbunătățirile pentru ziduri și porți.
custom-upgrade-limit-a=Nivelul maxim de calitate folosit de setarea 'Personalizat A' în limitatoarele de mai jos. Este necesar doar când ai un mod care adaugă niveluri de calitate dincolo de legendară și vrei să limitezi nivelul până la care se poate îmbunătăți o entitate. De exemplu, dacă vrei să permiți colectoarelor de asteroizi să ajungă la nivelul 10. Setează aici nivelul maxim, apoi mergi la entitatea pe care vrei să o limitezi și selectează 'Personalizat A' din meniul derulant. Ca referință, legendară este nivelul 5.
custom-upgrade-limit-b=Nivelul maxim de calitate folosit de Personalizat B în setările limitelor de îmbunătățire.
custom-upgrade-limit-c=Nivelul maxim de calitate folosit de Personalizat C în setările limitelor de îmbunătățire.
upgrade-limit-accumulators=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-agricultural-towers=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-assembly-machines=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-beacons=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-boilers=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-combinators-and-speakers=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.\n\nInclude: combinatoare aritmetice, combinatoare de decizie, combinatoare constante, difuzoare programabile.
upgrade-limit-defense-walls-and-gates=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-furnaces=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-generators=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.\n\nInclude: motoare cu abur, turbine cu abur, generatoare cu fuziune.
upgrade-limit-heat-pipes=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-inserters=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-labs=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-lamps=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-mining-drills=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-poles=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.\n\nInclude stâlpii electrici și substațiile.
upgrade-limit-power-switches=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-pumps=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.\n\nInclude: pompe de țărm și pompe de fluid.
upgrade-limit-reactors=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.\n\nInclude: reactoare nucleare, reactoare cu fuziune.
upgrade-limit-rocket-silos=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-roboports=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-solar-panels=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.
upgrade-limit-turrets=Calitatea maximă de îmbunătățire pentru aceste entități. Obișnuită dezactivează îmbunătățirile; Personalizat A/B/C folosește nivelul personalizat specificat mai sus.\n\nInclude: turele cu muniție, turele laser, aruncătoare de flăcări, turele de artilerie.
upgrade-limit-asteroid-collectors=Limitează colectoarele de asteroizi la calitatea legendară pentru a preveni problemele care pot strica jocul. Nivelurile adăugate de moduri pot crea prea multe brațe care se mișcă prea repede, devenind incapabile să prindă fragmente de asteroizi și reducând considerabil UPS-ul.
upgrade-limit-radar=Limitează radarele la calitatea legendară pentru a preveni creșterea excesivă a fișierelor de salvare. Calitățile adăugate de moduri pot duce la explorarea excesivă a hărții și la fișiere foarte mari, de peste un gigabyte.
upgrade-limit-lightning-rods=Limitează atrăgătoarele de fulgere la calitatea legendară pentru a preveni problemele de UPS. Atrăgătoarele cu niveluri de calitate adăugate de moduri au zone de acoperire mult mai mari, ceea ce poate cauza lag noaptea pe Fulgora.
upgrade-limit-thrusters=Limitează propulsoarele spațiale la calitatea legendară pentru a preveni deteriorarea neașteptată a platformelor spațiale. Nivelurile de calitate adăugate de moduri pot face navele spațiale mult mai rapide, ceea ce le poate copleși apărarea.

