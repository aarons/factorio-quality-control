upgrade-limit-turrets=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.\n\nInclude: turele cu muniție, turele laser, aruncătoare de flăcări, turele de artilerie.
upgrade-limit-asteroid-collectors=Limitează creșterea calității colectoarelor de asteroizi la valorile vanilla pentru a preveni probleme ce pot strica jocul.\n\nColectoarele de asteroizi cu niveluri de calitate modificate pot avea prea multe brațe care se mișcă prea repede, devenind incapabile să prindă fragmente de asteroizi și creând o scurgere mare de UPS.\n\n[color=green]Implicit: legendară[/color]
upgrade-limit-radar=Limitează creșterea calității radarului pentru a preveni explorarea excesivă a hărții și umflarea fișierelor de salvare.\n\nRadarurile cu nivele de calitate foarte înalte pot cauza fișiere de salvare mari (1.200mb+) din cauza explorării excesive a hărții.\n\n[color=green]Implicit: legendară[/color]
upgrade-limit-lightning-rods=Limitează creșterea calității atrăgătoarelor de fulgere pentru a preveni problemele de performanță.\n\nAtrăgătoarele de fulgere cu nivele de calitate foarte înalte au zone de acoperire semnificativ mărită, ceea ce poate cauza lag-uri noaptea pe Fulgora.\n\n[color=green]Implicit: legendară[/color]
upgrade-limit-thrusters=Limitează creșterea calității propulsoarelor spațiale la nivelurile vanilla pentru a preveni probleme de apărare.\n\nNivelurile de calitate modificate pot face navele spațiale să se miște semnificativ mai rapid, ceea ce poate copleși apărările lor.\n\n[color=green]Implicit: legendară[/color]

