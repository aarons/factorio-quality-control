[mod-setting-description]
manufacturing-hours-for-change=Numărul de ore de fabricație necesare pentru ca o schimbare de calitate să fie încercată.\nOrele de fabricație se acumulează doar atunci când mașina lucrează activ. Dacă este inactivă, nu va progresa.\nValoarea minimă 0,001 ore (3,6 secunde), Valoarea maximă 1000 ore.
crafting-speed-affects-progression=Controlează dacă viteza de fabricație a unei mașini influențează cât de repede acumulează ore de fabricație.\n\n[color=green]Activat (implicit):[/color] Mașinile cu viteză de fabricație mai mare vor progresa mai repede. Orele de fabricație sunt câștigate în funcție de viteza de fabricație și productivitatea mașinii. O turnătorie cu viteza 4 și productivitate 50% va progresa de șase ori mai repede decât un asamblor-2 cu viteza de fabricație 1.\n\n[color=red]Dezactivat:[/color] Viteza de fabricație nu are niciun impact asupra progresiei. O oră petrecută fabricând activ contează ca o oră de fabricație, indiferent de viteza de fabricație. Aceasta elimină efectul cumulativ prin care fiecare îmbunătățire de calitate accelerează următoarea.
percentage-chance-of-change=Procentajul de șansă ca o schimbare de calitate să fie reușită.\nValoarea minimă 0,0001%, Valoarea maximă 100% (schimbă întotdeauna după ce timpul a trecut)
quality-increase-cost=Aceasta mărește timpul dintre încercările de schimbare pe nivel de calitate. Aceasta este o formulă compusă. Setarea la 0% va menține același timp dintre încercări indiferent de nivelul de calitate\n\n[color=green]Exemplu cu 3 ore de fabricație necesare la 50% cost pe nivel[/color]\n\nNormal: 3 ore\nNecomun: 4,5 ore\nRar: 6,8 ore\nEpic: 10,1 ore\nLegendară: 15,2 ore\nNivel de calitate modificat 10: 173 ore
quality-chance-accumulation-rate=Controlează cât crește șansa după fiecare încercare eșuată.\n\n[color=white]Niciunul (Implicit):[/color] Fără acumulare - șansa rămâne constantă.\n\n[color=white]Scăzut (20%):[/color] Șansa crește cu 20% din rata de bază la fiecare eșec.\n\n[color=white]Mediu (50%):[/color] Șansa crește cu 50% din rata de bază la fiecare eșec.\n\n[color=white]Înalt (100%):[/color] Șansa crește cu 100% din rata de bază la fiecare eșec.\n\n[color=yellow]Exemplu cu șansă de bază de 1%:[/color]\n\n[color=white]Scăzut:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Înalt:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nToate setările de acumulare garantează în cele din urmă schimbările de calitate - setările mai mari doar ating șansa de 100% mai rapid
secondary-progression-rate=Cât de repede progresează entitățile secundare (inseratoare, stâlpi, balize - orice nu-și poate măsura propria muncă), ca procent din ce câștigă entitatea primară medie de pe aceeași suprafață.\n\n[color=green]100% (implicit):[/color] Entitățile secundare avansează în același ritm ca asamblorul, furnalul, silozul sau turela medie din jurul lor.\n\nSetează la 0% pentru a opri complet progresia secundară; valorile peste 100% accelerează upgrade-urile infrastructurii peste ritmul mașinilor de producție.\n\nPoate fi schimbat în timpul jocului fără repornire.
change-modules-with-entity=Aceasta controlează dacă modulele din mașini sunt afectate de schimbările de calitate.\n\n[color=white]Dezactivat (Implicit):[/color] Modulele nu sunt afectate când se schimbă calitatea mașinii gazdă.\n\n[color=white]Activat:[/color] Modulele își schimbă calitatea cu un nivel când gazda lor se schimbă. Nu vor depăși nivelul de calitate al gazdei.\n\n[color=white]Extra Activat:[/color] Ca Activat, dar modulele vor fi actualizate potrivite cu calitatea mașinii gazdă oricând are loc o schimbare de calitate.
batch-entities-per-tick=Numărul de entități de procesat la fiecare tick pentru a evita vârfurile de performanță.\nValoarea minimă 1, Valoarea maximă 1000.\nValorile mai mari pot cauza lag-uri dar procesează entitățile mai rapid.
batch-ticks-between-processing=Numărul de tick-uri de așteptat între ciclurile de procesare în loturi.\nValoarea minimă 1 tick, Valoarea maximă 6000 tick-uri (~2,5 minute).\nValorile mai mici procesează mai frecvent dar pot afecta performanța.
quality-change-aggregate-alerts-enabled=Arată mesaje de consolă care sumarizează toate schimbările de calitate (afișate o dată la 5 minute). Exemplu: "3 mașini de asamblare îmbunătățite, 2 inseratori îmbunătățiți"
quality-change-entity-alerts-enabled=Arată alerte ping pe hartă pentru entitățile individuale când li se schimbă calitatea. Faceți clic pe alertă pentru a vizualiza entitatea îmbunătățită.
quality_control_skip_hidden_qualities=Controlul Calității va omite calitățile ascunse (de exemplu, variantele strălucitoare) când face îmbunătățiri. Entitățile nu vor deveni niciodată strălucitoare prin Controlul Calității - jucătorii trebuie să le obțină în modul normal. Această setare se aplică numai când aveți instalat modul de calitate Shiny Mechanics.
quality_control_hidden_qualities_sticky=Entitățile cu calități ascunse (de exemplu, strălucitoare) nu se vor îmbunătăți mai departe, păstrându-și beneficiile unice. Această setare se aplică numai când aveți instalat modul de calitate Shiny Mechanics.
enable-accumulators=Activează schimbările de calitate pentru acumulatori.
enable-agricultural-towers=Activează schimbările de calitate pentru turnurile agricole.
enable-assembly-machines=Activează schimbările de calitate pentru mașinile de asamblare.
enable-asteroid-collectors=Activează schimbările de calitate pentru colectoarele de asteroizi.
asteroid-collector-growth-level-limit=Limitează creșterea calității colectoarelor de asteroizi la valorile vanilla pentru a preveni probleme ce pot strica jocul.\n\nColectoarele de asteroizi cu niveluri de calitate modificate pot avea prea multe brațe care se mișcă prea repede, devenind incapabile să prindă fragmente de asteroizi și creând o scurgere mare de UPS.\n\n[color=green]Implicit: legendară[/color]
enable-beacons=Activează schimbările de calitate pentru beacoane.
enable-boilers=Activează schimbările de calitate pentru cazane.
enable-combinators-and-speakers=Activează schimbările de calitate pentru combinatori și difuzoare.\n\nInclud: combinatori aritmetici, combinatori decizionali, combinatori constanți, difuzoare programabile.
enable-pumps=Activează schimbările de calitate pentru pompe (includ pompele de țărm și pompele de fluid).
enable-furnaces=Activează schimbările de calitate pentru cuptoare.
enable-generators=Activează schimbările de calitate pentru generatoare (motoare cu abur, turbine cu abur, generatoare cu fuziune).
enable-heat-pipes=Activează schimbările de calitate pentru țevile de căldură.
enable-inserters=Activează schimbările de calitate pentru inseratori.
enable-labs=Activează schimbările de calitate pentru laboratoarele de cercetare.
enable-lamps=Activează schimbările de calitate pentru lămpi.
enable-lightning-rods=Activează schimbările de calitate pentru paratrăznete.
enable-mining-drills=Activează schimbările de calitate pentru toate burghiurile de minerit.
enable-poles=Activează schimbările de calitate pentru toți stâlpii electrici (incluzând stâlpii de înaltă tensiune și substation-urile).
enable-power-switches=Activează schimbările de calitate pentru întrerupătoarele de curent.
enable-radar=Activează schimbările de calitate pentru stațiile radar.
radar-growth-level-limit=Limitează creșterea calității radarului pentru a preveni explorarea excesivă a hărții și umflarea fișierelor de salvare.\n\nRadarurile cu nivele de calitate foarte înalte pot cauza fișiere de salvare mari (1.200mb+) din cauza explorării excesive a hărții.\n\n[color=green]Implicit: legendară[/color]
lightning-attractor-growth-level-limit=Limitează creșterea calității atrăgătoarelor de fulgere pentru a preveni problemele de performanță.\n\nAtrăgătoarele de fulgere cu nivele de calitate foarte înalte au zone de acoperire semnificativ mărită, ceea ce poate cauza lag-uri noaptea pe Fulgora.\n\n[color=green]Implicit: legendară[/color]
enable-reactors=Activează schimbările de calitate pentru reactoare (reactoare nucleare, reactoare cu fuziune).
enable-rocket-silos=Activează schimbările de calitate pentru silozurile de rachete.
enable-roboports=Activează schimbările de calitate pentru roboporturi.
enable-solar-panels=Activează schimbările de calitate pentru panourile solare.
enable-thrusters=Activează schimbările de calitate pentru propulsoarele spațiale. Dezactivat implicit deoarece schimbarea neașteptată a vitezei navei spațiale poate copleși apărările.
thruster-growth-level-limit=Limitează creșterea calității propulsoarelor spațiale la nivelurile vanilla pentru a preveni probleme de apărare.\n\nNivelurile de calitate modificate pot face navele spațiale să se miște semnificativ mai rapid, ceea ce poate copleși apărările lor.\n\n[color=green]Implicit: legendară[/color]
enable-turrets=Activează schimbările de calitate pentru turele.\n\nTurelele sunt entități primare care generează credite de îmbunătățire pe baza daunelor cumulate provocate.\n\nInclud: turele cu muniție, turele laser, aruncătoarele de flăcări, turelele de artilerie.
turret-damage-per-manufacturing-hour=Cantitatea de daune pe care o turelă trebuie să le provoace pentru a echivala cu o oră de fabricație.\n\nImplicit: 36.000 daune (derivat din cartușe perforante: 450 încărcătoare/oră × 80 daune/încărcător).\n\nValorile mai mici fac turelele să genereze credite mai rapid. Valorile mai mari încetinesc generarea creditelor.
turrets-contribute-credits=Controlează dacă creditele de upgrade obținute de turele alimentează și fondul comun care upgradează entitățile secundare (inseratoare, stâlpi electrici etc.).\n\n[color=red]Dezactivat (implicit):[/color] Creditele turelei rămân la turelă. Daunele de luptă ajută doar turelele să se upgradeze pe ele însele.\n\n[color=green]Activat:[/color] Creditele turelei curg și către fondul comun, astfel încât daunele de luptă avansează entitățile secundare la fel cum o face fabricația.
enable-defense-walls-and-gates=Activează schimbările de calitate pentru ziduri și porți.\n\nInclud: ziduri, porți.
custom-upgrade-limit-a=Folosește această opțiune pentru a seta limite personalizate pentru calitățile modificate ale entităților. Este necesară doar când ai un mod care adaugă niveluri de calitate dincolo de legendară și vrei să limitezi cât de mult se va îmbunătăți o entitate. Pentru a folosi această funcție, setează aici nivelul maxim, apoi mergi la entitatea pe care vrei să o limitezi și selectează 'Personalizat A' din meniul derulant. Ca referință, legendară este nivelul 5 (normală = 1, neobișnuită = 2, rară = 3, epică = 4, legendară = 5...).
custom-upgrade-limit-b=Folosește această opțiune pentru a seta limite personalizate pentru calitățile modificate ale entităților. Este necesară doar când ai un mod care adaugă niveluri de calitate dincolo de legendară și vrei să limitezi cât de mult se va îmbunătăți o entitate. Pentru a folosi această funcție, setează aici nivelul maxim, apoi mergi la entitatea pe care vrei să o limitezi și selectează 'Personalizat B' din meniul derulant. Ca referință, legendară este nivelul 5 (normală = 1, neobișnuită = 2, rară = 3, epică = 4, legendară = 5...).
custom-upgrade-limit-c=Folosește această opțiune pentru a seta limite personalizate pentru calitățile modificate ale entităților. Este necesară doar când ai un mod care adaugă niveluri de calitate dincolo de legendară și vrei să limitezi cât de mult se va îmbunătăți o entitate. Pentru a folosi această funcție, setează aici nivelul maxim, apoi mergi la entitatea pe care vrei să o limitezi și selectează 'Personalizat C' din meniul derulant. Ca referință, legendară este nivelul 5 (normală = 1, neobișnuită = 2, rară = 3, epică = 4, legendară = 5...).
upgrade-limit-accumulators=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.
upgrade-limit-agricultural-towers=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.
upgrade-limit-assembly-machines=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.
upgrade-limit-beacons=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.
upgrade-limit-boilers=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.
upgrade-limit-combinators-and-speakers=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.\n\nInclude: combinatoare aritmetice, combinatoare de decizie, combinatoare constante, difuzoare programabile.
upgrade-limit-defense-walls-and-gates=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.\n\nInclude: ziduri, porți.
upgrade-limit-furnaces=Controlul Calității va îmbunătăți aceste entități până la această calitate, apoi va opri orice încercare de îmbunătățire suplimentară. Setează pe Obișnuită pentru a preveni orice încercare de îmbunătățire. Valorile personalizate folosesc setările Limită personalizată de îmbunătățire A/B/C.
