[mod-setting-description]
manufacturing-hours-for-change=O número de horas de fabricação necessárias para que uma tentativa de mudança de qualidade seja feita.\nHoras de fabricação só são acumuladas quando a máquina está trabalhando ativamente. Se ela ficar ociosa, não haverá progresso.\nValor mínimo 0,001 horas (3,6 segundos), Valor máximo 1000 horas.
crafting-speed-affects-progression=[color=red]Desabilitado (padrão):[/color] A velocidade de fabricação não afeta a progressão, o que ajuda a distribuir as melhorias de forma mais uniforme ao longo de uma partida mais longa.\n\n[color=green]Habilitado:[/color] A velocidade de fabricação e a produtividade aumentam as horas de fabricação ganhas. Velocidade 4 com 50% de produtividade rende seis vezes mais que velocidade 1 sem bônus de produtividade. Os aumentos de velocidade das melhorias de qualidade podem se acumular, levando a melhorias muito rápidas no fim do jogo.
percentage-chance-of-change=Chance de sucesso de uma tentativa de melhoria.
quality-increase-cost=Aumento das horas de fabricação necessárias por nível de qualidade. O aumento é composto; 0% mantém a mesma exigência em todos os níveis.\n\nCom 50%, uma exigência de 3 horas passa a 4,5 horas em incomum e 6,75 horas em raro.
quality-chance-accumulation-rate=Aumenta a chance de melhoria após uma tentativa falhada em uma porcentagem da chance base.\n\n[color=white]Nenhuma:[/color] A chance permanece constante.\n[color=white]Baixa:[/color] Adiciona 20% da chance base.\n[color=white]Média:[/color] Adiciona 50% da chance base.\n[color=white]Alta:[/color] Adiciona 100% da chance base.\n\nCom chance base de 1%, Baixa resulta em 1% → 1,2% → 1,4%... e Alta resulta em 1% → 2% → 3%...
secondary-progression-rate=Velocidade de progressão de entidades que não conseguem medir seu próprio trabalho, como inseridores, postes e faróis.\n\n100% corresponde à média de horas de fabricação ganhas por entidades primárias na mesma superfície. Valores maiores aceleram a progressão; 0% a pausa.
change-modules-with-entity=[color=white]Desativado:[/color] Módulos não são melhorados.\n\n[color=white]Ativado:[/color] Módulos melhoram um nível quando sua máquina melhora, até a qualidade da máquina.\n\n[color=white]Extra Ativado:[/color] Módulos são melhorados para corresponder à nova qualidade da máquina.\n\n[color=white]Independente:[/color] Módulos ganham suas próprias tentativas de melhoria pela progressão secundária e podem exceder o limite de qualidade da máquina. Definir o limite da máquina como Comum também desativa melhorias de módulos.
batch-entities-per-tick=Entidades processadas por lote. Lotes maiores processam melhorias mais rapidamente, mas podem causar lag. Espaços de módulos também contam no modo Independente.
batch-ticks-between-processing=Ticks entre processamentos em lote. Intervalos menores processam melhorias com mais frequência, mas podem reduzir o desempenho.
quality-change-aggregate-alerts-enabled=Mostrar um resumo das melhorias a cada cinco minutos.
quality-change-entity-alerts-enabled=Mostrar ícones de alerta no mapa nos locais das melhorias.
quality-change-chat-enabled=Mostrar mensagens de melhoria com ícones de entidades ou módulos, ícones de qualidade e letras em cores de arco-íris aleatórias.
quality-change-gps-enabled=Mostrar um link clicável para o local e acionar o ping de GPS do Factorio no mapa para cada melhoria. Clique no link para revisitar o local. Adiciona o link às mensagens coloridas de melhoria no chat quando ativadas; caso contrário, mostra apenas o link. O ping de GPS nativo requer um link no chat.
quality-change-floating-text-enabled=Mostrar texto de melhoria que sobe na cor da nova qualidade.
quality-change-halo-enabled=Mostrar um halo que se expande na cor da nova qualidade nos locais das melhorias.
quality-change-rainbow-enabled=Mostrar anéis de arco-íris que se expandem nos locais das melhorias.
quality-change-badge-enabled=Mostrar o ícone da nova qualidade crescendo e subindo por 4,5 segundos, girando continuamente enquanto desaparece.
quality-change-bubbles-enabled=Liberar uma sequência de pequenos ícones da nova qualidade que sobem como bolhas nos locais das melhorias.
quality-change-sound-enabled=Tocar o som selecionado para melhorias na superfície que você está visualizando, inclusive na visualização remota.
quality-change-sound=Escolha um efeito de notificação, alarme de alto-falante, som de bateria ou instrumento musical. Instrumentos usam Nota do Instrumento / Tônica e Comportamento das Notas de melhoria. O som só toca quando o som de melhoria está ativado e para melhorias na superfície que você está visualizando.
quality-change-sound-note=Nota fixa ou tônica (tom e registro inicial) para padrões musicais. Ignorada para alarmes, bateria, efeitos e modo Totalmente aleatório.\nAs notas sobem por semitons a partir de F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; adicione 12 para a próxima oitava. Padrão: 20 (C).\nO piano tem 48 notas; os outros instrumentos têm 36. O modo fixo limita a nota à mais alta disponível. Padrões musicais descem oitavas inteiras quando necessário para caber, preservando o tom. As mesmas configurações produzem padrões equivalentes no registro de cada instrumento.
quality-change-sound-mode=Uma nota por melhoria audível, com um padrão separado para cada jogador. Nota fixa mantém a nota selecionada; Passeio musical avança ou recua um ou dois graus da escala; Sinos de vento escolhe notas aleatórias da escala pentatônica maior; Escadaria sobe e desce repetidamente; Aleatório na escala escolhe qualquer nota na escala e extensão selecionadas; Totalmente aleatório usa toda a extensão do instrumento.\nPasseio musical e Escadaria começam na tônica e continuam após períodos de silêncio e ao salvar ou carregar. Nenhuma nota atrasada é colocada em fila. Afeta apenas instrumentos musicais.
quality-change-sound-scale=Escala relativa à Nota do Instrumento / Tônica de melhoria, usada por Passeio musical, Escadaria e Aleatório na escala. Cromática permite todos os semitons. Sinos de vento sempre usa a pentatônica maior; Nota fixa e Totalmente aleatório ignoram esta configuração.
quality-change-sound-range=Uma ou duas oitavas a partir da tônica, deslocadas para baixo por oitavas inteiras se necessário para caber no instrumento; ou toda a extensão do instrumento. Aplica-se a Passeio musical, Sinos de vento, Escadaria e Aleatório na escala. Nota fixa e Totalmente aleatório ignoram esta configuração.
quality_control_skip_hidden_qualities=Pular qualidades ocultas (por exemplo, variantes brilhantes) ao melhorar. Esta configuração só se aplica quando você tem um mod como Shiny Mechanics instalado.
quality_control_hidden_qualities_sticky==Entidades com qualidades ocultas (por exemplo, brilhantes) não serão melhoradas ainda mais, preservando seus benefícios únicos. Esta configuração só se aplica quando você tem um mod como Shiny Mechanics instalado.
enable-accumulators=Ativar melhorias para acumuladores.
enable-agricultural-towers=Ativar melhorias para torres agrícolas.
enable-assembly-machines=Ativar melhorias para máquinas de montagem.
enable-asteroid-collectors=Ativar melhorias para coletores de asteroides.
asteroid-collector-growth-level-limit=Limita o crescimento de qualidade dos coletores de asteroides aos valores originais para evitar problemas que quebram o jogo.\n\nColetores de asteroides com níveis de qualidade modificados podem ter muitos braços que se movem rápido demais, tornando-se incapazes de pegar fragmentos de asteroides e criando um grande consumo de UPS.\n\n[color=green]Padrão: lendário[/color]
enable-beacons=Ativar melhorias para faróis.
enable-boilers=Ativar melhorias para caldeiras.
enable-combinators-and-speakers=Ativar melhorias para combinadores e alto-falantes programáveis.
enable-pumps=Ativar melhorias para bombas de captação e bombas de fluido.
enable-furnaces=Ativar melhorias para fornos.
enable-generators=Ativar melhorias para motores a vapor, turbinas a vapor e geradores de fusão.
enable-heat-pipes=Ativar melhorias para tubos de calor.
enable-inserters=Ativar melhorias para inseridores.
enable-labs=Ativar melhorias para laboratórios de pesquisa.
enable-lamps=Ativar melhorias para lâmpadas.
enable-lightning-rods=Ativar melhorias para para-raios.
enable-mining-drills=Ativar melhorias para brocas de mineração.
enable-poles=Ativar melhorias para postes elétricos e subestações.
enable-power-switches=Ativar melhorias para chaves de energia.
enable-radar=Ativar melhorias para estações de radar.
radar-growth-level-limit=Limita o crescimento da qualidade do radar para prevenir exploração excessiva do mapa e inchaço do arquivo de salvamento.\n\nRadares com níveis de qualidade muito altos podem causar arquivos de salvamento grandes (1.200mb+) devido à exploração excessiva do mapa.\n\n[color=green]Padrão: lendário[/color]
lightning-attractor-growth-level-limit=Limita o crescimento da qualidade do atrator de raios para prevenir problemas de desempenho.\n\nAtratores de raios com níveis de qualidade muito altos têm áreas de cobertura significativamente aumentadas, o que pode causar picos de lag à noite em Fulgora.\n\n[color=green]Padrão: lendário[/color]
enable-reactors=Ativar melhorias para reatores nucleares e de fusão.
enable-rocket-silos=Ativar melhorias para silos de foguetes.
enable-roboports=Ativar melhorias para roboportos.
enable-solar-panels=Ativar melhorias para painéis solares.
enable-thrusters=Ativar melhorias para propulsores espaciais. Naves mais rápidas podem sobrecarregar suas defesas.
thruster-growth-level-limit=Opcionalmente, limite os propulsores espaciais aos níveis originais. Níveis de qualidade modificados podem mover naves espaciais significativamente mais rápido, o que pode sobrecarregar suas defesas.
enable-turrets=Ativar melhorias para torres de munição, laser, lança-chamas e artilharia. Torres ganham 'horas de fabricação' ao causar dano.
turret-damage-per-manufacturing-hour=A quantidade de dano que uma torre deve causar para ganhar uma hora de fabricação.\n\nPadrão: 36.000 de dano (calculado com base na quantidade de projéteis perfurantes que uma máquina de montagem básica pode produzir em uma hora).
turrets-contribute-credits=Permitir que torres contribuam para melhorias de entidades secundárias, como inseridores e postes de energia, na mesma superfície. Isso pode acelerar bastante as melhorias no fim do jogo com canhões elétricos e torres de raios.
enable-defense-walls-and-gates=Ativar melhorias para muros e portões.
custom-upgrade-limit-a=Nível máximo de qualidade usado pela configuração 'Personalizado A' nos limites abaixo. Necessário apenas quando você tem um mod que adiciona níveis de qualidade além de lendário e deseja limitar até onde uma entidade pode melhorar. Por exemplo, se quiser permitir que coletores de asteroides cheguem ao nível 10. Para usar este recurso, defina o nível máximo aqui e depois vá até a entidade que deseja limitar e selecione 'Personalizado A' na lista suspensa. Para referência, lendário é o nível 5.
custom-upgrade-limit-b=Nível máximo de qualidade usado por Personalizado B nas configurações de limite de melhoria.
custom-upgrade-limit-c=Nível máximo de qualidade usado por Personalizado C nas configurações de limite de melhoria.
upgrade-limit-accumulators=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-agricultural-towers=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-assembly-machines=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-beacons=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-boilers=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-combinators-and-speakers=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: combinadores aritméticos, combinadores decisores, combinadores constantes, alto-falantes programáveis.
upgrade-limit-defense-walls-and-gates=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-furnaces=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-generators=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: motores a vapor, turbinas a vapor, geradores de fusão.
upgrade-limit-heat-pipes=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-inserters=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-labs=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-lamps=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-mining-drills=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-poles=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui postes elétricos e subestações.
upgrade-limit-power-switches=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-pumps=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: bombas de captação e bombas de fluido.
upgrade-limit-reactors=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: reatores nucleares, reatores de fusão.
upgrade-limit-rocket-silos=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-roboports=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-solar-panels=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-turrets=Qualidade máxima de melhoria para essas entidades. Comum desativa melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: torres de munição, torres laser, lança-chamas, torres de artilharia.
upgrade-limit-asteroid-collectors=Limite os coletores de asteroides a lendário para evitar problemas que quebram o jogo. Níveis modificados podem criar braços demais que se movem rápido demais, tornando-os incapazes de pegar fragmentos de asteroides e causando grande consumo de UPS.
upgrade-limit-radar=Limite os radares a lendário para evitar o aumento excessivo do arquivo de salvamento. Qualidades modificadas podem causar exploração excessiva do mapa e gerar arquivos muito grandes (mais de um gigabyte).
upgrade-limit-lightning-rods=Limite os atratores de raios a lendário para evitar picos de UPS. Atratores de raios com níveis de qualidade modificados têm áreas de cobertura significativamente maiores, o que pode causar picos de lag à noite em Fulgora.
upgrade-limit-thrusters=Limite os propulsores espaciais a lendário para evitar danos inesperados à plataforma espacial. Níveis de qualidade modificados podem mover naves espaciais significativamente mais rápido, o que pode sobrecarregar suas defesas.

