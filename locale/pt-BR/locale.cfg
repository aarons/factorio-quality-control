[mod-setting-description]
manufacturing-hours-for-change=O número de horas de fabricação necessárias para que uma tentativa de mudança de qualidade seja feita.\nHoras de fabricação só são acumuladas quando a máquina está trabalhando ativamente. Se ela ficar ociosa, não haverá progresso.\nValor mínimo 0,001 horas (3,6 segundos), Valor máximo 1000 horas.
crafting-speed-affects-progression=Controla se a velocidade de fabricação de uma máquina afeta a rapidez com que ela ganha horas de fabricação.\n\n[color=green]Habilitado (padrão):[/color] Máquinas com velocidade de fabricação maior progridem mais rápido. As horas de fabricação são ganhas com base na velocidade de fabricação e na produtividade da máquina. Uma fundição com velocidade 4 e 50% de produtividade progride seis vezes mais rápido que uma Máquina de Montagem 2 com velocidade de fabricação 1.\n\n[color=red]Desabilitado:[/color] A velocidade de fabricação não tem impacto na progressão. Uma hora gasta fabricando ativamente conta como uma hora de fabricação, independentemente da velocidade de fabricação. Isso remove o efeito cumulativo em que cada melhoria de qualidade acelera a próxima.
percentage-chance-of-change=A porcentagem de chance de que uma mudança de qualidade seja bem-sucedida.\nValor mínimo 0,0001%, Valor máximo 100% (sempre muda depois que o tempo passa)
quality-increase-cost=Isso aumenta o tempo entre tentativas de mudança por nível de qualidade. Esta é uma fórmula composta. Definir como 0% manterá o tempo entre tentativas igual, independentemente do nível de qualidade\n\n[color=green]Exemplo com 3 horas de fabricação necessárias a 50% de custo por nível[/color]\n\nNormal: 3 horas\nIncomum: 4,5 horas\nRaro: 6,8 horas\nÉpico: 10,1 horas\nLendário: 15,2 horas\nQualidade modificada nível 10: 173 horas
quality-chance-accumulation-rate=Controla o quanto a chance aumenta após cada tentativa falhada.\n\n[color=white]Nenhuma (Padrão):[/color] Sem acumulação - chance permanece constante.\n\n[color=white]Baixa (20%):[/color] Chance aumenta em 20% da taxa base a cada falha.\n\n[color=white]Média (50%):[/color] Chance aumenta em 50% da taxa base a cada falha.\n\n[color=white]Alta (100%):[/color] Chance aumenta em 100% da taxa base a cada falha.\n\n[color=yellow]Exemplo com chance base de 1%:[/color]\n\n[color=white]Baixa:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Alta:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nTodas as configurações de acumulação eventualmente garantem mudanças de qualidade - configurações mais altas apenas alcançam 100% de chance mais rapidamente
secondary-progression-rate=A velocidade com que entidades secundárias (inseridores, postes, faróis - qualquer coisa que não consegue medir seu próprio trabalho) progridem, como uma porcentagem do que a entidade primária média na mesma superfície ganha.\n\n[color=green]100% (padrão):[/color] Entidades secundárias avançam no mesmo ritmo que a montadora, fornalha, silo ou torre médios ao seu redor.\n\nDefina como 0% para parar completamente a progressão secundária; valores acima de 100% aceleram as atualizações de infraestrutura além do ritmo das máquinas de produção.\n\nPode ser alterado durante o jogo sem precisar reiniciar.
change-modules-with-entity=Isso controla se módulos em máquinas são afetados por mudanças de qualidade.\n\n[color=white]Desativado (Padrão):[/color] Módulos não são afetados quando a qualidade da máquina hospedeira muda.\n\n[color=white]Ativado:[/color] Módulos mudam de qualidade em um nível quando seu hospedeiro muda. Eles não excederão o nível de qualidade do hospedeiro.\n\n[color=white]Extra Ativado:[/color] Como Ativado, mas módulos serão atualizados para corresponder à qualidade de sua máquina hospedeira sempre que uma mudança de qualidade ocorrer.
batch-entities-per-tick=Número de entidades a processar a cada tick para evitar picos de desempenho.\nValor mínimo 1, Valor máximo 1000.\nValores mais altos podem causar picos de lag, mas processam entidades mais rapidamente.
batch-ticks-between-processing=Número de ticks a aguardar entre ciclos de processamento em lote.\nValor mínimo 1 tick, Valor máximo 6000 ticks (~2,5 minutos).\nValores mais baixos processam com mais frequência, mas podem impactar o desempenho.
quality-change-aggregate-alerts-enabled=Mostrar mensagens no console resumindo todas as mudanças de qualidade (exibidas uma vez a cada 5 minutos). Exemplo: "3 máquinas de montagem melhoradas, 2 inseridores melhorados"
quality-change-entity-alerts-enabled=Mostrar alertas de ping no mapa em entidades individuais quando sua qualidade muda. Clique no alerta para visualizar a entidade melhorada.
quality_control_skip_hidden_qualities=O Controle de Qualidade pulará qualidades ocultas (por exemplo, variantes brilhantes) ao melhorar. Entidades nunca se tornarão brilhantes através do Controle de Qualidade - os jogadores devem obtê-las da maneira normal. Esta configuração só se aplica quando você tem o mod de qualidade Shiny Mechanics instalado.
quality_control_hidden_qualities_sticky=Entidades com qualidades ocultas (por exemplo, brilhantes) não serão melhoradas ainda mais, preservando seus benefícios únicos. Esta configuração só se aplica quando você tem o mod de qualidade Shiny Mechanics instalado.
enable-accumulators=Ativar mudanças de qualidade para acumuladores.
enable-agricultural-towers=Ativar mudanças de qualidade para torres agrícolas.
enable-assembly-machines=Ativar mudanças de qualidade para máquinas de montagem.
enable-asteroid-collectors=Ativar mudanças de qualidade para coletores de asteroides.
asteroid-collector-growth-level-limit=Limita o crescimento de qualidade dos coletores de asteroides aos valores originais para evitar problemas que quebram o jogo.\n\nColetores de asteroides com níveis de qualidade modificados podem ter muitos braços que se movem rápido demais, tornando-se incapazes de pegar fragmentos de asteroides e criando um grande consumo de UPS.\n\n[color=green]Padrão: lendário[/color]
enable-beacons=Ativar mudanças de qualidade para faróis.
enable-boilers=Ativar mudanças de qualidade para caldeiras.
enable-combinators-and-speakers=Ativar mudanças de qualidade para combinadores e alto-falantes.\n\nInclui: combinadores aritméticos, combinadores de decisão, combinadores constantes, alto-falantes programáveis.
enable-pumps=Ativar mudanças de qualidade para bombas (inclui bombas offshore e bombas de fluido).
enable-furnaces=Ativar mudanças de qualidade para fornos.
enable-generators=Ativar mudanças de qualidade para geradores (motores a vapor, turbinas a vapor, geradores de fusão).
enable-heat-pipes=Ativar mudanças de qualidade para tubos de calor.
enable-inserters=Ativar mudanças de qualidade para inseridores.
enable-labs=Ativar mudanças de qualidade para laboratórios de pesquisa.
enable-lamps=Ativar mudanças de qualidade para lâmpadas.
enable-lightning-rods=Ativar mudanças de qualidade para para-raios.
enable-mining-drills=Ativar mudanças de qualidade para todas as brocas de mineração.
enable-poles=Ativar mudanças de qualidade para todos os postes elétricos (incluindo postes de energia grandes e subestações).
enable-power-switches=Ativar mudanças de qualidade para chaves de energia.
enable-radar=Ativar mudanças de qualidade para estações de radar.
radar-growth-level-limit=Limita o crescimento da qualidade do radar para prevenir exploração excessiva do mapa e inchaço do arquivo de salvamento.\n\nRadares com níveis de qualidade muito altos podem causar arquivos de salvamento grandes (1.200mb+) devido à exploração excessiva do mapa.\n\n[color=green]Padrão: lendário[/color]
lightning-attractor-growth-level-limit=Limita o crescimento da qualidade do atrator de raios para prevenir problemas de desempenho.\n\nAtratores de raios com níveis de qualidade muito altos têm áreas de cobertura significativamente aumentadas, o que pode causar picos de lag à noite em Fulgora.\n\n[color=green]Padrão: lendário[/color]
enable-reactors=Ativar mudanças de qualidade para reatores (reatores nucleares, reatores de fusão).
enable-rocket-silos=Ativar mudanças de qualidade para silos de foguetes.
enable-roboports=Ativar mudanças de qualidade para roboportos.
enable-solar-panels=Ativar mudanças de qualidade para painéis solares.
enable-thrusters=Ativar mudanças de qualidade para propulsores espaciais. Desativado por padrão porque alterar a velocidade de uma nave espacial inesperadamente pode sobrecarregar suas defesas.
thruster-growth-level-limit=Limita o crescimento de qualidade dos propulsores espaciais aos níveis originais para evitar problemas de defesa.\n\nNíveis de qualidade modificados podem mover naves espaciais significativamente mais rápido, o que pode sobrecarregar suas defesas.\n\n[color=green]Padrão: lendário[/color]
enable-turrets=Ativar mudanças de qualidade para torres de defesa.\n\nTorres são entidades primárias que geram créditos de melhoria com base no dano acumulado causado.\n\nInclui: torres de munição, torres laser, lança-chamas, torres de artilharia.
turret-damage-per-manufacturing-hour=A quantidade de dano que uma torre deve causar para equivaler a uma hora de fabricação.\n\nPadrão: 36.000 de dano (derivado de projéteis perfurantes: 450 carregadores/hora × 80 de dano/carregador).\n\nValores menores fazem as torres gerarem créditos mais rapidamente.
enable-defense-walls-and-gates=Ativar mudanças de qualidade para muros e portões.\n\nInclui: muros, portões.
custom-upgrade-limit-a=Use isto para definir limites personalizados para qualidades modificadas de entidades. Necessário apenas quando você tem um mod que adiciona níveis de qualidade além de lendário e deseja limitar o quanto uma entidade vai evoluir. Para usar este recurso, defina o nível máximo aqui e depois vá até a entidade que deseja limitar e selecione 'Personalizado A' na lista suspensa. Para referência, lendário é o nível 5 (normal = 1, incomum = 2, raro = 3, épico = 4, lendário = 5...).
custom-upgrade-limit-b=Use isto para definir limites personalizados para qualidades modificadas de entidades. Necessário apenas quando você tem um mod que adiciona níveis de qualidade além de lendário e deseja limitar o quanto uma entidade vai evoluir. Para usar este recurso, defina o nível máximo aqui e depois vá até a entidade que deseja limitar e selecione 'Personalizado B' na lista suspensa. Para referência, lendário é o nível 5 (normal = 1, incomum = 2, raro = 3, épico = 4, lendário = 5...).
custom-upgrade-limit-c=Use isto para definir limites personalizados para qualidades modificadas de entidades. Necessário apenas quando você tem um mod que adiciona níveis de qualidade além de lendário e deseja limitar o quanto uma entidade vai evoluir. Para usar este recurso, defina o nível máximo aqui e depois vá até a entidade que deseja limitar e selecione 'Personalizado C' na lista suspensa. Para referência, lendário é o nível 5 (normal = 1, incomum = 2, raro = 3, épico = 4, lendário = 5...).
upgrade-limit-accumulators=O Controle de Qualidade vai atualizar essas entidades até esta qualidade e então parar de tentar novas atualizações. Defina como Comum para impedir qualquer tentativa de atualização. Os valores personalizados usam as configurações de Limite de Atualização Personalizado A/B/C.
