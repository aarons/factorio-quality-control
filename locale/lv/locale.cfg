upgrade-limit-poles=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.\n\nIekļauj: visus elektrības stabus, lielos elektrības stabus un apakšstacijas.
upgrade-limit-power-switches=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-pumps=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.\n\nIekļauj: piekrastes sūkņus un šķidruma sūkņus.
upgrade-limit-reactors=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.\n\nIekļauj: kodolreaktorus, kodolsintēzes reaktorus.
upgrade-limit-rocket-silos=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-roboports=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-solar-panels=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-turrets=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.\n\nIekļauj: munīcijas torņus, lāzertorņus, liesmmešus, artilērijas torņus.
upgrade-limit-asteroid-collectors=Ierobežo asteroīdu kolektoru kvalitātes izaugsmi līdz noklusējuma vērtībām, lai novērstu spēli sagraujošas problēmas.\n\nAsteroīdu kolektori ar modificētiem kvalitātes līmeņiem var iegūt pārāk daudz roku, kas kustas pārāk ātri, kļūstot nespējīgas satvert asteroīdu gabalus un radot lielu UPS noslogojumu.\n\n[color=green]Noklusējuma: leģendārs[/color]
upgrade-limit-radar=Ierobežo radara kvalitātes izaugsmi, lai novērstu pārmērīgu kartes izpēti un saglabāšanas faila uzpūšanos.\n\nRadari ar ļoti augstu kvalitātes līmeni var izraisīt lielus saglabāšanas failus (1200mb+) dēļ pārmērīgas kartes izpētes.\n\n[color=green]Noklusējuma: leģendārs[/color]
upgrade-limit-lightning-rods=Ierobežo zibens pievilcēja kvalitātes izaugsmi, lai novērstu veiktspējas problēmas.\n\nZibens pievilcēji ar ļoti augstu kvalitātes līmeni ievērojami palielina pārklājuma zonas, kas var izraisīt aiztures naktī Fulgorā.\n\n[color=green]Noklusējuma: leģendārs[/color]
upgrade-limit-thrusters=Ierobežo kosmosa dzinēju kvalitātes izaugsmi līdz noklusējuma līmeņiem, lai novērstu aizsardzības problēmas.\n\nModificētu kvalitātes līmeņu kosmosa kuģi var kustēties ievērojami ātrāk, kas var pārslogot to aizsardzību.\n\n[color=green]Noklusējuma: leģendārs[/color]

