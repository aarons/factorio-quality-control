[mod-setting-description]
manufacturing-hours-for-change=Ražošanas stundu skaits, kas nepieciešams, lai mēģinātu kvalitātes maiņu.\nRažošanas stundas uzkrājas tikai tad, kad mašīna aktīvi strādā. Ja tā dīkstāv, progress nenotiek.\nMin vērtība 0,001 stundas (3,6 sekundes), Max vērtība 1000 stundas.
crafting-speed-affects-progression=[color=green]Iespējots:[/color] Izgatavošanas ātrums un produktivitāte palielina uzkrātās ražošanas stundas. Ar ātrumu 4 un 50% produktivitāti tiek uzkrāts sešas reizes vairāk nekā ar ātrumu 1 bez produktivitātes bonusa.\n\n[color=red]Atspējots:[/color] Izgatavošanas ātrums neietekmē progresu.
percentage-chance-of-change=Uzlabošanas mēģinājuma veiksmes iespējamība.
quality-increase-cost=Nepieciešamo ražošanas stundu pieaugums katram kvalitātes līmenim. Pieaugums ir kumulatīvs; 0% saglabā vienādu prasību visos līmeņos.\n\nPie 50% prasība pēc 3 stundām kļūst par 4,5 stundām neparastai un 6,75 stundām retai kvalitātei.
quality-chance-accumulation-rate=Pēc neveiksmīga mēģinājuma palielina uzlabošanas iespējamību par noteiktu procentu no pamata iespējamības.\n\n[color=white]Nav:[/color] Iespējamība paliek nemainīga.\n[color=white]Zems:[/color] Pievieno 20% no pamata iespējamības.\n[color=white]Vidējs:[/color] Pievieno 50% no pamata iespējamības.\n[color=white]Augsts:[/color] Pievieno 100% no pamata iespējamības.\n\nJa pamata iespējamība ir 1%, zemais iestatījums dod 1% → 1,2% → 1,4%..., bet augstais dod 1% → 2% → 3%...
secondary-progression-rate=Progresa ātrums entītijām, kas nevar izmērīt savu darbu, piemēram, ievietotājiem, stabiem un bākām.\n\n100% atbilst vidējam ražošanas stundu skaitam, ko uzkrāj primārās entītijas uz tās pašas virsmas. Augstākas vērtības paātrina progresu; 0% to aptur.
change-modules-with-entity=[color=white]Atspējots:[/color] Moduļi netiek uzlaboti.\n\n[color=white]Iespējots:[/color] Moduļi tiek uzlaboti par vienu līmeni, kad tiek uzlabota to mašīna, nepārsniedzot mašīnas kvalitāti.\n\n[color=white]Extra iespējots:[/color] Moduļi tiek uzlaboti līdz to mašīnas jaunajai kvalitātei.\n\n[color=white]Neatkarīgs:[/color] Moduļi iegūst savus uzlabošanas mēģinājumus no sekundārā progresa un var pārsniegt mašīnas kvalitātes ierobežojumu. Iestatot mašīnas ierobežojumu uz Parasta, tiek atspējoti arī moduļu uzlabojumi.
batch-entities-per-tick=Vienā paketē apstrādāto entītiju skaits. Lielākas paketes ātrāk apstrādā uzlabojumus, bet var izraisīt aiztures. Neatkarīgajā režīmā tiek skaitītas arī moduļu vietas.
batch-ticks-between-processing=Taktu skaits starp pakešu apstrādi. Īsāki intervāli apstrādā uzlabojumus biežāk, bet var samazināt veiktspēju.
quality-change-aggregate-alerts-enabled=Ik pēc piecām minūtēm parādīt uzlabojumu kopsavilkumu.
quality-change-entity-alerts-enabled=Rādīt kartes brīdinājumu ikonas uzlabojumu vietās.
quality-change-chat-enabled=Rādīt uzlabojumu ziņojumus ar entītiju vai moduļu ikonām, kvalitātes ikonām un nejauši izvēlētiem varavīksnes krāsu burtiem.
quality-change-gps-enabled=Katram uzlabojumam parādīt klikšķināmu atrašanās vietas saiti un aktivizēt Factorio GPS atzīmi kartē. Noklikšķiniet uz saites, lai atgrieztos atrašanās vietā. Ja ir iespējoti krāsainie uzlabojumu ziņojumi, saite tiek pievienota tiem; pretējā gadījumā tiek parādīta tikai saite. Spēles GPS atzīmei ir nepieciešama tērzēšanas saite.
quality-change-floating-text-enabled=Rādīt augšup peldošu uzlabojuma tekstu jaunās kvalitātes krāsā.
quality-change-halo-enabled=Rādīt izplešanos oreolu jaunās kvalitātes krāsā uzlabojumu vietās.
quality-change-rainbow-enabled=Rādīt izplešanos varavīksnes gredzenus uzlabojumu vietās.
quality-change-badge-enabled=Rādīt jaunās kvalitātes ikonu, kas 4,5 sekundes palielinās un ceļas augšup, nepārtraukti griežoties līdz izzušanai.
quality-change-bubbles-enabled=Uzlabojumu vietās izlaist mazu jaunās kvalitātes ikonu plūsmu, kas kā burbuļi peld augšup.
quality-change-sound-enabled=Atskaņot izvēlēto skaņu uzlabojumiem uz pašlaik skatītās virsmas, arī attālinātajā skatā.
quality-change-sound=Izvēlieties paziņojuma efektu, skaļruņa trauksmi, bungu skaņu vai mūzikas instrumentu. Instrumenti izmanto iestatījumus Instrumenta nots / pamatskaņa un Nošu darbība. Skaņa tiek atskaņota tikai tad, ja ir iespējota uzlabojuma skaņa un uzlabojums notiek uz pašlaik skatītās virsmas.
quality-change-sound-note=Fiksēta nots vai mūzikas rakstu pamatskaņa (tonalitāte un sākuma reģistrs). Trauksmēm, bungām, efektiem un režīmā Pilnīgi nejauši šis iestatījums tiek ignorēts.\nNotis no F aug pa pustoņiem: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; nākamajai oktāvai pieskaitiet 12. Noklusējums: 20 (C).\nKlavierēm ir 48 notis, citiem instrumentiem — 36. Fiksētajā režīmā nots tiek ierobežota līdz augstākajai pieejamajai notij. Mūzikas raksti vajadzības gadījumā tiek pārbīdīti uz leju par veselām oktāvām, saglabājot tonalitāti. Vienādi iestatījumi veido līdzīgus rakstus katra instrumenta reģistrā.
quality-change-sound-mode=Viena nots katram dzirdamam uzlabojumam, ar atsevišķu rakstu katram spēlētājam. Fiksēta nots saglabā izvēlēto noti; Muzikāla klejošana pārvietojas par vienu vai divām skaņkārtas pakāpēm; Vēja zvani izvēlas nejaušas mažora pentatonikas notis; Kāpnes atkārtoti kāpj augšup un lejup; Nejauši skaņkārtā izvēlas jebkuru noti izvēlētajā skaņkārtā un diapazonā; Pilnīgi nejauši izmanto visu instrumenta diapazonu.\nKlejošana un Kāpnes sākas no pamatskaņas un turpinās pēc klusuma periodiem un saglabāšanas vai ielādes. Aizkavētas notis netiek ievietotas rindā. Ietekmē tikai mūzikas instrumentus.
quality-change-sound-scale=Skaņkārta attiecībā pret instrumenta pamatskaņu, ko izmanto Muzikāla klejošana, Kāpnes un Nejauši skaņkārtā. Hromatiskā skaņkārta pieļauj visus pustoņus. Vēja zvani vienmēr izmanto mažora pentatoniku; Fiksēta nots un Pilnīgi nejauši šo iestatījumu ignorē.
quality-change-sound-range=Viena vai divas oktāvas no pamatskaņas, vajadzības gadījumā pārbīdītas uz leju par veselām oktāvām, lai ietilptu instrumenta diapazonā; vai viss instrumenta diapazons. Attiecas uz Muzikālu klejošanu, Vēja zvaniem, Kāpnēm un Nejauši skaņkārtā. Fiksēta nots un Pilnīgi nejauši šo iestatījumu ignorē.
quality_control_skip_hidden_qualities=Uzlabojot izlaist slēptās kvalitātes, piemēram, spīdīgos variantus. Šis iestatījums attiecas tikai tad, ja ir instalēts tāds mods kā Shiny Mechanics.
quality_control_hidden_qualities_sticky==Entītijas ar slēptām kvalitātēm, piemēram, spīdīgas, netiks uzlabotas tālāk, saglabājot to unikālās priekšrocības. Šis iestatījums attiecas tikai tad, ja ir instalēts tāds mods kā Shiny Mechanics.
enable-accumulators=Iespējot uzlabojumus akumulatoriem.
enable-agricultural-towers=Iespējot uzlabojumus lauksaimniecības torņiem.
enable-assembly-machines=Iespējot uzlabojumus montāžas mašīnām.
enable-asteroid-collectors=Iespējot uzlabojumus asteroīdu kolektoriem.
asteroid-collector-growth-level-limit=Ierobežo asteroīdu kolektoru kvalitātes izaugsmi līdz noklusējuma vērtībām, lai novērstu spēli sagraujošas problēmas.\n\nAsteroīdu kolektori ar modificētiem kvalitātes līmeņiem var iegūt pārāk daudz roku, kas kustas pārāk ātri, kļūstot nespējīgas satvert asteroīdu gabalus un radot lielu UPS noslogojumu.\n\n[color=green]Noklusējuma: leģendārs[/color]
enable-beacons=Iespējot uzlabojumus bākām.
enable-boilers=Iespējot uzlabojumus katliem.
enable-combinators-and-speakers=Iespējot uzlabojumus kombinatoriem un programmējamiem skaļruņiem.
enable-pumps=Iespējot uzlabojumus krasta sūkņiem un šķidruma sūkņiem.
enable-furnaces=Iespējot uzlabojumus krāsnīm.
enable-generators=Iespējot uzlabojumus tvaika dzinējiem, tvaika turbīnām un kodolsintēzes ģeneratoriem.
enable-heat-pipes=Iespējot uzlabojumus siltuma caurulēm.
enable-inserters=Iespējot uzlabojumus ievietotājiem.
enable-labs=Iespējot uzlabojumus pētniecības laboratorijām.
enable-lamps=Iespējot uzlabojumus lampām.
enable-lightning-rods=Iespējot uzlabojumus zibens nožņiem.
enable-mining-drills=Iespējot uzlabojumus ieguves urbjiem.
enable-poles=Iespējot uzlabojumus elektrības stabiem un apakšstacijām.
enable-power-switches=Iespējot uzlabojumus enerģijas slēdžiem.
enable-radar=Iespējot uzlabojumus radara stacijām.
radar-growth-level-limit=Ierobežo radara kvalitātes izaugsmi, lai novērstu pārmērīgu kartes izpēti un saglabāšanas faila uzpūšanos.\n\nRadari ar ļoti augstu kvalitātes līmeni var izraisīt lielus saglabāšanas failus (1200mb+) dēļ pārmērīgas kartes izpētes.\n\n[color=green]Noklusējuma: leģendārs[/color]
lightning-attractor-growth-level-limit=Ierobežo zibens pievilcēja kvalitātes izaugsmi, lai novērstu veiktspējas problēmas.\n\nZibens pievilcēji ar ļoti augstu kvalitātes līmeni ievērojami palielina pārklājuma zonas, kas var izraisīt aiztures naktī Fulgorā.\n\n[color=green]Noklusējuma: leģendārs[/color]
enable-reactors=Iespējot uzlabojumus kodolreaktoriem un kodolsintēzes reaktoriem.
enable-rocket-silos=Iespējot uzlabojumus raķešu silosiem.
enable-roboports=Iespējot uzlabojumus roboportiem.
enable-solar-panels=Iespējot uzlabojumus saules paneļiem.
enable-thrusters=Iespējot uzlabojumus kosmosa dzinējiem. Ātrāki kuģi var pārslogot savu aizsardzību.
thruster-growth-level-limit=Pēc izvēles ierobežot kosmosa dzinējus līdz spēles pamata kvalitātes līmeņiem. Modificēti kvalitātes līmeņi var ievērojami paātrināt kosmosa kuģus, pārslogojot to aizsardzību.
enable-turrets=Iespējot uzlabojumus munīcijas, lāzera, liesmetēju un artilērijas torņiem. Torņi nopelna 'ražošanas stundas', nodarot bojājumus.
turret-damage-per-manufacturing-hour=Bojājumu daudzums, kas tornim jānodara, lai nopelnītu vienu ražošanas stundu.\n\nNoklusējums: 36 000 bojājumu (aprēķināts, pamata līmeņa tornim stundu nepārtraukti šaujot caurdurošus šāviņus).
turrets-contribute-credits=Ļaut torņiem veicināt sekundāro entītiju, piemēram, ievietotāju un elektrības stabu, uzlabojumus uz tās pašas virsmas. Spēles vēlīnajā posmā ar sliežu lielgabaliem un zibens torņiem tas var ievērojami paātrināt uzlabojumus.
enable-defense-walls-and-gates=Iespējot uzlabojumus sienām un vārtiem.
custom-upgrade-limit-a=Maksimālais kvalitātes līmenis, ko izmanto tālākajos ierobežojumos ar iestatījumu 'Custom A'. Nepieciešams tikai tad, ja mods pievieno kvalitātes līmeņus virs leģendārā un vēlaties ierobežot entītijas uzlabošanas līmeni, piemēram, atļaut asteroīdu kolektoriem sasniegt 10. līmeni. Lai izmantotu šo funkciju, iestatiet šeit maksimālo līmeni, pēc tam atrodiet ierobežojamo entītiju un nolaižamajā izvēlnē izvēlieties 'Custom A'. Atsaucei — leģendāra kvalitāte ir 5. līmenis.
custom-upgrade-limit-b=Maksimālais kvalitātes līmenis, ko uzlabošanas ierobežojumu iestatījumos izmanto Custom B.
custom-upgrade-limit-c=Maksimālais kvalitātes līmenis, ko uzlabošanas ierobežojumu iestatījumos izmanto Custom C.
upgrade-limit-accumulators=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-agricultural-towers=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-assembly-machines=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-beacons=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-boilers=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-combinators-and-speakers=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.\n\nIekļauj: aritmētiskos kombinatorus, lēmumu kombinatorus, konstantos kombinatorus, programmējamos skaļruņus.
upgrade-limit-defense-walls-and-gates=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-furnaces=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-generators=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.\n\nIekļauj: tvaika dzinējus, tvaika turbīnas, kodolsintēzes ģeneratorus.
upgrade-limit-heat-pipes=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-inserters=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-labs=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-lamps=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-mining-drills=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-poles=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.\n\nIekļauj elektrības stabus un apakšstacijas.
upgrade-limit-power-switches=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-pumps=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.\n\nIekļauj: krasta sūkņus un šķidruma sūkņus.
upgrade-limit-reactors=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.\n\nIekļauj: kodolreaktorus, kodolsintēzes reaktorus.
upgrade-limit-rocket-silos=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-roboports=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-solar-panels=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.
upgrade-limit-turrets=Maksimālā šo entītiju uzlabošanas kvalitāte. Parasta atspējo uzlabojumus; Pielāgots A/B/C izmanto iepriekš norādīto pielāgoto līmeni.\n\nIekļauj: munīcijas torņus, lāzertorņus, liesmetējus, artilērijas torņus.
upgrade-limit-asteroid-collectors=Ierobežot asteroīdu kolektorus līdz leģendārai kvalitātei, lai novērstu spēli graujošas problēmas. Modificēti līmeņi var radīt pārāk daudz roku, kas kustas pārāk ātri, nespēj satvert asteroīdu gabalus un ievērojami samazina UPS.
upgrade-limit-radar=Ierobežot radarus līdz leģendārai kvalitātei, lai novērstu saglabāšanas faila pārmērīgu palielināšanos. Modificētas kvalitātes var izraisīt pārmērīgu kartes izpēti, radot ļoti lielus failus (virs gigabaita).
upgrade-limit-lightning-rods=Ierobežot zibens pievilcējus līdz leģendārai kvalitātei, lai novērstu UPS svārstības. Zibens pievilcējiem ar modificētiem kvalitātes līmeņiem ir ievērojami lielāks pārklājums, kas naktī uz Fulgoras var izraisīt aiztures.
upgrade-limit-thrusters=Ierobežot kosmosa dzinējus līdz leģendārai kvalitātei, lai novērstu negaidītus kosmosa platformas bojājumus. Modificēti kvalitātes līmeņi var ievērojami paātrināt kosmosa kuģus, pārslogojot to aizsardzību.

