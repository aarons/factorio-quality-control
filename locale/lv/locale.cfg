[mod-setting-description]
manufacturing-hours-for-change=Ražošanas stundu skaits, kas nepieciešams, lai mēģinātu kvalitātes maiņu.\nRažošanas stundas uzkrājas tikai tad, kad mašīna aktīvi strādā. Ja tā dīkstāv, progress nenotiek.\nMin vērtība 0,001 stundas (3,6 sekundes), Max vērtība 1000 stundas.
crafting-speed-affects-progression=Nosaka, vai mašīnas izgatavošanas ātrums ietekmē to, cik ātri tā uzkrāj ražošanas stundas.\n\n[color=green]Iespējots (noklusējums):[/color] Mašīnas ar lielāku izgatavošanas ātrumu progresēs ātrāk. Ražošanas stundas tiek uzkrātas, balstoties uz mašīnas izgatavošanas ātrumu un produktivitāti. Lietuve ar ātrumu 4 un 50% produktivitāti progresēs sešas reizes ātrāk nekā 2. līmeņa montāžas mašīna ar izgatavošanas ātrumu 1.\n\n[color=red]Atspējots:[/color] Izgatavošanas ātrums neietekmē progresu. Viena stunda, kas pavadīta aktīvi izgatavojot, tiek uzskatīta par vienu ražošanas stundu neatkarīgi no izgatavošanas ātruma. Tas novērš kumulatīvo efektu, kad katrs kvalitātes uzlabojums paātrina nākamo.
percentage-chance-of-change=Procentuālā iespējamība, ka kvalitātes maiņa būs veiksmīga.\nMin vērtība 0,0001%, Max vērtība 100% (vienmēr mainīt pēc laika pagāšanas)
quality-increase-cost=Šis palielina laiku starp mēģinājumiem katram kvalitātes līmenim. Šī ir salikta formula. Iestatot uz 0% laiks starp mēģinājumiem paliks vienāds neatkarīgi no kvalitātes līmeņa\n\n[color=green]Piemērs ar 3 ražošanas stundām un 50% izmaksām katrā līmenī[/color]\n\nNormāls: 3 stundas\nNeparasts: 4,5 stundas\nRets: 6,8 stundas\nEpiskais: 10,1 stundas\nLeģendārais: 15,2 stundas\nModificētās kvalitātes 10. līm.: 173 stundas
quality-chance-accumulation-rate=Kontrolē, cik palielinās iespējamība pēc katra neveiksmīga mēģinājuma.\n\n[color=white]Nav (noklusējuma):[/color] Nav uzkrāšanas - iespējamība paliek nemainīga.\n\n[color=white]Zems (20%):[/color] Iespējamība pieaug par 20% no pamata likmes katru neveiksmju.\n\n[color=white]Vidējs (50%):[/color] Iespējamība pieaug par 50% no pamata likmes katru neveiksmju.\n\n[color=white]Augsts (100%):[/color] Iespējamība pieaug par 100% no pamata likmes katru neveiksmju.\n\n[color=yellow]Piemērs ar 1% pamata iespējamību:[/color]\n\n[color=white]Zems:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Augsts:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nVisi uzkrāšanas iestatījumi galu galā garantē kvalitātes maiņas - augstāki iestatījumi vienkārši ātrāk sasniedz 100% iespējamību
accumulate-at-max-quality=Maksimālās kvalitātes montētāji joprojām piedalās:\nKad iespējots, maksimālās kvalitātes montētāji un krāsnis turpinās izsekot ražošanas stundas un ģenerēt uzlabojumu kredītus sekundārajām entītijām (piemēram, ievietotājiem, bākām u.c.), pat ja paši nevar uzlaboties tālāk.\n\n[color=green]Iespējots (noklusējuma):[/color] Maksimālās kvalitātes montētāji turpina ģenerēt uzlabojumu kredītus sekundārajām entītijām. Tas var nodrošināt stabilu progresu sekundārajām entītijām vēlajā spēlē.\n\n[color=red]Atspējots:[/color] Tikai zemas kvalitātes montētāji un krāsnis, kas vēl var uzlaboties, ģenerē kredītus, bet tie tiek ģenerēti kā attiecība pret sekundārajām entītijām, kas vēl vajag uzlabojumus. Ekstrēmā gadījumā tas nozīmē, ka viens zemas kvalitātes montētājs var virzīt visas rūpnīcas sekundārās entītijas.
change-modules-with-entity=Šis kontrolē, vai moduļi mašīnās tiek ietekmēti ar kvalitātes maiņām.\n\n[color=white]Atspējots (noklusējuma):[/color] Moduļi netiek ietekmēti, kad mainās tā saimnieka mašīnas kvalitāte.\n\n[color=white]Iespējots:[/color] Moduļi maina kvalitāti par vienu līmeni, kad mainās to saimnieks. Tie nepārsniegs saimnieka kvalitātes līmeni.\n\n[color=white]Extra iespējots:[/color] Tāpat kā iespējots, bet moduļi tiks atjaunināti, lai atbilstu to saimnieka mašīnas kvalitātei jebkurā laikā, kad notiek kvalitātes maiņa.
batch-entities-per-tick=Entītiju skaits, ko apstrādāt katrā taktī, lai izvairītos no veiktspējas lēcieniem.\nMin vērtība 1, Max vērtība 1000.\nAugstākas vērtības var izraisīt aiztures, bet apstrādā entītijas ātrāk.
batch-ticks-between-processing=Taktu skaits, ko gaidīt starp pakešu apstrādes cikliem.\nMin vērtība 1 takts, Max vērtība 6000 takti (~2,5 minūtes).\nZemākas vērtības apstrādā biežāk, bet var ietekmēt veiktspēju.
quality-change-aggregate-alerts-enabled=Rādīt konsoles ziņas, kas apkopo visas kvalitātes maiņas (attēlotas reizi 5 minūtēs). Piemērs: "3 montāžas mašīnas uzlabotas, 2 ievietotāji uzlaboti"
quality-change-entity-alerts-enabled=Rādīt kartes ping brīdinājumus par individuālām entītijām, kad mainās to kvalitāte. Noklikšķiniet uz brīdinājuma, lai skatītu uzlaboto entītiju.
quality_control_skip_hidden_qualities=Kvalitātes kontrole izlaidīs slēptās kvalitātes (piemēram, spīdīgos variantus), veicot uzlabojumus. Entītijas nekad nekļūs spīdīgas caur Kvalitātes kontroli - spēlētājiem tās ir jāiegūst parastajā veidā. Šis iestatījums attiecas tikai tad, ja ir instalēts Shiny Mechanics kvalitātes mods.
quality_control_hidden_qualities_sticky=Entītijas ar slēptām kvalitātēm (piemēram, spīdīgas) netiks uzlabotas tālāk, saglabājot to unikālās priekšrocības. Šis iestatījums attiecas tikai tad, ja ir instalēts Shiny Mechanics kvalitātes mods.
enable-accumulators=Iespējot kvalitātes maiņas akumulatoriem.
enable-agricultural-towers=Iespējot kvalitātes maiņas lauksaimniecības torņiem.
enable-assembly-machines=Iespējot kvalitātes maiņas montāžas mašīnām.
enable-asteroid-collectors=Iespējot kvalitātes maiņas asteroīdu kolektoriem.
asteroid-collector-growth-level-limit=Ierobežo asteroīdu kolektoru kvalitātes izaugsmi līdz noklusējuma vērtībām, lai novērstu spēli sagraujošas problēmas.\n\nAsteroīdu kolektori ar modificētiem kvalitātes līmeņiem var iegūt pārāk daudz roku, kas kustas pārāk ātri, kļūstot nespējīgas satvert asteroīdu gabalus un radot lielu UPS noslogojumu.\n\n[color=green]Noklusējuma: leģendārs[/color]
enable-beacons=Iespējot kvalitātes maiņas bākām.
enable-boilers=Iespējot kvalitātes maiņas katliem.
enable-combinators-and-speakers=Iespējot kvalitātes maiņas kombinatoriem un skaļruņiem.\n\nIekļauj: aritmētiskos kombinatorus, lēmuma kombinatorus, konstanto kombinatorus, programmējamos skaļruņus.
enable-pumps=Iespējot kvalitātes maiņas sūkņiem (ietver krasta sūkņus un šķidruma sūkņus).
enable-furnaces=Iespējot kvalitātes maiņas krāsnīm.
enable-generators=Iespējot kvalitātes maiņas ģeneratoriem (tvaika dzinējiem, tvaika turbīnām, kodolsintēzes ģeneratoriem).
enable-heat-pipes=Iespējot kvalitātes maiņas siltuma caurulēm.
enable-inserters=Iespējot kvalitātes maiņas ievietotājiem.
enable-labs=Iespējot kvalitātes maiņas pētniecības laboratorijām.
enable-lamps=Iespējot kvalitātes maiņas lampām.
enable-lightning-rods=Iespējot kvalitātes maiņas zibens nožņiem.
enable-mining-drills=Iespējot kvalitātes maiņas visiem ieguves urbjiem.
enable-poles=Iespējot kvalitātes maiņas visiem elektriskiem stabiem (ietver lielus elektrostabos un apakšstacijas).
enable-power-switches=Iespējot kvalitātes maiņas enerģijas slēdžiem.
enable-radar=Iespējot kvalitātes maiņas radar stacijām.
radar-growth-level-limit=Ierobežo radara kvalitātes izaugsmi, lai novērstu pārmērīgu kartes izpēti un saglabāšanas faila uzpūšanos.\n\nRadari ar ļoti augstu kvalitātes līmeni var izraisīt lielus saglabāšanas failus (1200mb+) dēļ pārmērīgas kartes izpētes.\n\n[color=green]Noklusējuma: leģendārs[/color]
lightning-attractor-growth-level-limit=Ierobežo zibens pievilcēja kvalitātes izaugsmi, lai novērstu veiktspējas problēmas.\n\nZibens pievilcēji ar ļoti augstu kvalitātes līmeni ievērojami palielina pārklājuma zonas, kas var izraisīt aiztures naktī Fulgorā.\n\n[color=green]Noklusējuma: leģendārs[/color]
enable-reactors=Iespējot kvalitātes maiņas reaktoriem (kodolreaktoriem, kodolsintēzes reaktoriem).
enable-rocket-silos=Iespējot kvalitātes maiņas raķešu silosiem.
enable-roboports=Iespējot kvalitātes maiņas roboportiem.
enable-solar-panels=Iespējot kvalitātes maiņas saules paneļiem.
enable-thrusters=Iespējot kvalitātes maiņas kosmosa dzinējiem. Pēc noklusējuma atspējots, jo negaidīta kosmosa kuģa ātruma maiņa var pārslogot tā aizsardzību.
thruster-growth-level-limit=Ierobežo kosmosa dzinēju kvalitātes izaugsmi līdz noklusējuma līmeņiem, lai novērstu aizsardzības problēmas.\n\nModificētu kvalitātes līmeņu kosmosa kuģi var kustēties ievērojami ātrāk, kas var pārslogot to aizsardzību.\n\n[color=green]Noklusējuma: leģendārs[/color]
enable-turrets=Iespējot kvalitātes maiņas torņiem.\n\nTorņi ir primārās entītijas, kas ģenerē uzlabojumu kredītus, balstoties uz kopējiem nodarītajiem bojājumiem.\n\nIekļauj: munīcijas torņus, lāzera torņus, liesmetējus, artilērijas torņus.
turret-damage-per-manufacturing-hour=Bojājumu daudzums, ko tornītim jānodarā, lai tas būtu vienāds ar vienu ražošanas stundu.\n\nNoklusējuma: 36 000 bojājumi (iegūti no caurdurošiem šāviņiem: 450 lādētāji/stundā × 80 bojājumi/lādētājā).\n\nZemākas vērtības liek torņiem ātrāk ģenerēt kredītus.
turrets-contribute-credits=Nosaka, vai torņu nopelnītie uzlabošanas kredīti tiek pievienoti arī kopīgajam fondam, kas uzlabo sekundārās entītijas (ievadītājus, elektrības stabus u.c.).\n\n[color=red]Izslēgts (noklusējums):[/color] Torņa kredīti paliek pie torņa. Kaujas bojājumi palīdz uzlaboties tikai pašiem torņiem.\n\n[color=green]Ieslēgts:[/color] Torņa kredīti plūst arī uz kopīgo fondu, tāpēc kaujas bojājumi virza sekundāro entītiju progresu tāpat kā ražošana.
enable-defense-walls-and-gates=Iespējot kvalitātes maiņas sienām un vārtiem.\n\nIekļauj: sienas, vārtus.
custom-upgrade-limit-a=Izmantojiet šo, lai iestatītu pielāgotus ierobežojumus entītiju modificētajām kvalitātēm. Nepieciešams tikai tad, ja jums ir modifikācija, kas pievieno kvalitātes līmeņus virs leģendāra, un vēlaties ierobežot, cik lielā mērā entītija tiks uzlabota. Lai izmantotu šo funkciju, iestatiet šeit maksimālo līmeni, pēc tam dodieties uz entītiju, kuru vēlaties ierobežot, un izvēlnē izvēlieties "Custom A". Atsaucei — leģendārs ir 5. līmenis (parasta = 1, neparasta = 2, reta = 3, episka = 4, leģendāra = 5...).
custom-upgrade-limit-b=Izmantojiet šo, lai iestatītu pielāgotus ierobežojumus entītiju modificētajām kvalitātēm. Nepieciešams tikai tad, ja jums ir modifikācija, kas pievieno kvalitātes līmeņus virs leģendāra, un vēlaties ierobežot, cik lielā mērā entītija tiks uzlabota. Lai izmantotu šo funkciju, iestatiet šeit maksimālo līmeni, pēc tam dodieties uz entītiju, kuru vēlaties ierobežot, un izvēlnē izvēlieties "Custom B". Atsaucei — leģendārs ir 5. līmenis (parasta = 1, neparasta = 2, reta = 3, episka = 4, leģendāra = 5...).
custom-upgrade-limit-c=Izmantojiet šo, lai iestatītu pielāgotus ierobežojumus entītiju modificētajām kvalitātēm. Nepieciešams tikai tad, ja jums ir modifikācija, kas pievieno kvalitātes līmeņus virs leģendāra, un vēlaties ierobežot, cik lielā mērā entītija tiks uzlabota. Lai izmantotu šo funkciju, iestatiet šeit maksimālo līmeni, pēc tam dodieties uz entītiju, kuru vēlaties ierobežot, un izvēlnē izvēlieties "Custom C". Atsaucei — leģendārs ir 5. līmenis (parasta = 1, neparasta = 2, reta = 3, episka = 4, leģendāra = 5...).
upgrade-limit-accumulators=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-agricultural-towers=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-assembly-machines=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-beacons=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-boilers=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.
upgrade-limit-combinators-and-speakers=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.\n\nIekļauj: aritmētiskos kombinatorus, lēmumu kombinatorus, konstantu kombinatorus, programmējamos skaļruņus.
upgrade-limit-defense-walls-and-gates=Kvalitātes kontrole uzlabos šīs entītijas līdz šai kvalitātei, pēc tam pārtrauks turpmākus uzlabošanas mēģinājumus. Iestatiet šo uz "Parasta", lai novērstu jebkādus uzlabošanas mēģinājumus. Pielāgotās vērtības izmanto iestatījumus Pielāgots uzlabošanas ierobežojums A/B/C.\n\nIekļauj: sienas, vārtus.
