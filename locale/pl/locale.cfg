# To tłumaczenie zostało wygenerowane przez sztuczną inteligencję. Korekty są bardzo mile widziane! Prosimy o dodanie opinii na forum dyskusyjnym moda (https://mods.factorio.com/mod/quality-control/discussion) lub jako problem na repozytorium GitHub (https://github.com/aarons/factorio-quality-control/issues). Przepraszamy za błędy!

