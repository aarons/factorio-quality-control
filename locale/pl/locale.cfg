[mod-setting-description]
manufacturing-hours-for-change=Liczba godzin produkcji wymagana do próby zmiany jakości.\nGodziny produkcji są akumulowane tylko wtedy, gdy maszyna aktywnie pracuje. Jeśli stoi bezczynnie, nie będzie postępować.\nWartość min 0,001 godziny (3,6 sekundy), Wartość maks 1000 godzin.
crafting-speed-affects-progression=Kontroluje, czy prędkość wytwarzania maszyny wpływa na szybkość zdobywania godzin produkcji.\n\n[color=green]Włączone (domyślnie):[/color] Maszyny o wyższej prędkości wytwarzania będą postępować szybciej. Godziny produkcji są zdobywane na podstawie prędkości wytwarzania i produktywności maszyny. Odlewnia z prędkością 4 i produktywnością 50% będzie postępować sześć razy szybciej niż assembler-2 z prędkością wytwarzania 1.\n\n[color=red]Wyłączone:[/color] Prędkość wytwarzania nie ma wpływu na postęp. Jedna godzina spędzona na aktywnym wytwarzaniu liczy się jako jedna godzina produkcji, niezależnie od prędkości wytwarzania. Usuwa to efekt kumulacji, w którym każde ulepszenie jakości przyspiesza kolejne.
percentage-chance-of-change=Procentowa szansa powodzenia zmiany jakości.\nWartość min 0,0001%, Wartość maks 100% (zawsze zmień po upływie czasu)
quality-increase-cost=To zwiększa czas między próbami zmian na poziom jakości. To jest formuła złożona. Ustawienie na 0% utrzyma ten sam czas między próbami niezależnie od poziomu jakości\n\n[color=green]Przykład z 3 godzinami produkcji potrzebnymi przy 50% kosztu na poziom[/color]\n\nNormalny: 3 godziny\nNiezwykły: 4,5 godziny\nRzadki: 6,8 godziny\nEpicki: 10,1 godziny\nLegendarny: 15,2 godziny\nZmodyfikowana jakość poz. 10: 173 godziny
quality-chance-accumulation-rate=Kontroluje o ile wzrasta szansa po każdej nieudanej próbie.\n\n[color=white]Brak (Domyślny):[/color] Brak akumulacji - szansa pozostaje stała.\n\n[color=white]Niska (20%):[/color] Szansa wzrasta o 20% podstawowej wartości przy każdej porażce.\n\n[color=white]Średnia (50%):[/color] Szansa wzrasta o 50% podstawowej wartości przy każdej porażce.\n\n[color=white]Wysoka (100%):[/color] Szansa wzrasta o 100% podstawowej wartości przy każdej porażce.\n\n[color=yellow]Przykład z 1% podstawową szansą:[/color]\n\n[color=white]Niska:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Wysoka:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nWszystkie ustawienia akumulacji ostatecznie gwarantują zmiany jakości - wyższe ustawienia po prostu szybciej osiągają 100% szansę
secondary-progression-rate=Jak szybko postępują jednostki drugorzędne (insertery, słupy, beacony - wszystko, co nie może samodzielnie mierzyć swojej pracy), wyrażone jako procent tego, co zarabia przeciętna jednostka pierwszorzędna na tej samej powierzchni.\n\n[color=green]100% (domyślnie):[/color] Jednostki drugorzędne postępują w tym samym tempie, co przeciętna maszyna montażowa, piec, silos rakietowy lub wieżyczka w ich otoczeniu.\n\nUstaw na 0%, aby całkowicie zatrzymać postęp drugorzędny; wartości powyżej 100% przyspieszają ulepszanie infrastruktury ponad tempo maszyn produkcyjnych.\n\nMożna zmienić w trakcie gry bez restartu.
change-modules-with-entity=To kontroluje czy moduły w maszynach są dotknięte zmianami jakości.\n\n[color=white]Wyłączone (Domyślnie):[/color] Moduły nie są dotknięte kiedy zmienia się jakość maszyny gospodarza.\n\n[color=white]Włączone:[/color] Moduły zmieniają jakość o jeden poziom gdy zmienia się ich gospodarz. Nie przekroczą poziomu jakości gospodarza.\n\n[color=white]Dodatkowo Włączone:[/color] Jak Włączone, ale moduły będą aktualizowane dopasowane do jakości ich maszyny gospodarza za każdym razem gdy wystąpi zmiana jakości.
batch-entities-per-tick=Liczba jednostek do przetworzenia w każdym takcie aby uniknąć skoków wydajności.\nWartość min 1, Wartość maks 1000.\nWyższe wartości mogą powodować laggi, ale przetwarzają jednostki szybciej.
batch-ticks-between-processing=Liczba taktów do odczekania między cyklami przetwarzania wsadowego.\nWartość min 1 takt, Wartość maks 6000 taktów (~2,5 minuty).\nNiższe wartości przetwarzają częściej, ale mogą wpływać na wydajność.
quality-change-aggregate-alerts-enabled=Pokaż wiadomości konsoli podsumowujące wszystkie zmiany jakości (wyświetlane raz na 5 minut). Przykład: "3 maszyny montażowe ulepszono, 2 manipulatory ulepszono"
quality-change-entity-alerts-enabled=Pokaż alerty pingowania na mapie dla pojedynczych jednostek gdy zmienia się ich jakość. Kliknij alert aby zobaczyć ulepszoną jednostkę.
quality_control_skip_hidden_qualities=Kontrola Jakości pominie ukryte jakości (np. błyszczące warianty) podczas ulepszania. Jednostki nigdy nie staną się błyszczące przez Kontrolę Jakości - gracze muszą je zdobyć w normalny sposób. To ustawienie ma zastosowanie tylko gdy masz zainstalowany mod Shiny Mechanics quality.
quality_control_hidden_qualities_sticky=Jednostki z ukrytymi jakościami (np. błyszczące) nie będą się dalej ulepszać, zachowując swoje unikalne korzyści. To ustawienie ma zastosowanie tylko gdy masz zainstalowany mod Shiny Mechanics quality.
enable-accumulators=Włącz zmiany jakości dla akumulatorów.
enable-agricultural-towers=Włącz zmiany jakości dla wież rolniczych.
enable-assembly-machines=Włącz zmiany jakości dla maszyn montażowych.
enable-asteroid-collectors=Włącz zmiany jakości dla zbieraczy asteroid.
asteroid-collector-growth-level-limit=Ogranicza wzrost jakości zbieracza asteroid do wartości standardowych, aby zapobiec problemom niszczącym grę.\n\nZbieracze asteroid z zmodyfikowanymi poziomami jakości mogą mieć zbyt wiele ramion poruszających się zbyt szybko, przez co nie są w stanie złapać fragmentów asteroid i powodują duże obciążenie UPS.\n\n[color=green]Domyślnie: legendarny[/color]
enable-beacons=Włącz zmiany jakości dla latarni.
enable-boilers=Włącz zmiany jakości dla kotłów.
enable-combinators-and-speakers=Włącz zmiany jakości dla kombinatorów i głośników.\n\nObejmuje: kombinatory arytmetyczne, kombinatory decyzyjne, kombinatory stałe, głośniki programowalne.
enable-pumps=Włącz zmiany jakości dla pomp (obejmuje pompy przybrzeżne i pompy płynów).
enable-furnaces=Włącz zmiany jakości dla pieców.
enable-generators=Włącz zmiany jakości dla generatorów (silniki parowe, turbiny parowe, generatory fuzyjne).
enable-heat-pipes=Włącz zmiany jakości dla rurociągów ciepła.
enable-inserters=Włącz zmiany jakości dla manipulatorów.
enable-labs=Włącz zmiany jakości dla laboratoriów badawczych.
enable-lamps=Włącz zmiany jakości dla lamp.
enable-lightning-rods=Włącz zmiany jakości dla piorunochronów.
enable-mining-drills=Włącz zmiany jakości dla wszystkich wierteł wydobywczych.
enable-poles=Włącz zmiany jakości dla wszystkich słupów elektrycznych (w tym wielkie słupy elektryczne i podstacje).
enable-power-switches=Włącz zmiany jakości dla przełączników zasilania.
enable-radar=Włącz zmiany jakości dla stacji radarowych.
radar-growth-level-limit=Ogranicza wzrost jakości radaru w celu zapobiegania nadmiernemu eksploracji mapy i rozrostowi pliku zapisu.\n\nRadary o bardzo wysokich poziomach jakości mogą powodować duże pliki zapisu (1200mb+) z powodu nadmiernej eksploracji mapy.\n\n[color=green]Domyślnie: legendarny[/color]
lightning-attractor-growth-level-limit=Ogranicza wzrost jakości przyciągacza błyskawic w celu zapobiegania problemom z wydajnością.\n\nPrzyciągacze błyskawic o bardzo wysokich poziomach jakości mają znacznie zwiększone obszary pokrycia, co może powodować opóźnienia w nocy na Fulgorze.\n\n[color=green]Domyślnie: legendarny[/color]
enable-reactors=Włącz zmiany jakości dla reaktorów (reaktory jądrowe, reaktory fuzyjne).
enable-rocket-silos=Włącz zmiany jakości dla silosów rakietowych.
enable-roboports=Włącz zmiany jakości dla roboportów.
enable-solar-panels=Włącz zmiany jakości dla paneli słonecznych.
enable-thrusters=Włącz zmiany jakości dla silników kosmicznych. Domyślnie wyłączone, ponieważ nieoczekiwana zmiana prędkości statku kosmicznego może sprawić, że obrony zostaną przytłoczone.
thruster-growth-level-limit=Ogranicza wzrost jakości silników kosmicznych do poziomu standardowego, aby zapobiec problemom z obroną.\n\nZmodyfikowane poziomy jakości mogą sprawić, że statki kosmiczne poruszają się znacznie szybciej, co może przytłoczyć ich obronę.\n\n[color=green]Domyślnie: legendarny[/color]
enable-turrets=Włącz zmiany jakości dla wieżyczek.\n\nWieżyczki są jednostkami pierwszorzędnymi, które generują kredyty ulepszenia na podstawie łącznych zadanych obrażeń.\n\nObejmuje: wieżyczki amunicyjne, wieżyczki laserowe, miotacze ognia, wieżyczki artyleryjskie.
turret-damage-per-manufacturing-hour=Ilość obrażeń, jaką wieżyczka musi zadać, aby równała się jednej godzinie produkcji.\n\nDomyślnie: 36 000 obrażeń (wynikające z amunicji przebijającej: 450 magazynków/godzinę × 80 obrażeń/magazynek).\n\nNiższe wartości sprawiają, że wieżyczki generują kredyty szybciej.
turrets-contribute-credits=Kontroluje, czy kredyty ulepszeń zdobywane przez wieżyczki zasilają również wspólną pulę, która ulepsza jednostki drugorzędne (inserterów, słupy elektryczne itp.).\n\n[color=red]Wyłączone (domyślnie):[/color] Kredyty wieżyczki pozostają przy wieżyczce. Obrażenia bojowe pomagają tylko wieżyczkom ulepszać się samodzielnie.\n\n[color=green]Włączone:[/color] Kredyty wieżyczki płyną również do wspólnej puli, dzięki czemu obrażenia bojowe rozwijają jednostki drugorzędne tak samo, jak produkcja.
enable-defense-walls-and-gates=Włącz zmiany jakości dla murów i bram.\n\nObejmuje: mury, bramy.
custom-upgrade-limit-a=Użyj tego, aby ustawić niestandardowe limity dla zmodyfikowanych jakości jednostek. Potrzebne tylko wtedy, gdy masz mod dodający poziomy jakości powyżej legendarnej i chcesz ograniczyć stopień ulepszenia jednostki. Aby skorzystać z tej funkcji, ustaw tutaj maksymalny poziom, a następnie przejdź do jednostki, którą chcesz ograniczyć, i wybierz 'Niestandardowa A' z listy rozwijanej. Dla odniesienia, legendarna to poziom 5 (zwykła = 1, niezwykła = 2, rzadka = 3, epicka = 4, legendarna = 5...).
custom-upgrade-limit-b=Użyj tego, aby ustawić niestandardowe limity dla zmodyfikowanych jakości jednostek. Potrzebne tylko wtedy, gdy masz mod dodający poziomy jakości powyżej legendarnej i chcesz ograniczyć stopień ulepszenia jednostki. Aby skorzystać z tej funkcji, ustaw tutaj maksymalny poziom, a następnie przejdź do jednostki, którą chcesz ograniczyć, i wybierz 'Niestandardowa B' z listy rozwijanej. Dla odniesienia, legendarna to poziom 5 (zwykła = 1, niezwykła = 2, rzadka = 3, epicka = 4, legendarna = 5...).
custom-upgrade-limit-c=Użyj tego, aby ustawić niestandardowe limity dla zmodyfikowanych jakości jednostek. Potrzebne tylko wtedy, gdy masz mod dodający poziomy jakości powyżej legendarnej i chcesz ograniczyć stopień ulepszenia jednostki. Aby skorzystać z tej funkcji, ustaw tutaj maksymalny poziom, a następnie przejdź do jednostki, którą chcesz ograniczyć, i wybierz 'Niestandardowa C' z listy rozwijanej. Dla odniesienia, legendarna to poziom 5 (zwykła = 1, niezwykła = 2, rzadka = 3, epicka = 4, legendarna = 5...).
upgrade-limit-accumulators=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-agricultural-towers=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-assembly-machines=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-beacons=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-boilers=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-combinators-and-speakers=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.\n\nObejmuje: kombinatory arytmetyczne, kombinatory decyzyjne, kombinatory stałe, głośniki programowalne.
upgrade-limit-defense-walls-and-gates=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.\n\nObejmuje: mury, bramy.
upgrade-limit-furnaces=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-generators=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.\n\nObejmuje: silniki parowe, turbiny parowe, generatory fuzyjne.
upgrade-limit-heat-pipes=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-inserters=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-labs=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-lamps=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-mining-drills=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-poles=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.\n\nObejmuje: wszystkie słupy elektryczne, duże słupy energetyczne i podstacje.
upgrade-limit-power-switches=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-pumps=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.\n\nObejmuje: pompy poboru wody i pompy cieczy.
upgrade-limit-reactors=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.\n\nObejmuje: reaktory jądrowe, reaktory fuzyjne.
upgrade-limit-rocket-silos=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-roboports=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-solar-panels=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.
upgrade-limit-turrets=Kontrola Jakości będzie ulepszać te jednostki do tej jakości, a następnie przestanie próbować dalszych ulepszeń. Ustaw na Zwykła, aby zapobiec jakimkolwiek próbom ulepszenia. Wartości niestandardowe korzystają z ustawień Niestandardowy limit ulepszeń A/B/C.\n\nObejmuje: wieżyczki na amunicję, wieżyczki laserowe, miotacze ognia, wieżyczki artyleryjskie.
upgrade-limit-asteroid-collectors=Ogranicza wzrost jakości zbieracza asteroid do wartości standardowych, aby zapobiec problemom niszczącym grę.\n\nZbieracze asteroid z zmodyfikowanymi poziomami jakości mogą mieć zbyt wiele ramion poruszających się zbyt szybko, przez co nie są w stanie złapać fragmentów asteroid i powodują duże obciążenie UPS.\n\n[color=green]Domyślnie: legendarny[/color]
upgrade-limit-radar=Ogranicza wzrost jakości radaru w celu zapobiegania nadmiernemu eksploracji mapy i rozrostowi pliku zapisu.\n\nRadary o bardzo wysokich poziomach jakości mogą powodować duże pliki zapisu (1200mb+) z powodu nadmiernej eksploracji mapy.\n\n[color=green]Domyślnie: legendarny[/color]
upgrade-limit-lightning-rods=Ogranicza wzrost jakości przyciągacza błyskawic w celu zapobiegania problemom z wydajnością.\n\nPrzyciągacze błyskawic o bardzo wysokich poziomach jakości mają znacznie zwiększone obszary pokrycia, co może powodować opóźnienia w nocy na Fulgorze.\n\n[color=green]Domyślnie: legendarny[/color]
upgrade-limit-thrusters=Ogranicza wzrost jakości silników kosmicznych do poziomu standardowego, aby zapobiec problemom z obroną.\n\nZmodyfikowane poziomy jakości mogą sprawić, że statki kosmiczne poruszają się znacznie szybciej, co może przytłoczyć ich obronę.\n\n[color=green]Domyślnie: legendarny[/color]

