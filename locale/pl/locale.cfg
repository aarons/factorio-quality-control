[mod-setting-description]
manufacturing-hours-for-change=Liczba godzin produkcji wymagana do próby zmiany jakości.\nGodziny produkcji są akumulowane tylko wtedy, gdy maszyna aktywnie pracuje. Jeśli stoi bezczynnie, nie będzie postępować.\nWartość min 0,001 godziny (3,6 sekundy), Wartość maks 1000 godzin.
crafting-speed-affects-progression=[color=red]Wyłączone (domyślnie):[/color] Prędkość wytwarzania nie ma wpływu na postęp, co pomaga równomierniej rozłożyć ulepszenia w trakcie dłuższej rozgrywki.\n\n[color=green]Włączone:[/color] Prędkość wytwarzania i produktywność zwiększają liczbę zdobywanych godzin produkcji. Prędkość 4 z produktywnością 50% daje sześć razy więcej godzin niż prędkość 1 bez premii do produktywności. Wzrost prędkości dzięki ulepszeniom jakości może się kumulować, prowadząc do bardzo szybkich ulepszeń w późnej fazie gry.
percentage-chance-of-change=Szansa powodzenia próby ulepszenia.
quality-increase-cost=Wzrost liczby godzin produkcji wymaganych na kolejnych poziomach jakości. Wzrost jest składany; 0% utrzymuje ten sam wymóg na wszystkich poziomach.\n\nPrzy 50% wymóg 3 godzin wzrasta do 4,5 godziny dla jakości niezwykłej i 6,75 godziny dla rzadkiej.
quality-chance-accumulation-rate=Zwiększa szansę ulepszenia po nieudanej próbie o procent szansy podstawowej.\n\n[color=white]Brak:[/color] Szansa pozostaje stała.\n[color=white]Niska:[/color] Dodaje 20% szansy podstawowej.\n[color=white]Średnia:[/color] Dodaje 50% szansy podstawowej.\n[color=white]Wysoka:[/color] Dodaje 100% szansy podstawowej.\n\nPrzy szansie podstawowej 1% ustawienie Niska daje 1% → 1,2% → 1,4%..., a Wysoka daje 1% → 2% → 3%...
secondary-progression-rate=Szybkość postępu jednostek, które nie mogą mierzyć własnej pracy, takich jak manipulatory, słupy i latarnie.\n\n100% odpowiada średniej liczbie godzin produkcji zdobywanych przez jednostki pierwszorzędne na tej samej powierzchni. Wyższe wartości przyspieszają postęp; 0% go wstrzymuje.
change-modules-with-entity=[color=white]Wyłączone:[/color] Moduły nie są ulepszane.\n\n[color=white]Włączone:[/color] Moduły są ulepszane o jeden poziom, gdy ich maszyna zostaje ulepszona, najwyżej do poziomu jakości maszyny.\n\n[color=white]Dodatkowo Włączone:[/color] Moduły są ulepszane do nowego poziomu jakości maszyny.\n\n[color=white]Niezależne:[/color] Moduły zdobywają własne próby ulepszenia dzięki postępowi drugorzędnemu i mogą przekroczyć limit jakości maszyny. Ustawienie limitu maszyny na Zwykła wyłącza również ulepszanie modułów.
batch-entities-per-tick=Liczba jednostek przetwarzanych w partii. Większe partie przyspieszają przetwarzanie ulepszeń, ale mogą powodować opóźnienia. W trybie Niezależne liczą się również gniazda modułów.
batch-ticks-between-processing=Liczba taktów między przetwarzaniem partii. Krótsze odstępy zwiększają częstotliwość przetwarzania ulepszeń, ale mogą obniżyć wydajność.
quality-change-aggregate-alerts-enabled=Wyświetlaj podsumowanie ulepszeń co pięć minut.
quality-change-entity-alerts-enabled=Pokazuj ikony alertów na mapie w miejscach ulepszeń.
quality-change-chat-enabled=Wyświetlaj wiadomości o ulepszeniach z ikonami jednostek lub modułów, ikonami jakości i literami w losowych kolorach tęczy.
quality-change-gps-enabled=Wyświetlaj klikalny odnośnik do lokalizacji i wysyłaj sygnał GPS na mapie Factorio dla każdego ulepszenia. Kliknij odnośnik, aby wrócić do lokalizacji. Po włączeniu kolorowych wiadomości o ulepszeniach dodaje do nich odnośnik; w przeciwnym razie wyświetla tylko odnośnik. Wbudowany sygnał GPS wymaga odnośnika na czacie.
quality-change-floating-text-enabled=Pokazuj unoszący się tekst ulepszenia w kolorze nowej jakości.
quality-change-halo-enabled=Pokazuj rozszerzającą się poświatę w kolorze nowej jakości w miejscach ulepszeń.
quality-change-rainbow-enabled=Pokazuj rozszerzające się tęczowe pierścienie w miejscach ulepszeń.
quality-change-badge-enabled=Pokazuj ikonę nowej jakości, która rośnie i unosi się przez 4,5 sekundy, stale wirując podczas zanikania.
quality-change-bubbles-enabled=W miejscach ulepszeń wypuszczaj strumień małych ikon nowej jakości, unoszących się jak bąbelki.
quality-change-sound-enabled=Odtwarzaj wybrany dźwięk ulepszeń na aktualnie oglądanej powierzchni, także w widoku zdalnym.
quality-change-sound=Wybierz dźwięk powiadomienia, alarm głośnika, dźwięk perkusji lub instrument muzyczny. Instrumenty korzystają z ustawień Nuta Instrumentu / Pryma i Zachowanie Nut. Dźwięk jest odtwarzany tylko po włączeniu ustawienia Dźwięk Ulepszenia, dla ulepszeń na aktualnie oglądanej powierzchni.
quality-change-sound-note=Stała nuta lub pryma (tonacja i rejestr początkowy) wzorów muzycznych. Ignorowana dla alarmów, perkusji, efektów i trybu Całkowicie losowo.\nNuty rosną półtonami od F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; dodaj 12 dla następnej oktawy. Domyślnie: 20 (C).\nFortepian ma 48 nut, a pozostałe instrumenty 36. Tryb Stała nuta ogranicza wybór do najwyższej dostępnej nuty. W razie potrzeby wzory muzyczne są przesuwane w dół o całe oktawy, z zachowaniem tonacji. Te same ustawienia dają równoważne wzory w rejestrze każdego instrumentu.
quality-change-sound-mode=Jedna nuta na każde słyszalne ulepszenie, z osobnym wzorem dla każdego gracza. Stała nuta zachowuje wybraną nutę; Muzyczna wędrówka przesuwa się o jeden lub dwa stopnie skali; Dzwonki wietrzne wybierają losowe nuty pentatoniki durowej; Schody wielokrotnie wznoszą się i opadają; Losowo w skali wybiera dowolną nutę z wybranej skali i zakresu; Całkowicie losowo używa pełnego zakresu instrumentu.\nMuzyczna wędrówka i Schody zaczynają od prymy i wznawiają wzór po okresach ciszy oraz zapisaniu i wczytaniu gry. Opóźnione nuty nie są kolejkowane. Dotyczy tylko instrumentów muzycznych.
quality-change-sound-scale=Skala względem ustawienia Nuta Instrumentu / Pryma, używana przez tryby Muzyczna wędrówka, Schody i Losowo w skali. Skala chromatyczna dopuszcza wszystkie półtony. Dzwonki wietrzne zawsze używają pentatoniki durowej; tryby Stała nuta i Całkowicie losowo ignorują to ustawienie.
quality-change-sound-range=Jedna lub dwie oktawy od prymy, w razie potrzeby przesunięte w dół o całe oktawy, aby zmieścić się w zakresie instrumentu; można też wybrać pełny zakres instrumentu. Dotyczy trybów Muzyczna wędrówka, Dzwonki wietrzne, Schody i Losowo w skali. Tryby Stała nuta i Całkowicie losowo ignorują to ustawienie.
quality_control_skip_hidden_qualities=Pomiń ukryte jakości (np. błyszczące warianty) podczas ulepszania. To ustawienie ma zastosowanie tylko wtedy, gdy masz zainstalowany mod taki jak Shiny Mechanics.
quality_control_hidden_qualities_sticky==Jednostki z ukrytymi jakościami (np. błyszczące) nie będą się dalej ulepszać, zachowując swoje unikalne korzyści. To ustawienie ma zastosowanie tylko wtedy, gdy masz zainstalowany mod taki jak Shiny Mechanics.
enable-accumulators=Włącz ulepszanie akumulatorów.
enable-agricultural-towers=Włącz ulepszanie wież rolniczych.
enable-assembly-machines=Włącz ulepszanie maszyn montażowych.
enable-asteroid-collectors=Włącz ulepszanie zbieraczy asteroid.
asteroid-collector-growth-level-limit=Ogranicza wzrost jakości zbieracza asteroid do wartości standardowych, aby zapobiec problemom niszczącym grę.\n\nZbieracze asteroid z zmodyfikowanymi poziomami jakości mogą mieć zbyt wiele ramion poruszających się zbyt szybko, przez co nie są w stanie złapać fragmentów asteroid i powodują duże obciążenie UPS.\n\n[color=green]Domyślnie: legendarny[/color]
enable-beacons=Włącz ulepszanie latarni.
enable-boilers=Włącz ulepszanie kotłów.
enable-combinators-and-speakers=Włącz ulepszanie kombinatorów i głośników programowalnych.
enable-pumps=Włącz ulepszanie pomp poboru wody i pomp cieczy.
enable-furnaces=Włącz ulepszanie pieców.
enable-generators=Włącz ulepszanie silników parowych, turbin parowych i generatorów fuzyjnych.
enable-heat-pipes=Włącz ulepszanie rurociągów ciepła.
enable-inserters=Włącz ulepszanie manipulatorów.
enable-labs=Włącz ulepszanie laboratoriów badawczych.
enable-lamps=Włącz ulepszanie lamp.
enable-lightning-rods=Włącz ulepszanie piorunochronów.
enable-mining-drills=Włącz ulepszanie wierteł wydobywczych.
enable-poles=Włącz ulepszanie słupów elektrycznych i podstacji.
enable-power-switches=Włącz ulepszanie przełączników zasilania.
enable-radar=Włącz ulepszanie stacji radarowych.
radar-growth-level-limit=Ogranicza wzrost jakości radaru w celu zapobiegania nadmiernemu eksploracji mapy i rozrostowi pliku zapisu.\n\nRadary o bardzo wysokich poziomach jakości mogą powodować duże pliki zapisu (1200mb+) z powodu nadmiernej eksploracji mapy.\n\n[color=green]Domyślnie: legendarny[/color]
lightning-attractor-growth-level-limit=Ogranicza wzrost jakości przyciągacza błyskawic w celu zapobiegania problemom z wydajnością.\n\nPrzyciągacze błyskawic o bardzo wysokich poziomach jakości mają znacznie zwiększone obszary pokrycia, co może powodować opóźnienia w nocy na Fulgorze.\n\n[color=green]Domyślnie: legendarny[/color]
enable-reactors=Włącz ulepszanie reaktorów jądrowych i fuzyjnych.
enable-rocket-silos=Włącz ulepszanie silosów rakietowych.
enable-roboports=Włącz ulepszanie roboportów.
enable-solar-panels=Włącz ulepszanie paneli słonecznych.
enable-thrusters=Włącz ulepszanie silników kosmicznych. Obrona szybszych statków może zostać przytłoczona.
thruster-growth-level-limit=Opcjonalnie ogranicz jakość silników kosmicznych do standardowych poziomów. Poziomy jakości dodane przez mody mogą znacznie przyspieszyć statki kosmiczne, co może przytłoczyć ich obronę.
enable-turrets=Włącz ulepszanie wieżyczek amunicyjnych, laserowych, miotaczy ognia i wieżyczek artyleryjskich. Wieżyczki zdobywają „godziny produkcji”, zadając obrażenia.
turret-damage-per-manufacturing-hour=Ilość obrażeń, jaką wieżyczka musi zadać, aby zdobyć jedną godzinę produkcji.\n\nDomyślnie: 36 000 obrażeń (na podstawie ilości amunicji przebijającej, jaką podstawowy automat montażowy może wyprodukować w godzinę).
turrets-contribute-credits=Pozwól wieżyczkom przyczyniać się do ulepszania jednostek drugorzędnych, takich jak manipulatory i słupy elektryczne, na tej samej powierzchni. W późnej fazie gry działa elektromagnetyczne i wieżyczki błyskawic mogą znacznie przyspieszyć ulepszenia.
enable-defense-walls-and-gates=Włącz ulepszanie murów i bram.
custom-upgrade-limit-a=Maksymalny poziom jakości używany przez ustawienie 'Niestandardowa A' w poniższych limitach. Potrzebny tylko wtedy, gdy masz mod dodający poziomy jakości powyżej legendarnej i chcesz ograniczyć poziom ulepszenia jednostki, na przykład pozwolić zbieraczom asteroid osiągnąć poziom 10. Aby skorzystać z tej funkcji, ustaw tutaj maksymalny poziom, a następnie przejdź do jednostki, którą chcesz ograniczyć, i wybierz 'Niestandardowa A' z listy rozwijanej. Dla odniesienia, legendarna to poziom 5.
custom-upgrade-limit-b=Maksymalny poziom jakości używany przez Niestandardowa B w ustawieniach limitów ulepszeń.
custom-upgrade-limit-c=Maksymalny poziom jakości używany przez Niestandardowa C w ustawieniach limitów ulepszeń.
upgrade-limit-accumulators=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-agricultural-towers=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-assembly-machines=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-beacons=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-boilers=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-combinators-and-speakers=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.\n\nObejmuje: kombinatory arytmetyczne, kombinatory decyzyjne, kombinatory stałe, głośniki programowalne.
upgrade-limit-defense-walls-and-gates=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-furnaces=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-generators=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.\n\nObejmuje: silniki parowe, turbiny parowe, generatory fuzyjne.
upgrade-limit-heat-pipes=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-inserters=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-labs=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-lamps=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-mining-drills=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-poles=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.\n\nObejmuje słupy elektryczne i podstacje.
upgrade-limit-power-switches=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-pumps=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.\n\nObejmuje: pompy poboru wody i pompy cieczy.
upgrade-limit-reactors=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.\n\nObejmuje: reaktory jądrowe, reaktory fuzyjne.
upgrade-limit-rocket-silos=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-roboports=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-solar-panels=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.
upgrade-limit-turrets=Maksymalna jakość ulepszeń tych jednostek. Zwykła wyłącza ulepszenia; Niestandardowa A/B/C korzysta z poziomu określonego powyżej.\n\nObejmuje: wieżyczki na amunicję, wieżyczki laserowe, miotacze ognia, wieżyczki artyleryjskie.
upgrade-limit-asteroid-collectors=Ogranicz jakość zbieraczy asteroid do legendarnej, aby zapobiec poważnym problemom z grą. Poziomy dodane przez mody mogą powodować powstanie zbyt wielu ramion poruszających się zbyt szybko, przez co nie mogą chwytać fragmentów asteroid i znacznie obciążają UPS.
upgrade-limit-radar=Ogranicz jakość radarów do legendarnej, aby zapobiec rozrostowi plików zapisu. Jakości dodane przez mody mogą prowadzić do nadmiernej eksploracji mapy i bardzo dużych plików zapisu (ponad gigabajt).
upgrade-limit-lightning-rods=Ogranicz jakość przyciągaczy błyskawic do legendarnej, aby zapobiec skokom obciążenia UPS. Przyciągacze o poziomach jakości dodanych przez mody mają znacznie większy zasięg, co może powodować opóźnienia w nocy na Fulgorze.
upgrade-limit-thrusters=Ogranicz jakość silników kosmicznych do legendarnej, aby zapobiec nieoczekiwanym uszkodzeniom platformy kosmicznej. Poziomy jakości dodane przez mody mogą znacznie przyspieszyć statki kosmiczne, co może przytłoczyć ich obronę.

