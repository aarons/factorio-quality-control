upgrade-limit-power-switches=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
