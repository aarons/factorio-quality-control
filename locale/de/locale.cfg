quality-level-cap-turrets=Die höchste Qualität, auf die Qualitätskontrolle diese Entität verbessert. Benutzerdefinierte Werte verwenden die Einstellungen für benutzerdefinierte maximale Stufen A/B/C.\n\nBeinhaltet: Munitionstürme, Lasertürme, Flammenwerfer, Artillerietürme.
quality-level-cap-asteroid-collectors=Begrenzt das Qualitätswachstum von Asteroidensammlern auf Vanilla-Werte, um spielbrechende Probleme zu verhindern.\n\nAsteroidensammler mit modifizierten Qualitätsstufen können zu viele Arme haben, die sich zu schnell bewegen, sodass sie keine Asteroidenbrocken mehr greifen können und eine große UPS-Belastung erzeugen.\n\n[color=green]Standard: legendär[/color]
quality-level-cap-radar=Begrenzt das Radar-Qualitätswachstum, um übermäßige Kartenerkundung und eine Aufblähung der Speicherdatei zu verhindern.\n\nRadare mit sehr hohen Qualitätsstufen können aufgrund übermäßiger Kartenerkundung zu großen Speicherdateien (1.200 MB+) führen.\n\n[color=green]Standard: legendär[/color]
quality-level-cap-lightning-rods=Begrenzt das Qualitätswachstum von Blitzableitern, um Leistungsprobleme zu verhindern.\n\nBlitzableiter mit sehr hohen Qualitätsstufen haben deutlich vergrößerte Abdeckungsbereiche, was nachts auf Fulgora zu Lag-Spitzen führen kann.\n\n[color=green]Standard: legendär[/color]
quality-level-cap-thrusters=Begrenzt das Qualitätswachstum von Raumschubdüsen auf Vanilla-Werte, um Verteidigungsprobleme zu verhindern.\n\nModifizierte Qualitätsstufen können Raumschiffe deutlich schneller machen, was ihre Verteidigungsanlagen überwältigen kann.\n\n[color=green]Standard: legendär[/color]

