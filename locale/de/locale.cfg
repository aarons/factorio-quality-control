[mod-setting-description]
manufacturing-hours-for-change=Die Anzahl der Fertigungsstunden, die für einen Qualitätsänderungsversuch erforderlich sind.\nFertigungsstunden werden nur akkumuliert, wenn die Maschine aktiv arbeitet. Ist sie im Leerlauf, findet kein Fortschritt statt.\nMindestwert 0,001 Stunden (3,6 Sekunden), Höchstwert 1000 Stunden.
crafting-speed-affects-progression=Legt fest, ob die Fertigungsgeschwindigkeit einer Maschine beeinflusst, wie schnell sie Fertigungsstunden sammelt.\n\n[color=green]Aktiviert (Standard):[/color] Maschinen mit höherer Fertigungsgeschwindigkeit schreiten schneller voran. Fertigungsstunden werden basierend auf der Fertigungsgeschwindigkeit und Produktivität der Maschine erworben. Eine Gießerei mit Geschwindigkeit 4 und 50 % Produktivität schreitet sechsmal schneller voran als eine Montagemaschine 2 mit Fertigungsgeschwindigkeit 1.\n\n[color=red]Deaktiviert:[/color] Die Fertigungsgeschwindigkeit hat keinen Einfluss auf den Fortschritt. Eine Stunde aktiver Fertigung zählt unabhängig von der Fertigungsgeschwindigkeit als eine Fertigungsstunde. Dies beseitigt den kumulativen Effekt, bei dem jede Qualitätsstufe die nächste beschleunigt.
percentage-chance-of-change=Die prozentuale Wahrscheinlichkeit, dass eine Qualitätsänderung erfolgreich ist.\nMindestwert 0,0001%, Höchstwert 100% (immer ändern nach abgelaufener Zeit)
quality-increase-cost=Dies erhöht die Zeit zwischen Änderungsversuchen pro Qualitätsstufe. Dies ist eine zusammengesetzte Formel. Bei 0% bleibt die Zeit zwischen Versuchen gleich, unabhängig von der Qualitätsstufe\n\n[color=green]Beispiel mit 3 Fertigungsstunden bei 50% Kosten pro Stufe[/color]\n\nNormal: 3 Stunden\nUngewöhnlich: 4,5 Stunden\nSelten: 6,8 Stunden\nEpisch: 10,1 Stunden\nLegendär: 15,2 Stunden\nMod-Qualitätsstufe 10: 173 Stunden
quality-chance-accumulation-rate=Kontrolliert, wie stark die Chance nach jedem fehlgeschlagenen Versuch steigt.\n\n[color=white]Keine (Standard):[/color] Keine Akkumulation - Chance bleibt konstant.\n\n[color=white]Niedrig (20%):[/color] Chance steigt um 20% der Basisrate bei jedem Fehlschlag.\n\n[color=white]Mittel (50%):[/color] Chance steigt um 50% der Basisrate bei jedem Fehlschlag.\n\n[color=white]Hoch (100%):[/color] Chance steigt um 100% der Basisrate bei jedem Fehlschlag.\n\n[color=yellow]Beispiel mit 1% Basischance:[/color]\n\n[color=white]Niedrig:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Hoch:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nAlle Akkumulationseinstellungen garantieren schließlich Qualitätsänderungen - höhere Einstellungen erreichen nur schneller 100% Chance
secondary-progression-rate=Wie schnell sekundäre Entitäten (Inserter, Strommasten, Beacons – alles, was seine eigene Arbeit nicht messen kann) fortschreiten, als Prozentsatz dessen, was die durchschnittliche primäre Entität auf derselben Oberfläche erzielt.\n\n[color=green]100% (Standard):[/color] Sekundäre Entitäten schreiten im gleichen Tempo voran wie der durchschnittliche Assembler, Ofen, Silo oder Geschützturm in ihrer Umgebung.\n\nAuf 0% setzen, um den sekundären Fortschritt vollständig zu stoppen; Werte über 100% beschleunigen Infrastruktur-Aufwertungen über das Tempo der Produktionsmaschinen hinaus.\n\nKann im laufenden Spiel ohne Neustart geändert werden.
change-modules-with-entity=Dies kontrolliert, ob Module in Maschinen von Qualitätsänderungen betroffen sind.\n\n[color=white]Deaktiviert (Standard):[/color] Module sind nicht betroffen, wenn sich die Qualität der Wirtsmaschine ändert.\n\n[color=white]Aktiviert:[/color] Module ändern ihre Qualität um eine Stufe, wenn sich ihr Wirt ändert. Sie werden nicht die Qualitätsstufe des Wirts überschreiten.\n\n[color=white]Extra Aktiviert:[/color] Wie Aktiviert, aber Module werden jederzeit an die Qualität ihrer Wirtsmaschine angepasst, wenn eine Qualitätsänderung auftritt.
batch-entities-per-tick=Anzahl der Entitäten, die pro Tick verarbeitet werden, um Leistungsspitzen zu vermeiden.\nMindestwert 1, Höchstwert 1000.\nHöhere Werte können Lag-Spitzen verursachen, verarbeiten Entitäten aber schneller.
batch-ticks-between-processing=Anzahl der Ticks, die zwischen Batch-Verarbeitungszyklen gewartet wird.\nMindestwert 1 Tick, Höchstwert 6000 Ticks (~2,5 Minuten).\nNiedrigere Werte verarbeiten häufiger, können aber die Leistung beeinträchtigen.
quality-change-aggregate-alerts-enabled=Konsolennachrichten anzeigen, die alle Qualitätsänderungen zusammenfassen (wird alle 5 Minuten einmal angezeigt). Beispiel: "3 Montagemaschinen verbessert, 2 Greifarme verbessert"
quality-change-entity-alerts-enabled=Karten-Ping-Warnungen für einzelne Entitäten anzeigen, wenn sich ihre Qualität ändert. Klicken Sie auf die Warnung, um die verbesserte Entität zu sehen.
quality_control_skip_hidden_qualities=Qualitätskontrolle überspringt versteckte Qualitäten (z.B. glänzende Varianten) beim Upgrade. Entitäten werden niemals durch Qualitätskontrolle glänzend - Spieler müssen sie auf normalem Weg erhalten. Diese Einstellung gilt nur, wenn Sie den Shiny Mechanics Qualitätsmod installiert haben.
quality_control_hidden_qualities_sticky=Entitäten mit versteckten Qualitäten (z.B. glänzend) werden nicht weiter verbessert, wodurch ihre einzigartigen Vorteile erhalten bleiben. Diese Einstellung gilt nur, wenn Sie den Shiny Mechanics Qualitätsmod installiert haben.
enable-accumulators=Qualitätsänderungen für Akkumulatoren aktivieren.
enable-agricultural-towers=Qualitätsänderungen für Landwirtschaftstürme aktivieren.
enable-assembly-machines=Qualitätsänderungen für Montagemaschinen aktivieren.
enable-asteroid-collectors=Qualitätsänderungen für Asteroidensammler aktivieren.
asteroid-collector-growth-level-limit=Begrenzt das Qualitätswachstum von Asteroidensammlern auf Vanilla-Werte, um spielbrechende Probleme zu verhindern.\n\nAsteroidensammler mit modifizierten Qualitätsstufen können zu viele Arme haben, die sich zu schnell bewegen, sodass sie keine Asteroidenbrocken mehr greifen können und eine große UPS-Belastung erzeugen.\n\n[color=green]Standard: legendär[/color]
enable-beacons=Qualitätsänderungen für Signalmodule aktivieren.
enable-boilers=Qualitätsänderungen für Kessel aktivieren.
enable-combinators-and-speakers=Qualitätsänderungen für Kombinatoren und Lautsprecher aktivieren.\n\nBeinhaltet: Arithmetische Kombinatoren, Entscheidungskombiantoren, Konstante Kombinatoren, Programmierbare Lautsprecher.
enable-pumps=Qualitätsänderungen für Pumpen aktivieren (beinhaltet Küstenpumpen und Flüssigkeitspumpen).
enable-furnaces=Qualitätsänderungen für Öfen aktivieren.
enable-generators=Qualitätsänderungen für Generatoren aktivieren (Dampfmaschinen, Dampfturbinen, Fusionsgeneratoren).
enable-heat-pipes=Qualitätsänderungen für Wärmerohre aktivieren.
enable-inserters=Qualitätsänderungen für Greifarme aktivieren.
enable-labs=Qualitätsänderungen für Forschungslabore aktivieren.
enable-lamps=Qualitätsänderungen für Lampen aktivieren.
enable-lightning-rods=Qualitätsänderungen für Blitzableiter aktivieren.
enable-mining-drills=Qualitätsänderungen für alle Bergbaubohrer aktivieren.
enable-poles=Qualitätsänderungen für alle Strommasten aktivieren (einschließlich Hochspannungsmasten und Umspannwerke).
enable-power-switches=Qualitätsänderungen für Stromschalter aktivieren.
enable-radar=Qualitätsänderungen für Radarstationen aktivieren.
radar-growth-level-limit=Begrenzt das Radar-Qualitätswachstum, um übermäßige Kartenerkundung und das Aufblähen der Speicherdatei zu verhindern.\n\nRadare mit sehr hohen Qualitätsstufen können aufgrund übermäßiger Kartenerkundung zu großen Speicherdateien (1.200 MB+) führen.\n\n[color=green]Standard: legendär[/color]
lightning-attractor-growth-level-limit=Begrenzt das Qualitätswachstum von Blitzableitern, um Leistungsprobleme zu verhindern.\n\nBlitzableiter mit sehr hohen Qualitätsstufen haben deutlich vergrößerte Abdeckungsbereiche, was nachts auf Fulgora zu Lag-Spitzen führen kann.\n\n[color=green]Standard: legendär[/color]
enable-reactors=Qualitätsänderungen für Reaktoren aktivieren (Kernreaktoren, Fusionsreaktoren).
enable-rocket-silos=Qualitätsänderungen für Raketenstarter aktivieren.
enable-roboports=Qualitätsänderungen für Roboterhäfen aktivieren.
enable-solar-panels=Qualitätsänderungen für Solarpanele aktivieren.
enable-thrusters=Qualitätsänderungen für Raumschubdüsen aktivieren. Standardmäßig deaktiviert, da eine unerwartete Änderung der Raumschiffgeschwindigkeit dazu führen kann, dass Verteidigungsanlagen überwältigt werden.
thruster-growth-level-limit=Begrenzt das Qualitätswachstum von Raumschubdüsen auf Vanilla-Werte, um Verteidigungsprobleme zu verhindern.\n\nModifizierte Qualitätsstufen können Raumschiffe deutlich schneller machen, was ihre Verteidigungsanlagen überwältigen kann.\n\n[color=green]Standard: legendär[/color]
enable-turrets=Qualitätsänderungen für Geschütztürme aktivieren.\n\nGeschütztürme sind primäre Entitäten, die Upgrade-Credits basierend auf dem kumulierten verursachten Schaden generieren.\n\nBeinhaltet: Munitionstürme, Lasertürme, Flammenwerfer, Artillerietürme.
turret-damage-per-manufacturing-hour=Die Menge an Schaden, die ein Geschützturm verursachen muss, um einer Fertigungsstunde zu entsprechen.\n\nStandard: 36.000 Schaden (abgeleitet von Panzerungsbrechern: 450 Magazine/Stunde × 80 Schaden/Magazin).\n\nNiedrigere Werte lassen Geschütztürme Credits schneller generieren. Höhere Werte verlangsamen die Credit-Generierung.
turrets-contribute-credits=Legt fest, ob von Geschützen verdiente Aufwertungsgutschriften auch in den gemeinsamen Pool fließen, der sekundäre Entitäten (Inserter, Strommasten usw.) aufwertet.\n\n[color=red]Deaktiviert (Standard):[/color] Geschützgutschriften verbleiben beim Geschütz. Kampfschaden hilft nur den Geschützen, sich selbst aufzuwerten.\n\n[color=green]Aktiviert:[/color] Geschützgutschriften fließen zusätzlich in den gemeinsamen Pool, sodass Kampfschaden sekundäre Entitäten genauso wie Fertigung voranbringt.
enable-defense-walls-and-gates=Qualitätsänderungen für Mauern und Tore aktivieren.\n\nBeinhaltet: Mauern, Tore.
custom-upgrade-limit-a=Verwende dies, um benutzerdefinierte Grenzen für modifizierte Qualitäten von Entitäten festzulegen. Nur nötig, wenn du einen Mod verwendest, der Qualitätsstufen über Legendär hinaus hinzufügt, und du begrenzen möchtest, wie weit eine Entität aufgewertet wird. Um diese Funktion zu nutzen, lege hier die maximale Stufe fest und wähle dann bei der zu begrenzenden Entität 'Benutzerdefiniert A' aus dem Dropdown-Menü. Zur Orientierung: Legendär ist Stufe 5 (normal = 1, ungewöhnlich = 2, selten = 3, episch = 4, legendär = 5...).
custom-upgrade-limit-b=Verwende dies, um benutzerdefinierte Grenzen für modifizierte Qualitäten von Entitäten festzulegen. Nur nötig, wenn du einen Mod verwendest, der Qualitätsstufen über Legendär hinaus hinzufügt, und du begrenzen möchtest, wie weit eine Entität aufgewertet wird. Um diese Funktion zu nutzen, lege hier die maximale Stufe fest und wähle dann bei der zu begrenzenden Entität 'Benutzerdefiniert B' aus dem Dropdown-Menü. Zur Orientierung: Legendär ist Stufe 5 (normal = 1, ungewöhnlich = 2, selten = 3, episch = 4, legendär = 5...).
custom-upgrade-limit-c=Verwende dies, um benutzerdefinierte Grenzen für modifizierte Qualitäten von Entitäten festzulegen. Nur nötig, wenn du einen Mod verwendest, der Qualitätsstufen über Legendär hinaus hinzufügt, und du begrenzen möchtest, wie weit eine Entität aufgewertet wird. Um diese Funktion zu nutzen, lege hier die maximale Stufe fest und wähle dann bei der zu begrenzenden Entität 'Benutzerdefiniert C' aus dem Dropdown-Menü. Zur Orientierung: Legendär ist Stufe 5 (normal = 1, ungewöhnlich = 2, selten = 3, episch = 4, legendär = 5...).
upgrade-limit-accumulators=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
upgrade-limit-agricultural-towers=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
upgrade-limit-assembly-machines=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
upgrade-limit-beacons=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
upgrade-limit-boilers=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
upgrade-limit-combinators-and-speakers=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.\n\nEnthält: Rechenkombinatoren, Entscheidungskombinatoren, Konstantkombinatoren, programmierbare Lautsprecher.
upgrade-limit-defense-walls-and-gates=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.\n\nEnthält: Mauern, Tore.
upgrade-limit-furnaces=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
upgrade-limit-generators=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.\n\nEnthält: Dampfmaschinen, Dampfturbinen, Fusionsgeneratoren.
upgrade-limit-heat-pipes=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
