upgrade-limit-roboports=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
upgrade-limit-solar-panels=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.
upgrade-limit-turrets=Qualitätskontrolle wertet diese Entitäten bis zu dieser Qualität auf und versucht danach keine weiteren Aufwertungen mehr. Setze dies auf Gewöhnlich, um jegliche Aufwertungsversuche zu verhindern. Die benutzerdefinierten Werte verwenden die Einstellungen für Benutzerdefiniertes Aufwertungslimit A/B/C.\n\nEnthält: Kanonentürme, Lasertürme, Flammenwerfer, Artillerietürme.
upgrade-limit-asteroid-collectors=Begrenzt das Qualitätswachstum von Asteroidensammlern auf Vanilla-Werte, um spielbrechende Probleme zu verhindern.\n\nAsteroidensammler mit modifizierten Qualitätsstufen können zu viele Arme haben, die sich zu schnell bewegen, sodass sie keine Asteroidenbrocken mehr greifen können und eine große UPS-Belastung erzeugen.\n\n[color=green]Standard: legendär[/color]
upgrade-limit-radar=Begrenzt das Radar-Qualitätswachstum, um übermäßige Kartenerkundung und das Aufblähen der Speicherdatei zu verhindern.\n\nRadare mit sehr hohen Qualitätsstufen können aufgrund übermäßiger Kartenerkundung zu großen Speicherdateien (1.200 MB+) führen.\n\n[color=green]Standard: legendär[/color]
upgrade-limit-lightning-rods=Begrenzt das Qualitätswachstum von Blitzableitern, um Leistungsprobleme zu verhindern.\n\nBlitzableiter mit sehr hohen Qualitätsstufen haben deutlich vergrößerte Abdeckungsbereiche, was nachts auf Fulgora zu Lag-Spitzen führen kann.\n\n[color=green]Standard: legendär[/color]
upgrade-limit-thrusters=Begrenzt das Qualitätswachstum von Raumschubdüsen auf Vanilla-Werte, um Verteidigungsprobleme zu verhindern.\n\nModifizierte Qualitätsstufen können Raumschiffe deutlich schneller machen, was ihre Verteidigungsanlagen überwältigen kann.\n\n[color=green]Standard: legendär[/color]

