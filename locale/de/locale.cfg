[mod-setting-description]
manufacturing-hours-for-change=Die Anzahl der Fertigungsstunden, die für einen Qualitätsänderungsversuch erforderlich sind.\nFertigungsstunden werden nur akkumuliert, wenn die Maschine aktiv arbeitet. Ist sie im Leerlauf, findet kein Fortschritt statt.\nMindestwert 0,001 Stunden (3,6 Sekunden), Höchstwert 1000 Stunden.
crafting-speed-affects-progression=[color=red]Deaktiviert (Standard):[/color] Die Fertigungsgeschwindigkeit hat keinen Einfluss auf den Fortschritt, wodurch Aufwertungen über längere Spiele gleichmäßiger verteilt bleiben.\n\n[color=green]Aktiviert:[/color] Fertigungsgeschwindigkeit und Produktivität erhöhen die gesammelten Fertigungsstunden. Geschwindigkeit 4 mit 50 % Produktivität erzielt sechsmal so viele Fertigungsstunden wie Geschwindigkeit 1 ohne Produktivitätsbonus. Geschwindigkeitssteigerungen durch Qualitätsaufwertungen können sich gegenseitig verstärken und im späteren Spielverlauf zu sehr schnellen Aufwertungen führen.
percentage-chance-of-change=Erfolgschance für einen Aufwertungsversuch.
quality-increase-cost=Erhöhung der benötigten Fertigungsstunden pro Qualitätsstufe. Die Erhöhung wirkt kumulativ; bei 0 % bleibt der Bedarf auf allen Stufen gleich.\n\nBei 50 % werden aus 3 Stunden auf ungewöhnlicher Stufe 4,5 Stunden und auf seltener Stufe 6,75 Stunden.
quality-chance-accumulation-rate=Erhöht die Aufwertungschance nach einem fehlgeschlagenen Versuch um einen Prozentsatz der Basischance.\n\n[color=white]Keine:[/color] Die Chance bleibt konstant.\n[color=white]Niedrig:[/color] 20 % der Basischance hinzufügen.\n[color=white]Mittel:[/color] 50 % der Basischance hinzufügen.\n[color=white]Hoch:[/color] 100 % der Basischance hinzufügen.\n\nBei 1 % Basischance ergibt Niedrig 1 % → 1,2 % → 1,4 %... und Hoch 1 % → 2 % → 3 %...
secondary-progression-rate=Fortschrittsgeschwindigkeit für Entitäten, die ihre eigene Arbeit nicht messen können, wie Greifarme, Strommasten und Signalmodule.\n\n100 % entsprechen den durchschnittlich gesammelten Fertigungsstunden primärer Entitäten auf derselben Oberfläche. Höhere Werte beschleunigen den Fortschritt; 0 % pausiert ihn.
change-modules-with-entity=[color=white]Deaktiviert:[/color] Module werden nicht aufgewertet.\n\n[color=white]Aktiviert:[/color] Module werden bei der Aufwertung ihrer Maschine um eine Stufe aufgewertet, höchstens bis zur Qualität der Maschine.\n\n[color=white]Extra aktiviert:[/color] Module werden auf die neue Qualität ihrer Maschine aufgewertet.\n\n[color=white]Unabhängig:[/color] Module erhalten eigene Aufwertungsversuche durch sekundären Fortschritt und können das Qualitätslimit ihrer Maschine überschreiten. Wird das Maschinenlimit auf Normal gesetzt, werden auch Modulaufwertungen deaktiviert.
batch-entities-per-tick=Pro Durchgang verarbeitete Entitäten. Größere Durchgänge verarbeiten Aufwertungen schneller, können aber Verzögerungen verursachen. Im unabhängigen Modus zählen auch Modulplätze.
batch-ticks-between-processing=Ticks zwischen Verarbeitungsdurchgängen. Kürzere Intervalle verarbeiten Aufwertungen häufiger, können aber die Leistung beeinträchtigen.
quality-change-aggregate-alerts-enabled=Alle fünf Minuten eine Zusammenfassung der Aufwertungen ausgeben.
quality-change-entity-alerts-enabled=Kartenwarnsymbole an den Orten von Aufwertungen anzeigen.
quality-change-chat-enabled=Aufwertungsnachrichten mit Entitäts- oder Modulsymbolen, Qualitätssymbolen und zufällig regenbogenfarbenen Buchstaben ausgeben.
quality-change-gps-enabled=Für jede Aufwertung einen anklickbaren Standortlink ausgeben und Factorios GPS-Karten-Ping auslösen. Klicke auf den Link, um den Ort erneut aufzurufen. Fügt den Link bei aktiviertem buntem Aufwertungschat hinzu; andernfalls wird nur der Link ausgegeben. Der integrierte GPS-Ping benötigt einen Chat-Link.
quality-change-floating-text-enabled=Aufsteigenden Aufwertungstext in der Farbe der neuen Qualität anzeigen.
quality-change-halo-enabled=An Aufwertungsorten einen sich ausbreitenden Lichthof in der Farbe der neuen Qualität anzeigen.
quality-change-rainbow-enabled=An Aufwertungsorten sich ausbreitende Regenbogenringe anzeigen.
quality-change-badge-enabled=Das Symbol der neuen Qualität 4,5 Sekunden lang wachsend und aufsteigend anzeigen; es dreht sich bis zum Ausblenden ununterbrochen.
quality-change-bubbles-enabled=An Aufwertungsorten einen Strom kleiner Symbole der neuen Qualität freisetzen, die wie Blasen aufsteigen.
quality-change-sound-enabled=Den ausgewählten Ton bei Aufwertungen auf der aktuell betrachteten Oberfläche abspielen, auch in der Fernansicht.
quality-change-sound=Wähle einen Benachrichtigungseffekt, Lautsprecheralarm, Schlagzeugklang oder ein Musikinstrument. Instrumente verwenden die Einstellungen „Instrumententon / Grundton“ und „Tonverhalten“. Der Ton wird nur bei aktivierter Einstellung „Ton bei Aufwertung abspielen“ und für Aufwertungen auf der aktuell betrachteten Oberfläche abgespielt.
quality-change-sound-note=Fester Ton oder Grundton (Tonart und Ausgangsregister) für musikalische Muster. Wird bei Alarmen, Schlagzeug, Effekten und im Modus „Völlig zufällig“ ignoriert.\nDie Töne steigen ab F in Halbtonschritten: 1=F, 3=G, 5=A, 7=H, 8=C, 10=D, 12=E; für die nächste Oktave 12 addieren. Standard: 20 (C).\nDas Klavier hat 48 Töne, andere Instrumente haben 36. Im festen Modus wird der Ton auf den höchsten verfügbaren Ton begrenzt. Musikalische Muster werden bei Bedarf um ganze Oktaven nach unten verschoben, wobei die Tonart erhalten bleibt. Gleiche Einstellungen ergeben entsprechende Muster im jeweiligen Register des Instruments.
quality-change-sound-mode=Ein Ton pro hörbarer Aufwertung, mit einem eigenen Muster für jeden Spieler. „Fester Ton“ behält den gewählten Ton bei; „Musikalische Wanderung“ bewegt sich um ein oder zwei Tonleiterstufen; „Windspiel“ wählt zufällige Töne der Dur-Pentatonik; „Treppe“ steigt wiederholt auf und ab; „Zufällig in Tonleiter“ wählt einen beliebigen Ton der gewählten Tonleiter und des Tonumfangs; „Völlig zufällig“ nutzt den gesamten Tonumfang des Instruments.\nWanderung und Treppe beginnen beim Grundton und werden nach stillen Phasen sowie nach Speichern und Laden fortgesetzt. Es werden keine verzögerten Töne vorgemerkt. Betrifft nur Musikinstrumente.
quality-change-sound-scale=Tonleiter relativ zu „Instrumententon / Grundton“, verwendet von „Musikalische Wanderung“, „Treppe“ und „Zufällig in Tonleiter“. Chromatisch erlaubt jeden Halbton. „Windspiel“ verwendet immer Dur-Pentatonik; „Fester Ton“ und „Völlig zufällig“ ignorieren diese Einstellung.
quality-change-sound-range=Eine oder zwei Oktaven ab dem Grundton, bei Bedarf um ganze Oktaven nach unten verschoben, damit sie zum Instrument passen; alternativ der gesamte Tonumfang des Instruments. Gilt für „Musikalische Wanderung“, „Windspiel“, „Treppe“ und „Zufällig in Tonleiter“. „Fester Ton“ und „Völlig zufällig“ ignorieren diese Einstellung.
quality_control_skip_hidden_qualities=Versteckte Qualitäten (z. B. glänzende Varianten) beim Aufwerten überspringen. Diese Einstellung gilt nur, wenn ein Mod wie Shiny Mechanics installiert ist.
quality_control_hidden_qualities_sticky==Entitäten mit versteckten Qualitäten (z. B. glänzend) werden nicht weiter aufgewertet, wodurch ihre einzigartigen Vorteile erhalten bleiben. Diese Einstellung gilt nur, wenn ein Mod wie Shiny Mechanics installiert ist.
enable-accumulators=Aufwertungen für Akkumulatoren aktivieren.
enable-agricultural-towers=Aufwertungen für Landwirtschaftstürme aktivieren.
enable-assembly-machines=Aufwertungen für Montagemaschinen aktivieren.
enable-asteroid-collectors=Aufwertungen für Asteroidensammler aktivieren.
asteroid-collector-growth-level-limit=Begrenzt das Qualitätswachstum von Asteroidensammlern auf Vanilla-Werte, um spielbrechende Probleme zu verhindern.\n\nAsteroidensammler mit modifizierten Qualitätsstufen können zu viele Arme haben, die sich zu schnell bewegen, sodass sie keine Asteroidenbrocken mehr greifen können und eine große UPS-Belastung erzeugen.\n\n[color=green]Standard: legendär[/color]
enable-beacons=Aufwertungen für Signalmodule aktivieren.
enable-boilers=Aufwertungen für Kessel aktivieren.
enable-combinators-and-speakers=Aufwertungen für Kombinatoren und programmierbare Lautsprecher aktivieren.
enable-pumps=Aufwertungen für Wasserpumpen und Pumpen aktivieren.
enable-furnaces=Aufwertungen für Öfen aktivieren.
enable-generators=Aufwertungen für Dampfmaschinen, Dampfturbinen und Fusionsgeneratoren aktivieren.
enable-heat-pipes=Aufwertungen für Wärmerohre aktivieren.
enable-inserters=Aufwertungen für Greifarme aktivieren.
enable-labs=Aufwertungen für Forschungslabore aktivieren.
enable-lamps=Aufwertungen für Lampen aktivieren.
enable-lightning-rods=Aufwertungen für Blitzableiter aktivieren.
enable-mining-drills=Aufwertungen für Bergbaubohrer aktivieren.
enable-poles=Aufwertungen für Strommasten und Umspannwerke aktivieren.
enable-power-switches=Aufwertungen für Stromschalter aktivieren.
enable-radar=Aufwertungen für Radarstationen aktivieren.
radar-growth-level-limit=Begrenzt das Radar-Qualitätswachstum, um übermäßige Kartenerkundung und das Aufblähen der Speicherdatei zu verhindern.\n\nRadare mit sehr hohen Qualitätsstufen können aufgrund übermäßiger Kartenerkundung zu großen Speicherdateien (1.200 MB+) führen.\n\n[color=green]Standard: legendär[/color]
lightning-attractor-growth-level-limit=Begrenzt das Qualitätswachstum von Blitzableitern, um Leistungsprobleme zu verhindern.\n\nBlitzableiter mit sehr hohen Qualitätsstufen haben deutlich vergrößerte Abdeckungsbereiche, was nachts auf Fulgora zu Lag-Spitzen führen kann.\n\n[color=green]Standard: legendär[/color]
enable-reactors=Aufwertungen für Kernreaktoren und Fusionsreaktoren aktivieren.
enable-rocket-silos=Aufwertungen für Raketenstarter aktivieren.
enable-roboports=Aufwertungen für Roboterhäfen aktivieren.
enable-solar-panels=Aufwertungen für Solarpanele aktivieren.
enable-thrusters=Aufwertungen für Raumschubdüsen aktivieren. Schnellere Schiffe können ihre Verteidigungsanlagen überfordern.
thruster-growth-level-limit=Begrenzt Raumschubdüsen optional auf die Qualitätsstufen des Grundspiels. Modifizierte Qualitätsstufen können Raumschiffe deutlich schneller machen, was ihre Verteidigungsanlagen überfordern kann.
enable-turrets=Aufwertungen für Geschütztürme, Lasertürme, Flammenwerfer und Artillerietürme aktivieren. Geschütztürme sammeln durch verursachten Schaden „Fertigungsstunden“.
turret-damage-per-manufacturing-hour=Die Menge an Schaden, die ein Geschützturm verursachen muss, um eine Fertigungsstunde zu erhalten.\n\nStandard: 36.000 Schaden (abgeleitet von der Menge an panzerbrechender Munition, die eine Montagemaschine der Grundstufe in einer Stunde herstellen kann).
turrets-contribute-credits=Geschütztürme zu Aufwertungen sekundärer Entitäten wie Greifarmen und Strommasten auf derselben Oberfläche beitragen lassen. Dies kann Aufwertungen im späten Spiel mit Railguns und Blitztürmen stark beschleunigen.
enable-defense-walls-and-gates=Aufwertungen für Mauern und Tore aktivieren.
custom-upgrade-limit-a=Maximale Qualitätsstufe für die Einstellung „Benutzerdefiniert A“ in den folgenden Begrenzungen. Nur nötig, wenn ein Mod Qualitätsstufen über Legendär hinaus hinzufügt und du die Aufwertung einer Entität begrenzen möchtest, etwa um Asteroidensammler bis Stufe 10 aufwerten zu lassen. Lege hier die maximale Stufe fest und wähle dann bei der zu begrenzenden Entität „Benutzerdefiniert A“ aus dem Dropdown-Menü. Zur Orientierung: Legendär ist Stufe 5.
custom-upgrade-limit-b=Maximale Qualitätsstufe für „Benutzerdefiniert B“ in den Einstellungen für Aufwertungslimits.
custom-upgrade-limit-c=Maximale Qualitätsstufe für „Benutzerdefiniert C“ in den Einstellungen für Aufwertungslimits.
upgrade-limit-accumulators=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-agricultural-towers=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-assembly-machines=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-beacons=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-boilers=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-combinators-and-speakers=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.\n\nEnthält: Rechenkombinatoren, Entscheidungskombinatoren, Konstantkombinatoren, programmierbare Lautsprecher.
upgrade-limit-defense-walls-and-gates=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-furnaces=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-generators=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.\n\nEnthält: Dampfmaschinen, Dampfturbinen, Fusionsgeneratoren.
upgrade-limit-heat-pipes=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-inserters=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-labs=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-lamps=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-mining-drills=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-poles=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.\n\nEnthält Strommasten und Umspannwerke.
upgrade-limit-power-switches=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-pumps=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.\n\nEnthält: Wasserpumpen und Pumpen.
upgrade-limit-reactors=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.\n\nEnthält: Kernreaktoren, Fusionsreaktoren.
upgrade-limit-rocket-silos=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-roboports=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-solar-panels=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.
upgrade-limit-turrets=Maximale Aufwertungsqualität für diese Entitäten. Normal deaktiviert Aufwertungen; Benutzerdefiniert A/B/C verwendet die oben festgelegte Stufe.\n\nEnthält: Geschütztürme, Lasertürme, Flammenwerfer, Artillerietürme.
upgrade-limit-asteroid-collectors=Asteroidensammler auf Legendär begrenzen, um schwerwiegende Spielprobleme zu verhindern. Modifizierte Qualitätsstufen können zu viele Arme erzeugen, die sich zu schnell bewegen, keine Asteroidenbrocken mehr greifen können und die UPS stark belasten.
upgrade-limit-radar=Radare auf Legendär begrenzen, um ein Aufblähen der Speicherdatei zu verhindern. Modifizierte Qualitäten können zu übermäßiger Kartenerkundung und sehr großen Dateien von über einem Gigabyte führen.
upgrade-limit-lightning-rods=Blitzableiter auf Legendär begrenzen, um UPS-Einbrüche zu verhindern. Blitzableiter mit modifizierten Qualitätsstufen haben deutlich größere Abdeckungsbereiche, was nachts auf Fulgora zu Lag-Spitzen führen kann.
upgrade-limit-thrusters=Raumschubdüsen auf Legendär begrenzen, um unerwartete Schäden an Weltraumplattformen zu verhindern. Modifizierte Qualitätsstufen können Raumschiffe deutlich schneller machen, was ihre Verteidigungsanlagen überfordern kann.

