[mod-setting-description]
manufacturing-hours-for-change=El número de horas de fabricación requeridas para intentar un cambio de calidad.\nLas horas de fabricación solo se acumulan cuando la máquina está trabajando activamente. Si permanece inactiva, no progresará.\nValor mínimo 0.001 horas (3.6 segundos), Valor máximo 1000 horas.
crafting-speed-affects-progression=[color=red]Desactivado (predeterminado):[/color] La velocidad de fabricación no afecta al progreso, lo que ayuda a distribuir las mejoras de forma más uniforme a lo largo de una partida larga.\n\n[color=green]Activado:[/color] La velocidad de fabricación y la productividad aumentan las horas de fabricación ganadas. Una velocidad de 4 con un 50% de productividad gana seis veces más que una velocidad de 1 sin bonificación de productividad. Los aumentos de velocidad por mejoras de calidad pueden potenciarse entre sí, dando lugar a mejoras muy rápidas en las fases avanzadas de la partida.
percentage-chance-of-change=Probabilidad de éxito de un intento de mejora.
quality-increase-cost=Aumento de las horas de fabricación necesarias por nivel de calidad. El aumento es compuesto; con un 0%, el requisito es igual en todos los niveles.\n\nCon un 50%, un requisito de 3 horas pasa a 4,5 horas en poco común y 6,75 horas en raro.
quality-chance-accumulation-rate=Aumenta la probabilidad de mejora tras un intento fallido en un porcentaje de la probabilidad base.\n\n[color=white]Ninguno:[/color] La probabilidad permanece constante.\n[color=white]Bajo:[/color] Añade un 20% de la probabilidad base.\n[color=white]Medio:[/color] Añade un 50% de la probabilidad base.\n[color=white]Alto:[/color] Añade un 100% de la probabilidad base.\n\nCon una probabilidad base del 1%, Bajo da 1% → 1,2% → 1,4%... y Alto da 1% → 2% → 3%...
secondary-progression-rate=Velocidad de progreso de las entidades que no pueden medir su propio trabajo, como insertadores, postes y balizas.\n\nEl 100% equivale a la media de horas de fabricación ganadas por las entidades primarias de la misma superficie. Los valores más altos aceleran el progreso; el 0% lo pausa.
change-modules-with-entity=[color=white]Deshabilitado:[/color] Los módulos no mejoran.\n\n[color=white]Habilitado:[/color] Los módulos mejoran un nivel cuando mejora su máquina, hasta alcanzar la calidad de esta.\n\n[color=white]Extra habilitado:[/color] Los módulos mejoran hasta igualar la nueva calidad de su máquina.\n\n[color=white]Independiente:[/color] Los módulos obtienen sus propios intentos de mejora mediante el progreso secundario y pueden superar el límite de calidad de su máquina. Establecer el límite de la máquina en Común también deshabilita las mejoras de módulos.
batch-entities-per-tick=Entidades procesadas por lote. Los lotes más grandes procesan las mejoras más rápido, pero pueden causar lag. Las ranuras de módulos también cuentan en el modo Independiente.
batch-ticks-between-processing=Ticks entre el procesamiento de lotes. Los intervalos más cortos procesan las mejoras con más frecuencia, pero pueden reducir el rendimiento.
quality-change-aggregate-alerts-enabled=Mostrar un resumen de mejoras cada cinco minutos.
quality-change-entity-alerts-enabled=Mostrar iconos de alerta en el mapa donde se produzcan mejoras.
quality-change-chat-enabled=Mostrar mensajes de mejora con iconos de entidad o módulo, iconos de calidad y letras de colores del arcoíris elegidos al azar.
quality-change-gps-enabled=Mostrar un enlace de ubicación y activar la señal GPS del mapa de Factorio para cada mejora. Haz clic en el enlace para volver a la ubicación. Si están activados los mensajes de colores, añade el enlace a ellos; de lo contrario, muestra solo el enlace. La señal GPS nativa requiere un enlace en el chat.
quality-change-floating-text-enabled=Mostrar texto de mejora ascendente con el color de la nueva calidad.
quality-change-halo-enabled=Mostrar un halo que se expande con el color de la nueva calidad donde se produzcan mejoras.
quality-change-rainbow-enabled=Mostrar anillos arcoíris que se expanden donde se produzcan mejoras.
quality-change-badge-enabled=Mostrar el icono de la nueva calidad creciendo y ascendiendo durante 4,5 segundos, mientras gira continuamente hasta desvanecerse.
quality-change-bubbles-enabled=Liberar una corriente de pequeños iconos de la nueva calidad que flotan como burbujas donde se produzcan mejoras.
quality-change-sound-enabled=Reproducir el sonido seleccionado para las mejoras en la superficie que estás viendo, incluida la vista remota.
quality-change-sound=Elige un efecto de notificación, una alarma de altavoz, un sonido de batería o un instrumento musical. Los instrumentos usan los ajustes Nota del instrumento / Tónica y Comportamiento de las notas. Solo suena si está activado el sonido de mejora y para mejoras en la superficie que estás viendo.
quality-change-sound-note=Nota fija o tónica (tonalidad y registro inicial) para los patrones musicales. Se ignora para alarmas, batería, efectos y el modo Totalmente aleatorio.\nLas notas ascienden por semitonos desde fa: 1=fa, 3=sol, 5=la, 7=si, 8=do, 10=re, 12=mi; suma 12 para la siguiente octava. Predeterminado: 20 (do).\nEl piano tiene 48 notas; los demás instrumentos tienen 36. El modo fijo se limita a la nota más alta disponible. Los patrones musicales bajan octavas completas cuando es necesario para ajustarse al rango, conservando la tonalidad. Los mismos ajustes producen patrones equivalentes en el registro de cada instrumento.
quality-change-sound-mode=Una nota por cada mejora audible, con un patrón independiente para cada jugador. Nota fija conserva la nota seleccionada; Paseo musical avanza o retrocede uno o dos pasos de la escala; Campanillas de viento elige notas aleatorias de la escala pentatónica mayor; Escalera asciende y desciende repetidamente; Aleatorio en la escala elige cualquier nota de la escala y el rango seleccionados; Totalmente aleatorio usa todo el rango del instrumento.\nPaseo musical y Escalera comienzan en la tónica y continúan después de periodos de silencio y de guardar o cargar. No se ponen en cola notas retardadas. Solo afecta a los instrumentos musicales.
quality-change-sound-scale=Escala relativa a Nota del instrumento / Tónica, utilizada por Paseo musical, Escalera y Aleatorio en la escala. Cromática permite todos los semitonos. Campanillas de viento siempre usa la pentatónica mayor; Nota fija y Totalmente aleatorio ignoran este ajuste.
quality-change-sound-range=Una o dos octavas a partir de la tónica, desplazadas hacia abajo por octavas completas si es necesario para ajustarse al instrumento; o todo el rango del instrumento. Se aplica a Paseo musical, Campanillas de viento, Escalera y Aleatorio en la escala. Nota fija y Totalmente aleatorio ignoran este ajuste.
quality_control_skip_hidden_qualities=Omitir las calidades ocultas, como las variantes brillantes, al mejorar. Este ajuste solo se aplica si tienes instalado un mod como Shiny Mechanics.
quality_control_hidden_qualities_sticky==Las entidades con calidades ocultas (por ejemplo, brillantes) no mejorarán más, preservando sus beneficios únicos. Este ajuste solo se aplica si tienes instalado un mod como Shiny Mechanics.
enable-accumulators=Habilitar mejoras para acumuladores.
enable-agricultural-towers=Habilitar mejoras para torres agrícolas.
enable-assembly-machines=Habilitar mejoras para máquinas de ensamblaje.
enable-asteroid-collectors=Habilitar mejoras para recolectores de asteroides.
asteroid-collector-growth-level-limit=Limita el crecimiento de la calidad del recolector de asteroides a los valores base para prevenir problemas graves en el juego.\n\nLos recolectores de asteroides con niveles de calidad modificados pueden tener demasiados brazos que se mueven demasiado rápido, volviéndose incapaces de recoger fragmentos de asteroides y generando un gran drenaje de UPS.\n\n[color=green]Predeterminado: legendario[/color]
enable-beacons=Habilitar mejoras para balizas.
enable-boilers=Habilitar mejoras para calderas.
enable-combinators-and-speakers=Habilitar mejoras para combinadores y altavoces programables.
enable-pumps=Habilitar mejoras para bombas marinas y bombas de fluidos.
enable-furnaces=Habilitar mejoras para hornos.
enable-generators=Habilitar mejoras para motores de vapor, turbinas de vapor y generadores de fusión.
enable-heat-pipes=Habilitar mejoras para tuberías de calor.
enable-inserters=Habilitar mejoras para insertadores.
enable-labs=Habilitar mejoras para laboratorios de investigación.
enable-lamps=Habilitar mejoras para lámparas.
enable-lightning-rods=Habilitar mejoras para pararrayos.
enable-mining-drills=Habilitar mejoras para perforadoras mineras.
enable-poles=Habilitar mejoras para postes eléctricos y subestaciones.
enable-power-switches=Habilitar mejoras para interruptores de energía.
enable-radar=Habilitar mejoras para estaciones de radar.
radar-growth-level-limit=Limita el crecimiento de la calidad del radar para prevenir la exploración excesiva del mapa y la hinchazón del archivo de guardado.\n\nLos radares con niveles de calidad muy altos pueden causar archivos de guardado grandes (1,200mb+) debido a la exploración excesiva del mapa.\n\n[color=green]Predeterminado: legendario[/color]
lightning-attractor-growth-level-limit=Limita el crecimiento de la calidad del atractor de rayos para prevenir problemas de rendimiento.\n\nLos atractores de rayos con niveles de calidad muy altos tienen áreas de cobertura significativamente aumentadas, lo que puede causar picos de lag durante la noche en Fulgora.\n\n[color=green]Predeterminado: legendario[/color]
enable-reactors=Habilitar mejoras para reactores nucleares y de fusión.
enable-rocket-silos=Habilitar mejoras para silos de cohetes.
enable-roboports=Habilitar mejoras para robopuertos.
enable-solar-panels=Habilitar mejoras para paneles solares.
enable-thrusters=Habilitar mejoras para propulsores espaciales. Las naves más rápidas pueden superar la capacidad de sus defensas.
thruster-growth-level-limit=Permite limitar los propulsores espaciales a los niveles base. Los niveles de calidad de mods pueden hacer que las naves se muevan mucho más rápido, lo que puede superar la capacidad de sus defensas.
enable-turrets=Habilitar mejoras para torretas de munición, láser, lanzallamas y de artillería. Las torretas ganan «horas de fabricación» al infligir daño.
turret-damage-per-manufacturing-hour=Cantidad de daño que debe infligir una torreta para ganar una hora de fabricación.\n\nPredeterminado: 36 000 de daño (basado en la cantidad de munición perforante que puede producir una máquina de ensamblaje básica en una hora).
turrets-contribute-credits=Permite que las torretas contribuyan a las mejoras de entidades secundarias, como insertadores y postes eléctricos, en la misma superficie. Esto puede acelerar mucho las mejoras en las fases avanzadas de la partida con cañones de riel y torretas de rayos.
enable-defense-walls-and-gates=Habilitar mejoras para muros y puertas.
custom-upgrade-limit-a=Nivel máximo de calidad utilizado por el ajuste «Personalizado A» en los límites de abajo. Solo es necesario si tienes un mod que añade niveles de calidad más allá de legendario y quieres limitar el nivel al que puede mejorar una entidad. Por ejemplo, si quieres permitir que los recolectores de asteroides lleguen al nivel 10. Para usar esta función, establece aquí el nivel máximo, luego ve a la entidad que quieres limitar y selecciona «Personalizado A» en el menú desplegable. Como referencia, legendario es el nivel 5.
custom-upgrade-limit-b=Nivel máximo de calidad utilizado por Personalizado B en los ajustes de límite de mejora.
custom-upgrade-limit-c=Nivel máximo de calidad utilizado por Personalizado C en los ajustes de límite de mejora.
upgrade-limit-accumulators=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-agricultural-towers=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-assembly-machines=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-beacons=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-boilers=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-combinators-and-speakers=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: combinadores aritméticos, combinadores de decisión, combinadores constantes y altavoces programables.
upgrade-limit-defense-walls-and-gates=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-furnaces=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-generators=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: motores de vapor, turbinas de vapor y generadores de fusión.
upgrade-limit-heat-pipes=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-inserters=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-labs=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-lamps=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-mining-drills=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-poles=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye postes eléctricos y subestaciones.
upgrade-limit-power-switches=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-pumps=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: bombas marinas y bombas de fluidos.
upgrade-limit-reactors=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: reactores nucleares y reactores de fusión.
upgrade-limit-rocket-silos=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-roboports=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-solar-panels=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-turrets=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: torretas de munición, torretas láser, lanzallamas y torretas de artillería.
upgrade-limit-asteroid-collectors=Limita los recolectores de asteroides a legendario para prevenir problemas graves en el juego. Los niveles de calidad de mods pueden crear demasiados brazos que se mueven demasiado rápido, impidiéndoles recoger fragmentos de asteroides y reduciendo mucho los UPS.
upgrade-limit-radar=Limita los radares a legendario para evitar que aumente demasiado el tamaño del archivo de guardado. Las calidades de mods pueden provocar una exploración excesiva del mapa y generar archivos muy grandes, de más de un gigabyte.
upgrade-limit-lightning-rods=Limita los atractores de rayos a legendario para prevenir picos de carga en los UPS. Los atractores con niveles de calidad de mods tienen áreas de cobertura mucho mayores, lo que puede causar picos de lag durante la noche en Fulgora.
upgrade-limit-thrusters=Limita los propulsores espaciales a legendario para prevenir daños inesperados en las plataformas espaciales. Los niveles de calidad de mods pueden hacer que las naves se muevan mucho más rápido, lo que puede superar la capacidad de sus defensas.

