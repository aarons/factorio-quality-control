[mod-setting-description]
manufacturing-hours-for-change=El número de horas de fabricación requeridas para intentar un cambio de calidad.\nLas horas de fabricación solo se acumulan cuando la máquina está trabajando activamente. Si permanece inactiva, no progresará.\nValor mínimo 0.001 horas (3.6 segundos), Valor máximo 1000 horas.
crafting-speed-affects-progression=Controla si la velocidad de fabricación de una máquina afecta a la rapidez con la que gana horas de fabricación.\n\n[color=green]Activado (por defecto):[/color] Las máquinas con mayor velocidad de fabricación progresarán más rápido. Las horas de fabricación se ganan en función de la velocidad de fabricación y la productividad de la máquina. Una fundición con velocidad 4 y 50% de productividad progresará seis veces más rápido que una ensambladora-2 con velocidad de fabricación 1.\n\n[color=red]Desactivado:[/color] La velocidad de fabricación no tiene ningún impacto en el progreso. Una hora dedicada a fabricar activamente cuenta como una hora de fabricación, independientemente de la velocidad de fabricación. Esto elimina el efecto acumulativo por el que cada mejora de calidad acelera la siguiente.
percentage-chance-of-change=El porcentaje de probabilidad de que un cambio de calidad sea exitoso.\nValor mínimo 0.0001%, Valor máximo 100% (siempre cambiar después de que pase el tiempo)
quality-increase-cost=Esto aumenta el tiempo entre intentos de cambio por nivel de calidad. Esta es una fórmula compuesta. Establecer en 0% mantendrá el tiempo entre intentos igual sin importar el nivel de calidad\n\n[color=green]Ejemplo con 3 horas de fabricación necesarias al 50% de coste por nivel[/color]\n\nNormal: 3 horas\nPoco común: 4.5 horas\nRaro: 6.8 horas\nÉpico: 10.1 horas\nLegendario: 15.2 horas\nCalidad mod nivel 10: 173 horas
quality-chance-accumulation-rate=Controla cuánto aumenta la probabilidad después de cada intento fallido.\n\n[color=white]Ninguno (Predeterminado):[/color] Sin acumulación - la probabilidad permanece constante.\n\n[color=white]Bajo (20%):[/color] La probabilidad aumenta un 20% de la tasa base cada fallo.\n\n[color=white]Medio (50%):[/color] La probabilidad aumenta un 50% de la tasa base cada fallo.\n\n[color=white]Alto (100%):[/color] La probabilidad aumenta un 100% de la tasa base cada fallo.\n\n[color=yellow]Ejemplo con 1% de probabilidad base:[/color]\n\n[color=white]Bajo:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]Alto:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nTodas las configuraciones de acumulación eventualmente garantizan cambios de calidad - las configuraciones más altas solo alcanzan 100% de probabilidad más rápido
secondary-progression-rate=Qué tan rápido progresan las entidades secundarias (inserctores, postes, faros - cualquier cosa que no pueda medir su propio trabajo), como porcentaje de lo que gana la entidad primaria promedio en la misma superficie.\n\n[color=green]100% (por defecto):[/color] Las entidades secundarias avanzan al mismo ritmo que la ensambladora, el horno, el silo o la torreta promedio a su alrededor.\n\nEstablece 0% para detener completamente el progreso secundario; valores superiores al 100% aceleran las mejoras de infraestructura más allá del ritmo de las máquinas de producción.\n\nSe puede cambiar en mitad de la partida sin necesidad de reiniciar.
change-modules-with-entity=Esto controla si los módulos en las máquinas se ven afectados por los cambios de calidad.\n\n[color=white]Deshabilitado (Predeterminado):[/color] Los módulos no se ven afectados cuando cambia la calidad de la máquina anfitriona.\n\n[color=white]Habilitado:[/color] Los módulos cambian de calidad por un nivel cuando su anfitrión cambia. No excederán el nivel de calidad del anfitrión.\n\n[color=white]Extra Habilitado:[/color] Como Habilitado, pero los módulos serán actualizados para coincidir con la calidad de su máquina anfitriona cada vez que ocurra un cambio de calidad.
batch-entities-per-tick=Número de entidades a procesar cada tick para evitar picos de rendimiento.\nValor mínimo 1, Valor máximo 1000.\nValores más altos pueden causar picos de lag pero procesan entidades más rápido.
batch-ticks-between-processing=Número de ticks a esperar entre ciclos de procesamiento por lotes.\nValor mínimo 1 tick, Valor máximo 6000 ticks (~2.5 minutos).\nValores más bajos procesan más frecuentemente pero pueden impactar el rendimiento.
quality-change-aggregate-alerts-enabled=Mostrar mensajes de consola resumiendo todos los cambios de calidad (mostrados una vez cada 5 minutos). Ejemplo: "3 máquinas de ensamblaje mejoradas, 2 insertadores mejorados"
quality-change-entity-alerts-enabled=Mostrar alertas de ping en el mapa en entidades individuales cuando su calidad cambia. Haz clic en la alerta para ver la entidad mejorada.
quality_control_skip_hidden_qualities=Control de Calidad omitirá las calidades ocultas (por ejemplo, variantes brillantes) al mejorar. Las entidades nunca se volverán brillantes a través de Control de Calidad - los jugadores deben obtenerlas de la forma normal. Esta configuración solo se aplica cuando tienes instalado el mod Shiny Mechanics quality.
quality_control_hidden_qualities_sticky=Las entidades con calidades ocultas (por ejemplo, brillantes) no mejorarán más, preservando sus beneficios únicos. Esta configuración solo se aplica cuando tienes instalado el mod Shiny Mechanics quality.
enable-accumulators=Habilitar cambios de calidad para acumuladores.
enable-agricultural-towers=Habilitar cambios de calidad para torres agrícolas.
enable-assembly-machines=Habilitar cambios de calidad para máquinas de ensamblaje.
enable-asteroid-collectors=Habilitar cambios de calidad para recolectores de asteroides.
asteroid-collector-growth-level-limit=Limita el crecimiento de la calidad del recolector de asteroides a los valores base para prevenir problemas graves en el juego.\n\nLos recolectores de asteroides con niveles de calidad modificados pueden tener demasiados brazos que se mueven demasiado rápido, volviéndose incapaces de recoger fragmentos de asteroides y generando un gran drenaje de UPS.\n\n[color=green]Predeterminado: legendario[/color]
enable-beacons=Habilitar cambios de calidad para balizas.
enable-boilers=Habilitar cambios de calidad para calderas.
enable-combinators-and-speakers=Habilitar cambios de calidad para combinadores y altavoces.\n\nIncluye: combinadores aritméticos, combinadores de decisión, combinadores constantes, altavoces programables.
enable-pumps=Habilitar cambios de calidad para bombas (incluye bombas marinas y bombas de fluidos).
enable-furnaces=Habilitar cambios de calidad para hornos.
enable-generators=Habilitar cambios de calidad para generadores (motores de vapor, turbinas de vapor, generadores de fusión).
enable-heat-pipes=Habilitar cambios de calidad para tuberías de calor.
enable-inserters=Habilitar cambios de calidad para insertadores.
enable-labs=Habilitar cambios de calidad para laboratorios de investigación.
enable-lamps=Habilitar cambios de calidad para lámparas.
enable-lightning-rods=Habilitar cambios de calidad para pararrayos.
enable-mining-drills=Habilitar cambios de calidad para todas las perforadoras mineras.
enable-poles=Habilitar cambios de calidad para todos los postes eléctricos (incluyendo postes grandes y subestaciones).
enable-power-switches=Habilitar cambios de calidad para interruptores de energía.
enable-radar=Habilitar cambios de calidad para estaciones de radar.
radar-growth-level-limit=Limita el crecimiento de la calidad del radar para prevenir la exploración excesiva del mapa y la hinchazón del archivo de guardado.\n\nLos radares con niveles de calidad muy altos pueden causar archivos de guardado grandes (1,200mb+) debido a la exploración excesiva del mapa.\n\n[color=green]Predeterminado: legendario[/color]
lightning-attractor-growth-level-limit=Limita el crecimiento de la calidad del atractor de rayos para prevenir problemas de rendimiento.\n\nLos atractores de rayos con niveles de calidad muy altos tienen áreas de cobertura significativamente aumentadas, lo que puede causar picos de lag durante la noche en Fulgora.\n\n[color=green]Predeterminado: legendario[/color]
enable-reactors=Habilitar cambios de calidad para reactores (reactores nucleares, reactores de fusión).
enable-rocket-silos=Habilitar cambios de calidad para silos de cohetes.
enable-roboports=Habilitar cambios de calidad para robopuertos.
enable-solar-panels=Habilitar cambios de calidad para paneles solares.
enable-thrusters=Habilitar cambios de calidad para propulsores espaciales. Deshabilitado por defecto porque cambiar la velocidad de una nave espacial de forma inesperada puede llevar a que las defensas sean superadas.
thruster-growth-level-limit=Limita el crecimiento de la calidad del propulsor espacial a los niveles base para prevenir problemas de defensa.\n\nLos niveles de calidad modificados pueden mover las naves espaciales significativamente más rápido, lo que puede abrumar sus defensas.\n\n[color=green]Predeterminado: legendario[/color]
enable-turrets=Habilitar cambios de calidad para torretas.\n\nLas torretas son entidades primarias que generan créditos de mejora basándose en el daño acumulado infligido.\n\nIncluye: torretas de munición, torretas láser, lanzallamas, torretas de artillería.
turret-damage-per-manufacturing-hour=La cantidad de daño que debe infligir una torreta para equivaler a una hora de fabricación.\n\nPredeterminado: 36,000 de daño (derivado de munición perforante: 450 cargadores/hora × 80 de daño/cargador).\n\nValores más bajos hacen que las torretas generen créditos más rápido. Valores más altos ralentizan la generación de créditos.
enable-defense-walls-and-gates=Habilitar cambios de calidad para muros y puertas.\n\nIncluye: muros, puertas.
custom-upgrade-limit-a=Utiliza esto para establecer límites personalizados en las calidades modificadas de las entidades. Solo es necesario si tienes un mod que añade niveles de calidad más allá de legendario y quieres limitar cuánto se mejorará una entidad. Para usar esta función, establece aquí el nivel máximo, luego ve a la entidad que quieres limitar y selecciona 'Personalizado A' en el menú desplegable. Como referencia, legendario es el nivel 5 (normal = 1, poco común = 2, raro = 3, épico = 4, legendario = 5...).
custom-upgrade-limit-b=Utiliza esto para establecer límites personalizados en las calidades modificadas de las entidades. Solo es necesario si tienes un mod que añade niveles de calidad más allá de legendario y quieres limitar cuánto se mejorará una entidad. Para usar esta función, establece aquí el nivel máximo, luego ve a la entidad que quieres limitar y selecciona 'Personalizado B' en el menú desplegable. Como referencia, legendario es el nivel 5 (normal = 1, poco común = 2, raro = 3, épico = 4, legendario = 5...).
custom-upgrade-limit-c=Utiliza esto para establecer límites personalizados en las calidades modificadas de las entidades. Solo es necesario si tienes un mod que añade niveles de calidad más allá de legendario y quieres limitar cuánto se mejorará una entidad. Para usar esta función, establece aquí el nivel máximo, luego ve a la entidad que quieres limitar y selecciona 'Personalizado C' en el menú desplegable. Como referencia, legendario es el nivel 5 (normal = 1, poco común = 2, raro = 3, épico = 4, legendario = 5...).
upgrade-limit-accumulators=Control de Calidad mejorará estas entidades hasta esta calidad y luego dejará de intentar más mejoras. Configúralo en Común para evitar cualquier intento de mejora. Los valores personalizados utilizan la configuración de Límite de Mejora Personalizado A/B/C.
upgrade-limit-agricultural-towers=Control de Calidad mejorará estas entidades hasta esta calidad y luego dejará de intentar más mejoras. Configúralo en Común para evitar cualquier intento de mejora. Los valores personalizados utilizan la configuración de Límite de Mejora Personalizado A/B/C.
