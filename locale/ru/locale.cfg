[mod-setting-description]
manufacturing-hours-for-change=Количество производственных часов, необходимых для попытки изменения качества.\nПроизводственные часы накапливаются только тогда, когда машина активно работает. Если она простаивает, прогресс не идёт.\nМин. значение 0.001 часов (3.6 секунды), Макс. значение 1000 часов.
crafting-speed-affects-progression=[color=green]Включено:[/color] Скорость крафта и продуктивность увеличивают количество получаемых производственных часов. Скорость 4 с продуктивностью 50% даёт в шесть раз больше часов, чем скорость 1 без бонуса продуктивности.\n\n[color=red]Отключено:[/color] Скорость крафта не влияет на прогрессию.
percentage-chance-of-change=Вероятность успеха попытки улучшения.
quality-increase-cost=Увеличение числа необходимых производственных часов за уровень качества. Увеличение накапливается; при 0% требование одинаково для всех уровней.\n\nПри 50% требование в 3 часа увеличивается до 4.5 часа для необычного и 6.75 часа для редкого качества.
quality-chance-accumulation-rate=Увеличивает шанс улучшения после неудачной попытки на процент от базового шанса.\n\n[color=white]Нет:[/color] Шанс остаётся постоянным.\n[color=white]Низкое:[/color] Добавляется 20% базового шанса.\n[color=white]Среднее:[/color] Добавляется 50% базового шанса.\n[color=white]Высокое:[/color] Добавляется 100% базового шанса.\n\nПри базовом шансе 1% низкое накопление даёт 1% → 1.2% → 1.4%..., а высокое — 1% → 2% → 3%...
secondary-progression-rate=Скорость прогрессии объектов, которые не могут измерять собственную работу, например манипуляторов, столбов и маяков.\n\n100% соответствует среднему числу производственных часов, получаемых первичными объектами на той же поверхности. Более высокие значения ускоряют прогрессию; 0% приостанавливает её.
change-modules-with-entity=[color=white]Отключено:[/color] Модули не улучшаются.\n\n[color=white]Включено:[/color] Модули улучшаются на один уровень при улучшении машины, не превышая её качество.\n\n[color=white]Дополнительно включено:[/color] Модули улучшаются до нового качества машины.\n\n[color=white]Независимо:[/color] Модули получают собственные попытки улучшения за счёт вторичной прогрессии и могут превысить лимит качества машины. Установка лимита машины на «Обычное» также отключает улучшение модулей.
batch-entities-per-tick=Количество объектов, обрабатываемых за пакет. Большие пакеты ускоряют обработку улучшений, но могут вызывать лаги. В независимом режиме слоты модулей также учитываются.
batch-ticks-between-processing=Количество тиков между обработкой пакетов. Меньшие интервалы позволяют чаще обрабатывать улучшения, но могут снижать производительность.
quality-change-aggregate-alerts-enabled=Выводить сводку улучшений каждые пять минут.
quality-change-entity-alerts-enabled=Показывать значки уведомлений на карте в местах улучшения.
quality-change-chat-enabled=Выводить сообщения об улучшении со значками объекта или модуля, значками качества и буквами случайных цветов радуги.
quality-change-gps-enabled=Выводить ссылку на местоположение и показывать GPS-метку Factorio на карте для каждого улучшения. Нажмите на ссылку, чтобы вернуться к месту улучшения. Если разноцветные уведомления включены, ссылка добавляется к ним; иначе выводится только ссылка. Для встроенной GPS-метки нужна ссылка в чате.
quality-change-floating-text-enabled=Показывать поднимающийся текст улучшения цветом нового качества.
quality-change-halo-enabled=Показывать расширяющийся ореол цветом нового качества в местах улучшения.
quality-change-rainbow-enabled=Показывать расширяющиеся радужные кольца в местах улучшения.
quality-change-badge-enabled=Показывать значок нового качества, который увеличивается и поднимается в течение 4.5 секунд, непрерывно вращаясь при исчезновении.
quality-change-bubbles-enabled=Выпускать в местах улучшения поток маленьких значков нового качества, поднимающихся вверх подобно пузырькам.
quality-change-sound-enabled=Воспроизводить выбранный звук при улучшениях на просматриваемой поверхности, в том числе при удалённом просмотре.
quality-change-sound=Выберите эффект уведомления, сигнал динамика, звук ударных или музыкальный инструмент. Инструменты используют настройки «Нота инструмента / тоника» и «Поведение нот». Звук воспроизводится только при включённом звуке улучшения для улучшений на просматриваемой поверхности.
quality-change-sound-note=Фиксированная нота или тоника (тональность и начальный регистр) для музыкальных последовательностей. Не используется для сигналов, ударных, эффектов и режима «Полностью случайно».\nНоты идут вверх по полутонам от F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; добавьте 12 для следующей октавы. По умолчанию: 20 (C).\nУ пианино 48 нот, у остальных инструментов — 36. В режиме фиксированной ноты значение ограничивается самой высокой доступной нотой. При необходимости музыкальные последовательности сдвигаются вниз на целое число октав с сохранением тональности. Одинаковые настройки дают эквивалентные последовательности в регистре каждого инструмента.
quality-change-sound-mode=Одна нота на каждое слышимое улучшение; у каждого игрока своя последовательность. «Фиксированная нота» сохраняет выбранную ноту; «Музыкальное блуждание» перемещается на одну или две ступени лада; «Музыка ветра» выбирает случайные ноты мажорной пентатоники; «Лестница» попеременно поднимается и спускается; «Случайно в ладу» выбирает любую ноту заданного лада и диапазона; «Полностью случайно» использует весь диапазон инструмента.\nБлуждание и лестница начинаются с тоники и продолжаются после пауз и сохранения или загрузки игры. Отложенные ноты не ставятся в очередь. Влияет только на музыкальные инструменты.
quality-change-sound-scale=Лад относительно настройки «Нота инструмента / тоника», используемый режимами «Музыкальное блуждание», «Лестница» и «Случайно в ладу». Хроматический лад допускает все полутоны. «Музыка ветра» всегда использует мажорную пентатонику; режимы «Фиксированная нота» и «Полностью случайно» игнорируют эту настройку.
quality-change-sound-range=Одна или две октавы от тоники, при необходимости сдвинутые вниз на целое число октав для соответствия диапазону инструмента; либо полный диапазон инструмента. Применяется к режимам «Музыкальное блуждание», «Музыка ветра», «Лестница» и «Случайно в ладу». Режимы «Фиксированная нота» и «Полностью случайно» игнорируют эту настройку.
quality_control_skip_hidden_qualities=Пропускать скрытые качества (например, блестящие варианты) при улучшении. Эта настройка применяется только при наличии мода, подобного Shiny Mechanics.
quality_control_hidden_qualities_sticky==Объекты со скрытыми качествами (например, блестящие) не будут больше улучшаться, сохраняя свои уникальные преимущества. Эта настройка применяется только при наличии мода, подобного Shiny Mechanics.
enable-accumulators=Включить улучшения для аккумуляторов.
enable-agricultural-towers=Включить улучшения для сельскохозяйственных башен.
enable-assembly-machines=Включить улучшения для сборочных автоматов.
enable-asteroid-collectors=Включить улучшения для сборщиков астероидов.
asteroid-collector-growth-level-limit=Ограничивает рост качества сборщиков астероидов до ванильных значений для предотвращения критических проблем с игрой.\n\nСборщики астероидов с модовыми уровнями качества могут иметь слишком много рук, движущихся слишком быстро, что делает их неспособными захватывать куски астероидов и создаёт большую нагрузку на UPS.\n\n[color=green]По умолчанию: легендарное[/color]
enable-beacons=Включить улучшения для маяков.
enable-boilers=Включить улучшения для котлов.
enable-combinators-and-speakers=Включить улучшения для комбинаторов и программируемых динамиков.
enable-pumps=Включить улучшения для водяных насосов и насосов для жидкостей.
enable-furnaces=Включить улучшения для печей.
enable-generators=Включить улучшения для паровых машин, паровых турбин и термоядерных генераторов.
enable-heat-pipes=Включить улучшения для теплотруб.
enable-inserters=Включить улучшения для манипуляторов.
enable-labs=Включить улучшения для исследовательских лабораторий.
enable-lamps=Включить улучшения для ламп.
enable-lightning-rods=Включить улучшения для громоотводов.
enable-mining-drills=Включить улучшения для буров.
enable-poles=Включить улучшения для опор ЛЭП и подстанций.
enable-power-switches=Включить улучшения для силовых переключателей.
enable-radar=Включить улучшения для радарных станций.
radar-growth-level-limit=Ограничивает рост качества радара для предотвращения чрезмерного исследования карты и раздувания файлов сохранения.\n\nРадары с очень высоким уровнем качества могут вызывать большие файлы сохранения (1200 МБ+) из-за чрезмерного исследования карты.\n\n[color=green]По умолчанию: легендарное[/color]
lightning-attractor-growth-level-limit=Ограничивает рост качества громоотводов для предотвращения проблем с производительностью.\n\nГромоотводы с очень высоким уровнем качества имеют значительно увеличенную область покрытия, что может вызывать лаги ночью на Фульгоре.\n\n[color=green]По умолчанию: легендарное[/color]
enable-reactors=Включить улучшения для ядерных и термоядерных реакторов.
enable-rocket-silos=Включить улучшения для ракетных шахт.
enable-roboports=Включить улучшения для робопортов.
enable-solar-panels=Включить улучшения для солнечных панелей.
enable-thrusters=Включить улучшения для космических двигателей. Повышенная скорость кораблей может перегрузить их системы обороны.
thruster-growth-level-limit=При необходимости ограничивает качество космических двигателей ванильными уровнями. Модовые уровни качества могут значительно ускорить космические корабли, что может перегрузить их системы обороны.
enable-turrets=Включить улучшения для пулемётных, лазерных, огнемётных и артиллерийских турелей. Турели получают «производственные часы» за нанесение урона.
turret-damage-per-manufacturing-hour=Количество урона, которое турель должна нанести, чтобы получить один производственный час.\n\nПо умолчанию: 36 000 урона (рассчитано для турели базового уровня, непрерывно стреляющей бронебойными патронами в течение часа).
turrets-contribute-credits=Разрешить турелям участвовать в улучшении вторичных объектов на той же поверхности, например манипуляторов и опор ЛЭП. Это может значительно ускорить улучшения на поздних этапах игры при использовании рельсотронов и молниевых турелей.
enable-defense-walls-and-gates=Включить улучшения для стен и ворот.
custom-upgrade-limit-a=Максимальный уровень качества для значения «Пользовательское A» в настройках лимитов ниже. Требуется только при использовании мода, добавляющего уровни качества выше легендарного, если вы хотите ограничить максимальное качество объекта. Например, можно разрешить сборщикам астероидов достигать уровня 10. Задайте здесь максимальный уровень, затем перейдите к нужному объекту и выберите «Пользовательское A» в выпадающем списке. Для справки: легендарное качество — это уровень 5.
custom-upgrade-limit-b=Максимальный уровень качества для значения «Пользовательское B» в настройках лимитов улучшения.
custom-upgrade-limit-c=Максимальный уровень качества для значения «Пользовательское C» в настройках лимитов улучшения.
upgrade-limit-accumulators=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-agricultural-towers=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-assembly-machines=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-beacons=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-boilers=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-combinators-and-speakers=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.\n\nВключает: арифметические комбинаторы, комбинаторы принятия решений, постоянные комбинаторы, программируемые динамики.
upgrade-limit-defense-walls-and-gates=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-furnaces=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-generators=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.\n\nВключает: паровые машины, паровые турбины, термоядерные генераторы.
upgrade-limit-heat-pipes=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-inserters=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-labs=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-lamps=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-mining-drills=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-poles=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.\n\nВключает опоры ЛЭП и подстанции.
upgrade-limit-power-switches=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-pumps=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.\n\nВключает: водяные насосы и насосы для жидкостей.
upgrade-limit-reactors=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.\n\nВключает: ядерные реакторы, термоядерные реакторы.
upgrade-limit-rocket-silos=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-roboports=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-solar-panels=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.
upgrade-limit-turrets=Максимальное качество улучшения этих объектов. Значение «Обычное» отключает улучшения; «Пользовательское A/B/C» использует заданный выше уровень.\n\nВключает: пулемётные турели, лазерные турели, огнемётные турели, артиллерийские турели.
upgrade-limit-asteroid-collectors=Ограничивает качество сборщиков астероидов легендарным, чтобы предотвратить критические проблемы с игрой. Модовые уровни могут дать им слишком много слишком быстрых рук, из-за чего они не смогут захватывать куски астероидов и значительно снизят UPS.
upgrade-limit-radar=Ограничивает качество радаров легендарным, чтобы предотвратить раздувание файлов сохранения. Модовые уровни качества могут привести к чрезмерному исследованию карты и очень большим файлам сохранения (более гигабайта).
upgrade-limit-lightning-rods=Ограничивает качество притягивателей молний легендарным, чтобы предотвратить скачки нагрузки на UPS. Модовые уровни качества значительно увеличивают их область покрытия, что может вызывать лаги ночью на Фульгоре.
upgrade-limit-thrusters=Ограничивает качество космических двигателей легендарным, чтобы предотвратить неожиданное повреждение космических платформ. Модовые уровни качества могут значительно ускорить космические корабли, что может перегрузить их системы обороны.

