# Tento překlad byl vygenerován umělou inteligencí. Opravy jsou velmi vítány! Prosím, přidejte zpětnou vazbu na diskuzním fóru módu (https://mods.factorio.com/mod/quality-control/discussion) nebo jako issue na github repozitáři (https://github.com/aarons/factorio-quality-control/issues). Prosím, omluvte případné chyby!

