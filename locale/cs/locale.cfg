[mod-setting-description]
manufacturing-hours-for-change=Počet výrobních hodin potřebných pro pokus o změnu kvality.\nVýrobní hodiny se akumulují pouze tehdy, když stroj aktivně pracuje. Pokud nečinně stojí, nepostupuje.\nMin hodnota 0,001 hodin (3,6 sekundy), Max hodnota 1000 hodin.
crafting-speed-affects-progression=Určuje, zda rychlost výroby stroje ovlivňuje, jak rychle získává výrobní hodiny.\n\n[color=green]Povoleno (výchozí):[/color] Stroje s vyšší rychlostí výroby postupují rychleji. Výrobní hodiny se získávají na základě rychlosti výroby a produktivity stroje. Slévárna s rychlostí 4 a produktivitou 50 % bude postupovat šestkrát rychleji než sestavovací stroj 2 s rychlostí výroby 1.\n\n[color=red]Zakázáno:[/color] Rychlost výroby nemá na postup žádný vliv. Jedna hodina strávená aktivní výrobou se počítá jako jedna výrobní hodina, bez ohledu na rychlost výroby. Tím se odstraňuje kumulativní efekt, kdy každé zvýšení kvality zrychluje to další.
percentage-chance-of-change=Procentuální šance, že změna kvality bude úspěšná.\nMin hodnota 0,0001%, Max hodnota 100% (vždy se změní po uplynutí času)
quality-increase-cost=Toto zvyšuje čas mezi pokusy o změnu za úroveň kvality. Jedná se o složenou formuli. Nastavení na 0% udrží čas mezi pokusy stejný bez ohledu na úroveň kvality\n\n[color=green]Příklad s 3 výrobními hodinami potřebnými při 50% nákladech za úroveň[/color]\n\nNormální: 3 hodiny\nNeobvyklý: 4,5 hodiny\nVzácný: 6,8 hodiny\nEpický: 10,1 hodiny\nLegendární: 15,2 hodiny\nModded quality lvl 10: 173 hodin
quality-chance-accumulation-rate=Řídí o kolik se šance zvyšuje po každém neúspěšném pokusu.\n\n[color=white]Žádná (výchozí):[/color] Žádná akumulace - šance zůstává konstantní.\n\n[color=white]Nízká (20%):[/color] Šance se zvyšuje o 20% základní míry za každý neúspěch.\n\n[color=white]Střední (50%):[/color] Šance se zvyšuje o 50% základní míry za každý neúspěch.\n\n[color=white]Vysoká (100%):[/color] Šance se zvyšuje o 100% základní míry za každý neúspěch.\n\n[color=yellow]Příklad s 1% základní šancí:[/color]\n\n[color=white]Nízká:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Vysoká:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nVšechna nastavení akumulace nakonec zaručují změny kvality - vyšší nastavení pouze dosáhnou 100% šance rychleji
secondary-progression-rate=Jak rychle sekundární stavby (zakladače, sloupy, majáky - cokoli, co nemůže měřit svou vlastní práci) postupují, jako procento toho, co získá průměrná primární stavba na stejném povrchu.\n\n[color=green]100 % (výchozí):[/color] Sekundární stavby postupují stejným tempem jako průměrný sestavovací stroj, pec, silo nebo věž kolem nich.\n\nNastavte na 0 % pro úplné zastavení sekundárního postupu; hodnoty nad 100 % zrychlují modernizaci infrastruktury nad rámec tempa výrobních strojů.\n\nLze změnit během hry bez restartu.
change-modules-with-entity=Toto řídí, zda jsou moduly ve strojích ovlivněny změnami kvality.\n\n[color=white]Zakázáno (výchozí):[/color] Moduly nejsou ovlivněny při změně kvality hostitelského stroje.\n\n[color=white]Povoleno:[/color] Moduly se změní kvalitou o jednu úroveň při změně hostitele. Nepřekročí úroveň kvality hostitele.\n\n[color=white]Extra povoleno:[/color] Stejně jako Povoleno, ale moduly budou aktualizovány tak, aby odpovídaly kvalitě jejich hostitelského stroje kdykoli dojde ke změně kvality.
batch-entities-per-tick=Počet staveb ke zpracování každý tik pro zabránění výkonovým špičkám.\nMin hodnota 1, Max hodnota 1000.\nVyšší hodnoty mohou způsobit lagové špičky, ale zpracovávají stavby rychleji.
batch-ticks-between-processing=Počet tiků čekání mezi cykly dávkového zpracování.\nMin hodnota 1 tik, Max hodnota 6000 tiků (~2,5 minuty).\nNižší hodnoty zpracovávají častěji, ale mohou ovlivnit výkon.
quality-change-aggregate-alerts-enabled=Zobrazit konzolové zprávy shrnující všechny změny kvality (zobrazeno jednou za 5 minut). Příklad: "3 výrobní stroje vylepšeny, 2 manipulátory vylepšeny"
quality-change-entity-alerts-enabled=Zobrazit upozornění na pingu mapy na jednotlivých stavbách při změně jejich kvality. Klikněte na upozornění pro zobrazení vylepšené stavby.
quality_control_skip_hidden_qualities=Kontrola Kvality přeskočí skryté kvality (např. lesklé varianty) při vylepšování. Stavby se nikdy nestanou lesklými prostřednictvím Kontroly Kvality - hráči je musí získat normálním způsobem. Toto nastavení se vztahuje pouze pokud máte nainstalovaný mód Shiny Mechanics quality.
quality_control_hidden_qualities_sticky=Stavby se skrytými kvalitami (např. lesklé) se nebudou dále vylepšovat, čímž si zachovají své jedinečné výhody. Toto nastavení se vztahuje pouze pokud máte nainstalovaný mód Shiny Mechanics quality.
enable-accumulators=Povolit změny kvality pro akumulátory.
enable-agricultural-towers=Povolit změny kvality pro zemědělské věže.
enable-assembly-machines=Povolit změny kvality pro výrobní stroje.
enable-asteroid-collectors=Povolit změny kvality pro sběrače asteroidů.
asteroid-collector-growth-level-limit=Omezuje růst kvality sběračů asteroidů na vanilkové hodnoty, aby se předešlo problémům narušujícím hru.\n\nSběrače asteroidů s modovanými úrovněmi kvality mohou mít příliš mnoho ramen, která se pohybují příliš rychle, takže nejsou schopny zachytit kusy asteroidů a způsobují velké snížení UPS.\n\n[color=green]Výchozí: legendární[/color]
enable-beacons=Povolit změny kvality pro majáky.
enable-boilers=Povolit změny kvality pro kotle.
enable-combinators-and-speakers=Povolit změny kvality pro kombinátory a reproduktory.\n\nZahrnuje: aritmetické kombinátory, rozhodovací kombinátory, konstantní kombinátory, programovatelné reproduktory.
enable-pumps=Povolit změny kvality pro čerpadla (zahrnuje pobřežní čerpadla a čerpadla kapalin).
enable-furnaces=Povolit změny kvality pro pece.
enable-generators=Povolit změny kvality pro generátory (parní stroje, parní turbíny, fúzní generátory).
enable-heat-pipes=Povolit změny kvality pro tepelné trubky.
enable-inserters=Povolit změny kvality pro manipulátory.
enable-labs=Povolit změny kvality pro výzkumné laboratoře.
enable-lamps=Povolit změny kvality pro lampy.
enable-lightning-rods=Povolit změny kvality pro hromosvody.
enable-mining-drills=Povolit změny kvality pro všechny těžební vrtáky.
enable-poles=Povolit změny kvality pro všechny elektrické sloupy (včetně velkých elektrických sloupů a transformátorek).
enable-power-switches=Povolit změny kvality pro energetické přepínače.
enable-radar=Povolit změny kvality pro radarové stanice.
radar-growth-level-limit=Omezuje růst kvality radaru za účelem předcházení nadměrnému průzkumu mapy a nafouknutí souborů uložení.\n\nRadar s velmi vysokými úrovněmi kvality mohou způsobit velké soubory uložení (1,200mb+) kvůli nadměrnému průzkumu mapy.\n\n[color=green]Výchozí: legendární[/color]
lightning-attractor-growth-level-limit=Omezuje růst kvality bleskojistky za účelem předcházení výkonnostním problémům.\n\nBleskojistky s velmi vysokými úrovněmi kvality mají výrazně zvětšené oblasti pokrytí, což může způsobit lagové špičky v noci na Fulgoře.\n\n[color=green]Výchozí: legendární[/color]
enable-reactors=Povolit změny kvality pro reaktory (jaderné reaktory, fúzní reaktory).
enable-rocket-silos=Povolit změny kvality pro raketová sila.
enable-roboports=Povolit změny kvality pro robotické přístavy.
enable-solar-panels=Povolit změny kvality pro solární panely.
enable-thrusters=Povolit změny kvality pro kosmické trysky. Výchozí nastavení je zakázáno, protože neočekávaná změna rychlosti kosmické lodi může vést k přetížení obrany.
thruster-growth-level-limit=Omezuje růst kvality kosmických trysek na vanilkové úrovně, aby se předešlo obranným problémům.\n\nModované úrovně kvality mohou pohybovat kosmickými loděmi výrazně rychleji, což může přetížit jejich obranu.\n\n[color=green]Výchozí: legendární[/color]
enable-turrets=Povolit změny kvality pro věže.\n\nVěže jsou primární stavby, které generují upgrade kredity na základě celkového uděleného poškození.\n\nZahrnuje: střelné věže, laserové věže, plamenomety, dělostřelecké věže.
turret-damage-per-manufacturing-hour=Množství poškození, které musí věž udělit, aby se rovnalo jedné výrobní hodině.\n\nVýchozí: 36 000 poškození (odvozeno od průbojných nábojů: 450 zásobníků/hodinu × 80 poškození/zásobník).\n\nNižší hodnoty způsobují rychlejší generování kreditů věžemi. Vyšší hodnoty zpomalují generování kreditů.
enable-defense-walls-and-gates=Povolit změny kvality pro zdi a brány.\n\nZahrnuje: zdi, brány.
custom-upgrade-limit-a=Použijte toto pro nastavení vlastních limitů modovaných kvalit staveb. Potřebné pouze pokud máte mod, který přidává úrovně kvality nad legendární, a chcete omezit, jak moc se stavba bude vylepšovat. Pro použití této funkce zde nastavte maximální úroveň, poté přejděte ke stavbě, kterou chcete omezit, a v rozbalovacím seznamu vyberte 'Vlastní A'. Pro orientaci, legendární je úroveň 5 (běžná = 1, neobvyklá = 2, vzácná = 3, epická = 4, legendární = 5...).
custom-upgrade-limit-b=Použijte toto pro nastavení vlastních limitů modovaných kvalit staveb. Potřebné pouze pokud máte mod, který přidává úrovně kvality nad legendární, a chcete omezit, jak moc se stavba bude vylepšovat. Pro použití této funkce zde nastavte maximální úroveň, poté přejděte ke stavbě, kterou chcete omezit, a v rozbalovacím seznamu vyberte 'Vlastní B'. Pro orientaci, legendární je úroveň 5 (běžná = 1, neobvyklá = 2, vzácná = 3, epická = 4, legendární = 5...).
custom-upgrade-limit-c=Použijte toto pro nastavení vlastních limitů modovaných kvalit staveb. Potřebné pouze pokud máte mod, který přidává úrovně kvality nad legendární, a chcete omezit, jak moc se stavba bude vylepšovat. Pro použití této funkce zde nastavte maximální úroveň, poté přejděte ke stavbě, kterou chcete omezit, a v rozbalovacím seznamu vyberte 'Vlastní C'. Pro orientaci, legendární je úroveň 5 (běžná = 1, neobvyklá = 2, vzácná = 3, epická = 4, legendární = 5...).
upgrade-limit-accumulators=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-agricultural-towers=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-assembly-machines=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-beacons=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-boilers=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-combinators-and-speakers=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.\n\nZahrnuje: aritmetické kombinátory, rozhodovací kombinátory, konstantní kombinátory, programovatelné reproduktory.
upgrade-limit-defense-walls-and-gates=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.\n\nZahrnuje: zdi, brány.
upgrade-limit-furnaces=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-generators=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.\n\nZahrnuje: parní stroje, parní turbíny, fúzní generátory.
upgrade-limit-heat-pipes=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-inserters=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-labs=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-lamps=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-mining-drills=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-poles=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.\n\nZahrnuje: všechny elektrické sloupy, velké elektrické sloupy a rozvodny.
upgrade-limit-power-switches=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-pumps=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.\n\nZahrnuje: mořská čerpadla a čerpadla kapalin.
upgrade-limit-reactors=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.\n\nZahrnuje: jaderné reaktory, fúzní reaktory.
upgrade-limit-rocket-silos=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-roboports=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-solar-panels=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.
upgrade-limit-turrets=Kontrola Kvality bude tyto stavby vylepšovat až do této kvality, poté přestane o další vylepšení usilovat. Nastavením na Běžná zabráníte jakýmkoli pokusům o vylepšení. Vlastní hodnoty používají nastavení Vlastní limit vylepšení A/B/C.\n\nZahrnuje: kulometné věže, laserové věže, plamenomety, dělostřelecké věže.
upgrade-limit-asteroid-collectors=Omezuje růst kvality sběračů asteroidů na vanilkové hodnoty, aby se předešlo problémům narušujícím hru.\n\nSběrače asteroidů s modovanými úrovněmi kvality mohou mít příliš mnoho ramen, která se pohybují příliš rychle, takže nejsou schopny zachytit kusy asteroidů a způsobují velké snížení UPS.\n\n[color=green]Výchozí: legendární[/color]
upgrade-limit-radar=Omezuje růst kvality radaru za účelem předcházení nadměrnému průzkumu mapy a nafouknutí souborů uložení.\n\nRadar s velmi vysokými úrovněmi kvality mohou způsobit velké soubory uložení (1,200mb+) kvůli nadměrnému průzkumu mapy.\n\n[color=green]Výchozí: legendární[/color]
upgrade-limit-lightning-rods=Omezuje růst kvality bleskojistky za účelem předcházení výkonnostním problémům.\n\nBleskojistky s velmi vysokými úrovněmi kvality mají výrazně zvětšené oblasti pokrytí, což může způsobit lagové špičky v noci na Fulgoře.\n\n[color=green]Výchozí: legendární[/color]
upgrade-limit-thrusters=Omezuje růst kvality kosmických trysek na vanilkové úrovně, aby se předešlo obranným problémům.\n\nModované úrovně kvality mohou pohybovat kosmickými loděmi výrazně rychleji, což může přetížit jejich obranu.\n\n[color=green]Výchozí: legendární[/color]

