[mod-setting-description]
manufacturing-hours-for-change=Počet výrobních hodin potřebných pro pokus o změnu kvality.\nVýrobní hodiny se akumulují pouze tehdy, když stroj aktivně pracuje. Pokud nečinně stojí, nepostupuje.\nMin hodnota 0,001 hodin (3,6 sekundy), Max hodnota 1000 hodin.
crafting-speed-affects-progression=[color=red]Zakázáno (výchozí):[/color] Rychlost výroby nemá na postup vliv, což pomáhá rovnoměrněji rozložit vylepšování během delší hry.\n\n[color=green]Povoleno:[/color] Rychlost výroby a produktivita zvyšují počet získaných výrobních hodin. Rychlost 4 s produktivitou 50 % získává šestkrát více než rychlost 1 bez bonusu k produktivitě. Zvýšení rychlosti díky vylepšením kvality se mohou navzájem umocňovat a vést k velmi rychlému vylepšování v pozdní fázi hry.
percentage-chance-of-change=Šance na úspěch při pokusu o vylepšení.
quality-increase-cost=Zvýšení počtu potřebných výrobních hodin za každou úroveň kvality. Zvýšení se násobí; při 0 % zůstává požadavek na všech úrovních stejný.\n\nPři 50 % se požadavek 3 hodin zvýší na 4,5 hodiny u neobvyklé a 6,75 hodiny u vzácné kvality.
quality-chance-accumulation-rate=Po neúspěšném pokusu zvýší šanci na vylepšení o procento základní šance.\n\n[color=white]Žádná:[/color] Šance zůstává konstantní.\n[color=white]Nízká:[/color] Přidá 20 % základní šance.\n[color=white]Střední:[/color] Přidá 50 % základní šance.\n[color=white]Vysoká:[/color] Přidá 100 % základní šance.\n\nPři základní šanci 1 % dává nízká hodnota 1 % → 1,2 % → 1,4 %... a vysoká hodnota 1 % → 2 % → 3 %...
secondary-progression-rate=Rychlost postupu staveb, které nemohou měřit svou vlastní práci, jako jsou manipulátory, sloupy a majáky.\n\n100 % odpovídá průměru výrobních hodin získaných primárními stavbami na stejném povrchu. Vyšší hodnoty postup zrychlují; 0 % jej pozastaví.
change-modules-with-entity=[color=white]Zakázáno:[/color] Moduly se nevylepšují.\n\n[color=white]Povoleno:[/color] Moduly se při vylepšení stroje vylepší o jednu úroveň, nejvýše však na kvalitu stroje.\n\n[color=white]Extra povoleno:[/color] Moduly se vylepší na novou kvalitu svého stroje.\n\n[color=white]Nezávisle:[/color] Moduly získávají vlastní pokusy o vylepšení ze sekundárního postupu a mohou překročit limit kvality stroje. Nastavení limitu stroje na Běžná zakáže i vylepšování modulů.
batch-entities-per-tick=Počet staveb zpracovaných v jedné dávce. Větší dávky zpracují vylepšení rychleji, ale mohou způsobit zpoždění. V nezávislém režimu se počítají i sloty modulů.
batch-ticks-between-processing=Počet tiků mezi zpracováním dávek. Kratší intervaly zpracovávají vylepšení častěji, ale mohou snížit výkon.
quality-change-aggregate-alerts-enabled=Každých pět minut zobrazit souhrn vylepšení.
quality-change-entity-alerts-enabled=Zobrazit ikony upozornění na mapě v místech vylepšení.
quality-change-chat-enabled=Zobrazit zprávy o vylepšení s ikonami staveb nebo modulů, ikonami kvality a náhodně duhově zbarvenými písmeny.
quality-change-gps-enabled=Pro každé vylepšení zobrazit odkaz na polohu a spustit GPS upozornění na mapě Factorio. Kliknutím na odkaz se vrátíte na dané místo. Je-li zapnutý barevný chat, přidá odkaz do zprávy o vylepšení; jinak zobrazí pouze odkaz. Vestavěné GPS upozornění vyžaduje odkaz v chatu.
quality-change-floating-text-enabled=Zobrazit stoupající text vylepšení v barvě nové kvality.
quality-change-halo-enabled=Zobrazit v místech vylepšení rozpínající se svatozář v barvě nové kvality.
quality-change-rainbow-enabled=Zobrazit v místech vylepšení rozpínající se duhové kruhy.
quality-change-badge-enabled=Po dobu 4,5 sekundy zobrazit rostoucí a stoupající ikonu nové kvality, která se při mizení nepřetržitě otáčí.
quality-change-bubbles-enabled=V místech vylepšení vypustit proud malých ikon nové kvality, které stoupají jako bubliny.
quality-change-sound-enabled=Přehrát vybraný zvuk při vylepšení na právě zobrazeném povrchu, včetně vzdáleného pohledu.
quality-change-sound=Vyberte zvukový efekt oznámení, alarm reproduktoru, zvuk bicích nebo hudební nástroj. Nástroje používají nastavení tónu nástroje / základního tónu a chování tónů. Zvuk se přehraje pouze při zapnutém zvuku vylepšení a pro vylepšení na právě zobrazeném povrchu.
quality-change-sound-note=Pevný tón nebo základní tón (tónina a počáteční rejstřík) pro hudební vzory. Ignoruje se u alarmů, bicích, efektů a režimu Zcela náhodně.\nTóny stoupají po půltónech od F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; pro další oktávu přičtěte 12. Výchozí: 20 (C).\nKlavír má 48 tónů, ostatní nástroje 36. Pevný režim omezí tón na nejvyšší dostupný. Hudební vzory se podle potřeby posunou o celé oktávy dolů, aby se vešly do rozsahu, a zachovají tóninu. Stejná nastavení vytvářejí odpovídající vzory ve vlastním rejstříku každého nástroje.
quality-change-sound-mode=Jeden tón za každé slyšitelné vylepšení, se samostatným vzorem pro každého hráče. Pevný tón zachovává vybraný tón; Hudební putování se posouvá o jeden nebo dva stupně stupnice; Větrná zvonkohra vybírá náhodné tóny durové pentatoniky; Schodiště opakovaně stoupá a klesá; Náhodně ve stupnici vybírá libovolný tón ve vybrané stupnici a rozsahu; Zcela náhodně používá celý rozsah nástroje.\nPutování a Schodiště začínají základním tónem a pokračují po tichých obdobích i po uložení a načtení hry. Žádné opožděné tóny se neřadí do fronty. Ovlivňuje pouze hudební nástroje.
quality-change-sound-scale=Stupnice vzhledem k tónu nástroje / základnímu tónu, používaná režimy Hudební putování, Schodiště a Náhodně ve stupnici. Chromatická umožňuje každý půltón. Větrná zvonkohra vždy používá durovou pentatoniku; Pevný tón a Zcela náhodně toto nastavení ignorují.
quality-change-sound-range=Jedna nebo dvě oktávy začínající základním tónem, podle potřeby posunuté o celé oktávy dolů, aby se vešly do rozsahu nástroje; nebo celý rozsah nástroje. Platí pro režimy Hudební putování, Větrná zvonkohra, Schodiště a Náhodně ve stupnici. Pevný tón a Zcela náhodně toto nastavení ignorují.
quality_control_skip_hidden_qualities=Přeskočit skryté kvality (např. lesklé varianty) při vylepšování. Toto nastavení platí pouze tehdy, máte-li nainstalovaný mod jako Shiny Mechanics.
quality_control_hidden_qualities_sticky==Stavby se skrytými kvalitami (např. lesklé) se nebudou dále vylepšovat, čímž si zachovají své jedinečné výhody. Toto nastavení platí pouze tehdy, máte-li nainstalovaný mod jako Shiny Mechanics.
enable-accumulators=Povolit vylepšování akumulátorů.
enable-agricultural-towers=Povolit vylepšování zemědělských věží.
enable-assembly-machines=Povolit vylepšování výrobních strojů.
enable-asteroid-collectors=Povolit vylepšování sběračů asteroidů.
asteroid-collector-growth-level-limit=Omezuje růst kvality sběračů asteroidů na vanilkové hodnoty, aby se předešlo problémům narušujícím hru.\n\nSběrače asteroidů s modovanými úrovněmi kvality mohou mít příliš mnoho ramen, která se pohybují příliš rychle, takže nejsou schopny zachytit kusy asteroidů a způsobují velké snížení UPS.\n\n[color=green]Výchozí: legendární[/color]
enable-beacons=Povolit vylepšování majáků.
enable-boilers=Povolit vylepšování kotlů.
enable-combinators-and-speakers=Povolit vylepšování kombinátorů a programovatelných reproduktorů.
enable-pumps=Povolit vylepšování pobřežních čerpadel a čerpadel kapalin.
enable-furnaces=Povolit vylepšování pecí.
enable-generators=Povolit vylepšování parních strojů, parních turbín a fúzních generátorů.
enable-heat-pipes=Povolit vylepšování tepelných trubek.
enable-inserters=Povolit vylepšování manipulátorů.
enable-labs=Povolit vylepšování výzkumných laboratoří.
enable-lamps=Povolit vylepšování lamp.
enable-lightning-rods=Povolit vylepšování hromosvodů.
enable-mining-drills=Povolit vylepšování těžebních vrtáků.
enable-poles=Povolit vylepšování elektrických sloupů a transformátorek.
enable-power-switches=Povolit vylepšování energetických přepínačů.
enable-radar=Povolit vylepšování radarových stanic.
radar-growth-level-limit=Omezuje růst kvality radaru za účelem předcházení nadměrnému průzkumu mapy a nafouknutí souborů uložení.\n\nRadar s velmi vysokými úrovněmi kvality mohou způsobit velké soubory uložení (1,200mb+) kvůli nadměrnému průzkumu mapy.\n\n[color=green]Výchozí: legendární[/color]
lightning-attractor-growth-level-limit=Omezuje růst kvality bleskojistky za účelem předcházení výkonnostním problémům.\n\nBleskojistky s velmi vysokými úrovněmi kvality mají výrazně zvětšené oblasti pokrytí, což může způsobit lagové špičky v noci na Fulgoře.\n\n[color=green]Výchozí: legendární[/color]
enable-reactors=Povolit vylepšování jaderných a fúzních reaktorů.
enable-rocket-silos=Povolit vylepšování raketových sil.
enable-roboports=Povolit vylepšování robotických přístavů.
enable-solar-panels=Povolit vylepšování solárních panelů.
enable-thrusters=Povolit vylepšování kosmických trysek. Rychlejší lodě mohou přetížit svou obranu.
thruster-growth-level-limit=Volitelně omezit kosmické trysky na úrovně základní hry. Modované úrovně kvality mohou výrazně zrychlit kosmické lodě, což může přetížit jejich obranu.
enable-turrets=Povolit vylepšování kulometných, laserových, plamenometných a dělostřeleckých věží. Věže získávají „výrobní hodiny“ udělováním poškození.
turret-damage-per-manufacturing-hour=Množství poškození, které musí věž udělit, aby získala jednu výrobní hodinu.\n\nVýchozí: 36 000 poškození (odvozeno od množství průbojných nábojů, které základní montovna vyrobí za hodinu).
turrets-contribute-credits=Umožnit věžím přispívat k vylepšování sekundárních staveb, jako jsou manipulátory a elektrické sloupy, na stejném povrchu. V pozdní fázi hry mohou elektromagnetická děla a bleskové věže vylepšování výrazně urychlit.
enable-defense-walls-and-gates=Povolit vylepšování zdí a bran.
custom-upgrade-limit-a=Maximální úroveň kvality používaná nastavením „Vlastní A“ v níže uvedených limitech. Potřebné pouze při použití modu, který přidává úrovně kvality nad legendární, pokud chcete omezit, na jakou úroveň se stavba může vylepšit. Můžete například povolit sběračům asteroidů dosáhnout úrovně 10. Zde nastavte maximální úroveň, poté přejděte ke stavbě, kterou chcete omezit, a v rozbalovacím seznamu vyberte „Vlastní A“. Pro orientaci, legendární je úroveň 5.
custom-upgrade-limit-b=Maximální úroveň kvality používaná hodnotou Vlastní B v nastavení limitů vylepšení.
custom-upgrade-limit-c=Maximální úroveň kvality používaná hodnotou Vlastní C v nastavení limitů vylepšení.
upgrade-limit-accumulators=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-agricultural-towers=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-assembly-machines=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-beacons=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-boilers=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-combinators-and-speakers=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.\n\nZahrnuje: aritmetické kombinátory, rozhodovací kombinátory, konstantní kombinátory, programovatelné reproduktory.
upgrade-limit-defense-walls-and-gates=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-furnaces=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-generators=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.\n\nZahrnuje: parní stroje, parní turbíny, fúzní generátory.
upgrade-limit-heat-pipes=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-inserters=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-labs=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-lamps=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-mining-drills=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-poles=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.\n\nZahrnuje elektrické sloupy a transformátorky.
upgrade-limit-power-switches=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-pumps=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.\n\nZahrnuje: pobřežní čerpadla a čerpadla kapalin.
upgrade-limit-reactors=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.\n\nZahrnuje: jaderné reaktory, fúzní reaktory.
upgrade-limit-rocket-silos=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-roboports=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-solar-panels=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.
upgrade-limit-turrets=Maximální kvalita vylepšení těchto staveb. Běžná zakáže vylepšování; Vlastní A/B/C použije příslušnou úroveň nastavenou výše.\n\nZahrnuje: kulometné věže, laserové věže, plamenomety, dělostřelecké věže.
upgrade-limit-asteroid-collectors=Omezit sběrače asteroidů na legendární kvalitu, aby se předešlo problémům narušujícím hru. Modované úrovně mohou vytvořit příliš mnoho ramen, která se pohybují příliš rychle, nejsou schopna zachytit kusy asteroidů a způsobují výrazné snížení UPS.
upgrade-limit-radar=Omezit radary na legendární kvalitu, aby se předešlo nadměrnému zvětšování souborů uložení. Modované kvality mohou způsobit nadměrný průzkum mapy a velmi velké soubory uložení (přes gigabajt).
upgrade-limit-lightning-rods=Omezit bleskojistky na legendární kvalitu, aby se předešlo výkyvům UPS. Bleskojistky s modovanými úrovněmi kvality mají výrazně větší oblasti pokrytí, což může v noci na Fulgoře způsobit výkyvy výkonu.
upgrade-limit-thrusters=Omezit kosmické trysky na legendární kvalitu, aby se předešlo neočekávanému poškození vesmírné platformy. Modované úrovně kvality mohou výrazně zrychlit kosmické lodě, což může přetížit jejich obranu.

