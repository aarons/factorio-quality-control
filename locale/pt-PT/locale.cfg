[mod-setting-description]
manufacturing-hours-for-change=O número de horas de fabrico necessárias para uma tentativa de mudança de qualidade.\nAs horas de fabrico só são acumuladas quando a máquina está a trabalhar ativamente. Se estiver inativa, não haverá progressão.\nValor mínimo 0.001 horas (3.6 segundos), Valor máximo 1000 horas.
crafting-speed-affects-progression=[color=red]Desativado (predefinição):[/color] A velocidade de fabrico não afeta a progressão, o que ajuda a distribuir as melhorias de forma mais uniforme ao longo de uma partida mais longa.\n\n[color=green]Ativado:[/color] A velocidade de fabrico e a produtividade aumentam as horas de fabrico acumuladas. Velocidade 4 com 50% de produtividade acumula seis vezes mais do que velocidade 1 sem bónus de produtividade. Os aumentos de velocidade resultantes das melhorias de qualidade podem acumular-se, levando a melhorias muito rápidas na fase final do jogo.
percentage-chance-of-change=Hipótese de sucesso de uma tentativa de melhoria.
quality-increase-cost=Aumento das horas de fabrico necessárias por nível de qualidade. O aumento é composto; 0% mantém o requisito igual em todos os níveis.\n\nA 50%, um requisito de 3 horas passa a 4,5 horas em incomum e 6,75 horas em raro.
quality-chance-accumulation-rate=Aumenta a hipótese de melhoria após uma tentativa falhada numa percentagem da hipótese base.\n\n[color=white]Nenhuma:[/color] A hipótese mantém-se constante.\n[color=white]Baixa:[/color] Adiciona 20% da hipótese base.\n[color=white]Média:[/color] Adiciona 50% da hipótese base.\n[color=white]Alta:[/color] Adiciona 100% da hipótese base.\n\nCom uma hipótese base de 1%, Baixa dá 1% → 1,2% → 1,4%... e Alta dá 1% → 2% → 3%...
secondary-progression-rate=Velocidade de progressão das entidades que não conseguem medir o seu próprio trabalho, como inseridores, postes e faróis.\n\n100% corresponde à média de horas de fabrico acumuladas pelas entidades primárias na mesma superfície. Valores mais altos aceleram a progressão; 0% pausa-a.
change-modules-with-entity=[color=white]Desativado:[/color] Os módulos não melhoram.\n\n[color=white]Ativado:[/color] Os módulos melhoram um nível quando a sua máquina melhora, até à qualidade da máquina.\n\n[color=white]Extra Ativado:[/color] Os módulos melhoram para corresponder à nova qualidade da sua máquina.\n\n[color=white]Independente:[/color] Os módulos acumulam as suas próprias tentativas de melhoria através da progressão secundária e podem exceder o limite de qualidade da máquina. Definir o limite da máquina como Comum também desativa as melhorias dos módulos.
batch-entities-per-tick=Entidades processadas por lote. Lotes maiores processam melhorias mais rapidamente, mas podem causar lag. As ranhuras de módulos também contam no modo Independente.
batch-ticks-between-processing=Ticks entre processamentos em lote. Intervalos mais curtos processam melhorias com maior frequência, mas podem reduzir a performance.
quality-change-aggregate-alerts-enabled=Mostrar um resumo das melhorias a cada cinco minutos.
quality-change-entity-alerts-enabled=Mostrar ícones de alerta no mapa nos locais das melhorias.
quality-change-chat-enabled=Mostrar mensagens de melhoria com ícones de entidades ou módulos, ícones de qualidade e letras com cores de arco-íris aleatórias.
quality-change-gps-enabled=Mostrar uma ligação clicável para o local e acionar o ping de GPS do Factorio no mapa para cada melhoria. Clique na ligação para voltar ao local. Adiciona a ligação às mensagens coloridas de melhoria no chat quando ativadas; caso contrário, mostra apenas a ligação. O ping de GPS nativo requer uma ligação no chat.
quality-change-floating-text-enabled=Mostrar texto de melhoria ascendente na cor da nova qualidade.
quality-change-halo-enabled=Mostrar um halo em expansão na cor da nova qualidade nos locais das melhorias.
quality-change-rainbow-enabled=Mostrar anéis arco-íris em expansão nos locais das melhorias.
quality-change-badge-enabled=Mostrar o ícone da nova qualidade a crescer e a subir durante 4,5 segundos, rodando continuamente enquanto desaparece.
quality-change-bubbles-enabled=Libertar uma sequência de pequenos ícones da nova qualidade que sobem como bolhas nos locais das melhorias.
quality-change-sound-enabled=Reproduzir o som selecionado para melhorias na superfície atualmente visualizada, incluindo na vista remota.
quality-change-sound=Escolha um efeito de notificação, alarme de altifalante, som de bateria ou instrumento musical. Os instrumentos usam Nota do Instrumento / Tónica e Comportamento das Notas de Melhoria. Só é reproduzido quando o Som de Melhoria está ativado, para melhorias na superfície atualmente visualizada.
quality-change-sound-note=Nota fixa ou tónica (tom e registo inicial) dos padrões musicais. Ignorada para alarmes, bateria, efeitos e modo Totalmente aleatório.\nAs notas sobem por semitons a partir de Fá: 1=Fá, 3=Sol, 5=Lá, 7=Si, 8=Dó, 10=Ré, 12=Mi; some 12 para a oitava seguinte. Predefinição: 20 (Dó).\nO piano tem 48 notas; os outros instrumentos têm 36. O modo Nota fixa limita a nota à mais alta disponível. Os padrões musicais descem por oitavas completas quando necessário para caberem, preservando o tom. As mesmas definições produzem padrões equivalentes no registo próprio de cada instrumento.
quality-change-sound-mode=Uma nota por melhoria audível, com um padrão separado para cada jogador. Nota fixa mantém a nota selecionada; Deambulação musical avança ou recua um ou dois graus da escala; Sinos de vento escolhe notas aleatórias da escala pentatónica maior; Escadaria sobe e desce repetidamente; Aleatório na escala escolhe qualquer nota da escala e extensão selecionadas; Totalmente aleatório usa toda a extensão do instrumento.\nDeambulação musical e Escadaria começam na tónica e retomam após períodos de silêncio e ao guardar ou carregar o jogo. Não são colocadas notas atrasadas em espera. Só afeta instrumentos musicais.
quality-change-sound-scale=Escala relativa à Nota do Instrumento / Tónica de Melhoria, usada por Deambulação musical, Escadaria e Aleatório na escala. Cromática permite todos os semitons. Sinos de vento usa sempre a escala pentatónica maior; Nota fixa e Totalmente aleatório ignoram esta definição.
quality-change-sound-range=Uma ou duas oitavas a partir da tónica, deslocadas para baixo por oitavas completas se necessário para caberem no instrumento; ou toda a extensão do instrumento. Aplica-se a Deambulação musical, Sinos de vento, Escadaria e Aleatório na escala. Nota fixa e Totalmente aleatório ignoram esta definição.
quality_control_skip_hidden_qualities=Saltar qualidades ocultas (por exemplo, variantes brilhantes) ao melhorar. Esta definição só se aplica quando tem instalado um mod como o Shiny Mechanics.
quality_control_hidden_qualities_sticky==Entidades com qualidades ocultas (por exemplo, brilhantes) não melhorarão mais, preservando os seus benefícios únicos. Esta definição só se aplica quando tem instalado um mod como o Shiny Mechanics.
enable-accumulators=Ativar melhorias para acumuladores.
enable-agricultural-towers=Ativar melhorias para torres agrícolas.
enable-assembly-machines=Ativar melhorias para máquinas de montagem.
enable-asteroid-collectors=Ativar melhorias para coletores de asteroides.
asteroid-collector-growth-level-limit=Limita o crescimento da qualidade dos coletores de asteroides a valores de base para prevenir problemas que quebrem o jogo.\n\nColetores de asteroides com níveis de qualidade modificados podem ter demasiados braços que se movem demasiado rápido, tornando-se incapazes de apanhar fragmentos de asteroides e criando um grande consumo de UPS.\n\n[color=green]Padrão: lendário[/color]
enable-beacons=Ativar melhorias para faróis.
enable-boilers=Ativar melhorias para caldeiras.
enable-combinators-and-speakers=Ativar melhorias para combinadores e altifalantes programáveis.
enable-pumps=Ativar melhorias para bombas costeiras e bombas de fluido.
enable-furnaces=Ativar melhorias para fornalhas.
enable-generators=Ativar melhorias para motores a vapor, turbinas a vapor e geradores de fusão.
enable-heat-pipes=Ativar melhorias para tubos de calor.
enable-inserters=Ativar melhorias para inseridores.
enable-labs=Ativar melhorias para laboratórios de investigação.
enable-lamps=Ativar melhorias para lâmpadas.
enable-lightning-rods=Ativar melhorias para para-raios.
enable-mining-drills=Ativar melhorias para brocas de mineração.
enable-poles=Ativar melhorias para postes elétricos e subestações.
enable-power-switches=Ativar melhorias para interruptores de energia.
enable-radar=Ativar melhorias para estações de radar.
radar-growth-level-limit=Limita o crescimento da qualidade do radar para prevenir exploração excessiva do mapa e inchaço do ficheiro de salvaguarda.\n\nRadares com níveis de qualidade muito altos podem causar ficheiros de salvaguarda grandes (1.200mb+) devido à exploração excessiva do mapa.\n\n[color=green]Padrão: lendário[/color]
lightning-attractor-growth-level-limit=Limita o crescimento da qualidade do atrator de relâmpagos para prevenir problemas de performance.\n\nAtratores de relâmpagos com níveis de qualidade muito altos têm áreas de cobertura significativamente aumentadas, o que pode causar picos de lag à noite em Fulgora.\n\n[color=green]Padrão: lendário[/color]
enable-reactors=Ativar melhorias para reatores nucleares e de fusão.
enable-rocket-silos=Ativar melhorias para silos de foguetão.
enable-roboports=Ativar melhorias para roboportos.
enable-solar-panels=Ativar melhorias para painéis solares.
enable-thrusters=Ativar melhorias para propulsores espaciais. Naves mais rápidas podem sobrecarregar as suas defesas.
thruster-growth-level-limit=Limitar opcionalmente os propulsores espaciais aos níveis de base. Níveis de qualidade modificados podem fazer as naves espaciais moverem-se significativamente mais depressa, o que pode sobrecarregar as suas defesas.
enable-turrets=Ativar melhorias para torretas de munições, laser, lança-chamas e artilharia. As torretas acumulam 'horas de fabrico' ao infligir dano.
turret-damage-per-manufacturing-hour=A quantidade de dano que uma torreta deve infligir para acumular uma hora de fabrico.\n\nPredefinição: 36.000 de dano (calculado a partir da quantidade de projéteis perfurantes que uma máquina de montagem de nível base pode produzir numa hora).
turrets-contribute-credits=Permitir que as torretas contribuam para as melhorias de entidades secundárias, como inseridores e postes elétricos, na mesma superfície. Isto pode acelerar bastante as melhorias numa fase avançada do jogo com canhões eletromagnéticos e torretas de relâmpagos.
enable-defense-walls-and-gates=Ativar melhorias para muros e portões.
custom-upgrade-limit-a=Nível máximo de qualidade usado pela definição 'Personalizado A' nos limites abaixo. Só é necessário quando tem um mod que adiciona níveis de qualidade além de lendário e quer limitar até onde uma entidade pode ser melhorada. Por exemplo, se quiser permitir que os coletores de asteroides cheguem ao nível 10. Para usar esta funcionalidade, defina aqui o nível máximo, depois vá até à entidade que quer limitar e selecione 'Personalizado A' na lista. Para referência, lendário é o nível 5.
custom-upgrade-limit-b=Nível máximo de qualidade usado por Personalizado B nas definições de limite de melhoria.
custom-upgrade-limit-c=Nível máximo de qualidade usado por Personalizado C nas definições de limite de melhoria.
upgrade-limit-accumulators=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-agricultural-towers=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-assembly-machines=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-beacons=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-boilers=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-combinators-and-speakers=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: combinadores aritméticos, combinadores de decisão, combinadores constantes, altifalantes programáveis.
upgrade-limit-defense-walls-and-gates=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-furnaces=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-generators=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: motores a vapor, turbinas a vapor, geradores de fusão.
upgrade-limit-heat-pipes=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-inserters=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-labs=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-lamps=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-mining-drills=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-poles=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui postes elétricos e subestações.
upgrade-limit-power-switches=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-pumps=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: bombas de água costeiras e bombas de fluido.
upgrade-limit-reactors=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: reatores nucleares, reatores de fusão.
upgrade-limit-rocket-silos=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-roboports=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-solar-panels=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.
upgrade-limit-turrets=Qualidade máxima de melhoria para estas entidades. Comum desativa as melhorias; Personalizado A/B/C usa o nível personalizado definido acima.\n\nInclui: torretas de munições, torretas laser, lança-chamas, torretas de artilharia.
upgrade-limit-asteroid-collectors=Limitar os coletores de asteroides a lendário para prevenir problemas graves no jogo. Níveis modificados podem criar demasiados braços que se movem demasiado depressa, tornando-se incapazes de apanhar fragmentos de asteroides e causando um grande consumo de UPS.
upgrade-limit-radar=Limitar os radares a lendário para evitar o aumento excessivo do tamanho do ficheiro de salvaguarda. Qualidades modificadas podem causar exploração excessiva do mapa e criar ficheiros muito grandes (mais de um gigabyte).
upgrade-limit-lightning-rods=Limitar os atratores de relâmpagos a lendário para prevenir picos de UPS. Atratores de relâmpagos com níveis de qualidade modificados têm áreas de cobertura significativamente maiores, o que pode causar picos de lag à noite em Fulgora.
upgrade-limit-thrusters=Limitar os propulsores espaciais a lendário para prevenir danos inesperados nas plataformas espaciais. Níveis de qualidade modificados podem fazer as naves espaciais moverem-se significativamente mais depressa, o que pode sobrecarregar as suas defesas.

