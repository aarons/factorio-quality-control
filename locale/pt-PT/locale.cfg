[mod-setting-description]
manufacturing-hours-for-change=O número de horas de fabrico necessárias para uma tentativa de mudança de qualidade.\nAs horas de fabrico só são acumuladas quando a máquina está a trabalhar ativamente. Se estiver inativa, não haverá progressão.\nValor mínimo 0.001 horas (3.6 segundos), Valor máximo 1000 horas.
crafting-speed-affects-progression=Controla se a velocidade de fabrico de uma máquina influencia a rapidez com que esta acumula horas de fabrico.\n\n[color=green]Ativado (predefinição):[/color] As máquinas com maior velocidade de fabrico progridem mais depressa. As horas de fabrico são acumuladas com base na velocidade de fabrico e na produtividade da máquina. Uma fundição com velocidade 4 e 50% de produtividade progride seis vezes mais depressa do que uma Máquina de Montagem 2 com velocidade de fabrico 1.\n\n[color=red]Desativado:[/color] A velocidade de fabrico não tem qualquer impacto na progressão. Uma hora dedicada ao fabrico ativo conta como uma hora de fabrico, independentemente da velocidade de fabrico. Isto elimina o efeito cumulativo em que cada melhoria de qualidade acelera a seguinte.
percentage-chance-of-change=A percentagem de hipótese de uma mudança de qualidade ser bem-sucedida.\nValor mínimo 0.0001%, Valor máximo 100% (mudar sempre após o tempo passar)
quality-increase-cost=Isto aumenta o tempo entre tentativas de mudança por nível de qualidade. Esta é uma fórmula composta. Definir para 0% manterá o tempo entre tentativas igual independentemente do nível de qualidade\n\n[color=green]Exemplo com 3 horas de fabrico necessárias a 50% de custo por nível[/color]\n\nNormal: 3 horas\nIncomum: 4.5 horas\nRaro: 6.8 horas\nÉpico: 10.1 horas\nLendário: 15.2 horas\nNível de qualidade modificado 10: 173 horas
quality-chance-accumulation-rate=Controla quanto a hipótese aumenta após cada tentativa falhada.\n\n[color=white]Nenhuma (Padrão):[/color] Sem acumulação - a hipótese mantém-se constante.\n\n[color=white]Baixa (20%):[/color] A hipótese aumenta 20% da taxa base a cada falha.\n\n[color=white]Média (50%):[/color] A hipótese aumenta 50% da taxa base a cada falha.\n\n[color=white]Alta (100%):[/color] A hipótese aumenta 100% da taxa base a cada falha.\n\n[color=yellow]Exemplo com hipótese base de 1%:[/color]\n\n[color=white]Baixa:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]Alta:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nTodas as definições de acumulação eventualmente garantem mudanças de qualidade - definições mais altas apenas atingem 100% de hipótese mais rapidamente
accumulate-at-max-quality=Montadoras de qualidade máxima ainda contribuem:\nQuando ativado, montadoras e fornalhas na qualidade máxima continuarão a acompanhar horas de fabrico e gerar créditos de melhoria para entidades secundárias (como inseridores, faróis, etc.), mesmo que não possam melhorar mais.\n\n[color=green]Ativado (padrão):[/color] Montadoras de qualidade máxima continuam a gerar créditos de melhoria para entidades secundárias. Isto pode fornecer progresso constante para entidades secundárias no final do jogo.\n\n[color=red]Desativado:[/color] Apenas montadoras e fornalhas de baixa qualidade que ainda podem melhorar geram créditos, mas são gerados como uma proporção às entidades secundárias que ainda precisam de melhorias. Num caso extremo, isto significa que uma única montadora de baixa qualidade poderia avançar todas as entidades secundárias de uma fábrica inteira.
change-modules-with-entity=Isto controla se os módulos em máquinas são afetados por mudanças de qualidade.\n\n[color=white]Desativado (Padrão):[/color] Os módulos não são afetados quando a qualidade da máquina hospedeira muda.\n\n[color=white]Ativado:[/color] Os módulos mudam de qualidade um nível quando o hospedeiro muda. Não excederão o nível de qualidade do hospedeiro.\n\n[color=white]Extra Ativado:[/color] Como Ativado, mas os módulos serão atualizados para corresponder à qualidade da sua máquina hospedeira sempre que uma mudança de qualidade ocorrer.
batch-entities-per-tick=Número de entidades a processar a cada tick para evitar picos de performance.\nValor mínimo 1, Valor máximo 1000.\nValores mais altos podem causar picos de lag mas processam entidades mais rapidamente.
batch-ticks-between-processing=Número de ticks a esperar entre ciclos de processamento em lote.\nValor mínimo 1 tick, Valor máximo 6000 ticks (~2.5 minutos).\nValores mais baixos processam mais frequentemente mas podem impactar a performance.
quality-change-aggregate-alerts-enabled=Mostrar mensagens de consola resumindo todas as mudanças de qualidade (exibido uma vez a cada 5 minutos). Exemplo: "3 máquinas de montagem melhoradas, 2 inseridores melhorados"
quality-change-entity-alerts-enabled=Mostrar alertas de ping no mapa em entidades individuais quando a sua qualidade muda. Clique no alerta para ver a entidade melhorada.
quality_control_skip_hidden_qualities=O Controlo de Qualidade saltará qualidades ocultas (por exemplo, variantes brilhantes) ao melhorar. As entidades nunca se tornarão brilhantes através do Controlo de Qualidade - os jogadores devem obtê-las da forma normal. Esta definição só se aplica quando tem o mod Shiny Mechanics quality instalado.
quality_control_hidden_qualities_sticky=Entidades com qualidades ocultas (por exemplo, brilhantes) não melhorarão mais, preservando os seus benefícios únicos. Esta definição só se aplica quando tem o mod Shiny Mechanics quality instalado.
enable-accumulators=Ativar mudanças de qualidade para acumuladores.
enable-agricultural-towers=Ativar mudanças de qualidade para torres agrícolas.
enable-assembly-machines=Ativar mudanças de qualidade para máquinas de montagem.
enable-asteroid-collectors=Ativar mudanças de qualidade para coletores de asteroides.
asteroid-collector-growth-level-limit=Limita o crescimento da qualidade dos coletores de asteroides a valores de base para prevenir problemas que quebrem o jogo.\n\nColetores de asteroides com níveis de qualidade modificados podem ter demasiados braços que se movem demasiado rápido, tornando-se incapazes de apanhar fragmentos de asteroides e criando um grande consumo de UPS.\n\n[color=green]Padrão: lendário[/color]
enable-beacons=Ativar mudanças de qualidade para faróis.
enable-boilers=Ativar mudanças de qualidade para caldeiras.
enable-combinators-and-speakers=Ativar mudanças de qualidade para combinadores e altifalantes.\n\nInclui: combinadores aritméticos, combinadores de decisão, combinadores constantes, altifalantes programáveis.
enable-pumps=Ativar mudanças de qualidade para bombas (inclui bombas costeiras e bombas de fluido).
enable-furnaces=Ativar mudanças de qualidade para fornalhas.
enable-generators=Ativar mudanças de qualidade para geradores (motores a vapor, turbinas a vapor, geradores de fusão).
enable-heat-pipes=Ativar mudanças de qualidade para tubos de calor.
enable-inserters=Ativar mudanças de qualidade para inseridores.
enable-labs=Ativar mudanças de qualidade para laboratórios de investigação.
enable-lamps=Ativar mudanças de qualidade para lâmpadas.
enable-lightning-rods=Ativar mudanças de qualidade para para-raios.
enable-mining-drills=Ativar mudanças de qualidade para todas as brocas de mineração.
enable-poles=Ativar mudanças de qualidade para todos os postes elétricos (incluindo postes de energia grandes e subestações).
enable-power-switches=Ativar mudanças de qualidade para interruptores de energia.
enable-radar=Ativar mudanças de qualidade para estações de radar.
radar-growth-level-limit=Limita o crescimento da qualidade do radar para prevenir exploração excessiva do mapa e inchaço do ficheiro de salvaguarda.\n\nRadares com níveis de qualidade muito altos podem causar ficheiros de salvaguarda grandes (1.200mb+) devido à exploração excessiva do mapa.\n\n[color=green]Padrão: lendário[/color]
lightning-attractor-growth-level-limit=Limita o crescimento da qualidade do atrator de relâmpagos para prevenir problemas de performance.\n\nAtratores de relâmpagos com níveis de qualidade muito altos têm áreas de cobertura significativamente aumentadas, o que pode causar picos de lag à noite em Fulgora.\n\n[color=green]Padrão: lendário[/color]
enable-reactors=Ativar mudanças de qualidade para reatores (reatores nucleares, reatores de fusão).
enable-rocket-silos=Ativar mudanças de qualidade para silos de foguetão.
enable-roboports=Ativar mudanças de qualidade para roboportos.
enable-solar-panels=Ativar mudanças de qualidade para painéis solares.
enable-thrusters=Ativar mudanças de qualidade para propulsores espaciais. Desativado por padrão porque alterar a velocidade de uma nave espacial de forma inesperada pode levar a que as defesas fiquem sobrecarregadas.
thruster-growth-level-limit=Limita o crescimento da qualidade dos propulsores espaciais a níveis de base para prevenir problemas de defesa.\n\nNíveis de qualidade modificados podem mover naves espaciais significativamente mais rápido, o que pode sobrecarregar as suas defesas.\n\n[color=green]Padrão: lendário[/color]
enable-turrets=Ativar mudanças de qualidade para torretas.\n\nAs torretas são entidades primárias que geram créditos de melhoria com base no dano acumulado infligido.\n\nInclui: torretas de munição, torretas laser, lança-chamas, torretas de artilharia.
turret-damage-per-manufacturing-hour=A quantidade de dano que uma torreta deve infligir para equivaler a uma hora de fabrico.\n\nPadrão: 36.000 de dano (derivado de projéteis perfurantes: 450 carregadores/hora × 80 de dano/carregador).\n\nValores mais baixos fazem as torretas gerar créditos mais rapidamente. Valores mais altos abrandam a geração de créditos.
turrets-contribute-credits=Controla se os créditos de melhoria ganhos pelas torretas também alimentam a reserva partilhada que melhora entidades secundárias (inseridores, postes elétricos, etc.).\n\n[color=red]Desativado (predefinição):[/color] Os créditos das torretas ficam com a torreta. Os danos de combate só ajudam as torretas a melhorarem-se a si próprias.\n\n[color=green]Ativado:[/color] Os créditos das torretas também fluem para a reserva partilhada, para que os danos de combate façam progredir as entidades secundárias da mesma forma que o fabrico.
enable-defense-walls-and-gates=Ativar mudanças de qualidade para muros e portões.\n\nInclui: muros, portões.
custom-upgrade-limit-a=Use isto para definir limites personalizados para qualidades modificadas das entidades. Só é necessário quando tem um mod que adiciona níveis de qualidade além de lendário e quer limitar até onde uma entidade pode ser melhorada. Para usar esta funcionalidade, defina aqui o nível máximo, depois vá até à entidade que quer limitar e selecione 'Personalizado A' na lista. Para referência, lendário é o nível 5 (normal = 1, incomum = 2, raro = 3, épico = 4, lendário = 5...).
custom-upgrade-limit-b=Use isto para definir limites personalizados para qualidades modificadas das entidades. Só é necessário quando tem um mod que adiciona níveis de qualidade além de lendário e quer limitar até onde uma entidade pode ser melhorada. Para usar esta funcionalidade, defina aqui o nível máximo, depois vá até à entidade que quer limitar e selecione 'Personalizado B' na lista. Para referência, lendário é o nível 5 (normal = 1, incomum = 2, raro = 3, épico = 4, lendário = 5...).
custom-upgrade-limit-c=Use isto para definir limites personalizados para qualidades modificadas das entidades. Só é necessário quando tem um mod que adiciona níveis de qualidade além de lendário e quer limitar até onde uma entidade pode ser melhorada. Para usar esta funcionalidade, defina aqui o nível máximo, depois vá até à entidade que quer limitar e selecione 'Personalizado C' na lista. Para referência, lendário é o nível 5 (normal = 1, incomum = 2, raro = 3, épico = 4, lendário = 5...).
upgrade-limit-accumulators=O Controlo de Qualidade vai melhorar estas entidades até esta qualidade, e depois parar de tentar mais melhorias. Defina isto como Comum para evitar quaisquer tentativas de melhoria. Os valores personalizados usam as definições de limite de melhoria personalizado A/B/C.
upgrade-limit-agricultural-towers=O Controlo de Qualidade vai melhorar estas entidades até esta qualidade, e depois parar de tentar mais melhorias. Defina isto como Comum para evitar quaisquer tentativas de melhoria. Os valores personalizados usam as definições de limite de melhoria personalizado A/B/C.
