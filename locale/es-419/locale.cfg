[mod-setting-description]
manufacturing-hours-for-change=El número de horas de fabricación requeridas para que se intente un cambio de calidad.\nLas horas de fabricación solo se acumulan cuando la máquina está trabajando activamente. Si permanece inactiva, no progresará.\nValor mínimo 0.001 horas (3.6 segundos), Valor máximo 1000 horas.
crafting-speed-affects-progression=[color=red]Desactivado (por defecto):[/color] La velocidad de fabricación no afecta la progresión, lo que ayuda a distribuir las mejoras de manera más uniforme a lo largo de una partida larga.\n\n[color=green]Activado:[/color] La velocidad de fabricación y la productividad aumentan las horas de fabricación obtenidas. Una velocidad de 4 con 50% de productividad genera seis veces más que una velocidad de 1 sin bonificación de productividad. Los aumentos de velocidad por mejoras de calidad pueden acumularse, lo que genera mejoras muy rápidas en las etapas finales de la partida.
percentage-chance-of-change=Probabilidad de éxito de un intento de mejora.
quality-increase-cost=Aumento de las horas de fabricación necesarias por nivel de calidad. El aumento es compuesto; con 0%, el requisito se mantiene igual en todos los niveles.\n\nCon 50%, un requisito de 3 horas pasa a 4.5 horas en poco común y 6.75 horas en raro.
quality-chance-accumulation-rate=Aumenta la probabilidad de mejora después de un intento fallido en un porcentaje de la probabilidad base.\n\n[color=white]Ninguno:[/color] La probabilidad se mantiene constante.\n[color=white]Bajo:[/color] Añade 20% de la probabilidad base.\n[color=white]Medio:[/color] Añade 50% de la probabilidad base.\n[color=white]Alto:[/color] Añade 100% de la probabilidad base.\n\nCon una probabilidad base de 1%, Bajo da 1% → 1.2% → 1.4%... y Alto da 1% → 2% → 3%...
secondary-progression-rate=Velocidad de progresión de las entidades que no pueden medir su propio trabajo, como insertadores, postes y balizas.\n\nEl 100% equivale al promedio de horas de fabricación obtenidas por las entidades primarias en la misma superficie. Los valores más altos aceleran la progresión; 0% la pausa.
change-modules-with-entity=[color=white]Deshabilitado:[/color] Los módulos no mejoran.\n\n[color=white]Habilitado:[/color] Los módulos mejoran un nivel cuando su máquina mejora, hasta alcanzar la calidad de la máquina.\n\n[color=white]Extra Habilitado:[/color] Los módulos mejoran para igualar la nueva calidad de su máquina.\n\n[color=white]Independiente:[/color] Los módulos obtienen sus propios intentos de mejora mediante la progresión secundaria y pueden superar el límite de calidad de su máquina. Establecer el límite de la máquina en Común también deshabilita las mejoras de módulos.
batch-entities-per-tick=Entidades procesadas por lote. Los lotes más grandes procesan las mejoras más rápido, pero pueden causar lag. Los espacios de módulos también cuentan en el modo Independiente.
batch-ticks-between-processing=Ticks entre el procesamiento de lotes. Los intervalos más cortos procesan las mejoras con mayor frecuencia, pero pueden reducir el rendimiento.
quality-change-aggregate-alerts-enabled=Mostrar un resumen de mejoras cada cinco minutos.
quality-change-entity-alerts-enabled=Mostrar iconos de alerta en el mapa donde ocurran mejoras.
quality-change-chat-enabled=Mostrar mensajes de mejora con iconos de entidad o módulo, iconos de calidad y letras de colores de arcoíris aleatorios.
quality-change-gps-enabled=Mostrar un enlace de ubicación y activar la señal de GPS de Factorio en el mapa por cada mejora. Haz clic en el enlace para volver a la ubicación. Añade el enlace al chat colorido de mejoras si está habilitado; de lo contrario, solo muestra el enlace. La señal de GPS del juego requiere un enlace en el chat.
quality-change-floating-text-enabled=Mostrar texto de mejora ascendente con el color de la nueva calidad.
quality-change-halo-enabled=Mostrar un halo en expansión con el color de la nueva calidad donde ocurran mejoras.
quality-change-rainbow-enabled=Mostrar anillos de arcoíris en expansión donde ocurran mejoras.
quality-change-badge-enabled=Mostrar el icono de la nueva calidad creciendo y ascendiendo durante 4.5 segundos, mientras gira continuamente hasta desvanecerse.
quality-change-bubbles-enabled=Liberar una corriente de pequeños iconos de la nueva calidad que flotan como burbujas donde ocurran mejoras.
quality-change-sound-enabled=Reproducir el sonido seleccionado para las mejoras en la superficie que estás viendo, incluida la vista remota.
quality-change-sound=Elige un efecto de notificación, una alarma de altavoz, un sonido de batería o un instrumento musical. Los instrumentos usan Nota fundamental del instrumento y Comportamiento de las notas. Solo se reproduce si el sonido de mejora está habilitado y la mejora ocurre en la superficie que estás viendo.
quality-change-sound-note=Nota fija o nota fundamental (tonalidad y registro inicial) para los patrones musicales. Se ignora para alarmas, batería, efectos y el modo Totalmente aleatorio.\nLas notas ascienden por semitonos desde F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; suma 12 para la siguiente octava. Por defecto: 20 (C).\nEl piano tiene 48 notas; los demás instrumentos tienen 36. El modo de nota fija se limita a la nota más alta disponible. Los patrones musicales bajan por octavas completas cuando es necesario para ajustarse, conservando la tonalidad. La misma configuración produce patrones equivalentes en el registro de cada instrumento.
quality-change-sound-mode=Una nota por cada mejora audible, con un patrón independiente para cada jugador. Nota fija conserva la nota seleccionada; Recorrido musical avanza uno o dos pasos de la escala; Campanas de viento elige notas pentatónicas mayores al azar; Escalera asciende y desciende repetidamente; Aleatorio en la escala elige cualquier nota de la escala y el rango seleccionados; Totalmente aleatorio usa todo el rango del instrumento.\nRecorrido musical y Escalera comienzan en la nota fundamental y continúan después de períodos de silencio y al guardar o cargar la partida. No se ponen notas retrasadas en cola. Solo afecta a los instrumentos musicales.
quality-change-sound-scale=Escala relativa a la nota fundamental del instrumento, usada por Recorrido musical, Escalera y Aleatorio en la escala. Cromática permite todos los semitonos. Campanas de viento siempre usa la escala pentatónica mayor; Nota fija y Totalmente aleatorio ignoran esta configuración.
quality-change-sound-range=Una o dos octavas a partir de la nota fundamental, desplazadas hacia abajo por octavas completas si es necesario para ajustarse al instrumento; o el rango completo del instrumento. Se aplica a Recorrido musical, Campanas de viento, Escalera y Aleatorio en la escala. Nota fija y Totalmente aleatorio ignoran esta configuración.
quality_control_skip_hidden_qualities=Omitir las calidades ocultas (por ejemplo, variantes brillantes) al mejorar. Esta configuración solo se aplica cuando tienes instalado un mod como Shiny Mechanics.
quality_control_hidden_qualities_sticky==Las entidades con calidades ocultas (por ejemplo, brillante) no mejorarán más, preservando sus beneficios únicos. Esta configuración solo se aplica cuando tienes instalado un mod como Shiny Mechanics.
enable-accumulators=Habilitar mejoras para acumuladores.
enable-agricultural-towers=Habilitar mejoras para torres agrícolas.
enable-assembly-machines=Habilitar mejoras para máquinas de ensamblaje.
enable-asteroid-collectors=Habilitar mejoras para colectores de asteroides.
asteroid-collector-growth-level-limit=Limita el crecimiento de calidad del colector de asteroides a los valores de vainilla para prevenir problemas que rompan el juego.\n\nLos colectores de asteroides con niveles de calidad modificados pueden tener demasiados brazos que se muevan demasiado rápido, siendo incapaces de agarrar fragmentos de asteroides y creando un gran consumo de UPS.\n\n[color=green]Por defecto: legendario[/color]
enable-beacons=Habilitar mejoras para balizas.
enable-boilers=Habilitar mejoras para calderas.
enable-combinators-and-speakers=Habilitar mejoras para combinadores y altavoces programables.
enable-pumps=Habilitar mejoras para bombas costeras y bombas de fluidos.
enable-furnaces=Habilitar mejoras para hornos.
enable-generators=Habilitar mejoras para motores de vapor, turbinas de vapor y generadores de fusión.
enable-heat-pipes=Habilitar mejoras para tuberías de calor.
enable-inserters=Habilitar mejoras para insertadores.
enable-labs=Habilitar mejoras para laboratorios de investigación.
enable-lamps=Habilitar mejoras para lámparas.
enable-lightning-rods=Habilitar mejoras para pararrayos.
enable-mining-drills=Habilitar mejoras para taladros de minería.
enable-poles=Habilitar mejoras para postes eléctricos y subestaciones.
enable-power-switches=Habilitar mejoras para interruptores de energía.
enable-radar=Habilitar mejoras para estaciones de radar.
radar-growth-level-limit=Limita el crecimiento de calidad del radar para prevenir exploración excesiva del mapa y archivos de guardado inflados.\n\nLos radares con niveles de calidad muy altos pueden causar archivos de guardado grandes (1,200mb+) debido a la exploración excesiva del mapa.\n\n[color=green]Por defecto: legendario[/color]
lightning-attractor-growth-level-limit=Limita el crecimiento de calidad del atractor de rayos para prevenir problemas de rendimiento.\n\nLos atractores de rayos con niveles de calidad muy altos tienen áreas de cobertura significativamente aumentadas, lo que puede causar picos de lag por la noche en Fulgora.\n\n[color=green]Por defecto: legendario[/color]
enable-reactors=Habilitar mejoras para reactores nucleares y de fusión.
enable-rocket-silos=Habilitar mejoras para silos de cohetes.
enable-roboports=Habilitar mejoras para robopuertos.
enable-solar-panels=Habilitar mejoras para paneles solares.
enable-thrusters=Habilitar mejoras para propulsores espaciales. Las naves más rápidas pueden ver sus defensas sobrepasadas.
thruster-growth-level-limit=Permite limitar los propulsores espaciales a los niveles del juego base. Los niveles de calidad modificados pueden hacer que las naves espaciales se muevan mucho más rápido, lo que puede sobrepasar sus defensas.
enable-turrets=Habilitar mejoras para torretas de munición, láser, lanzallamas y de artillería. Las torretas obtienen 'horas de fabricación' al infligir daño.
turret-damage-per-manufacturing-hour=La cantidad de daño que una torreta debe infligir para obtener una hora de fabricación.\n\nPor defecto: 36,000 de daño (calculado a partir de la cantidad de balas perforantes que una máquina ensambladora básica puede producir en una hora).
turrets-contribute-credits=Permitir que las torretas contribuyan a las mejoras de entidades secundarias, como insertadores y postes eléctricos, en la misma superficie. Esto puede acelerar mucho las mejoras al final de la partida con cañones de riel y torretas de rayos.
enable-defense-walls-and-gates=Habilitar mejoras para muros y puertas.
custom-upgrade-limit-a=Nivel máximo de calidad usado por la opción 'Personalizado A' en los límites de abajo. Solo es necesario cuando tienes un mod que agrega niveles de calidad más allá de legendario y quieres limitar hasta qué nivel puede mejorar una entidad. Por ejemplo, si quieres permitir que los colectores de asteroides lleguen al nivel 10. Para usar esta función, establece aquí el nivel máximo, luego ve a la entidad que deseas limitar y selecciona 'Personalizado A' en el menú desplegable. Como referencia, legendario es el nivel 5.
custom-upgrade-limit-b=Nivel máximo de calidad usado por Personalizado B en la configuración de límites de mejora.
custom-upgrade-limit-c=Nivel máximo de calidad usado por Personalizado C en la configuración de límites de mejora.
upgrade-limit-accumulators=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-agricultural-towers=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-assembly-machines=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-beacons=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-boilers=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-combinators-and-speakers=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: combinadores aritméticos, combinadores de decisión, combinadores constantes, altavoces programables.
upgrade-limit-defense-walls-and-gates=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-furnaces=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-generators=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: motores de vapor, turbinas de vapor, generadores de fusión.
upgrade-limit-heat-pipes=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-inserters=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-labs=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-lamps=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-mining-drills=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-poles=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye postes eléctricos y subestaciones.
upgrade-limit-power-switches=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-pumps=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: bombas costeras y bombas de fluidos.
upgrade-limit-reactors=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: reactores nucleares, reactores de fusión.
upgrade-limit-rocket-silos=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-roboports=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-solar-panels=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.
upgrade-limit-turrets=Calidad máxima de mejora para estas entidades. Común deshabilita las mejoras; Personalizado A/B/C usa el nivel personalizado indicado arriba.\n\nIncluye: torretas de munición, torretas láser, lanzallamas, torretas de artillería.
upgrade-limit-asteroid-collectors=Limita los colectores de asteroides a legendario para prevenir problemas que rompan el juego. Los niveles modificados pueden crear demasiados brazos que se mueven demasiado rápido, impidiéndoles agarrar fragmentos de asteroides y causando un gran consumo de UPS.
upgrade-limit-radar=Limita los radares a legendario para evitar que aumente demasiado el tamaño de los archivos de guardado. Las calidades modificadas pueden causar una exploración excesiva del mapa y generar archivos muy grandes (de más de un gigabyte).
upgrade-limit-lightning-rods=Limita los atractores de rayos a legendario para prevenir picos de consumo de UPS. Los atractores de rayos con niveles de calidad modificados tienen áreas de cobertura mucho mayores, lo que puede causar picos de lag por la noche en Fulgora.
upgrade-limit-thrusters=Limita los propulsores espaciales a legendario para prevenir daños inesperados en las plataformas espaciales. Los niveles de calidad modificados pueden hacer que las naves espaciales se muevan mucho más rápido, lo que puede sobrepasar sus defensas.

