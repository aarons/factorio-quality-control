upgrade-limit-boilers=Control de Calidad mejorará estas entidades hasta esta calidad, luego dejará de intentar más mejoras. Establece esto en Común para evitar cualquier intento de mejora. Los valores personalizados usan la configuración de Límite de mejora personalizado A/B/C.
upgrade-limit-combinators-and-speakers=Control de Calidad mejorará estas entidades hasta esta calidad, luego dejará de intentar más mejoras. Establece esto en Común para evitar cualquier intento de mejora. Los valores personalizados usan la configuración de Límite de mejora personalizado A/B/C.\n\nIncluye: combinadores aritméticos, combinadores de decisión, combinadores constantes, altavoces programables.
