upgrade-limit-asteroid-collectors=შეზღუდეთ ასტეროიდების შემგროვებლები ლეგენდარულ დონემდე, თამაშის დამრღვევი პრობლემების თავიდან ასაცილებლად. მოდიფიცირებულმა დონეებმა შეიძლება შექმნას მეტისმეტად ბევრი და სწრაფი მკლავი, რომლებიც ვეღარ დაიჭერს ასტეროიდის ნაჭრებს და UPS-ს ძლიერ დატვირთავს.
upgrade-limit-radar=შეზღუდეთ რადარები ლეგენდარულ დონემდე, შენახვის ფაილის ზედმეტი ზრდის თავიდან ასაცილებლად. მოდიფიცირებულმა ხარისხებმა შეიძლება რუკის მეტისმეტი გამოკვლევა და ძალიან დიდი ფაილები (გიგაბაიტზე მეტი) გამოიწვიოს.
upgrade-limit-lightning-rods=შეზღუდეთ ელვის მიმზიდველები ლეგენდარულ დონემდე, UPS-ის მკვეთრი ვარდნის თავიდან ასაცილებლად. მოდიფიცირებული ხარისხის დონეებზე მათი დაფარვის არე მნიშვნელოვნად იზრდება, რამაც ფულგორაზე ღამით შეიძლება შეფერხებები გამოიწვიოს.
upgrade-limit-thrusters=შეზღუდეთ კოსმოსური ძრავები ლეგენდარულ დონემდე, კოსმოსური პლატფორმის მოულოდნელი დაზიანების თავიდან ასაცილებლად. მოდიფიცირებული ხარისხის დონეებით კოსმოსური გემები შეიძლება მნიშვნელოვნად სწრაფად გადაადგილდეს, რამაც მათი თავდაცვა შეიძლება გადატვირთოს.

