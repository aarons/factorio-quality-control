[mod-setting-description]
manufacturing-hours-for-change=მწარმოებლური საათების რაოდენობა რომელიც საჭიროა ხარისხის ცვლილების მცდელობისთვის.\nმწარმოებლური საათები განისაზღვრება დამზადებული ნივთების რაოდენობაზე რეცეპტის ხანგრძლივობის გამრავლებით.\nმინ. მნიშვნელობა 0.001 საათი (3.6 წამი), მაქს. მნიშვნელობა 1000 საათი.
percentage-chance-of-change=პროცენტული შანსი რომ ხარისხის ცვლილება წარმატებული იქნება.\nმინ. მნიშვნელობა 0.0001%, მაქს. მნიშვნელობა 100% (ყოველთვის შეიცვლება დროის გასვლის შემდეგ)
quality-increase-cost=ეს ზრდის დროს ცვლილების მცდელობებს შორის ხარისხის თითოეულ დონეზე. ეს არის კომპაუნდური ფორმულა. 0%-ზე დაყენება შეინარჩუნებს იგივე დროს მცდელობებს შორის ხარისხის დონის მიუხედავად\n\n[color=green]მაგალითი 3 მწარმოებლური საათით 50% ღირებულებით დონეზე[/color]\n\nნორმალური: 3 საათი\nარაჩვეულებრივი: 4.5 საათი\nიშვიათი: 6.8 საათი\nეპიკური: 10.1 საათი\nლეგენდარული: 15.2 საათი\nმოდიფიცირებული ხარისხი 10 დონე: 173 საათი
quality-chance-accumulation-rate=აკონტროლებს რამდენადაც იზრდება შანსი თითოეული წარუმატებელი მცდელობის შემდეგ.\n\n[color=white]არცერთი (ნაგულისხმევი):[/color] დაგროვება არ არის - შანსი რჩება მუდმივი.\n\n[color=white]დაბალი (20%):[/color] შანსი იზრდება ბაზისური მიზნის 20%-ით თითოეული წარუმატებელობის დროს.\n\n[color=white]საშუალო (50%):[/color] შანსი იზრდება ბაზისური მიზნის 50%-ით თითოეული წარუმატებელობის დროს.\n\n[color=white]მაღალი (100%):[/color] შანსი იზრდება ბაზისური მიზნის 100%-ით თითოეული წარუმატებელობის დროს.\n\n[color=yellow]მაგალითი 1% ბაზისური შანსით:[/color]\n\n[color=white]დაბალი:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]მაღალი:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nყველა დაგროვების პარამეტრი საბოლოოდ იძლევა ხარისხის ცვლილებების გარანტიას - უფრო მაღალი პარამეტრები უბრალოდ სწრაფად აღწევს 100% შანსს
accumulate-at-max-quality=მაქსიმალური ხარისხის ასამბლერები კვლავ წვლილს შეიტანენ:\nთუ ჩართულია, მაქსიმალური ხარისხის ასამბლერები და ღუმელები კვლავ თვალყურს ადევნებენ მწარმოებლურ საათებს და აწარმოებენ განახლების კრედიტებს მეორადი ობიექტებისთვის (როგორიცაა ინსერტერები, მაიაკები და ა.შ.), მიუხედავად იმისა რომ ისინი თვითონ ვეღარ უნარშეუმატებენ.\n\n[color=green]ჩართული (ნაგულისხმევი):[/color] მაქს ხარისხის ასამბლერები კვლავ აწარმოებენ განახლების კრედიტებს მეორადი ობიექტებისთვის. ეს შეიძლება უზრუნველყოს სტაბილური პროგრესი მეორადი ობიექტებისთვის თამაშის ბოლო ეტაპზე.\n\n[color=red]გამორთული:[/color] მხოლოდ დაბალი ხარისხის ასამბლერები და ღუმელები რომლებსაც კვლავ შეუძლიათ განახლება აწარმოებენ კრედიტებს, მაგრამ ისინი წარმოიქმნებიან როგორც თანაფარდობა მეორადი ობიექტების მიმართ რომლებსაც კვლავ უნდათ განახლება. ექსტრემალურ შემთხვევაში, ეს ნიშნავს რომ ერთი დაბალი ხარისხის ასამბლერს შეუძლია მთელი ქარხნის მეორადი ობიექტების წინსვლა.
change-modules-with-entity=ეს აკონტროლებს თუ არა მოდულები მანქანებში განიცდიან ხარისხის ცვლილებას.\n\n[color=white]გამორთული (ნაგულისხმევი):[/color] მოდულები არ განიცდიან ზემოქმედებას მასპინძელი მანქანის ხარისხის ცვლილებისას.\n\n[color=white]ჩართული:[/color] მოდულების ხარისხი იცვლება ერთი დონით მასპინძლის ცვლილებისას. ისინი არ გადააჭარბებენ მასპინძლის ხარისხის დონეს.\n\n[color=white]დამატებით ჩართული:[/color] როგორც ჩართული, მაგრამ მოდულები განახლდებიან მათი მასპინძელი მანქანის ხარისხს შეესაბამება ყველა ხარისხის ცვლილების დროს.
batch-entities-per-tick=ობიექტების რაოდენობა რომ დამუშავდეს თითოეულ ტიკზე პროდუქტიულობის სპაიკების თავიდან ასაცილებლად.\nმინ. მნიშვნელობა 1, მაქს. მნიშვნელობა 1000.\nუფრო მაღალი მნიშვნელობები შეიძლება გამოიწვიონ ლაგის სპაიკები მაგრამ უფრო სწრაფად დაამუშავებენ ობიექტებს.
batch-ticks-between-processing=ტიკების რაოდენობა რომ ველოდოთ ბეჩის დამუშავების ციკლებს შორის.\nმინ. მნიშვნელობა 1 ტიკი, მაქს. მნიშვნელობა 6000 ტიკი (~2.5 წუთი).\nუფრო დაბალი მნიშვნელობები უფრო ხშირად ამუშავებენ მაგრამ შეიძლება გავლენა მოახდინონ პროდუქტიულობაზე.
quality-change-aggregate-alerts-enabled=აჩვენოს კონსოლის შეტყობინებები რომლებიც ასაბამენ ყველა ხარისხის ცვლილებას (ნაჩვენები ყოველ 5 წუთში ერთხელ). მაგალითი: "3 ასამბლაჟის მანქანა განახლდა, 2 ინსერტერი განახლდა"
quality-change-entity-alerts-enabled=აჩვენოს რუქის პინგ შეტყობინებები ინდივიდუალურ ობიექტებზე მათი ხარისხის ცვლილებისას. დააკლიკეთ შეტყობინებაზე განახლებული ობიექტის სანახავად.
quality_control_skip_hidden_qualities=ხარისხის კონტროლი გამოტოვებს დამალულ ხარისხებს (მაგ., ბრჭყვიალა ვარიანტები) განახლებისას. ობიექტები არასოდეს გახდებიან ბრჭყვიალა ხარისხის კონტროლის საშუალებით - მოთამაშეებმა უნდა მიიღონ ისინი ჩვეულებრივი გზით. ეს პარამეტრი მხოლოდ მაშინ მოქმედებს როდესაც გაქვთ დაინსტალირებული Shiny Mechanics ხარისხის მოდი.
quality_control_hidden_qualities_sticky=ობიექტები დამალული ხარისხებით (მაგ., ბრჭყვიალა) არ განახლდებიან შემდგომში, შეინარჩუნებენ მათ უნიკალურ სარგებელს. ეს პარამეტრი მხოლოდ მაშინ მოქმედებს როდესაც გაქვთ დაინსტალირებული Shiny Mechanics ხარისხის მოდი.
enable-accumulators=ჩაართოს ხარისხის ცვლილებები აკუმულატორებისთვის.
enable-agricultural-towers=ჩაართოს ხარისხის ცვლილებები სასოფლო-სამეურნეო კოშკებისთვის.
enable-assembly-machines=ჩაართოს ხარისხის ცვლილებები ასამბლაჟის მანქანებისთვის.
enable-asteroid-collectors=ჩაართოს ხარისხის ცვლილებები ასტეროიდების შემგროვებლებისთვის.
asteroid-collector-growth-level-limit=ლიმიტირებს ასტეროიდების შემგროვებლის ხარისხის ზრდას ვანილის მნიშვნელობებამდე თამაშის დარღვევის პრობლემების თავიდან ასაცილებლად.\n\nმოდიფიცირებული ხარისხის დონეებით ასტეროიდების შემგროვებლებს შეიძლება ჰქონდეთ ძალიან ბევრი მკლავი, რომლებიც ძალიან სწრაფად მოძრაობენ, ხდებიან უუნარო ასტეროიდის ნაჭრების დასაჭერად და ქმნიან UPS-ის დიდ დატვირთვას.\n\n[color=green]ნაგულისხმევი: ლეგენდარული[/color]
enable-beacons=ჩაართოს ხარისხის ცვლილებები მაიაკებისთვის.
enable-boilers=ჩაართოს ხარისხის ცვლილებები ქვაბებისთვის.
enable-combinators-and-speakers=ჩაართოს ხარისხის ცვლილებები კომბინატორებისა და სპიკერებისთვის.\n\nმოიცავს: არითმეტიკულ კომბინატორებს, გადაწყვეტილების კომბინატორებს, მუდმივ კომბინატორებს, პროგრამირებად სპიკერებს.
enable-pumps=ჩაართოს ხარისხის ცვლილებები ტუმბოებისთვის (მოიცავს ნაპირის ტუმბოებსა და სითხის ტუმბოებს).
enable-furnaces=ჩაართოს ხარისხის ცვლილებები ღუმელებისთვის.
enable-generators=ჩაართოს ხარისხის ცვლილებები გენერატორებისთვის (ორთქლის ძრავები, ორთქლის ტურბინები, სინთეზის გენერატორები).
enable-heat-pipes=ჩაართოს ხარისხის ცვლილებები სითბური მილებისთვის.
enable-inserters=ჩაართოს ხარისხის ცვლილებები ინსერტერებისთვის.
enable-labs=ჩაართოს ხარისხის ცვლილებები კვლევის ლაბორატორიებისთვის.
enable-lamps=ჩაართოს ხარისხის ცვლილებები ნათურებისთვის.
enable-lightning-rods=ჩაართოს ხარისხის ცვლილებები ელვის ღუდებისთვის.
enable-mining-drills=ჩაართოს ხარისხის ცვლილებები ყველა სამთო ბურღისთვის.
enable-poles=ჩაართოს ხარისხის ცვლილებები ყველა ელექტრო სვეტისთვის (მოიცავს დიდ ენერგიის სვეტებსა და ქვესადგურებს).
enable-power-switches=ჩაართოს ხარისხის ცვლილებები ენერგიის გადამრთველებისთვის.
enable-radar=ჩაართოს ხარისხის ცვლილებები რადარის სადგურებისთვის.
radar-growth-level-limit=ლიმიტირებს რადარის ხარისხის ზრდას რუქის ზედმეტი გამოკვლევისა და შენახვის ფაილის დაზიანების თავიდან ასაცილებლად.\n\nრადარები ძალიან მაღალი ხარისხის დონეებით შეუძლია გამოიწვიოს დიდი შენახვის ფაილები (1,200mb+) რუქის ზედმეტი გამოკვლევის გამო.\n\n[color=green]ნაგულისხმევი: ლეგენდარული[/color]
lightning-attractor-growth-level-limit=ლიმიტირებს ელვის მიმზიდველის ხარისხის ზრდას პროდუქტიულობის პრობლემების თავიდან ასაცილებლად.\n\nელვის მიმზიდველები ძალიან მაღალი ხარისხის დონეებით მნიშვნელოვნად გაზრდილი მოქმედების არეები აქვთ, რამაც შეიძლება გამოიწვიოს ლაგის სპაიკები ღამით ფულგორაზე.\n\n[color=green]ნაგულისხმევი: ლეგენდარული[/color]
enable-reactors=ჩაართოს ხარისხის ცვლილებები რეაქტორებისთვის (ბირთვული რეაქტორები, სინთეზის რეაქტორები).
enable-rocket-silos=ჩაართოს ხარისხის ცვლილებები რაკეტის სილოსებისთვის.
enable-roboports=ჩაართოს ხარისხის ცვლილებები რობოპორტებისთვის.
enable-solar-panels=ჩაართოს ხარისხის ცვლილებები მზის პანელებისთვის.
enable-thrusters=ჩაართოს ხარისხის ცვლილებები კოსმოსური ძრავებისთვის. ნაგულისხმევად გამორთულია, რადგან კოსმოსური გემის სიჩქარის მოულოდნელი ცვლილება შეიძლება გამოიწვიოს თავდაცვის გადატვირთვა.
thruster-growth-level-limit=ლიმიტირებს კოსმოსური ძრავის ხარისხის ზრდას ვანილის დონეებამდე თავდაცვის პრობლემების თავიდან ასაცილებლად.\n\nმოდიფიცირებული ხარისხის დონეები კოსმოსურ გემებს საშუალებას აძლევს მნიშვნელოვნად სწრაფად გადაადგილდნენ, რამაც შეიძლება გადატვირთოს მათი თავდაცვა.\n\n[color=green]ნაგულისხმევი: ლეგენდარული[/color]
enable-turrets=ჩაართოს ხარისხის ცვლილებები ტურეტებისთვის.\n\nტურეტები არიან პირველადი ობიექტები, რომლებიც წარმოქმნიან განახლების კრედიტებს დაგროვილი ზიანის საფუძველზე.\n\nმოიცავს: საბრძოლო ტურეტებს, ლაზერული ტურეტებს, ალის ფრქვევანებს, არტილერიის ტურეტებს.
turret-damage-per-manufacturing-hour=ზიანის რაოდენობა, რომელიც ტურეტმა უნდა მიაყენოს ერთი მწარმოებლური საათის ტოლი.\n\nნაგულისხმევი: 36,000 ზიანი (წარმოებული გამჭოლი ვაზნებიდან: 450 მაგაზინი/საათი × 80 ზიანი/მაგაზინი).\n\nდაბალი მნიშვნელობები ტურეტებს სწრაფად კრედიტების გამომუშავების საშუალებას იძლევა. უფრო მაღალი მნიშვნელობები ანელებს კრედიტების გამომუშავებას.
enable-defense-walls-and-gates=ჩაართოს ხარისხის ცვლილებები კედლებისა და კარიბჭეებისთვის.\n\nმოიცავს: კედლებს, კარიბჭეებს.
custom-upgrade-limit-a=გამოიყენეთ ეს ობიექტებისთვის მოდიფიცირებული ხარისხების მორგებული ლიმიტების დასაწესებლად. საჭიროა მხოლოდ მაშინ, თუ გაქვთ მოდი, რომელიც ამატებს ხარისხის დონეებს ლეგენდარულის მიღმა და გსურთ შეზღუდოთ, რამდენად განახლდება ობიექტი. ამ ფუნქციის გამოსაყენებლად დააყენეთ მაქსიმალური დონე აქ, შემდეგ ჩადით იმ ობიექტთან, რომლის შეზღუდვაც გსურთ და ჩამოსაშლელ სიაში აირჩიეთ „მორგებული A“. საორიენტაციოდ, ლეგენდარული არის დონე 5 (ჩვეულებრივი = 1, უჩვეულო = 2, იშვიათი = 3, ეპიკური = 4, ლეგენდარული = 5...).
custom-upgrade-limit-b=გამოიყენეთ ეს ობიექტებისთვის მოდიფიცირებული ხარისხების მორგებული ლიმიტების დასაწესებლად. საჭიროა მხოლოდ მაშინ, თუ გაქვთ მოდი, რომელიც ამატებს ხარისხის დონეებს ლეგენდარულის მიღმა და გსურთ შეზღუდოთ, რამდენად განახლდება ობიექტი. ამ ფუნქციის გამოსაყენებლად დააყენეთ მაქსიმალური დონე აქ, შემდეგ ჩადით იმ ობიექტთან, რომლის შეზღუდვაც გსურთ და ჩამოსაშლელ სიაში აირჩიეთ „მორგებული B“. საორიენტაციოდ, ლეგენდარული არის დონე 5 (ჩვეულებრივი = 1, უჩვეულო = 2, იშვიათი = 3, ეპიკური = 4, ლეგენდარული = 5...).
custom-upgrade-limit-c=გამოიყენეთ ეს ობიექტებისთვის მოდიფიცირებული ხარისხების მორგებული ლიმიტების დასაწესებლად. საჭიროა მხოლოდ მაშინ, თუ გაქვთ მოდი, რომელიც ამატებს ხარისხის დონეებს ლეგენდარულის მიღმა და გსურთ შეზღუდოთ, რამდენად განახლდება ობიექტი. ამ ფუნქციის გამოსაყენებლად დააყენეთ მაქსიმალური დონე აქ, შემდეგ ჩადით იმ ობიექტთან, რომლის შეზღუდვაც გსურთ და ჩამოსაშლელ სიაში აირჩიეთ „მორგებული C“. საორიენტაციოდ, ლეგენდარული არის დონე 5 (ჩვეულებრივი = 1, უჩვეულო = 2, იშვიათი = 3, ეპიკური = 4, ლეგენდარული = 5...).
