[mod-setting-description]
manufacturing-hours-for-change=მწარმოებლური საათების რაოდენობა რომელიც საჭიროა ხარისხის ცვლილების მცდელობისთვის.\nმწარმოებლური საათები გროვდება მხოლოდ მაშინ, როცა მანქანა აქტიურად მუშაობს. თუ ის უმოქმედოდ დგას, პროგრესი არ განხორციელდება.\nმინ. მნიშვნელობა 0.001 საათი (3.6 წამი), მაქს. მნიშვნელობა 1000 საათი.
crafting-speed-affects-progression=[color=green]ჩართული:[/color] დამზადების სიჩქარე და პროდუქტიულობა ზრდის დაგროვებულ მწარმოებლურ საათებს. სიჩქარე 4 და 50% პროდუქტიულობა ექვსჯერ მეტ საათს აგროვებს, ვიდრე სიჩქარე 1 პროდუქტიულობის ბონუსის გარეშე.\n\n[color=red]გამორთული:[/color] დამზადების სიჩქარე გავლენას არ ახდენს პროგრესზე.
percentage-chance-of-change=განახლების მცდელობის წარმატების შანსი.
quality-increase-cost=ხარისხის თითოეულ დონეზე საჭირო მწარმოებლური საათების ზრდა. ზრდა კუმულაციურია; 0% მოთხოვნას ყველა დონეზე უცვლელს ტოვებს.\n\n50%-ის შემთხვევაში 3-საათიანი მოთხოვნა უჩვეულო ხარისხზე ხდება 4.5 საათი, ხოლო იშვიათზე — 6.75 საათი.
quality-chance-accumulation-rate=წარუმატებელი მცდელობის შემდეგ განახლების შანსის გაზრდა საბაზისო შანსის პროცენტული წილით.\n\n[color=white]არცერთი:[/color] შანსი მუდმივი რჩება.\n[color=white]დაბალი:[/color] ემატება საბაზისო შანსის 20%.\n[color=white]საშუალო:[/color] ემატება საბაზისო შანსის 50%.\n[color=white]მაღალი:[/color] ემატება საბაზისო შანსის 100%.\n\n1% საბაზისო შანსით დაბალი იძლევა 1% → 1.2% → 1.4%... ხოლო მაღალი — 1% → 2% → 3%...
secondary-progression-rate=პროგრესის სიჩქარე ობიექტებისთვის, რომლებსაც საკუთარი სამუშაოს გაზომვა არ შეუძლიათ, მაგალითად ჩამტვირთველებისთვის, ბოძებისა და შუქურებისთვის.\n\n100% შეესაბამება იმავე ზედაპირზე ძირითადი ობიექტების მიერ დაგროვებულ საშუალო მწარმოებლურ საათებს. უფრო მაღალი მნიშვნელობები აჩქარებს პროგრესს; 0% აჩერებს მას.
change-modules-with-entity=[color=white]გამორთული:[/color] მოდულები არ განახლდება.\n\n[color=white]ჩართული:[/color] მანქანის განახლებისას მოდულები ერთი დონით განახლდება, მანქანის ხარისხამდე.\n\n[color=white]დამატებით ჩართული:[/color] მოდულები განახლდება მანქანის ახალი ხარისხის შესაბამისად.\n\n[color=white]დამოუკიდებელი:[/color] მოდულები მეორადი პროგრესის საშუალებით იღებს განახლების საკუთარ მცდელობებს და შეუძლია გადააჭარბოს მანქანის ხარისხის ლიმიტს. მანქანის ლიმიტის ჩვეულებრივზე დაყენება მოდულების განახლებასაც გამორთავს.
batch-entities-per-tick=ერთ პარტიაში დასამუშავებელი ობიექტების რაოდენობა. დიდი პარტიები განახლებებს უფრო სწრაფად ამუშავებს, მაგრამ შეიძლება შეფერხება გამოიწვიოს. დამოუკიდებელ რეჟიმში მოდულის სლოტებიც ითვლება.
batch-ticks-between-processing=ტიკების რაოდენობა პარტიების დამუშავებას შორის. მოკლე ინტერვალები განახლებებს უფრო ხშირად ამუშავებს, მაგრამ შეიძლება წარმადობა შეამციროს.
quality-change-aggregate-alerts-enabled=განახლებების შეჯამების ჩვენება ყოველ ხუთ წუთში.
quality-change-entity-alerts-enabled=განახლების ადგილებზე რუკის შეტყობინების ხატულების ჩვენება.
quality-change-chat-enabled=განახლების შეტყობინებების ჩვენება ობიექტის ან მოდულის ხატულებით, ხარისხის ხატულებით და ცისარტყელის შემთხვევითი ფერებით შეღებილი ასოებით.
quality-change-gps-enabled=თითოეული განახლებისთვის დასაწკაპუნებელი მდებარეობის ბმულის ჩვენება და Factorio-ს GPS რუკის პინგის გაშვება. მდებარეობაზე დასაბრუნებლად დააწკაპუნეთ ბმულზე. თუ ფერადი განახლების ჩატი ჩართულია, ბმული მას დაემატება; წინააღმდეგ შემთხვევაში მხოლოდ ბმული გამოჩნდება. ჩაშენებულ GPS პინგს ჩატის ბმული სჭირდება.
quality-change-floating-text-enabled=ახალი ხარისხის ფერში ზემოთ მოძრავი განახლების ტექსტის ჩვენება.
quality-change-halo-enabled=განახლების ადგილებზე ახალი ხარისხის ფერში გაფართოებადი ჰალოს ჩვენება.
quality-change-rainbow-enabled=განახლების ადგილებზე გაფართოებადი ცისარტყელის რგოლების ჩვენება.
quality-change-badge-enabled=ახალი ხარისხის ხატულის ჩვენება, რომელიც 4.5 წამის განმავლობაში იზრდება და მაღლა იწევს, გაქრობამდე კი უწყვეტად ბრუნავს.
quality-change-bubbles-enabled=განახლების ადგილებზე ახალი ხარისხის პატარა ხატულების ნაკადის გამოშვება, რომლებიც ბუშტებივით მაღლა მიიწევს.
quality-change-sound-enabled=არჩეული ხმის დაკვრა იმ ზედაპირზე მომხდარი განახლებებისთვის, რომელსაც ამჟამად უყურებთ, დისტანციური ხედის ჩათვლით.
quality-change-sound=აირჩიეთ შეტყობინების ეფექტი, დინამიკის განგაში, დასარტყამი ხმა ან მუსიკალური ინსტრუმენტი. ინსტრუმენტები იყენებს განახლების ინსტრუმენტის ნოტს / ძირითად ტონს და განახლების ნოტების ქცევას. ხმა იკვრება მხოლოდ მაშინ, როცა განახლების ხმა ჩართულია, იმ ზედაპირზე მომხდარი განახლებებისთვის, რომელსაც ამჟამად უყურებთ.
quality-change-sound-note=ფიქსირებული ნოტი ან მუსიკალური პატერნების ძირითადი ტონი (ტონალობა და საწყისი რეგისტრი). არ გამოიყენება განგაშებისთვის, დასარტყამებისთვის, ეფექტებისთვის და სრულიად შემთხვევით რეჟიმში.\nნოტები F-დან ნახევარტონებით აღმასვლით მიდის: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; შემდეგი ოქტავისთვის დაამატეთ 12. ნაგულისხმევი: 20 (C).\nფორტეპიანოს აქვს 48 ნოტი; სხვა ინსტრუმენტებს — 36. ფიქსირებულ რეჟიმში ნოტი უმაღლესი ხელმისაწვდომი ნოტით იზღუდება. საჭიროებისას მუსიკალური პატერნები მთელი ოქტავებით დაბლა გადადის, ტონალობის შენარჩუნებით. ერთი და იგივე პარამეტრები თითოეული ინსტრუმენტის საკუთარ რეგისტრში ეკვივალენტურ პატერნებს ქმნის.
quality-change-sound-mode=თითო ხმოვან განახლებაზე ერთი ნოტი, თითოეული მოთამაშისთვის ცალკე პატერნით. ფიქსირებული ინარჩუნებს არჩეულ ნოტს; მუსიკალური ხეტიალი გამაში ერთი ან ორი საფეხურით გადაადგილდება; ქარის ზარები შემთხვევით მაჟორულ პენტატონურ ნოტებს ირჩევს; კიბე განმეორებით ადის და ჩამოდის; შემთხვევითი გამაში არჩეული გამიდან და დიაპაზონიდან ნებისმიერ ნოტს ირჩევს; სრულიად შემთხვევითი ინსტრუმენტის მთელ დიაპაზონს იყენებს.\nხეტიალი და კიბე ძირითადი ტონიდან იწყება და გრძელდება სიჩუმის პერიოდებისა და შენახვის/ჩატვირთვის შემდეგ. დაყოვნებული ნოტები რიგში არ დგება. მოქმედებს მხოლოდ მუსიკალურ ინსტრუმენტებზე.
quality-change-sound-scale=განახლების ინსტრუმენტის ნოტის / ძირითადი ტონის მიმართ განსაზღვრული გამა, რომელსაც იყენებს მუსიკალური ხეტიალი, კიბე და შემთხვევითი გამაში. ქრომატული ყველა ნახევარტონს უშვებს. ქარის ზარები ყოველთვის მაჟორულ პენტატონიკას იყენებს; ფიქსირებული და სრულიად შემთხვევითი ამ პარამეტრს უგულებელყოფს.
quality-change-sound-range=ძირითადი ტონიდან დაწყებული ერთი ან ორი ოქტავა, საჭიროებისას ინსტრუმენტში მოსათავსებლად მთელი ოქტავებით დაბლა გადატანილი; ან ინსტრუმენტის სრული დიაპაზონი. მოქმედებს მუსიკალურ ხეტიალზე, ქარის ზარებზე, კიბეზე და შემთხვევითზე გამაში. ფიქსირებული და სრულიად შემთხვევითი ამ პარამეტრს უგულებელყოფს.
quality_control_skip_hidden_qualities=განახლებისას დამალული ხარისხების (მაგალითად, ბრჭყვიალა ვარიანტების) გამოტოვება. ეს პარამეტრი მოქმედებს მხოლოდ მაშინ, თუ დაინსტალირებული გაქვთ Shiny Mechanics-ის მსგავსი მოდი.
quality_control_hidden_qualities_sticky==დამალული ხარისხის მქონე ობიექტები (მაგ., ბრჭყვიალა) შემდგომ აღარ განახლდება და შეინარჩუნებს უნიკალურ სარგებელს. ეს პარამეტრი მოქმედებს მხოლოდ მაშინ, თუ დაინსტალირებული გაქვთ Shiny Mechanics-ის მსგავსი მოდი.
enable-accumulators=ჩართოს აკუმულატორების განახლება.
enable-agricultural-towers=ჩართოს სასოფლო-სამეურნეო კოშკების განახლება.
enable-assembly-machines=ჩართოს ასაწყობი მანქანების განახლება.
enable-asteroid-collectors=ჩართოს ასტეროიდების შემგროვებლების განახლება.
asteroid-collector-growth-level-limit=ლიმიტირებს ასტეროიდების შემგროვებლის ხარისხის ზრდას ვანილის მნიშვნელობებამდე თამაშის დარღვევის პრობლემების თავიდან ასაცილებლად.\n\nმოდიფიცირებული ხარისხის დონეებით ასტეროიდების შემგროვებლებს შეიძლება ჰქონდეთ ძალიან ბევრი მკლავი, რომლებიც ძალიან სწრაფად მოძრაობენ, ხდებიან უუნარო ასტეროიდის ნაჭრების დასაჭერად და ქმნიან UPS-ის დიდ დატვირთვას.\n\n[color=green]ნაგულისხმევი: ლეგენდარული[/color]
enable-beacons=ჩართოს შუქურების განახლება.
enable-boilers=ჩართოს ქვაბების განახლება.
enable-combinators-and-speakers=ჩართოს კომბინატორებისა და პროგრამირებადი დინამიკების განახლება.
enable-pumps=ჩართოს ნაპირის ტუმბოებისა და სითხის ტუმბოების განახლება.
enable-furnaces=ჩართოს ღუმელების განახლება.
enable-generators=ჩართოს ორთქლის ძრავების, ორთქლის ტურბინებისა და სინთეზის გენერატორების განახლება.
enable-heat-pipes=ჩართოს სითბური მილების განახლება.
enable-inserters=ჩართოს ჩამტვირთველების განახლება.
enable-labs=ჩართოს კვლევის ლაბორატორიების განახლება.
enable-lamps=ჩართოს ნათურების განახლება.
enable-lightning-rods=ჩართოს ელვის მიმზიდველების განახლება.
enable-mining-drills=ჩართოს სამთო ბურღების განახლება.
enable-poles=ჩართოს ელექტროსვეტებისა და ქვესადგურების განახლება.
enable-power-switches=ჩართოს ენერგიის გადამრთველების განახლება.
enable-radar=ჩართოს რადარის სადგურების განახლება.
radar-growth-level-limit=ლიმიტირებს რადარის ხარისხის ზრდას რუქის ზედმეტი გამოკვლევისა და შენახვის ფაილის დაზიანების თავიდან ასაცილებლად.\n\nრადარები ძალიან მაღალი ხარისხის დონეებით შეუძლია გამოიწვიოს დიდი შენახვის ფაილები (1,200mb+) რუქის ზედმეტი გამოკვლევის გამო.\n\n[color=green]ნაგულისხმევი: ლეგენდარული[/color]
lightning-attractor-growth-level-limit=ლიმიტირებს ელვის მიმზიდველის ხარისხის ზრდას პროდუქტიულობის პრობლემების თავიდან ასაცილებლად.\n\nელვის მიმზიდველები ძალიან მაღალი ხარისხის დონეებით მნიშვნელოვნად გაზრდილი მოქმედების არეები აქვთ, რამაც შეიძლება გამოიწვიოს ლაგის სპაიკები ღამით ფულგორაზე.\n\n[color=green]ნაგულისხმევი: ლეგენდარული[/color]
enable-reactors=ჩართოს ბირთვული და სინთეზის რეაქტორების განახლება.
enable-rocket-silos=ჩართოს რაკეტის სილოსების განახლება.
enable-roboports=ჩართოს რობოპორტების განახლება.
enable-solar-panels=ჩართოს მზის პანელების განახლება.
enable-thrusters=ჩართოს კოსმოსური ძრავების განახლება. უფრო სწრაფმა გემებმა შეიძლება მათი თავდაცვა გადატვირთოს.
thruster-growth-level-limit=სურვილისამებრ შეზღუდეთ კოსმოსური ძრავები ვანილის დონეებით. მოდიფიცირებული ხარისხის დონეებით კოსმოსური გემები შეიძლება მნიშვნელოვნად სწრაფად გადაადგილდეს, რამაც მათი თავდაცვა შეიძლება გადატვირთოს.
enable-turrets=ჩართოს საბრძოლო მასალის, ლაზერული, ცეცხლმტყორცნი და საარტილერიო კოშკურების განახლება. კოშკურები „მწარმოებლურ საათებს“ ზიანის მიყენებით აგროვებს.
turret-damage-per-manufacturing-hour=ზიანის რაოდენობა, რომელიც კოშკურამ ერთი მწარმოებლური საათის მისაღებად უნდა მიაყენოს.\n\nნაგულისხმევი: 36,000 ზიანი (გამოთვლილია საბაზისო დონის კოშკურის მიერ გამჭოლი ვაზნებით ერთი საათის უწყვეტი სროლის საფუძველზე).
turrets-contribute-credits=კოშკურებმა ხელი შეუწყონ იმავე ზედაპირზე მეორადი ობიექტების, მაგალითად ჩამტვირთველებისა და ელექტროსვეტების განახლებას. თამაშის გვიან ეტაპზე რელსური ქვემეხებითა და ელვის კოშკურებით ამან შეიძლება განახლებები მნიშვნელოვნად დააჩქაროს.
enable-defense-walls-and-gates=ჩართოს კედლებისა და კარიბჭეების განახლება.
custom-upgrade-limit-a=ხარისხის მაქსიმალური დონე, რომელსაც ქვემოთ მოცემული ლიმიტების პარამეტრი „მორგებული A“ იყენებს. საჭიროა მხოლოდ მაშინ, თუ გაქვთ მოდი, რომელიც ლეგენდარულზე მაღალ ხარისხის დონეებს ამატებს და გსურთ შეზღუდოთ ობიექტის განახლების დონე. მაგალითად, თუ გსურთ ასტეროიდების შემგროვებლებმა მე-10 დონემდე მიაღწიონ. დააყენეთ მაქსიმალური დონე აქ, შემდეგ ჩადით სასურველ ობიექტთან და ჩამოსაშლელ სიაში აირჩიეთ „მორგებული A“. საორიენტაციოდ, ლეგენდარული მე-5 დონეა.
custom-upgrade-limit-b=ხარისხის მაქსიმალური დონე, რომელსაც განახლების ლიმიტებში „მორგებული B“ იყენებს.
custom-upgrade-limit-c=ხარისხის მაქსიმალური დონე, რომელსაც განახლების ლიმიტებში „მორგებული C“ იყენებს.
upgrade-limit-accumulators=ამ ობიექტების განახლების მაქსიმალური ხარისხი. „ჩვეულებრივი“ განახლებებს გამორთავს; „მორგებული A/B/C“ ზემოთ მითითებულ მორგებულ დონეს გამოიყენებს.
