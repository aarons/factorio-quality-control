upgrade-limit-rocket-silos=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
upgrade-limit-roboports=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
upgrade-limit-solar-panels=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
upgrade-limit-turrets=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。\n\n包括：弹药炮塔、激光炮塔、喷火器、火炮炮塔。
upgrade-limit-asteroid-collectors=限制小行星收集器品质增长到原版数值以防止破坏游戏的问题。\n\n具有模组品质等级的小行星收集器可能拥有过多手臂且移动过快，导致无法抓取小行星块并造成大量UPS消耗。\n\n[color=green]默认：传奇[/color]
upgrade-limit-radar=限制雷达品质增长以防止过度地图探索和存档文件膨胀。\n\n品质等级很高的雷达会因过度探索地图而导致存档文件过大（1200mb+）。\n\n[color=green]默认：传奇[/color]
upgrade-limit-lightning-rods=限制闪电吸引器品质增长以防止性能问题。\n\n品质等级很高的闪电吸引器覆盖范围显著增加，可能在弗尔戈拉夜间造成延迟峰值。\n\n[color=green]默认：传奇[/color]
upgrade-limit-thrusters=限制太空推进器品质增长到原版等级以防止防御问题。\n\n模组品质等级会使飞船移动速度显著加快，可能压垮其防御系统。\n\n[color=green]默认：传奇[/color]

