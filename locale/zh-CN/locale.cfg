[mod-setting-description]
manufacturing-hours-for-change=尝试品质改变所需的制造小时数。\n只有当机器正在积极工作时，才会累积制造小时数。如果机器处于闲置状态，则不会有进度。\n最小值0.001小时（3.6秒），最大值1000小时。
crafting-speed-affects-progression=[color=green]启用：[/color] 制造速度和生产力会增加获得的制造小时数。速度为4、生产力为50%时，获得的制造小时数是速度为1且没有生产力加成时的六倍。\n\n[color=red]禁用：[/color] 制造速度不影响进度。
percentage-chance-of-change=升级尝试成功的概率。
quality-increase-cost=每个品质等级所需制造小时数的增长幅度。增长会复合计算；设为0%时各等级的要求保持不变。\n\n设为50%时，基础要求为3小时，罕见品质需要4.5小时，稀有品质需要6.75小时。
quality-chance-accumulation-rate=每次尝试失败后，按基础概率的指定百分比增加升级概率。\n\n[color=white]无：[/color] 概率保持不变。\n[color=white]低：[/color] 增加基础概率的20%。\n[color=white]中：[/color] 增加基础概率的50%。\n[color=white]高：[/color] 增加基础概率的100%。\n\n基础概率为1%时，低档为1% → 1.2% → 1.4%...，高档为1% → 2% → 3%...
secondary-progression-rate=无法衡量自身工作量的实体的进度速度，例如机械臂、电线杆和信标。\n\n100%相当于同一地表上主要实体获得的平均制造小时数。更高的值会加快进度；0%会暂停进度。
change-modules-with-entity=[color=white]禁用：[/color] 模块不会升级。\n\n[color=white]启用：[/color] 宿主机器升级时，模块提升一个等级，最高不超过机器品质。\n\n[color=white]额外启用：[/color] 模块升级至与宿主机器的新品质相同。\n\n[color=white]独立：[/color] 模块通过次级进度获得自己的升级尝试，可以超过宿主机器的品质限制。将机器限制设为普通也会禁用模块升级。
batch-entities-per-tick=每批处理的实体数量。较大的批次处理升级更快，但可能造成卡顿。独立模式下模块槽位也计入数量。
batch-ticks-between-processing=批处理之间的游戏刻数。较短的间隔会更频繁地处理升级，但可能降低性能。
quality-change-aggregate-alerts-enabled=每5分钟显示一次升级汇总。
quality-change-entity-alerts-enabled=在升级位置显示地图警报图标。
quality-change-chat-enabled=显示包含实体或模块图标、品质图标和彩虹随机颜色文字的升级消息。
quality-change-gps-enabled=为每次升级显示可点击的位置链接，并触发Factorio的GPS地图标记。点击链接可重新查看该位置。启用彩色升级聊天时，链接会添加到聊天消息中；否则只显示链接。原生GPS标记需要聊天链接。
quality-change-floating-text-enabled=以新品质的颜色显示向上飘动的升级文字。
quality-change-halo-enabled=在升级位置显示以新品质颜色扩散的光环。
quality-change-rainbow-enabled=在升级位置显示扩散的彩虹光环。
quality-change-badge-enabled=显示新品质的图标，使其在4.5秒内放大、上升，并在淡出过程中持续旋转。
quality-change-bubbles-enabled=在升级位置释放一连串新品质的小图标，像气泡一样向上飘动。
quality-change-sound-enabled=在当前查看的地表上发生升级时播放所选声音，包括远程视图。
quality-change-sound=选择通知音效、扬声器警报、鼓声或乐器。乐器使用“升级乐器音符 / 根音”和“升级音符行为”设置。仅在启用升级声音时，为当前查看的地表上的升级播放声音。
quality-change-sound-note=固定音符，或音乐模式的根音（调性和起始音区）。警报、鼓声、音效和完全随机模式会忽略此设置。\n音符从F起按半音递升：1=F，3=G，5=A，7=B，8=C，10=D，12=E；加12进入下一个八度。默认值：20（C）。\n钢琴有48个音符，其他乐器有36个。固定模式会将音符限制在可用的最高音以内。必要时，音乐模式会按整八度下移以适应音域，同时保留调性。相同设置会在各乐器自身的音区产生等效旋律。
quality-change-sound-mode=每次可听见的升级播放一个音符，每位玩家各自拥有独立的旋律模式。固定音符保持所选音符；音乐漫步移动一到两个音阶级数；风铃随机选择大调五声音阶的音符；阶梯反复上行后下行；音阶内随机从所选音阶和音域中选择任意音符；完全随机使用乐器的整个音域。\n音乐漫步和阶梯从根音开始，在安静一段时间或存档读档后继续。不会将延迟音符加入队列。仅影响乐器。
quality-change-sound-scale=相对于“升级乐器音符 / 根音”的音阶，供音乐漫步、阶梯和音阶内随机使用。半音阶允许所有半音。风铃始终使用大调五声音阶；固定音符和完全随机会忽略此设置。
quality-change-sound-range=从根音开始的一或两个八度，必要时按整八度下移以适应乐器；也可选择乐器的完整音域。适用于音乐漫步、风铃、阶梯和音阶内随机。固定音符和完全随机会忽略此设置。
quality_control_skip_hidden_qualities=升级时跳过隐藏品质（例如闪亮变体）。此设置仅在安装了Shiny Mechanics之类的模组时适用。
quality_control_hidden_qualities_sticky==具有隐藏品质（例如闪亮）的实体将不再继续升级，以保留其独特优势。此设置仅在安装了Shiny Mechanics之类的模组时适用。
enable-accumulators=启用蓄电池升级。
enable-agricultural-towers=启用农业塔升级。
enable-assembly-machines=启用组装机升级。
enable-asteroid-collectors=启用小行星收集器升级。
asteroid-collector-growth-level-limit=限制小行星收集器品质增长到原版数值以防止破坏游戏的问题。\n\n具有模组品质等级的小行星收集器可能拥有过多手臂且移动过快，导致无法抓取小行星块并造成大量UPS消耗。\n\n[color=green]默认：传奇[/color]
enable-beacons=启用信标升级。
enable-boilers=启用锅炉升级。
enable-combinators-and-speakers=启用运算器和可编程扬声器升级。
enable-pumps=启用海水泵和流体泵升级。
enable-furnaces=启用熔炉升级。
enable-generators=启用蒸汽机、蒸汽轮机和聚变发电机升级。
enable-heat-pipes=启用热管升级。
enable-inserters=启用机械臂升级。
enable-labs=启用研究实验室升级。
enable-lamps=启用灯具升级。
enable-lightning-rods=启用避雷针升级。
enable-mining-drills=启用采矿机升级。
enable-poles=启用电线杆和变电站升级。
enable-power-switches=启用电力开关升级。
enable-radar=启用雷达站升级。
radar-growth-level-limit=限制雷达品质增长以防止过度地图探索和存档文件膨胀。\n\n品质等级很高的雷达会因过度探索地图而导致存档文件过大（1200mb+）。\n\n[color=green]默认：传奇[/color]
lightning-attractor-growth-level-limit=限制闪电吸引器品质增长以防止性能问题。\n\n品质等级很高的闪电吸引器覆盖范围显著增加，可能在弗尔戈拉夜间造成延迟峰值。\n\n[color=green]默认：传奇[/color]
enable-reactors=启用核反应堆和聚变反应堆升级。
enable-rocket-silos=启用火箭发射井升级。
enable-roboports=启用机器人指令平台升级。
enable-solar-panels=启用太阳能板升级。
enable-thrusters=启用太空推进器升级。飞船速度过快可能使防御系统不堪重负。
thruster-growth-level-limit=可选择将太空推进器限制在原版品质等级。模组品质等级会使飞船移动速度显著加快，可能压垮其防御系统。
enable-turrets=启用弹药炮塔、激光炮塔、火焰喷射炮塔和火炮炮塔升级。炮塔通过造成伤害获得“制造小时数”。
turret-damage-per-manufacturing-hour=炮塔获得一个制造小时所需造成的伤害量。\n\n默认值：36,000伤害（根据基础等级炮塔连续一小时发射穿甲弹计算）。
turrets-contribute-credits=让炮塔为同一地表上的次级实体升级提供进度，例如机械臂和电线杆。在游戏后期，电磁轨道炮和闪电炮塔可以大幅加快升级。
enable-defense-walls-and-gates=启用围墙和大门升级。
custom-upgrade-limit-a=下方限制设置中“自定义A”使用的最高品质等级。仅当使用了添加超越传奇品质等级的模组，且希望限制实体的升级等级时才需要此设置。例如，可以让小行星收集器最高升至10级。要使用此功能，请在此设置最高等级，然后在要限制的实体设置中的下拉菜单里选择“自定义A”。供参考，传奇为5级。
custom-upgrade-limit-b=升级限制设置中“自定义B”使用的最高品质等级。
custom-upgrade-limit-c=升级限制设置中“自定义C”使用的最高品质等级。
upgrade-limit-accumulators=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-agricultural-towers=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-assembly-machines=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-beacons=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-boilers=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-combinators-and-speakers=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。\n\n包括：算术运算器、判断运算器、常数运算器、可编程扬声器。
upgrade-limit-defense-walls-and-gates=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-furnaces=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-generators=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。\n\n包括：蒸汽机、蒸汽轮机、聚变发电机。
upgrade-limit-heat-pipes=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-inserters=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-labs=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-lamps=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-mining-drills=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-poles=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。\n\n包括电线杆和变电站。
upgrade-limit-power-switches=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-pumps=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。\n\n包括：海水泵和流体泵。
upgrade-limit-reactors=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。\n\n包括：核反应堆、聚变反应堆。
upgrade-limit-rocket-silos=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-roboports=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-solar-panels=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。
upgrade-limit-turrets=这些实体可升级到的最高品质。设为普通会禁用升级；自定义A/B/C使用上方指定的自定义等级。\n\n包括：弹药炮塔、激光炮塔、火焰喷射炮塔、火炮炮塔。
upgrade-limit-asteroid-collectors=将小行星收集器限制在传奇品质，以防止破坏游戏的问题。模组品质等级可能产生过多移动过快的手臂，导致无法抓取小行星块并大量消耗UPS。
upgrade-limit-radar=将雷达限制在传奇品质，以防止存档文件膨胀。模组品质可能导致过度探索地图，使存档文件过大（超过1GB）。
upgrade-limit-lightning-rods=将闪电吸引器限制在传奇品质，以防止UPS骤降。模组品质等级会显著增加闪电吸引器的覆盖范围，可能在弗尔戈拉夜间造成卡顿。
