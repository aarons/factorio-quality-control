[mod-setting-description]
manufacturing-hours-for-change=尝试品质改变所需的制造小时数。\n只有当机器正在积极工作时，才会累积制造小时数。如果机器处于闲置状态，则不会有进度。\n最小值0.001小时（3.6秒），最大值1000小时。
crafting-speed-affects-progression=控制机器的制造速度是否影响其获得制造小时数的速度。\n\n[color=green]启用（默认）：[/color] 制造速度更高的机器进度会更快。制造小时数根据机器的制造速度和生产力计算获得。速度为4、生产力为50%的铸造厂的进度将比制造速度为1的装配机2快六倍。\n\n[color=red]禁用：[/color] 制造速度不影响进度。无论制造速度如何，积极制造一小时都算作一个制造小时。这消除了每次品质升级都会加快下一次升级的叠加效应。
percentage-chance-of-change=品质改变成功的百分比概率。\n最小值0.0001%，最大值100%（时间达到后总是改变）
quality-increase-cost=每个品质等级增加尝试间隔时间。这是一个复合公式。设置为0%将保持尝试间隔时间不变，无论品质等级如何\n\n[color=green]每级50%成本增长，需要3制造小时的示例[/color]\n\n普通：3小时\n罕见：4.5小时\n稀有：6.8小时\n史诗：10.1小时\n传奇：15.2小时\n模组品质10级：173小时
quality-chance-accumulation-rate=控制每次失败后概率增长幅度。\n\n[color=white]无（默认）：[/color]不累积 - 概率保持恒定。\n\n[color=white]低（20%）：[/color]每次失败概率增加基础速率的20%。\n\n[color=white]中（50%）：[/color]每次失败概率增加基础速率的50%。\n\n[color=white]高（100%）：[/color]每次失败概率增加基础速率的100%。\n\n[color=yellow]1%基础概率示例：[/color]\n\n[color=white]低：[/color]1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]高：[/color]1.0% → 2.0% → 3.0% → 4.0%...\n\n所有累积设置最终保证品质改变 - 更高设置只是更快达到100%概率
accumulate-at-max-quality=最大品质组装机仍会贡献：\n启用时，最大品质的组装机和熔炉将继续跟踪制造小时数并为次要实体（如机械臂、信标等）生成升级积分，即使它们自己无法进一步升级。\n\n[color=green]启用（默认）：[/color]最大品质组装机继续为次要实体生成升级积分。这可以在后期为次要实体提供稳定进展。\n\n[color=red]禁用：[/color]只有仍可升级的低品质组装机和熔炉生成积分，但积分按仍需升级的次要实体比例生成。在极端情况下，这意味着单个低品质组装机可以推进整个工厂的次要实体。
change-modules-with-entity=控制机器中的模块是否受品质改变影响。\n\n[color=white]禁用（默认）：[/color]当宿主机器品质改变时，模块不受影响。\n\n[color=white]启用：[/color]当宿主改变时，模块品质提升一个等级。它们不会超过宿主的品质等级。\n\n[color=white]额外启用：[/color]类似启用，但每当发生品质改变时，模块都会更新为匹配其宿主机器的品质。
batch-entities-per-tick=每个游戏刻处理的实体数量以避免性能峰值。\n最小值1，最大值1000。\n更高的值可能造成延迟峰值但处理实体更快。
batch-ticks-between-processing=批处理周期间等待的游戏刻数。\n最小值1刻，最大值6000刻（约2.5分钟）。\n更低的值处理更频繁但可能影响性能。
quality-change-aggregate-alerts-enabled=显示汇总所有品质改变的控制台消息（每5分钟显示一次）。示例："3个组装机升级，2个机械臂升级"
quality-change-entity-alerts-enabled=当个别实体品质改变时显示地图标记警报。点击警报查看升级的实体。
quality_control_skip_hidden_qualities=品质控制在升级时将跳过隐藏品质（例如:闪亮变体）。实体永远不会通过品质控制变为闪亮 - 玩家必须通过正常方式获得它们。此设置仅在安装了Shiny Mechanics品质模组时适用。
quality_control_hidden_qualities_sticky=具有隐藏品质（例如:闪亮）的实体将不再继续升级,保留其独特优势。此设置仅在安装了Shiny Mechanics品质模组时适用。
enable-accumulators=启用蓄电池的品质改变。
enable-agricultural-towers=启用农业塔的品质改变。
enable-assembly-machines=启用组装机的品质改变。
enable-asteroid-collectors=启用小行星收集器的品质改变。
asteroid-collector-growth-level-limit=限制小行星收集器品质增长到原版数值以防止破坏游戏的问题。\n\n具有模组品质等级的小行星收集器可能拥有过多手臂且移动过快，导致无法抓取小行星块并造成大量UPS消耗。\n\n[color=green]默认：传奇[/color]
enable-beacons=启用信标的品质改变。
enable-boilers=启用锅炉的品质改变。
enable-combinators-and-speakers=启用运算器和扬声器的品质改变。\n\n包括：算术运算器、判断运算器、常数运算器、可编程扬声器。
enable-pumps=启用泵的品质改变（包括海水泵和流体泵）。
enable-furnaces=启用熔炉的品质改变。
enable-generators=启用发电机的品质改变（蒸汽机、蒸汽轮机、聚变发电机）。
enable-heat-pipes=启用热管的品质改变。
enable-inserters=启用机械臂的品质改变。
enable-labs=启用研究实验室的品质改变。
enable-lamps=启用灯具的品质改变。
enable-lightning-rods=启用避雷针的品质改变。
enable-mining-drills=启用所有采矿机的品质改变。
enable-poles=启用所有电线杆的品质改变（包括大型电线杆和变电站）。
enable-power-switches=启用电力开关的品质改变。
enable-radar=启用雷达站的品质改变。
radar-growth-level-limit=限制雷达品质增长以防止过度地图探索和存档文件膨胀。\n\n品质等级很高的雷达会因过度探索地图而导致存档文件过大（1200mb+）。\n\n[color=green]默认：传奇[/color]
lightning-attractor-growth-level-limit=限制闪电吸引器品质增长以防止性能问题。\n\n品质等级很高的闪电吸引器覆盖范围显著增加，可能在弗尔戈拉夜间造成延迟峰值。\n\n[color=green]默认：传奇[/color]
enable-reactors=启用反应堆的品质改变（核反应堆、聚变反应堆）。
enable-rocket-silos=启用火箭发射井的品质改变。
enable-roboports=启用机器人指令平台的品质改变。
enable-solar-panels=启用太阳能板的品质改变。
enable-thrusters=启用太空推进器的品质改变。默认禁用，因为意外改变飞船速度可能导致防御系统不堪重负。
thruster-growth-level-limit=限制太空推进器品质增长到原版等级以防止防御问题。\n\n模组品质等级会使飞船移动速度显著加快，可能压垮其防御系统。\n\n[color=green]默认：传奇[/color]
enable-turrets=启用炮塔的品质改变。\n\n炮塔是主要实体，根据累计造成的伤害生成升级积分。\n\n包括：弹药炮塔、激光炮塔、火焰喷射器、火炮炮塔。
turret-damage-per-manufacturing-hour=炮塔需造成的伤害量以等效一个制造小时。\n\n默认值：36,000伤害（来源于穿甲弹：每小时450个弹匣 × 每弹匣80伤害）。\n\n较低的值使炮塔更快生成积分。较高的值则减慢积分生成。
turrets-contribute-credits=控制炮塔获得的升级额度是否也汇入用于提升次要实体(机械臂、电线杆等)品质的共享池。\n\n[color=red]禁用(默认):[/color] 炮塔额度仅归炮塔自身所有。战斗伤害只帮助炮塔提升自身品质。\n\n[color=green]启用:[/color] 炮塔额度也会流入共享池,使战斗伤害像制造那样推动次要实体的品质提升。
enable-defense-walls-and-gates=启用围墙和大门的品质改变。\n\n包括：围墙、大门。
custom-upgrade-limit-a=用于为实体设置自定义模组品质限制。仅当你使用了添加超越传奇品质等级的模组，并希望限制实体升级程度时才需要此设置。要使用此功能，请在此设置最大等级，然后在你想要限制的实体设置中的下拉菜单里选择“自定义A”。供参考，传奇为等级5（普通=1，罕见=2，稀有=3，史诗=4，传奇=5……）。
custom-upgrade-limit-b=用于为实体设置自定义模组品质限制。仅当你使用了添加超越传奇品质等级的模组，并希望限制实体升级程度时才需要此设置。要使用此功能，请在此设置最大等级，然后在你想要限制的实体设置中的下拉菜单里选择“自定义B”。供参考，传奇为等级5（普通=1，罕见=2，稀有=3，史诗=4，传奇=5……）。
custom-upgrade-limit-c=用于为实体设置自定义模组品质限制。仅当你使用了添加超越传奇品质等级的模组，并希望限制实体升级程度时才需要此设置。要使用此功能，请在此设置最大等级，然后在你想要限制的实体设置中的下拉菜单里选择“自定义C”。供参考，传奇为等级5（普通=1，罕见=2，稀有=3，史诗=4，传奇=5……）。
upgrade-limit-accumulators=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
upgrade-limit-agricultural-towers=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
upgrade-limit-assembly-machines=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
upgrade-limit-beacons=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
upgrade-limit-boilers=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
upgrade-limit-combinators-and-speakers=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。\n\n包括：算术组合器、判断组合器、常量组合器、可编程扬声器。
upgrade-limit-defense-walls-and-gates=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。\n\n包括：墙、闸门。
upgrade-limit-furnaces=品质控制将把这些实体升级到此品质，然后停止尝试进一步升级。设置为普通以阻止任何升级尝试。自定义数值使用自定义升级限制A/B/C设置。
