quality-level-cap-asteroid-collectors=Ойын бұзу мәселелерін болдырмау үшін астероид жинақтағышының сапасының өсуін ванильдік мәндерге шектейді.\n\nМодталған сапа деңгейлері бар астероид жинақтағыштары тым жылдам қозғалатын тым көп қолдарға ие болып, астероид бөліктерін ала алмай және үлкен UPS шығынын тудыруы мүмкін.\n\n[color=green]Әдепкі: 5 деңгей (ертегілік)[/color]\n[color=yellow]Ауқым: 1-255 сапа деңгейлері[/color]
quality-level-cap-radar=Карта зерттеуінің шамадан тыс болуын және сақтау файлының ісінуін болдырмау үшін радар сапасының өсуін шектейді.\n\nӨте жоғары сапа деңгейіндегі радарлар карта зерттеуінің шамадан тыс болуы салдарынан үлкен сақтау файлдарын тудыруы мүмкін (1,200мб+).\n\n[color=green]Әдепкі: 5 деңгей (ертегілік)[/color]\n[color=yellow]Ауқым: 1-255 сапа деңгейлері[/color]
quality-level-cap-lightning-rods=Өнімділік мәселелерін болдырмау үшін найзағай тартқышының сапасының өсуін шектейді.\n\nӨте жоғары сапа деңгейіндегі найзағай тартқыштары айтарлықтай арттырылған жабу аймақтарына ие, бұл Фулгорада түнде кідіру секірулеріне себеп бола алады.\n\n[color=green]Әдепкі: 5 деңгей (ертегілік)[/color]\n[color=yellow]Ауқым: 1-255 сапа деңгейлері[/color]
