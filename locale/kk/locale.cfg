[mod-setting-description]
manufacturing-hours-for-change=Сапа өзгерісін әрекет ету үшін қажетті өндіріс сағаттарының саны.\nӨндіріс сағаттары машина белсенді жұмыс істеп тұрғанда ғана жинақталады. Егер ол бос тұрса, онда ілгерілеу болмайды.\nМинимум мәні 0.001 сағат (3.6 секунд), Максимум мәні 1000 сағат.
crafting-speed-affects-progression=[color=green]Қосулы:[/color] Дайындау жылдамдығы мен өнімділік жиналатын өндіріс сағаттарын арттырады. Жылдамдығы 4 және өнімділігі 50% болатын машина жылдамдығы 1 және өнімділік бонусы жоқ машинадан алты есе көп сағат жинайды.\n\n[color=red]Өшірулі:[/color] Дайындау жылдамдығы ілгерілеуге әсер етпейді.
percentage-chance-of-change=Жаңарту әрекетінің сәтті болу мүмкіндігі.
quality-increase-cost=Әр сапа деңгейіне қажетті өндіріс сағаттарының артуы. Өсім құрамалы; 0% барлық деңгейде талапты бірдей ұстайды.\n\n50% болғанда, 3 сағаттық талап сирек сапада 4.5 сағатқа, сирек кездесетін сапада 6.75 сағатқа өседі.
quality-chance-accumulation-rate=Сәтсіз әрекеттен кейін жаңарту мүмкіндігін базалық мүмкіндіктің белгілі бір пайызына арттыру.\n\n[color=white]Жоқ:[/color] Мүмкіндік тұрақты қалады.\n[color=white]Төмен:[/color] Базалық мүмкіндіктің 20%-ын қосу.\n[color=white]Орташа:[/color] Базалық мүмкіндіктің 50%-ын қосу.\n[color=white]Жоғары:[/color] Базалық мүмкіндіктің 100%-ын қосу.\n\nБазалық мүмкіндік 1% болса, Төмен параметрі 1% → 1.2% → 1.4%..., ал Жоғары параметрі 1% → 2% → 3%... береді.
secondary-progression-rate=Өз жұмысын өлшей алмайтын жабдықтардың, мысалы, салғыштардың, бағаналардың және маяктардың ілгерілеу жылдамдығы.\n\n100% сол беттегі негізгі жабдықтар жинайтын орташа өндіріс сағаттарына сәйкес келеді. Жоғары мәндер ілгерілеуді жылдамдатады; 0% оны тоқтатады.
change-modules-with-entity=[color=white]Өшірілген:[/color] Модульдер жаңартылмайды.\n\n[color=white]Қосылған:[/color] Машина жаңарғанда модульдер бір деңгейге, машина сапасына дейін жаңартылады.\n\n[color=white]Қосымша қосылған:[/color] Модульдер машинаның жаңа сапасына сәйкес жаңартылады.\n\n[color=white]Тәуелсіз:[/color] Модульдер қосалқы ілгерілеу арқылы өз жаңарту әрекеттерін жинайды және машинаның сапа шегінен аса алады. Машина шегін Кәдімгі етіп орнату модуль жаңартуларын да өшіреді.
batch-entities-per-tick=Әр топта өңделетін жабдықтар саны. Үлкен топтар жаңартуларды жылдамырақ өңдейді, бірақ кідіріс тудыруы мүмкін. Тәуелсіз режимде модуль ұяшықтары да есептеледі.
batch-ticks-between-processing=Топтарды өңдеу арасындағы тиктер саны. Қысқа аралықтар жаңартуларды жиірек өңдейді, бірақ өнімділікті төмендетуі мүмкін.
quality-change-aggregate-alerts-enabled=Әр бес минут сайын жаңартулар қорытындысын шығару.
quality-change-entity-alerts-enabled=Жаңарту орындарында карта дабылының белгішелерін көрсету.
quality-change-chat-enabled=Жабдық немесе модуль белгішелері, сапа белгішелері және кездейсоқ кемпірқосақ түстеріндегі әріптері бар жаңарту хабарларын шығару.
quality-change-gps-enabled=Әр жаңарту үшін басылатын орын сілтемесін шығарып, Factorio GPS карта белгісін қосу. Орынға қайта өту үшін сілтемені басыңыз. Түрлі түсті жаңарту чаты қосулы болса, сілтеме сол хабарға қосылады; әйтпесе тек сілтеме шығарылады. Ойынның GPS белгісі үшін чат сілтемесі қажет.
quality-change-floating-text-enabled=Жоғары көтерілетін жаңарту мәтінін жаңа сапаның түсімен көрсету.
quality-change-halo-enabled=Жаңарту орындарында жаңа сапаның түсімен кеңейетін шапақты көрсету.
quality-change-rainbow-enabled=Жаңарту орындарында кеңейетін кемпірқосақ сақиналарын көрсету.
quality-change-badge-enabled=Жаңа сапа белгішесінің 4.5 секунд бойы үлкейіп, жоғары көтерілуін және жоғалғанша үздіксіз айналуын көрсету.
quality-change-bubbles-enabled=Жаңарту орындарында көпіршіктер сияқты жоғары қалқитын жаңа сапаның шағын белгішелерін шығару.
quality-change-sound-enabled=Қашықтан қарауды қоса алғанда, қазір қарап отырған беттегі жаңартулар үшін таңдалған дыбысты ойнату.
quality-change-sound=Хабарландыру әсерін, дауыс күшейткіш дабылын, барабан дыбысын немесе музыкалық аспапты таңдаңыз. Аспаптар Жаңарту аспабының нотасы / негізгі нотасы және Жаңарту ноталарының ойналу тәртібі параметрлерін пайдаланады. Дыбыс тек Жаңарту дыбысы қосулы кезде және қазір қарап отырған беттегі жаңартулар үшін ойнатылады.
quality-change-sound-note=Тұрақты нота немесе музыкалық өрнектердің негізгі нотасы (тональдігі мен бастапқы регистрі). Дабылдар, барабандар, әсерлер және Толық кездейсоқ режимі үшін ескерілмейді.\nНоталар F нотасынан бастап жарты тонмен жоғарылайды: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; келесі октава үшін 12 қосыңыз. Әдепкі: 20 (C).\nПианинода 48 нота, басқа аспаптарда 36 нота бар. Тұрақты режим қолжетімді ең жоғары нотамен шектейді. Музыкалық өрнектер қажет болса, тональдігін сақтап, толық октаваларға төмен жылжиды. Бірдей параметрлер әр аспаптың өз регистрінде баламалы өрнектер береді.
quality-change-sound-mode=Дыбысы естілетін әр жаңартуға бір нота ойналады; әр ойыншының өз өрнегі бар. Тұрақты нота таңдалған нотаны сақтайды; Музыкалық кезбе гаммада бір немесе екі сатыға жылжиды; Жел қоңыраулары кездейсоқ мажорлық пентатоника ноталарын таңдайды; Баспалдақ қайта-қайта жоғарылап, төмендейді; Гаммада кездейсоқ таңдалған гамма мен диапазондағы кез келген нотаны таңдайды; Толық кездейсоқ аспаптың бүкіл диапазонын пайдаланады.\nМузыкалық кезбе мен Баспалдақ негізгі нотадан басталып, тыныш кезеңдерден және сақтаудан/жүктеуден кейін жалғасады. Кешіктірілген ноталар кезекке қойылмайды. Тек музыкалық аспаптарға әсер етеді.
quality-change-sound-scale=Жаңарту аспабының нотасына / негізгі нотасына қатысты гамма; оны Музыкалық кезбе, Баспалдақ және Гаммада кездейсоқ режимдері пайдаланады. Хроматикалық гамма барлық жарты тонға рұқсат береді. Жел қоңыраулары әрдайым мажорлық пентатониканы пайдаланады; Тұрақты нота мен Толық кездейсоқ бұл параметрді ескермейді.
quality-change-sound-range=Негізгі нотадан басталатын бір немесе екі октава; қажет болса, аспапқа сыйдыру үшін толық октаваларға төмен жылжиды. Сондай-ақ аспаптың толық диапазонын таңдауға болады. Музыкалық кезбе, Жел қоңыраулары, Баспалдақ және Гаммада кездейсоқ режимдеріне қолданылады. Тұрақты нота мен Толық кездейсоқ бұл параметрді ескермейді.
quality_control_skip_hidden_qualities=Жаңарту кезінде жасырын сапаларды (мысалы, жылтыр нұсқаларды) өткізіп жіберу. Бұл параметр тек Shiny Mechanics сияқты мод орнатылғанда қолданылады.
quality_control_hidden_qualities_sticky==Жасырын сапалары бар жабдықтар (мысалы, жылтыр) одан әрі жаңартылмайды, сондықтан олардың бірегей артықшылықтары сақталады. Бұл параметр тек Shiny Mechanics сияқты мод орнатылғанда қолданылады.
enable-accumulators=Аккумуляторларды жаңартуды қосу.
enable-agricultural-towers=Ауылшаруашылық мұнараларын жаңартуды қосу.
enable-assembly-machines=Жинақтау машиналарын жаңартуды қосу.
enable-asteroid-collectors=Астероид жинақтағыштарын жаңартуды қосу.
asteroid-collector-growth-level-limit=Ойын бұзу мәселелерін болдырмау үшін астероид жинақтағышының сапасының өсуін ванильдік мәндерге шектейді.\n\nМодталған сапа деңгейлері бар астероид жинақтағыштары тым жылдам қозғалатын тым көп қолдарға ие болып, астероид бөліктерін ала алмай және үлкен UPS шығынын тудыруы мүмкін.\n\n[color=green]Әдепкі: ертегілік[/color]
enable-beacons=Маяктарды жаңартуды қосу.
enable-boilers=Қазандарды жаңартуды қосу.
enable-combinators-and-speakers=Комбинаторлар мен бағдарламаланатын дауыс күшейткіштерді жаңартуды қосу.
enable-pumps=Теңіз сорғылары мен сұйықтық сорғыларын жаңартуды қосу.
enable-furnaces=Пештерді жаңартуды қосу.
enable-generators=Бу қозғалтқыштарын, бу турбиналарын және термоядролық генераторларды жаңартуды қосу.
enable-heat-pipes=Жылу құбырларын жаңартуды қосу.
enable-inserters=Салғыштарды жаңартуды қосу.
enable-labs=Зерттеу зертханаларын жаңартуды қосу.
enable-lamps=Шамдарды жаңартуды қосу.
enable-lightning-rods=Найзағай өзектерін жаңартуды қосу.
enable-mining-drills=Кен қазу бұрғыларын жаңартуды қосу.
enable-poles=Электр бағандары мен қосалқы станцияларды жаңартуды қосу.
enable-power-switches=Қуат ауыстырғыштарын жаңартуды қосу.
enable-radar=Радар станцияларын жаңартуды қосу.
radar-growth-level-limit=Карта зерттеуінің шамадан тыс болуын және сақтау файлының ісінуін болдырмау үшін радар сапасының өсуін шектейді.\n\nӨте жоғары сапа деңгейіндегі радарлар карта зерттеуінің шамадан тыс болуы салдарынан үлкен сақтау файлдарын тудыруы мүмкін (1,200мб+).\n\n[color=green]Әдепкі: ертегілік[/color]
lightning-attractor-growth-level-limit=Өнімділік мәселелерін болдырмау үшін найзағай тартқышының сапасының өсуін шектейді.\n\nӨте жоғары сапа деңгейіндегі найзағай тартқыштары айтарлықтай арттырылған жабу аймақтарына ие, бұл Фулгорада түнде кідіру секірулеріне себеп бола алады.\n\n[color=green]Әдепкі: ертегілік[/color]
enable-reactors=Ядролық және термоядролық реакторларды жаңартуды қосу.
enable-rocket-silos=Зымыран силоларын жаңартуды қосу.
enable-roboports=Робопорттарды жаңартуды қосу.
enable-solar-panels=Күн панельдерін жаңартуды қосу.
enable-thrusters=Ғарыш итергіштерін жаңартуды қосу. Жылдамырақ кемелердің қорғанысы төтеп бере алмауы мүмкін.
thruster-growth-level-limit=Қалауыңызша ғарыш итергіштерін ванильдік деңгейлермен шектеңіз. Модталған сапа деңгейлері ғарыш кемелерін айтарлықтай жылдамдатып, олардың қорғанысына шамадан тыс жүктеме түсіруі мүмкін.
enable-turrets=Оқ-дәрі, лазерлік, от лақтырғыш және артиллериялық мұнараларды жаңартуды қосу. Мұнаралар зиян келтіру арқылы «өндіріс сағаттарын» жинайды.
turret-damage-per-manufacturing-hour=Атыс мұнарасы бір өндіріс сағатын жинау үшін келтіруі тиіс зиян мөлшері.\n\nӘдепкі: 36,000 зиян (негізгі деңгейдегі мұнараның бір сағат бойы тесіп өтетін оқтармен үздіксіз атуына негізделген).
turrets-contribute-credits=Атыс мұнараларына сол беттегі салғыштар мен электр бағандары сияқты қосалқы жабдықтарды жаңартуға үлес қосуға рұқсат ету. Ойынның соңғы кезеңінде рельстік зеңбіректер мен найзағай мұнаралары жаңартуларды едәуір жылдамдатуы мүмкін.
enable-defense-walls-and-gates=Қабырғалар мен қақпаларды жаңартуды қосу.
custom-upgrade-limit-a=Төмендегі шектеу параметрлеріндегі 'Арнайы A' қолданатын максималды сапа деңгейі. Бұл тек ертегіліктен жоғары сапа деңгейлерін қосатын мод орнатылып, жабдықтың жаңарту деңгейін шектегіңіз келгенде қажет. Мысалы, астероид жинақтағыштарының 10-деңгейге жетуіне рұқсат беруге болады. Ол үшін мұнда максималды деңгейді орнатып, төмендегі қажетті жабдықтың ашылмалы тізімінен 'Арнайы A' таңдаңыз. Анықтама үшін, ертегілік — 5-деңгей.
custom-upgrade-limit-b=Жаңарту шегі параметрлеріндегі Арнайы B қолданатын максималды сапа деңгейі.
custom-upgrade-limit-c=Жаңарту шегі параметрлеріндегі Арнайы C қолданатын максималды сапа деңгейі.
upgrade-limit-accumulators=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-agricultural-towers=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-assembly-machines=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-beacons=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-boilers=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-combinators-and-speakers=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.\n\nОған мыналар кіреді: арифметикалық комбинаторлар, шешуші комбинаторлар, тұрақты комбинаторлар, бағдарламаланатын дауыс күшейткіштер.
upgrade-limit-defense-walls-and-gates=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-furnaces=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-generators=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.\n\nОған мыналар кіреді: бу қозғалтқыштары, бу турбиналары, термоядролық генераторлар.
upgrade-limit-heat-pipes=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-inserters=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-labs=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-lamps=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-mining-drills=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-poles=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.\n\nОған электр бағаналары мен қосалқы станциялар кіреді.
upgrade-limit-power-switches=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-pumps=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.\n\nОған мыналар кіреді: теңіз сорғылары және сұйықтық сорғылары.
upgrade-limit-reactors=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.\n\nОған мыналар кіреді: ядролық реакторлар, термоядролық реакторлар.
upgrade-limit-rocket-silos=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-roboports=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-solar-panels=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.
upgrade-limit-turrets=Бұл жабдықтар жаңартылатын максималды сапа. Кәдімгі жаңартуларды өшіреді; Арнайы A/B/C жоғарыда көрсетілген арнайы деңгейді пайдаланады.\n\nОған мыналар кіреді: оқ-дәрі мұнаралары, лазерлік мұнаралар, от лақтырғыштар, артиллериялық мұнаралар.
upgrade-limit-asteroid-collectors=Ойын жұмысының бұзылуын болдырмау үшін астероид жинақтағыштарын ертегілік сапамен шектеңіз. Модталған деңгейлерде тым көп қол тым жылдам қозғалып, астероид бөліктерін ала алмай қалуы және UPS-ті едәуір төмендетуі мүмкін.
upgrade-limit-radar=Сақтау файлының шамадан тыс ұлғаюын болдырмау үшін радарларды ертегілік сапамен шектеңіз. Модталған сапалар карта зерттеуін шамадан тыс арттырып, файлдардың өте үлкен болуына (бір гигабайттан астам) әкелуі мүмкін.
upgrade-limit-lightning-rods=UPS ауытқуларын болдырмау үшін найзағай тартқыштарын ертегілік сапамен шектеңіз. Модталған сапа деңгейлеріндегі найзағай тартқыштарының қамту аймағы едәуір ұлғайып, Фулгорада түнде кідіріс туғызуы мүмкін.
upgrade-limit-thrusters=Ғарыш платформасының күтпеген зақымдануын болдырмау үшін ғарыш итергішін ертегілік сапамен шектеңіз. Модталған сапа деңгейлері ғарыш кемелерін айтарлықтай жылдамдатып, олардың қорғанысына шамадан тыс жүктеме түсіруі мүмкін.

