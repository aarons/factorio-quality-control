upgrade-limit-accumulators=Сапа Бақылауы бұл жабдықтарды осы сапаға дейін жаңартады, содан кейін одан әрі жаңарту әрекеттерін тоқтатады. Кез келген жаңарту әрекетін болдырмау үшін мұны Кәдімгі етіп орнатыңыз. Арнайы мәндер Арнайы Жаңарту Шегі A/B/C параметрлерін пайдаланады.
