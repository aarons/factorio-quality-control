[mod-setting-description]
manufacturing-hours-for-change=Antalet tillverkningstimmar som krävs för att ett kvalitetsförsök ska genomföras.\nTillverkningstimmar ackumuleras endast när maskinen arbetar aktivt. Om den står stilla kommer den inte att göra några framsteg.\nMinvärde 0,001 timmar (3,6 sekunder), Maxvärde 1000 timmar.
crafting-speed-affects-progression=[color=red]Inaktiverad (standard):[/color] Tillverkningshastighet påverkar inte progressionen, vilket hjälper till att fördela uppgraderingarna jämnare under ett längre spel.\n\n[color=green]Aktiverad:[/color] Tillverkningshastighet och produktivitet ökar antalet intjänade tillverkningstimmar. Hastighet 4 med 50 % produktivitet tjänar in sex gånger så mycket som hastighet 1 utan produktivitetsbonus. Hastighetsökningar från kvalitetsuppgraderingar kan förstärka varandra och leda till mycket snabba uppgraderingar sent i spelet.
percentage-chance-of-change=Chansen att ett uppgraderingsförsök lyckas.
quality-increase-cost=Ökning av antalet tillverkningstimmar som krävs per kvalitetsnivå. Ökningen är sammansatt; 0 % håller kravet oförändrat på alla nivåer.\n\nVid 50 % blir ett krav på 3 timmar 4,5 timmar för ovanlig och 6,75 timmar för sällsynt.
quality-chance-accumulation-rate=Öka uppgraderingschansen efter ett misslyckat försök med en procentandel av grundchansen.\n\n[color=white]Ingen:[/color] Chansen förblir konstant.\n[color=white]Låg:[/color] Lägg till 20 % av grundchansen.\n[color=white]Medium:[/color] Lägg till 50 % av grundchansen.\n[color=white]Hög:[/color] Lägg till 100 % av grundchansen.\n\nMed 1 % grundchans ger Låg 1 % → 1,2 % → 1,4 %... och Hög ger 1 % → 2 % → 3 %...
secondary-progression-rate=Progressionshastighet för enheter som inte kan mäta sitt eget arbete, såsom insättare, elstolpar och fyrar.\n\n100 % motsvarar de genomsnittliga tillverkningstimmar som primära enheter på samma yta tjänar in. Högre värden påskyndar progressionen; 0 % pausar den.
change-modules-with-entity=[color=white]Inaktiverad:[/color] Moduler uppgraderas inte.\n\n[color=white]Aktiverad:[/color] Moduler uppgraderas en nivå när deras maskin uppgraderas, upp till maskinens kvalitet.\n\n[color=white]Extra Aktiverad:[/color] Moduler uppgraderas för att matcha maskinens nya kvalitet.\n\n[color=white]Oberoende:[/color] Moduler tjänar in egna uppgraderingsförsök genom sekundär progression och kan överskrida maskinens kvalitetsgräns. Om maskinens gräns sätts till Vanlig inaktiveras även moduluppgraderingar.
batch-entities-per-tick=Enheter som bearbetas per omgång. Större omgångar bearbetar uppgraderingar snabbare men kan orsaka fördröjningar. Modulplatser räknas också i läget Oberoende.
batch-ticks-between-processing=Antal ticks mellan bearbetningsomgångar. Kortare intervall bearbetar uppgraderingar oftare men kan försämra prestandan.
quality-change-aggregate-alerts-enabled=Visa en sammanfattning av uppgraderingar var femte minut.
quality-change-entity-alerts-enabled=Visa varningsikoner på kartan där uppgraderingar sker.
quality-change-chat-enabled=Visa uppgraderingsmeddelanden med enhets- eller modulikoner, kvalitetsikoner och slumpmässigt regnbågsfärgade bokstäver.
quality-change-gps-enabled=Visa en klickbar platslänk och utlös Factorios GPS-ping på kartan för varje uppgradering. Klicka på länken för att återvända till platsen. Länken läggs till i färgglada uppgraderingsmeddelanden när de är aktiverade; annars visas bara länken. Spelets GPS-ping kräver en chattlänk.
quality-change-floating-text-enabled=Visa stigande uppgraderingstext i den nya kvalitetens färg.
quality-change-halo-enabled=Visa en växande gloria i den nya kvalitetens färg där uppgraderingar sker.
quality-change-rainbow-enabled=Visa växande regnbågsringar där uppgraderingar sker.
quality-change-badge-enabled=Visa den nya kvalitetens ikon medan den växer och stiger i 4,5 sekunder och roterar kontinuerligt medan den tonas ut.
quality-change-bubbles-enabled=Släpp ut en ström av små ikoner för den nya kvaliteten som stiger som bubblor där uppgraderingar sker.
quality-change-sound-enabled=Spela det valda ljudet för uppgraderingar på ytan du för närvarande tittar på, även i fjärrvyn.
quality-change-sound=Välj en meddelandeeffekt, ett högtalarlarm, ett trumljud eller ett musikinstrument. Instrument använder inställningarna Instrumentton / grundton och Tonmönster. Ljudet spelas endast när uppgraderingsljud är aktiverat och uppgraderingen sker på ytan du för närvarande tittar på.
quality-change-sound-note=Fast ton eller grundtonen (tonart och startregister) för musikaliska mönster. Ignoreras för larm, trummor, effekter och läget Helt slumpmässigt.\nTonerna stiger i halvtoner från F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; lägg till 12 för nästa oktav. Standard: 20 (C).\nPiano har 48 toner; övriga instrument har 36. I läget Fast ton begränsas tonen till den högsta tillgängliga. Musikaliska mönster flyttas vid behov nedåt med hela oktaver för att passa, medan tonarten bevaras. Samma inställningar ger motsvarande mönster i varje instruments eget register.
quality-change-sound-mode=En ton per hörbar uppgradering, med ett separat mönster för varje spelare. Fast ton behåller den valda tonen; Musikalisk vandring flyttar sig ett eller två skalsteg; Vindspel väljer slumpmässiga toner ur en pentatonisk durskala; Trappa stiger och sjunker upprepade gånger; Slumpmässig i skalan väljer valfri ton i den valda skalan och tonomfånget; Helt slumpmässigt använder instrumentets hela tonomfång.\nMusikalisk vandring och Trappa börjar på grundtonen och fortsätter efter tysta perioder och sparning/inläsning. Inga fördröjda toner köas. Påverkar endast musikinstrument.
quality-change-sound-scale=Skala relativt Instrumentton / grundton, som används av Musikalisk vandring, Trappa och Slumpmässig i skalan. Kromatisk tillåter alla halvtoner. Vindspel använder alltid pentatonisk dur; Fast ton och Helt slumpmässigt ignorerar inställningen.
quality-change-sound-range=En eller två oktaver med början på grundtonen, vid behov flyttade nedåt med hela oktaver för att passa instrumentet, eller instrumentets hela tonomfång. Gäller Musikalisk vandring, Vindspel, Trappa och Slumpmässig i skalan. Fast ton och Helt slumpmässigt ignorerar inställningen.
quality_control_skip_hidden_qualities=Hoppa över dolda kvaliteter (t.ex. shiny-varianter) vid uppgradering. Denna inställning gäller endast när du har ett mod som Shiny Mechanics installerat.
quality_control_hidden_qualities_sticky==Enheter med dolda kvaliteter (t.ex. shiny) uppgraderas inte ytterligare, vilket bevarar deras unika fördelar. Denna inställning gäller endast när du har ett mod som Shiny Mechanics installerat.
enable-accumulators=Aktivera uppgraderingar för ackumulatorer.
enable-agricultural-towers=Aktivera uppgraderingar för jordbrukstorn.
enable-assembly-machines=Aktivera uppgraderingar för monteringsmaskiner.
enable-asteroid-collectors=Aktivera uppgraderingar för asteroiduppsamlare.
asteroid-collector-growth-level-limit=Begränsar asteroiduppsamlarens kvalitetstillväxt till vanilla-värden för att förhindra spelbrytande problem.\n\nAsteroiduppsamlare med moddade kvalitetsnivåer kan ha för många armar som rör sig för snabbt, vilket gör dem oförmögna att ta upp asteroidbitar och skapar ett stort UPS-dränage.\n\n[color=green]Standard: legendarisk[/color]
enable-beacons=Aktivera uppgraderingar för fyrar.
enable-boilers=Aktivera uppgraderingar för pannor.
enable-combinators-and-speakers=Aktivera uppgraderingar för kombinatorer och programmerbara högtalare.
enable-pumps=Aktivera uppgraderingar för kustpumpar och vätskepumpar.
enable-furnaces=Aktivera uppgraderingar för ugnar.
enable-generators=Aktivera uppgraderingar för ångmaskiner, ångturbiner och fusionsgeneratorer.
enable-heat-pipes=Aktivera uppgraderingar för värmerör.
enable-inserters=Aktivera uppgraderingar för insättare.
enable-labs=Aktivera uppgraderingar för forskningslaboratorier.
enable-lamps=Aktivera uppgraderingar för lampor.
enable-lightning-rods=Aktivera uppgraderingar för blixtstavar.
enable-mining-drills=Aktivera uppgraderingar för gruvborrar.
enable-poles=Aktivera uppgraderingar för elstolpar och transformatorstationer.
enable-power-switches=Aktivera uppgraderingar för strömbrytare.
enable-radar=Aktivera uppgraderingar för radarstationer.
radar-growth-level-limit=Begränsar radarns kvalitetstillväxt för att förhindra överdriven kartutforskning och spara filuppblåsning.\n\nRadar med mycket höga kvalitetsnivåer kan orsaka stora sparfiler (1 200mb+) på grund av överdriven kartutforskning.\n\n[color=green]Standard: legendarisk[/color]
lightning-attractor-growth-level-limit=Begränsar blixtattraktorns kvalitetstillväxt för att förhindra prestandaproblem.\n\nBlixtattraktorer med mycket höga kvalitetsnivåer har avsevärt ökade täckningsområden, vilket kan orsaka fördröjningstoppar på natten på Fulgora.\n\n[color=green]Standard: legendarisk[/color]
enable-reactors=Aktivera uppgraderingar för kärnreaktorer och fusionsreaktorer.
enable-rocket-silos=Aktivera uppgraderingar för raketsilos.
enable-roboports=Aktivera uppgraderingar för robotportar.
enable-solar-panels=Aktivera uppgraderingar för solpaneler.
enable-thrusters=Aktivera uppgraderingar för rymdraketer. Snabbare skepp kan överväldiga sitt försvar.
thruster-growth-level-limit=Begränsa rymdraketer till grundspelets nivåer om så önskas. Moddade kvalitetsnivåer kan få rymdskepp att röra sig avsevärt snabbare, vilket kan överväldiga deras försvar.
enable-turrets=Aktivera uppgraderingar för ammunitionstorn, lasertorn, eldkastartorn och artilleritorn. Torn tjänar in 'tillverkningstimmar' genom att orsaka skada.
turret-damage-per-manufacturing-hour=Mängden skada ett torn måste tillfoga för att tjäna in en tillverkningstimme.\n\nStandard: 36 000 skada (baserat på hur många pansarbrytande patroner en monteringsmaskin på grundnivå kan tillverka på en timme).
turrets-contribute-credits=Låt torn bidra till uppgraderingar av sekundära enheter, såsom insättare och elstolpar, på samma yta. Detta kan påskynda uppgraderingar avsevärt sent i spelet med rälsgevär och blixttorn.
enable-defense-walls-and-gates=Aktivera uppgraderingar för murar och grindar.
custom-upgrade-limit-a=Högsta kvalitetsnivå som används av inställningen 'Anpassad A' i gränserna nedan. Behövs endast om du använder ett mod som lägger till kvalitetsnivåer bortom legendarisk och vill begränsa hur högt en enhet kan uppgraderas, till exempel för att låta asteroiduppsamlare nå nivå 10. Ange högsta nivå här, gå sedan till enheten du vill begränsa och välj 'Anpassad A' i rullgardinsmenyn. Som referens är legendarisk nivå 5.
custom-upgrade-limit-b=Högsta kvalitetsnivå som används av Anpassad B i inställningarna för uppgraderingsgränser.
custom-upgrade-limit-c=Högsta kvalitetsnivå som används av Anpassad C i inställningarna för uppgraderingsgränser.
upgrade-limit-accumulators=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-agricultural-towers=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-assembly-machines=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-beacons=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-boilers=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-combinators-and-speakers=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.\n\nInkluderar: aritmetiska kombinatorer, beslutskombinatorer, konstantkombinatorer, programmerbara högtalare.
upgrade-limit-defense-walls-and-gates=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-furnaces=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-generators=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.\n\nInkluderar: ångmaskiner, ångturbiner, fusionsgeneratorer.
upgrade-limit-heat-pipes=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-inserters=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-labs=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-lamps=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-mining-drills=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-poles=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.\n\nInkluderar elstolpar och transformatorstationer.
upgrade-limit-power-switches=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-pumps=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.\n\nInkluderar: kustpumpar och vätskepumpar.
upgrade-limit-reactors=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.\n\nInkluderar: kärnreaktorer, fusionsreaktorer.
upgrade-limit-rocket-silos=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-roboports=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-solar-panels=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.
upgrade-limit-turrets=Högsta uppgraderingskvalitet för dessa enheter. Vanlig inaktiverar uppgraderingar; Anpassad A/B/C använder den anpassade nivå som anges ovan.\n\nInkluderar: ammunitionstorn, lasertorn, eldkastare, artilleritorn.
upgrade-limit-asteroid-collectors=Begränsa asteroiduppsamlare till legendarisk för att förhindra allvarliga spelproblem. Moddade nivåer kan skapa för många armar som rör sig för snabbt, så att de inte kan ta upp asteroidbitar och orsakar stor UPS-belastning.
upgrade-limit-radar=Begränsa radarstationer till legendarisk för att förhindra att sparfilerna sväller. Moddade kvaliteter kan orsaka överdriven kartutforskning och mycket stora filer (över en gigabyte).
upgrade-limit-lightning-rods=Begränsa blixtattraktorer till legendarisk för att förhindra UPS-toppar. Blixtattraktorer med moddade kvalitetsnivåer har avsevärt större täckningsområden, vilket kan orsaka fördröjningstoppar på natten på Fulgora.
upgrade-limit-thrusters=Begränsa rymdraketer till legendarisk för att förhindra oväntade skador på rymdplattformar. Moddade kvalitetsnivåer kan få rymdskepp att röra sig avsevärt snabbare, vilket kan överväldiga deras försvar.

