# Den här översättningen genererades av AI. Korrigeringar är mycket välkomna! Vänligen lämna feedback i modiskussionsforumet (https://mods.factorio.com/mod/quality-control/discussion) eller som ett ärende på github-repot (https://github.com/aarons/factorio-quality-control/issues). Ber om ursäkt för eventuella misstag!

