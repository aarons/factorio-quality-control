[mod-setting-description]
manufacturing-hours-for-change=Antalet tillverkningstimmar som krävs för att ett kvalitetsförsök ska genomföras.\nTillverkningstimmar ackumuleras endast när maskinen arbetar aktivt. Om den står stilla kommer den inte att göra några framsteg.\nMinvärde 0,001 timmar (3,6 sekunder), Maxvärde 1000 timmar.
crafting-speed-affects-progression=Styr om en maskins tillverkningshastighet påverkar hur snabbt den tjänar in tillverkningstimmar.\n\n[color=green]Aktiverad (standard):[/color] Maskiner med högre tillverkningshastighet gör framsteg snabbare. Tillverkningstimmar tjänas in baserat på maskinens tillverkningshastighet och produktivitet. Ett gjuteri med hastighet 4 och 50 % produktivitet gör framsteg sex gånger snabbare än en monteringsmaskin 2 med tillverkningshastighet 1.\n\n[color=red]Inaktiverad:[/color] Tillverkningshastighet har ingen påverkan på framsteg. En timme som spenderas på aktiv tillverkning räknas som en tillverkningstimme, oavsett tillverkningshastighet. Detta tar bort den sammansatta effekten där varje kvalitetsuppgradering snabbar upp nästa.
percentage-chance-of-change=Den procentuella chansen att en kvalitetsförändring kommer att lyckas.\nMinvärde 0,0001%, Maxvärde 100% (ändras alltid efter att tiden har gått)
quality-increase-cost=Detta ökar tiden mellan förändringsförsök per kvalitetsnivå. Detta är en sammansatt formel. Att sätta till 0% kommer att hålla tiden mellan försök densamma oavsett kvalitetsnivå\n\n[color=green]Exempel med 3 tillverkningstimmar behövs vid 50% kostnad per nivå[/color]\n\nNormal: 3 timmar\nOvanlig: 4,5 timmar\nSällsynt: 6,8 timmar\nEpisk: 10,1 timmar\nLegendär: 15,2 timmar\nModdad kvalitetsnivå 10: 173 timmar
quality-chance-accumulation-rate=Styr hur mycket chansen ökar efter varje misslyckat försök.\n\n[color=white]Ingen (Standard):[/color] Ingen ackumulering - chansen förblir konstant.\n\n[color=white]Låg (20%):[/color] Chansen ökar med 20% av grundtakten för varje misslyckande.\n\n[color=white]Medium (50%):[/color] Chansen ökar med 50% av grundtakten för varje misslyckande.\n\n[color=white]Hög (100%):[/color] Chansen ökar med 100% av grundtakten för varje misslyckande.\n\n[color=yellow]Exempel med 1% grundchans:[/color]\n\n[color=white]Låg:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Hög:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nAlla ackumuleringsinställningar garanterar slutligen kvalitetsförändringar - högre inställningar når bara 100% chans snabbare
secondary-progression-rate=Hur snabbt sekundära enheter (inserters, stolpar, beacons - allt som inte kan mäta sitt eget arbete) progredierar, som en procentandel av vad den genomsnittliga primära enheten på samma yta tjänar.\n\n[color=green]100% (standard):[/color] Sekundära enheter avancerar i samma takt som den genomsnittliga monteringsmaskinen, ugnen, silon eller tornet runt omkring dem.\n\nSätt till 0% för att stoppa sekundär progression helt; värden över 100% accelererar infrastrukturuppgraderingar bortom takten för produktionsmaskiner.\n\nKan ändras mitt i spelet utan omstart.
change-modules-with-entity=Detta styr om moduler i maskiner påverkas av kvalitetsförändringar.\n\n[color=white]Inaktiverad (Standard):[/color] Moduler påverkas inte när kvaliteten på värdmaskinen ändras.\n\n[color=white]Aktiverad:[/color] Moduler ändrar kvalitet med en nivå när deras värd ändras. De kommer inte att överskrida värdens kvalitetsnivå.\n\n[color=white]Extra Aktiverad:[/color] Som Aktiverad, men moduler kommer att uppdateras för att matcha sin värdmaskins kvalitet när som helst en kvalitetsförändring inträffar.
batch-entities-per-tick=Antal enheter att bearbeta varje tick för att undvika prestandatoppar.\nMinvärde 1, Maxvärde 1000.\nHögre värden kan orsaka fördröjningstoppar men bearbetar enheter snabbare.
batch-ticks-between-processing=Antal ticks att vänta mellan batch-bearbetningscykler.\nMinvärde 1 tick, Maxvärde 6000 ticks (~2,5 minuter).\nLägre värden bearbetar oftare men kan påverka prestanda.
quality-change-aggregate-alerts-enabled=Visa konsolmeddelanden som sammanfattar alla kvalitetsförändringar (visas en gång var femte minut). Exempel: "3 monteringsmaskiner uppgraderade, 2 insättare uppgraderade"
quality-change-entity-alerts-enabled=Visa kartan pingvarningar på enskilda enheter när deras kvalitet ändras. Klicka på varningen för att visa den uppgraderade enheten.
quality_control_skip_hidden_qualities=Kvalitetskontroll hoppar över dolda kvaliteter (t.ex. shiny-varianter) vid uppgradering. Enheter kommer aldrig att bli shiny genom Kvalitetskontroll - spelare måste skaffa dem på det normala sättet. Denna inställning gäller endast när du har modet Shiny Mechanics quality installerat.
quality_control_hidden_qualities_sticky=Enheter med dolda kvaliteter (t.ex. shiny) kommer inte att uppgraderas ytterligare, vilket bevarar deras unika fördelar. Denna inställning gäller endast när du har modet Shiny Mechanics quality installerat.
enable-accumulators=Aktivera kvalitetsförändringar för ackumulatorer.
enable-agricultural-towers=Aktivera kvalitetsförändringar för jordbrukstorn.
enable-assembly-machines=Aktivera kvalitetsförändringar för monteringsmaskiner.
enable-asteroid-collectors=Aktivera kvalitetsförändringar för asteroiduppsamlare.
asteroid-collector-growth-level-limit=Begränsar asteroiduppsamlarens kvalitetstillväxt till vanilla-värden för att förhindra spelbrytande problem.\n\nAsteroiduppsamlare med moddade kvalitetsnivåer kan ha för många armar som rör sig för snabbt, vilket gör dem oförmögna att ta upp asteroidbitar och skapar ett stort UPS-dränage.\n\n[color=green]Standard: legendarisk[/color]
enable-beacons=Aktivera kvalitetsförändringar för fyrar.
enable-boilers=Aktivera kvalitetsförändringar för pannor.
enable-combinators-and-speakers=Aktivera kvalitetsförändringar för kombinatorer och högtalare.\n\nInkluderar: aritmetiska kombinatorer, beslutkombinatorerna, konstantkombinatorerna, programmeringsbara högtalare.
enable-pumps=Aktivera kvalitetsförändringar för pumpar (inkluderar kustpumpar och vätskepumpar).
enable-furnaces=Aktivera kvalitetsförändringar för ugnar.
enable-generators=Aktivera kvalitetsförändringar för generatorer (ångmaskiner, ångturbiner, fusionsgeneratorer).
enable-heat-pipes=Aktivera kvalitetsförändringar för värmerör.
enable-inserters=Aktivera kvalitetsförändringar för insättare.
enable-labs=Aktivera kvalitetsförändringar för forskningslaboratorier.
enable-lamps=Aktivera kvalitetsförändringar för lampor.
enable-lightning-rods=Aktivera kvalitetsförändringar för blixtstavar.
enable-mining-drills=Aktivera kvalitetsförändringar för alla gruvborrar.
enable-poles=Aktivera kvalitetsförändringar för alla elstolpar (inklusive stora kraftstolpar och transformatorstationer).
enable-power-switches=Aktivera kvalitetsförändringar för strömbrytare.
enable-radar=Aktivera kvalitetsförändringar för radarstationer.
radar-growth-level-limit=Begränsar radarns kvalitetstillväxt för att förhindra överdriven kartutforskning och spara filuppblåsning.\n\nRadar med mycket höga kvalitetsnivåer kan orsaka stora sparfiler (1 200mb+) på grund av överdriven kartutforskning.\n\n[color=green]Standard: legendarisk[/color]
lightning-attractor-growth-level-limit=Begränsar blixtattraktorns kvalitetstillväxt för att förhindra prestandaproblem.\n\nBlixtattraktorer med mycket höga kvalitetsnivåer har avsevärt ökade täckningsområden, vilket kan orsaka fördröjningstoppar på natten på Fulgora.\n\n[color=green]Standard: legendarisk[/color]
enable-reactors=Aktivera kvalitetsförändringar för reaktorer (kärnreaktorer, fusionsreaktorer).
enable-rocket-silos=Aktivera kvalitetsförändringar för raketsilos.
enable-roboports=Aktivera kvalitetsförändringar för robotportar.
enable-solar-panels=Aktivera kvalitetsförändringar för solpaneler.
enable-thrusters=Aktivera kvalitetsförändringar för rymdraketer. Inaktiverad som standard eftersom en oväntad förändring av ett rymdskepps hastighet kan leda till att försvar blir överväldigade.
thruster-growth-level-limit=Begränsar rymdraketens kvalitetstillväxt till vanilla-nivåer för att förhindra försvarsproblem.\n\nModdade kvalitetsnivåer kan flytta rymdskepp avsevärt snabbare, vilket kan överväldiga deras försvar.\n\n[color=green]Standard: legendarisk[/color]
enable-turrets=Aktivera kvalitetsförändringar för torn.\n\nTorn är primära enheter som genererar uppgraderingskrediter baserat på ackumulerad skada som tilldelats.\n\nInkluderar: ammunitionstorn, lasertorn, eldkastare, artilleritorn.
turret-damage-per-manufacturing-hour=Mängden skada ett torn måste tillfoga för att motsvara en tillverkningstimme.\n\nStandard: 36 000 skada (härledd från pansarbrytande patroner: 450 magasin/timme × 80 skada/magasin).\n\nLägre värden gör att torn genererar krediter snabbare.
turrets-contribute-credits=Styr om uppgraderingskrediter som intjänas av torn även bidrar till den delade poolen som uppgraderar sekundära enheter (matare, elstolpar, osv.).\n\n[color=red]Inaktiverad (standard):[/color] Tornets krediter stannar hos tornet. Stridsskada hjälper endast torn att uppgradera sig själva.\n\n[color=green]Aktiverad:[/color] Tornets krediter flödar även till den delade poolen, så stridsskada driver även sekundära enheter framåt på samma sätt som tillverkning gör.
enable-defense-walls-and-gates=Aktivera kvalitetsförändringar för väggar och portar.\n\nInkluderar: väggar, portar.
custom-upgrade-limit-a=Använd detta för att ange anpassade gränser för moddade kvaliteter för enheter. Behövs endast om du har en mod som lägger till kvalitetsnivåer bortom legendarisk och du vill begränsa hur mycket en enhet kan uppgraderas. För att använda denna funktion, ange den högsta nivån här och gå sedan till enheten du vill begränsa och välj 'Anpassad A' i rullgardinsmenyn. Som referens är legendarisk nivå 5 (normal = 1, ovanlig = 2, sällsynt = 3, episk = 4, legendarisk = 5...).
custom-upgrade-limit-b=Använd detta för att ange anpassade gränser för moddade kvaliteter för enheter. Behövs endast om du har en mod som lägger till kvalitetsnivåer bortom legendarisk och du vill begränsa hur mycket en enhet kan uppgraderas. För att använda denna funktion, ange den högsta nivån här och gå sedan till enheten du vill begränsa och välj 'Anpassad B' i rullgardinsmenyn. Som referens är legendarisk nivå 5 (normal = 1, ovanlig = 2, sällsynt = 3, episk = 4, legendarisk = 5...).
custom-upgrade-limit-c=Använd detta för att ange anpassade gränser för moddade kvaliteter för enheter. Behövs endast om du har en mod som lägger till kvalitetsnivåer bortom legendarisk och du vill begränsa hur mycket en enhet kan uppgraderas. För att använda denna funktion, ange den högsta nivån här och gå sedan till enheten du vill begränsa och välj 'Anpassad C' i rullgardinsmenyn. Som referens är legendarisk nivå 5 (normal = 1, ovanlig = 2, sällsynt = 3, episk = 4, legendarisk = 5...).
upgrade-limit-accumulators=Kvalitetskontroll kommer att uppgradera dessa enheter upp till denna kvalitet och sedan sluta försöka uppgradera ytterligare. Ställ in detta på Vanlig för att förhindra alla uppgraderingsförsök. De anpassade värdena använder inställningarna för Anpassad uppgraderingsgräns A/B/C.
upgrade-limit-agricultural-towers=Kvalitetskontroll kommer att uppgradera dessa enheter upp till denna kvalitet och sedan sluta försöka uppgradera ytterligare. Ställ in detta på Vanlig för att förhindra alla uppgraderingsförsök. De anpassade värdena använder inställningarna för Anpassad uppgraderingsgräns A/B/C.
upgrade-limit-assembly-machines=Kvalitetskontroll kommer att uppgradera dessa enheter upp till denna kvalitet och sedan sluta försöka uppgradera ytterligare. Ställ in detta på Vanlig för att förhindra alla uppgraderingsförsök. De anpassade värdena använder inställningarna för Anpassad uppgraderingsgräns A/B/C.
upgrade-limit-beacons=Kvalitetskontroll kommer att uppgradera dessa enheter upp till denna kvalitet och sedan sluta försöka uppgradera ytterligare. Ställ in detta på Vanlig för att förhindra alla uppgraderingsförsök. De anpassade värdena använder inställningarna för Anpassad uppgraderingsgräns A/B/C.
