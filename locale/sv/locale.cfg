upgrade-limit-turrets=Kvalitetskontroll kommer att uppgradera dessa enheter upp till denna kvalitet och sedan sluta försöka uppgradera ytterligare. Ställ in detta på Vanlig för att förhindra alla uppgraderingsförsök. De anpassade värdena använder inställningarna för Anpassad uppgraderingsgräns A/B/C.\n\nInkluderar: ammunitionstorn, lasertorn, eldkastare, artilleritorn.
upgrade-limit-asteroid-collectors=Begränsar asteroiduppsamlarens kvalitetstillväxt till vanilla-värden för att förhindra spelbrytande problem.\n\nAsteroiduppsamlare med moddade kvalitetsnivåer kan ha för många armar som rör sig för snabbt, vilket gör dem oförmögna att ta upp asteroidbitar och skapar ett stort UPS-dränage.\n\n[color=green]Standard: legendarisk[/color]
upgrade-limit-radar=Begränsar radarns kvalitetstillväxt för att förhindra överdriven kartutforskning och spara filuppblåsning.\n\nRadar med mycket höga kvalitetsnivåer kan orsaka stora sparfiler (1 200mb+) på grund av överdriven kartutforskning.\n\n[color=green]Standard: legendarisk[/color]
upgrade-limit-lightning-rods=Begränsar blixtattraktorns kvalitetstillväxt för att förhindra prestandaproblem.\n\nBlixtattraktorer med mycket höga kvalitetsnivåer har avsevärt ökade täckningsområden, vilket kan orsaka fördröjningstoppar på natten på Fulgora.\n\n[color=green]Standard: legendarisk[/color]
upgrade-limit-thrusters=Begränsar rymdraketens kvalitetstillväxt till vanilla-nivåer för att förhindra försvarsproblem.\n\nModdade kvalitetsnivåer kan flytta rymdskepp avsevärt snabbare, vilket kan överväldiga deras försvar.\n\n[color=green]Standard: legendarisk[/color]

