upgrade-limit-defense-walls-and-gates=Kvalitetskontroll kommer att uppgradera dessa enheter upp till denna kvalitet och sedan sluta försöka uppgradera ytterligare. Ställ in detta på Vanlig för att förhindra alla uppgraderingsförsök. De anpassade värdena använder inställningarna för Anpassad uppgraderingsgräns A/B/C.\n\nInkluderar: murar, grindar.
