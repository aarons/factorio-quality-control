[mod-setting-description]
manufacturing-hours-for-change=จำนวนชั่วโมงการผลิตที่จำเป็นสำหรับการพยายามเปลี่ยนแปลงคุณภาพ\nชั่วโมงการผลิตจะสะสมก็ต่อเมื่อเครื่องจักรกำลังทำงานอยู่เท่านั้น หากเครื่องจักรว่างเฉยๆ จะไม่มีความก้าวหน้าเกิดขึ้น\nค่าต่ำสุด 0.001 ชั่วโมง (3.6 วินาที), ค่าสูงสุด 1000 ชั่วโมง
crafting-speed-affects-progression=ควบคุมว่าความเร็วในการผลิตของเครื่องจักรจะส่งผลต่ออัตราการสะสมชั่วโมงการผลิตหรือไม่\n\n[color=green]เปิดใช้งาน (ค่าเริ่มต้น):[/color] เครื่องจักรที่มีความเร็วในการผลิตสูงกว่าจะมีความก้าวหน้าเร็วกว่า ชั่วโมงการผลิตจะถูกสะสมตามความเร็วในการผลิตและประสิทธิภาพการผลิตของเครื่องจักร โรงหลอม (foundry) ที่มีความเร็ว 4 และประสิทธิภาพการผลิต 50% จะมีความก้าวหน้าเร็วกว่าเครื่องประกอบ-2 (assembler-2) ที่มีความเร็วในการผลิต 1 ถึงหกเท่า\n\n[color=red]ปิดใช้งาน:[/color] ความเร็วในการผลิตไม่มีผลต่อความก้าวหน้า หนึ่งชั่วโมงที่ใช้ในการผลิตอย่างต่อเนื่องจะนับเป็นหนึ่งชั่วโมงการผลิต โดยไม่คำนึงถึงความเร็วในการผลิต วิธีนี้จะขจัดผลทบต้นที่การอัปเกรดคุณภาพแต่ละครั้งช่วยเร่งการอัปเกรดครั้งถัดไป
percentage-chance-of-change=เปอร์เซ็นต์โอกาสที่การเปลี่ยนแปลงคุณภาพจะสำเร็จ\nค่าต่ำสุด 0.0001%, ค่าสูงสุด 100% (เปลี่ยนแปลงเสมอหลังจากเวลาผ่านไป)
quality-increase-cost=นี่เพิ่มเวลาระหว่างการพยายามเปลี่ยนแปลงต่อระดับคุณภาพ นี่เป็นสูตรการทบต้น การตั้งค่า 0% จะทำให้เวลาระหว่างการพยายามเท่าเดิมไม่ว่าจะเป็นระดับคุณภาพใด\n\n[color=green]ตัวอย่างด้วย 3 ชั่วโมงการผลิตที่จำเป็นที่ 50% ต้นทุนต่อระดับ[/color]\n\nปกติ: 3 ชั่วโมง\nผิดปกติ: 4.5 ชั่วโมง\nหายาก: 6.8 ชั่วโมง\nมหากาพย์: 10.1 ชั่วโมง\nตำนาน: 15.2 ชั่วโมง\nคุณภาพมอดระดับ 10: 173 ชั่วโมง
quality-chance-accumulation-rate=ควบคุมว่าโอกาสเพิ่มขึ้นเท่าใดหลังจากการพยายามล้มเหลวแต่ละครั้ง\n\n[color=white]ไม่มี (ค่าเริ่มต้น):[/color] ไม่มีการสะสม - โอกาสคงที่\n\n[color=white]ต่ำ (20%):[/color] โอกาสเพิ่มขึ้น 20% ของอัตราฐานแต่ละการล้มเหลว\n\n[color=white]กลาง (50%):[/color] โอกาสเพิ่มขึ้น 50% ของอัตราฐานแต่ละการล้มเหลว\n\n[color=white]สูง (100%):[/color] โอกาสเพิ่มขึ้น 100% ของอัตราฐานแต่ละการล้มเหลว\n\n[color=yellow]ตัวอย่างด้วยโอกาสฐาน 1%:[/color]\n\n[color=white]ต่ำ:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]สูง:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nการตั้งค่าการสะสมทั้งหมดในที่สุดรับประกันการเปลี่ยนแปลงคุณภาพ - การตั้งค่าที่สูงกว่าจะถึง 100% โอกาสได้เร็วกว่า
secondary-progression-rate=ความเร็วในการก้าวหน้าของเอนทิตีรอง (แขนกล เสาไฟฟ้า บีคอน - สิ่งใดก็ตามที่ไม่สามารถวัดผลงานของตัวเองได้) คิดเป็นเปอร์เซ็นต์ของสิ่งที่เอนทิตีหลักโดยเฉลี่ยบนพื้นผิวเดียวกันได้รับ\n\n[color=green]100% (ค่าเริ่มต้น):[/color] เอนทิตีรองจะก้าวหน้าในอัตราเดียวกับเครื่องประกอบ เตาหลอม ไซโล หรือป้อมปืนโดยเฉลี่ยที่อยู่รอบๆ\n\nตั้งค่าเป็น 0% เพื่อหยุดความก้าวหน้าของเอนทิตีรองทั้งหมด ค่าที่สูงกว่า 100% จะเร่งการอัปเกรดโครงสร้างพื้นฐานให้เร็วกว่าอัตราของเครื่องจักรผลิต\n\nสามารถเปลี่ยนแปลงได้ระหว่างเล่นเกมโดยไม่ต้องรีสตาร์ท
change-modules-with-entity=สิ่งนี้ควบคุมว่าโมดูลในเครื่องจักรจะได้รับผลกระทบจากการเปลี่ยนแปลงคุณภาพหรือไม่\n\n[color=white]ปิดใช้งาน (ค่าเริ่มต้น):[/color] โมดูลไม่ได้รับผลกระทบเมื่อคุณภาพของเครื่องโฮสต์เปลี่ยนแปลง\n\n[color=white]เปิดใช้งาน:[/color] โมดูลเปลี่ยนคุณภาพขึ้นหนึ่งระดับเมื่อโฮสต์เปลี่ยนแปลง จะไม่เกินระดับคุณภาพของโฮสต์\n\n[color=white]เปิดใช้งานเพิ่มเติม:[/color] เหมือนการเปิดใช้งาน แต่โมดูลจะได้รับการอัปเดตให้ตรงกับคุณภาพของเครื่องโฮสต์ทุกครั้งที่เกิดการเปลี่ยนแปลงคุณภาพ
batch-entities-per-tick=จำนวนเอนทิตีที่ประมวลผลแต่ละ tick เพื่อหลีกเลี่ยงการกระตุกประสิทธิภาพ\nค่าต่ำสุด 1, ค่าสูงสุด 1000\nค่าที่สูงกว่าอาจทำให้เกิดการกระตุกแต่ประมวลผลเอนทิตีได้เร็วกว่า
batch-ticks-between-processing=จำนวน tick ที่รอระหว่างรอบการประมวลผลแบบแบทช์\nค่าต่ำสุด 1 tick, ค่าสูงสุด 6000 tick (~2.5 นาที)\nค่าที่ต่ำกว่าประมวลผลบ่อยขึ้นแต่อาจส่งผลต่อประสิทธิภาพ
quality-change-aggregate-alerts-enabled=แสดงข้อความคอนโซลสรุปการเปลี่ยนแปลงคุณภาพทั้งหมด (แสดงทุก 5 นาที) ตัวอย่าง: "เครื่องประกอบ 3 เครื่องอัปเกรด, เครื่องใส่วัตถุ 2 เครื่องอัปเกรด"
quality-change-entity-alerts-enabled=แสดงการแจ้งเตือน ping แผนที่บนเอนทิตีแต่ละตัวเมื่อคุณภาพเปลี่ยนแปลง คลิกการแจ้งเตือนเพื่อดูเอนทิตีที่อัปเกรด
quality_control_skip_hidden_qualities=การควบคุมคุณภาพจะข้ามคุณภาพที่ซ่อนอยู่ (เช่น รูปแบบเงางาม) เมื่ออัปเกรด เอนทิตีจะไม่กลายเป็นเงางามผ่านการควบคุมคุณภาพ - ผู้เล่นต้องรับมันด้วยวิธีปกติ การตั้งค่านี้ใช้ได้เฉพาะเมื่อคุณติดตั้งม็อดคุณภาพ Shiny Mechanics
quality_control_hidden_qualities_sticky=เอนทิตีที่มีคุณภาพที่ซ่อนอยู่ (เช่น เงางาม) จะไม่อัปเกรดเพิ่มเติม โดยรักษาผลประโยชน์พิเศษของพวกเขา การตั้งค่านี้ใช้ได้เฉพาะเมื่อคุณติดตั้งม็อดคุณภาพ Shiny Mechanics
enable-accumulators=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับแบตเตอรี่
enable-agricultural-towers=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับหอเกษตรกรรม
enable-assembly-machines=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเครื่องประกอบ
enable-asteroid-collectors=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเครื่องเก็บดาวเคราะห์น้อย
asteroid-collector-growth-level-limit=จำกัดการเติบโตของคุณภาพเครื่องเก็บดาวเคราะห์น้อยเป็นค่าปกติเพื่อป้องกันปัญหาที่ทำลายเกม\n\nเครื่องเก็บดาวเคราะห์น้อยที่มีระดับคุณภาพจากม็อดอาจมีแขนมากเกินไปที่เคลื่อนที่เร็วเกินไป ทำให้ไม่สามารถจับชิ้นส่วนดาวเคราะห์น้อยได้และสร้างการระบาย UPS ขนาดใหญ่\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
enable-beacons=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับผู้ส่งสัญญาณ
enable-boilers=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับหม้อไอน้ำ
enable-combinators-and-speakers=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเครื่องคำนวณและลำโพง\n\nรวม: เครื่องคำนวณเลขคณิต, เครื่องคำนวณตัดสินใจ, เครื่องคำนวณค่าคงที่, ลำโพงโปรแกรมได้
enable-pumps=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับปั๊ม (รวมปั๊มน้ำทะเลและปั๊มของเหลว)
enable-furnaces=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเตาหลอม
enable-generators=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเครื่องกำเนิดไฟฟ้า (เครื่องจักรไอน้ำ, กังหันไอน้ำ, เครื่องกำเนิดไฟฟ้าฟิวชัน)
enable-heat-pipes=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับท่อความร้อน
enable-inserters=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเครื่องใส่วัตถุ
enable-labs=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับห้องปฏิบัติการวิจัย
enable-lamps=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับโคมไฟ
enable-lightning-rods=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเสาล่อฟ้า
enable-mining-drills=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเครื่องขุดแร่ทั้งหมด
enable-poles=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเสาไฟฟ้าทั้งหมด (รวมเสาไฟฟ้าใหญ่และสถานีไฟฟ้า)
enable-power-switches=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับสวิตช์ไฟฟ้า
enable-radar=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับสถานีเรดาร์
radar-growth-level-limit=จำกัดการเติบโตของคุณภาพเรดาร์เพื่อป้องกันการสำรวจแผนที่มากเกินไปและการขยายขนาดไฟล์เซฟ\n\nเรดาร์ที่มีระดับคุณภาพสูงมากสามารถทำให้ไฟล์เซฟขนาดใหญ่ (1,200mb+) เนื่องจากการสำรวจแผนที่มากเกินไป\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
lightning-attractor-growth-level-limit=จำกัดการเติบโตของคุณภาพเครื่องดูดฟ้าผ่าเพื่อป้องกันปัญหาประสิทธิภาพ\n\nเครื่องดูดฟ้าผ่าที่มีระดับคุณภาพสูงมากจะมีพื้นที่ครอบคลุมที่เพิ่มขึ้นอย่างมาก ซึ่งสามารถทำให้เกิดการกระตุกในเวลากลางคืนบน Fulgora\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
enable-reactors=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเครื่องปฏิกรณ์ (เครื่องปฏิกรณ์นิวเคลียร์, เครื่องปฏิกรณ์ฟิวชัน)
enable-rocket-silos=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับไซโลจรวด
enable-roboports=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับท่าจอดหุ่นยนต์
enable-solar-panels=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับแผงโซลาร์เซลล์
enable-thrusters=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับเครื่องขับดันอวกาศ ปิดใช้งานโดยค่าเริ่มต้นเนื่องจากการเปลี่ยนความเร็วยานอวกาศโดยไม่คาดคิดอาจทำให้การป้องกันถูกครอบงำได้
thruster-growth-level-limit=จำกัดการเติบโตของคุณภาพเครื่องขับดันอวกาศเป็นระดับปกติเพื่อป้องกันปัญหาการป้องกัน\n\nระดับคุณภาพจากม็อดสามารถทำให้ยานอวกาศเคลื่อนที่เร็วขึ้นอย่างมีนัยสำคัญ ซึ่งอาจเอาชนะการป้องกันได้\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
enable-turrets=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับป้อมปืน\n\nป้อมปืนเป็นเอนทิตีหลักที่สร้างเครดิตอัปเกรดตามความเสียหายสะสมที่ได้รับ\n\nรวม: ป้อมปืนกระสุน, ป้อมปืนเลเซอร์, เครื่องพ่นไฟ, ป้อมปืนใหญ่
turret-damage-per-manufacturing-hour=จำนวนความเสียหายที่ป้อมปืนต้องจัดการเพื่อเท่ากับหนึ่งชั่วโมงการผลิต\n\nค่าเริ่มต้น: 36,000 ความเสียหาย (มาจากกระสุนเจาะเกราะ: 450 แม็กกาซีน/ชั่วโมง × 80 ความเสียหาย/แม็กกาซีน)\n\nค่าที่ต่ำกว่าทำให้ป้อมปืนสร้างเครดิตเร็วขึ้น ค่าที่สูงกว่าทำให้การสร้างเครดิตช้าลง
enable-defense-walls-and-gates=เปิดใช้การเปลี่ยนแปลงคุณภาพสำหรับกำแพงและประตู\n\nรวม: กำแพง, ประตู
custom-upgrade-limit-a=ใช้สิ่งนี้เพื่อกำหนดขีดจำกัดคุณภาพจากม็อดสำหรับเอนทิตีต่างๆ เอง จำเป็นเฉพาะเมื่อคุณมีม็อดที่เพิ่มระดับคุณภาพเกินกว่าตำนานและต้องการจำกัดว่าเอนทิตีจะอัปเกรดได้มากแค่ไหน หากต้องการใช้ฟีเจอร์นี้ ให้ตั้งค่าระดับสูงสุดที่นี่ จากนั้นไปที่เอนทิตีที่ต้องการจำกัดและเลือก 'Custom A' ในเมนูแบบดรอปดาวน์ เพื่อเป็นข้อมูลอ้างอิง ตำนานคือระดับ 5 (ทั่วไป = 1, ไม่ธรรมดา = 2, หายาก = 3, มหากาพย์ = 4, ตำนาน = 5...)
custom-upgrade-limit-b=ใช้สิ่งนี้เพื่อกำหนดขีดจำกัดคุณภาพจากม็อดสำหรับเอนทิตีต่างๆ เอง จำเป็นเฉพาะเมื่อคุณมีม็อดที่เพิ่มระดับคุณภาพเกินกว่าตำนานและต้องการจำกัดว่าเอนทิตีจะอัปเกรดได้มากแค่ไหน หากต้องการใช้ฟีเจอร์นี้ ให้ตั้งค่าระดับสูงสุดที่นี่ จากนั้นไปที่เอนทิตีที่ต้องการจำกัดและเลือก 'Custom B' ในเมนูแบบดรอปดาวน์ เพื่อเป็นข้อมูลอ้างอิง ตำนานคือระดับ 5 (ทั่วไป = 1, ไม่ธรรมดา = 2, หายาก = 3, มหากาพย์ = 4, ตำนาน = 5...)
custom-upgrade-limit-c=ใช้สิ่งนี้เพื่อกำหนดขีดจำกัดคุณภาพจากม็อดสำหรับเอนทิตีต่างๆ เอง จำเป็นเฉพาะเมื่อคุณมีม็อดที่เพิ่มระดับคุณภาพเกินกว่าตำนานและต้องการจำกัดว่าเอนทิตีจะอัปเกรดได้มากแค่ไหน หากต้องการใช้ฟีเจอร์นี้ ให้ตั้งค่าระดับสูงสุดที่นี่ จากนั้นไปที่เอนทิตีที่ต้องการจำกัดและเลือก 'Custom C' ในเมนูแบบดรอปดาวน์ เพื่อเป็นข้อมูลอ้างอิง ตำนานคือระดับ 5 (ทั่วไป = 1, ไม่ธรรมดา = 2, หายาก = 3, มหากาพย์ = 4, ตำนาน = 5...)
upgrade-limit-accumulators=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-agricultural-towers=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-assembly-machines=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-beacons=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-boilers=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-combinators-and-speakers=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C\n\nรวมถึง: คอมบิเนเตอร์เลขคณิต, คอมบิเนเตอร์ตัดสินใจ, คอมบิเนเตอร์คงที่, ลำโพงตั้งโปรแกรมได้
upgrade-limit-defense-walls-and-gates=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C\n\nรวมถึง: กำแพง, ประตู
upgrade-limit-furnaces=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-generators=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C\n\nรวมถึง: เครื่องยนต์ไอน้ำ, กังหันไอน้ำ, เครื่องกำเนิดไฟฟ้าฟิวชัน
upgrade-limit-heat-pipes=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-inserters=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-labs=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-lamps=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-mining-drills=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-poles=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C\n\nรวมถึง: เสาไฟฟ้าทุกชนิด, เสาไฟฟ้าใหญ่ และสถานีไฟฟ้าย่อย
upgrade-limit-power-switches=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-pumps=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C\n\nรวมถึง: ปั๊มน้ำนอกชายฝั่งและปั๊มของเหลว
upgrade-limit-reactors=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C\n\nรวมถึง: เครื่องปฏิกรณ์นิวเคลียร์, เครื่องปฏิกรณ์ฟิวชัน
upgrade-limit-rocket-silos=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-roboports=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-solar-panels=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C
upgrade-limit-turrets=ควบคุมคุณภาพจะอัปเกรดเอนทิตีเหล่านี้จนถึงคุณภาพนี้ จากนั้นจะหยุดพยายามอัปเกรดต่อไป ตั้งค่าเป็นทั่วไปเพื่อป้องกันการพยายามอัปเกรดใดๆ ค่ากำหนดเองจะใช้การตั้งค่าขีดจำกัดการอัปเกรดกำหนดเอง A/B/C\n\nรวมถึง: ป้อมปืนกระสุน, ป้อมปืนเลเซอร์, เครื่องพ่นไฟ, ป้อมปืนใหญ่
upgrade-limit-asteroid-collectors=จำกัดการเติบโตของคุณภาพเครื่องเก็บดาวเคราะห์น้อยเป็นค่าปกติเพื่อป้องกันปัญหาที่ทำลายเกม\n\nเครื่องเก็บดาวเคราะห์น้อยที่มีระดับคุณภาพจากม็อดอาจมีแขนมากเกินไปที่เคลื่อนที่เร็วเกินไป ทำให้ไม่สามารถจับชิ้นส่วนดาวเคราะห์น้อยได้และสร้างการระบาย UPS ขนาดใหญ่\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
upgrade-limit-radar=จำกัดการเติบโตของคุณภาพเรดาร์เพื่อป้องกันการสำรวจแผนที่มากเกินไปและการขยายขนาดไฟล์เซฟ\n\nเรดาร์ที่มีระดับคุณภาพสูงมากสามารถทำให้ไฟล์เซฟขนาดใหญ่ (1,200mb+) เนื่องจากการสำรวจแผนที่มากเกินไป\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
upgrade-limit-lightning-rods=จำกัดการเติบโตของคุณภาพเครื่องดูดฟ้าผ่าเพื่อป้องกันปัญหาประสิทธิภาพ\n\nเครื่องดูดฟ้าผ่าที่มีระดับคุณภาพสูงมากจะมีพื้นที่ครอบคลุมที่เพิ่มขึ้นอย่างมาก ซึ่งสามารถทำให้เกิดการกระตุกในเวลากลางคืนบน Fulgora\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
upgrade-limit-thrusters=จำกัดการเติบโตของคุณภาพเครื่องขับดันอวกาศเป็นระดับปกติเพื่อป้องกันปัญหาการป้องกัน\n\nระดับคุณภาพจากม็อดสามารถทำให้ยานอวกาศเคลื่อนที่เร็วขึ้นอย่างมีนัยสำคัญ ซึ่งอาจเอาชนะการป้องกันได้\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]

