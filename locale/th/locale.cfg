[mod-setting-description]
manufacturing-hours-for-change=จำนวนชั่วโมงการผลิตที่จำเป็นสำหรับการพยายามเปลี่ยนแปลงคุณภาพ\nชั่วโมงการผลิตจะสะสมก็ต่อเมื่อเครื่องจักรกำลังทำงานอยู่เท่านั้น หากเครื่องจักรว่างเฉยๆ จะไม่มีความก้าวหน้าเกิดขึ้น\nค่าต่ำสุด 0.001 ชั่วโมง (3.6 วินาที), ค่าสูงสุด 1000 ชั่วโมง
crafting-speed-affects-progression=[color=green]เปิดใช้งาน:[/color] ความเร็วในการผลิตและประสิทธิภาพการผลิตเพิ่มชั่วโมงการผลิตที่ได้รับ ความเร็ว 4 ที่มีประสิทธิภาพการผลิต 50% จะได้รับชั่วโมงการผลิตมากกว่าความเร็ว 1 ที่ไม่มีโบนัสประสิทธิภาพการผลิตถึงหกเท่า\n\n[color=red]ปิดใช้งาน:[/color] ความเร็วในการผลิตไม่มีผลต่อความก้าวหน้า
percentage-chance-of-change=โอกาสที่การพยายามอัปเกรดจะสำเร็จ
quality-increase-cost=ชั่วโมงการผลิตที่ต้องการเพิ่มขึ้นต่อระดับคุณภาพ โดยเพิ่มขึ้นแบบทบต้น ตั้งค่า 0% เพื่อให้ทุกระดับต้องการชั่วโมงเท่ากัน\n\nที่ 50% หากเริ่มต้นที่ 3 ชั่วโมง ระดับไม่ธรรมดาจะต้องการ 4.5 ชั่วโมง และระดับหายากจะต้องการ 6.75 ชั่วโมง
quality-chance-accumulation-rate=เพิ่มโอกาสอัปเกรดหลังจากพยายามล้มเหลว โดยคิดเป็นเปอร์เซ็นต์ของโอกาสฐาน\n\n[color=white]ไม่มี:[/color] โอกาสคงที่\n[color=white]ต่ำ:[/color] เพิ่ม 20% ของโอกาสฐาน\n[color=white]กลาง:[/color] เพิ่ม 50% ของโอกาสฐาน\n[color=white]สูง:[/color] เพิ่ม 100% ของโอกาสฐาน\n\nหากโอกาสฐานเป็น 1% ระดับต่ำจะได้ 1% → 1.2% → 1.4%... และระดับสูงจะได้ 1% → 2% → 3%...
secondary-progression-rate=ความเร็วในการก้าวหน้าของเอนทิตีที่ไม่สามารถวัดผลงานของตัวเองได้ เช่น แขนกล เสาไฟฟ้า และบีคอน\n\n100% เท่ากับชั่วโมงการผลิตเฉลี่ยที่เอนทิตีหลักบนพื้นผิวเดียวกันได้รับ ค่าที่สูงขึ้นจะเร่งความก้าวหน้า ส่วน 0% จะหยุดความก้าวหน้า
change-modules-with-entity=[color=white]ปิดใช้งาน:[/color] โมดูลจะไม่อัปเกรด\n\n[color=white]เปิดใช้งาน:[/color] โมดูลจะอัปเกรดหนึ่งระดับเมื่อเครื่องจักรอัปเกรด โดยไม่เกินคุณภาพของเครื่องจักร\n\n[color=white]เปิดใช้งานเพิ่มเติม:[/color] โมดูลจะอัปเกรดให้ตรงกับคุณภาพใหม่ของเครื่องจักร\n\n[color=white]อิสระ:[/color] โมดูลจะได้รับโอกาสพยายามอัปเกรดของตัวเองจากความก้าวหน้ารอง และสามารถเกินขีดจำกัดคุณภาพของเครื่องจักรได้ การตั้งขีดจำกัดเครื่องจักรเป็นทั่วไปจะปิดการอัปเกรดโมดูลด้วย
batch-entities-per-tick=จำนวนเอนทิตีที่ประมวลผลต่อแบทช์ แบทช์ที่ใหญ่ขึ้นประมวลผลการอัปเกรดได้เร็วขึ้น แต่อาจทำให้กระตุก ช่องโมดูลจะถูกนับด้วยในโหมดอิสระ
batch-ticks-between-processing=จำนวน Tick ระหว่างการประมวลผลแต่ละแบทช์ ช่วงเวลาที่สั้นลงจะประมวลผลการอัปเกรดบ่อยขึ้น แต่อาจลดประสิทธิภาพ
quality-change-aggregate-alerts-enabled=แสดงข้อความสรุปการอัปเกรดทุก 5 นาที
quality-change-entity-alerts-enabled=แสดงไอคอนแจ้งเตือนบนแผนที่ ณ ตำแหน่งที่อัปเกรด
quality-change-chat-enabled=แสดงข้อความอัปเกรดพร้อมไอคอนเอนทิตีหรือโมดูล ไอคอนคุณภาพ และตัวอักษรสีรุ้งแบบสุ่ม
quality-change-gps-enabled=แสดงลิงก์ตำแหน่งที่คลิกได้และส่ง Ping GPS บนแผนที่ของ Factorio สำหรับการอัปเกรดแต่ละครั้ง คลิกลิงก์เพื่อกลับไปดูตำแหน่ง หากเปิดแชตอัปเกรดหลากสี ลิงก์จะปรากฏในข้อความนั้น มิฉะนั้นจะแสดงเฉพาะลิงก์ Ping GPS ของเกมต้องใช้ลิงก์ในแชต
quality-change-floating-text-enabled=แสดงข้อความอัปเกรดลอยขึ้นด้วยสีของคุณภาพใหม่
quality-change-halo-enabled=แสดงรัศมีที่ขยายออกด้วยสีของคุณภาพใหม่ ณ ตำแหน่งที่อัปเกรด
quality-change-rainbow-enabled=แสดงวงแหวนสีรุ้งที่ขยายออก ณ ตำแหน่งที่อัปเกรด
quality-change-badge-enabled=แสดงไอคอนคุณภาพใหม่ขยายใหญ่และลอยขึ้นเป็นเวลา 4.5 วินาที โดยหมุนต่อเนื่องจนจางหาย
quality-change-bubbles-enabled=ปล่อยไอคอนคุณภาพใหม่ขนาดเล็กลอยขึ้นต่อเนื่องเหมือนฟองอากาศ ณ ตำแหน่งที่อัปเกรด
quality-change-sound-enabled=เล่นเสียงที่เลือกเมื่อมีการอัปเกรดบนพื้นผิวที่กำลังดูอยู่ รวมถึงมุมมองระยะไกล
quality-change-sound=เลือกเสียงเอฟเฟกต์แจ้งเตือน สัญญาณเตือนของลำโพง เสียงกลอง หรือเครื่องดนตรี เครื่องดนตรีจะใช้การตั้งค่าโน้ตเครื่องดนตรี / โน้ตหลักและรูปแบบโน้ตของการอัปเกรด เสียงจะเล่นเมื่อเปิดเสียงอัปเกรดและมีการอัปเกรดบนพื้นผิวที่กำลังดูอยู่เท่านั้น
quality-change-sound-note=โน้ตคงที่ หรือโน้ตหลัก (คีย์และช่วงเสียงเริ่มต้น) สำหรับรูปแบบดนตรี ไม่มีผลกับสัญญาณเตือน กลอง เอฟเฟกต์ และโหมดสุ่มทั้งหมด\nโน้ตสูงขึ้นทีละครึ่งเสียงจาก F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; เพิ่ม 12 เพื่อขึ้นหนึ่งอ็อกเทฟ ค่าเริ่มต้น: 20 (C)\nเปียโนมี 48 โน้ต เครื่องดนตรีอื่นมี 36 โน้ต โหมดคงที่จะจำกัดไว้ที่โน้ตสูงสุดที่มี รูปแบบดนตรีจะเลื่อนลงครั้งละหนึ่งอ็อกเทฟเมื่อจำเป็นเพื่อให้อยู่ในช่วงเสียงโดยรักษาคีย์เดิม การตั้งค่าเดียวกันจะให้รูปแบบเทียบเท่ากันในช่วงเสียงของเครื่องดนตรีแต่ละชนิด
quality-change-sound-mode=เล่นหนึ่งโน้ตต่อการอัปเกรดที่ได้ยิน โดยผู้เล่นแต่ละคนมีรูปแบบแยกกัน โน้ตคงที่จะใช้โน้ตที่เลือก ทำนองเคลื่อนที่เลื่อนหนึ่งหรือสองขั้นในบันไดเสียง กระดิ่งลมสุ่มโน้ตจากบันไดเสียงเมเจอร์เพนทาโทนิก ขั้นบันไดไล่โน้ตขึ้นแล้วลงซ้ำๆ สุ่มในบันไดเสียงเลือกโน้ตใดก็ได้ในบันไดเสียงและช่วงเสียงที่เลือก ส่วนสุ่มทั้งหมดใช้ช่วงเสียงทั้งหมดของเครื่องดนตรี\nทำนองเคลื่อนที่และขั้นบันไดเริ่มที่โน้ตหลักและเล่นต่อจากเดิมหลังช่วงเงียบและการบันทึก/โหลด ไม่มีการจัดคิวโน้ตเพื่อเล่นภายหลัง มีผลเฉพาะกับเครื่องดนตรี
quality-change-sound-scale=บันไดเสียงเทียบกับโน้ตเครื่องดนตรี / โน้ตหลักของการอัปเกรด ใช้กับทำนองเคลื่อนที่ ขั้นบันได และสุ่มในบันไดเสียง โครมาติกใช้ได้ทุกครึ่งเสียง กระดิ่งลมใช้เมเจอร์เพนทาโทนิกเสมอ ส่วนโน้ตคงที่และสุ่มทั้งหมดไม่ใช้การตั้งค่านี้
quality-change-sound-range=หนึ่งหรือสองอ็อกเทฟเริ่มจากโน้ตหลัก โดยเลื่อนลงครั้งละหนึ่งอ็อกเทฟหากจำเป็นเพื่อให้อยู่ในช่วงเสียงของเครื่องดนตรี หรือใช้ช่วงเสียงทั้งหมดของเครื่องดนตรี ใช้กับทำนองเคลื่อนที่ กระดิ่งลม ขั้นบันได และสุ่มในบันไดเสียง ส่วนโน้ตคงที่และสุ่มทั้งหมดไม่ใช้การตั้งค่านี้
quality_control_skip_hidden_qualities=ข้ามคุณภาพที่ซ่อนอยู่ (เช่น รูปแบบเงางาม) เมื่ออัปเกรด การตั้งค่านี้ใช้ได้เฉพาะเมื่อคุณติดตั้งม็อดอย่าง Shiny Mechanics
quality_control_hidden_qualities_sticky==เอนทิตีที่มีคุณภาพที่ซ่อนอยู่ (เช่น เงางาม) จะไม่อัปเกรดเพิ่มเติม เพื่อรักษาประโยชน์พิเศษไว้ การตั้งค่านี้ใช้ได้เฉพาะเมื่อคุณติดตั้งม็อดอย่าง Shiny Mechanics
enable-accumulators=เปิดใช้การอัปเกรดสำหรับแบตเตอรี่
enable-agricultural-towers=เปิดใช้การอัปเกรดสำหรับหอเกษตรกรรม
enable-assembly-machines=เปิดใช้การอัปเกรดสำหรับเครื่องประกอบ
enable-asteroid-collectors=เปิดใช้การอัปเกรดสำหรับเครื่องเก็บดาวเคราะห์น้อย
asteroid-collector-growth-level-limit=จำกัดการเติบโตของคุณภาพเครื่องเก็บดาวเคราะห์น้อยเป็นค่าปกติเพื่อป้องกันปัญหาที่ทำลายเกม\n\nเครื่องเก็บดาวเคราะห์น้อยที่มีระดับคุณภาพจากม็อดอาจมีแขนมากเกินไปที่เคลื่อนที่เร็วเกินไป ทำให้ไม่สามารถจับชิ้นส่วนดาวเคราะห์น้อยได้และสร้างการระบาย UPS ขนาดใหญ่\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
enable-beacons=เปิดใช้การอัปเกรดสำหรับผู้ส่งสัญญาณ
enable-boilers=เปิดใช้การอัปเกรดสำหรับหม้อไอน้ำ
enable-combinators-and-speakers=เปิดใช้การอัปเกรดสำหรับเครื่องคำนวณและลำโพงตั้งโปรแกรมได้
enable-pumps=เปิดใช้การอัปเกรดสำหรับปั๊มน้ำทะเลและปั๊มของเหลว
enable-furnaces=เปิดใช้การอัปเกรดสำหรับเตาหลอม
enable-generators=เปิดใช้การอัปเกรดสำหรับเครื่องจักรไอน้ำ กังหันไอน้ำ และเครื่องกำเนิดไฟฟ้าฟิวชัน
enable-heat-pipes=เปิดใช้การอัปเกรดสำหรับท่อความร้อน
enable-inserters=เปิดใช้การอัปเกรดสำหรับเครื่องใส่วัตถุ
enable-labs=เปิดใช้การอัปเกรดสำหรับห้องปฏิบัติการวิจัย
enable-lamps=เปิดใช้การอัปเกรดสำหรับโคมไฟ
enable-lightning-rods=เปิดใช้การอัปเกรดสำหรับเสาล่อฟ้า
enable-mining-drills=เปิดใช้การอัปเกรดสำหรับเครื่องขุดแร่
enable-poles=เปิดใช้การอัปเกรดสำหรับเสาไฟฟ้าและสถานีไฟฟ้าย่อย
enable-power-switches=เปิดใช้การอัปเกรดสำหรับสวิตช์ไฟฟ้า
enable-radar=เปิดใช้การอัปเกรดสำหรับสถานีเรดาร์
radar-growth-level-limit=จำกัดการเติบโตของคุณภาพเรดาร์เพื่อป้องกันการสำรวจแผนที่มากเกินไปและการขยายขนาดไฟล์เซฟ\n\nเรดาร์ที่มีระดับคุณภาพสูงมากสามารถทำให้ไฟล์เซฟขนาดใหญ่ (1,200mb+) เนื่องจากการสำรวจแผนที่มากเกินไป\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
lightning-attractor-growth-level-limit=จำกัดการเติบโตของคุณภาพเครื่องดูดฟ้าผ่าเพื่อป้องกันปัญหาประสิทธิภาพ\n\nเครื่องดูดฟ้าผ่าที่มีระดับคุณภาพสูงมากจะมีพื้นที่ครอบคลุมที่เพิ่มขึ้นอย่างมาก ซึ่งสามารถทำให้เกิดการกระตุกในเวลากลางคืนบน Fulgora\n\n[color=green]ค่าเริ่มต้น: ตำนาน[/color]
enable-reactors=เปิดใช้การอัปเกรดสำหรับเครื่องปฏิกรณ์นิวเคลียร์และฟิวชัน
enable-rocket-silos=เปิดใช้การอัปเกรดสำหรับไซโลจรวด
enable-roboports=เปิดใช้การอัปเกรดสำหรับท่าจอดหุ่นยนต์
enable-solar-panels=เปิดใช้การอัปเกรดสำหรับแผงโซลาร์เซลล์
enable-thrusters=เปิดใช้การอัปเกรดสำหรับเครื่องขับดันอวกาศ ยานที่เร็วขึ้นอาจทำให้ระบบป้องกันรับมือไม่ไหว
thruster-growth-level-limit=เลือกจำกัดเครื่องขับดันอวกาศไว้ที่ระดับของเกมปกติได้ ระดับคุณภาพจากม็อดอาจทำให้ยานอวกาศเคลื่อนที่เร็วขึ้นมากจนระบบป้องกันรับมือไม่ไหว
enable-turrets=เปิดใช้การอัปเกรดสำหรับป้อมปืนกระสุน ป้อมปืนเลเซอร์ ป้อมพ่นไฟ และป้อมปืนใหญ่ ป้อมปืนจะได้รับ 'ชั่วโมงการผลิต' จากการสร้างความเสียหาย
turret-damage-per-manufacturing-hour=จำนวนความเสียหายที่ป้อมปืนต้องสร้างเพื่อรับหนึ่งชั่วโมงการผลิต\n\nค่าเริ่มต้น: ความเสียหาย 36,000 (คำนวณจากป้อมปืนระดับพื้นฐานที่ยิงกระสุนเจาะเกราะต่อเนื่องเป็นเวลาหนึ่งชั่วโมง)
turrets-contribute-credits=ให้ป้อมปืนมีส่วนช่วยอัปเกรดเอนทิตีรอง เช่น แขนกลและเสาไฟฟ้า บนพื้นผิวเดียวกัน ในช่วงท้ายเกม ปืนรางและป้อมสายฟ้าอาจเร่งการอัปเกรดได้อย่างมาก
enable-defense-walls-and-gates=เปิดใช้การอัปเกรดสำหรับกำแพงและประตู
custom-upgrade-limit-a=ระดับคุณภาพสูงสุดที่ใช้โดยการตั้งค่า 'Custom A' ในตัวจำกัดด้านล่าง จำเป็นเฉพาะเมื่อใช้ม็อดที่เพิ่มระดับคุณภาพเกินกว่าตำนานและต้องการจำกัดระดับที่เอนทิตีอัปเกรดได้ เช่น ต้องการให้เครื่องเก็บดาวเคราะห์น้อยอัปเกรดได้ถึงระดับ 10 หากต้องการใช้ ให้ตั้งระดับสูงสุดที่นี่ แล้วไปที่เอนทิตีที่ต้องการจำกัดและเลือก 'Custom A' ในเมนูแบบดรอปดาวน์ โดยระดับตำนานคือระดับ 5
custom-upgrade-limit-b=ระดับคุณภาพสูงสุดที่ Custom B ใช้ในการตั้งค่าขีดจำกัดการอัปเกรด
custom-upgrade-limit-c=ระดับคุณภาพสูงสุดที่ Custom C ใช้ในการตั้งค่าขีดจำกัดการอัปเกรด
upgrade-limit-accumulators=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-agricultural-towers=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-assembly-machines=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-beacons=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-boilers=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-combinators-and-speakers=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น\n\nรวมถึง: คอมบิเนเตอร์เลขคณิต, คอมบิเนเตอร์ตัดสินใจ, คอมบิเนเตอร์คงที่, ลำโพงตั้งโปรแกรมได้
upgrade-limit-defense-walls-and-gates=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-furnaces=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-generators=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น\n\nรวมถึง: เครื่องยนต์ไอน้ำ, กังหันไอน้ำ, เครื่องกำเนิดไฟฟ้าฟิวชัน
upgrade-limit-heat-pipes=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-inserters=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-labs=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-lamps=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-mining-drills=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-poles=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น\n\nรวมถึงเสาไฟฟ้าและสถานีไฟฟ้าย่อย
upgrade-limit-power-switches=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-pumps=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น\n\nรวมถึง: ปั๊มน้ำทะเลและปั๊มของเหลว
upgrade-limit-reactors=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น\n\nรวมถึง: เครื่องปฏิกรณ์นิวเคลียร์, เครื่องปฏิกรณ์ฟิวชัน
upgrade-limit-rocket-silos=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-roboports=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-solar-panels=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น
upgrade-limit-turrets=คุณภาพสูงสุดที่เอนทิตีเหล่านี้อัปเกรดได้ ทั่วไปจะปิดการอัปเกรด ส่วน Custom A/B/C จะใช้ระดับที่กำหนดไว้ข้างต้น\n\nรวมถึง: ป้อมปืนกระสุน, ป้อมปืนเลเซอร์, เครื่องพ่นไฟ, ป้อมปืนใหญ่
upgrade-limit-asteroid-collectors=จำกัดเครื่องเก็บดาวเคราะห์น้อยไว้ที่ระดับตำนานเพื่อป้องกันปัญหาร้ายแรงในเกม ระดับจากม็อดอาจสร้างแขนมากเกินไปและเคลื่อนที่เร็วเกินไปจนจับชิ้นส่วนดาวเคราะห์น้อยไม่ได้ และทำให้ UPS ลดลงอย่างมาก
upgrade-limit-radar=จำกัดเรดาร์ไว้ที่ระดับตำนานเพื่อป้องกันไฟล์เซฟขยายใหญ่ คุณภาพจากม็อดอาจทำให้สำรวจแผนที่มากเกินไปจนไฟล์มีขนาดใหญ่มาก (เกินหนึ่งกิกะไบต์)
upgrade-limit-lightning-rods=จำกัดเครื่องดูดฟ้าผ่าไว้ที่ระดับตำนานเพื่อป้องกันปัญหา UPS เครื่องดูดฟ้าผ่าที่มีระดับคุณภาพจากม็อดจะมีพื้นที่ครอบคลุมเพิ่มขึ้นอย่างมาก ซึ่งอาจทำให้เกิดการกระตุกในเวลากลางคืนบน Fulgora
upgrade-limit-thrusters=จำกัดเครื่องขับดันอวกาศไว้ที่ระดับตำนานเพื่อป้องกันความเสียหายที่ไม่คาดคิดต่อแพลตฟอร์มอวกาศ ระดับคุณภาพจากม็อดอาจทำให้ยานอวกาศเคลื่อนที่เร็วขึ้นมากจนระบบป้องกันรับมือไม่ไหว

