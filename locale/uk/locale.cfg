[mod-setting-description]
manufacturing-hours-for-change=Кількість годин виробництва, необхідних для спроби зміни якості.\nГодини виробництва визначаються кількістю створених предметів, помноженою на тривалість рецепту.\nМін. значення 0.001 годин (3.6 секунд), Макс. значення 1000 годин.
percentage-chance-of-change=Відсоткова ймовірність успішної зміни якості.\nМін. значення 0.0001%, Макс. значення 100% (завжди змінюється після проходження часу)
quality-increase-cost=Це збільшує час між спробами змін за рівень якості. Це складна формула. Встановлення 0% зберігатиме той самий час між спробами незалежно від рівня якості\n\n[color=green]Приклад з 3 годинами виробництва за 50% вартості на рівень[/color]\n\nЗвичайний: 3 години\nНезвичайний: 4.5 годин\nРідкісний: 6.8 годин\nЕпічний: 10.1 годин\nЛегендарний: 15.2 годин\nМодифікована якість рівень 10: 173 години
quality-chance-accumulation-rate=Контролює, наскільки збільшується шанс після кожної невдалої спроби.\n\n[color=white]Жодного (За замовчуванням):[/color] Без накопичення - шанс залишається постійним.\n\n[color=white]Низький (20%):[/color] Шанс збільшується на 20% базової швидкості з кожною невдачею.\n\n[color=white]Середній (50%):[/color] Шанс збільшується на 50% базової швидкості з кожною невдачею.\n\n[color=white]Високий (100%):[/color] Шанс збільшується на 100% базової швидкості з кожною невдачею.\n\n[color=yellow]Приклад з 1% базовим шансом:[/color]\n\n[color=white]Низький:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]Високий:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nВсі налаштування накопичення врешті-решт гарантують зміни якості - вищі налаштування просто швидше досягають 100% шансу
accumulate-at-max-quality=Складальні машини максимальної якості все ще сприяють:\nКоли увімкнено, складальні машини та печі максимальної якості продовжуватимуть відстежувати години виробництва та генерувати кредити покращень для вторинних об'єктів (як-от маніпулятори, маяки тощо), навіть якщо вони самі не можуть більше покращуватися.\n\n[color=green]Увімкнено (за замовчуванням):[/color] Складальні машини максимальної якості продовжують генерувати кредити покращень для вторинних об'єктів. Це може забезпечити стабільний прогрес для вторинних об'єктів у пізній грі.\n\n[color=red]Вимкнено:[/color] Лише складальні машини та печі низької якості, які все ще можуть покращуватися, генерують кредити, але вони генеруються як співвідношення до вторинних об'єктів, які все ще потребують покращень. В екстремальному випадку це означає, що одна складальна машина низької якості може просунути всі вторинні об'єкти заводу.
change-modules-with-entity=Це контролює, чи впливають зміни якості на модулі в машинах.\n\n[color=white]Вимкнено (За замовчуванням):[/color] Модулі не впливають, коли якість машини-хоста змінюється.\n\n[color=white]Увімкнено:[/color] Модулі змінюють якість на один рівень, коли їх хост змінюється. Вони не перевищуватимуть рівень якості хоста.\n\n[color=white]Додатково увімкнено:[/color] Як увімкнено, але модулі будуть оновлені відповідно до якості їх машини-хоста кожного разу, коли відбувається зміна якості.
batch-entities-per-tick=Кількість об'єктів для обробки кожен тік, щоб уникнути сплесків продуктивності.\nМін. значення 1, Макс. значення 1000.\nВищі значення можуть викликати сплески затримок, але обробляють об'єкти швидше.
batch-ticks-between-processing=Кількість тіків очікування між циклами пакетної обробки.\nМін. значення 1 тік, Макс. значення 6000 тіків (~2.5 хвилин).\nНижчі значення обробляють частіше, але можуть впливати на продуктивність.
quality-change-aggregate-alerts-enabled=Показувати повідомлення консолі з підсумком всіх змін якості (відображаються раз на 5 хвилин). Приклад: "3 складальні машини покращено, 2 маніпулятори покращено"
quality-change-entity-alerts-enabled=Показувати пінг-повідомлення на карті для окремих об'єктів, коли їх якість змінюється. Натисніть повідомлення, щоб переглянути покращений об'єкт.
quality_control_skip_hidden_qualities=Контроль Якості пропускатиме приховані якості (наприклад, блискучі варіанти) під час покращення. Об'єкти ніколи не стануть блискучими через Контроль Якості - гравці повинні отримати їх звичайним способом. Це налаштування застосовується лише якщо у вас встановлено мод Shiny Mechanics quality.
quality_control_hidden_qualities_sticky=Об'єкти з прихованими якостями (наприклад, блискучі) не покращуватимуться далі, зберігаючи свої унікальні переваги. Це налаштування застосовується лише якщо у вас встановлено мод Shiny Mechanics quality.
enable-accumulators=Увімкнути зміни якості для акумуляторів.
enable-agricultural-towers=Увімкнути зміни якості для сільськогосподарських веж.
enable-assembly-machines=Увімкнути зміни якості для складальних машин.
enable-asteroid-collectors=Увімкнути зміни якості для збирачів астероїдів.
asteroid-collector-growth-level-limit=Обмежує зростання якості збирачів астероїдів до ванільних значень для запобігання критичним проблемам гри.\n\nЗбирачі астероїдів з модифікованими рівнями якості можуть мати забагато рук, що рухаються надто швидко, — через це вони стають нездатними захоплювати шматки астероїдів і створюють значне навантаження на UPS.\n\n[color=green]За замовчуванням: рівень 5 (легендарний)[/color]\n[color=yellow]Діапазон: 1-255 рівнів якості[/color]
enable-beacons=Увімкнути зміни якості для маяків.
enable-boilers=Увімкнути зміни якості для котлів.
enable-combinators-and-speakers=Увімкнути зміни якості для комбінаторів та динаміків.\n\nВключає: арифметичні комбінатори, комбінатори рішень, постійні комбінатори, програмовані динаміки.
enable-pumps=Увімкнути зміни якості для насосів (включає берегові насоси та рідинні насоси).
enable-furnaces=Увімкнути зміни якості для печей.
enable-generators=Увімкнути зміни якості для генераторів (парові двигуни, парові турбіни, термоядерні генератори).
enable-heat-pipes=Увімкнути зміни якості для теплових труб.
enable-inserters=Увімкнути зміни якості для маніпуляторів.
enable-labs=Увімкнути зміни якості для дослідницьких лабораторій.
enable-lamps=Увімкнути зміни якості для ламп.
enable-lightning-rods=Увімкнути зміни якості для блискавковідводів.
enable-mining-drills=Увімкнути зміни якості для всіх видобувних бурів.
enable-poles=Увімкнути зміни якості для всіх електричних стовпів (включаючи великі стовпи живлення та підстанції).
enable-power-switches=Увімкнути зміни якості для вимикачів живлення.
enable-radar=Увімкнути зміни якості для радарних станцій.
radar-growth-level-limit=Обмежує зростання якості радару для запобігання надмірному дослідженню карти та роздуванню файлу збереження.\n\nРадари з дуже високими рівнями якості можуть спричинити великі файли збереження (1,200мб+) через надмірне дослідження карти.\n\n[color=green]За замовчуванням: рівень 5 (легендарний)[/color]\n[color=yellow]Діапазон: 1-255 рівнів якості[/color]
lightning-attractor-growth-level-limit=Обмежує зростання якості блискавкопритягувачів для запобігання проблемам продуктивності.\n\nБлискавкопритягувачі з дуже високими рівнями якості мають значно збільшені зони покриття, що може спричинити сплески затримок вночі на Фулгорі.\n\n[color=green]За замовчуванням: рівень 5 (легендарний)[/color]\n[color=yellow]Діапазон: 1-255 рівнів якості[/color]
enable-reactors=Увімкнути зміни якості для реакторів (ядерні реактори, термоядерні реактори).
enable-rocket-silos=Увімкнути зміни якості для ракетних шахт.
enable-roboports=Увімкнути зміни якості для робопортів.
enable-solar-panels=Увімкнути зміни якості для сонячних панелей.
enable-thrusters=Увімкнути зміни якості для космічних двигунів. Вимкнено за замовчуванням, оскільки несподівана зміна швидкості космічного корабля може призвести до перевантаження систем захисту.
thruster-growth-level-limit=Обмежує зростання якості космічних двигунів до ванільних рівнів для запобігання проблемам із захистом.\n\nМодифіковані рівні якості можуть переміщувати космічні кораблі значно швидше, що здатне перевантажити їх системи захисту.\n\n[color=green]За замовчуванням: рівень 5 (легендарний)[/color]\n[color=yellow]Діапазон: 1-255 рівнів якості[/color]
enable-turrets=Увімкнути зміни якості для турелей.\n\nТурелі є первинними об'єктами, які генерують кредити покращень на основі накопиченого завданого пошкодження.\n\nВключає: турелі з боєприпасами, лазерні турелі, вогнемети, артилерійські турелі.
turret-damage-per-manufacturing-hour=Кількість пошкоджень, яку турель повинна завдати, щоб дорівнювати одній годині виробництва.\n\nЗа замовчуванням: 36 000 пошкоджень (отримано від бронебійних снарядів: 450 магазинів/година × 80 пошкоджень/магазин).\n\nНижчі значення прискорюють генерацію кредитів турелями. Вищі значення уповільнюють генерацію кредитів.
enable-defense-walls-and-gates=Увімкнути зміни якості для стін та воріт.\n\nВключає: стіни, ворота.
quality-level-cap-accumulators=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-agricultural-towers=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-assembly-machines=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-beacons=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-boilers=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-combinators-and-speakers=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.\n\nВключає: арифметичні комбінатори, комбінатори рішень, постійні комбінатори, програмовані динаміки.
quality-level-cap-defense-walls-and-gates=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.\n\nВключає: стіни, ворота.
quality-level-cap-furnaces=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-generators=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.\n\nВключає: парові двигуни, парові турбіни, термоядерні генератори.
quality-level-cap-heat-pipes=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-inserters=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-labs=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-lamps=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-mining-drills=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-poles=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.\n\nВключає: всі електричні стовпи, великі стовпи живлення та підстанції.
quality-level-cap-power-switches=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-pumps=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.\n\nВключає: берегові насоси та рідинні насоси.
quality-level-cap-reactors=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.\n\nВключає: ядерні реактори, термоядерні реактори.
quality-level-cap-rocket-silos=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-roboports=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-solar-panels=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.
quality-level-cap-turrets=Максимальний рівень, до якого Контроль Якості підвищуватиме цей об'єкт. Зупиниться на рівні 5 (легендарний), якщо немає модифікованих рівнів.\n\nВключає: турелі з боєприпасами, лазерні турелі, вогнемети, артилерійські турелі.
quality-level-cap-asteroid-collectors=Обмежує зростання якості збирачів астероїдів до ванільних значень для запобігання критичним проблемам гри.\n\nЗбирачі астероїдів з модифікованими рівнями якості можуть мати забагато рук, що рухаються надто швидко, — через це вони стають нездатними захоплювати шматки астероїдів і створюють значне навантаження на UPS.\n\n[color=green]За замовчуванням: рівень 5 (легендарний)[/color]\n[color=yellow]Діапазон: 1-255 рівнів якості[/color]
quality-level-cap-radar=Обмежує зростання якості радару для запобігання надмірному дослідженню карти та роздуванню файлу збереження.\n\nРадари з дуже високими рівнями якості можуть спричинити великі файли збереження (1,200мб+) через надмірне дослідження карти.\n\n[color=green]За замовчуванням: рівень 5 (легендарний)[/color]\n[color=yellow]Діапазон: 1-255 рівнів якості[/color]
quality-level-cap-lightning-rods=Обмежує зростання якості блискавкопритягувачів для запобігання проблемам продуктивності.\n\nБлискавкопритягувачі з дуже високими рівнями якості мають значно збільшені зони покриття, що може спричинити сплески затримок вночі на Фулгорі.\n\n[color=green]За замовчуванням: рівень 5 (легендарний)[/color]\n[color=yellow]Діапазон: 1-255 рівнів якості[/color]
quality-level-cap-thrusters=Обмежує зростання якості космічних двигунів до ванільних рівнів для запобігання проблемам із захистом.\n\nМодифіковані рівні якості можуть переміщувати космічні кораблі значно швидше, що здатне перевантажити їх системи захисту.\n\n[color=green]За замовчуванням: рівень 5 (легендарний)[/color]\n[color=yellow]Діапазон: 1-255 рівнів якості[/color]

