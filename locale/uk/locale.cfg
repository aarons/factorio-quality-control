[mod-setting-description]
manufacturing-hours-for-change=Кількість годин виробництва, необхідних для спроби зміни якості.\nГодини виробництва накопичуються лише тоді, коли машина активно працює. Якщо вона простоює, прогресу не буде.\nМін. значення 0.001 годин (3.6 секунд), Макс. значення 1000 годин.
crafting-speed-affects-progression=[color=green]Увімкнено:[/color] Швидкість виготовлення та продуктивність збільшують кількість накопичених годин виробництва. За швидкості 4 та продуктивності 50% накопичується у шість разів більше годин, ніж за швидкості 1 без бонусу продуктивності.\n\n[color=red]Вимкнено:[/color] Швидкість виготовлення не впливає на прогресію.
percentage-chance-of-change=Ймовірність успішної спроби покращення.
quality-increase-cost=Збільшення кількості годин виробництва, необхідних для кожного рівня якості. Збільшення накопичується; за 0% вимога однакова на всіх рівнях.\n\nЗа 50% вимога у 3 години зростає до 4.5 години на незвичайному рівні та 6.75 години на рідкісному.
quality-chance-accumulation-rate=Збільшує шанс покращення після невдалої спроби на відсоток від базового шансу.\n\n[color=white]Жодного:[/color] Шанс залишається постійним.\n[color=white]Низький:[/color] Додається 20% базового шансу.\n[color=white]Середній:[/color] Додається 50% базового шансу.\n[color=white]Високий:[/color] Додається 100% базового шансу.\n\nЗа базового шансу 1% низький рівень дає 1% → 1.2% → 1.4%..., а високий — 1% → 2% → 3%...
secondary-progression-rate=Швидкість прогресії об'єктів, які не можуть вимірювати власну роботу, наприклад маніпуляторів, стовпів і маяків.\n\n100% відповідає середній кількості годин виробництва, накопичених первинними об'єктами на тій самій поверхні. Вищі значення прискорюють прогресію; 0% призупиняє її.
change-modules-with-entity=[color=white]Вимкнено:[/color] Модулі не покращуються.\n\n[color=white]Увімкнено:[/color] Модулі покращуються на один рівень, коли покращується їхня машина, але не вище її якості.\n\n[color=white]Додатково увімкнено:[/color] Модулі покращуються до нової якості їхньої машини.\n\n[color=white]Незалежно:[/color] Модулі отримують власні спроби покращення завдяки вторинній прогресії та можуть перевищувати ліміт якості машини. Встановлення ліміту машини на «Звичайна» також вимикає покращення модулів.
batch-entities-per-tick=Кількість об'єктів, що обробляються за пакет. Більші пакети прискорюють обробку покращень, але можуть спричинити затримки. У незалежному режимі також враховуються слоти модулів.
batch-ticks-between-processing=Кількість тіків між обробкою пакетів. Коротші інтервали забезпечують частішу обробку покращень, але можуть знизити продуктивність.
quality-change-aggregate-alerts-enabled=Виводити підсумок покращень кожні п'ять хвилин.
quality-change-entity-alerts-enabled=Показувати значки сповіщень на карті в місцях покращення.
quality-change-chat-enabled=Виводити повідомлення про покращення зі значками об'єктів або модулів, значками якості та літерами випадкових кольорів веселки.
quality-change-gps-enabled=Виводити посилання на місце кожного покращення та створювати GPS-пінг Factorio на карті. Натисніть посилання, щоб повернутися до цього місця. Якщо кольорові повідомлення про покращення ввімкнено, посилання додається до них; інакше виводиться лише посилання. Для вбудованого GPS-пінгу потрібне посилання в чаті.
quality-change-floating-text-enabled=Показувати текст покращення, що піднімається вгору, кольором нової якості.
quality-change-halo-enabled=Показувати ореол кольору нової якості, що розширюється в місці покращення.
quality-change-rainbow-enabled=Показувати райдужні кільця, що розширюються в місцях покращення.
quality-change-badge-enabled=Показувати значок нової якості, який збільшується та піднімається протягом 4.5 секунди, безперервно обертаючись до зникнення.
quality-change-bubbles-enabled=Випускати в місцях покращення потік малих значків нової якості, що піднімаються вгору, мов бульбашки.
quality-change-sound-enabled=Відтворювати вибраний звук для покращень на поверхні, яку ви зараз переглядаєте, зокрема у віддаленому перегляді.
quality-change-sound=Виберіть звуковий ефект сповіщення, сигнал гучномовця, звук барабана або музичний інструмент. Інструменти використовують налаштування ноти інструмента / основної ноти та поведінки нот покращення. Звук відтворюється лише за ввімкненого звуку покращення для покращень на поверхні, яку ви зараз переглядаєте.
quality-change-sound-note=Фіксована нота або основна нота (тональність і початковий регістр) для музичних послідовностей. Ігнорується для сигналів, барабанів, ефектів і повністю випадкового режиму.\nНоти піднімаються півтонами від F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; додайте 12 для наступної октави. За замовчуванням: 20 (C).\nФортепіано має 48 нот, інші інструменти — 36. У фіксованому режимі нота обмежується найвищою доступною. За потреби музичні послідовності зміщуються вниз на цілі октави зі збереженням тональності. Однакові налаштування дають еквівалентні послідовності у власному регістрі кожного інструмента.
quality-change-sound-mode=Одна нота на кожне чутне покращення, з окремою послідовністю для кожного гравця. Фіксована нота зберігає вибрану ноту; музичне блукання переміщується на один або два ступені гами; вітрові дзвіночки вибирають випадкові ноти мажорної пентатоніки; сходинки неодноразово піднімаються та спускаються; випадкова нота в гамі вибирається з вибраної гами та діапазону; повністю випадковий режим використовує весь діапазон інструмента.\nБлукання та сходинки починаються з основної ноти й продовжуються після тиші та збереження чи завантаження гри. Відкладені ноти не ставляться в чергу. Впливає лише на музичні інструменти.
quality-change-sound-scale=Гама відносно основної ноти інструмента покращення, що використовується для музичного блукання, сходинок і випадкових нот у гамі. Хроматична гама дозволяє кожен півтон. Вітрові дзвіночки завжди використовують мажорну пентатоніку; фіксований і повністю випадковий режими ігнорують це налаштування.
quality-change-sound-range=Одна або дві октави від основної ноти, за потреби зміщені вниз на цілі октави відповідно до діапазону інструмента; або повний діапазон інструмента. Застосовується до музичного блукання, вітрових дзвіночків, сходинок і випадкових нот у гамі. Фіксований і повністю випадковий режими ігнорують це налаштування.
quality_control_skip_hidden_qualities=Пропускати приховані якості (наприклад, блискучі варіанти) під час покращення. Це налаштування застосовується лише за наявності моду, такого як Shiny Mechanics.
quality_control_hidden_qualities_sticky==Об'єкти з прихованими якостями (наприклад, блискучі) не покращуватимуться далі, зберігаючи свої унікальні переваги. Це налаштування застосовується лише за наявності моду, такого як Shiny Mechanics.
enable-accumulators=Увімкнути покращення акумуляторів.
enable-agricultural-towers=Увімкнути покращення сільськогосподарських веж.
enable-assembly-machines=Увімкнути покращення складальних машин.
enable-asteroid-collectors=Увімкнути покращення збирачів астероїдів.
asteroid-collector-growth-level-limit=Обмежує зростання якості збирачів астероїдів до ванільних значень для запобігання критичним проблемам гри.\n\nЗбирачі астероїдів з модифікованими рівнями якості можуть мати забагато рук, що рухаються надто швидко, — через це вони стають нездатними захоплювати шматки астероїдів і створюють значне навантаження на UPS.\n\n[color=green]За замовчуванням: легендарна[/color]
enable-beacons=Увімкнути покращення маяків.
enable-boilers=Увімкнути покращення котлів.
enable-combinators-and-speakers=Увімкнути покращення комбінаторів та програмованих гучномовців.
enable-pumps=Увімкнути покращення берегових насосів і насосів для рідин.
enable-furnaces=Увімкнути покращення печей.
enable-generators=Увімкнути покращення парових двигунів, парових турбін і термоядерних генераторів.
enable-heat-pipes=Увімкнути покращення теплових труб.
enable-inserters=Увімкнути покращення маніпуляторів.
enable-labs=Увімкнути покращення дослідницьких лабораторій.
enable-lamps=Увімкнути покращення ламп.
enable-lightning-rods=Увімкнути покращення блискавковідводів.
enable-mining-drills=Увімкнути покращення видобувних бурів.
enable-poles=Увімкнути покращення електричних стовпів і підстанцій.
enable-power-switches=Увімкнути покращення вимикачів живлення.
enable-radar=Увімкнути покращення радарних станцій.
radar-growth-level-limit=Обмежує зростання якості радару для запобігання надмірному дослідженню карти та роздуванню файлу збереження.\n\nРадари з дуже високими рівнями якості можуть спричинити великі файли збереження (1,200мб+) через надмірне дослідження карти.\n\n[color=green]За замовчуванням: легендарна[/color]
lightning-attractor-growth-level-limit=Обмежує зростання якості блискавкопритягувачів для запобігання проблемам продуктивності.\n\nБлискавкопритягувачі з дуже високими рівнями якості мають значно збільшені зони покриття, що може спричинити сплески затримок вночі на Фулгорі.\n\n[color=green]За замовчуванням: легендарна[/color]
enable-reactors=Увімкнути покращення ядерних і термоядерних реакторів.
enable-rocket-silos=Увімкнути покращення ракетних шахт.
enable-roboports=Увімкнути покращення робопортів.
enable-solar-panels=Увімкнути покращення сонячних панелей.
enable-thrusters=Увімкнути покращення космічних двигунів. Вищі швидкості кораблів можуть перевантажити їхні системи захисту.
thruster-growth-level-limit=За бажанням обмежує якість космічних двигунів рівнями базової гри. Модифіковані рівні якості можуть значно прискорити космічні кораблі, що здатне перевантажити їхні системи захисту.
enable-turrets=Увімкнути покращення кулеметних, лазерних, вогнеметних та артилерійських турелей. Турелі накопичують «години виробництва», завдаючи шкоди.
turret-damage-per-manufacturing-hour=Кількість шкоди, яку турель має завдати, щоб отримати одну годину виробництва.\n\nЗа замовчуванням: 36 000 шкоди (на основі безперервної стрільби турелі базового рівня бронебійними набоями протягом години).
turrets-contribute-credits=Дозволити турелям сприяти покращенню вторинних об'єктів, таких як маніпулятори та електричні стовпи, на тій самій поверхні. Це може значно прискорити покращення на пізніх етапах гри за використання рейкотронів і блискавичних турелей.
enable-defense-walls-and-gates=Увімкнути покращення стін та воріт.
custom-upgrade-limit-a=Максимальний рівень якості для значення 'Custom A' у наведених нижче обмеженнях. Потрібен лише за наявності моду, що додає рівні якості вище легендарного, якщо ви хочете обмежити рівень покращення об'єкта. Наприклад, щоб дозволити збирачам астероїдів досягати рівня 10. Встановіть тут максимальний рівень, потім знайдіть потрібний об'єкт і виберіть 'Custom A' у випадаючому списку. Для довідки: легендарний рівень — 5-й.
custom-upgrade-limit-b=Максимальний рівень якості для значення Custom B у налаштуваннях ліміту покращення.
custom-upgrade-limit-c=Максимальний рівень якості для значення Custom C у налаштуваннях ліміту покращення.
upgrade-limit-accumulators=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-agricultural-towers=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-assembly-machines=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-beacons=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-boilers=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-combinators-and-speakers=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.\n\nВключає: арифметичні комбінатори, комбінатори рішень, постійні комбінатори, програмовані гучномовці.
upgrade-limit-defense-walls-and-gates=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-furnaces=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-generators=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.\n\nВключає: парові двигуни, парові турбіни, термоядерні генератори.
upgrade-limit-heat-pipes=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-inserters=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-labs=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-lamps=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-mining-drills=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-poles=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.\n\nВключає електричні стовпи та підстанції.
upgrade-limit-power-switches=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-pumps=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.\n\nВключає: берегові насоси та насоси для рідин.
upgrade-limit-reactors=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.\n\nВключає: ядерні реактори, термоядерні реактори.
upgrade-limit-rocket-silos=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-roboports=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-solar-panels=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.
upgrade-limit-turrets=Максимальна якість покращення цих об'єктів. «Звичайна» вимикає покращення; Custom A/B/C використовує власний рівень, заданий вище.\n\nВключає: кулеметні турелі, лазерні турелі, вогнемети, артилерійські турелі.
upgrade-limit-asteroid-collectors=Обмежує якість збирачів астероїдів до легендарної, щоб запобігти критичним проблемам гри. Модифіковані рівні можуть створити забагато рук, що рухаються надто швидко, через що вони не здатні захоплювати шматки астероїдів і значно знижують UPS.
upgrade-limit-radar=Обмежує якість радарів до легендарної, щоб запобігти роздуванню файлу збереження. Модифіковані рівні якості можуть спричинити надмірне дослідження карти та дуже великі файли збереження (понад гігабайт).
upgrade-limit-lightning-rods=Обмежує якість блискавкопритягувачів до легендарної, щоб запобігти перепадам UPS. Блискавкопритягувачі з модифікованими рівнями якості мають значно більші зони покриття, що може спричинити затримки вночі на Фулгорі.
upgrade-limit-thrusters=Обмежує якість космічних двигунів до легендарної, щоб запобігти несподіваним пошкодженням космічної платформи. Модифіковані рівні якості можуть значно прискорити космічні кораблі, що здатне перевантажити їхні системи захисту.

