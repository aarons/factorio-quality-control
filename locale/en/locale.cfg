[mod-setting-description]
manufacturing-hours-for-change=The number of manufacturing hours required for a quality change to be attempted.\nManufacturing hours are only accumulated when the machine is actively working. If it sits idle, then it will not progress.\nMin value 0.001 hours (3.6 seconds), Max value 1000 hours.
crafting-speed-affects-progression=Controls whether a machine's crafting speed impacts how fast it earns manufacturing hours.\n\n[color=green]Enabled (default):[/color] Machines with higher crafting speed will progress faster. Manufacturing hours are earned based on the machines crafting speed and productivity. A foundry with speed 4 and 50% productivity will progress six times faster than an assembler-2 with crafting speed 1.\n\n[color=red]Disabled:[/color] Crafting speed has no impact on progression. One hour spent actively crafting counts as one manufacturing hour, regardless of crafting speed. This removes the compounding effect where each quality upgrade speeds up the next one.
percentage-chance-of-change=The percentage chance that a quality change will be successful.\nMin value 0.0001%, Max value 100% (always change after the time is passed)
quality-increase-cost=This increases the time between change attempts per level of quality. This is a compounding formula. Setting to 0% will keep the time between attempts the same no matter the quality level\n\n[color=green]Example with 3 manufacturing hours needed at 50% cost per level[/color]\n\nNormal: 3 hours\nUncommon: 4.5 hours\nRare: 6.8 hours\nEpic: 10.1 hours\nLegendary: 15.2 hours\nModded quality lvl 10: 173 hours
quality-chance-accumulation-rate=Controls how much the chance increases after each failed attempt.\n\n[color=white]None (Default):[/color] No accumulation - chance stays constant.\n\n[color=white]Low (20%):[/color] Chance increases by 20% of base rate each failure.\n\n[color=white]Medium (50%):[/color] Chance increases by 50% of base rate each failure.\n\n[color=white]High (100%):[/color] Chance increases by 100% of base rate each failure.\n\n[color=yellow]Example with 1% base chance:[/color]\n\n[color=white]Low:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]High:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nAll accumulation settings eventually guarantee quality changes - higher settings just reach 100% chance faster
accumulate-at-max-quality=Max quality assemblers still contribute:\nWhen enabled, assemblers and furnaces at maximum quality will continue tracking manufacturing hours and generating upgrade credits for secondary entities (like inserters, beacons, etc.), even though they cannot upgrade further themselves.\n\n[color=green]Enabled (default):[/color] Max quality assemblers continue generating upgrade credits for secondary entities. This can provide steady progress for secondary entities in the late game.\n\n[color=red]Disabled:[/color] Only low quality assemblers and furnaces that can still upgrade generate credits, but they are generated as a ratio to the secondary entities that still need upgrades. In an extreme case, this means a single low quality assembler could advance an entire factories secondary entities.
change-modules-with-entity=This controls whether modules in machines are affected by quality changes.\n\n[color=white]Disabled (Default):[/color] Modules are not affected when the quality of the host machine changes.\n\n[color=white]Enabled:[/color] Modules change quality by one tier when their host changes. They will not exceed the host's quality level.\n\n[color=white]Extra Enabled:[/color] Like Enabled, but modules will be updated matched to their host machine's quality anytime a quality change occurs.
batch-entities-per-tick=Number of entities to process each tick to avoid performance spikes.\nMin value 1, Max value 1000.\nHigher values may cause lag spikes but process entities faster.
batch-ticks-between-processing=Number of ticks to wait between batch processing cycles.\nMin value 1 tick, Max value 6000 ticks (~2.5 minutes).\nLower values process more frequently but may impact performance.
quality-change-aggregate-alerts-enabled=Show console messages summarizing all quality changes (displayed once every 5 minutes). Example: "3 assembly machines upgraded, 2 inserters upgraded"
quality-change-entity-alerts-enabled=Show map ping alerts on individual entities when their quality changes. Click the alert to view the upgraded entity.
quality-change-visual-effects-enabled=Show a brief sparkle effect on entities when their quality is upgraded, displaying the new quality's icon and a glow in the quality's color.
quality_control_skip_hidden_qualities=Quality Control will skip hidden qualities (e.g., shiny variants) when upgrading. Entities will never become shiny through Quality Control - players must obtain them the normal way. This setting only applies when you have the Shiny Mechanics quality mod installed.
quality_control_hidden_qualities_sticky=Entities with hidden qualities (e.g., shiny) will not upgrade further, preserving their unique benefits. This setting only applies when you have the Shiny Mechanics quality mod installed.
enable-accumulators=Enable quality changes for accumulators.
enable-agricultural-towers=Enable quality changes for agricultural towers.
enable-assembly-machines=Enable quality changes for assembly machines.
enable-asteroid-collectors=Enable quality changes for asteroid collectors.
asteroid-collector-growth-level-limit=Limits asteroid collector quality growth to vanilla values to prevent game breaking issues.\n\nAsteroid collectors with modded quality tiers can have too many arms that move too fast, becoming unable to grab asteroid chunks and creating a large UPS drain.\n\n[color=green]Default: legendary[/color]
enable-beacons=Enable quality changes for beacons.
enable-boilers=Enable quality changes for boilers.
enable-combinators-and-speakers=Enable quality changes for combinators and speakers.\n\nIncludes: arithmetic combinators, decider combinators, constant combinators, programmable speakers.
enable-pumps=Enable quality changes for pumps (includes offshore pumps and fluid pumps).
enable-furnaces=Enable quality changes for furnaces.
enable-generators=Enable quality changes for generators (steam engines, steam turbines, fusion generators).
enable-heat-pipes=Enable quality changes for heat pipes.
enable-inserters=Enable quality changes for inserters.
enable-labs=Enable quality changes for research laboratories.
enable-lamps=Enable quality changes for lamps.
enable-lightning-rods=Enable quality changes for lightning rods.
enable-mining-drills=Enable quality changes for all mining drills.
enable-poles=Enable quality changes for all electric poles (including big power poles and substations).
enable-power-switches=Enable quality changes for power switches.
enable-radar=Enable quality changes for radar stations.
radar-growth-level-limit=Limits radar quality growth in order to prevent excessive map exploration and save file bloat.\n\nRadars with very high quality levels can cause large save files (1,200mb+) due to excessive map exploration.\n\n[color=green]Default: legendary[/color]
lightning-attractor-growth-level-limit=Limits lightning attractor quality growth to prevent performance issues.\n\nLightning attractors with very high quality levels have significantly increased coverage areas, which can cause lag spikes at night on Fulgora.\n\n[color=green]Default: legendary[/color]
enable-reactors=Enable quality changes for reactors (nuclear reactors, fusion reactors).
enable-rocket-silos=Enable quality changes for rocket silos.
enable-roboports=Enable quality changes for roboports.
enable-solar-panels=Enable quality changes for solar panels.
enable-thrusters=Enable quality changes for space thrusters. Disabled by default because changing a spaceship's speed unexpectedly can lead to defenses getting overwhelmed.
thruster-growth-level-limit=Limits space thruster quality growth to vanilla levels to prevent defense issues.\n\nModded quality tiers make can move spacehips significantly faster, which can overwhelm their defenses.\n\n[color=green]Default: legendary[/color]
enable-turrets=Enable quality changes for turrets.\n\nTurrets are primary entities that generate upgrade credits based on cumulative damage dealt.\n\nIncludes: ammo turrets, laser turrets, flamethrowers, artillery turrets.
turret-damage-per-manufacturing-hour=The amount of damage a turret must deal to equal one manufacturing hour.\n\nDefault: 36,000 damage (derived from piercing rounds: 450 magazines/hour × 80 damage/magazine).\n\nLower values make turrets generate credits faster.
enable-defense-walls-and-gates=Enable quality changes for walls and gates.\n\nIncludes: walls, gates.
custom-upgrade-limit-a=Use this to set custom limits on modded qualities for entities. Only needed when you have a mod that adds quality levels beyond legendary and you want to limit how much an entity will upgrade. To use this feature, set the maximum level here, then go down to the entity you want to limit and select 'Custom A' in the dropdown. For reference, legendary is level 5 (normal = 1, uncommon = 2, rare = 3, epic = 4, legendary = 5...).
custom-upgrade-limit-b=Use this to set custom limits on modded qualities for entities. Only needed when you have a mod that adds quality levels beyond legendary and you want to limit how much an entity will upgrade. To use this feature, set the maximum level here, then go down to the entity you want to limit and select 'Custom B' in the dropdown. For reference, legendary is level 5 (normal = 1, uncommon = 2, rare = 3, epic = 4, legendary = 5...).
custom-upgrade-limit-c=Use this to set custom limits on modded qualities for entities. Only needed when you have a mod that adds quality levels beyond legendary and you want to limit how much an entity will upgrade. To use this feature, set the maximum level here, then go down to the entity you want to limit and select 'Custom C' in the dropdown. For reference, legendary is level 5 (normal = 1, uncommon = 2, rare = 3, epic = 4, legendary = 5...).
upgrade-limit-accumulators=Quality Control will upgrade these entities up to this quality, then stop attempting further upgrades. Set this to Common to prevent any upgrade attempts. The custom values use the Custom Upgrade Limit A/B/C settings.
upgrade-limit-agricultural-towers=Quality Control will upgrade these entities up to this quality, then stop attempting further upgrades. Set this to Common to prevent any upgrade attempts. The custom values use the Custom Upgrade Limit A/B/C settings.
