[mod-setting-description]
manufacturing-hours-for-change=The number of manufacturing hours required for a quality change to be attempted.\nManufacturing hours are only accumulated when the machine is actively working. If it sits idle, then it will not progress.\nMin value 0.001 hours (3.6 seconds), Max value 1000 hours.
crafting-speed-affects-progression=[color=red]Disabled (default):[/color] Crafting speed does not impact progression, which helps keep upgrades more evenly spread throughout a longer game.\n\n[color=green]Enabled:[/color] Crafting speed and productivity increase manufacturing hours earned. Speed 4 with 50% productivity earns six times as much as speed 1 with no productivity bonus. Speed increases from quality upgrades can compound, leading to very rapid upgrades in the late game.
percentage-chance-of-change=Chance of success for an upgrade attempt.
quality-increase-cost=Increase in manufacturing hours needed per quality level. The increase compounds; 0% keeps the requirement the same at all levels.\n\nAt 50%, a 3-hour requirement becomes 4.5 hours at uncommon and 6.75 hours at rare.
quality-chance-accumulation-rate=Increase the upgrade chance after a failed attempt by a percentage of the base chance.\n\n[color=white]None:[/color] Chance stays constant.\n[color=white]Low:[/color] Add 20% of the base chance.\n[color=white]Medium:[/color] Add 50% of the base chance.\n[color=white]High:[/color] Add 100% of the base chance.\n\nWith a 1% base chance, Low gives 1% → 1.2% → 1.4%... and High gives 1% → 2% → 3%...
secondary-progression-rate=Progression speed for entities that cannot measure their own work, such as inserters, poles, and beacons.\n\n100% matches the average manufacturing hours earned by primary entities on the same surface. Higher values speed up progression; 0% pauses it.
change-modules-with-entity=[color=white]Disabled:[/color] Modules do not upgrade.\n\n[color=white]Enabled:[/color] Modules upgrade one tier when their machine upgrades, up to the machine's quality.\n\n[color=white]Extra Enabled:[/color] Modules upgrade to match their machine's new quality.\n\n[color=white]Independent:[/color] Modules earn their own upgrade attempts from secondary progression and can exceed their machine's quality limit. Setting the machine limit to Common disables module upgrades too.
batch-entities-per-tick=Entities processed per batch. Larger batches process upgrades faster but may cause lag. Module slots also count in Independent mode.
batch-ticks-between-processing=Ticks between processing batches. Shorter intervals process upgrades more frequently but may reduce performance.
quality-change-aggregate-alerts-enabled=Print a summary of upgrades every five minutes.
quality-change-entity-alerts-enabled=Show map alert icons at upgrade locations.
quality-change-chat-enabled=Print upgrade messages with entity or module icons, quality icons, and a smooth rainbow text gradient. Quality names use their matching quality color.
quality-change-gps-enabled=Print a clickable location link and trigger Factorio's GPS map ping for each upgrade. Click the link to revisit the location. Adds the link to colorful upgrade chat when enabled; otherwise prints only the link. The native GPS ping requires a chat link.
quality-change-floating-text-enabled=Show rising upgrade text in the new quality's color.
quality-change-halo-enabled=Show an expanding halo in the new quality's color at upgrade locations.
quality-change-rainbow-enabled=Show expanding rainbow rings at upgrade locations.
quality-change-badge-enabled=Show the new quality's icon growing and rising for 4.5 seconds, continuously spinning through its fade-out.
quality-change-bubbles-enabled=Release a stream of small icons of the new quality that float upward like bubbles at upgrade locations.
quality-change-sound-enabled=Play the selected sound for upgrades on the surface you are currently viewing, including remote view.
quality-change-sound=Choose a notification effect, speaker alarm, drum sound, or musical instrument. Instrument choices use Upgrade Instrument Note / Root and Upgrade Note Behavior. Only plays when Upgrade Sound is enabled, for upgrades on the surface you are currently viewing.
quality-change-sound-note=Fixed note, or the root (key and starting register) for musical patterns. Ignored for alarms, drums, effects, and Totally random mode.\nNotes ascend by semitone from F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; add 12 for the next octave. Default: 20 (C).\nPiano has 48 notes; other instruments have 36. Fixed mode clamps to the highest available note. Musical patterns shift down by whole octaves when necessary to fit, preserving the key. The same settings give equivalent patterns in each instrument's own register.
quality-change-sound-mode=One note per audible upgrade, with a separate pattern for each player. Fixed preserves the selected note; Musical wandering moves one or two scale steps; Wind chimes chooses random major pentatonic notes; Staircase climbs then descends repeatedly; Random in scale chooses any note in the selected scale and range; Totally random uses the instrument's entire range.\nWandering and Staircase begin at the root and resume after quiet periods and save/load. No delayed notes are queued. Only affects musical instruments.
quality-change-sound-scale=Scale relative to Upgrade Instrument Note / Root, used by Musical wandering, Staircase, and Random in scale. Chromatic allows every semitone. Wind chimes always uses major pentatonic; Fixed and Totally random ignore this setting.
quality-change-sound-range=One or two octaves beginning at the root, shifted down by whole octaves if necessary to fit the instrument; or the full instrument range. Applies to Musical wandering, Wind chimes, Staircase, and Random in scale. Fixed and Totally random ignore this setting.
quality_control_skip_hidden_qualities=Skip hidden qualities (such as shiny variants) when upgrading. This setting only applies when you have a mod like Shiny Mechanics installed.
quality_control_hidden_qualities_sticky==Entities with hidden qualities (e.g., shiny) will not upgrade further, preserving their unique benefits. This setting only applies when you have a mod like Shiny Mechanics installed.
enable-accumulators=Enable upgrades for accumulators.
enable-agricultural-towers=Enable upgrades for agricultural towers.
enable-assembly-machines=Enable upgrades for assembly machines.
enable-asteroid-collectors=Enable upgrades for asteroid collectors.
asteroid-collector-growth-level-limit=Limits asteroid collector quality growth to vanilla values to prevent game breaking issues.\n\nAsteroid collectors with modded quality tiers can have too many arms that move too fast, becoming unable to grab asteroid chunks and creating a large UPS drain.\n\n[color=green]Default: legendary[/color]
enable-beacons=Enable upgrades for beacons.
enable-boilers=Enable upgrades for boilers.
enable-combinators-and-speakers=Enable upgrades for combinators and programmable speakers.
enable-pumps=Enable upgrades for offshore pumps and fluid pumps.
enable-furnaces=Enable upgrades for furnaces.
enable-generators=Enable upgrades for steam engines, steam turbines, and fusion generators.
enable-heat-pipes=Enable upgrades for heat pipes.
enable-inserters=Enable upgrades for inserters.
enable-labs=Enable upgrades for research laboratories.
enable-lamps=Enable upgrades for lamps.
enable-lightning-rods=Enable upgrades for lightning rods.
enable-mining-drills=Enable upgrades for mining drills.
enable-poles=Enable upgrades for electric poles and substations.
enable-power-switches=Enable upgrades for power switches.
enable-radar=Enable upgrades for radar stations.
radar-growth-level-limit=Limits radar quality growth in order to prevent excessive map exploration and save file bloat.\n\nRadars with very high quality levels can cause large save files (1,200mb+) due to excessive map exploration.\n\n[color=green]Default: legendary[/color]
lightning-attractor-growth-level-limit=Limits lightning attractor quality growth to prevent performance issues.\n\nLightning attractors with very high quality levels have significantly increased coverage areas, which can cause lag spikes at night on Fulgora.\n\n[color=green]Default: legendary[/color]
enable-reactors=Enable upgrades for nuclear and fusion reactors.
enable-rocket-silos=Enable upgrades for rocket silos.
enable-roboports=Enable upgrades for roboports.
enable-solar-panels=Enable upgrades for solar panels.
enable-thrusters=Enable upgrades for space thrusters. Faster ships may overwhelm their defenses.
thruster-growth-level-limit=Optionally limit space thrusters to vanilla levels. Modded quality tiers can move spacehips significantly faster, which can overwhelm their defenses.
enable-turrets=Enable upgrades for ammo, laser, flamethrower, and artillery turrets. Turrets earn 'manufacturing hours' by dealing damage.
turret-damage-per-manufacturing-hour=The amount of damage a turret must deal to earn one manufacturing hour.\n\nDefault: 36,000 damage (derived from how much piercing ammo a base assembler can produce in an hour).
turrets-contribute-credits=Let turrets contribute to upgrades for secondary entities, such as inserters and power poles, on the same surface. This can greatly speed up upgrades in the late game with railguns and lightning-turrets.
enable-defense-walls-and-gates=Enable upgrades for walls and gates.
custom-upgrade-limit-a=Maximum quality level used by the 'Custom A' setting in the limiters below. Only needed when using a mod that adds quality levels beyond legendary, and you want to limit the level an entity can upgrade to. For example, if you want to let asteroid collectors get to level 10. To use this feature, set the maximum level here, then go down to the entity you want to limit and select 'Custom A' in the dropdown. For reference, legendary is level 5.
custom-upgrade-limit-b=Maximum quality level used by Custom B in the upgrade limit settings.
custom-upgrade-limit-c=Maximum quality level used by Custom C in the upgrade limit settings.
upgrade-limit-accumulators=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-agricultural-towers=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-assembly-machines=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-beacons=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-boilers=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-combinators-and-speakers=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.\n\nIncludes: arithmetic combinators, decider combinators, constant combinators, programmable speakers.
upgrade-limit-defense-walls-and-gates=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-furnaces=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-generators=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.\n\nIncludes: steam engines, steam turbines, fusion generators.
upgrade-limit-heat-pipes=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-inserters=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-labs=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-lamps=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-mining-drills=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-poles=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.\n\nIncludes electric poles and substations.
upgrade-limit-power-switches=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-pumps=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.\n\nIncludes: offshore pumps and fluid pumps.
upgrade-limit-reactors=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.\n\nIncludes: nuclear reactors, fusion reactors.
upgrade-limit-rocket-silos=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-roboports=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.
upgrade-limit-solar-panels=Maximum upgrade quality for these entities. Common disables upgrade; Custom A/B/C will use the custom level specified above.
upgrade-limit-turrets=Maximum upgrade quality for these entities. Common disables upgrades; Custom A/B/C will use the custom level specified above.\n\nIncludes: ammo turrets, laser turrets, flamethrowers, artillery turrets.
upgrade-limit-asteroid-collectors=Limit asteroid collectors to legendary to prevent game breaking issues. Modded levels can create too many arms that move too fast, becoming unable to grab asteroid chunks and creating a large UPS drain.
upgrade-limit-radar=Limit radars to legendary to prevent bloating save file size. Modded qualities can create excessive map exploration which can cause very large file sizes (over a gigabyte).
upgrade-limit-lightning-rods=Limit lightning attractors to legendary in order to prevent UPS spikes. Lightning attractors with modded quality levels have significantly increased coverage areas, which can cause lag spikes at night on Fulgora.
upgrade-limit-thrusters=Limit space thruster to legendary to prevent unexpected space platform damage. Modded quality tiers make can make spacehips move significantly faster, which can overwhelm their defenses.

