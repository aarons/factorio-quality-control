upgrade-limit-combinators-and-speakers=Quality Control will upgrade these entities up to this quality, then stop attempting further upgrades. Set this to Common to prevent any upgrade attempts. The custom values use the Custom Upgrade Limit A/B/C settings.\n\nIncludes: arithmetic combinators, decider combinators, constant combinators, programmable speakers.
upgrade-limit-defense-walls-and-gates=Quality Control will upgrade these entities up to this quality, then stop attempting further upgrades. Set this to Common to prevent any upgrade attempts. The custom values use the Custom Upgrade Limit A/B/C settings.\n\nIncludes: walls, gates.
