[mod-setting-description]
manufacturing-hours-for-change=Il numero di ore di produzione richieste per tentare un cambio di qualità.\nLe ore di produzione vengono accumulate solo quando la macchina è attivamente al lavoro. Se rimane inattiva, non progredirà.\nValore minimo 0.001 ore (3.6 secondi), Valore massimo 1000 ore.
crafting-speed-affects-progression=[color=green]Abilitato:[/color] La velocità di fabbricazione e la produttività aumentano le ore di produzione guadagnate. Una velocità di 4 con il 50% di produttività ne fa guadagnare sei volte di più rispetto a una velocità di 1 senza bonus di produttività.\n\n[color=red]Disabilitato:[/color] La velocità di fabbricazione non influisce sulla progressione.
percentage-chance-of-change=Possibilità di successo di un tentativo di miglioramento.
quality-increase-cost=Aumento delle ore di produzione necessarie per ogni livello di qualità. L'aumento è cumulativo; allo 0% il requisito rimane uguale per tutti i livelli.\n\nAl 50%, un requisito di 3 ore diventa 4,5 ore a qualità non comune e 6,75 ore a qualità rara.
quality-chance-accumulation-rate=Aumenta la possibilità di miglioramento dopo un tentativo fallito di una percentuale della possibilità base.\n\n[color=white]Nessuno:[/color] La possibilità rimane costante.\n[color=white]Basso:[/color] Aggiunge il 20% della possibilità base.\n[color=white]Medio:[/color] Aggiunge il 50% della possibilità base.\n[color=white]Alto:[/color] Aggiunge il 100% della possibilità base.\n\nCon una possibilità base dell'1%, Basso dà 1% → 1,2% → 1,4%... e Alto dà 1% → 2% → 3%...
secondary-progression-rate=Velocità di progressione delle entità che non possono misurare il proprio lavoro, come inseritori, pali e fari.\n\nIl 100% corrisponde alla media delle ore di produzione guadagnate dalle entità primarie sulla stessa superficie. Valori più alti accelerano la progressione; lo 0% la mette in pausa.
change-modules-with-entity=[color=white]Disabilitato:[/color] I moduli non vengono migliorati.\n\n[color=white]Abilitato:[/color] I moduli migliorano di un livello quando la loro macchina viene migliorata, fino alla qualità della macchina.\n\n[color=white]Extra Abilitato:[/color] I moduli vengono migliorati fino a raggiungere la nuova qualità della loro macchina.\n\n[color=white]Indipendente:[/color] I moduli ottengono tentativi di miglioramento propri dalla progressione secondaria e possono superare il limite di qualità della macchina. Impostare il limite della macchina su Comune disabilita anche i miglioramenti dei moduli.
batch-entities-per-tick=Entità elaborate per batch. Batch più grandi elaborano i miglioramenti più velocemente, ma possono causare lag. In modalità Indipendente contano anche gli slot dei moduli.
batch-ticks-between-processing=Tick tra le elaborazioni dei batch. Intervalli più brevi elaborano i miglioramenti più frequentemente, ma possono ridurre le prestazioni.
quality-change-aggregate-alerts-enabled=Mostra un riepilogo dei miglioramenti ogni cinque minuti.
quality-change-entity-alerts-enabled=Mostra icone di avviso sulla mappa nei punti in cui avvengono i miglioramenti.
quality-change-chat-enabled=Mostra messaggi di miglioramento con icone delle entità o dei moduli, icone della qualità e lettere colorate casualmente con i colori dell'arcobaleno.
quality-change-gps-enabled=Mostra un collegamento cliccabile alla posizione e attiva il ping GPS sulla mappa di Factorio per ogni miglioramento. Clicca il collegamento per tornare alla posizione. Se la chat colorata dei miglioramenti è abilitata, vi aggiunge il collegamento; altrimenti mostra solo il collegamento. Il ping GPS nativo richiede un collegamento in chat.
quality-change-floating-text-enabled=Mostra testo di miglioramento che sale nel colore della nuova qualità.
quality-change-halo-enabled=Mostra un alone in espansione nel colore della nuova qualità nei punti in cui avvengono i miglioramenti.
quality-change-rainbow-enabled=Mostra anelli arcobaleno in espansione nei punti in cui avvengono i miglioramenti.
quality-change-badge-enabled=Mostra l'icona della nuova qualità che cresce e sale per 4,5 secondi, ruotando continuamente mentre svanisce.
quality-change-bubbles-enabled=Rilascia una scia di piccole icone della nuova qualità che salgono come bolle nei punti in cui avvengono i miglioramenti.
quality-change-sound-enabled=Riproduce il suono selezionato per i miglioramenti sulla superficie attualmente visualizzata, anche nella visualizzazione remota.
quality-change-sound=Scegli un effetto di notifica, un allarme dell'altoparlante, un suono di batteria o uno strumento musicale. Gli strumenti usano Nota dello strumento / tonica e Comportamento delle note. Il suono viene riprodotto solo se è abilitato per i miglioramenti e solo sulla superficie attualmente visualizzata.
quality-change-sound-note=Nota fissa o tonica (tonalità e registro iniziale) per le sequenze musicali. Ignorata per allarmi, batterie, effetti e modalità Totalmente casuale.\nLe note salgono per semitoni a partire da Fa: 1=Fa, 3=Sol, 5=La, 7=Si, 8=Do, 10=Re, 12=Mi; aggiungi 12 per l'ottava successiva. Predefinito: 20 (Do).\nIl pianoforte ha 48 note; gli altri strumenti ne hanno 36. La modalità Nota fissa limita la nota a quella più alta disponibile. Le sequenze musicali vengono abbassate di ottave intere quando necessario, mantenendo la tonalità. Le stesse impostazioni producono sequenze equivalenti nel registro di ciascuno strumento.
quality-change-sound-mode=Una nota per ogni miglioramento udibile, con una sequenza separata per ogni giocatore. Nota fissa mantiene la nota selezionata; Esplorazione musicale si sposta di uno o due gradi della scala; Carillon a vento sceglie note casuali della scala pentatonica maggiore; Scala ascendente e discendente sale e scende ripetutamente; Casuale nella scala sceglie una nota qualsiasi nella scala e nell'estensione selezionate; Totalmente casuale usa l'intera estensione dello strumento.\nEsplorazione musicale e Scala ascendente e discendente iniziano dalla tonica e riprendono dopo periodi di silenzio e dopo il salvataggio o il caricamento. Nessuna nota ritardata viene accodata. Influisce solo sugli strumenti musicali.
quality-change-sound-scale=Scala relativa a Nota dello strumento / tonica, usata da Esplorazione musicale, Scala ascendente e discendente e Casuale nella scala. Cromatica permette tutti i semitoni. Carillon a vento usa sempre la pentatonica maggiore; Nota fissa e Totalmente casuale ignorano questa impostazione.
quality-change-sound-range=Una o due ottave a partire dalla tonica, abbassate di ottave intere se necessario per adattarsi allo strumento; oppure l'intera estensione dello strumento. Si applica a Esplorazione musicale, Carillon a vento, Scala ascendente e discendente e Casuale nella scala. Nota fissa e Totalmente casuale ignorano questa impostazione.
quality_control_skip_hidden_qualities=Salta le qualità nascoste (come le varianti shiny) durante il miglioramento. Questa impostazione si applica solo se hai installato una mod come Shiny Mechanics.
quality_control_hidden_qualities_sticky==Le entità con qualità nascoste (es. shiny) non verranno ulteriormente migliorate, preservando i loro benefici unici. Questa impostazione si applica solo se hai installato una mod come Shiny Mechanics.
enable-accumulators=Abilita i miglioramenti per gli accumulatori.
enable-agricultural-towers=Abilita i miglioramenti per le torri agricole.
enable-assembly-machines=Abilita i miglioramenti per le macchine assemblatrici.
enable-asteroid-collectors=Abilita i miglioramenti per i collettori di asteroidi.
asteroid-collector-growth-level-limit=Limita la crescita della qualità dei collettori di asteroidi ai valori vanilla per prevenire problemi che compromettono il gioco.\n\nI collettori di asteroidi con livelli di qualità moddati possono avere troppi bracci che si muovono troppo velocemente, diventando incapaci di raccogliere frammenti di asteroidi e creando un grande consumo di UPS.\n\n[color=green]Predefinito: leggendario[/color]
enable-beacons=Abilita i miglioramenti per i fari.
enable-boilers=Abilita i miglioramenti per le caldaie.
enable-combinators-and-speakers=Abilita i miglioramenti per combinatori e altoparlanti programmabili.
enable-pumps=Abilita i miglioramenti per le pompe offshore e le pompe per fluidi.
enable-furnaces=Abilita i miglioramenti per i forni.
enable-generators=Abilita i miglioramenti per motori a vapore, turbine a vapore e generatori a fusione.
enable-heat-pipes=Abilita i miglioramenti per i tubi di calore.
enable-inserters=Abilita i miglioramenti per gli inseritori.
enable-labs=Abilita i miglioramenti per i laboratori di ricerca.
enable-lamps=Abilita i miglioramenti per le lampade.
enable-lightning-rods=Abilita i miglioramenti per i parafulmini.
enable-mining-drills=Abilita i miglioramenti per le perforatrici.
enable-poles=Abilita i miglioramenti per i pali elettrici e le sottostazioni.
enable-power-switches=Abilita i miglioramenti per gli interruttori elettrici.
enable-radar=Abilita i miglioramenti per le stazioni radar.
radar-growth-level-limit=Limita la crescita della qualità del radar per prevenire l'eccessiva esplorazione della mappa e il gonfiamento dei file di salvataggio.\n\nI radar con livelli di qualità molto alti possono causare file di salvataggio enormi (1,200mb+) a causa dell'eccessiva esplorazione della mappa.\n\n[color=green]Predefinito: leggendario[/color]
lightning-attractor-growth-level-limit=Limita la crescita della qualità degli attiratori di fulmini per prevenire problemi di prestazioni.\n\nGli attiratori di fulmini con livelli di qualità molto alti hanno aree di copertura significativamente aumentate, che possono causare picchi di lag di notte su Fulgora.\n\n[color=green]Predefinito: leggendario[/color]
enable-reactors=Abilita i miglioramenti per i reattori nucleari e a fusione.
enable-rocket-silos=Abilita i miglioramenti per i silos razzi.
enable-roboports=Abilita i miglioramenti per le porte robot.
enable-solar-panels=Abilita i miglioramenti per i pannelli solari.
enable-thrusters=Abilita i miglioramenti per i propulsori spaziali. Astronavi più veloci possono sopraffare le proprie difese.
thruster-growth-level-limit=Permette di limitare i propulsori spaziali ai livelli vanilla. I livelli di qualità moddati possono far muovere le astronavi significativamente più velocemente, sopraffacendone le difese.
enable-turrets=Abilita i miglioramenti per torrette a proiettili, laser, lanciafiamme e d'artiglieria. Le torrette guadagnano 'ore di produzione' infliggendo danni.
turret-damage-per-manufacturing-hour=La quantità di danno che una torretta deve infliggere per guadagnare un'ora di produzione.\n\nPredefinito: 36.000 di danno (derivato da una torretta di livello base che spara proiettili perforanti ininterrottamente per un'ora).
turrets-contribute-credits=Consente alle torrette di contribuire ai miglioramenti delle entità secondarie, come inseritori e pali elettrici, sulla stessa superficie. Questo può accelerare molto i miglioramenti nelle fasi avanzate con cannoni a rotaia e torrette elettriche.
enable-defense-walls-and-gates=Abilita i miglioramenti per muri e cancelli.
custom-upgrade-limit-a=Livello massimo di qualità usato dall'impostazione 'Personalizzato A' nei limiti sottostanti. Necessario solo se hai una mod che aggiunge livelli di qualità oltre il leggendario e vuoi limitare il livello raggiungibile da un'entità, ad esempio per consentire ai collettori di asteroidi di raggiungere il livello 10. Per usare questa funzione, imposta qui il livello massimo, poi vai all'entità che vuoi limitare e seleziona 'Personalizzato A' nel menu a tendina. Per riferimento, leggendario è il livello 5.
custom-upgrade-limit-b=Livello massimo di qualità usato da Personalizzato B nelle impostazioni dei limiti di miglioramento.
custom-upgrade-limit-c=Livello massimo di qualità usato da Personalizzato C nelle impostazioni dei limiti di miglioramento.
upgrade-limit-accumulators=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-agricultural-towers=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-assembly-machines=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-beacons=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-boilers=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-combinators-and-speakers=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.\n\nInclude: combinatori aritmetici, combinatori decisionali, combinatori costanti, altoparlanti programmabili.
upgrade-limit-defense-walls-and-gates=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-furnaces=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-generators=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.\n\nInclude: motori a vapore, turbine a vapore, generatori a fusione.
upgrade-limit-heat-pipes=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-inserters=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-labs=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-lamps=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-mining-drills=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-poles=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.\n\nInclude pali elettrici e sottostazioni.
upgrade-limit-power-switches=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-pumps=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.\n\nInclude: pompe offshore e pompe per fluidi.
upgrade-limit-reactors=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.\n\nInclude: reattori nucleari, reattori a fusione.
upgrade-limit-rocket-silos=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-roboports=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-solar-panels=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.
upgrade-limit-turrets=Qualità massima raggiungibile da queste entità. Comune disabilita i miglioramenti; Personalizzato A/B/C usa il livello personalizzato specificato sopra.\n\nInclude: torrette a proiettili, torrette laser, lanciafiamme, torrette d'artiglieria.
upgrade-limit-asteroid-collectors=Limita i collettori di asteroidi a leggendario per prevenire problemi che compromettono il gioco. I livelli moddati possono creare troppi bracci che si muovono troppo velocemente, rendendoli incapaci di raccogliere frammenti di asteroidi e causando un forte calo degli UPS.
upgrade-limit-radar=Limita i radar a leggendario per evitare un aumento eccessivo delle dimensioni dei salvataggi. Le qualità moddate possono causare un'esplorazione eccessiva della mappa e file molto grandi, oltre un gigabyte.
upgrade-limit-lightning-rods=Limita gli attiratori di fulmini a leggendario per prevenire picchi di UPS. Gli attiratori con livelli di qualità moddati hanno aree di copertura significativamente più estese, che possono causare picchi di lag di notte su Fulgora.
upgrade-limit-thrusters=Limita i propulsori spaziali a leggendario per prevenire danni imprevisti alle piattaforme spaziali. I livelli di qualità moddati possono far muovere le astronavi significativamente più velocemente, sopraffacendone le difese.

