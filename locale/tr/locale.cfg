upgrade-limit-reactors=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.\n\nİçerir: nükleer reaktörler, füzyon reaktörleri.
