upgrade-limit-roboports=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-solar-panels=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-turrets=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.\n\nİçerir: mermi kuleleri, lazer kuleleri, alev makineleri, topçu kuleleri.
upgrade-limit-asteroid-collectors=Oyun kırıcı sorunları önlemek için asteroit toplayıcı kalite büyümesini vanilya değerleriyle sınırlar.\n\nModlu kalite kademeli asteroit toplayıcılar, çok hızlı hareket eden çok fazla kola sahip olabilir, asteroit parçalarını tutamaz hale gelir ve büyük bir UPS tüketimine yol açar.\n\n[color=green]Varsayılan: efsanevi[/color]
upgrade-limit-radar=Aşırı harita keşfini ve kayıt dosyası şişmesini önlemek için radar kalite büyümesini sınırlar.\n\nÇok yüksek kalite seviyeli radarlar, aşırı harita keşfi nedeniyle büyük kayıt dosyalarına (1,200mb+) neden olabilir.\n\n[color=green]Varsayılan: efsanevi[/color]
upgrade-limit-lightning-rods=Performans sorunlarını önlemek için yıldırım çekici kalite büyümesini sınırlar.\n\nÇok yüksek kalite seviyeli yıldırım çekiciler önemli ölçüde artırılmış kapsama alanlarına sahiptir, bu da Fulgora'da gece gecikme kesintilerine neden olabilir.\n\n[color=green]Varsayılan: efsanevi[/color]
upgrade-limit-thrusters=Savunma sorunlarını önlemek için uzay iticisi kalite büyümesini vanilya seviyelerine sınırlar.\n\nModlu kalite kademeleri uzay gemilerini önemli ölçüde daha hızlı hareket ettirebilir, bu da savunmalarını bunaltabilir.\n\n[color=green]Varsayılan: efsanevi[/color]

