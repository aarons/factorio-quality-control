[mod-setting-description]
manufacturing-hours-for-change=Kalite değişiminin denenmesi için gereken üretim saati sayısı.\nÜretim saatleri yalnızca makine aktif olarak çalışırken birikir. Makine boşta kalırsa ilerleme kaydedilmez.\nMin değer 0.001 saat (3.6 saniye), Maks değer 1000 saat.
crafting-speed-affects-progression=[color=red]Devre Dışı (varsayılan):[/color] Üretim hızı ilerlemeyi etkilemez; bu, yükseltmelerin uzun oyunlarda daha dengeli dağılmasını sağlar.\n\n[color=green]Etkin:[/color] Üretim hızı ve verimlilik, kazanılan üretim saatlerini artırır. Hızı 4 ve verimliliği %50 olan bir makine, hızı 1 olan ve verimlilik bonusu olmayan bir makinenin altı katı üretim saati kazanır. Kalite yükseltmelerinden gelen hız artışları birikerek oyunun ilerleyen aşamalarında çok hızlı yükseltmelere yol açabilir.
percentage-chance-of-change=Bir yükseltme denemesinin başarılı olma şansı.
quality-increase-cost=Kalite seviyesi başına gereken üretim saatlerindeki artış. Artış bileşiktir; %0 tüm seviyelerde gereksinimi aynı tutar.\n\n%50 artışla, 3 saatlik gereksinim sıra dışı kalitede 4,5 saate, nadir kalitede 6,75 saate çıkar.
quality-chance-accumulation-rate=Başarısız bir denemeden sonra yükseltme şansını temel şansın belirli bir yüzdesi kadar artırır.\n\n[color=white]Yok:[/color] Şans sabit kalır.\n[color=white]Düşük:[/color] Temel şansın %20'sini ekler.\n[color=white]Orta:[/color] Temel şansın %50'sini ekler.\n[color=white]Yüksek:[/color] Temel şansın %100'ünü ekler.\n\n%1 temel şansla Düşük ayarında %1 → %1,2 → %1,4..., Yüksek ayarında %1 → %2 → %3... elde edilir.
secondary-progression-rate=Yerleştiriciler, direkler ve beakonlar gibi kendi işini ölçemeyen varlıkların ilerleme hızı.\n\n%100, aynı yüzeydeki birincil varlıkların kazandığı ortalama üretim saatine eşittir. Daha yüksek değerler ilerlemeyi hızlandırır; %0 ilerlemeyi duraklatır.
change-modules-with-entity=[color=white]Devre dışı:[/color] Modüller yükseltilmez.\n\n[color=white]Etkin:[/color] Makine yükseltildiğinde modüller, makinenin kalitesini aşmayacak şekilde bir kademe yükselir.\n\n[color=white]Ekstra Etkin:[/color] Modüller, makinelerinin yeni kalitesine eşleşecek şekilde yükselir.\n\n[color=white]Bağımsız:[/color] Modüller ikincil ilerlemeden kendi yükseltme denemelerini kazanır ve makinelerinin kalite sınırını aşabilir. Makine sınırını Normal olarak ayarlamak modül yükseltmelerini de devre dışı bırakır.
batch-entities-per-tick=Her toplu işlemde işlenen varlık sayısı. Daha büyük gruplar yükseltmeleri daha hızlı işler ancak gecikmeye neden olabilir. Bağımsız modda modül yuvaları da sayılır.
batch-ticks-between-processing=Toplu işlemler arasındaki tick sayısı. Daha kısa aralıklar yükseltmeleri daha sık işler ancak performansı düşürebilir.
quality-change-aggregate-alerts-enabled=Her beş dakikada bir yükseltme özeti göster.
quality-change-entity-alerts-enabled=Yükseltme konumlarında harita uyarı simgelerini göster.
quality-change-chat-enabled=Varlık veya modül simgeleri, kalite simgeleri ve rastgele gökkuşağı renkli harflerle yükseltme mesajları göster.
quality-change-gps-enabled=Her yükseltme için tıklanabilir bir konum bağlantısı göster ve Factorio'nun GPS harita işaretini tetikle. Konuma tekrar gitmek için bağlantıya tıkla. Renkli yükseltme sohbeti etkinse bağlantıyı mesaja ekler; aksi halde yalnızca bağlantıyı gösterir. Oyunun GPS işareti bir sohbet bağlantısı gerektirir.
quality-change-floating-text-enabled=Yeni kalitenin renginde yükselen bir yükseltme metni göster.
quality-change-halo-enabled=Yükseltme konumlarında yeni kalitenin renginde genişleyen bir hale göster.
quality-change-rainbow-enabled=Yükseltme konumlarında genişleyen gökkuşağı halkaları göster.
quality-change-badge-enabled=Yeni kalitenin simgesini 4,5 saniye boyunca büyüyüp yükselirken ve kaybolana kadar sürekli dönerken göster.
quality-change-bubbles-enabled=Yükseltme konumlarında yeni kalitenin küçük simgelerini baloncuklar gibi yukarı doğru yükselterek göster.
quality-change-sound-enabled=Uzaktan görünüm dahil, görüntülemekte olduğun yüzeydeki yükseltmeler için seçilen sesi çal.
quality-change-sound=Bir bildirim efekti, hoparlör alarmı, davul sesi veya müzik enstrümanı seç. Enstrümanlar, Yükseltme Enstrüman Notası / Kök Nota ve Yükseltme Nota Davranışı ayarlarını kullanır. Yalnızca Yükseltme Sesi etkinse ve görüntülemekte olduğun yüzeydeki yükseltmeler için çalınır.
quality-change-sound-note=Sabit nota veya müzik kalıpları için kök nota (ton ve başlangıç ses bölgesi). Alarmlar, davullar, efektler ve Tamamen rastgele modunda yok sayılır.\nNotalar F'den başlayarak yarım ses aralıklarla yükselir: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; sonraki oktav için 12 ekle. Varsayılan: 20 (C).\nPiyanoda 48, diğer enstrümanlarda 36 nota vardır. Sabit mod, notayı kullanılabilen en yüksek notayla sınırlar. Müzik kalıpları gerektiğinde tonu koruyarak tam oktavlarla aşağı kaydırılır. Aynı ayarlar her enstrümanın kendi ses bölgesinde eşdeğer kalıplar oluşturur.
quality-change-sound-mode=Sesli her yükseltmede bir nota çalınır ve her oyuncunun ayrı bir kalıbı vardır. Sabit nota seçilen notayı korur; Müzikal gezinme dizide bir veya iki adım ilerler; Rüzgâr çanları rastgele majör pentatonik notalar seçer; Merdiven tekrar tekrar yükselip alçalır; Dizide rastgele, seçilen dizi ve aralıktan herhangi bir nota seçer; Tamamen rastgele, enstrümanın tüm aralığını kullanır.\nMüzikal gezinme ve Merdiven kök notadan başlar; sessiz dönemlerden ve kaydetme/yüklemeden sonra kaldıkları yerden devam eder. Gecikmeli notalar sıraya alınmaz. Yalnızca müzik enstrümanlarını etkiler.
quality-change-sound-scale=Yükseltme Enstrüman Notası / Kök Nota esas alınarak Müzikal gezinme, Merdiven ve Dizide rastgele modlarında kullanılan dizi. Kromatik tüm yarım seslere izin verir. Rüzgâr çanları her zaman majör pentatonik kullanır; Sabit nota ve Tamamen rastgele bu ayarı yok sayar.
quality-change-sound-range=Kök notadan başlayan ve gerekirse enstrümana sığması için tam oktavlarla aşağı kaydırılan bir veya iki oktav ya da enstrümanın tam aralığı. Müzikal gezinme, Rüzgâr çanları, Merdiven ve Dizide rastgele için geçerlidir. Sabit nota ve Tamamen rastgele bu ayarı yok sayar.
quality_control_skip_hidden_qualities=Yükseltme yaparken gizli kaliteleri (örneğin parlak varyantları) atla. Bu ayar yalnızca Shiny Mechanics gibi bir mod yüklediğinizde geçerlidir.
quality_control_hidden_qualities_sticky==Gizli kalitelere (örneğin parlak) sahip varlıklar daha fazla yükseltilmez ve benzersiz faydalarını korur. Bu ayar yalnızca Shiny Mechanics gibi bir mod yüklediğinizde geçerlidir.
enable-accumulators=Akümülatörler için yükseltmeleri etkinleştir.
enable-agricultural-towers=Tarım kuleleri için yükseltmeleri etkinleştir.
enable-assembly-machines=Montaj makineleri için yükseltmeleri etkinleştir.
enable-asteroid-collectors=Asteroit toplayıcıları için yükseltmeleri etkinleştir.
asteroid-collector-growth-level-limit=Oyun kırıcı sorunları önlemek için asteroit toplayıcı kalite büyümesini vanilya değerleriyle sınırlar.\n\nModlu kalite kademeli asteroit toplayıcılar, çok hızlı hareket eden çok fazla kola sahip olabilir, asteroit parçalarını tutamaz hale gelir ve büyük bir UPS tüketimine yol açar.\n\n[color=green]Varsayılan: efsanevi[/color]
enable-beacons=Beakonlar için yükseltmeleri etkinleştir.
enable-boilers=Kazanlar için yükseltmeleri etkinleştir.
enable-combinators-and-speakers=Kombinatörler ve programlanabilir hoparlörler için yükseltmeleri etkinleştir.
enable-pumps=Kıyı pompaları ve sıvı pompaları için yükseltmeleri etkinleştir.
enable-furnaces=Fırınlar için yükseltmeleri etkinleştir.
enable-generators=Buhar makineleri, buhar türbinleri ve füzyon jeneratörleri için yükseltmeleri etkinleştir.
enable-heat-pipes=Isı boruları için yükseltmeleri etkinleştir.
enable-inserters=Yerleştiriciler için yükseltmeleri etkinleştir.
enable-labs=Araştırma laboratuvarları için yükseltmeleri etkinleştir.
enable-lamps=Lambalar için yükseltmeleri etkinleştir.
enable-lightning-rods=Yıldırım çubukları için yükseltmeleri etkinleştir.
enable-mining-drills=Maden matkapları için yükseltmeleri etkinleştir.
enable-poles=Elektrik direkleri ve trafo merkezleri için yükseltmeleri etkinleştir.
enable-power-switches=Güç anahtarları için yükseltmeleri etkinleştir.
enable-radar=Radar istasyonları için yükseltmeleri etkinleştir.
radar-growth-level-limit=Aşırı harita keşfini ve kayıt dosyası şişmesini önlemek için radar kalite büyümesini sınırlar.\n\nÇok yüksek kalite seviyeli radarlar, aşırı harita keşfi nedeniyle büyük kayıt dosyalarına (1,200mb+) neden olabilir.\n\n[color=green]Varsayılan: efsanevi[/color]
lightning-attractor-growth-level-limit=Performans sorunlarını önlemek için yıldırım çekici kalite büyümesini sınırlar.\n\nÇok yüksek kalite seviyeli yıldırım çekiciler önemli ölçüde artırılmış kapsama alanlarına sahiptir, bu da Fulgora'da gece gecikme kesintilerine neden olabilir.\n\n[color=green]Varsayılan: efsanevi[/color]
enable-reactors=Nükleer ve füzyon reaktörleri için yükseltmeleri etkinleştir.
enable-rocket-silos=Roket siloları için yükseltmeleri etkinleştir.
enable-roboports=Robo-limanlar için yükseltmeleri etkinleştir.
enable-solar-panels=Güneş panelleri için yükseltmeleri etkinleştir.
enable-thrusters=Uzay iticileri için yükseltmeleri etkinleştir. Daha hızlı gemilerin savunmaları yetersiz kalabilir.
thruster-growth-level-limit=İsteğe bağlı olarak uzay iticilerini vanilya seviyeleriyle sınırla. Modlu kalite kademeleri uzay gemilerini önemli ölçüde hızlandırabilir ve savunmalarının yetersiz kalmasına yol açabilir.
enable-turrets=Mermi, lazer, alev makinesi ve topçu taretleri için yükseltmeleri etkinleştir. Taretler hasar vererek 'üretim saati' kazanır.
turret-damage-per-manufacturing-hour=Bir taretin bir üretim saati kazanmak için vermesi gereken hasar miktarı.\n\nVarsayılan: 36.000 hasar (temel seviye bir montaj makinesinin bir saatte üretebildiği zırh delici mermi miktarından türetilmiştir).
turrets-contribute-credits=Taretlerin, aynı yüzeydeki yerleştiriciler ve elektrik direkleri gibi ikincil varlıkların yükseltmelerine katkıda bulunmasını sağlar. Bu, oyunun ilerleyen aşamalarında raylı toplar ve yıldırım taretleriyle yükseltmeleri büyük ölçüde hızlandırabilir.
enable-defense-walls-and-gates=Duvarlar ve kapılar için yükseltmeleri etkinleştir.
custom-upgrade-limit-a=Aşağıdaki sınırlayıcılarda 'Özel A' ayarının kullandığı maksimum kalite seviyesi. Yalnızca efsanevinin ötesinde kalite seviyeleri ekleyen bir mod kullanırken bir varlığın yükselebileceği seviyeyi sınırlamak istiyorsanız gereklidir. Örneğin, asteroit toplayıcılarının 10. seviyeye ulaşmasını sağlayabilirsiniz. Bu özelliği kullanmak için buraya maksimum seviyeyi girin, ardından sınırlamak istediğiniz varlığa gidip açılır menüden 'Özel A' seçeneğini seçin. Referans olarak, efsanevi 5. seviyedir.
custom-upgrade-limit-b=Yükseltme sınırı ayarlarında Özel B'nin kullandığı maksimum kalite seviyesi.
custom-upgrade-limit-c=Yükseltme sınırı ayarlarında Özel C'nin kullandığı maksimum kalite seviyesi.
upgrade-limit-accumulators=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-agricultural-towers=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-assembly-machines=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-beacons=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-boilers=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-combinators-and-speakers=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.\n\nİçerir: aritmetik kombinatörler, karar kombinatörleri, sabit kombinatörler, programlanabilir hoparlörler.
upgrade-limit-defense-walls-and-gates=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-furnaces=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-generators=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.\n\nİçerir: buhar makineleri, buhar türbinleri, füzyon jeneratörleri.
upgrade-limit-heat-pipes=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-inserters=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-labs=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-lamps=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-mining-drills=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-poles=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.\n\nElektrik direklerini ve trafo merkezlerini içerir.
upgrade-limit-power-switches=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-pumps=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.\n\nİçerir: kıyı pompaları ve sıvı pompaları.
upgrade-limit-reactors=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.\n\nİçerir: nükleer reaktörler, füzyon reaktörleri.
upgrade-limit-rocket-silos=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-roboports=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-solar-panels=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.
upgrade-limit-turrets=Bu varlıklar için maksimum yükseltme kalitesi. Normal yükseltmeleri devre dışı bırakır; Özel A/B/C yukarıda belirtilen özel seviyeyi kullanır.\n\nİçerir: mermi kuleleri, lazer kuleleri, alev makineleri, topçu kuleleri.
upgrade-limit-asteroid-collectors=Oynanışı bozan sorunları önlemek için asteroit toplayıcılarını efsanevi kaliteyle sınırla. Modlu seviyeler, çok hızlı hareket eden ve asteroit parçalarını tutamayan aşırı sayıda kol oluşturarak UPS'yi ciddi ölçüde düşürebilir.
upgrade-limit-radar=Kayıt dosyasının şişmesini önlemek için radarları efsanevi kaliteyle sınırla. Modlu kaliteler, aşırı harita keşfine ve çok büyük dosyalara (bir gigabayttan fazla) yol açabilir.
upgrade-limit-lightning-rods=UPS dalgalanmalarını önlemek için yıldırım çekicileri efsanevi kaliteyle sınırla. Modlu kalite seviyelerindeki yıldırım çekicilerin kapsama alanları önemli ölçüde artar ve bu, Fulgora'da geceleri ani gecikmelere neden olabilir.
upgrade-limit-thrusters=Uzay platformunun beklenmedik hasar almasını önlemek için uzay iticilerini efsanevi kaliteyle sınırla. Modlu kalite kademeleri uzay gemilerini önemli ölçüde hızlandırabilir ve savunmalarının yetersiz kalmasına yol açabilir.

