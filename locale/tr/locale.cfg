upgrade-limit-lamps=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-mining-drills=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-poles=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.\n\nİçerir: tüm elektrik direkleri, büyük elektrik direkleri ve trafo merkezleri.
upgrade-limit-power-switches=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
