[mod-setting-description]
manufacturing-hours-for-change=Kalite değişiminin denenmesi için gereken üretim saati sayısı.\nÜretim saatleri yalnızca makine aktif olarak çalışırken birikir. Makine boşta kalırsa ilerleme kaydedilmez.\nMin değer 0.001 saat (3.6 saniye), Maks değer 1000 saat.
crafting-speed-affects-progression=Bir makinenin üretim hızının, üretim saati kazanma hızını etkileyip etkilemediğini kontrol eder.\n\n[color=green]Etkin (varsayılan):[/color] Üretim hızı daha yüksek olan makineler daha hızlı ilerler. Üretim saatleri, makinenin üretim hızına ve verimliliğine göre kazanılır. Hızı 4 ve verimliliği %50 olan bir döküm ocağı, üretim hızı 1 olan bir Montaj Makinesi 2'ye göre altı kat daha hızlı ilerler.\n\n[color=red]Devre Dışı:[/color] Üretim hızının ilerleme üzerinde hiçbir etkisi yoktur. Üretim hızından bağımsız olarak, aktif üretimle geçirilen bir saat, bir üretim saati olarak sayılır. Bu, her kalite yükseltmesinin bir sonrakini hızlandırdığı birikimli etkiyi ortadan kaldırır.
percentage-chance-of-change=Kalite değişiminin başarılı olma yüzde şansı.\nMin değer 0.0001%, Maks değer 100% (süre geçtikten sonra her zaman değişim)
quality-increase-cost=Bu, kalite seviyesi başına değişim denemeleri arasındaki süreyi artırır. Bu bileşik bir formüldür. 0% olarak ayarlamak, kalite seviyesi ne olursa olsun denemeler arasındaki süreyi aynı tutar\n\n[color=green]Seviye başına 50% maliyet ile 3 üretim saati gerekli örnek[/color]\n\nNormal: 3 saat\nSıradışı: 4.5 saat\nNadir: 6.8 saat\nEpik: 10.1 saat\nEfsanevi: 15.2 saat\nModlu kalite seviye 10: 173 saat
quality-chance-accumulation-rate=Her başarısız denemeden sonra şansın ne kadar arttığını kontrol eder.\n\n[color=white]Yok (Varsayılan):[/color] Birikim yok - şans sabit kalır.\n\n[color=white]Düşük (20%):[/color] Her başarısızlıkta şans temel oranın %20'si kadar artar.\n\n[color=white]Orta (50%):[/color] Her başarısızlıkta şans temel oranın %50'si kadar artar.\n\n[color=white]Yüksek (100%):[/color] Her başarısızlıkta şans temel oranın %100'ü kadar artar.\n\n[color=yellow]%1 temel şans ile örnek:[/color]\n\n[color=white]Düşük:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]Yüksek:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nTüm birikim ayarları sonunda kalite değişimlerini garanti eder - daha yüksek ayarlar sadece %100 şansa daha hızlı ulaşır
secondary-progression-rate=İkincil varlıkların (yerleştiriciler, direkler, fenerler - kendi işini ölçemeyen her şey) aynı yüzeydeki ortalama birincil varlığın kazandığının yüzdesi olarak ne hızda ilerlediği.\n\n[color=green]%100 (varsayılan):[/color] İkincil varlıklar, çevrelerindeki ortalama montaj makinesi, fırın, silo veya nöbetçi kulesiyle aynı hızda ilerler.\n\nİkincil ilerlemeyi tamamen durdurmak için %0 olarak ayarlayın; %100'ün üzerindeki değerler, altyapı yükseltmelerini üretim makinelerinin hızının ötesinde hızlandırır.\n\nYeniden başlatmaya gerek kalmadan oyun sırasında değiştirilebilir.
change-modules-with-entity=Bu, makinelerdeki modüllerin kalite değişimlerinden etkilenip etkilenmediğini kontrol eder.\n\n[color=white]Devre dışı (Varsayılan):[/color] Ana makinenin kalitesi değiştiğinde modüller etkilenmez.\n\n[color=white]Etkin:[/color] Ana makine değiştiğinde modüller bir seviye kalite değiştirir. Ana makinenin kalite seviyesini aşmazlar.\n\n[color=white]Ekstra Etkin:[/color] Etkin gibi, ancak kalite değişimi her gerçekleştiğinde modüller ana makine kalitesine eşleşecek şekilde güncellenecektir.
batch-entities-per-tick=Performans kesintilerini önlemek için her tick'te işlenecek varlık sayısı.\nMin değer 1, Maks değer 1000.\nDaha yüksek değerler gecikme kesintilerine neden olabilir ancak varlıkları daha hızlı işler.
batch-ticks-between-processing=Toplu işlem döngüleri arasında beklenecek tick sayısı.\nMin değer 1 tick, Maks değer 6000 tick (~2.5 dakika).\nDaha düşük değerler daha sık işler ancak performansı etkileyebilir.
quality-change-aggregate-alerts-enabled=Tüm kalite değişimlerini özetleyen konsol mesajlarını göster (5 dakikada bir görüntülenir). Örnek: "3 montaj makinesi yükseltildi, 2 yerleştirici yükseltildi"
quality-change-entity-alerts-enabled=Kaliteleri değiştiğinde bireysel varlıklarda harita ping uyarılarını göster. Yükseltilen varlığı görüntülemek için uyarıya tıklayın.
quality_control_skip_hidden_qualities=Kalite Kontrolü yükseltme yaparken gizli kaliteleri (örneğin parlak varyantlar) atlayacaktır. Varlıklar Kalite Kontrolü aracılığıyla asla parlak olmayacak - oyuncuların bunları normal yoldan elde etmeleri gerekir. Bu ayar yalnızca Shiny Mechanics kalite modunu yüklediğinizde geçerlidir.
quality_control_hidden_qualities_sticky=Gizli kalitelere (örneğin parlak) sahip varlıklar daha fazla yükseltilmeyecek ve benzersiz faydalarını koruyacaktır. Bu ayar yalnızca Shiny Mechanics kalite modunu yüklediğinizde geçerlidir.
enable-accumulators=Akümülatörler için kalite değişimlerini etkinleştir.
enable-agricultural-towers=Tarım kuleleri için kalite değişimlerini etkinleştir.
enable-assembly-machines=Montaj makineleri için kalite değişimlerini etkinleştir.
enable-asteroid-collectors=Asteroit toplayıcıları için kalite değişimlerini etkinleştir.
asteroid-collector-growth-level-limit=Oyun kırıcı sorunları önlemek için asteroit toplayıcı kalite büyümesini vanilya değerleriyle sınırlar.\n\nModlu kalite kademeli asteroit toplayıcılar, çok hızlı hareket eden çok fazla kola sahip olabilir, asteroit parçalarını tutamaz hale gelir ve büyük bir UPS tüketimine yol açar.\n\n[color=green]Varsayılan: efsanevi[/color]
enable-beacons=Beakonlar için kalite değişimlerini etkinleştir.
enable-boilers=Kazanlar için kalite değişimlerini etkinleştir.
enable-combinators-and-speakers=Kombinatörler ve hoparlörler için kalite değişimlerini etkinleştir.\n\nİçerir: aritmetik kombinatörler, karar kombinatörleri, sabit kombinatörler, programlanabilir hoparlörler.
enable-pumps=Pompalar için kalite değişimlerini etkinleştir (açık deniz pompaları ve sıvı pompalarını içerir).
enable-furnaces=Fırınlar için kalite değişimlerini etkinleştir.
enable-generators=Jeneratörler için kalite değişimlerini etkinleştir (buhar motorları, buhar türbinleri, füzyon jeneratörleri).
enable-heat-pipes=Isı boruları için kalite değişimlerini etkinleştir.
enable-inserters=Yerleştiriciler için kalite değişimlerini etkinleştir.
enable-labs=Araştırma laboratuvarları için kalite değişimlerini etkinleştir.
enable-lamps=Lambalar için kalite değişimlerini etkinleştir.
enable-lightning-rods=Yıldırım çubukları için kalite değişimlerini etkinleştir.
enable-mining-drills=Tüm maden matkaplari için kalite değişimlerini etkinleştir.
enable-poles=Tüm elektrik direkleri için kalite değişimlerini etkinleştir (büyük güç direkleri ve trafo merkezlerini içerir).
enable-power-switches=Güç anahtarları için kalite değişimlerini etkinleştir.
enable-radar=Radar istasyonları için kalite değişimlerini etkinleştir.
radar-growth-level-limit=Aşırı harita keşfini ve kayıt dosyası şişmesini önlemek için radar kalite büyümesini sınırlar.\n\nÇok yüksek kalite seviyeli radarlar, aşırı harita keşfi nedeniyle büyük kayıt dosyalarına (1,200mb+) neden olabilir.\n\n[color=green]Varsayılan: efsanevi[/color]
lightning-attractor-growth-level-limit=Performans sorunlarını önlemek için yıldırım çekici kalite büyümesini sınırlar.\n\nÇok yüksek kalite seviyeli yıldırım çekiciler önemli ölçüde artırılmış kapsama alanlarına sahiptir, bu da Fulgora'da gece gecikme kesintilerine neden olabilir.\n\n[color=green]Varsayılan: efsanevi[/color]
enable-reactors=Reaktörler için kalite değişimlerini etkinleştir (nükleer reaktörler, füzyon reaktörleri).
enable-rocket-silos=Roket siloları için kalite değişimlerini etkinleştir.
enable-roboports=Robo-limanlar için kalite değişimlerini etkinleştir.
enable-solar-panels=Güneş panelleri için kalite değişimlerini etkinleştir.
enable-thrusters=Uzay iticileri için kalite değişimlerini etkinleştir. Bir uzay gemisinin hızını beklenmedik şekilde değiştirmek savunmaların bunalmasına yol açabileceğinden varsayılan olarak devre dışıdır.
thruster-growth-level-limit=Savunma sorunlarını önlemek için uzay iticisi kalite büyümesini vanilya seviyelerine sınırlar.\n\nModlu kalite kademeleri uzay gemilerini önemli ölçüde daha hızlı hareket ettirebilir, bu da savunmalarını bunaltabilir.\n\n[color=green]Varsayılan: efsanevi[/color]
enable-turrets=Taretler için kalite değişimlerini etkinleştir.\n\nTaretler, biriktirilen hasara dayalı olarak yükseltme kredileri üreten birincil varlıklardır.\n\nİçerir: cephane taretleri, lazer taretleri, alev makineleri, topçu taretleri.
turret-damage-per-manufacturing-hour=Bir üretim saatine eşit olmak için bir taretin verdiği hasar miktarı.\n\nVarsayılan: 36.000 hasar (zırh delici mermilerden türetilmiştir: 450 şarjör/saat × 80 hasar/şarjör).\n\nDaha düşük değerler taretlerin kredi üretimini hızlandırır. Daha yüksek değerler kredi üretimini yavaşlatır.
turrets-contribute-credits=Kulelerin kazandığı yükseltme kredilerinin, ikincil varlıkları (yerleştiriciler, güç direkleri vb.) yükselten ortak havuzu da besleyip beslemeyeceğini kontrol eder.\n\n[color=red]Devre Dışı (varsayılan):[/color] Kule kredileri kulede kalır. Muharebe hasarı yalnızca kulelerin kendini yükseltmesine yardımcı olur.\n\n[color=green]Etkin:[/color] Kule kredileri ortak havuza da akar, böylece muharebe hasarı ikincil varlıkları üretimin yaptığı gibi ilerletir.
enable-defense-walls-and-gates=Duvarlar ve kapılar için kalite değişimlerini etkinleştir.\n\nİçerir: duvarlar, kapılar.
custom-upgrade-limit-a=Bu ayarı, varlıklar için modlu kalitelerde özel sınırlar belirlemek üzere kullanın. Yalnızca efsanevinin ötesinde kalite seviyeleri ekleyen bir mod kullanıyorsanız ve bir varlığın ne kadar yükseleceğini sınırlamak istiyorsanız gereklidir. Bu özelliği kullanmak için buraya maksimum seviyeyi girin, ardından sınırlamak istediğiniz varlığa gidip açılır menüden 'Özel A' seçeneğini seçin. Referans olarak, efsanevi 5. seviyedir (normal = 1, sıra dışı = 2, nadir = 3, destansı = 4, efsanevi = 5...).
custom-upgrade-limit-b=Bu ayarı, varlıklar için modlu kalitelerde özel sınırlar belirlemek üzere kullanın. Yalnızca efsanevinin ötesinde kalite seviyeleri ekleyen bir mod kullanıyorsanız ve bir varlığın ne kadar yükseleceğini sınırlamak istiyorsanız gereklidir. Bu özelliği kullanmak için buraya maksimum seviyeyi girin, ardından sınırlamak istediğiniz varlığa gidip açılır menüden 'Özel B' seçeneğini seçin. Referans olarak, efsanevi 5. seviyedir (normal = 1, sıra dışı = 2, nadir = 3, destansı = 4, efsanevi = 5...).
custom-upgrade-limit-c=Bu ayarı, varlıklar için modlu kalitelerde özel sınırlar belirlemek üzere kullanın. Yalnızca efsanevinin ötesinde kalite seviyeleri ekleyen bir mod kullanıyorsanız ve bir varlığın ne kadar yükseleceğini sınırlamak istiyorsanız gereklidir. Bu özelliği kullanmak için buraya maksimum seviyeyi girin, ardından sınırlamak istediğiniz varlığa gidip açılır menüden 'Özel C' seçeneğini seçin. Referans olarak, efsanevi 5. seviyedir (normal = 1, sıra dışı = 2, nadir = 3, destansı = 4, efsanevi = 5...).
upgrade-limit-accumulators=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-agricultural-towers=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-assembly-machines=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-beacons=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-boilers=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-combinators-and-speakers=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.\n\nİçerir: aritmetik kombinatörler, karar kombinatörleri, sabit kombinatörler, programlanabilir hoparlörler.
upgrade-limit-defense-walls-and-gates=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.\n\nİçerir: duvarlar, kapılar.
upgrade-limit-furnaces=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
upgrade-limit-generators=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.\n\nİçerir: buhar makineleri, buhar türbinleri, füzyon jeneratörleri.
upgrade-limit-heat-pipes=Kalite Kontrolü bu varlıkları bu kaliteye kadar yükseltir, ardından daha fazla yükseltme denemesini durdurur. Herhangi bir yükseltme denemesini önlemek için bunu Normal olarak ayarlayın. Özel değerler Özel yükseltme sınırı A/B/C ayarlarını kullanır.
