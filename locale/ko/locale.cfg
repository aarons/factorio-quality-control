upgrade-limit-mining-drills=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-poles=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.\n\n전봇대와 변전소가 포함됩니다.
upgrade-limit-power-switches=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-pumps=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.\n\n포함: 해안 펌프와 유체 펌프.
upgrade-limit-reactors=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.\n\n포함: 원자로, 핵융합로.
upgrade-limit-rocket-silos=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-roboports=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-solar-panels=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-turrets=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.\n\n포함: 탄약 포탑, 레이저 포탑, 화염방사 포탑, 포병 포탑.
upgrade-limit-asteroid-collectors=게임에 심각한 문제가 생기는 것을 방지하려면 소행성 수집기를 전설로 제한하세요. 모드 품질 레벨에서는 팔이 너무 많고 빠르게 움직여 소행성 조각을 잡지 못하고 UPS가 크게 저하될 수 있습니다.
upgrade-limit-radar=저장 파일 크기가 커지는 것을 방지하려면 레이더를 전설로 제한하세요. 모드 품질에서는 지도를 과도하게 탐색하여 파일 크기가 매우 커질 수 있습니다(1GB 이상).
upgrade-limit-lightning-rods=UPS가 급격히 저하되는 것을 방지하려면 번개 유인기를 전설로 제한하세요. 모드 품질 레벨의 번개 유인기는 범위가 크게 증가하여 풀고라의 밤에 순간적인 지연을 유발할 수 있습니다.
upgrade-limit-thrusters=우주 플랫폼이 예상치 못한 피해를 입는 것을 방지하려면 우주 추진기를 전설로 제한하세요. 모드 품질 단계로 인해 우주선이 상당히 빨라져 방어가 압도될 수 있습니다.

