upgrade-limit-solar-panels=품질 제어는 이 개체들을 이 품질까지 업그레이드한 후 추가 업그레이드 시도를 중단합니다. 업그레이드 시도를 방지하려면 일반으로 설정하세요. 사용자 지정 값은 사용자 지정 업그레이드 한도 A/B/C 설정을 사용합니다.
upgrade-limit-turrets=품질 제어는 이 개체들을 이 품질까지 업그레이드한 후 추가 업그레이드 시도를 중단합니다. 업그레이드 시도를 방지하려면 일반으로 설정하세요. 사용자 지정 값은 사용자 지정 업그레이드 한도 A/B/C 설정을 사용합니다.\n\n포함: 탄약 터렛, 레이저 터렛, 화염방사기, 대포병 터렛.
upgrade-limit-asteroid-collectors=게임을 망가뜨리는 문제를 방지하기 위해 소행성 수집기 품질 성장을 바닐라 값으로 제한합니다.\n\n모드된 품질 티어를 가진 소행성 수집기는 너무 빠르게 움직이는 팔이 너무 많아져서 소행성 청크를 잡을 수 없게 되고 큰 UPS 소모를 발생시킬 수 있습니다.\n\n[color=green]기본값: 전설[/color]
upgrade-limit-radar=과도한 지도 탐색과 저장 파일 비대화를 방지하기 위해 레이더 품질 성장을 제한합니다.\n\n매우 높은 품질 레벨의 레이더는 과도한 지도 탐색으로 인해 대용량 저장 파일(1,200mb+)을 유발할 수 있습니다.\n\n[color=green]기본값: 전설[/color]
upgrade-limit-lightning-rods=성능 문제를 방지하기 위해 피뢰침 유인체 품질 성장을 제한합니다.\n\n매우 높은 품질 레벨의 피뢰침 유인체는 상당히 증가된 커버리지 영역을 가지며, 이는 풀고라에서 밤에 지연 급증을 유발할 수 있습니다.\n\n[color=green]기본값: 전설[/color]
upgrade-limit-thrusters=방어 문제를 방지하기 위해 우주 추진기 품질 성장을 바닐라 레벨로 제한합니다.\n\n모드된 품질 티어는 우주선을 상당히 빠르게 이동시킬 수 있으며, 이는 방어를 압도할 수 있습니다.\n\n[color=green]기본값: 전설[/color]

