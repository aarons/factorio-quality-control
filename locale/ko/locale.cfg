[mod-setting-description]
manufacturing-hours-for-change=품질 변경 시도에 필요한 제조 시간입니다.\n제조 시간은 기계가 실제로 작동 중일 때만 누적됩니다. 유휴 상태일 경우 진행되지 않습니다.\n최소값 0.001시간 (3.6초), 최대값 1000시간.
crafting-speed-affects-progression=[color=green]활성화:[/color] 제작 속도와 생산성에 따라 획득하는 제조 시간이 증가합니다. 속도 4, 생산성 50%인 기계는 속도 1에 생산성 보너스가 없는 기계보다 제조 시간을 6배 얻습니다.\n\n[color=red]비활성화:[/color] 제작 속도는 진행에 영향을 주지 않습니다.
percentage-chance-of-change=업그레이드 시도가 성공할 확률입니다.
quality-increase-cost=품질 레벨당 필요한 제조 시간의 증가율입니다. 증가율은 복리로 적용되며, 0%로 설정하면 모든 레벨의 요구 시간이 동일합니다.\n\n50%로 설정하면 3시간의 요구 시간이 고급에서는 4.5시간, 희귀에서는 6.75시간이 됩니다.
quality-chance-accumulation-rate=시도가 실패할 때마다 기본 확률의 일정 비율만큼 업그레이드 확률을 높입니다.\n\n[color=white]없음:[/color] 확률이 일정하게 유지됩니다.\n[color=white]낮음:[/color] 기본 확률의 20%를 더합니다.\n[color=white]중간:[/color] 기본 확률의 50%를 더합니다.\n[color=white]높음:[/color] 기본 확률의 100%를 더합니다.\n\n기본 확률이 1%일 때 낮음은 1% → 1.2% → 1.4%..., 높음은 1% → 2% → 3%...로 증가합니다.
secondary-progression-rate=인서터, 전봇대, 비컨처럼 스스로 작업량을 측정할 수 없는 개체의 진행 속도입니다.\n\n100%는 같은 표면의 주요 개체가 획득하는 평균 제조 시간과 같습니다. 값이 높을수록 진행이 빨라지며, 0%에서는 진행이 멈춥니다.
change-modules-with-entity=[color=white]비활성화됨:[/color] 모듈이 업그레이드되지 않습니다.\n\n[color=white]활성화됨:[/color] 기계가 업그레이드되면 모듈도 기계의 품질을 한도로 한 단계 업그레이드됩니다.\n\n[color=white]추가 활성화됨:[/color] 모듈이 기계의 새 품질과 일치하도록 업그레이드됩니다.\n\n[color=white]독립적:[/color] 모듈이 보조 진행을 통해 자체 업그레이드 시도를 얻으며, 기계의 품질 한도를 초과할 수 있습니다. 기계 한도를 일반으로 설정하면 모듈 업그레이드도 비활성화됩니다.
batch-entities-per-tick=배치당 처리할 개체 수입니다. 배치가 클수록 업그레이드를 더 빠르게 처리하지만 지연이 발생할 수 있습니다. 독립적 모드에서는 모듈 슬롯도 포함됩니다.
batch-ticks-between-processing=배치 처리 간 대기할 틱 수입니다. 간격이 짧을수록 업그레이드를 더 자주 처리하지만 성능이 저하될 수 있습니다.
quality-change-aggregate-alerts-enabled=5분마다 업그레이드 요약을 출력합니다.
quality-change-entity-alerts-enabled=업그레이드 위치에 지도 알림 아이콘을 표시합니다.
quality-change-chat-enabled=개체 또는 모듈 아이콘, 품질 아이콘, 무작위 무지개색 글자로 업그레이드 메시지를 출력합니다.
quality-change-gps-enabled=업그레이드마다 클릭 가능한 위치 링크를 출력하고 Factorio의 GPS 지도 핑을 표시합니다. 링크를 클릭하면 해당 위치를 다시 볼 수 있습니다. 다채로운 업그레이드 채팅이 활성화되어 있으면 메시지에 링크를 추가하고, 그렇지 않으면 링크만 출력합니다. 게임의 GPS 핑에는 채팅 링크가 필요합니다.
quality-change-floating-text-enabled=새 품질의 색상으로 위로 떠오르는 업그레이드 텍스트를 표시합니다.
quality-change-halo-enabled=업그레이드 위치에 새 품질의 색상으로 확장되는 후광을 표시합니다.
quality-change-rainbow-enabled=업그레이드 위치에 확장되는 무지개 고리를 표시합니다.
quality-change-badge-enabled=새 품질의 아이콘이 4.5초 동안 커지며 떠오르고, 사라질 때까지 계속 회전합니다.
quality-change-bubbles-enabled=업그레이드 위치에서 새 품질의 작은 아이콘이 거품처럼 연이어 떠오릅니다.
quality-change-sound-enabled=원격 보기를 포함하여 현재 보고 있는 표면에서 업그레이드가 발생하면 선택한 소리를 재생합니다.
quality-change-sound=알림 효과음, 스피커 경보, 드럼 소리 또는 악기를 선택합니다. 악기는 업그레이드 악기 음 / 으뜸음과 업그레이드 음 재생 방식 설정을 사용합니다. 업그레이드 소리가 활성화되어 있을 때 현재 보고 있는 표면의 업그레이드에 대해서만 재생됩니다.
quality-change-sound-note=고정 음 또는 음악 패턴의 으뜸음(조성과 시작 음역)입니다. 경보, 드럼, 효과음 및 완전 무작위 모드에서는 무시됩니다.\n음은 F부터 반음씩 올라갑니다: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E. 다음 옥타브는 12를 더합니다. 기본값: 20 (C).\n피아노는 48개, 다른 악기는 36개의 음을 가집니다. 고정 모드에서는 사용 가능한 최고음으로 제한됩니다. 음악 패턴은 조성을 유지하면서 필요한 경우 옥타브 단위로 내려가 음역에 맞춰집니다. 같은 설정은 각 악기의 음역에서 동일한 패턴을 만듭니다.
quality-change-sound-mode=소리가 들리는 업그레이드마다 음 하나를 재생하며, 플레이어마다 별도의 패턴을 사용합니다. 고정 음은 선택한 음을 유지하고, 음악적 방랑은 음계에서 한두 음씩 이동합니다. 풍경은 장조 5음계에서 무작위로 음을 고르고, 계단은 음을 반복해서 올렸다 내립니다. 음계 내 무작위는 선택한 음계와 음역에서 음을 고르고, 완전 무작위는 악기의 전체 음역을 사용합니다.\n음악적 방랑과 계단은 으뜸음에서 시작하며, 조용한 기간이 지나거나 저장 및 불러오기 후에도 이어집니다. 지연된 음은 대기열에 쌓이지 않습니다. 악기에만 영향을 줍니다.
quality-change-sound-scale=업그레이드 악기 음 / 으뜸음을 기준으로 하는 음계입니다. 음악적 방랑, 계단, 음계 내 무작위에 사용됩니다. 반음계는 모든 반음을 허용합니다. 풍경은 항상 장조 5음계를 사용하며, 고정 음과 완전 무작위는 이 설정을 무시합니다.
quality-change-sound-range=으뜸음부터 시작하는 한 옥타브 또는 두 옥타브를 사용하며, 필요한 경우 악기 음역에 맞게 옥타브 단위로 내려갑니다. 악기의 전체 음역을 사용할 수도 있습니다. 음악적 방랑, 풍경, 계단, 음계 내 무작위에 적용됩니다. 고정 음과 완전 무작위는 이 설정을 무시합니다.
quality_control_skip_hidden_qualities=업그레이드 시 숨겨진 품질(예: 반짝이는 변형)을 건너뜁니다. 이 설정은 Shiny Mechanics와 같은 모드가 설치된 경우에만 적용됩니다.
quality_control_hidden_qualities_sticky==숨겨진 품질(예: 반짝이는)을 가진 개체는 더 이상 업그레이드되지 않아 고유한 이점을 유지합니다. 이 설정은 Shiny Mechanics와 같은 모드가 설치된 경우에만 적용됩니다.
enable-accumulators=축전지의 업그레이드를 활성화합니다.
enable-agricultural-towers=농업 타워의 업그레이드를 활성화합니다.
enable-assembly-machines=조립 기계의 업그레이드를 활성화합니다.
enable-asteroid-collectors=소행성 수집기의 업그레이드를 활성화합니다.
asteroid-collector-growth-level-limit=게임을 망가뜨리는 문제를 방지하기 위해 소행성 수집기 품질 성장을 바닐라 값으로 제한합니다.\n\n모드된 품질 티어를 가진 소행성 수집기는 너무 빠르게 움직이는 팔이 너무 많아져서 소행성 청크를 잡을 수 없게 되고 큰 UPS 소모를 발생시킬 수 있습니다.\n\n[color=green]기본값: 전설[/color]
enable-beacons=비컨의 업그레이드를 활성화합니다.
enable-boilers=보일러의 업그레이드를 활성화합니다.
enable-combinators-and-speakers=조합기와 프로그래밍 가능 스피커의 업그레이드를 활성화합니다.
enable-pumps=해안 펌프와 유체 펌프의 업그레이드를 활성화합니다.
enable-furnaces=용광로의 업그레이드를 활성화합니다.
enable-generators=증기 기관, 증기 터빈, 핵융합 발전기의 업그레이드를 활성화합니다.
enable-heat-pipes=열 파이프의 업그레이드를 활성화합니다.
enable-inserters=인서터의 업그레이드를 활성화합니다.
enable-labs=연구 실험실의 업그레이드를 활성화합니다.
enable-lamps=램프의 업그레이드를 활성화합니다.
enable-lightning-rods=피뢰침의 업그레이드를 활성화합니다.
enable-mining-drills=채굴 드릴의 업그레이드를 활성화합니다.
enable-poles=전봇대와 변전소의 업그레이드를 활성화합니다.
enable-power-switches=전력 스위치의 업그레이드를 활성화합니다.
enable-radar=레이더 스테이션의 업그레이드를 활성화합니다.
radar-growth-level-limit=과도한 지도 탐색과 저장 파일 비대화를 방지하기 위해 레이더 품질 성장을 제한합니다.\n\n매우 높은 품질 레벨의 레이더는 과도한 지도 탐색으로 인해 대용량 저장 파일(1,200mb+)을 유발할 수 있습니다.\n\n[color=green]기본값: 전설[/color]
lightning-attractor-growth-level-limit=성능 문제를 방지하기 위해 피뢰침 유인체 품질 성장을 제한합니다.\n\n매우 높은 품질 레벨의 피뢰침 유인체는 상당히 증가된 커버리지 영역을 가지며, 이는 풀고라에서 밤에 지연 급증을 유발할 수 있습니다.\n\n[color=green]기본값: 전설[/color]
enable-reactors=원자로와 핵융합로의 업그레이드를 활성화합니다.
enable-rocket-silos=로켓 사일로의 업그레이드를 활성화합니다.
enable-roboports=로봇 포트의 업그레이드를 활성화합니다.
enable-solar-panels=태양 전지판의 업그레이드를 활성화합니다.
enable-thrusters=우주 추진기의 업그레이드를 활성화합니다. 우주선이 빨라지면 방어가 압도될 수 있습니다.
thruster-growth-level-limit=우주 추진기를 바닐라 레벨로 제한할 수 있습니다. 모드 품질 단계로 인해 우주선이 상당히 빨라져 방어가 압도될 수 있습니다.
enable-turrets=탄약 포탑, 레이저 포탑, 화염방사 포탑, 포병 포탑의 업그레이드를 활성화합니다. 포탑은 피해를 입혀 '제조 시간'을 얻습니다.
turret-damage-per-manufacturing-hour=포탑이 제조 시간 1시간을 얻기 위해 가해야 하는 피해량입니다.\n\n기본값: 36,000 피해 (기본 레벨 포탑이 철갑탄을 한 시간 동안 계속 발사한 양을 기준으로 계산).
turrets-contribute-credits=포탑이 같은 표면의 인서터와 전봇대 같은 보조 개체의 업그레이드에 기여하도록 합니다. 게임 후반에 레일건과 번개 포탑을 사용하면 업그레이드가 크게 빨라질 수 있습니다.
enable-defense-walls-and-gates=벽과 문의 업그레이드를 활성화합니다.
custom-upgrade-limit-a=아래 한도 설정에서 '사용자 지정 A'가 사용하는 최대 품질 레벨입니다. 전설을 넘어서는 품질 레벨을 추가하는 모드가 있고 개체가 업그레이드될 수 있는 레벨을 제한하려는 경우에만 필요합니다. 예를 들어 소행성 수집기를 레벨 10까지 허용할 수 있습니다. 여기에 최대 레벨을 설정한 다음, 제한하려는 개체의 드롭다운에서 '사용자 지정 A'를 선택하세요. 참고로 전설은 레벨 5입니다.
custom-upgrade-limit-b=업그레이드 한도 설정에서 사용자 지정 B가 사용하는 최대 품질 레벨입니다.
custom-upgrade-limit-c=업그레이드 한도 설정에서 사용자 지정 C가 사용하는 최대 품질 레벨입니다.
upgrade-limit-accumulators=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-agricultural-towers=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-assembly-machines=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-beacons=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-boilers=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.
upgrade-limit-combinators-and-speakers=이 개체들의 최대 업그레이드 품질입니다. 일반은 업그레이드를 비활성화하며, 사용자 지정 A/B/C는 위에서 지정한 레벨을 사용합니다.\n\n포함: 산술 조합기, 판단 조합기, 상수 조합기, 프로그래밍 가능 스피커.
