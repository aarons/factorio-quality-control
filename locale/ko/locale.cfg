[mod-setting-description]
manufacturing-hours-for-change=품질 변경 시도에 필요한 제조 시간입니다.\n제조 시간은 기계가 실제로 작동 중일 때만 누적됩니다. 유휴 상태일 경우 진행되지 않습니다.\n최소값 0.001시간 (3.6초), 최대값 1000시간.
crafting-speed-affects-progression=기계의 제작 속도가 제조 시간을 얻는 속도에 영향을 주는지 여부를 설정합니다.\n\n[color=green]활성화(기본값):[/color] 제작 속도가 높은 기계일수록 더 빠르게 진행됩니다. 제조 시간은 기계의 제작 속도와 생산성을 기준으로 누적됩니다. 속도 4, 생산성 50%인 주조소는 제작 속도 1인 조립 기계 2보다 6배 빠르게 진행됩니다.\n\n[color=red]비활성화:[/color] 제작 속도는 진행에 영향을 주지 않습니다. 제작 속도와 관계없이 실제로 제작한 1시간은 제조 시간 1시간으로 계산됩니다. 이는 품질 업그레이드마다 다음 업그레이드가 더 빨라지는 복리 효과를 제거합니다.
percentage-chance-of-change=품질 변경이 성공할 확률입니다.\n최소값 0.0001%, 최대값 100% (시간이 지나면 항상 변경)
quality-increase-cost=품질 레벨당 시도 간 시간을 증가시킵니다. 이는 복합 공식입니다. 0%로 설정하면 품질 레벨에 관계없이 시도 간 시간이 동일하게 유지됩니다\n\n[color=green]레벨당 50% 비용으로 3 제조 시간 필요 예시[/color]\n\n보통: 3시간\n언커먼: 4.5시간\n레어: 6.8시간\n에픽: 10.1시간\n레전더리: 15.2시간\n모드 품질 레벨 10: 173시간
quality-chance-accumulation-rate=실패한 시도 후 확률이 얼마나 증가하는지 제어합니다.\n\n[color=white]없음 (기본값):[/color] 누적 없음 - 확률이 일정하게 유지됩니다.\n\n[color=white]낮음 (20%):[/color] 실패할 때마다 기본 확률의 20%씩 증가합니다.\n\n[color=white]중간 (50%):[/color] 실패할 때마다 기본 확률의 50%씩 증가합니다.\n\n[color=white]높음 (100%):[/color] 실패할 때마다 기본 확률의 100%씩 증가합니다.\n\n[color=yellow]기본 확률 1% 예시:[/color]\n\n[color=white]낮음:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]높음:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\n모든 누적 설정은 결국 품질 변경을 보장합니다 - 높은 설정은 단지 100% 확률에 더 빨리 도달합니다
secondary-progression-rate=보조 개체(인서터, 전봇대, 비콘 등 스스로 작업량을 측정할 수 없는 모든 개체)가 같은 표면에 있는 평균적인 주요 개체가 얻는 양의 몇 퍼센트만큼 빠르게 진행할지를 결정합니다.\n\n[color=green]100%(기본값):[/color] 보조 개체는 주변의 평균적인 조립 기계, 용광로, 사일로, 터렛과 같은 속도로 진행됩니다.\n\n0%로 설정하면 보조 진행이 완전히 멈추며, 100%를 초과하는 값은 생산 기계의 속도보다 더 빠르게 기반 시설 업그레이드를 가속합니다.\n\n게임 중 재시작 없이 변경할 수 있습니다.
change-modules-with-entity=기계의 모듈이 품질 변경에 영향을 받는지 제어합니다.\n\n[color=white]비활성화됨 (기본값):[/color] 호스트 기계의 품질이 변경되어도 모듈은 영향을 받지 않습니다.\n\n[color=white]활성화됨:[/color] 호스트가 변경되면 모듈이 한 단계 품질 변경됩니다. 호스트의 품질 레벨을 초과하지 않습니다.\n\n[color=white]추가 활성화됨:[/color] 활성화됨과 같지만, 품질 변경이 발생할 때마다 모듈이 호스트 기계의 품질과 일치하도록 업데이트됩니다.
batch-entities-per-tick=성능 급증을 방지하기 위해 각 틱마다 처리할 개체 수입니다.\n최소값 1, 최대값 1000.\n높은 값은 지연 급증을 일으킬 수 있지만 개체를 더 빠르게 처리합니다.
batch-ticks-between-processing=배치 처리 주기 간 대기할 틱 수입니다.\n최소값 1틱, 최대값 6000틱 (~2.5분).\n낮은 값은 더 자주 처리하지만 성능에 영향을 줄 수 있습니다.
quality-change-aggregate-alerts-enabled=모든 품질 변경을 요약한 콘솔 메시지를 표시합니다 (5분마다 한 번 표시). 예: "조립 기계 3개 업그레이드됨, 인서터 2개 업그레이드됨"
quality-change-entity-alerts-enabled=개별 개체의 품질이 변경될 때 지도 핑 알림을 표시합니다. 알림을 클릭하여 업그레이드된 개체를 확인하세요.
quality_control_skip_hidden_qualities=품질 제어는 업그레이드 시 숨겨진 품질(예: 반짝이는 변형)을 건너뜁니다. 개체는 품질 제어를 통해 반짝이는 품질로 되지 않습니다 - 플레이어는 일반적인 방법으로 얻어야 합니다. 이 설정은 Shiny Mechanics 품질 모드가 설치된 경우에만 적용됩니다.
quality_control_hidden_qualities_sticky=숨겨진 품질(예: 반짝이는)을 가진 개체는 더 이상 업그레이드되지 않아 고유한 이점을 유지합니다. 이 설정은 Shiny Mechanics 품질 모드가 설치된 경우에만 적용됩니다.
enable-accumulators=축전지의 품질 변경을 활성화합니다.
enable-agricultural-towers=농업 타워의 품질 변경을 활성화합니다.
enable-assembly-machines=조립 기계의 품질 변경을 활성화합니다.
enable-asteroid-collectors=소행성 수집기의 품질 변경을 활성화합니다.
asteroid-collector-growth-level-limit=게임을 망가뜨리는 문제를 방지하기 위해 소행성 수집기 품질 성장을 바닐라 값으로 제한합니다.\n\n모드된 품질 티어를 가진 소행성 수집기는 너무 빠르게 움직이는 팔이 너무 많아져서 소행성 청크를 잡을 수 없게 되고 큰 UPS 소모를 발생시킬 수 있습니다.\n\n[color=green]기본값: 전설[/color]
enable-beacons=비컨의 품질 변경을 활성화합니다.
enable-boilers=보일러의 품질 변경을 활성화합니다.
enable-combinators-and-speakers=조합기와 스피커의 품질 변경을 활성화합니다.\n\n포함: 산술 조합기, 결정 조합기, 상수 조합기, 프로그래밍 가능한 스피커.
enable-pumps=펌프의 품질 변경을 활성화합니다 (해상 펌프와 유체 펌프 포함).
enable-furnaces=용광로의 품질 변경을 활성화합니다.
enable-generators=발전기의 품질 변경을 활성화합니다 (증기 엔진, 증기 터빈, 핵융합 발전기).
enable-heat-pipes=열 파이프의 품질 변경을 활성화합니다.
enable-inserters=인서터의 품질 변경을 활성화합니다.
enable-labs=연구 실험실의 품질 변경을 활성화합니다.
enable-lamps=램프의 품질 변경을 활성화합니다.
enable-lightning-rods=피뢰침의 품질 변경을 활성화합니다.
enable-mining-drills=모든 채굴 드릴의 품질 변경을 활성화합니다.
enable-poles=모든 전봇대의 품질 변경을 활성화합니다 (대형 전봇대와 변전소 포함).
enable-power-switches=전력 스위치의 품질 변경을 활성화합니다.
enable-radar=레이더 스테이션의 품질 변경을 활성화합니다.
radar-growth-level-limit=과도한 지도 탐색과 저장 파일 비대화를 방지하기 위해 레이더 품질 성장을 제한합니다.\n\n매우 높은 품질 레벨의 레이더는 과도한 지도 탐색으로 인해 대용량 저장 파일(1,200mb+)을 유발할 수 있습니다.\n\n[color=green]기본값: 전설[/color]
lightning-attractor-growth-level-limit=성능 문제를 방지하기 위해 피뢰침 유인체 품질 성장을 제한합니다.\n\n매우 높은 품질 레벨의 피뢰침 유인체는 상당히 증가된 커버리지 영역을 가지며, 이는 풀고라에서 밤에 지연 급증을 유발할 수 있습니다.\n\n[color=green]기본값: 전설[/color]
enable-reactors=리액터의 품질 변경을 활성화합니다 (원자로, 핵융합로).
enable-rocket-silos=로켓 사일로의 품질 변경을 활성화합니다.
enable-roboports=로봇 포트의 품질 변경을 활성화합니다.
enable-solar-panels=태양 전지판의 품질 변경을 활성화합니다.
enable-thrusters=우주 추진기의 품질 변경을 활성화합니다. 우주선의 속도가 예기치 않게 변경되면 방어가 압도될 수 있기 때문에 기본적으로 비활성화되어 있습니다.
thruster-growth-level-limit=방어 문제를 방지하기 위해 우주 추진기 품질 성장을 바닐라 레벨로 제한합니다.\n\n모드된 품질 티어는 우주선을 상당히 빠르게 이동시킬 수 있으며, 이는 방어를 압도할 수 있습니다.\n\n[color=green]기본값: 전설[/color]
enable-turrets=포탑의 품질 변경을 활성화합니다.\n\n포탑은 누적 피해량을 기반으로 업그레이드 크레딧을 생성하는 주요 개체입니다.\n\n포함: 탄약 포탑, 레이저 포탑, 화염방사기, 포병 포탑.
turret-damage-per-manufacturing-hour=포탑이 1 제조 시간에 해당하기 위해 가해야 하는 피해량입니다.\n\n기본값: 36,000 피해 (철갑탄 기준: 시간당 450 탄창 × 탄창당 80 피해).\n\n낮은 값은 포탑이 크레딧을 더 빠르게 생성하게 합니다. 높은 값은 크레딧 생성을 늦춥니다.
enable-defense-walls-and-gates=벽과 문의 품질 변경을 활성화합니다.\n\n포함: 벽, 문.
custom-upgrade-limit-a=이 설정은 개체의 모드 품질에 사용자 지정 한도를 설정하는 데 사용합니다. 전설을 넘어서는 품질 레벨을 추가하는 모드가 있고 개체가 얼마나 업그레이드될지 제한하고 싶을 때만 필요합니다. 이 기능을 사용하려면 여기에 최대 레벨을 설정한 다음, 제한하려는 개체로 가서 드롭다운에서 '사용자 지정 A'를 선택하세요. 참고로 전설은 레벨 5입니다 (일반 = 1, 고급 = 2, 희귀 = 3, 영웅 = 4, 전설 = 5...).
custom-upgrade-limit-b=이 설정은 개체의 모드 품질에 사용자 지정 한도를 설정하는 데 사용합니다. 전설을 넘어서는 품질 레벨을 추가하는 모드가 있고 개체가 얼마나 업그레이드될지 제한하고 싶을 때만 필요합니다. 이 기능을 사용하려면 여기에 최대 레벨을 설정한 다음, 제한하려는 개체로 가서 드롭다운에서 '사용자 지정 B'를 선택하세요. 참고로 전설은 레벨 5입니다 (일반 = 1, 고급 = 2, 희귀 = 3, 영웅 = 4, 전설 = 5...).
custom-upgrade-limit-c=이 설정은 개체의 모드 품질에 사용자 지정 한도를 설정하는 데 사용합니다. 전설을 넘어서는 품질 레벨을 추가하는 모드가 있고 개체가 얼마나 업그레이드될지 제한하고 싶을 때만 필요합니다. 이 기능을 사용하려면 여기에 최대 레벨을 설정한 다음, 제한하려는 개체로 가서 드롭다운에서 '사용자 지정 C'를 선택하세요. 참고로 전설은 레벨 5입니다 (일반 = 1, 고급 = 2, 희귀 = 3, 영웅 = 4, 전설 = 5...).
upgrade-limit-accumulators=품질 제어는 이 개체들을 이 품질까지 업그레이드한 후 추가 업그레이드 시도를 중단합니다. 업그레이드 시도를 방지하려면 일반으로 설정하세요. 사용자 지정 값은 사용자 지정 업그레이드 한도 A/B/C 설정을 사용합니다.
upgrade-limit-agricultural-towers=품질 제어는 이 개체들을 이 품질까지 업그레이드한 후 추가 업그레이드 시도를 중단합니다. 업그레이드 시도를 방지하려면 일반으로 설정하세요. 사용자 지정 값은 사용자 지정 업그레이드 한도 A/B/C 설정을 사용합니다.
