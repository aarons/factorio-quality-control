[controls]
quality-control-inspect-entity=檢查實體品質指標

[quality-control]
no-entity-selected=未選擇實體。將滑鼠懸停在實體上然後按下快速鍵。
entity-not-tracked=__1__ 未被品質控制追蹤。
entity-not-supported=__1__ 不被品質控制支援
entity-info-header=__1__ - __2__ 品質
entity-type-disabled=此實體類型的升級上限設為「普通」，因此不會被升級。
entity-at-quality-limit=此實體已達最高品質。
credits-earned=為升級嘗試貢獻的點數：__1__
credits-available=可用升級嘗試點數：__1__
credits-used=用於升級嘗試的點數：__1__
chance-of-success=成功機率：__1__%
next-chance-to-change=下一個點數提供 __1__% 的升級機率
entity-not-tracked-reason=實體為 __1__ 且不再被追蹤。
aggregate-notification-header=品質控制升級：
