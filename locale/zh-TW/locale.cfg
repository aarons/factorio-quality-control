[mod-setting-description]
manufacturing-hours-for-change=嘗試品質變更所需的製造時數。\n製造時數僅在機器實際運作時累積。若機器閒置，則不會累積進度。\n最小值 0.001 小時（3.6 秒），最大值 1000 小時。
crafting-speed-affects-progression=[color=red]停用（預設）：[/color] 製作速度不會影響進度，有助於讓升級更平均地分布於較長的遊戲過程中。\n\n[color=green]啟用：[/color] 製作速度與產能會增加獲得的製造時數。速度為 4、產能加成 50% 所獲得的時數，是速度為 1 且沒有產能加成的六倍。品質升級帶來的速度提升可能產生複利效應，讓遊戲後期的升級變得非常快速。
percentage-chance-of-change=升級嘗試的成功機率。
quality-increase-cost=每個品質等級所需製造時數的增幅。增幅會複利計算；設為 0% 時，各等級的需求相同。\n\n設為 50% 時，原本需要 3 小時，到了非凡品質需 4.5 小時，稀有品質需 6.75 小時。
quality-chance-accumulation-rate=每次嘗試失敗後，依基礎機率的百分比增加升級機率。\n\n[color=white]無：[/color] 機率保持恆定。\n[color=white]低：[/color] 增加基礎機率的 20%。\n[color=white]中：[/color] 增加基礎機率的 50%。\n[color=white]高：[/color] 增加基礎機率的 100%。\n\n基礎機率為 1% 時，低為 1% → 1.2% → 1.4%...，高為 1% → 2% → 3%...
secondary-progression-rate=無法自行測量工作量的實體（如機械臂、電線桿和信標）的進度速度。\n\n100% 等同於同一表面上主要實體獲得的平均製造時數。較高數值會加快進度；0% 會暫停進度。
change-modules-with-entity=[color=white]停用：[/color] 模組不會升級。\n\n[color=white]啟用：[/color] 機器升級時，模組提升一級，最高不超過機器品質。\n\n[color=white]額外啟用：[/color] 模組升級至與機器的新品質相同。\n\n[color=white]獨立：[/color] 模組透過次要進度獨立獲得升級嘗試，且可超過機器的品質上限。將機器上限設為普通也會停用模組升級。
batch-entities-per-tick=每批處理的實體數量。較大的批次能更快處理升級，但可能造成延遲。獨立模式下模組插槽也會計入。
batch-ticks-between-processing=批次處理之間的遊戲刻數。較短的間隔會更頻繁地處理升級，但可能降低效能。
quality-change-aggregate-alerts-enabled=每五分鐘顯示一次升級摘要。
quality-change-entity-alerts-enabled=在升級位置顯示地圖警報圖示。
quality-change-chat-enabled=顯示包含實體或模組圖示、品質圖示及隨機彩虹色文字的升級訊息。
quality-change-gps-enabled=每次升級時顯示可點擊的位置連結，並觸發 Factorio 的 GPS 地圖標記。點擊連結可再次查看位置。啟用彩色升級聊天通知時會將連結加入訊息；否則僅顯示連結。遊戲原生 GPS 標記需要聊天連結。
quality-change-floating-text-enabled=以新品質的顏色顯示向上浮動的升級文字。
quality-change-halo-enabled=在升級位置顯示以新品質顏色擴散的光環。
quality-change-rainbow-enabled=在升級位置顯示擴散的彩虹光環。
quality-change-badge-enabled=顯示新品質的圖示，使其放大並上升 4.5 秒，在淡出期間持續旋轉。
quality-change-bubbles-enabled=在升級位置釋放一連串新品質的小圖示，像泡泡般向上漂浮。
quality-change-sound-enabled=目前檢視的表面發生升級時播放所選音效，包括遠端檢視。
quality-change-sound=選擇通知音效、揚聲器警報、鼓聲或樂器。樂器使用升級樂器音符／根音及升級音符行為設定。僅在啟用升級音效且目前檢視的表面發生升級時播放。
quality-change-sound-note=固定音符，或音樂模式的根音（調性與起始音區）。警報、鼓聲、音效及完全隨機模式會忽略此設定。\n音符從 F 開始按半音上升：1=F、3=G、5=A、7=B、8=C、10=D、12=E；加 12 可提高一個八度。預設：20（C）。\n鋼琴有 48 個音符，其他樂器有 36 個。固定模式會限制在可用的最高音。音樂模式會在必要時以完整八度向下移動以符合音域，同時保留調性。相同設定會在各樂器的音區產生相應的音型。
quality-change-sound-mode=每次可聽見的升級播放一個音符，每位玩家有獨立的音型。固定音符會維持所選音符；音樂漫遊會移動一或兩個音階級數；風鈴會隨機選擇大調五聲音階的音符；階梯會反覆上升再下降；音階內隨機會從所選音階和音域中選擇任意音符；完全隨機則使用樂器的完整音域。\n音樂漫遊和階梯從根音開始，並在靜默一段時間及儲存／載入後接續。延遲音符不會排入佇列。僅影響樂器。
quality-change-sound-scale=以升級樂器音符／根音為基準的音階，供音樂漫遊、階梯及音階內隨機使用。半音階允許所有半音。風鈴固定使用大調五聲音階；固定音符及完全隨機會忽略此設定。
quality-change-sound-range=從根音開始的一或兩個八度，必要時以完整八度向下移動以符合樂器音域；也可選擇樂器的完整音域。適用於音樂漫遊、風鈴、階梯及音階內隨機。固定音符及完全隨機會忽略此設定。
quality_control_skip_hidden_qualities=升級時跳過隱藏品質（例如閃亮變體）。此設定僅在安裝 Shiny Mechanics 等模組時適用。
quality_control_hidden_qualities_sticky==擁有隱藏品質（例如閃亮）的實體將不會進一步升級，保留其獨特優勢。此設定僅在安裝 Shiny Mechanics 等模組時適用。
enable-accumulators=啟用蓄電池升級。
enable-agricultural-towers=啟用農業塔升級。
enable-assembly-machines=啟用組裝機升級。
enable-asteroid-collectors=啟用小行星收集器升級。
asteroid-collector-growth-level-limit=限制小行星收集器品質成長至原版數值以防止遊戲破壞性問題。\n\n帶有模組品質等級的小行星收集器可能有太多移動過快的機械臂，導致無法抓取小行星塊並造成大量 UPS 消耗。\n\n[color=green]預設：傳奇[/color]
enable-beacons=啟用信標升級。
enable-boilers=啟用鍋爐升級。
enable-combinators-and-speakers=啟用組合器與可程式揚聲器升級。
enable-pumps=啟用抽水站與流體幫浦升級。
enable-furnaces=啟用熔爐升級。
enable-generators=啟用蒸汽機、蒸汽輪機與核融合發電機升級。
enable-heat-pipes=啟用熱傳導管升級。
enable-inserters=啟用機械臂升級。
enable-labs=啟用研究實驗室升級。
enable-lamps=啟用燈具升級。
enable-lightning-rods=啟用避雷針升級。
enable-mining-drills=啟用採礦機升級。
enable-poles=啟用電線桿與變電站升級。
enable-power-switches=啟用電力開關升級。
enable-radar=啟用雷達站升級。
radar-growth-level-limit=限制雷達品質成長以防止過度地圖探索與存檔膨脹。\n\n品質等級很高的雷達會因過度地圖探索而造成大型存檔（1,200mb+）。\n\n[color=green]預設：傳奇[/color]
lightning-attractor-growth-level-limit=限制引雷器品質成長以防止效能問題。\n\n品質等級很高的引雷器具有顯著增加的覆蓋範圍，會在 Fulgora 夜晚造成延遲峰值。\n\n[color=green]預設：傳奇[/color]
enable-reactors=啟用核反應爐與核融合反應爐升級。
enable-rocket-silos=啟用火箭發射井升級。
enable-roboports=啟用機器人指令網路升級。
enable-solar-panels=啟用太陽能板升級。
enable-thrusters=啟用太空推進器升級。太空船速度過快可能使防禦系統不堪負荷。
thruster-growth-level-limit=可選擇將太空推進器限制在原版等級。模組品質等級可使太空船移動速度顯著加快，可能使其防禦系統不堪負荷。
enable-turrets=啟用彈藥砲塔、雷射砲塔、火焰噴射砲塔與火砲砲塔升級。砲塔透過造成傷害獲得「製造時數」。
turret-damage-per-manufacturing-hour=砲塔必須造成的傷害量，才能獲得一製造時數。\n\n預設：36,000 傷害（以基礎組裝機一小時可生產的穿甲彈數量計算）。
turrets-contribute-credits=讓砲塔協助升級同一表面上的次要實體，例如機械臂與電線桿。在遊戲後期，磁軌砲與閃電砲塔可大幅加快升級速度。
enable-defense-walls-and-gates=啟用牆壁與閘門升級。
custom-upgrade-limit-a=下方限制設定中「自訂 A」使用的最高品質等級。僅在使用新增超過傳奇品質等級的模組，且想限制實體升級程度時才需要。例如，可以讓小行星收集器升至第 10 級。若要使用此功能，請在此設定最高等級，然後前往想限制的實體，在下拉選單中選擇「自訂 A」。供參考，傳奇為第 5 級。
custom-upgrade-limit-b=升級上限設定中「自訂 B」使用的最高品質等級。
custom-upgrade-limit-c=升級上限設定中「自訂 C」使用的最高品質等級。
upgrade-limit-accumulators=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-agricultural-towers=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-assembly-machines=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-beacons=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-boilers=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-combinators-and-speakers=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。\n\n包含：算術組合器、決策組合器、常數組合器、可程式揚聲器。
upgrade-limit-defense-walls-and-gates=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-furnaces=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-generators=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。\n\n包含：蒸汽機、蒸汽輪機、核融合發電機。
upgrade-limit-heat-pipes=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-inserters=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-labs=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-lamps=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-mining-drills=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-poles=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。\n\n包含電線桿與變電站。
upgrade-limit-power-switches=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-pumps=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。\n\n包含：抽水站與流體幫浦。
upgrade-limit-reactors=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。\n\n包含：核反應爐、核融合反應爐。
upgrade-limit-rocket-silos=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-roboports=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-solar-panels=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。
upgrade-limit-turrets=這些實體可升級至的最高品質。「普通」會停用升級；「自訂 A/B/C」使用上方指定的自訂等級。\n\n包含：彈藥砲塔、雷射砲塔、火焰噴射器、火砲砲塔。
upgrade-limit-asteroid-collectors=將小行星收集器限制在傳奇品質，以防止嚴重影響遊戲的問題。模組品質等級可能產生太多移動過快的機械臂，導致無法抓取小行星塊並大幅降低 UPS。
upgrade-limit-radar=將雷達限制在傳奇品質，以防止存檔膨脹。模組品質可能導致過度探索地圖，使存檔變得非常大（超過 1 GB）。
upgrade-limit-lightning-rods=將引雷器限制在傳奇品質，以防止 UPS 驟降。模組品質等級會大幅增加引雷器的覆蓋範圍，可能在 Fulgora 的夜晚造成延遲。
upgrade-limit-thrusters=將太空推進器限制在傳奇品質，以防止太空平台意外受損。模組品質等級可使太空船移動速度顯著加快，可能使其防禦系統不堪負荷。

