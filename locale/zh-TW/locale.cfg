[mod-setting-description]
manufacturing-hours-for-change=嘗試品質變更所需的製造時數。\n製造時數僅在機器實際運作時累積。若機器閒置，則不會累積進度。\n最小值 0.001 小時（3.6 秒），最大值 1000 小時。
crafting-speed-affects-progression=控制機器的製作速度是否影響其累積製造時數的速度。\n\n[color=green]啟用（預設）：[/color] 製作速度較高的機器進度會較快。製造時數依據機器的製作速度與產能計算。速度為 4、產能加成 50% 的鑄造廠，進度速度會是製作速度為 1 的組裝機-2 的六倍。\n\n[color=red]停用：[/color] 製作速度不會影響進度。無論製作速度為何，實際製作一小時即計為一個製造時數。此設定可消除每次品質升級都會加快下一次升級的複合效果。
percentage-chance-of-change=品質變更成功的百分比機率。\n最小值 0.0001%，最大值 100%（時間過後總是變更）
quality-increase-cost=每個品質等級增加嘗試變更間隔時間。這是複合公式。設為 0% 將使嘗試間隔時間無論品質等級如何都保持相同\n\n[color=green]範例：需要 3 製造時數，每級成本 50%[/color]\n\n普通：3 小時\n非普通：4.5 小時\n稀有：6.8 小時\n史詩：10.1 小時\n傳奇：15.2 小時\n模組品質 10 級：173 小時
quality-chance-accumulation-rate=控制每次失敗嘗試後機率增加多少。\n\n[color=white]無（預設）：[/color]無累積 - 機率保持恆定。\n\n[color=white]低（20%）：[/color]每次失敗機率增加基礎率的 20%。\n\n[color=white]中（50%）：[/color]每次失敗機率增加基礎率的 50%。\n\n[color=white]高（100%）：[/color]每次失敗機率增加基礎率的 100%。\n\n[color=yellow]範例：基礎機率 1%：[/color]\n\n[color=white]低：[/color]1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]高：[/color]1.0% → 2.0% → 3.0% → 4.0%...\n\n所有累積設定最終都保證品質變更 - 較高設定只是更快達到 100% 機率
secondary-progression-rate=次要實體（機械臂、電線桿、信標——任何無法自行測量工作量的實體）的進度速度，以同一表面上平均主要實體所賺取進度的百分比表示。\n\n[color=green]100%（預設）：[/color]次要實體以周圍平均組裝機、熔爐、發射井或砲塔相同的速度進展。\n\n設為 0% 可完全停止次要進度；高於 100% 的數值會使基礎設施升級速度超過生產機器的步調。\n\n遊戲進行中可隨時變更，無需重新啟動。
change-modules-with-entity=控制機器中的模組是否受品質變更影響。\n\n[color=white]停用（預設）：[/color]主機品質變更時模組不受影響。\n\n[color=white]啟用：[/color]主機變更時模組品質提升一級。不會超過主機品質等級。\n\n[color=white]額外啟用：[/color]類似啟用，但每當發生品質變更時，模組將更新為匹配主機品質等級。
batch-entities-per-tick=每遊戲刻處理的實體數量以避免效能峰值。\n最小值 1，最大值 1000。\n較高值可能造成延遲峰值但處理實體更快。
batch-ticks-between-processing=批次處理週期間等待的遊戲刻數。\n最小值 1 遊戲刻，最大值 6000 遊戲刻（約 2.5 分鐘）。\n較低值處理更頻繁但可能影響效能。
quality-change-aggregate-alerts-enabled=顯示匯總所有品質變更的控制台訊息（每 5 分鐘顯示一次）。範例：「3 台裝配機升級，2 個機械手臂升級」
quality-change-entity-alerts-enabled=個別實體品質變更時顯示地圖標記警報。點擊警報查看升級的實體。
quality_control_skip_hidden_qualities=品質控制將在升級時跳過隱藏品質（例如閃亮變體）。實體永遠不會透過品質控制變為閃亮 - 玩家必須以正常方式取得。此設定僅在您安裝了 Shiny Mechanics 品質模組時才適用。
quality_control_hidden_qualities_sticky=擁有隱藏品質（例如閃亮）的實體將不會進一步升級，保留其獨特優勢。此設定僅在您安裝了 Shiny Mechanics 品質模組時才適用。
enable-accumulators=啟用蓄電池品質變更。
enable-agricultural-towers=啟用農業塔品質變更。
enable-assembly-machines=啟用裝配機品質變更。
enable-asteroid-collectors=啟用小行星收集器品質變更。
asteroid-collector-growth-level-limit=限制小行星收集器品質成長至原版數值以防止遊戲破壞性問題。\n\n帶有模組品質等級的小行星收集器可能有太多移動過快的機械臂，導致無法抓取小行星塊並造成大量 UPS 消耗。\n\n[color=green]預設：傳奇[/color]
enable-beacons=啟用信標品質變更。
enable-boilers=啟用鍋爐品質變更。
enable-combinators-and-speakers=啟用組合器與揚聲器品質變更。\n\n包含：算術組合器、決策組合器、常數組合器、可程式揚聲器。
enable-pumps=啟用幫浦品質變更（包含海岸幫浦與流體幫浦）。
enable-furnaces=啟用熔爐品質變更。
enable-generators=啟用發電機品質變更（蒸汽機、蒸汽輪機、核融合發電機）。
enable-heat-pipes=啟用熱傳導管品質變更。
enable-inserters=啟用機械手臂品質變更。
enable-labs=啟用研究實驗室品質變更。
enable-lamps=啟用燈具品質變更。
enable-lightning-rods=啟用避雷針品質變更。
enable-mining-drills=啟用所有採礦機品質變更。
enable-poles=啟用所有電線桿品質變更（包含大型電線桿與變電站）。
enable-power-switches=啟用電力開關品質變更。
enable-radar=啟用雷達站品質變更。
radar-growth-level-limit=限制雷達品質成長以防止過度地圖探索與存檔膨脹。\n\n品質等級很高的雷達會因過度地圖探索而造成大型存檔（1,200mb+）。\n\n[color=green]預設：傳奇[/color]
lightning-attractor-growth-level-limit=限制引雷器品質成長以防止效能問題。\n\n品質等級很高的引雷器具有顯著增加的覆蓋範圍，會在 Fulgora 夜晚造成延遲峰值。\n\n[color=green]預設：傳奇[/color]
enable-reactors=啟用反應爐品質變更（核反應爐、核融合反應爐）。
enable-rocket-silos=啟用火箭發射井品質變更。
enable-roboports=啟用機器人指令網路品質變更。
enable-solar-panels=啟用太陽能板品質變更。
enable-thrusters=啟用太空推進器品質變更。預設停用，因為意外改變太空船速度可能導致防禦系統不堪負荷。
thruster-growth-level-limit=限制太空推進器品質成長至原版等級以防止防禦問題。\n\n模組品質等級可使太空船移動速度顯著加快，可能使其防禦系統不堪負荷。\n\n[color=green]預設：傳奇[/color]
enable-turrets=啟用砲塔品質變更。\n\n砲塔是主要實體，根據累積造成的傷害生成升級點數。\n\n包含：彈藥砲塔、雷射砲塔、火焰噴射器、火砲砲塔。
turret-damage-per-manufacturing-hour=砲塔必須造成多少傷害才等同於一製造時數。\n\n預設：36,000 傷害（來自穿甲彈：每小時 450 個彈匣 × 每彈匣 80 傷害）。\n\n較低的值使砲塔更快生成點數。較高的值減慢點數生成速度。
turrets-contribute-credits=控制砲塔獲得的升級點數是否也會匯入用於升級次要實體（如機械臂、電線桿等）的共享池。\n\n[color=red]停用（預設）：[/color]砲塔的點數只留在該砲塔本身。戰鬥傷害僅能幫助砲塔自我升級。\n\n[color=green]啟用：[/color]砲塔的點數也會流入共享池，讓戰鬥傷害能像製造一樣推進次要實體的升級進度。
enable-defense-walls-and-gates=啟用牆壁與閘門品質變更。\n\n包含：牆壁、閘門。
custom-upgrade-limit-a=用於為實體的模組品質設定自訂上限。僅在您使用了新增超過傳奇的品質等級的模組，且想限制實體升級程度時才需要。若要使用此功能，請在此設定最高等級，然後前往您想限制的實體並在下拉選單中選擇「自訂 A」。供參考，傳奇為第 5 級（普通 = 1，非凡 = 2，稀有 = 3，史詩 = 4，傳奇 = 5……）。
custom-upgrade-limit-b=用於為實體的模組品質設定自訂上限。僅在您使用了新增超過傳奇的品質等級的模組，且想限制實體升級程度時才需要。若要使用此功能，請在此設定最高等級，然後前往您想限制的實體並在下拉選單中選擇「自訂 B」。供參考，傳奇為第 5 級（普通 = 1，非凡 = 2，稀有 = 3，史詩 = 4，傳奇 = 5……）。
custom-upgrade-limit-c=用於為實體的模組品質設定自訂上限。僅在您使用了新增超過傳奇的品質等級的模組，且想限制實體升級程度時才需要。若要使用此功能，請在此設定最高等級，然後前往您想限制的實體並在下拉選單中選擇「自訂 C」。供參考，傳奇為第 5 級（普通 = 1，非凡 = 2，稀有 = 3，史詩 = 4，傳奇 = 5……）。
upgrade-limit-accumulators=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-agricultural-towers=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-assembly-machines=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-beacons=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-boilers=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-combinators-and-speakers=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。\n\n包含：算術組合器、判定器組合器、常數組合器、可編程揚聲器。
upgrade-limit-defense-walls-and-gates=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。\n\n包含：牆壁、閘門。
upgrade-limit-furnaces=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-generators=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。\n\n包含：蒸汽機、蒸汽渦輪機、核融合發電機。
upgrade-limit-heat-pipes=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-inserters=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-labs=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-lamps=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-mining-drills=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-poles=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。\n\n包含：所有電線桿、大型電線桿與變電站。
upgrade-limit-power-switches=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-pumps=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。\n\n包含：抽水站與流體幫浦。
upgrade-limit-reactors=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。\n\n包含：核反應爐、核融合反應爐。
upgrade-limit-rocket-silos=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-roboports=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-solar-panels=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。
upgrade-limit-turrets=品質控制將把這些實體升級至此品質，之後停止嘗試進一步升級。設為「普通」可防止任何升級嘗試。自訂數值使用自訂升級上限 A/B/C 設定。\n\n包含：彈藥砲塔、雷射砲塔、火焰噴射器、火砲砲塔。
upgrade-limit-asteroid-collectors=限制小行星收集器品質成長至原版數值以防止遊戲破壞性問題。\n\n帶有模組品質等級的小行星收集器可能有太多移動過快的機械臂，導致無法抓取小行星塊並造成大量 UPS 消耗。\n\n[color=green]預設：傳奇[/color]
upgrade-limit-radar=限制雷達品質成長以防止過度地圖探索與存檔膨脹。\n\n品質等級很高的雷達會因過度地圖探索而造成大型存檔（1,200mb+）。\n\n[color=green]預設：傳奇[/color]
upgrade-limit-lightning-rods=限制引雷器品質成長以防止效能問題。\n\n品質等級很高的引雷器具有顯著增加的覆蓋範圍，會在 Fulgora 夜晚造成延遲峰值。\n\n[color=green]預設：傳奇[/color]
upgrade-limit-thrusters=限制太空推進器品質成長至原版等級以防止防禦問題。\n\n模組品質等級可使太空船移動速度顯著加快，可能使其防禦系統不堪負荷。\n\n[color=green]預設：傳奇[/color]

