[mod-setting-description]
manufacturing-hours-for-change=A minőségváltozás megkísérléséhez szükséges gyártási órák száma.\nA gyártási órák csak akkor halmozódnak, amikor a gép aktívan dolgozik. Ha tétlenül áll, nem halad előre.\nMin érték 0,001 óra (3,6 másodperc), Max érték 1000 óra.
crafting-speed-affects-progression=[color=green]Engedélyezve:[/color] A gyártási sebesség és a termelékenység növeli a szerzett gyártási órák számát. A 4-es sebesség 50%-os termelékenységgel hatszor annyi gyártási órát ad, mint az 1-es sebesség termelékenységi bónusz nélkül.\n\n[color=red]Letiltva:[/color] A gyártási sebesség nincs hatással az előrehaladásra.
percentage-chance-of-change=A fejlesztési kísérlet sikerének esélye.
quality-increase-cost=A szükséges gyártási órák növekedése minőségi szintenként. A növekedés halmozódik; 0% esetén minden szinten azonos marad a követelmény.\n\n50% esetén a 3 órás követelmény szokatlan minőségnél 4,5 órára, ritkánál 6,75 órára nő.
quality-chance-accumulation-rate=Sikertelen kísérlet után növeli a fejlesztés esélyét az alapesély meghatározott százalékával.\n\n[color=white]Nincs:[/color] Az esély állandó marad.\n[color=white]Alacsony:[/color] Az alapesély 20%-át adja hozzá.\n[color=white]Közepes:[/color] Az alapesély 50%-át adja hozzá.\n[color=white]Magas:[/color] Az alapesély 100%-át adja hozzá.\n\n1%-os alapesélynél az Alacsony érték 1% → 1,2% → 1,4%..., a Magas érték 1% → 2% → 3%... esélyt ad.
secondary-progression-rate=Azoknak az entitásoknak az előrehaladási sebessége, amelyek nem tudják mérni a saját munkájukat, például a berakóké, villanypóznáké és sugárzóké.\n\nA 100% az ugyanazon felszínen lévő elsődleges entitások által szerzett átlagos gyártási óráknak felel meg. A magasabb értékek gyorsítják az előrehaladást; a 0% szünetelteti.
change-modules-with-entity=[color=white]Letiltva:[/color] A modulok nem fejlődnek.\n\n[color=white]Engedélyezve:[/color] A modulok egy szinttel fejlődnek, amikor a gépük fejlődik, legfeljebb a gép minőségéig.\n\n[color=white]Extra engedélyezve:[/color] A modulok a gépük új minőségének megfelelő szintre fejlődnek.\n\n[color=white]Független:[/color] A modulok a másodlagos előrehaladásból saját fejlesztési kísérleteket szereznek, és meghaladhatják gépük minőségi korlátját. Ha a gép korlátja Közönséges, a modulok fejlesztése is letiltódik.
batch-entities-per-tick=Egy kötegben feldolgozott entitások száma. A nagyobb kötegek gyorsabban dolgozzák fel a fejlesztéseket, de akadozást okozhatnak. Független módban a modulhelyek is beleszámítanak.
batch-ticks-between-processing=A kötegek feldolgozása közötti tickek száma. A rövidebb időközök gyakoribb feldolgozást tesznek lehetővé, de csökkenthetik a teljesítményt.
quality-change-aggregate-alerts-enabled=Összefoglaló megjelenítése a fejlesztésekről ötpercenként.
quality-change-entity-alerts-enabled=Térképes riasztási ikonok megjelenítése a fejlesztések helyén.
quality-change-chat-enabled=Fejlesztési üzenetek megjelenítése entitás- vagy modulikonokkal, minőségi ikonokkal és véletlenszerű szivárványszínű betűkkel.
quality-change-gps-enabled=Kattintható helyhivatkozás megjelenítése és a Factorio GPS-térképjelzésének aktiválása minden fejlesztésnél. A hivatkozásra kattintva visszatérhetsz a helyszínre. Ha a színes fejlesztési csevegés engedélyezve van, ahhoz adja hozzá a hivatkozást; egyébként csak a hivatkozást jeleníti meg. A játék saját GPS-jelzéséhez csevegési hivatkozás szükséges.
quality-change-floating-text-enabled=Felfelé lebegő fejlesztési szöveg megjelenítése az új minőség színében.
quality-change-halo-enabled=Táguló fénygyűrű megjelenítése az új minőség színében a fejlesztések helyén.
quality-change-rainbow-enabled=Táguló szivárványgyűrűk megjelenítése a fejlesztések helyén.
quality-change-badge-enabled=Az új minőség ikonjának növekvő és felfelé emelkedő megjelenítése 4,5 másodpercig, folyamatos forgással az elhalványulás során.
quality-change-bubbles-enabled=Az új minőség kis ikonjainak kibocsátása a fejlesztések helyén, amelyek buborékokként lebegnek felfelé.
quality-change-sound-enabled=A kiválasztott hang lejátszása az éppen megtekintett felszínen történő fejlesztéseknél, távoli nézetben is.
quality-change-sound=Értesítési effekt, hangszóróriasztás, dobhang vagy hangszer kiválasztása. A hangszerek a Hangszer hangja / alaphang és a Hangok viselkedése beállítást használják. Csak akkor szólal meg, ha a fejlesztési hang engedélyezve van, az éppen megtekintett felszínen történő fejlesztéseknél.
quality-change-sound-note=Rögzített hang, vagy a zenei minták alaphangja (hangneme és kezdő regisztere). Riasztások, dobok, effektek és Teljesen véletlenszerű mód esetén nincs hatása.\nA hangok F-től félhangonként emelkednek: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; a következő oktávhoz adj hozzá 12-t. Alapértelmezett: 20 (C).\nA zongorának 48, a többi hangszernek 36 hangja van. Rögzített módban a hang legfeljebb a rendelkezésre álló legmagasabb hang lehet. A zenei minták szükség esetén egész oktávokkal lejjebb kerülnek, megőrizve a hangnemet. Azonos beállításokkal minden hangszer a saját regiszterében egyenértékű mintákat játszik.
quality-change-sound-mode=Hallható fejlesztésenként egy hang szólal meg, játékosonként külön mintával. A Rögzített hang megtartja a kiválasztott hangot; a Zenei vándorlás egy vagy két skálafokot lép; a Szélcsengő véletlenszerű dúr pentaton hangokat választ; a Lépcső ismétlődve emelkedik, majd ereszkedik; a Véletlen a skálán a kiválasztott skála és hangterjedelem bármely hangját választhatja; a Teljesen véletlenszerű a hangszer teljes hangterjedelmét használja.\nA Vándorlás és a Lépcső az alaphangon kezdődik, és csendes időszakok, valamint mentés és betöltés után folytatódik. Késleltetett hangok nem kerülnek sorba. Csak a hangszerekre hat.
quality-change-sound-scale=A Hangszer hangja / alaphang beállításhoz viszonyított skála, amelyet a Zenei vándorlás, a Lépcső és a Véletlen a skálán használ. A Kromatikus minden félhangot engedélyez. A Szélcsengő mindig dúr pentaton skálát használ; a Rögzített hang és a Teljesen véletlenszerű figyelmen kívül hagyja ezt a beállítást.
quality-change-sound-range=Az alaphangtól kezdődő egy vagy két oktáv, szükség esetén egész oktávokkal lejjebb tolva, hogy illeszkedjen a hangszerhez; vagy a hangszer teljes hangterjedelme. A Zenei vándorlás, Szélcsengő, Lépcső és Véletlen a skálán módokra vonatkozik. A Rögzített hang és a Teljesen véletlenszerű figyelmen kívül hagyja ezt a beállítást.
quality_control_skip_hidden_qualities=A rejtett minőségek (pl. fényes változatok) kihagyása a fejlesztés során. Ez a beállítás csak akkor érvényes, ha telepítve van egy, a Shiny Mechanics modhoz hasonló mod.
quality_control_hidden_qualities_sticky==A rejtett minőségű entitások (pl. fényes) nem fejlődnek tovább, megőrizve egyedi előnyeiket. Ez a beállítás csak akkor érvényes, ha telepítve van egy, a Shiny Mechanics modhoz hasonló mod.
enable-accumulators=Akkumulátorok fejlesztésének engedélyezése.
enable-agricultural-towers=Mezőgazdasági tornyok fejlesztésének engedélyezése.
enable-assembly-machines=Összeszerelőgépek fejlesztésének engedélyezése.
enable-asteroid-collectors=Aszteroidagyűjtők fejlesztésének engedélyezése.
asteroid-collector-growth-level-limit=Korlátozza az aszteroida gyűjtők minőség növekedését az alap értékekre a játékot megzavaró problémák megelőzése érdekében.\n\nA modolt minőségi szintű aszteroida gyűjtőknek túl sok karjuk lehet, amelyek túl gyorsan mozognak, így képtelenné válnak az aszteroida darabok fogására és nagy UPS fogyasztást okoznak.\n\n[color=green]Alapértelmezett: legendás[/color]
enable-beacons=Sugárzók fejlesztésének engedélyezése.
enable-boilers=Kazánok fejlesztésének engedélyezése.
enable-combinators-and-speakers=Kombinátorok és programozható hangszórók fejlesztésének engedélyezése.
enable-pumps=Parti szivattyúk és folyadékszivattyúk fejlesztésének engedélyezése.
enable-furnaces=Kemencék fejlesztésének engedélyezése.
enable-generators=Gőzgépek, gőzturbinák és fúziós generátorok fejlesztésének engedélyezése.
enable-heat-pipes=Hőcsövek fejlesztésének engedélyezése.
enable-inserters=Berakók fejlesztésének engedélyezése.
enable-labs=Kutatólaboratóriumok fejlesztésének engedélyezése.
enable-lamps=Lámpák fejlesztésének engedélyezése.
enable-lightning-rods=Villámhárítók fejlesztésének engedélyezése.
enable-mining-drills=Bányászfúrók fejlesztésének engedélyezése.
enable-poles=Villanyoszlopok és alállomások fejlesztésének engedélyezése.
enable-power-switches=Áramkapcsolók fejlesztésének engedélyezése.
enable-radar=Radarállomások fejlesztésének engedélyezése.
radar-growth-level-limit=Korlátozza a radar minőség növekedését a túlzott térkép felfedezés és a mentési fájl felduzzadás megelőzése érdekében.\n\nA nagyon magas minőségi szintű radarok nagy mentési fájlokat okozhatnak (1200mb+) a túlzott térkép felfedezés miatt.\n\n[color=green]Alapértelmezett: legendás[/color]
lightning-attractor-growth-level-limit=Korlátozza a villámvonzók minőség növekedését a teljesítményproblémák megelőzése érdekében.\n\nA nagyon magas minőségi szintű villámvonzók jelentősen megnövelt lefedettségi területekkel rendelkeznek, ami lag-et okozhat éjszaka Fulgorán.\n\n[color=green]Alapértelmezett: legendás[/color]
enable-reactors=Nukleáris és fúziós reaktorok fejlesztésének engedélyezése.
enable-rocket-silos=Rakétasilók fejlesztésének engedélyezése.
enable-roboports=Robotportok fejlesztésének engedélyezése.
enable-solar-panels=Napelemek fejlesztésének engedélyezése.
enable-thrusters=Űrhajtóművek fejlesztésének engedélyezése. A gyorsabb hajók védelmi rendszere túlterhelődhet.
thruster-growth-level-limit=Az űrhajtóművek minősége az alapjáték szintjeire korlátozható. A modolt minőségi szintek jelentősen gyorsabbá tehetik az űrhajókat, ami túlterhelheti a védelmi rendszerüket.
enable-turrets=Lőszeres tornyok, lézertornyok, lángszórótornyok és tüzérségi tornyok fejlesztésének engedélyezése. A tornyok sebzéssel szereznek „gyártási órákat”.
turret-damage-per-manufacturing-hour=Az a sebzésmennyiség, amelyet egy toronynak egy gyártási óra megszerzéséhez okoznia kell.\n\nAlapértelmezett: 36 000 sebzés (egy alapszintű torony egy órán át tartó folyamatos tüzelése páncéltörő lőszerrel).
turrets-contribute-credits=A tornyok hozzájárulhatnak az ugyanazon felszínen lévő másodlagos entitások, például berakók és villanyoszlopok fejlesztéséhez. Ez a játék késői szakaszában sínágyúkkal és villámtornyokkal jelentősen felgyorsíthatja a fejlesztéseket.
enable-defense-walls-and-gates=Falak és kapuk fejlesztésének engedélyezése.
custom-upgrade-limit-a=Az alábbi korlátozókban az „Egyéni A” beállításhoz használt maximális minőségi szint. Csak akkor szükséges, ha egy mod a legendásnál magasabb minőségi szinteket ad hozzá, és korlátozni szeretnéd, meddig fejlődhet egy entitás. Például beállíthatod, hogy az aszteroidagyűjtők elérhessék a 10. szintet. Állítsd be itt a maximális szintet, majd a korlátozni kívánt entitásnál válaszd az „Egyéni A” lehetőséget a legördülő listában. A legendás minőség az 5. szint.
custom-upgrade-limit-b=A fejlesztési korlátok között az Egyéni B beállításhoz használt maximális minőségi szint.
custom-upgrade-limit-c=A fejlesztési korlátok között az Egyéni C beállításhoz használt maximális minőségi szint.
upgrade-limit-accumulators=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-agricultural-towers=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-assembly-machines=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-beacons=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-boilers=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-combinators-and-speakers=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.\n\nTartalmazza: aritmetikai kombinátorok, döntő kombinátorok, konstans kombinátorok, programozható hangszórók.
upgrade-limit-defense-walls-and-gates=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-furnaces=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-generators=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.\n\nTartalmazza: gőzgépek, gőzturbinák, fúziós generátorok.
upgrade-limit-heat-pipes=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-inserters=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-labs=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-lamps=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-mining-drills=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-poles=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.\n\nTartalmazza a villanypóznákat és alállomásokat.
upgrade-limit-power-switches=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-pumps=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.\n\nTartalmazza: parti szivattyúk és folyadékszivattyúk.
upgrade-limit-reactors=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.\n\nTartalmazza: nukleáris reaktorok, fúziós reaktorok.
upgrade-limit-rocket-silos=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-roboports=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-solar-panels=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztést; az Egyéni A/B/C a fent megadott egyéni szintet használja.
upgrade-limit-turrets=Ezen entitások maximális fejlesztési minősége. A Közönséges letiltja a fejlesztéseket; az Egyéni A/B/C a fent megadott egyéni szintet használja.\n\nTartalmazza: lőszeres tornyok, lézertornyok, lángszórók, tüzérségi tornyok.
upgrade-limit-asteroid-collectors=Az aszteroidagyűjtők minőségének korlátozása legendásra a játékot megzavaró problémák megelőzéséhez. A modolt szinteken túl sok, túl gyorsan mozgó kar keletkezhet, amelyek nem tudják megragadni az aszteroidatöredékeket, és jelentősen csökkentik az UPS-t.
upgrade-limit-radar=A radarok minőségének korlátozása legendásra a mentési fájl felduzzadásának megelőzéséhez. A modolt minőségek túlzott térképfelfedezést okozhatnak, ami nagyon nagy, akár egy gigabájtot meghaladó fájlokat eredményezhet.
upgrade-limit-lightning-rods=A villámvonzók minőségének korlátozása legendásra az UPS-ingadozás megelőzéséhez. A modolt minőségi szintű villámvonzók lefedettségi területe jelentősen nagyobb, ami éjszaka akadozást okozhat a Fulgorán.
upgrade-limit-thrusters=Az űrhajtóművek minőségének korlátozása legendásra az űrplatform váratlan sérülésének megelőzéséhez. A modolt minőségi szintek jelentősen gyorsabbá tehetik az űrhajókat, ami túlterhelheti a védelmi rendszerüket.

