upgrade-limit-turrets=A Minőségszabályozás ezeket az entitásokat eddig a minőségig fejleszti, majd leáll a további fejlesztési kísérletekkel. Állítsa Közönséges értékre a fejlesztési kísérletek megakadályozásához. Az egyéni értékek az Egyéni fejlesztési korlát A/B/C beállításokat használják.\n\nTartalmazza: lőszeres tornyok, lézertornyok, lángszórók, tüzérségi tornyok.
upgrade-limit-asteroid-collectors=Korlátozza az aszteroida gyűjtők minőség növekedését az alap értékekre a játékot megzavaró problémák megelőzése érdekében.\n\nA modolt minőségi szintű aszteroida gyűjtőknek túl sok karjuk lehet, amelyek túl gyorsan mozognak, így képtelenné válnak az aszteroida darabok fogására és nagy UPS fogyasztást okoznak.\n\n[color=green]Alapértelmezett: legendás[/color]
upgrade-limit-radar=Korlátozza a radar minőség növekedését a túlzott térkép felfedezés és a mentési fájl felduzzadás megelőzése érdekében.\n\nA nagyon magas minőségi szintű radarok nagy mentési fájlokat okozhatnak (1200mb+) a túlzott térkép felfedezés miatt.\n\n[color=green]Alapértelmezett: legendás[/color]
upgrade-limit-lightning-rods=Korlátozza a villámvonzók minőség növekedését a teljesítményproblémák megelőzése érdekében.\n\nA nagyon magas minőségi szintű villámvonzók jelentősen megnövelt lefedettségi területekkel rendelkeznek, ami lag-et okozhat éjszaka Fulgorán.\n\n[color=green]Alapértelmezett: legendás[/color]
upgrade-limit-thrusters=Korlátozza az űr tolóhajtóművek minőség növekedését az alap szintekre a védelmi problémák megelőzése érdekében.\n\nA modolt minőségi szintek az űrhajókat jelentősen gyorsabbá tehetik, ami túlterhelheti a védelmi rendszerüket.\n\n[color=green]Alapértelmezett: legendás[/color]

