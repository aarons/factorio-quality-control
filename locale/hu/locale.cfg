quality-level-cap-mining-drills=A maximális szint, amelyre a Minőségszabályozás fejleszti ezt az entitást. Az 5. szinten (legendás) megáll, ha nincsenek modolt szintek.
quality-level-cap-poles=A maximális szint, amelyre a Minőségszabályozás fejleszti ezt az entitást. Az 5. szinten (legendás) megáll, ha nincsenek modolt szintek.\n\nTartalmazza: minden elektromos oszlop, nagy elektromos oszlopok és alállomások.
quality-level-cap-power-switches=A maximális szint, amelyre a Minőségszabályozás fejleszti ezt az entitást. Az 5. szinten (legendás) megáll, ha nincsenek modolt szintek.
