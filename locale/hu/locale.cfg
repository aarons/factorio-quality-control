[mod-setting-description]
manufacturing-hours-for-change=A minőségváltozás megkísérléséhez szükséges gyártási órák száma.\nA gyártási órák csak akkor halmozódnak, amikor a gép aktívan dolgozik. Ha tétlenül áll, nem halad előre.\nMin érték 0,001 óra (3,6 másodperc), Max érték 1000 óra.
crafting-speed-affects-progression=Szabályozza, hogy a gép gyártási sebessége befolyásolja-e, milyen gyorsan szerez gyártási órákat.\n\n[color=green]Engedélyezve (alapértelmezett):[/color] A nagyobb gyártási sebességű gépek gyorsabban haladnak előre. A gyártási órákat a gép gyártási sebessége és termelékenysége alapján szerzi. Egy 4-es sebességű és 50%-os termelékenységű öntöde hatszor gyorsabban halad, mint egy 1-es gyártási sebességű 2-es összeszerelőgép.\n\n[color=red]Letiltva:[/color] A gyártási sebesség nincs hatással az előrehaladásra. Egy aktív gyártással töltött óra egy gyártási órának számít, függetlenül a gyártási sebességtől. Ez megszünteti azt a halmozódó hatást, amikor minden minőségi fejlesztés felgyorsítja a következőt.
percentage-chance-of-change=A minőségváltozás sikeres voltának százalékos esélye.\nMin érték 0,0001%, Max érték 100% (mindig változik az idő letelte után)
quality-increase-cost=Ez növeli a változási kísérletek közötti időt a minőség szintjénként. Ez egy összetett formula. 0%-ra állítva az idő a kísérletek között ugyanaz marad, függetlenül a minőségi szinttől\n\n[color=green]Példa 3 gyártási órával, szintenként 50% költséggel[/color]\n\nNormál: 3 óra\nSzokatlan: 4,5 óra\nRitka: 6,8 óra\nEpikus: 10,1 óra\nLegendás: 15,2 óra\nModolt minőségi szint 10: 173 óra
quality-chance-accumulation-rate=Szabályozza, mennyivel növekszik az esély minden sikertelen kísérlet után.\n\n[color=white]Nincs (Alapértelmezett):[/color] Nincs felhalmozódás - az esély állandó marad.\n\n[color=white]Alacsony (20%):[/color] Az esély 20%-kal növekszik az alapráta szerint minden sikertelenség után.\n\n[color=white]Közepes (50%):[/color] Az esély 50%-kal növekszik az alapráta szerint minden sikertelenség után.\n\n[color=white]Magas (100%):[/color] Az esély 100%-kal növekszik az alapráta szerint minden sikertelenség után.\n\n[color=yellow]Példa 1% alapeséllyel:[/color]\n\n[color=white]Alacsony:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Magas:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nMinden felhalmozódási beállítás végül garantálja a minőségváltozásokat - a magasabb beállítások csak gyorsabban érik el a 100% esélyt
secondary-progression-rate=Milyen gyorsan haladnak előre a másodlagos entitások (berakók, villanypóznák, jeladók - bármi, ami nem tudja mérni a saját munkáját) az azonos felszínen lévő átlagos elsődleges entitás teljesítményének százalékában.\n\n[color=green]100% (alapértelmezett):[/color] A másodlagos entitások ugyanolyan ütemben haladnak előre, mint a körülöttük lévő átlagos szerelőgép, kohó, siló vagy torony.\n\n0%-ra állítva a másodlagos előrehaladás teljesen leáll; a 100% feletti értékek a termelő gépek ütemén túl gyorsítják az infrastruktúra fejlesztését.\n\nJátékon belül is módosítható, újraindítás nélkül.
change-modules-with-entity=Ez szabályozza, hogy a gépekben lévő modulokat érinti-e a minőségváltozás.\n\n[color=white]Letiltva (Alapértelmezett):[/color] A modulokat nem érinti, amikor a gazda gép minősége megváltozik.\n\n[color=white]Engedélyezve:[/color] A modulok egy szinttel változtatják minőségüket, amikor a gazdájuk megváltozik. Nem haladják meg a gazda minőségi szintjét.\n\n[color=white]Extra engedélyezve:[/color] Mint az Engedélyezve, de a modulok a gazda gép minőségéhez lesznek igazítva bármikor, amikor minőségváltozás történik.
batch-entities-per-tick=Az egyes tickekben feldolgozandó entitások száma a teljesítménycsúcsok elkerülése érdekében.\nMin érték 1, Max érték 1000.\nA magasabb értékek lag-et okozhatnak, de gyorsabban dolgozzák fel az entitásokat.
batch-ticks-between-processing=A kötegelt feldolgozási ciklusok közötti várakozási tickek száma.\nMin érték 1 tick, Max érték 6000 tick (~2,5 perc).\nAz alacsonyabb értékek gyakrabban dolgoznak fel, de hatással lehetnek a teljesítményre.
quality-change-aggregate-alerts-enabled=Konzol üzenetek megjelenítése, amelyek összefoglalják az összes minőségváltozást (5 percenként egyszer jelennek meg). Példa: "3 összeszerelő gép fejlesztve, 2 beillesztő fejlesztve"
quality-change-entity-alerts-enabled=Térkép ping riasztások megjelenítése az egyes entitásokon, amikor minőségük megváltozik. Kattints a riasztásra a fejlesztett entitás megtekintéséhez.
quality_control_skip_hidden_qualities=A Minőségszabályozás kihagyja a rejtett minőségeket (pl. fényes változatok) a fejlesztés során. Az entitások soha nem válnak fényessé a Minőségszabályozás révén - a játékosoknak a normál módon kell megszerezniük őket. Ez a beállítás csak akkor érvényes, ha telepítve van a Shiny Mechanics minőség mod.
quality_control_hidden_qualities_sticky=A rejtett minőségű entitások (pl. fényes) nem fejlődnek tovább, megőrizve egyedi előnyeiket. Ez a beállítás csak akkor érvényes, ha telepítve van a Shiny Mechanics minőség mod.
enable-accumulators=Minőségváltozások engedélyezése akkumulátorok számára.
enable-agricultural-towers=Minőségváltozások engedélyezése mezőgazdasági tornyok számára.
enable-assembly-machines=Minőségváltozások engedélyezése összeszerelő gépek számára.
enable-asteroid-collectors=Minőségváltozások engedélyezése aszteroida gyűjtők számára.
asteroid-collector-growth-level-limit=Korlátozza az aszteroida gyűjtők minőség növekedését az alap értékekre a játékot megzavaró problémák megelőzése érdekében.\n\nA modolt minőségi szintű aszteroida gyűjtőknek túl sok karjuk lehet, amelyek túl gyorsan mozognak, így képtelenné válnak az aszteroida darabok fogására és nagy UPS fogyasztást okoznak.\n\n[color=green]Alapértelmezett: legendás[/color]
enable-beacons=Minőségváltozások engedélyezése sugárzók számára.
enable-boilers=Minőségváltozások engedélyezése kazánok számára.
enable-combinators-and-speakers=Minőségváltozások engedélyezése kombinátorok és hangszórók számára.\n\nTartalmazza: aritmetikai kombinátorok, döntő kombinátorok, állandó kombinátorok, programozható hangszórók.
enable-pumps=Minőségváltozások engedélyezése szivattyúk számára (beleértve a part menti szivattyúkat és folyadék szivattyúkat).
enable-furnaces=Minőségváltozások engedélyezése kemencék számára.
enable-generators=Minőségváltozások engedélyezése generátorok számára (gőzgépek, gőzturbinák, fúziós generátorok).
enable-heat-pipes=Minőségváltozások engedélyezése hőcsövek számára.
enable-inserters=Minőségváltozások engedélyezése beillesztők számára.
enable-labs=Minőségváltozások engedélyezése kutatólaboratóriumok számára.
enable-lamps=Minőségváltozások engedélyezése lámpák számára.
enable-lightning-rods=Minőségváltozások engedélyezése villámhárítók számára.
enable-mining-drills=Minőségváltozások engedélyezése minden bányászati fúró számára.
enable-poles=Minőségváltozások engedélyezése minden elektromos oszlop számára (beleértve a nagy elektromos oszlopokat és alállomásokat).
enable-power-switches=Minőségváltozások engedélyezése áramkapcsolók számára.
enable-radar=Minőségváltozások engedélyezése radarállomások számára.
radar-growth-level-limit=Korlátozza a radar minőség növekedését a túlzott térkép felfedezés és a mentési fájl felduzzadás megelőzése érdekében.\n\nA nagyon magas minőségi szintű radarok nagy mentési fájlokat okozhatnak (1200mb+) a túlzott térkép felfedezés miatt.\n\n[color=green]Alapértelmezett: legendás[/color]
lightning-attractor-growth-level-limit=Korlátozza a villámvonzók minőség növekedését a teljesítményproblémák megelőzése érdekében.\n\nA nagyon magas minőségi szintű villámvonzók jelentősen megnövelt lefedettségi területekkel rendelkeznek, ami lag-et okozhat éjszaka Fulgorán.\n\n[color=green]Alapértelmezett: legendás[/color]
enable-reactors=Minőségváltozások engedélyezése reaktorok számára (nukleáris reaktorok, fúziós reaktorok).
enable-rocket-silos=Minőségváltozások engedélyezése rakétasilók számára.
enable-roboports=Minőségváltozások engedélyezése robotportok számára.
enable-solar-panels=Minőségváltozások engedélyezése napelemek számára.
enable-thrusters=Minőségváltozások engedélyezése űr tolóhajtóművek számára. Alapértelmezetten letiltva, mert az űrhajó sebességének váratlan megváltozása a védelmi rendszerek túlterheléséhez vezethet.
thruster-growth-level-limit=Korlátozza az űr tolóhajtóművek minőség növekedését az alap szintekre a védelmi problémák megelőzése érdekében.\n\nA modolt minőségi szintek az űrhajókat jelentősen gyorsabbá tehetik, ami túlterhelheti a védelmi rendszerüket.\n\n[color=green]Alapértelmezett: legendás[/color]
enable-turrets=Minőségváltozások engedélyezése tornyok számára.\n\nA tornyok elsődleges entitások, amelyek fejlesztési krediteket generálnak a halmozott okozott kár alapján.\n\nTartalmazza: lőszer tornyok, lézer tornyok, lángszórók, tüzérségi tornyok.
turret-damage-per-manufacturing-hour=Az a kármennyiség, amelyet egy toronynak kell okoznia egy gyártási óra egyenértékéhez.\n\nAlapértelmezett: 36 000 kár (lyukasztó lövedékekből: 450 tár/óra × 80 kár/tár).\n\nAz alacsonyabb értékek gyorsabbá teszik a tornyok kredit generálását. A magasabb értékek lassítják a kredit generálást.
enable-defense-walls-and-gates=Minőségváltozások engedélyezése falak és kapuk számára.\n\nTartalmazza: falak, kapuk.
custom-upgrade-limit-a=Ezzel állíthatók be egyéni korlátok az entitások modolt minőségi szintjeihez. Csak akkor szükséges, ha van egy olyan mod, amely a legendás szint fölötti minőségi szinteket ad hozzá, és korlátozni szeretné, mennyire fejlődhet egy entitás. A funkció használatához állítsa be itt a maximális szintet, majd keresse meg a korlátozni kívánt entitást, és válassza az 'Egyéni A' lehetőséget a legördülő listában. Tájékoztatásul: a legendás az 5. szint (normál = 1, szokatlan = 2, ritka = 3, epikus = 4, legendás = 5...).
custom-upgrade-limit-b=Ezzel állíthatók be egyéni korlátok az entitások modolt minőségi szintjeihez. Csak akkor szükséges, ha van egy olyan mod, amely a legendás szint fölötti minőségi szinteket ad hozzá, és korlátozni szeretné, mennyire fejlődhet egy entitás. A funkció használatához állítsa be itt a maximális szintet, majd keresse meg a korlátozni kívánt entitást, és válassza az 'Egyéni B' lehetőséget a legördülő listában. Tájékoztatásul: a legendás az 5. szint (normál = 1, szokatlan = 2, ritka = 3, epikus = 4, legendás = 5...).
custom-upgrade-limit-c=Ezzel állíthatók be egyéni korlátok az entitások modolt minőségi szintjeihez. Csak akkor szükséges, ha van egy olyan mod, amely a legendás szint fölötti minőségi szinteket ad hozzá, és korlátozni szeretné, mennyire fejlődhet egy entitás. A funkció használatához állítsa be itt a maximális szintet, majd keresse meg a korlátozni kívánt entitást, és válassza az 'Egyéni C' lehetőséget a legördülő listában. Tájékoztatásul: a legendás az 5. szint (normál = 1, szokatlan = 2, ritka = 3, epikus = 4, legendás = 5...).
upgrade-limit-accumulators=A Minőségszabályozás ezeket az entitásokat eddig a minőségig fejleszti, majd leáll a további fejlesztési kísérletekkel. Állítsa Közönséges értékre a fejlesztési kísérletek megakadályozásához. Az egyéni értékek az Egyéni fejlesztési korlát A/B/C beállításokat használják.
upgrade-limit-agricultural-towers=A Minőségszabályozás ezeket az entitásokat eddig a minőségig fejleszti, majd leáll a további fejlesztési kísérletekkel. Állítsa Közönséges értékre a fejlesztési kísérletek megakadályozásához. Az egyéni értékek az Egyéni fejlesztési korlát A/B/C beállításokat használják.
upgrade-limit-assembly-machines=A Minőségszabályozás ezeket az entitásokat eddig a minőségig fejleszti, majd leáll a további fejlesztési kísérletekkel. Állítsa Közönséges értékre a fejlesztési kísérletek megakadályozásához. Az egyéni értékek az Egyéni fejlesztési korlát A/B/C beállításokat használják.
upgrade-limit-beacons=A Minőségszabályozás ezeket az entitásokat eddig a minőségig fejleszti, majd leáll a további fejlesztési kísérletekkel. Állítsa Közönséges értékre a fejlesztési kísérletek megakadályozásához. Az egyéni értékek az Egyéni fejlesztési korlát A/B/C beállításokat használják.
upgrade-limit-boilers=A Minőségszabályozás ezeket az entitásokat eddig a minőségig fejleszti, majd leáll a további fejlesztési kísérletekkel. Állítsa Közönséges értékre a fejlesztési kísérletek megakadályozásához. Az egyéni értékek az Egyéni fejlesztési korlát A/B/C beállításokat használják.
upgrade-limit-combinators-and-speakers=A Minőségszabályozás ezeket az entitásokat eddig a minőségig fejleszti, majd leáll a további fejlesztési kísérletekkel. Állítsa Közönséges értékre a fejlesztési kísérletek megakadályozásához. Az egyéni értékek az Egyéni fejlesztési korlát A/B/C beállításokat használják.\n\nTartalmazza: aritmetikai kombinátorok, döntő kombinátorok, konstans kombinátorok, programozható hangszórók.
upgrade-limit-defense-walls-and-gates=A Minőségszabályozás ezeket az entitásokat eddig a minőségig fejleszti, majd leáll a további fejlesztési kísérletekkel. Állítsa Közönséges értékre a fejlesztési kísérletek megakadályozásához. Az egyéni értékek az Egyéni fejlesztési korlát A/B/C beállításokat használják.\n\nTartalmazza: falak, kapuk.
