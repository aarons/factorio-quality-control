quality-level-cap-turrets=A maximális szint, amelyre a Minőségszabályozás fejleszti ezt az entitást. Az 5. szinten (legendás) megáll, ha nincsenek modolt szintek.\n\nTartalmazza: lőszer tornyok, lézer tornyok, lángszórók, tüzérségi tornyok.
quality-level-cap-asteroid-collectors=Korlátozza az aszteroida gyűjtők minőség növekedését az alap értékekre a játékot megzavaró problémák megelőzése érdekében.\n\nA modolt minőségi szintű aszteroida gyűjtőknek túl sok karjuk lehet, amelyek túl gyorsan mozognak, így képtelenné válnak az aszteroida darabok fogására és nagy UPS fogyasztást okoznak.\n\n[color=green]Alapértelmezett: 5. szint (legendás)[/color]\n[color=yellow]Tartomány: 1-255 minőségi szint[/color]
quality-level-cap-radar=Korlátozza a radar minőség növekedését a túlzott térkép felfedezés és a mentési fájl felduzzadás megelőzése érdekében.\n\nA nagyon magas minőségi szintű radarok nagy mentési fájlokat okozhatnak (1200mb+) a túlzott térkép felfedezés miatt.\n\n[color=green]Alapértelmezett: 5. szint (legendás)[/color]\n[color=yellow]Tartomány: 1-255 minőségi szint[/color]
quality-level-cap-lightning-rods=Korlátozza a villámvonzók minőség növekedését a teljesítményproblémák megelőzése érdekében.\n\nA nagyon magas minőségi szintű villámvonzók jelentősen megnövelt lefedettségi területekkel rendelkeznek, ami lag-et okozhat éjszaka Fulgorán.\n\n[color=green]Alapértelmezett: 5. szint (legendás)[/color]\n[color=yellow]Tartomány: 1-255 minőségi szint[/color]
quality-level-cap-thrusters=Korlátozza az űr tolóhajtóművek minőség növekedését az alap szintekre a védelmi problémák megelőzése érdekében.\n\nA modolt minőségi szintek az űrhajókat jelentősen gyorsabbá tehetik, ami túlterhelheti a védelmi rendszerüket.\n\n[color=green]Alapértelmezett: 5. szint (legendás)[/color]\n[color=yellow]Tartomány: 1-255 minőségi szint[/color]

