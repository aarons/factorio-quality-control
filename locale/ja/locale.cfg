[mod-setting-description]
manufacturing-hours-for-change=品質変更の試行に必要な製造時間数。\n製造時間は、機械が実際に稼働している間のみ蓄積されます。機械がアイドル状態の場合は進行しません。\n最小値0.001時間（3.6秒）、最大値1000時間。
crafting-speed-affects-progression=機械の製作速度が製造時間の獲得速度に影響するかどうかを制御します。\n\n[color=green]有効（デフォルト）:[/color] 製作速度が高い機械ほど進行が速くなります。製造時間は機械の製作速度と生産性に基づいて獲得されます。速度4、生産性50%の鋳造所は、製作速度1の組立機2よりも6倍速く進行します。\n\n[color=red]無効:[/color] 製作速度は進行に影響しません。製作速度に関わらず、実際に製作を行った1時間は1製造時間としてカウントされます。これにより、品質アップグレードごとに次のアップグレードが速くなる複利効果がなくなります。
percentage-chance-of-change=品質変更が成功する確率。\n最小値0.0001%、最大値100%（時間経過後必ず変更）
quality-increase-cost=これは品質レベルごとに変更試行間隔を増加させます。これは複利計算式です。0%に設定すると、品質レベルに関係なく試行間隔が同じになります\n\n[color=green]レベルごと50%コスト増加で3製造時間必要な例[/color]\n\n普通：3時間\nアンコモン：4.5時間\nレア：6.8時間\nエピック：10.1時間\nレジェンダリー：15.2時間\nMOD品質レベル10：173時間
quality-chance-accumulation-rate=失敗試行後にチャンスがどれだけ増加するかを制御します。\n\n[color=white]なし（デフォルト）：[/color]蓄積なし - チャンスは一定のまま。\n\n[color=white]低（20%）：[/color]失敗ごとにベース率の20%ずつチャンスが増加。\n\n[color=white]中（50%）：[/color]失敗ごとにベース率の50%ずつチャンスが増加。\n\n[color=white]高（100%）：[/color]失敗ごとにベース率の100%ずつチャンスが増加。\n\n[color=yellow]ベースチャンス1%の例：[/color]\n\n[color=white]低：[/color]1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]高：[/color]1.0% → 2.0% → 3.0% → 4.0%...\n\nすべての蓄積設定は最終的に品質変更を保証します - 高い設定ほど100%チャンスに早く到達します
accumulate-at-max-quality=最大品質の組立機でも貢献：\n有効にすると、最大品質の組立機とかまどは、それ以上アップグレードできなくても製造時間の追跡を続け、二次エンティティ（インサーター、ビーコンなど）のためのアップグレードクレジットを生成します。\n\n[color=green]有効（デフォルト）：[/color]最大品質の組立機は二次エンティティのためのアップグレードクレジットを生成し続けます。これによりゲーム後期に二次エンティティの安定した進歩が可能になります。\n\n[color=red]無効：[/color]まだアップグレード可能な低品質の組立機とかまどのみがクレジットを生成しますが、まだアップグレードが必要な二次エンティティとの比率として生成されます。極端な場合、単一の低品質組立機が工場全体の二次エンティティを進歩させる可能性があります。
change-modules-with-entity=これは機械の品質変更時にモジュールが影響を受けるかを制御します。\n\n[color=white]無効（デフォルト）：[/color]ホスト機械の品質変更時にモジュールは影響されません。\n\n[color=white]有効：[/color]ホストが変更されるとモジュールの品質も1段階変更されます。ホストの品質レベルを超えることはありません。\n\n[color=white]拡張有効：[/color]有効と同様ですが、品質変更が発生するたびにモジュールがホスト機械の品質に合わせて更新されます。
batch-entities-per-tick=パフォーマンスの急激な低下を避けるため、各ティックで処理するエンティティ数。\n最小値1、最大値1000。\n高い値はラグスパイクを起こす可能性がありますが、エンティティをより速く処理します。
batch-ticks-between-processing=バッチ処理サイクル間で待機するティック数。\n最小値1ティック、最大値6000ティック（約2.5分）。\n低い値はより頻繁に処理しますが、パフォーマンスに影響する可能性があります。
quality-change-aggregate-alerts-enabled=すべての品質変更を要約したコンソールメッセージを表示（5分ごとに1回表示）。例：「組立機3台アップグレード、インサーター2台アップグレード」
quality-change-entity-alerts-enabled=品質変更時に個別エンティティにマップピングアラートを表示。アラートをクリックしてアップグレードされたエンティティを表示。
quality_control_skip_hidden_qualities=品質管理は隠れた品質（例：シャイニーバリアント）をアップグレード時にスキップします。エンティティは品質管理を通じてシャイニーになることはありません - プレイヤーは通常の方法で取得する必要があります。この設定はShiny Mechanics品質modがインストールされている場合のみ適用されます。
quality_control_hidden_qualities_sticky=隠れた品質（例：シャイニー）を持つエンティティはそれ以上アップグレードされず、独自の利点を保持します。この設定はShiny Mechanics品質modがインストールされている場合のみ適用されます。
enable-accumulators=蓄電池の品質変更を有効にします。
enable-agricultural-towers=農業タワーの品質変更を有効にします。
enable-assembly-machines=組立機の品質変更を有効にします。
enable-asteroid-collectors=小惑星収集機の品質変更を有効にします。
asteroid-collector-growth-level-limit=ゲームバランスを崩す問題を防ぐため、小惑星収集機の品質成長をバニラ値に制限します。\n\nMOD品質ティアを持つ小惑星収集機はアームが多すぎて動きが速すぎるため、小惑星のチャンクを掴めなくなり、大きなUPS低下を引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
enable-beacons=ビーコンの品質変更を有効にします。
enable-boilers=ボイラーの品質変更を有効にします。
enable-combinators-and-speakers=コンビネーターとスピーカーの品質変更を有効にします。\n\n含む：演算コンビネーター、判定コンビネーター、定数コンビネーター、プログラム可能スピーカー。
enable-pumps=ポンプの品質変更を有効にします（沖合ポンプと流体ポンプを含む）。
enable-furnaces=かまどの品質変更を有効にします。
enable-generators=発電機の品質変更を有効にします（蒸気機関、蒸気タービン、核融合発電機）。
enable-heat-pipes=ヒートパイプの品質変更を有効にします。
enable-inserters=インサーターの品質変更を有効にします。
enable-labs=研究所の品質変更を有効にします。
enable-lamps=ランプの品質変更を有効にします。
enable-lightning-rods=避雷針の品質変更を有効にします。
enable-mining-drills=すべての採掘機の品質変更を有効にします。
enable-poles=すべての電柱の品質変更を有効にします（大型電柱と変電所を含む）。
enable-power-switches=電力スイッチの品質変更を有効にします。
enable-radar=レーダー基地の品質変更を有効にします。
radar-growth-level-limit=過度なマップ探索とセーブファイル肥大化を防ぐため、レーダーの品質成長を制限します。\n\n非常に高い品質レベルのレーダーは過度なマップ探索により大きなセーブファイル（1,200mb以上）を引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
lightning-attractor-growth-level-limit=パフォーマンス問題を防ぐため、避雷装置の品質成長を制限します。\n\n非常に高い品質レベルの避雷装置は大幅に拡大したカバー範囲を持ち、フルゴラでの夜間にラグスパイクを引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
enable-reactors=リアクター（原子炉、核融合炉）の品質変更を有効にします。
enable-rocket-silos=ロケットサイロの品質変更を有効にします。
enable-roboports=ロボポートの品質変更を有効にします。
enable-solar-panels=太陽光パネルの品質変更を有効にします。
enable-thrusters=宇宙推進機の品質変更を有効にします。宇宙船の速度が予期せず変化すると防衛機能が圧倒される可能性があるため、デフォルトでは無効になっています。
thruster-growth-level-limit=防衛問題を防ぐため、宇宙推進機の品質成長をバニラレベルに制限します。\n\nMOD品質ティアは宇宙船を大幅に速く移動させる可能性があり、防衛機能を圧倒する可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
enable-turrets=タレットの品質変更を有効にします。\n\nタレットは累積ダメージに基づいてアップグレードクレジットを生成する一次エンティティです。\n\n含む：弾薬タレット、レーザータレット、火炎放射器、砲兵タレット。
turret-damage-per-manufacturing-hour=タレットが1製造時間に相当するために与えなければならないダメージ量。\n\nデフォルト：36,000ダメージ（貫通弾薬から算出：450マガジン/時間 × 80ダメージ/マガジン）。\n\n低い値ほどタレットのクレジット生成が速くなります。
enable-defense-walls-and-gates=壁とゲートの品質変更を有効にします。\n\n含む：壁、ゲート。
custom-upgrade-limit-a=エンティティのMOD品質にカスタム上限を設定する際に使用します。レジェンダリーを超える品質レベルを追加するMODを使用していて、エンティティのアップグレード上限を制限したい場合にのみ必要です。この機能を使うには、ここで最大レベルを設定し、次に制限したいエンティティの設定に移動して、ドロップダウンから「カスタムA」を選択してください。参考までに、レジェンダリーはレベル5です（ノーマル=1、アンコモン=2、レア=3、エピック=4、レジェンダリー=5…）。
custom-upgrade-limit-b=エンティティのMOD品質にカスタム上限を設定する際に使用します。レジェンダリーを超える品質レベルを追加するMODを使用していて、エンティティのアップグレード上限を制限したい場合にのみ必要です。この機能を使うには、ここで最大レベルを設定し、次に制限したいエンティティの設定に移動して、ドロップダウンから「カスタムB」を選択してください。参考までに、レジェンダリーはレベル5です（ノーマル=1、アンコモン=2、レア=3、エピック=4、レジェンダリー=5…）。
custom-upgrade-limit-c=エンティティのMOD品質にカスタム上限を設定する際に使用します。レジェンダリーを超える品質レベルを追加するMODを使用していて、エンティティのアップグレード上限を制限したい場合にのみ必要です。この機能を使うには、ここで最大レベルを設定し、次に制限したいエンティティの設定に移動して、ドロップダウンから「カスタムC」を選択してください。参考までに、レジェンダリーはレベル5です（ノーマル=1、アンコモン=2、レア=3、エピック=4、レジェンダリー=5…）。
upgrade-limit-accumulators=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-agricultural-towers=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-assembly-machines=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-beacons=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-boilers=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-combinators-and-speakers=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。\n\n含まれるもの：算術コンビネーター、決定コンビネーター、定数コンビネーター、プログラマブルスピーカー。
upgrade-limit-defense-walls-and-gates=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。\n\n含まれるもの：壁、門。
upgrade-limit-furnaces=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-generators=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。\n\n含まれるもの：蒸気機関、蒸気タービン、核融合発電機。
upgrade-limit-heat-pipes=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-inserters=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-labs=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-lamps=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-mining-drills=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-poles=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。\n\n含まれるもの：すべての電柱、大型電柱、変電所。
upgrade-limit-power-switches=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-pumps=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。\n\n含まれるもの：オフショアポンプおよび液体ポンプ。
upgrade-limit-reactors=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。\n\n含まれるもの：核反応炉、核融合炉。
upgrade-limit-rocket-silos=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-roboports=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-solar-panels=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。
upgrade-limit-turrets=品質管理はこれらのエンティティをこの品質までアップグレードし、それ以上のアップグレードを試みません。アップグレードを一切行わないようにするには、コモンに設定してください。カスタム値は「カスタムアップグレード上限A/B/C」の設定を使用します。\n\n含まれるもの：弾薬タレット、レーザータレット、火炎放射器、大砲タレット。
upgrade-limit-asteroid-collectors=ゲームバランスを崩す問題を防ぐため、小惑星収集機の品質成長をバニラ値に制限します。\n\nMOD品質ティアを持つ小惑星収集機はアームが多すぎて動きが速すぎるため、小惑星のチャンクを掴めなくなり、大きなUPS低下を引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
upgrade-limit-radar=過度なマップ探索とセーブファイル肥大化を防ぐため、レーダーの品質成長を制限します。\n\n非常に高い品質レベルのレーダーは過度なマップ探索により大きなセーブファイル（1,200mb以上）を引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
upgrade-limit-lightning-rods=パフォーマンス問題を防ぐため、避雷装置の品質成長を制限します。\n\n非常に高い品質レベルの避雷装置は大幅に拡大したカバー範囲を持ち、フルゴラでの夜間にラグスパイクを引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
upgrade-limit-thrusters=防衛問題を防ぐため、宇宙推進機の品質成長をバニラレベルに制限します。\n\nMOD品質ティアは宇宙船を大幅に速く移動させる可能性があり、防衛機能を圧倒する可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]

