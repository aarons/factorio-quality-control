[mod-setting-description]
manufacturing-hours-for-change=品質変更の試行に必要な製造時間数。\n製造時間は、機械が実際に稼働している間のみ蓄積されます。機械がアイドル状態の場合は進行しません。\n最小値0.001時間（3.6秒）、最大値1000時間。
crafting-speed-affects-progression=[color=red]無効（デフォルト）:[/color] 製作速度は進行に影響せず、長時間のゲームでもアップグレードがより均等に発生するようになります。\n\n[color=green]有効:[/color] 製作速度と生産性によって獲得する製造時間が増加します。速度4、生産性50%の場合、速度1、生産性ボーナスなしの場合の6倍を獲得します。品質アップグレードによる速度上昇が累積し、ゲーム終盤にはアップグレードが非常に速く進むことがあります。
percentage-chance-of-change=アップグレードの試行が成功する確率。
quality-increase-cost=品質レベルごとに必要な製造時間の増加率。増加は複利で計算されます。0%では、すべてのレベルで必要時間が同じになります。\n\n50%の場合、必要時間が3時間なら、アンコモンでは4.5時間、レアでは6.75時間になります。
quality-chance-accumulation-rate=試行に失敗すると、ベースチャンスの一定割合だけアップグレードのチャンスが増加します。\n\n[color=white]なし:[/color] チャンスは一定のまま。\n[color=white]低:[/color] ベースチャンスの20%を加算。\n[color=white]中:[/color] ベースチャンスの50%を加算。\n[color=white]高:[/color] ベースチャンスの100%を加算。\n\nベースチャンスが1%の場合、低では1% → 1.2% → 1.4%...、高では1% → 2% → 3%...となります。
secondary-progression-rate=インサーター、電柱、ビーコンなど、自身の作業を計測できないエンティティの進行速度。\n\n100%では、同じサーフェス上の一次エンティティが獲得する平均製造時間と同じになります。値を高くすると進行が速くなり、0%では停止します。
change-modules-with-entity=[color=white]無効:[/color] モジュールはアップグレードされません。\n\n[color=white]有効:[/color] 機械がアップグレードされると、モジュールも機械の品質を上限に1段階アップグレードされます。\n\n[color=white]拡張有効:[/color] モジュールは機械の新しい品質に合わせてアップグレードされます。\n\n[color=white]独立:[/color] モジュールは二次進行によって独自にアップグレードの試行を獲得し、機械の品質上限を超えることができます。機械の上限をコモンに設定すると、モジュールのアップグレードも無効になります。
batch-entities-per-tick=バッチごとに処理するエンティティ数。大きいバッチはアップグレードの処理が速くなりますが、ラグが発生する可能性があります。独立モードではモジュールスロットも数に含まれます。
batch-ticks-between-processing=バッチ処理間のティック数。間隔を短くするとアップグレードがより頻繁に処理されますが、パフォーマンスが低下する可能性があります。
quality-change-aggregate-alerts-enabled=アップグレードの要約を5分ごとに表示します。
quality-change-entity-alerts-enabled=アップグレードされた場所にマップアラートアイコンを表示します。
quality-change-chat-enabled=エンティティまたはモジュールのアイコン、品質アイコン、ランダムな虹色の文字でアップグレードメッセージを表示します。
quality-change-gps-enabled=アップグレードごとにクリック可能な位置リンクを表示し、FactorioのGPSマップピングを発生させます。リンクをクリックするとその場所を再表示できます。カラフルなアップグレードチャットが有効な場合はそこにリンクを追加し、無効な場合はリンクのみを表示します。ゲーム標準のGPSピングにはチャットリンクが必要です。
quality-change-floating-text-enabled=新しい品質の色で上昇するアップグレードテキストを表示します。
quality-change-halo-enabled=アップグレードされた場所に、新しい品質の色で広がる光輪を表示します。
quality-change-rainbow-enabled=アップグレードされた場所に広がる虹色のリングを表示します。
quality-change-badge-enabled=新しい品質のアイコンが4.5秒かけて大きくなりながら上昇し、消えるまで回転し続けます。
quality-change-bubbles-enabled=アップグレードされた場所から、新しい品質の小さなアイコンが泡のように次々と浮かび上がります。
quality-change-sound-enabled=リモートビューを含め、現在表示中のサーフェスでのアップグレード時に選択したサウンドを再生します。
quality-change-sound=通知効果音、スピーカーのアラーム、ドラム音、楽器を選択します。楽器には「楽器の音符 / 基音」と「音符の動作」の設定が適用されます。アップグレードサウンドが有効な場合に、現在表示中のサーフェスでのアップグレードに対してのみ再生されます。
quality-change-sound-note=固定音、または音楽パターンの基音（調と開始音域）を設定します。アラーム、ドラム、効果音、完全ランダムモードでは無視されます。\n音符はFから半音ずつ上がります：1=F、3=G、5=A、7=B、8=C、10=D、12=E。次のオクターブには12を加えます。デフォルト：20（C）。\nピアノには48音、他の楽器には36音があります。固定モードでは使用可能な最高音に制限されます。音楽パターンは必要に応じてオクターブ単位で下げられ、調は維持されます。同じ設定では、各楽器固有の音域で同等のパターンが再生されます。
quality-change-sound-mode=音が聞こえるアップグレードごとに1音を再生し、パターンはプレイヤーごとに独立します。固定音は選択した音を維持し、音階の散歩は音階を1～2段階移動します。風鈴は長五音音階からランダムに選び、階段は上昇と下降を繰り返します。音階内でランダムは選択した音階と音域から選び、完全ランダムは楽器の全音域を使用します。\n音階の散歩と階段は基音から始まり、無音期間やセーブ・ロード後も続きから再生します。遅延した音符は予約されません。楽器にのみ適用されます。
quality-change-sound-scale=「楽器の音符 / 基音」を基準とする音階で、音階の散歩、階段、音階内でランダムに使用されます。半音階ではすべての半音を使用します。風鈴は常に長五音音階を使用し、固定音と完全ランダムはこの設定を無視します。
quality-change-sound-range=基音から始まる1または2オクターブ、または楽器の全音域を使用します。楽器の音域に収まるよう必要に応じてオクターブ単位で下げられます。音階の散歩、風鈴、階段、音階内でランダムに適用されます。固定音と完全ランダムはこの設定を無視します。
quality_control_skip_hidden_qualities=アップグレード時に隠れた品質（シャイニーバリアントなど）をスキップします。この設定はShiny MechanicsのようなMODがインストールされている場合のみ適用されます。
quality_control_hidden_qualities_sticky==隠れた品質（例：シャイニー）を持つエンティティはそれ以上アップグレードされず、独自の利点を保持します。この設定はShiny MechanicsのようなMODがインストールされている場合のみ適用されます。
enable-accumulators=蓄電池のアップグレードを有効にします。
enable-agricultural-towers=農業タワーのアップグレードを有効にします。
enable-assembly-machines=組立機のアップグレードを有効にします。
enable-asteroid-collectors=小惑星収集機のアップグレードを有効にします。
asteroid-collector-growth-level-limit=ゲームバランスを崩す問題を防ぐため、小惑星収集機の品質成長をバニラ値に制限します。\n\nMOD品質ティアを持つ小惑星収集機はアームが多すぎて動きが速すぎるため、小惑星のチャンクを掴めなくなり、大きなUPS低下を引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
enable-beacons=ビーコンのアップグレードを有効にします。
enable-boilers=ボイラーのアップグレードを有効にします。
enable-combinators-and-speakers=コンビネーターとプログラム可能スピーカーのアップグレードを有効にします。
enable-pumps=沖合ポンプと流体ポンプのアップグレードを有効にします。
enable-furnaces=かまどのアップグレードを有効にします。
enable-generators=蒸気機関、蒸気タービン、核融合発電機のアップグレードを有効にします。
enable-heat-pipes=ヒートパイプのアップグレードを有効にします。
enable-inserters=インサーターのアップグレードを有効にします。
enable-labs=研究所のアップグレードを有効にします。
enable-lamps=ランプのアップグレードを有効にします。
enable-lightning-rods=避雷針のアップグレードを有効にします。
enable-mining-drills=採掘機のアップグレードを有効にします。
enable-poles=電柱と変電所のアップグレードを有効にします。
enable-power-switches=電力スイッチのアップグレードを有効にします。
enable-radar=レーダー基地のアップグレードを有効にします。
radar-growth-level-limit=過度なマップ探索とセーブファイル肥大化を防ぐため、レーダーの品質成長を制限します。\n\n非常に高い品質レベルのレーダーは過度なマップ探索により大きなセーブファイル（1,200mb以上）を引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
lightning-attractor-growth-level-limit=パフォーマンス問題を防ぐため、避雷装置の品質成長を制限します。\n\n非常に高い品質レベルの避雷装置は大幅に拡大したカバー範囲を持ち、フルゴラでの夜間にラグスパイクを引き起こす可能性があります。\n\n[color=green]デフォルト：レジェンダリー[/color]
enable-reactors=原子炉と核融合炉のアップグレードを有効にします。
enable-rocket-silos=ロケットサイロのアップグレードを有効にします。
enable-roboports=ロボポートのアップグレードを有効にします。
enable-solar-panels=太陽光パネルのアップグレードを有効にします。
enable-thrusters=宇宙推進機のアップグレードを有効にします。宇宙船が速くなると防衛機能が圧倒される可能性があります。
thruster-growth-level-limit=宇宙推進機の品質をバニラレベルに制限できます。MOD品質ティアによって宇宙船が大幅に速くなり、防衛機能が圧倒される可能性があります。
enable-turrets=弾薬タレット、レーザータレット、火炎放射タレット、砲兵タレットのアップグレードを有効にします。タレットはダメージを与えることで「製造時間」を獲得します。
turret-damage-per-manufacturing-hour=タレットが1製造時間を獲得するために与える必要があるダメージ量。\n\nデフォルト：36,000ダメージ（基本レベルの組立機が1時間に生産できる貫通弾薬の量から算出）。
turrets-contribute-credits=タレットが同じサーフェス上のインサーターや電柱などの二次エンティティのアップグレードに貢献できるようにします。レールガンや雷タレットを使うゲーム終盤では、アップグレードが大幅に速くなる可能性があります。
enable-defense-walls-and-gates=壁とゲートのアップグレードを有効にします。
custom-upgrade-limit-a=以下の上限設定で「カスタムA」を選択した場合に使用する最大品質レベル。レジェンダリーを超える品質レベルを追加するMODを使用し、エンティティのアップグレード上限を制限したい場合にのみ必要です。例えば、小惑星収集機をレベル10までアップグレードできるようにする場合に使います。ここで最大レベルを設定し、制限したいエンティティのドロップダウンで「カスタムA」を選択してください。参考までに、レジェンダリーはレベル5です。
custom-upgrade-limit-b=アップグレード上限設定の「カスタムB」で使用する最大品質レベル。
custom-upgrade-limit-c=アップグレード上限設定の「カスタムC」で使用する最大品質レベル。
upgrade-limit-accumulators=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-agricultural-towers=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-assembly-machines=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-beacons=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-boilers=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-combinators-and-speakers=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。\n\n含まれるもの：演算コンビネーター、判定コンビネーター、定数コンビネーター、プログラム可能スピーカー。
upgrade-limit-defense-walls-and-gates=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-furnaces=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-generators=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。\n\n含まれるもの：蒸気機関、蒸気タービン、核融合発電機。
upgrade-limit-heat-pipes=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-inserters=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-labs=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-lamps=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-mining-drills=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-poles=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。\n\n電柱と変電所が含まれます。
upgrade-limit-power-switches=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-pumps=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。\n\n含まれるもの：沖合ポンプ、流体ポンプ。
upgrade-limit-reactors=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。\n\n含まれるもの：原子炉、核融合炉。
upgrade-limit-rocket-silos=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-roboports=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-solar-panels=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。
upgrade-limit-turrets=これらのエンティティのアップグレード品質の上限。コモンではアップグレードが無効になり、カスタムA/B/Cでは上記で指定したレベルが使用されます。\n\n含まれるもの：弾薬タレット、レーザータレット、火炎放射タレット、砲兵タレット。
upgrade-limit-asteroid-collectors=ゲーム進行に支障をきたす問題を防ぐため、小惑星収集機をレジェンダリーに制限します。MOD品質レベルではアームが多すぎて動きも速すぎるため、小惑星のチャンクを掴めなくなり、大きなUPS低下を引き起こす可能性があります。
upgrade-limit-radar=セーブファイルの肥大化を防ぐため、レーダーをレジェンダリーに制限します。MOD品質では過度なマップ探索により、ファイルサイズが1GBを超えるほど大きくなる可能性があります。
upgrade-limit-lightning-rods=UPSの急激な低下を防ぐため、避雷装置をレジェンダリーに制限します。MOD品質レベルの避雷装置はカバー範囲が大幅に拡大し、フルゴラの夜間にラグスパイクを引き起こす可能性があります。
upgrade-limit-thrusters=宇宙プラットフォームへの予期しない損害を防ぐため、宇宙推進機をレジェンダリーに制限します。MOD品質ティアによって宇宙船が大幅に速くなり、防衛機能が圧倒される可能性があります。

