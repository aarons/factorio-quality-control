quality-level-cap-combinators-and-speakers=Maximaal niveau waarnaar Kwaliteitscontrole deze entiteit zal verhogen. Stopt bij niveau 5 (legendarisch) als er geen gemodde niveaus aanwezig zijn.\n\nOmvat: rekenkundige combinatoren, beslissings combinatoren, constante combinatoren, programmeerbare speakers.
