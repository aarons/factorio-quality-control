upgrade-limit-asteroid-collectors=Beperkt asteroïde verzamelaar kwaliteitsgroei tot vanille waarden om spelbreker problemen te voorkomen.\n\nAsteroïde verzamelaars met gemodde kwaliteitsniveaus kunnen te veel armen hebben die te snel bewegen, waardoor ze geen asteroïde brokken kunnen grijpen en een grote UPS-last creëren.\n\n[color=green]Standaard: legendarisch[/color]
upgrade-limit-radar=Beperkt radar kwaliteitsgroei om overmatige kaartverkenning en opgeslagen bestandsgroei te voorkomen.\n\nRadars met zeer hoge kwaliteitsniveaus kunnen grote opgeslagen bestanden (1.200mb+) veroorzaken door overmatige kaartverkenning.\n\n[color=green]Standaard: legendarisch[/color]
upgrade-limit-lightning-rods=Beperkt bliksemafleider kwaliteitsgroei om prestatieproblemen te voorkomen.\n\nBliksemafleiders met zeer hoge kwaliteitsniveaus hebben aanzienlijk verhoogde dekkingsgebieden, wat lag-pieken kan veroorzaken 's nachts op Fulgora.\n\n[color=green]Standaard: legendarisch[/color]
upgrade-limit-thrusters=Beperkt ruimte stuwraket kwaliteitsgroei tot vanille niveaus om verdedigingsproblemen te voorkomen.\n\nGemodde kwaliteitsniveaus kunnen ruimteschepen aanzienlijk sneller laten bewegen, wat hun verdediging kan overweldigen.\n\n[color=green]Standaard: legendarisch[/color]

