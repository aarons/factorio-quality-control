upgrade-limit-mining-drills=Kwaliteitscontrole zal deze entiteiten upgraden tot deze kwaliteit, en dan stoppen met verdere upgrade pogingen. Stel dit in op Normaal om upgrade pogingen te voorkomen. De aangepaste waarden gebruiken de instellingen Aangepaste Upgradelimiet A/B/C.
upgrade-limit-poles=Kwaliteitscontrole zal deze entiteiten upgraden tot deze kwaliteit, en dan stoppen met verdere upgrade pogingen. Stel dit in op Normaal om upgrade pogingen te voorkomen. De aangepaste waarden gebruiken de instellingen Aangepaste Upgradelimiet A/B/C.\n\nInclusief: alle elektriciteitspalen, grote elektriciteitspalen, en onderstations.
upgrade-limit-power-switches=Kwaliteitscontrole zal deze entiteiten upgraden tot deze kwaliteit, en dan stoppen met verdere upgrade pogingen. Stel dit in op Normaal om upgrade pogingen te voorkomen. De aangepaste waarden gebruiken de instellingen Aangepaste Upgradelimiet A/B/C.
