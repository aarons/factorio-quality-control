[mod-setting-description]
manufacturing-hours-for-change=Het aantal productie-uren dat nodig is voordat een kwaliteitsverandering wordt geprobeerd.\nProductie-uren worden alleen opgebouwd wanneer de machine actief aan het werk is. Als deze inactief is, zal er geen voortgang zijn.\nMin waarde 0.001 uur (3.6 seconden), Max waarde 1000 uur.
crafting-speed-affects-progression=[color=green]Ingeschakeld:[/color] Productiesnelheid en productiviteit verhogen het aantal verdiende productie-uren. Snelheid 4 met 50% productiviteit verdient zes keer zoveel als snelheid 1 zonder productiviteitsbonus.\n\n[color=red]Uitgeschakeld:[/color] Productiesnelheid heeft geen invloed op de voortgang.
percentage-chance-of-change=Kans dat een upgradepoging slaagt.
quality-increase-cost=Toename van het aantal benodigde productie-uren per kwaliteitsniveau. De toename is samengesteld; bij 0% blijft het aantal op alle niveaus gelijk.\n\nBij 50% wordt een vereiste van 3 uur verhoogd naar 4,5 uur bij ongewoon en 6,75 uur bij zeldzaam.
quality-chance-accumulation-rate=Verhoog de upgradekans na een mislukte poging met een percentage van de basiskans.\n\n[color=white]Geen:[/color] Kans blijft constant.\n[color=white]Laag:[/color] Voeg 20% van de basiskans toe.\n[color=white]Gemiddeld:[/color] Voeg 50% van de basiskans toe.\n[color=white]Hoog:[/color] Voeg 100% van de basiskans toe.\n\nBij een basiskans van 1% geeft Laag 1% → 1,2% → 1,4%... en Hoog 1% → 2% → 3%...
secondary-progression-rate=Progressiesnelheid voor entiteiten die hun eigen werk niet kunnen meten, zoals grijpers, elektriciteitspalen en bakens.\n\n100% komt overeen met de gemiddelde productie-uren die primaire entiteiten op hetzelfde oppervlak verdienen. Hogere waarden versnellen de voortgang; 0% pauzeert deze.
change-modules-with-entity=[color=white]Uitgeschakeld:[/color] Modules worden niet geüpgraded.\n\n[color=white]Ingeschakeld:[/color] Modules stijgen één kwaliteitsniveau wanneer hun machine wordt geüpgraded, tot maximaal de kwaliteit van de machine.\n\n[color=white]Extra Ingeschakeld:[/color] Modules worden geüpgraded naar de nieuwe kwaliteit van hun machine.\n\n[color=white]Onafhankelijk:[/color] Modules verdienen hun eigen upgradepogingen via secundaire progressie en kunnen de kwaliteitslimiet van hun machine overschrijden. Als de limiet van de machine op Normaal staat, worden ook module-upgrades uitgeschakeld.
batch-entities-per-tick=Aantal entiteiten dat per batch wordt verwerkt. Grotere batches verwerken upgrades sneller, maar kunnen lag veroorzaken. Moduleslots tellen ook mee in de onafhankelijke modus.
batch-ticks-between-processing=Aantal ticks tussen de verwerking van batches. Kortere intervallen verwerken upgrades vaker, maar kunnen de prestaties verminderen.
quality-change-aggregate-alerts-enabled=Toon elke vijf minuten een overzicht van upgrades.
quality-change-entity-alerts-enabled=Toon waarschuwingspictogrammen op de kaart bij upgradelocaties.
quality-change-chat-enabled=Toon upgradeberichten met entiteits- of modulepictogrammen, kwaliteitspictogrammen en letters in willekeurige regenboogkleuren.
quality-change-gps-enabled=Toon voor elke upgrade een aanklikbare locatielink en activeer Factorio's GPS-ping op de kaart. Klik op de link om de locatie opnieuw te bekijken. Voegt de link toe aan kleurrijke upgradeberichten als die zijn ingeschakeld; toont anders alleen de link. De ingebouwde GPS-ping vereist een chatlink.
quality-change-floating-text-enabled=Toon opstijgende upgradetekst in de kleur van de nieuwe kwaliteit.
quality-change-halo-enabled=Toon een uitdijende halo in de kleur van de nieuwe kwaliteit op upgradelocaties.
quality-change-rainbow-enabled=Toon uitdijende regenboogringen op upgradelocaties.
quality-change-badge-enabled=Toon het pictogram van de nieuwe kwaliteit gedurende 4,5 seconden terwijl het groeit, opstijgt en blijft draaien tijdens het vervagen.
quality-change-bubbles-enabled=Laat op upgradelocaties een stroom kleine pictogrammen van de nieuwe kwaliteit als bellen omhoog zweven.
quality-change-sound-enabled=Speel het gekozen geluid af bij upgrades op het oppervlak dat je momenteel bekijkt, ook in de afstandsweergave.
quality-change-sound=Kies een meldingseffect, luidsprekeralarm, drumgeluid of muziekinstrument. Instrumenten gebruiken Instrumentnoot / grondtoon en Nootgedrag. Speelt alleen af als upgradegeluid is ingeschakeld, bij upgrades op het oppervlak dat je momenteel bekijkt.
quality-change-sound-note=Vaste noot of grondtoon (toonsoort en beginregister) voor muzikale patronen. Genegeerd voor alarmen, drums, effecten en de modus Volledig willekeurig.\nNoten stijgen per halve toon vanaf F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; tel 12 op voor het volgende octaaf. Standaard: 20 (C).\nDe piano heeft 48 noten; andere instrumenten hebben er 36. De vaste modus begrenst de noot tot de hoogste beschikbare noot. Muzikale patronen worden indien nodig met hele octaven verlaagd zodat ze passen, met behoud van de toonsoort. Dezelfde instellingen geven gelijkwaardige patronen in het eigen register van elk instrument.
quality-change-sound-mode=Eén noot per hoorbare upgrade, met een afzonderlijk patroon voor elke speler. Vaste noot behoudt de gekozen noot; Muzikaal dwalen verplaatst één of twee stappen in de toonladder; Windgong kiest willekeurige noten uit de majeurpentatonische toonladder; Trap stijgt en daalt herhaaldelijk; Willekeurig in toonladder kiest een noot uit de gekozen toonladder en het bereik; Volledig willekeurig gebruikt het hele bereik van het instrument.\nMuzikaal dwalen en Trap beginnen bij de grondtoon en gaan verder na stille perioden en na opslaan/laden. Er worden geen vertraagde noten in de wachtrij geplaatst. Heeft alleen invloed op muziekinstrumenten.
quality-change-sound-scale=Toonladder ten opzichte van Instrumentnoot / grondtoon, gebruikt door Muzikaal dwalen, Trap en Willekeurig in toonladder. Chromatisch staat elke halve toon toe. Windgong gebruikt altijd majeurpentatonisch; Vaste noot en Volledig willekeurig negeren deze instelling.
quality-change-sound-range=Eén of twee octaven vanaf de grondtoon, indien nodig met hele octaven verlaagd om binnen het instrument te passen; of het volledige bereik van het instrument. Geldt voor Muzikaal dwalen, Windgong, Trap en Willekeurig in toonladder. Vaste noot en Volledig willekeurig negeren deze instelling.
quality_control_skip_hidden_qualities=Sla verborgen kwaliteiten (zoals glimmende varianten) over bij het upgraden. Deze instelling geldt alleen wanneer je een mod zoals Shiny Mechanics hebt geïnstalleerd.
quality_control_hidden_qualities_sticky==Entiteiten met verborgen kwaliteiten (bijv. glimmend) zullen niet verder upgraden, waardoor hun unieke voordelen behouden blijven. Deze instelling geldt alleen wanneer je een mod zoals Shiny Mechanics hebt geïnstalleerd.
enable-accumulators=Schakel upgrades in voor accumulatoren.
enable-agricultural-towers=Schakel upgrades in voor landbouwtorens.
enable-assembly-machines=Schakel upgrades in voor assemblagemachines.
enable-asteroid-collectors=Schakel upgrades in voor asteroïdenverzamelaars.
asteroid-collector-growth-level-limit=Beperkt asteroïde verzamelaar kwaliteitsgroei tot vanille waarden om spelbreker problemen te voorkomen.\n\nAsteroïde verzamelaars met gemodde kwaliteitsniveaus kunnen te veel armen hebben die te snel bewegen, waardoor ze geen asteroïde brokken kunnen grijpen en een grote UPS-last creëren.\n\n[color=green]Standaard: legendarisch[/color]
enable-beacons=Schakel upgrades in voor bakens.
enable-boilers=Schakel upgrades in voor boilers.
enable-combinators-and-speakers=Schakel upgrades in voor combinatoren en programmeerbare luidsprekers.
enable-pumps=Schakel upgrades in voor kustpompen en vloeistofpompen.
enable-furnaces=Schakel upgrades in voor ovens.
enable-generators=Schakel upgrades in voor stoommachines, stoomturbines en fusiegeneratoren.
enable-heat-pipes=Schakel upgrades in voor warmteleidingen.
enable-inserters=Schakel upgrades in voor grijpers.
enable-labs=Schakel upgrades in voor onderzoekslaboratoria.
enable-lamps=Schakel upgrades in voor lampen.
enable-lightning-rods=Schakel upgrades in voor bliksemafleiders.
enable-mining-drills=Schakel upgrades in voor mijnboren.
enable-poles=Schakel upgrades in voor elektriciteitspalen en onderstations.
enable-power-switches=Schakel upgrades in voor stroomschakelaars.
enable-radar=Schakel upgrades in voor radarstations.
radar-growth-level-limit=Beperkt radar kwaliteitsgroei om overmatige kaartverkenning en opgeslagen bestandsgroei te voorkomen.\n\nRadars met zeer hoge kwaliteitsniveaus kunnen grote opgeslagen bestanden (1.200mb+) veroorzaken door overmatige kaartverkenning.\n\n[color=green]Standaard: legendarisch[/color]
lightning-attractor-growth-level-limit=Beperkt bliksemafleider kwaliteitsgroei om prestatieproblemen te voorkomen.\n\nBliksemafleiders met zeer hoge kwaliteitsniveaus hebben aanzienlijk verhoogde dekkingsgebieden, wat lag-pieken kan veroorzaken 's nachts op Fulgora.\n\n[color=green]Standaard: legendarisch[/color]
enable-reactors=Schakel upgrades in voor kernreactoren en fusiereactoren.
enable-rocket-silos=Schakel upgrades in voor raketsilo's.
enable-roboports=Schakel upgrades in voor robohavens.
enable-solar-panels=Schakel upgrades in voor zonnepanelen.
enable-thrusters=Schakel upgrades in voor ruimtestuwraketten. Snellere schepen kunnen hun verdediging overbelasten.
thruster-growth-level-limit=Beperk ruimtestuwraketten desgewenst tot de kwaliteitsniveaus van het basisspel. Gemodde kwaliteitsniveaus kunnen ruimteschepen aanzienlijk sneller laten bewegen, wat hun verdediging kan overbelasten.
enable-turrets=Schakel upgrades in voor kogelgeschutstorens, lasergeschutstorens, vlammenwerpers en artilleriegeschutstorens. Geschutstorens verdienen 'productie-uren' door schade toe te brengen.
turret-damage-per-manufacturing-hour=De hoeveelheid schade die een geschutstoren moet toebrengen om één productie-uur te verdienen.\n\nStandaard: 36.000 schade (gebaseerd op een geschutstoren van het basisniveau die een uur lang onafgebroken pantserdoorborende munitie afvuurt).
turrets-contribute-credits=Laat geschutstorens bijdragen aan upgrades voor secundaire entiteiten, zoals grijpers en elektriciteitspalen, op hetzelfde oppervlak. Dit kan upgrades laat in het spel sterk versnellen met railguns en bliksemgeschutstorens.
enable-defense-walls-and-gates=Schakel upgrades in voor muren en poorten.
custom-upgrade-limit-a=Maximaal kwaliteitsniveau voor de instelling 'Aangepast A' in de onderstaande limieten. Alleen nodig wanneer je een mod hebt die kwaliteitsniveaus toevoegt boven legendarisch en je het maximale upgradeniveau van een entiteit wilt beperken. Bijvoorbeeld als je asteroïdenverzamelaars tot niveau 10 wilt laten upgraden. Stel hier het maximale niveau in, ga naar de entiteit die je wilt beperken en selecteer 'Aangepast A' in de vervolgkeuzelijst. Ter referentie: legendarisch is niveau 5.
custom-upgrade-limit-b=Maximaal kwaliteitsniveau voor Aangepast B in de instellingen voor upgradelimieten.
custom-upgrade-limit-c=Maximaal kwaliteitsniveau voor Aangepast C in de instellingen voor upgradelimieten.
upgrade-limit-accumulators=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-agricultural-towers=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-assembly-machines=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-beacons=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-boilers=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-combinators-and-speakers=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.\n\nInclusief: rekenkundige combinatoren, beslissingscombinatoren, constante combinatoren, programmeerbare luidsprekers.
upgrade-limit-defense-walls-and-gates=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-furnaces=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-generators=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.\n\nInclusief: stoommachines, stoomturbines, fusiegeneratoren.
upgrade-limit-heat-pipes=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-inserters=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-labs=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-lamps=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-mining-drills=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-poles=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.\n\nInclusief elektriciteitspalen en onderstations.
upgrade-limit-power-switches=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-pumps=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.\n\nInclusief: kustpompen en vloeistofpompen.
upgrade-limit-reactors=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.\n\nInclusief: kernreactoren, fusiereactoren.
upgrade-limit-rocket-silos=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-roboports=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-solar-panels=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.
upgrade-limit-turrets=Maximale upgradekwaliteit voor deze entiteiten. Normaal schakelt upgrades uit; Aangepast A/B/C gebruikt het hierboven ingestelde aangepaste niveau.\n\nInclusief: kogelgeschutstorens, lasergeschutstorens, vlammenwerpers, artilleriegeschutstorens.
upgrade-limit-asteroid-collectors=Beperk asteroïdenverzamelaars tot legendarisch om ernstige spelproblemen te voorkomen. Gemodde niveaus kunnen te veel armen creëren die te snel bewegen, waardoor ze geen asteroïdenbrokken kunnen grijpen en de UPS sterk daalt.
upgrade-limit-radar=Beperk radars tot legendarisch om te voorkomen dat opslagbestanden te groot worden. Gemodde kwaliteiten kunnen leiden tot overmatige kaartverkenning en zeer grote bestanden (meer dan een gigabyte).
upgrade-limit-lightning-rods=Beperk bliksemafleiders tot legendarisch om UPS-pieken te voorkomen. Bliksemafleiders met gemodde kwaliteitsniveaus hebben een aanzienlijk groter dekkingsgebied, wat 's nachts op Fulgora lag-pieken kan veroorzaken.
upgrade-limit-thrusters=Beperk ruimtestuwraketten tot legendarisch om onverwachte schade aan ruimteplatforms te voorkomen. Gemodde kwaliteitsniveaus kunnen ruimteschepen aanzienlijk sneller laten bewegen, wat hun verdediging kan overbelasten.

