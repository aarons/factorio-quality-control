# Deze vertaling werd gegenereerd door een AI. Correcties zijn zeer welkom! Voeg alstublieft feedback toe aan het mod discussieforum (https://mods.factorio.com/mod/quality-control/discussion) of als een issue op de github repo (https://github.com/aarons/factorio-quality-control/issues). Vergeef me alstublieft de fouten!

