[mod-setting-description]
manufacturing-hours-for-change=Колькасць гадзін вытворчасці, патрэбных для спробы змены якасці.\nГадзіны вытворчасці назапашваюцца толькі тады, калі машына актыўна працуе. Калі яна бяздзейнічае, прагрэсу не будзе.\nМін значэнне 0.001 гадзін (3.6 секунд), Макс значэнне 1000 гадзін.
crafting-speed-affects-progression=Кантралюе, ці ўплывае хуткасць вырабу машыны на тое, як хутка яна назапашвае гадзіны вытворчасці.\n\n[color=green]Уключана (па змаўчанні):[/color] Машыны з вышэйшай хуткасцю вырабу будуць прагрэсаваць хутчэй. Гадзіны вытворчасці назапашваюцца на аснове хуткасці вырабу і прадукцыйнасці машыны. Ліцейня з хуткасцю 4 і прадукцыйнасцю 50% будзе прагрэсаваць у шэсць разоў хутчэй, чым зборачны аўтамат-2 з хуткасцю вырабу 1.\n\n[color=red]Выключана:[/color] Хуткасць вырабу не ўплывае на прагрэс. Адна гадзіна актыўнага вырабу лічыцца адной гадзінай вытворчасці, незалежна ад хуткасці вырабу. Гэта прыбірае эфект узмацнення, пры якім кожнае паляпшэнне якасці паскарае наступнае.
percentage-chance-of-change=Працэнтная верагоднасць таго, што змена якасці будзе паспяховай.\nМін значэнне 0.0001%, Макс значэнне 100% (заўсёды мяняць пасля сканчэння часу)
quality-increase-cost=Гэта павялічвае час паміж спробамі змен за кожны ўзровень якасці. Гэта складаная формула. Устаноўка на 0% захавае адзін і той жа час паміж спробамі незалежна ад узроўня якасці\n\n[color=green]Прыклад з 3 гадзінамі вытворчасці пры кошце 50% за ўзровень[/color]\n\nЗвычайны: 3 гадзіны\nНезвычайны: 4.5 гадзіны\nРэдкі: 6.8 гадзіны\nЭпічны: 10.1 гадзіны\nЛегендарны: 15.2 гадзіны\nМоднае якасць узр. 10: 173 гадзіны
quality-chance-accumulation-rate=Кантралюе, наколькі павялічваецца шанц пасля кожнай няўдалай спробы.\n\n[color=white]Няма (па змаўчанні):[/color] Няма назапашвання - шанц застаецца пастаянным.\n\n[color=white]Нізкі (20%):[/color] Шанц павялічваецца на 20% ад базавай хуткасці пры кожнай няўдачы.\n\n[color=white]Сярэдні (50%):[/color] Шанц павялічваецца на 50% ад базавай хуткасці пры кожнай няўдачы.\n\n[color=white]Высокі (100%):[/color] Шанц павялічваецца на 100% ад базавай хуткасці пры кожнай няўдачы.\n\n[color=yellow]Прыклад з 1% базавым шанцам:[/color]\n\n[color=white]Нізкі:[/color] 1.0% → 1.2% → 1.4% → 1.6%...\n[color=white]Высокі:[/color] 1.0% → 2.0% → 3.0% → 4.0%...\n\nУсе налады назапашвання ў рэшце рэшт гарантуюць змены якасці - большыя налады проста хутчэй дасягаюць 100% шанцу
secondary-progression-rate=Наколькі хутка другасныя аб'екты (маніпулятары, слупы, маякі — усё, што не можа вымяраць уласную працу) прагрэсуюць, у працэнтах ад таго, што зарабляе сярэдні першасны аб'ект на той жа паверхні.\n\n[color=green]100% (па змаўчанні):[/color] Другасныя аб'екты прасоўваюцца з той жа хуткасцю, што і сярэдні зборшчык, печ, шахта ці турэль вакол іх.\n\nУсталюйце 0%, каб цалкам спыніць другасны прагрэс; значэнні вышэй за 100% паскараюць мадэрнізацыю інфраструктуры хутчэй за тэмп вытворчых машын.\n\nМожна змяняць падчас гульні без перазапуску.
change-modules-with-entity=Гэта кантралюе, ці закранаюцца модулі ў машынах змены якасці.\n\n[color=white]Выключана (па змаўчанні):[/color] Модулі не закранаюцца пры змене якасці галоўнай машыны.\n\n[color=white]Уключана:[/color] Модулі змяняюць якасць на адзін узровень, калі змяняецца іх носьбіт. Яны не перавысяць узровень якасці носьбіта.\n\n[color=white]Дадаткова ўключана:[/color] Як і ўключана, але модулі будуць абнаўлены ў адпаведнасці з якасцю іх галоўнай машыны кожны раз, калі адбываецца змена якасці.
batch-entities-per-tick=Колькасць аб'ектаў для апрацоўкі за кожны тык, каб пазбегнуць пікаў прадукцыйнасці.\nМін значэнне 1, Макс значэнне 1000.\nБольшыя значэнні могуць выклікаць затрымкі, але апрацоўваюць аб'екты хутчэй.
batch-ticks-between-processing=Колькасць тыкаў чакання паміж цыкламі пакетнай апрацоўкі.\nМін значэнне 1 тык, Макс значэнне 6000 тыкаў (~2.5 хвіліны).\nМеншыя значэнні апрацоўваюць часцей, але могуць паўплываць на прадукцыйнасць.
quality-change-aggregate-alerts-enabled=Паказваць паведамленні кансолі, якія абагульняюць усе змены якасці (адлюстроўваюцца адзін раз на 5 хвілін). Прыклад: "3 зборачныя машыны паляпшаныя, 2 устаўшчыкі паляпшаныя"
quality-change-entity-alerts-enabled=Паказваць абвесткі пінгоў на мапе на асобных аб'ектах, калі змяняецца іх якасць. Націсніце на абвестку, каб убачыць паляпшаны аб'ект.
quality_control_skip_hidden_qualities=Кантроль якасці будзе прапускаць схаваныя якасці (напрыклад, бліскучыя варыянты) пры паляпшэнні. Аб'екты ніколі не стануць бліскучымі праз Кантроль якасці - гульцы павінны атрымаць іх звычайным спосабам. Гэтая налада прымяняецца толькі калі ў вас усталяваны мод Shiny Mechanics.
quality_control_hidden_qualities_sticky=Аб'екты са схаванымі якасцямі (напрыклад, бліскучыя) не будуць больш паляпшацца, захоўваючы свае унікальныя перавагі. Гэтая налада прымяняецца толькі калі ў вас усталяваны мод Shiny Mechanics.
enable-accumulators=Уключыць змены якасці для акумулятараў.
enable-agricultural-towers=Уключыць змены якасці для сельскагаспадарчых вежаў.
enable-assembly-machines=Уключыць змены якасці для зборачных машын.
enable-asteroid-collectors=Уключыць змены якасці для збіральнікаў астэроідаў.
asteroid-collector-growth-level-limit=Абмяжоўвае рост якасці збіральніка астэроідаў да ваніль значэнняў для прадухілення крытычных праблем гульні.\n\nЗбіральнікі астэроідаў з мадыфікаванымі ўзроўнямі якасці могуць мець занадта шмат рукаў, якія рухаюцца занадта хутка, становячыся няздольнымі захопліваць кавалкі астэроідаў і ствараючы вялікую нагрузку на UPS.\n\n[color=green]Па змаўчанні: легендарны[/color]
enable-beacons=Уключыць змены якасці для маякоў.
enable-boilers=Уключыць змены якасці для катлоў.
enable-combinators-and-speakers=Уключыць змены якасці для камбінатараў і дынамікаў.\n\nУключае: арыфметычныя камбінатары, камбінатары рашэнняў, пастаянныя камбінатары, праграмуемыя дынамікі.
enable-pumps=Уключыць змены якасці для помпаў (уключае берагавыя помпы і рыдкасныя помпы).
enable-furnaces=Уключыць змены якасці для печаў.
enable-generators=Уключыць змены якасці для генератараў (паравыя рухавікі, паравыя турбіны, тэрмаядзерныя генератары).
enable-heat-pipes=Уключыць змены якасці для цеплавых труб.
enable-inserters=Уключыць змены якасці для ўстаўшчыкаў.
enable-labs=Уключыць змены якасці для даследчых лабараторый.
enable-lamps=Уключыць змены якасці для лампаў.
enable-lightning-rods=Уключыць змены якасці для грамаадводаў.
enable-mining-drills=Уключыць змены якасці для ўсіх горнавыдабыўных свідраў.
enable-poles=Уключыць змены якасці для ўсіх электрычных слупоў (уключаючы вялікія слупы электрапярэдач і падстанцыі).
enable-power-switches=Уключыць змены якасці для выключальнікаў харчавання.
enable-radar=Уключыць змены якасці для радарных станцый.
radar-growth-level-limit=Абмяжоўвае рост якасці радара для прадухілення празмернага даследавання карты і раздзімання файла захавання.\n\nРадары з вельмі высокімі ўзроўнямі якасці могуць выклікаць вялікія файлы захавання (1,200мб+) з-за празмернага даследавання карты.\n\n[color=green]Па змаўчанні: легендарны[/color]
lightning-attractor-growth-level-limit=Абмяжоўвае рост якасці грамаадводу для прадухілення праблем з прадукцыйнасцю.\n\nГрамаадводы з вельмі высокімі ўзроўнямі якасці маюць значна павялічаныя зоны пакрыцця, што можа выклікаць затрымкі ноччу на Фулгоры.\n\n[color=green]Па змаўчанні: легендарны[/color]
enable-reactors=Уключыць змены якасці для рэактараў (ядзерныя рэактары, тэрмаядзерныя рэактары).
enable-rocket-silos=Уключыць змены якасці для ракетных шахт.
enable-roboports=Уключыць змены якасці для робапортаў.
enable-solar-panels=Уключыць змены якасці для сонечных панэляў.
enable-thrusters=Уключыць змены якасці для касмічных рухавікоў. Адключана па змаўчанні, таму што нечаканая змена хуткасці касмічнага карабля можа прывесці да перапаўнення абароны.
thruster-growth-level-limit=Абмяжоўвае рост якасці касмічнага рухавіка да ваніль узроўняў для прадухілення праблем з абаронай.\n\nМадыфікаваныя ўзроўні якасці могуць перамяшчаць касмічныя караблі значна хутчэй, што можа перапоўніць іх абарону.\n\n[color=green]Па змаўчанні: легендарны[/color]
enable-turrets=Уключыць змены якасці для турэляў.\n\nТурэлі з'яўляюцца першаснымі аб'ектамі, якія генеруюць крэдыты паляпшэння на аснове назапашанай нанесенай шкоды.\n\nУключае: турэлі боепрыпасаў, лазерныя турэлі, агнемётчыкі, артылерыйскія турэлі.
turret-damage-per-manufacturing-hour=Колькасць шкоды, якую турэль павінна нанесці, каб раўняцца адной гадзіне вытворчасці.\n\nПа змаўчанні: 36 000 шкоды (атрымана ад прабівальных снарадаў: 450 магазінаў/гадзіну × 80 шкоды/магазін).\n\nМеншыя значэнні прымушаюць турэлі генераваць крэдыты хутчэй. Большыя значэнні запавольваюць генерацыю крэдытаў.
turrets-contribute-credits=Кантралюе, ці крэдыты паляпшэння, атрыманыя турэлямі, таксама папаўняюць шкалу прагрэсу іх паверхні, якая паляпшае другасныя аб'екты (інсэртары, слупы электрасілкавання і інш.).\n\n[color=red]Адключана (па змаўчанні):[/color] Крэдыты турэляў застаюцца пры турэлі. Баявыя пашкоджанні дапамагаюць толькі паляпшаць самі турэлі, і турэлі не ўлічваюцца ў сярэднім прагрэсе паверхні.\n\n[color=green]Уключана:[/color] Крэдыты турэляў таксама папаўняюць шкалу прагрэсу паверхні, так што баявыя пашкоджанні прасоўваюць другасныя аб'екты гэтак жа, як і вытворчасць.
enable-defense-walls-and-gates=Уключыць змены якасці для сцен і варотняў.\n\nУключае: сцены, варотні.
custom-upgrade-limit-a=Выкарыстоўвайце гэта для ўстаноўкі ўласных лімітаў на мадыфікаваныя якасці для аб'ектаў. Патрэбна толькі калі ў вас ёсць мод, які дадае ўзроўні якасці звыш легендарнага, і вы хочаце абмежаваць, наколькі моцна аб'ект будзе мадэрнізавацца. Каб выкарыстаць гэтую функцыю, устанавіце тут максімальны ўзровень, затым перайдзіце да аб'екта, які хочаце абмежаваць, і абярыце 'Custom A' у выпадальным спісе. Для даведкі, легендарны — гэта ўзровень 5 (звычайны = 1, незвычайны = 2, рэдкі = 3, эпічны = 4, легендарны = 5...).
custom-upgrade-limit-b=Выкарыстоўвайце гэта для ўстаноўкі ўласных лімітаў на мадыфікаваныя якасці для аб'ектаў. Патрэбна толькі калі ў вас ёсць мод, які дадае ўзроўні якасці звыш легендарнага, і вы хочаце абмежаваць, наколькі моцна аб'ект будзе мадэрнізавацца. Каб выкарыстаць гэтую функцыю, устанавіце тут максімальны ўзровень, затым перайдзіце да аб'екта, які хочаце абмежаваць, і абярыце 'Custom B' у выпадальным спісе. Для даведкі, легендарны — гэта ўзровень 5 (звычайны = 1, незвычайны = 2, рэдкі = 3, эпічны = 4, легендарны = 5...).
custom-upgrade-limit-c=Выкарыстоўвайце гэта для ўстаноўкі ўласных лімітаў на мадыфікаваныя якасці для аб'ектаў. Патрэбна толькі калі ў вас ёсць мод, які дадае ўзроўні якасці звыш легендарнага, і вы хочаце абмежаваць, наколькі моцна аб'ект будзе мадэрнізавацца. Каб выкарыстаць гэтую функцыю, устанавіце тут максімальны ўзровень, затым перайдзіце да аб'екта, які хочаце абмежаваць, і абярыце 'Custom C' у выпадальным спісе. Для даведкі, легендарны — гэта ўзровень 5 (звычайны = 1, незвычайны = 2, рэдкі = 3, эпічны = 4, легендарны = 5...).
upgrade-limit-accumulators=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-agricultural-towers=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-assembly-machines=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-beacons=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-boilers=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-combinators-and-speakers=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.\n\nУключае: арыфметычныя камбінатары, камбінатары рашэння, пастаянныя камбінатары, праграмуемыя дынамікі.
upgrade-limit-defense-walls-and-gates=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.\n\nУключае: сцены, брамы.
upgrade-limit-furnaces=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-generators=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.\n\nУключае: паравыя рухавікі, паравыя турбіны, тэрмаядзерныя генератары.
upgrade-limit-heat-pipes=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-inserters=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-labs=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-lamps=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-mining-drills=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-poles=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.\n\nУключае: усе слупы электраперадачы, вялікія слупы электраперадачы і падстанцыі.
upgrade-limit-power-switches=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-pumps=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.\n\nУключае: марскія помпы і помпы вадкасці.
upgrade-limit-reactors=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.\n\nУключае: ядзерныя рэактары, тэрмаядзерныя рэактары.
upgrade-limit-rocket-silos=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-roboports=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-solar-panels=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.
upgrade-limit-turrets=Кантроль якасці будзе мадэрнізаваць гэтыя аб'екты да гэтай якасці, пасля чаго спыніць спробы далейшай мадэрнізацыі. Устанавіце значэнне 'Звычайная', каб прадухіліць любыя спробы мадэрнізацыі. Уласныя значэнні выкарыстоўваюць налады 'Уласны ліміт мадэрнізацыі A/B/C'.\n\nУключае: кулямётныя турэлі, лазерныя турэлі, вогнямёты, артылерыйскія турэлі.
upgrade-limit-asteroid-collectors=Абмяжоўвае рост якасці збіральніка астэроідаў да ваніль значэнняў для прадухілення крытычных праблем гульні.\n\nЗбіральнікі астэроідаў з мадыфікаванымі ўзроўнямі якасці могуць мець занадта шмат рукаў, якія рухаюцца занадта хутка, становячыся няздольнымі захопліваць кавалкі астэроідаў і ствараючы вялікую нагрузку на UPS.\n\n[color=green]Па змаўчанні: легендарны[/color]
upgrade-limit-radar=Абмяжоўвае рост якасці радара для прадухілення празмернага даследавання карты і раздзімання файла захавання.\n\nРадары з вельмі высокімі ўзроўнямі якасці могуць выклікаць вялікія файлы захавання (1,200мб+) з-за празмернага даследавання карты.\n\n[color=green]Па змаўчанні: легендарны[/color]
upgrade-limit-lightning-rods=Абмяжоўвае рост якасці грамаадводу для прадухілення праблем з прадукцыйнасцю.\n\nГрамаадводы з вельмі высокімі ўзроўнямі якасці маюць значна павялічаныя зоны пакрыцця, што можа выклікаць затрымкі ноччу на Фулгоры.\n\n[color=green]Па змаўчанні: легендарны[/color]
upgrade-limit-thrusters=Абмяжоўвае рост якасці касмічнага рухавіка да ваніль узроўняў для прадухілення праблем з абаронай.\n\nМадыфікаваныя ўзроўні якасці могуць перамяшчаць касмічныя караблі значна хутчэй, што можа перапоўніць іх абарону.\n\n[color=green]Па змаўчанні: легендарны[/color]

