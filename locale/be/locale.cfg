[mod-setting-description]
manufacturing-hours-for-change=Колькасць гадзін вытворчасці, патрэбных для спробы змены якасці.\nГадзіны вытворчасці назапашваюцца толькі тады, калі машына актыўна працуе. Калі яна бяздзейнічае, прагрэсу не будзе.\nМін значэнне 0.001 гадзін (3.6 секунд), Макс значэнне 1000 гадзін.
crafting-speed-affects-progression=[color=green]Уключана:[/color] Хуткасць вырабу і прадукцыйнасць павялічваюць назапашванне гадзін вытворчасці. Хуткасць 4 з прадукцыйнасцю 50% дае ў шэсць разоў больш гадзін, чым хуткасць 1 без бонуса прадукцыйнасці.\n\n[color=red]Выключана:[/color] Хуткасць вырабу не ўплывае на прагрэс.
percentage-chance-of-change=Верагоднасць паспяховай спробы паляпшэння.
quality-increase-cost=Павелічэнне неабходных гадзін вытворчасці за кожны ўзровень якасці. Павелічэнне назапашваецца; пры 0% патрабаванне аднолькавае на ўсіх узроўнях.\n\nПры 50% патрабаванне ў 3 гадзіны становіцца 4.5 гадзіны для незвычайнай якасці і 6.75 гадзіны для рэдкай.
quality-chance-accumulation-rate=Павялічвае шанц паляпшэння пасля няўдалай спробы на працэнт ад базавага шанцу.\n\n[color=white]Няма:[/color] Шанц застаецца пастаянным.\n[color=white]Нізкі:[/color] Дадаецца 20% ад базавага шанцу.\n[color=white]Сярэдні:[/color] Дадаецца 50% ад базавага шанцу.\n[color=white]Высокі:[/color] Дадаецца 100% ад базавага шанцу.\n\nПры базавым шанцы 1% нізкі ўзровень дае 1% → 1.2% → 1.4%..., а высокі — 1% → 2% → 3%...
secondary-progression-rate=Хуткасць прагрэсу аб'ектаў, якія не могуць вымяраць уласную працу, напрыклад маніпулятараў, слупоў і маякоў.\n\n100% адпавядае сярэдняй колькасці гадзін вытворчасці, назапашаных першаснымі аб'ектамі на той жа паверхні. Больш высокія значэнні паскараюць прагрэс; 0% прыпыняе яго.
change-modules-with-entity=[color=white]Выключана:[/color] Модулі не паляпшаюцца.\n\n[color=white]Уключана:[/color] Модулі паляпшаюцца на адзін узровень пры паляпшэнні машыны, але не вышэй за яе якасць.\n\n[color=white]Дадаткова ўключана:[/color] Модулі паляпшаюцца да новай якасці машыны.\n\n[color=white]Незалежна:[/color] Модулі атрымліваюць уласныя спробы паляпшэння праз другасны прагрэс і могуць перавышаць ліміт якасці машыны. Калі ліміт машыны ўстаноўлены на звычайную якасць, паляпшэнне модуляў таксама адключаецца.
batch-entities-per-tick=Колькасць аб'ектаў, якія апрацоўваюцца за пакет. Большыя пакеты паскараюць апрацоўку паляпшэнняў, але могуць выклікаць затрымкі. У незалежным рэжыме слоты модуляў таксама ўлічваюцца.
batch-ticks-between-processing=Колькасць тыкаў паміж апрацоўкай пакетаў. Карацейшыя інтэрвалы дазваляюць часцей апрацоўваць паляпшэнні, але могуць знізіць прадукцыйнасць.
quality-change-aggregate-alerts-enabled=Выводзіць зводку паляпшэнняў кожныя пяць хвілін.
quality-change-entity-alerts-enabled=Паказваць значкі абвестак на мапе ў месцах паляпшэння.
quality-change-chat-enabled=Выводзіць паведамленні пра паляпшэнні са значкамі аб'ектаў або модуляў, значкамі якасці і літарамі выпадковых колераў вясёлкі.
quality-change-gps-enabled=Для кожнага паляпшэння выводзіць спасылку на месцазнаходжанне і запускаць пінг GPS на мапе Factorio. Націсніце на спасылку, каб вярнуцца да месца. Калі рознакаляровыя паведамленні пра паляпшэнні ўключаны, спасылка дадаецца да іх; інакш выводзіцца толькі спасылка. Для ўбудаванага пінга GPS патрэбна спасылка ў чаце.
quality-change-floating-text-enabled=Паказваць тэкст паляпшэння, які падымаецца ўверх, колерам новай якасці.
quality-change-halo-enabled=Паказваць арэол колеру новай якасці, які пашыраецца ў месцы паляпшэння.
quality-change-rainbow-enabled=Паказваць вясёлкавыя кольцы, якія пашыраюцца ў месцах паляпшэння.
quality-change-badge-enabled=Паказваць значок новай якасці, які павялічваецца і падымаецца на працягу 4.5 секунды, бесперапынна круцячыся да знікнення.
quality-change-bubbles-enabled=У месцах паляпшэння выпускаць паток маленькіх значкоў новай якасці, якія падымаюцца ўверх, як бурбалкі.
quality-change-sound-enabled=Прайграваць абраны гук пры паляпшэннях на паверхні, якую вы зараз праглядаеце, у тым ліку ў дыстанцыйным рэжыме.
quality-change-sound=Выберыце эфект апавяшчэння, сігнал дынаміка, гук барабана або музычны інструмент. Інструменты выкарыстоўваюць налады ноты інструмента / асноўнага тону і паводзін нот. Гук прайграваецца толькі пры ўключанай наладзе гуку паляпшэння і для паляпшэнняў на паверхні, якую вы зараз праглядаеце.
quality-change-sound-note=Фіксаваная нота або асноўны тон (танальнасць і пачатковы рэгістр) для музычных паслядоўнасцей. Ігнаруецца для сігналаў, барабанаў, эфектаў і рэжыму «Цалкам выпадкова».\nНоты падымаюцца паўтонамі ад F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; дадайце 12 для наступнай актавы. Па змаўчанні: 20 (C).\nПіяніна мае 48 нот, іншыя інструменты — 36. У фіксаваным рэжыме значэнне абмяжоўваецца найвышэйшай даступнай нотай. Пры неабходнасці музычныя паслядоўнасці зрушваюцца ўніз на цэлыя актавы, захоўваючы танальнасць. Аднолькавыя налады даюць эквівалентныя паслядоўнасці ва ўласным рэгістры кожнага інструмента.
quality-change-sound-mode=Адна нота на кожнае чутнае паляпшэнне, з асобнай паслядоўнасцю для кожнага гульца. «Фіксаваная нота» захоўвае выбраную ноту; «Музычнае блуканне» пераходзіць на адну або дзве прыступкі ладу; «Музыка ветру» выбірае выпадковыя ноты мажорнай пентатонікі; «Лесвіца» шматкроць падымаецца і апускаецца; «Выпадкова ў ладзе» выбірае любую ноту ў выбраным ладзе і дыяпазоне; «Цалкам выпадкова» выкарыстоўвае ўвесь дыяпазон інструмента.\n«Музычнае блуканне» і «Лесвіца» пачынаюцца з асноўнага тону і працягваюцца пасля перыядаў цішыні і захавання або загрузкі. Ноты з затрымкай у чаргу не ставяцца. Уплывае толькі на музычныя інструменты.
quality-change-sound-scale=Лад адносна ноты інструмента / асноўнага тону паляпшэння, які выкарыстоўваецца рэжымамі «Музычнае блуканне», «Лесвіца» і «Выпадкова ў ладзе». Храматычны лад дазваляе ўсе паўтоны. «Музыка ветру» заўсёды выкарыстоўвае мажорную пентатоніку; «Фіксаваная нота» і «Цалкам выпадкова» ігнаруюць гэтую наладу.
quality-change-sound-range=Адна або дзве актавы ад асноўнага тону, пры неабходнасці зрушаныя ўніз на цэлыя актавы, каб змясціцца ў дыяпазоне інструмента; або поўны дыяпазон інструмента. Ужываецца да рэжымаў «Музычнае блуканне», «Музыка ветру», «Лесвіца» і «Выпадкова ў ладзе». «Фіксаваная нота» і «Цалкам выпадкова» ігнаруюць гэтую наладу.
quality_control_skip_hidden_qualities=Прапускаць схаваныя якасці (напрыклад, бліскучыя варыянты) пры паляпшэнні. Гэтая налада прымяняецца толькі калі ў вас усталяваны мод накшталт Shiny Mechanics.
quality_control_hidden_qualities_sticky==Аб'екты са схаванымі якасцямі (напрыклад, бліскучыя) не будуць больш паляпшацца, захоўваючы свае ўнікальныя перавагі. Гэтая налада прымяняецца толькі калі ў вас усталяваны мод накшталт Shiny Mechanics.
enable-accumulators=Уключыць паляпшэнні для акумулятараў.
enable-agricultural-towers=Уключыць паляпшэнні для сельскагаспадарчых вежаў.
enable-assembly-machines=Уключыць паляпшэнні для зборачных машын.
enable-asteroid-collectors=Уключыць паляпшэнні для збіральнікаў астэроідаў.
asteroid-collector-growth-level-limit=Абмяжоўвае рост якасці збіральніка астэроідаў да ваніль значэнняў для прадухілення крытычных праблем гульні.\n\nЗбіральнікі астэроідаў з мадыфікаванымі ўзроўнямі якасці могуць мець занадта шмат рукаў, якія рухаюцца занадта хутка, становячыся няздольнымі захопліваць кавалкі астэроідаў і ствараючы вялікую нагрузку на UPS.\n\n[color=green]Па змаўчанні: легендарны[/color]
enable-beacons=Уключыць паляпшэнні для маякоў.
enable-boilers=Уключыць паляпшэнні для катлоў.
enable-combinators-and-speakers=Уключыць паляпшэнні для камбінатараў і праграмуемых дынамікаў.
enable-pumps=Уключыць паляпшэнні для берагавых помпаў і помпаў вадкасці.
enable-furnaces=Уключыць паляпшэнні для печаў.
enable-generators=Уключыць паляпшэнні для паравых рухавікоў, паравых турбін і тэрмаядзерных генератараў.
enable-heat-pipes=Уключыць паляпшэнні для цеплавых труб.
enable-inserters=Уключыць паляпшэнні для маніпулятараў.
enable-labs=Уключыць паляпшэнні для даследчых лабараторый.
enable-lamps=Уключыць паляпшэнні для лампаў.
enable-lightning-rods=Уключыць паляпшэнні для грамаадводаў.
enable-mining-drills=Уключыць паляпшэнні для горнавыдабыўных свідраў.
enable-poles=Уключыць паляпшэнні для электрычных слупоў і падстанцый.
enable-power-switches=Уключыць паляпшэнні для выключальнікаў харчавання.
enable-radar=Уключыць паляпшэнні для радарных станцый.
radar-growth-level-limit=Абмяжоўвае рост якасці радара для прадухілення празмернага даследавання карты і раздзімання файла захавання.\n\nРадары з вельмі высокімі ўзроўнямі якасці могуць выклікаць вялікія файлы захавання (1,200мб+) з-за празмернага даследавання карты.\n\n[color=green]Па змаўчанні: легендарны[/color]
lightning-attractor-growth-level-limit=Абмяжоўвае рост якасці грамаадводу для прадухілення праблем з прадукцыйнасцю.\n\nГрамаадводы з вельмі высокімі ўзроўнямі якасці маюць значна павялічаныя зоны пакрыцця, што можа выклікаць затрымкі ноччу на Фулгоры.\n\n[color=green]Па змаўчанні: легендарны[/color]
enable-reactors=Уключыць паляпшэнні для ядзерных і тэрмаядзерных рэактараў.
enable-rocket-silos=Уключыць паляпшэнні для ракетных шахт.
enable-roboports=Уключыць паляпшэнні для робапортаў.
enable-solar-panels=Уключыць паляпшэнні для сонечных панэляў.
enable-thrusters=Уключыць паляпшэнні для касмічных рухавікоў. Абарона хутчэйшых караблёў можа не справіцца.
thruster-growth-level-limit=Пры жаданні абмяжуйце касмічныя рухавікі ўзроўнямі базавай гульні. Дададзеныя модамі ўзроўні якасці могуць значна паскорыць касмічныя караблі, і іх абарона можа не справіцца.
enable-turrets=Уключыць паляпшэнні для кулямётных, лазерных, агнямётных і артылерыйскіх турэляў. Турэлі атрымліваюць «гадзіны вытворчасці», наносячы шкоду.
turret-damage-per-manufacturing-hour=Колькасць шкоды, якую турэль павінна нанесці, каб атрымаць адну гадзіну вытворчасці.\n\nПа змаўчанні: 36 000 шкоды (разлічана для турэлі базавага ўзроўню, якая бесперапынна страляе прабівальнымі патронамі на працягу гадзіны).
turrets-contribute-credits=Дазволіць турэлям спрыяць паляпшэнню другасных аб'ектаў, напрыклад маніпулятараў і электрычных слупоў, на той жа паверхні. На позніх этапах гульні рэйкавыя і маланкавыя турэлі могуць значна паскорыць паляпшэнні.
enable-defense-walls-and-gates=Уключыць паляпшэнні для сцен і брам.
custom-upgrade-limit-a=Максімальны ўзровень якасці для налады «Уласны A» у абмежавальніках ніжэй. Патрэбна толькі калі мод дадае ўзроўні якасці звыш легендарнага і вы хочаце абмежаваць узровень паляпшэння аб'екта. Напрыклад, каб дазволіць збіральнікам астэроідаў дасягнуць 10-га ўзроўню. Устанавіце тут максімальны ўзровень, затым перайдзіце да патрэбнага аб'екта і выберыце «Уласны A» у выпадальным спісе. Для даведкі: легендарная якасць — гэта ўзровень 5.
custom-upgrade-limit-b=Максімальны ўзровень якасці для значэння «Уласны B» у наладах лімітаў паляпшэння.
custom-upgrade-limit-c=Максімальны ўзровень якасці для значэння «Уласны C» у наладах лімітаў паляпшэння.
upgrade-limit-accumulators=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-agricultural-towers=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-assembly-machines=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-beacons=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-boilers=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-combinators-and-speakers=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.\n\nУключае: арыфметычныя камбінатары, камбінатары рашэнняў, пастаянныя камбінатары, праграмуемыя дынамікі.
upgrade-limit-defense-walls-and-gates=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-furnaces=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-generators=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.\n\nУключае: паравыя рухавікі, паравыя турбіны, тэрмаядзерныя генератары.
upgrade-limit-heat-pipes=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-inserters=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-labs=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-lamps=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-mining-drills=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-poles=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.\n\nУключае электрычныя слупы і падстанцыі.
upgrade-limit-power-switches=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-pumps=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.\n\nУключае: берагавыя помпы і помпы вадкасці.
upgrade-limit-reactors=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.\n\nУключае: ядзерныя рэактары, тэрмаядзерныя рэактары.
upgrade-limit-rocket-silos=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-roboports=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-solar-panels=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.
upgrade-limit-turrets=Максімальная якасць паляпшэння гэтых аб'ектаў. «Звычайная» адключае паляпшэнні; «Уласны A/B/C» выкарыстоўвае зададзены вышэй узровень.\n\nУключае: кулямётныя турэлі, лазерныя турэлі, агнямёты, артылерыйскія турэлі.
upgrade-limit-asteroid-collectors=Абмяжуйце якасць збіральнікаў астэроідаў легендарнай, каб прадухіліць крытычныя праблемы ў гульні. Дададзеныя модамі ўзроўні могуць стварыць занадта шмат занадта хуткіх рукаў, якія не здолеюць захопліваць кавалкі астэроідаў і значна знізяць UPS.
upgrade-limit-radar=Абмяжуйце якасць радараў легендарнай, каб прадухіліць разрастанне файлаў захавання. Дададзеныя модамі якасці могуць прывесці да празмернага даследавання мапы і вельмі вялікіх файлаў захавання (больш за гігабайт).
upgrade-limit-lightning-rods=Абмяжуйце якасць прыцягвальнікаў маланак легендарнай, каб прадухіліць скачкі нагрузкі на UPS. Прыцягвальнікі з дададзенымі модамі ўзроўнямі якасці маюць значна большыя зоны пакрыцця, што можа выклікаць затрымкі ноччу на Фулгоры.
upgrade-limit-thrusters=Абмяжуйце якасць касмічнага рухавіка легендарнай, каб прадухіліць нечаканыя пашкоджанні касмічнай платформы. Дададзеныя модамі ўзроўні якасці могуць значна паскорыць касмічныя караблі, і іх абарона можа не справіцца.

