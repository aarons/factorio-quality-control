[mod-setting-description]
manufacturing-hours-for-change=Antall produksjonstimer som kreves før en kvalitetsendring blir forsøkt.\nProduksjonstimer akkumuleres kun når maskinen aktivt arbeider. Hvis den står inaktiv, vil den ikke gjøre fremgang.\nMin verdi 0,001 timer (3,6 sekunder), Maks verdi 1000 timer.
crafting-speed-affects-progression=[color=green]Aktivert:[/color] Håndverkshastighet og produktivitet øker antall opptjente produksjonstimer. Hastighet 4 med 50 % produktivitet opptjener seks ganger så mye som hastighet 1 uten produktivitetsbonus.\n\n[color=red]Deaktivert:[/color] Håndverkshastighet påvirker ikke fremgang.
percentage-chance-of-change=Sjanse for at et oppgraderingsforsøk lykkes.
quality-increase-cost=Økning i antall nødvendige produksjonstimer per kvalitetsnivå. Økningen er sammensatt; 0 % holder kravet likt på alle nivåer.\n\nVed 50 % blir et krav på 3 timer til 4,5 timer for uvanlig og 6,75 timer for sjelden.
quality-chance-accumulation-rate=Øk oppgraderingssjansen etter et mislykket forsøk med en prosentandel av basissjansen.\n\n[color=white]Ingen:[/color] Sjansen forblir konstant.\n[color=white]Lav:[/color] Legg til 20 % av basissjansen.\n[color=white]Medium:[/color] Legg til 50 % av basissjansen.\n[color=white]Høy:[/color] Legg til 100 % av basissjansen.\n\nMed 1 % basissjanse gir Lav 1 % → 1,2 % → 1,4 %... og Høy gir 1 % → 2 % → 3 %...
secondary-progression-rate=Progresjonshastighet for enheter som ikke kan måle sitt eget arbeid, som innsettere, strømstolper og fyrtårn.\n\n100 % tilsvarer gjennomsnittet av produksjonstimer opptjent av primære enheter på samme overflate. Høyere verdier gir raskere fremgang; 0 % setter den på pause.
change-modules-with-entity=[color=white]Deaktivert:[/color] Moduler oppgraderes ikke.\n\n[color=white]Aktivert:[/color] Moduler oppgraderes ett nivå når maskinen oppgraderes, opptil maskinens kvalitet.\n\n[color=white]Ekstra aktivert:[/color] Moduler oppgraderes til maskinens nye kvalitet.\n\n[color=white]Uavhengig:[/color] Moduler opptjener egne oppgraderingsforsøk fra sekundær progresjon og kan overskride maskinens kvalitetsgrense. Hvis maskinens grense settes til Normal, deaktiveres også moduloppgraderinger.
batch-entities-per-tick=Enheter som behandles per gruppe. Større grupper behandler oppgraderinger raskere, men kan føre til lagg. Modulplasser teller også i Uavhengig-modus.
batch-ticks-between-processing=Ticks mellom behandling av grupper. Kortere intervaller behandler oppgraderinger oftere, men kan redusere ytelsen.
quality-change-aggregate-alerts-enabled=Vis en oppsummering av oppgraderinger hvert femte minutt.
quality-change-entity-alerts-enabled=Vis varselikoner på kartet der oppgraderinger skjer.
quality-change-chat-enabled=Vis oppgraderingsmeldinger med enhets- eller modulikoner, kvalitetsikoner og bokstaver i tilfeldige regnbuefarger.
quality-change-gps-enabled=Vis en klikkbar posisjonslenke og utløs Factorios GPS-kartping for hver oppgradering. Klikk på lenken for å gå tilbake til stedet. Legger lenken til i fargerike oppgraderingsmeldinger når disse er aktivert; ellers vises bare lenken. Det innebygde GPS-pinget krever en chatlenke.
quality-change-floating-text-enabled=Vis oppgraderingstekst som stiger i den nye kvalitetens farge.
quality-change-halo-enabled=Vis en voksende glorie i den nye kvalitetens farge der oppgraderinger skjer.
quality-change-rainbow-enabled=Vis voksende regnbueringer der oppgraderinger skjer.
quality-change-badge-enabled=Vis den nye kvalitetens ikon mens det vokser og stiger i 4,5 sekunder, og roterer kontinuerlig mens det tones ut.
quality-change-bubbles-enabled=Slipp ut en strøm av små ikoner for den nye kvaliteten som stiger som bobler der oppgraderinger skjer.
quality-change-sound-enabled=Spill den valgte lyden for oppgraderinger på overflaten du ser på, også i fjernvisning.
quality-change-sound=Velg en varslingseffekt, høyttaleralarm, trommelyd eller et musikkinstrument. Instrumenter bruker Oppgradering: instrumentnote / grunntone og Oppgradering: noteatferd. Spilles bare når oppgraderingslyd er aktivert, for oppgraderinger på overflaten du ser på.
quality-change-sound-note=Fast note eller grunntonen (toneart og startregister) for musikalske mønstre. Ignoreres for alarmer, trommer, effekter og modusen Helt tilfeldig.\nNotene stiger i halvtoner fra F: 1=F, 3=G, 5=A, 7=B, 8=C, 10=D, 12=E; legg til 12 for neste oktav. Standard: 20 (C).\nPiano har 48 noter; andre instrumenter har 36. Fast note begrenses til den høyeste tilgjengelige noten. Musikalske mønstre flyttes ned med hele oktaver ved behov, slik at tonearten bevares. De samme innstillingene gir tilsvarende mønstre i hvert instruments eget register.
quality-change-sound-mode=Én note per hørbare oppgradering, med et eget mønster for hver spiller. Fast note beholder den valgte noten; Musikalsk vandring flytter seg ett eller to skalatrinn; Vindspill velger tilfeldige noter fra pentatonisk dur; Trapp går gjentatte ganger opp og ned; Tilfeldig i skala velger en vilkårlig note i valgt skala og toneomfang; Helt tilfeldig bruker hele instrumentets toneomfang.\nMusikalsk vandring og Trapp begynner på grunntonen og fortsetter etter stille perioder og lagring/innlasting. Ingen forsinkede noter legges i kø. Påvirker bare musikkinstrumenter.
quality-change-sound-scale=Skala relativt til Oppgradering: instrumentnote / grunntone, brukt av Musikalsk vandring, Trapp og Tilfeldig i skala. Kromatisk tillater alle halvtoner. Vindspill bruker alltid pentatonisk dur; Fast note og Helt tilfeldig ignorerer denne innstillingen.
quality-change-sound-range=Én eller to oktaver fra grunntonen, flyttet ned med hele oktaver ved behov for å passe instrumentet; eller hele instrumentets toneomfang. Gjelder Musikalsk vandring, Vindspill, Trapp og Tilfeldig i skala. Fast note og Helt tilfeldig ignorerer denne innstillingen.
quality_control_skip_hidden_qualities=Hopp over skjulte kvaliteter (f.eks. skinnende varianter) ved oppgradering. Denne innstillingen gjelder kun når du har en mod som Shiny Mechanics installert.
quality_control_hidden_qualities_sticky==Enheter med skjulte kvaliteter (f.eks. skinnende) oppgraderes ikke videre, slik at deres unike fordeler bevares. Denne innstillingen gjelder kun når du har en mod som Shiny Mechanics installert.
enable-accumulators=Aktiver oppgraderinger for akkumulatorer.
enable-agricultural-towers=Aktiver oppgraderinger for landbrukstårn.
enable-assembly-machines=Aktiver oppgraderinger for monteringsmaskiner.
enable-asteroid-collectors=Aktiver oppgraderinger for asteroidesamlere.
asteroid-collector-growth-level-limit=Begrenser asteroidesamleres kvalitetsvekst til vanlige verdier for å forhindre spillbryteri.\n\nAsteroidesamlere med moddede kvalitetsnivåer kan ha for mange armer som beveger seg for raskt, og blir ute av stand til å gripe asteroideblokker, noe som forårsaker stor UPS-belastning.\n\n[color=green]Standard: legendarisk[/color]
enable-beacons=Aktiver oppgraderinger for fyrtårn.
enable-boilers=Aktiver oppgraderinger for kjeler.
enable-combinators-and-speakers=Aktiver oppgraderinger for kombinatorer og programmerbare høyttalere.
enable-pumps=Aktiver oppgraderinger for kystpumper og væskepumper.
enable-furnaces=Aktiver oppgraderinger for smelteovner.
enable-generators=Aktiver oppgraderinger for dampmotorer, dampturbiner og fusjonsgeneratorer.
enable-heat-pipes=Aktiver oppgraderinger for varmerør.
enable-inserters=Aktiver oppgraderinger for innsettere.
enable-labs=Aktiver oppgraderinger for forskningslaboratorier.
enable-lamps=Aktiver oppgraderinger for lamper.
enable-lightning-rods=Aktiver oppgraderinger for lynledere.
enable-mining-drills=Aktiver oppgraderinger for gruvebor.
enable-poles=Aktiver oppgraderinger for strømstolper og transformatorstasjoner.
enable-power-switches=Aktiver oppgraderinger for strømbrytere.
enable-radar=Aktiver oppgraderinger for radarstasjoner.
radar-growth-level-limit=Begrenser radarkvalitetsvekst for å forhindre overdreven kartutforskning og lagringsfil-oppblåsing.\n\nRadarer med svært høye kvalitetsnivåer kan forårsake store lagringsfiler (1200mb+) på grunn av overdreven kartutforskning.\n\n[color=green]Standard: legendarisk[/color]
lightning-attractor-growth-level-limit=Begrenser lynattraktorers kvalitetsvekst for å forhindre ytelsesproblemer.\n\nLynattraktorer med svært høye kvalitetsnivåer har betydelig økt dekningsområde, noe som kan forårsake lagg-topper om natten på Fulgora.\n\n[color=green]Standard: legendarisk[/color]
enable-reactors=Aktiver oppgraderinger for kjernereaktorer og fusjonsreaktorer.
enable-rocket-silos=Aktiver oppgraderinger for rakettsiloer.
enable-roboports=Aktiver oppgraderinger for roboporter.
enable-solar-panels=Aktiver oppgraderinger for solcellepaneler.
enable-thrusters=Aktiver oppgraderinger for romfremdrift. Raskere skip kan overvelde forsvaret sitt.
thruster-growth-level-limit=Begrens romfremdrift valgfritt til spillets vanlige nivåer. Moddede kvalitetsnivåer kan få romskip til å bevege seg betydelig raskere, noe som kan overvelde forsvaret deres.
enable-turrets=Aktiver oppgraderinger for ammunisjonstårn, lasertårn, flammekastertårn og artilleritårn. Tårn opptjener «produksjonstimer» ved å påføre skade.
turret-damage-per-manufacturing-hour=Mengden skade et tårn må påføre for å opptjene én produksjonstime.\n\nStandard: 36 000 skade (basert på et tårn på grunnnivå som skyter panserbrytende ammunisjon kontinuerlig i én time).
turrets-contribute-credits=La tårn bidra til oppgraderinger av sekundære enheter, som innsettere og strømstolper, på samme overflate. Dette kan gjøre oppgraderinger mye raskere sent i spillet med skinnekanoner og lyntårn.
enable-defense-walls-and-gates=Aktiver oppgraderinger for murer og porter.
custom-upgrade-limit-a=Maksimalt kvalitetsnivå som brukes av «Egendefinert A» i grensene nedenfor. Kun nødvendig når en mod legger til kvalitetsnivåer utover legendarisk, og du vil begrense nivået en enhet kan oppgraderes til. Du kan for eksempel la asteroidesamlere nå nivå 10. Angi maksnivået her, gå deretter ned til enheten du vil begrense og velg «Egendefinert A» i nedtrekksmenyen. Legendarisk er nivå 5.
custom-upgrade-limit-b=Maksimalt kvalitetsnivå som brukes av Egendefinert B i innstillingene for oppgraderingsgrenser.
custom-upgrade-limit-c=Maksimalt kvalitetsnivå som brukes av Egendefinert C i innstillingene for oppgraderingsgrenser.
upgrade-limit-accumulators=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-agricultural-towers=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-assembly-machines=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-beacons=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-boilers=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-combinators-and-speakers=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.\n\nInkluderer: aritmetiske kombinatorer, avgjørelseskombinatorer, konstante kombinatorer, programmerbare høyttalere.
upgrade-limit-defense-walls-and-gates=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-furnaces=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-generators=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.\n\nInkluderer: dampmotorer, dampturbiner, fusjonsgeneratorer.
upgrade-limit-heat-pipes=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-inserters=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-labs=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-lamps=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-mining-drills=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-poles=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.\n\nInkluderer strømstolper og transformatorstasjoner.
upgrade-limit-power-switches=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-pumps=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.\n\nInkluderer: kystpumper og væskepumper.
upgrade-limit-reactors=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.\n\nInkluderer: kjernereaktorer, fusjonsreaktorer.
upgrade-limit-rocket-silos=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-roboports=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-solar-panels=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.
upgrade-limit-turrets=Maksimal oppgraderingskvalitet for disse enhetene. Normal deaktiverer oppgraderinger; Egendefinert A/B/C bruker nivået angitt ovenfor.\n\nInkluderer: ammunisjonstårn, lasertårn, flammekastere, artilleritårn.
upgrade-limit-asteroid-collectors=Begrens asteroidesamlere til legendarisk for å forhindre alvorlige spillproblemer. Moddede nivåer kan gi for mange armer som beveger seg for raskt til å gripe asteroideblokker, og forårsake stor UPS-belastning.
upgrade-limit-radar=Begrens radarer til legendarisk for å forhindre at lagringsfilene blir for store. Moddede kvaliteter kan føre til overdreven kartutforskning og svært store filer (over én gigabyte).
upgrade-limit-lightning-rods=Begrens lynattraktorer til legendarisk for å forhindre UPS-topper. Lynattraktorer med moddede kvalitetsnivåer har betydelig større dekningsområder, noe som kan forårsake lagg-topper om natten på Fulgora.
upgrade-limit-thrusters=Begrens romfremdrift til legendarisk for å forhindre uventet skade på romplattformer. Moddede kvalitetsnivåer kan få romskip til å bevege seg betydelig raskere, noe som kan overvelde forsvaret deres.

