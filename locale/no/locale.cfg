[mod-setting-description]
manufacturing-hours-for-change=Antall produksjonstimer som kreves før en kvalitetsendring blir forsøkt.\nProduksjonstimer akkumuleres kun når maskinen aktivt arbeider. Hvis den står inaktiv, vil den ikke gjøre fremgang.\nMin verdi 0,001 timer (3,6 sekunder), Maks verdi 1000 timer.
crafting-speed-affects-progression=Kontrollerer om en maskins håndverkshastighet påvirker hvor raskt den opptjener produksjonstimer.\n\n[color=green]Aktivert (standard):[/color] Maskiner med høyere håndverkshastighet vil gjøre raskere fremgang. Produksjonstimer opptjenes basert på maskinens håndverkshastighet og produktivitet. Et støperi med hastighet 4 og 50 % produktivitet vil gjøre fremgang seks ganger raskere enn en sammenstillingsmaskin 2 med håndverkshastighet 1.\n\n[color=red]Deaktivert:[/color] Håndverkshastighet har ingen innvirkning på fremgang. En time brukt på aktivt håndverk teller som én produksjonstime, uansett håndverkshastighet. Dette fjerner den forsterkende effekten der hver kvalitetsoppgradering gjør den neste raskere.
percentage-chance-of-change=Prosentvis sjanse for at en kvalitetsendring vil lykkes.\nMin verdi 0,0001%, Maks verdi 100% (endrer alltid etter at tiden er passert)
quality-increase-cost=Dette øker tiden mellom endringsforsøk per kvalitetsnivå. Dette er en sammensatt formel. Innstilling til 0% holder tiden mellom forsøk den samme uansett kvalitetsnivå\n\n[color=green]Eksempel med 3 produksjonstimer nødvendig ved 50% kostnad per nivå[/color]\n\nNormal: 3 timer\nUvanlig: 4,5 timer\nSjelden: 6,8 timer\nEpisk: 10,1 timer\nLegendarisk: 15,2 timer\nModdet kvalitetsnivå 10: 173 timer
quality-chance-accumulation-rate=Kontrollerer hvor mye sjansen øker etter hvert mislykkede forsøk.\n\n[color=white]Ingen (Standard):[/color] Ingen akkumulering - sjansen forblir konstant.\n\n[color=white]Lav (20%):[/color] Sjansen øker med 20% av basishastigheten for hver feil.\n\n[color=white]Medium (50%):[/color] Sjansen øker med 50% av basishastigheten for hver feil.\n\n[color=white]Høy (100%):[/color] Sjansen øker med 100% av basishastigheten for hver feil.\n\n[color=yellow]Eksempel med 1% basissjanse:[/color]\n\n[color=white]Lav:[/color] 1,0% → 1,2% → 1,4% → 1,6%...\n[color=white]Høy:[/color] 1,0% → 2,0% → 3,0% → 4,0%...\n\nAlle akkumuleringsinnstillinger garanterer til slutt kvalitetsendringer - høyere innstillinger når bare 100% sjanse raskere
secondary-progression-rate=Hvor raskt sekundære enheter (gripearmer, stolper, fyrtårn - alt som ikke kan måle sitt eget arbeid) utvikler seg, som en prosentandel av det den gjennomsnittlige primære enheten på samme overflate oppnår.\n\n[color=green]100 % (standard):[/color] Sekundære enheter utvikler seg i samme tempo som den gjennomsnittlige monteringsmaskinen, ovnen, siloen eller tårnet rundt dem.\n\nSett til 0 % for å stoppe sekundær progresjon helt; verdier over 100 % akselererer infrastrukturoppgraderinger utover tempoet til produksjonsmaskinene.\n\nKan endres midt i spillet uten omstart.
change-modules-with-entity=Dette kontrollerer om moduler i maskiner påvirkes av kvalitetsendringer.\n\n[color=white]Deaktivert (Standard):[/color] Moduler påvirkes ikke når kvaliteten til vertsmaskinen endres.\n\n[color=white]Aktivert:[/color] Moduler endrer kvalitet med ett nivå når deres vert endres. De vil ikke overskride vertens kvalitetsnivå.\n\n[color=white]Ekstra aktivert:[/color] Som Aktivert, men moduler vil bli oppdatert matchet til deres vertsmaskins kvalitet når en kvalitetsendring skjer.
batch-entities-per-tick=Antall enheter å behandle hver tick for å unngå ytelsestopper.\nMin verdi 1, Maks verdi 1000.\nHøyere verdier kan forårsake lagg-topper men behandler enheter raskere.
batch-ticks-between-processing=Antall ticks å vente mellom batch-behandlingssykluser.\nMin verdi 1 tick, Maks verdi 6000 ticks (~2,5 minutter).\nLavere verdier behandler oftere men kan påvirke ytelsen.
quality-change-aggregate-alerts-enabled=Vis konsollmeldinger som oppsummerer alle kvalitetsendringer (vises en gang hver 5. minutt). Eksempel: "3 monteringsmaskiner oppgradert, 2 innsettere oppgradert"
quality-change-entity-alerts-enabled=Vis kart ping-varsler på individuelle enheter når deres kvalitet endres. Klikk varselet for å se den oppgraderte enheten.
quality_control_skip_hidden_qualities=Kvalitetskontroll vil hoppe over skjulte kvaliteter (f.eks. skinnende varianter) ved oppgradering. Enheter vil aldri bli skinnende gjennom Kvalitetskontroll - spillere må skaffe dem på normal måte. Denne innstillingen gjelder kun når du har Shiny Mechanics-kvalitetsmoden installert.
quality_control_hidden_qualities_sticky=Enheter med skjulte kvaliteter (f.eks. skinnende) vil ikke oppgradere videre, og bevarer deres unike fordeler. Denne innstillingen gjelder kun når du har Shiny Mechanics-kvalitetsmoden installert.
enable-accumulators=Aktiver kvalitetsendringer for akkumulatorer.
enable-agricultural-towers=Aktiver kvalitetsendringer for landbrukstårn.
enable-assembly-machines=Aktiver kvalitetsendringer for monteringsmaskiner.
enable-asteroid-collectors=Aktiver kvalitetsendringer for asteroidsamlere.
asteroid-collector-growth-level-limit=Begrenser asteroidesamleres kvalitetsvekst til vanlige verdier for å forhindre spillbryteri.\n\nAsteroidesamlere med moddede kvalitetsnivåer kan ha for mange armer som beveger seg for raskt, og blir ute av stand til å gripe asteroideblokker, noe som forårsaker stor UPS-belastning.\n\n[color=green]Standard: legendarisk[/color]
enable-beacons=Aktiver kvalitetsendringer for fyrtårn.
enable-boilers=Aktiver kvalitetsendringer for kjeler.
enable-combinators-and-speakers=Aktiver kvalitetsendringer for kombinatorer og høyttalere.\n\nInkluderer: aritmetiske kombinatorer, beslutningskombinatorere, konstante kombinatorer, programmerbare høyttalere.
enable-pumps=Aktiver kvalitetsendringer for pumper (inkluderer kystpumper og væskepumper).
enable-furnaces=Aktiver kvalitetsendringer for smelteovner.
enable-generators=Aktiver kvalitetsendringer for generatorer (dampmotorer, dampturbiner, fusjonsgeneratorer).
enable-heat-pipes=Aktiver kvalitetsendringer for varmerør.
enable-inserters=Aktiver kvalitetsendringer for innsettere.
enable-labs=Aktiver kvalitetsendringer for forskningslaboratorier.
enable-lamps=Aktiver kvalitetsendringer for lamper.
enable-lightning-rods=Aktiver kvalitetsendringer for lynledere.
enable-mining-drills=Aktiver kvalitetsendringer for alle gruvebor.
enable-poles=Aktiver kvalitetsendringer for alle strømstolper (inkluderer store strømstolper og transformatorstasjoner).
enable-power-switches=Aktiver kvalitetsendringer for strømbrytere.
enable-radar=Aktiver kvalitetsendringer for radarstasjoner.
radar-growth-level-limit=Begrenser radarkvalitetsvekst for å forhindre overdreven kartutforskning og lagringsfil-oppblåsing.\n\nRadarer med svært høye kvalitetsnivåer kan forårsake store lagringsfiler (1200mb+) på grunn av overdreven kartutforskning.\n\n[color=green]Standard: legendarisk[/color]
lightning-attractor-growth-level-limit=Begrenser lynattraktorers kvalitetsvekst for å forhindre ytelsesproblemer.\n\nLynattraktorer med svært høye kvalitetsnivåer har betydelig økt dekningsområde, noe som kan forårsake lagg-topper om natten på Fulgora.\n\n[color=green]Standard: legendarisk[/color]
enable-reactors=Aktiver kvalitetsendringer for reaktorer (kjernereaktorer, fusjonsreaktorer).
enable-rocket-silos=Aktiver kvalitetsendringer for rakettsiloer.
enable-roboports=Aktiver kvalitetsendringer for roboporter.
enable-solar-panels=Aktiver kvalitetsendringer for solcellepaneler.
enable-thrusters=Aktiver kvalitetsendringer for romfremdrift. Deaktivert som standard fordi uventet endring av et romskips hastighet kan føre til at forsvar blir overveldet.
thruster-growth-level-limit=Begrenser romfremdriftens kvalitetsvekst til vanlige nivåer for å forhindre forsvarsproblemer.\n\nModdede kvalitetsnivåer kan flytte romskip betydelig raskere, noe som kan overvelde forsvarene deres.\n\n[color=green]Standard: legendarisk[/color]
enable-turrets=Aktiver kvalitetsendringer for tårn.\n\nTårn er primære enheter som genererer oppgraderingskreditter basert på kumulativ skade påført.\n\nInkluderer: ammunisjonstårn, lasertårn, flammekastere, artilleritårn.
turret-damage-per-manufacturing-hour=Mengden skade et tårn må påføre for å tilsvare én produksjonstime.\n\nStandard: 36 000 skade (avledet fra panserpiercing-runder: 450 magasiner/time × 80 skade/magasin).\n\nLavere verdier gjør at tårn genererer kreditter raskere. Høyere verdier bremser kreditgenerering.
turrets-contribute-credits=Bestemmer om oppgraderingspoeng opptjent av tårn også går til den delte poolen som oppgraderer sekundære enheter (innsettere, kraftmaster, osv.).\n\n[color=red]Deaktivert (standard):[/color] Tårnpoeng blir hos tårnet. Kampskade hjelper bare tårn med å oppgradere seg selv.\n\n[color=green]Aktivert:[/color] Tårnpoeng flyter også til den delte poolen, slik at kampskade fremmer sekundære enheter på samme måte som produksjon gjør.
enable-defense-walls-and-gates=Aktiver kvalitetsendringer for vegger og porter.\n\nInkluderer: vegger, porter.
custom-upgrade-limit-a=Bruk dette til å angi egendefinerte grenser for moddede kvaliteter for enheter. Kun nødvendig når du har en mod som legger til kvalitetsnivåer utover legendarisk, og du vil begrense hvor mye en enhet skal oppgraderes. For å bruke denne funksjonen, angi maksnivået her, gå deretter ned til enheten du vil begrense og velg 'Egendefinert A' i nedtrekksmenyen. Som referanse er legendarisk nivå 5 (normal = 1, uvanlig = 2, sjelden = 3, episk = 4, legendarisk = 5...).
custom-upgrade-limit-b=Bruk dette til å angi egendefinerte grenser for moddede kvaliteter for enheter. Kun nødvendig når du har en mod som legger til kvalitetsnivåer utover legendarisk, og du vil begrense hvor mye en enhet skal oppgraderes. For å bruke denne funksjonen, angi maksnivået her, gå deretter ned til enheten du vil begrense og velg 'Egendefinert B' i nedtrekksmenyen. Som referanse er legendarisk nivå 5 (normal = 1, uvanlig = 2, sjelden = 3, episk = 4, legendarisk = 5...).
custom-upgrade-limit-c=Bruk dette til å angi egendefinerte grenser for moddede kvaliteter for enheter. Kun nødvendig når du har en mod som legger til kvalitetsnivåer utover legendarisk, og du vil begrense hvor mye en enhet skal oppgraderes. For å bruke denne funksjonen, angi maksnivået her, gå deretter ned til enheten du vil begrense og velg 'Egendefinert C' i nedtrekksmenyen. Som referanse er legendarisk nivå 5 (normal = 1, uvanlig = 2, sjelden = 3, episk = 4, legendarisk = 5...).
upgrade-limit-accumulators=Kvalitetskontroll vil oppgradere disse enhetene opp til denne kvaliteten, og deretter slutte å forsøke videre oppgraderinger. Sett denne til Normal for å forhindre oppgraderingsforsøk. De egendefinerte verdiene bruker innstillingene Egendefinert oppgraderingsgrense A/B/C.
upgrade-limit-agricultural-towers=Kvalitetskontroll vil oppgradere disse enhetene opp til denne kvaliteten, og deretter slutte å forsøke videre oppgraderinger. Sett denne til Normal for å forhindre oppgraderingsforsøk. De egendefinerte verdiene bruker innstillingene Egendefinert oppgraderingsgrense A/B/C.
upgrade-limit-assembly-machines=Kvalitetskontroll vil oppgradere disse enhetene opp til denne kvaliteten, og deretter slutte å forsøke videre oppgraderinger. Sett denne til Normal for å forhindre oppgraderingsforsøk. De egendefinerte verdiene bruker innstillingene Egendefinert oppgraderingsgrense A/B/C.
